      html: '<p>The <em>infra-structure</em> is the material base of a civilisation – the first of the four structures of <a href="#the-emergence-model">the emergence model</a>, where it is called infrastructure: its modes of production, energy, agriculture, water, transport, building and waste systems. It conditions behaviour by determining what is physically possible, cheap or easy, and so what patterns of life are rewarded; a civilisation built on extraction and disposal will predispose extractive, disposable habits whatever its values.</p><p>Redesigning it – towards closed loops, renewable energy and regenerative agriculture – changes the ground on which every other structure stands. See <a href="#infra-structure-global-redesign-institute">the Global Redesign Institute</a>.</p>'
    },
    {
      id: 'inter-structure',
      title: 'Interstructure: Political Economy',
      parent: 'the-emergence-model',
      order: 2,
      html: '<p>The <em>inter-structure</em> is the structure of relations between people – what <a href="#the-emergence-model">the emergence model</a> calls social structure: economics, governance and law. It conditions behaviour through incentives, rules and the distribution of power, deciding which actions are rewarded, permitted or punished. Where it rewards externalising harm and winning at others’ expense, even well-meaning people are pushed towards <a href="#race-to-the-bottom">races to the bottom</a>; redesigning it aims to align individual incentive with collective wellbeing. See <a href="#inter-structure-democracy-3">Democracy 3.0</a>.</p>'
    },
    {
      id: 'super-structure',
      title: 'Superstructure: Cultural Psychology',
      parent: 'the-emergence-model',
      order: 3,
      html: '<p>The <em>super-structure</em> is the structure of meaning that sits above the material and social orders – what <a href="#the-emergence-model">the emergence model</a> calls memetic structure: a culture’s values, beliefs, worldview, identities, orienting narratives and definitions of success. It conditions behaviour from the inside, shaping what people want, admire and consider normal, and it both reflects and legitimates the other structures. A new civilisation needs a super-structure that makes sense of it and makes it worth wanting. See <a href="#coherence-of-civilisations">the coherence of civilisations</a>.</p>'
    },
    {
      id: 'sub-structure',
      title: 'Substructure: Evolutionary Psychology',
      parent: 'the-emergence-model',
      order: 4,
      html: '<p>The <em>sub-structure</em> is the evolved human nature on which every other structure of a civilisation rests: the psychology that natural selection built into the people who make it up – their drives for status, belonging and security, their in-group loyalties, their responses to threat and reward. It joins <a href="#evolutionary-biology">evolutionary biology</a>, the nature we inherit, to <a href="#psychology">psychology</a>, how that nature becomes thought, feeling and behaviour in a particular environment; the body’s present condition – nutrition, hormones, toxicity – is filed separately as the <a href="#biostructure">biostructure</a>.</p><p>The sub-structure conditions everything above it, because every economy, institution and culture has to be run by human animals with human needs, drives and limits. Civilisation design cannot rewrite it, but it can work with it rather than against it – building environments that fit our evolved needs instead of exploiting them, and so closing the gap described by <a href="#socio-economic-evolutionary-mismatch">socio-economic evolutionary mismatch</a>. See also <a href="#biowisdom">biowisdom</a>.</p>'
    },
    {
      id: 'evolutionary-biology',
      title: 'Evolutionary Biology',
      parent: 'sub-structure',
      order: 1,
      html: '<p><em>Evolutionary biology</em> studies how living things came to be as they are through natural selection, sexual selection, drift and inheritance. For civilisation it is the deepest layer of the <a href="#sub-structure">sub-structure</a>: humans are evolved primates, shaped over hundreds of thousands of years for life in small, mobile, face-to-face groups. That inheritance equips us with capacities for cooperation, fairness, language and culture – and with drives for status, in-group loyalty, short-term reward and competition over resources that served our ancestors but can turn destructive at global scale and with modern technology.</p><p>Because selection acts on groups as well as individuals (<a href="#multilevel-selection">multilevel selection</a>), our evolved nature holds both competitive drives and a deep capacity for cooperation. An evolutionary view of human nature asks which environments and institutions bring out the second rather than the first. See also <a href="#evolutionary-theory">evolutionary theory</a>.</p>'
    },
    {
      id: 'psychology',
      title: 'Psychology',
      parent: 'sub-structure',
      order: 2,
      html: '<p><em>Psychology</em> is the study of mind and behaviour: perception, cognition, emotion, motivation, personality and development, and the bodily systems – nervous, hormonal, nutritional – that underpin them. As a layer of the <a href="#sub-structure">sub-structure</a>, it is where evolved nature meets a particular environment and becomes a person: the same inherited capacities can grow into secure or anxious, curious or closed, cooperative or hostile minds depending on upbringing, relationships, health and culture.</p><p>Its findings – on attachment, development, cognitive bias and wellbeing – are among the best-tested accounts of what helps people to flourish, and of how much of a person is made rather than born. Chronic stress, trauma, poor health and attention-harvesting technologies degrade exactly the capacities – attention, empathy, impulse control, long-term thinking, openness to evidence – that complex societies depend on, while cognitive biases such as <a href="#confirmation-bias">confirmation bias</a> shape how whole populations make sense of the world. See also <a href="#cultural-psychology">cultural psychology</a>.</p>'
    },
    {
      id: 'inter-structure-democracy-3',
      title: 'Democracy 3.0',
      parent: 'inter-structure',
      html: '<p><em>Democracy 3.0</em> names a next generation of democratic governance – after the direct democracy of antiquity and the representative democracy of the modern nation-state – using digital tools, deliberative processes and <a href="#collective-intelligence">collective intelligence</a> to enable participation and coordination at scales and speeds that current institutions cannot. It is a design for the <a href="#inter-structure">inter-structure</a>: the economic, political and legal relations through which people make shared choices.</p>'
    },
    {
      id: 'infra-structure-global-redesign-institute',
      title: 'Global Redesign Institute',
      parent: 'infra-structure',
      ref: 'Zeitgeist Movement; Peter Joseph',
      html: '<p>The <em>Global Redesign Institute</em> is a proposal from Peter Joseph and The Zeitgeist Movement for an open, collaborative institution – and digital platform – devoted to redesigning the world’s physical and technical infrastructure from first principles: energy, production, distribution, transport and housing, planned according to scientific and ecological constraints and the needs of all people rather than market demand alone. It is a design for the <a href="#infra-structure">infra-structure</a>, the material base on which the other structures of a civilisation rest.</p>'
    },
    {
      id: 'capitalist-theodicy',
      title: 'The Capitalist Best of All Possible World-Systems Theodicy',
      coined: true,
      parent: 'civilisation-design',
      ref: 'Leibniz; Voltaire',
      html: '<p>The <em>capitalist best of all possible world-systems theodicy</em> satirises the belief that the present economic order, whatever its evils, is the best achievable. It echoes Leibniz’s claim that ours is the best of all possible worlds, mocked by Voltaire through Dr Pangloss in <em>Candide</em> (1759), and names the justifications that make the suffering of the present seem necessary.</p>'
    },
    {
      id: 'tyranny-of-the-cosmic-majority',
      title: 'Tyranny of the Cosmic Majority',
      coined: true,
      parent: 'moral-theory',
      ref: 'Tocqueville, Mill (tyranny of the majority)',
      html: '<p>The <em>tyranny of the cosmic majority</em> extends the “tyranny of the majority” described by Tocqueville and Mill to cosmic and long-run scales. If the interests of vast numbers of future or potential beings dominate moral reasoning, present people – or any minority of minds – may be sacrificed to the calculated interests of an overwhelming majority that does not yet exist.</p>'
    },
    {
      id: 'tyranny-of-the-multiplicity',
      title: 'Tyranny of the Multiplicity/Tolerance',
      coined: true,
      parent: 'moral-theory',
      ref: 'Popper (paradox of tolerance)',
      html: '<p>The <em>tyranny of the multiplicity</em>, or of tolerance, is the danger that unlimited pluralism and tolerance leave a society unable to act on any shared values at all – or unable to defend itself against the intolerant, as Karl Popper’s paradox of tolerance warns. Its counterpart is the tyranny of any single vision imposed on all.</p>'
    },
    {
      id: 'the-sociological-post-mortem',
      title: 'The Sociological Post-Mortem',
      coined: true,
      parent: 'moral-theory',
      html: '<p>The <em>sociological post-mortem</em> is the exercise of imagining a civilisation’s failure after the fact and asking what caused it – which institutions failed, which warnings were ignored, which incentives made the outcome likely. Performed in advance, it turns hindsight into foresight, identifying what must change before the post-mortem becomes real.</p>'
    },
    {
      id: 'epistemic-principal-agent-problem',
      title: 'The Epistemic Principal-Agent Problem',
      coined: true,
      parent: 'moral-theory',
      html: '<p>The <em>epistemic principal-agent problem</em> arises when those who produce and interpret knowledge on society’s behalf – experts, media, institutions, algorithms – have incentives that diverge from the public’s interest in the truth. As with any principal-agent problem, the public cannot fully monitor its agents, and the knowledge it receives is shaped by their interests.</p>'
    },
    {
      id: 'epistemic-semi-anarchic-default-condition',
      title: 'The Epistemic Semi-Anarchic Default Condition',
      coined: true,
      parent: 'moral-theory',
      ref: 'Bostrom (Vulnerable World Hypothesis)',
      html: '<p>The <em>epistemic semi-anarchic default condition</em> applies Nick Bostrom’s “semi-anarchic default condition” – a world with limited capacity for preventive policing and global governance – to knowledge. Without institutions able to coordinate what a society collectively knows and believes, its information environment defaults to a semi-anarchic state in which misinformation and manipulation go largely unchecked.</p>'
    },
    {
      id: 'metatheory',
      title: 'Metatheory',
      parent: 'theproject',
      kind: 'category',
      order: 7,
      html: '<p><em>Metatheory</em> is theory about theories: the study of the frameworks, assumptions and methods through which the world is understood, and of how different theories relate, conflict and might be integrated. It gathers the sciences of systems, evolution and strategy, the critical tradition, theories of technology and the study of replicators on which the rest of the map draws.</p>'
    },
    {
      id: 'macrohistory',
      title: 'Macrohistory',
      parent: 'theproject',
      kind: 'category',
      order: 8,
      html: '<p><em>Macrohistory</em> is the study of history at the largest scales – the long-run patterns, stages and trajectories of civilisations, and the forces that drive them. It asks whether history has a direction, how civilisations rise and fall, and where the present sits within the arc of human and planetary history.</p>'
    },
    {
      id: 'macrosociology',
      title: 'Macrosociology',
      parent: 'theproject',
      kind: 'category',
      order: 9,
      html: '<p><em>Macrosociology</em> studies societies as wholes – their structures of power, institutions, cultures and systems of meaning – and how these shape and are shaped by the people within them. It examines how power is exercised and legitimated, and how a civilisation’s culture enables, or prevents, it from understanding itself.</p>'
    },
    {
      id: 'geodesign',
      title: 'Geodesign',
      parent: 'civilisation-design',
      ref: 'Bratton',
      refs: ['Benjamin H. Bratton, <em>The Stack: On Software and Sovereignty</em> (2015).'],
      html: '<p><em>Geodesign</em> is design at the scale of the planet: the deliberate shaping of the geographic, infrastructural and computational systems through which the Earth is inhabited and governed. The term began in landscape planning and geographic information systems, for design informed by spatial data; Benjamin Bratton widens it, in <em>The Stack</em> (2015), into a design discipline for planetary-scale computation – the layered megastructure of earth, cloud, city, address, interface and user that now cuts across the territories of states.</p><p>For Bratton the question is no longer whether the planet is designed but how well: its energy, logistics and sensing systems already form an accidental architecture, and geodesign is the attempt to make that architecture deliberate, accountable and fit for the planet it runs on.</p>'
    },
    {
      id: 'institutional-design',
      title: 'Institutional Design',
      parent: 'civilisation-design',
      ref: 'Goodin',
      refs: ['Robert E. Goodin (ed.), <em>The Theory of Institutional Design</em> (1996).'],
      html: '<p><em>Institutional design</em> is the deliberate creation and reform of the rules, organisations and practices that structure collective life – constitutions, electoral systems, markets, courts, bureaucracies. Robert Goodin’s <em>The Theory of Institutional Design</em> (1996) set out its foundations: institutions are shaped by accident, evolution and intention together, and a good design must be robust to the people who will actually run it, revisable as circumstances change, and sensitive to the motives it rewards.</p><p>It asks not only what an institution should achieve but how it will be gamed, how it will age and who will be able to change it.</p>'
    },
    {
      id: 'mechanism-design',
      title: 'Mechanism Design',
      parent: 'civilisation-design',
      ref: 'Hurwicz, Maskin, Myerson',
      html: '<p><em>Mechanism design</em> is the branch of economics and game theory that works backwards from a desired outcome to the rules that will produce it. Where game theory asks how self-interested players will behave under given rules, mechanism design asks which rules – auctions, voting procedures, contracts, matching systems – will lead such players, acting on private information, to bring about a chosen collective result.</p><p>Developed by Leonid Hurwicz, Eric Maskin and Roger Myerson, who shared the 2007 Nobel Memorial Prize in Economic Sciences for it, it treats institutions as engineered incentive systems: the aim is a game whose equilibrium is the outcome wanted, so that no one needs to be trusted to act against their own interest.</p>'
    },
    {
      id: 'behavioural-design',
      title: 'Behavioural Design',
      parent: 'civilisation-design',
      ref: 'Skinner',
      refs: ['B. F. Skinner, <em>Walden Two</em> (1948).', 'B. F. Skinner, <em>Beyond Freedom and Dignity</em> (1971).'],
      html: '<p><em>Behavioural design</em> is the shaping of behaviour by designing the environments and consequences that condition it. Its most radical advocate was B. F. Skinner, who argued that behaviour is governed by its reinforcing consequences, and that a society could therefore be designed – through a deliberate “technology of behaviour” – so that people act well because their surroundings reward it. His novel <em>Walden Two</em> (1948) imagined such a community, and <em>Beyond Freedom and Dignity</em> (1971) argued that ideals of autonomy only hid the conditioning that already shapes us.</p><p>Its descendants range from nudge policy to persuasive technology. The question it leaves open is who designs the designers: the same methods that could cultivate cooperation can be used to manipulate.</p>'
    },
    {
      id: 'social-design',
      title: 'Social Design',
      parent: 'civilisation-design',
      ref: 'Papanek',
      refs: ['Victor Papanek, <em>Design for the Real World: Human Ecology and Social Change</em> (1971).'],
      html: '<p><em>Social design</em> is design directed at social needs and consequences rather than at markets alone. Its founding text is Victor Papanek’s <em>Design for the Real World</em> (1971), which accused industrial design of serving trivial wants and creating waste, and called on designers to take responsibility for the social and ecological effects of their work – designing for the poor, the disabled and the developing world, and for durability over obsolescence.</p><p>It extends design from objects to services, institutions and communities, and asks of any design whom it serves and what it costs.</p>'
    },
    {
      id: 'civilisation-design-space',
      title: 'Civilisation Design Space',
      parent: 'civilisation-x',
      html: '<p>The <em>civilisation design space</em> is the space of all possible civilisations – every combination of political economy, technology, culture and relation to nature that could in principle be built and sustained. Existing and historical societies occupy only a small region of it; most of the space has never been tried.</p><p>Thinking in terms of a design space turns the question “what comes next?” into one of search: mapping which regions are viable, which are stable, which are reachable from where we are, and which would be worth reaching.</p>'
    },
    {
      id: 'utopian-studies',
      title: 'Utopian Studies',
      parent: 'civilisation-x',
      ref: 'Sargent',
      refs: ['Lyman Tower Sargent, “The Three Faces of Utopianism Revisited”, <em>Utopian Studies</em> 5, no. 1 (1994).'],
      html: '<p><em>Utopian studies</em> is the interdisciplinary study of utopias and utopianism: imagined ideal societies, the intentional communities that try to live them, and the social theories that aim at them. Lyman Tower Sargent described utopianism’s “three faces” – utopian literature, communitarian experiments and utopian social theory – and defined it broadly as social dreaming.</p><p>The field treats utopias neither as blueprints nor as fantasies to dismiss, but as evidence of what societies hope for and as instruments for criticising the present.</p>'
    },
    {
      id: 'meta-utopia',
      title: 'Meta-Utopia',
      parent: 'civilisation-x',
      ref: 'Nozick',
      refs: ['Robert Nozick, <em>Anarchy, State, and Utopia</em> (1974), part III, “Utopia”.'],
      html: '<p><em>Meta-utopia</em> is Robert Nozick’s name, in <em>Anarchy, State, and Utopia</em> (1974), for a framework within which many utopias can be tried. Since people differ too much for any single ideal society to be best for all, the best world is not one utopia but a minimal framework in which individuals are free to found, join and leave communities built around their own visions.</p><p>The utopian question shifts from “which society is ideal?” to “which framework lets the most people find or make the society that suits them?”</p>'
    },
    {
      id: 'metastructure',
      title: 'Metastructure: Game-Theoretic & System Dynamics',
      parent: 'the-emergence-model',
      html: '<p>The <em>metastructure</em> is the layer of dynamics that runs through every other structure of a civilisation: the game-theoretic incentives that set actors against or alongside one another, and the system dynamics – feedback loops, delays, stocks and flows – by which their actions add up. It is not a separate thing in the world but the logic of how the other structures behave together.</p><p>Multipolar traps, races to the bottom, tragedies of the commons and runaway growth all live at this level. To redesign a civilisation, the metastructure is where the patterns that keep regenerating its problems have to be changed.</p>'
    },
    {
      id: 'biostructure',
      title: 'Biostructure: Population Physiology',
      parent: 'the-emergence-model',
      html: '<p>The <em>biostructure</em> is the physiological condition of a civilisation’s population: nutrition, neurobiology, hormones, epigenetics, sleep, disease and exposure to toxins, taken across whole populations. It corresponds to what the emergence model calls physiological structure.</p><p>A civilisation’s capacity for clear thinking, cooperation and care depends on the bodies of the people who make it up. Chronic stress, poor diet and pollution degrade those capacities at scale, so the biostructure conditions every structure above it.</p>'
    },
    {
      id: 'first-attractor',
      title: 'The First Attractor: Catastrophe',
      parent: 'attractor-states',
      ref: 'Schmachtenberger',
      html: '<p><em>The first attractor</em> is catastrophe: the trajectory in which uncoordinated actors, wielding ever more powerful technology, race one another into outcomes no one wants – arms races, ecological collapse, cascading systemic failure. It is the default destination of a world whose power grows faster than its capacity to coordinate.</p>'
    },
    {
      id: 'second-attractor',
      title: 'The Second Attractor: Dystopia',
      parent: 'attractor-states',
      ref: 'Schmachtenberger',
      html: '<p><em>The second attractor</em> is dystopia: the trajectory in which catastrophe is prevented by concentrating control – surveillance, centralised authority and enforced order strong enough to stop dangerous action. It escapes the first attractor only by surrendering freedom and accountability, and so becomes a failure of its own.</p>'
    },
    {
      id: 'third-frontier',
      title: 'The Third Frontier: Transfer',
      parent: 'the-fourth-frontier',
      ref: 'Weinstein',
      refs: ['Heather Heying and Bret Weinstein, <em>A Hunter-Gatherer’s Guide to the 21st Century</em> (2021).'],
      html: '<p><em>The third frontier</em> is transfer: prosperity won by taking resources from others – through conquest, colonisation or exploitation. Unlike the geographic and technological frontiers it creates nothing new, and so it is zero-sum, gaining for one group only what it costs another.</p>'
    },
    {
      id: 'second-frontier',
      title: 'The Second Frontier: Technological',
      parent: 'the-fourth-frontier',
      ref: 'Weinstein',
      refs: ['Heather Heying and Bret Weinstein, <em>A Hunter-Gatherer’s Guide to the 21st Century</em> (2021).'],
      html: '<p><em>The second frontier</em> is technological: prosperity won by an innovation that lets the same land or resources support more – a new crop, tool or method. It opens a period of abundance until the population grows to fill it.</p>'
    },
    {
      id: 'first-frontier',
      title: 'The First Frontier: Geographic',
      parent: 'the-fourth-frontier',
      ref: 'Weinstein',
      refs: ['Heather Heying and Bret Weinstein, <em>A Hunter-Gatherer’s Guide to the 21st Century</em> (2021).'],
      html: '<p><em>The first frontier</em> is geographic: prosperity won by reaching new, unoccupied land and its resources. It is the oldest frontier, and it lasts only until the new land is full.</p>'
    },
    {
      id: 'anti-rivalrous-dynamics',
      title: 'Anti-Rivalrous Dynamics',
      parent: 'game-b',
      html: '<p><em>Anti-rivalrous dynamics</em> are those in which one party’s gain adds to others’ rather than subtracting from them. Rivalrous goods are diminished by use; anti-rivalrous goods – knowledge, open-source software, trust, a shared language – become more valuable the more people use them.</p><p>In Game B thinking, a civilisation that escapes rivalrous competition must be built around dynamics like these, so that cooperating is the winning move.</p>'
    },
    {
      id: 'antifragility',
      title: 'Anti-fragility',
      parent: 'game-b',
      ref: 'Taleb',
      refs: ['Nassim Nicholas Taleb, <em>Antifragile: Things That Gain from Disorder</em> (2012).'],
      html: '<p><em>Anti-fragility</em> is Nassim Nicholas Taleb’s term, from <em>Antifragile</em> (2012), for the property of systems that grow stronger from shocks, stress and volatility, rather than merely surviving them. The fragile breaks under stress and the robust resists it, but the anti-fragile improves – as bones strengthen under load and ecosystems renew themselves through small fires.</p><p>For civilisation design it shifts the aim from preventing every shock to building systems that learn and adapt from the ones that come.</p>'
    },
    {
      id: 'broadcast-vs-network-modality',
      title: 'Broadcast vs Network Modality',
      parent: 'game-b',
      html: '<p><em>Broadcast and network modality</em> are two ways a society can make sense of the world and coordinate. In broadcast modality a few centres – states, media, churches – send information outward to many receivers, producing shared narratives but concentrating control over them. In network modality many participants exchange information with one another directly, so that sense is made and decisions are reached through their interaction.</p><p>Game B thinking holds that the digital age has eroded the old broadcast order without yet building a healthy network one, and that a new civilisation needs ways of sensemaking and coordination native to networks.</p>'
    },
    {
      id: 'protobs',
      title: 'ProtoBs',
      parent: 'game-b',
      ref: 'Rutt',
      html: '<p><em>ProtoBs</em> – proto–Game B communities – is Jim Rutt’s term for on-the-ground communities of people trying to live Game B lives now: coherent groups sharing land, housing, work or governance in ways meant to be whole, if not yet complete. They serve as experiments and seeds, testing in practice how a Game B civilisation might work and showing others that it can.</p>'
    },
    {
      id: 'society-4-0',
      title: 'Society 4.0',
      parent: 'game-b',
      ref: 'Haupt',
      html: '<p><em>Society 4.0</em> is Michael Haupt’s name for an emerging meta-society: a global network of people working to redesign the value systems, reward systems and social contracts on which modern society rests. It frames the present as a transition to a new stage of social evolution, and approaches it as a game that anyone can join – a real-world game whose adversaries are war, poverty, inequality and environmental destruction.</p>'
    },
    {
      id: 'cybernetic-economics',
      title: 'Cybernetic Economics',
      parent: 'civilisation-design',
      html: '<p><em>Cybernetic economics</em> is the tradition of organising economies through feedback, information and control rather than through prices and markets alone. It treats the economy as a system to be steered: measuring resources and needs in real time, and adjusting production and distribution as conditions change.</p><p>It runs from Stafford Beer’s work on viable systems and Project Cybersyn in Chile, through Jacque Fresco’s resource-based economy, to recent proposals for post-monetary planning made feasible by computation and sensing.</p>'
    },
    {
      id: 'integral',
      title: 'Integral',
      parent: 'cybernetic-economics',
      ref: 'Joseph',
      html: '<p><em>Integral</em> is Peter Joseph’s name for a proposed post-monetary economic model: a federated, cooperative economy in which production and distribution are coordinated cybernetically, through connected systems for assessing needs, managing resources and allocating labour, rather than through markets. It is meant to grow alongside the existing economy as parallel infrastructure, gradually taking over from market dependence rather than replacing it by revolution.</p>'
    },
    {
      id: 'natural-law-resource-based-economy',
      title: 'Natural Law Resource Based Economy',
      parent: 'cybernetic-economics',
      ref: 'Joseph',
      refs: ['Peter Joseph et al., <em>The Zeitgeist Movement Defined: Realizing a New Train of Thought</em> (2014).'],
      html: '<p>The <em>natural law resource based economy</em> is the economic model advocated by Peter Joseph and the Zeitgeist Movement. Developed from Jacque Fresco’s resource-based economy, it holds that economic decisions should be derived from the physical facts of the Earth – its resources, its carrying capacity and human needs – rather than from money and markets, which it regards as structurally wasteful and inequitable.</p><p>It proposes automating labour where possible, managing resources by scientific accounting, and designing goods for durability and access rather than sale.</p>'
    },
    {
      id: 'post-statism',
      title: 'Post-statism',
      parent: 'the-post-status-quo',
      html: '<p><em>Post-statism</em> names a condition or a project beyond the sovereign nation-state as the basic unit of political order. It covers anarchist and libertarian visions of societies without states, theories of networked and polycentric governance, and analyses – like Benjamin Bratton’s – of how planetary computation and transnational platforms are already eroding state sovereignty.</p>'
    },
    {
      id: 'post-genderism',
      title: 'Post-genderism',
      parent: 'the-post-status-quo',
      html: '<p><em>Post-genderism</em> is the view that gender roles, and perhaps gender itself, could become optional or disappear, whether through social change or through technologies that loosen the link between biological sex and social role. It draws on feminist, queer and transhumanist thought, and appears in xenofeminism among other currents.</p>'
    },
    {
      id: 'civilisational-paradigm-shift',
      title: 'Civilisational Paradigm-Shift',
      parent: 'civilisation-transition',
      html: '<p>A <em>civilisational paradigm-shift</em> is a change in the basic framework through which a civilisation understands itself and organises its life – its <a href="#civilisational-paradigm">civilisational paradigm</a>. The idea extends Thomas Kuhn’s account of scientific revolutions: just as a science changes its paradigm when anomalies pile up that the old one cannot absorb, a civilisation may reach a point where its accumulated crises can no longer be managed within its existing assumptions.</p><p>Such a shift is not a reform within the system but a change in what counts as a problem, a solution and a good life – and, like a scientific revolution, it tends to look impossible until it is under way.</p>'
    },
    {
      id: 'theory-of-life-world-systems-change',
      title: 'Theory of Life-World-Systems Change',
      parent: 'civilisation-transition',
      html: '<p>A <em>theory of life-world-systems change</em> is an account of how a whole <a href="#life-world-system">life-world-system</a> – the coupled system of human societies and the living world they depend on – can move from its present state to a viable one. Where theories of social change typically address a single institution, movement or country, it asks how change propagates across economy, culture, technology and ecology together, and what conditions allow a transition to cascade rather than stall.</p><p>It treats transition as a systems problem: identifying the leverage points, feedback loops and thresholds through which a new configuration can take hold.</p>'
    },
    {
      id: 'phase-transition',
      title: 'Phase Transition',
      parent: 'civilisation-transition',
      html: '<p>A <em>phase transition</em> is a change in the state of a system – as water turns to ice or steam – in which gradual changes in some condition produce a sudden, qualitative change in the whole. Near the critical point, small fluctuations can spread across the entire system and the old order gives way to a new one.</p><p>Applied to civilisation, the concept suggests that transitions need not be gradual: pressures can build within a seemingly stable order until it reorganises rapidly into a different state, for better or worse. The task of transition design is to prepare the configuration a civilisation will move into when that point is reached.</p>'
    },
    {
      id: 'lone-country-transition',
      title: 'Lone-Country Transition',
      parent: 'civilisation-transition',
      html: '<p>A <em>lone-country transition</em> is a strategy in which a single nation moves to a new socio-economic system ahead of the rest of the world, serving as proof of concept and, ideally, as a model for others. Its precedent and warning is “socialism in one country”, the doctrine adopted in the Soviet Union in the 1920s.</p><p>Its difficulty is that a country changing alone remains exposed to the world system around it – to capital flight, trade pressure, sanctions and military threat – which may force it to compromise or close itself off. Whether a transition can survive in one place, under that pressure, is the question the strategy must answer.</p>'
    },
    {
      id: 'distributed-world-network',
      title: 'Distributed World-Network',
      parent: 'civilisation-transition',
      html: '<p>A <em>distributed world-network</em> is a strategy of transition in which a new civilisation grows not inside one country but across a network of communities, projects and institutions spread around the world, linked by shared principles, technologies and exchange. Each node is small enough to start now; together they form a parallel system that can learn from itself, support its members and expand as the old system weakens.</p><p>It trades the power of a state for resilience and reach: no single government can capture or crush it, but it must find ways to coordinate without one.</p>'
    },
    {
      id: 'transitional-projects',
      title: 'Transitional Projects',
      parent: 'civilisation-transition',
      html: '<p><em>Transitional projects</em> are concrete attempts to build parts of a successor civilisation now – model communities, economic systems, governance experiments and technologies designed to demonstrate a different way of living and to serve as nuclei for wider change. They turn civilisation design from theory into prototypes that can be tested, improved and copied.</p>'
    },
    {
      id: 'civium',
      title: 'Civium',
      parent: 'transitional-projects',
      ref: 'Hall',
      html: '<p><em>Civium</em> is Jordan Hall’s project to re-imagine the city, the basic civic unit, for a world beyond “Game A”. A civium would be a community built at human scale around trust and shared life: partially self-sufficient, governed in new ways, and using technology to support humane coordination rather than growth for its own sake.</p><p>Hall presents it as a practical vehicle for civilisation design, drawing together ideas from the <a href="#game-b">Game B</a> discourse into a form that can be built and lived in.</p>'
    },
    {
      id: 'regen-villages',
      title: 'ReGen Villages',
      parent: 'transitional-projects',
      ref: 'Ehrlich',
      html: '<p><em>ReGen Villages</em> is a company founded by James Ehrlich in 2016, as a spin-off from Stanford University, to design and build regenerative neighbourhoods: communities of around a hundred families that produce their own organic food, clean water and renewable energy, and recycle their waste into resources on site.</p><p>Its operating software, VillageOS, uses machine learning to design and run these closed-loop systems, with a first neighbourhood planned near Almere in the Netherlands. It offers a model of self-reliant, resilient settlement that could be replicated at scale.</p>'
    },
    {
      id: 'civilisational-crisis',
      title: 'Civilisational Crisis',
      parent: 'metacrisis',
      html: '<p>A <em>civilisational crisis</em> is a crisis not of one sector, institution or nation but of a civilisation as a whole: a point at which its basic ways of producing, governing and making meaning can no longer sustain it. Several names have been coined for the forms such a crisis can take – the <a href="#polycrisis">polycrisis</a>, in which many crises interact; the <a href="#permacrisis">permacrisis</a>, in which crisis becomes the permanent condition; and the <a href="#omnicrisis">omnicrisis</a>, in which it reaches into every domain at once.</p>'
    },
    {
      id: 'permacrisis',
      title: 'Permacrisis',
      parent: 'civilisational-crisis',
      html: '<p><em>Permacrisis</em> names an extended period of instability and insecurity in which one crisis follows another without a return to normal. Chosen as Collins Dictionary’s word of the year in 2022, it captures the sense that crisis is no longer an interruption of ordinary life but its ongoing condition.</p>'
    },
    {
      id: 'omnicrisis',
      title: 'Omnicrisis',
      parent: 'civilisational-crisis',
      html: '<p>An <em>omnicrisis</em> is a crisis that reaches into every domain of life at once – ecological, economic, political, technological, cultural and personal – so that there is no stable ground from which to address any one part of it. Where the polycrisis stresses the interaction of crises, the omnicrisis stresses their totality.</p>'
    },
    {
      id: 'problem-complex',
      title: 'Problem Complex',
      parent: 'metacrisis',
      html: '<p>The <em>problem complex</em> is the full set of interlocking crises that make up the visible face of the <a href="#metacrisis">metacrisis</a> – ecological, technological, cultural, geopolitical, macroeconomic and bio-psycho-social. Each is a field of problems in its own right, but they share causes, amplify one another and cannot be solved in isolation.</p><p>Mapping the problem complex is the first step of a metacrisis analysis; the second is to trace its <a href="#generative-dynamics">generative dynamics</a>, the patterns that keep producing it.</p>'
    },
    {
      id: 'generative-dynamics',
      title: 'Generative Dynamics',
      parent: 'metacrisis',
      html: '<p><em>Generative dynamics</em> are the underlying patterns that keep producing the crises of the <a href="#problem-complex">problem complex</a>: the game-theoretic, systemic, economic, psychological, epistemic and mythic structures from which particular problems arise. Addressing a crisis without changing the dynamics that generate it tends only to move the problem elsewhere.</p><p>Identifying these dynamics is what distinguishes a metacrisis analysis from a list of crises.</p>'
    },
    {
      id: 'attractor-states',
      title: 'Attractor States',
      parent: 'metacrisis',
      html: '<p><em>Attractor states</em> are the end-states towards which a system tends, whatever its starting point. Applied to civilisation, the metacrisis is often described in terms of three: the <a href="#first-attractor">first attractor</a> of catastrophe, the <a href="#second-attractor">second attractor</a> of dystopia, and the <a href="#third-attractor">third attractor</a> of alignment – the narrow path between the two.</p>'
    },
    {
      id: 'ecological-crisis',
      title: 'Ecological Crisis: Substrate Destruction',
      parent: 'problem-complex',
      html: '<p>The <em>ecological crisis</em> is the destruction of the living substrate on which civilisation depends: climate, biodiversity, soils, water and the biogeochemical cycles that keep the Earth habitable. Unlike other crises it cannot be negotiated with – its limits are physical – and it undermines every other system by degrading the ground they stand on.</p>'
    },
    {
      id: 'climate-migration',
      title: 'Climate Migration',
      parent: 'ecological-crisis',
      html: '<p><em>Climate migration</em> is the movement of people driven by the effects of climate change – droughts, floods, sea-level rise, crop failure and extreme heat. Estimates of its future scale run to hundreds of millions of people this century, and its pressures are likely to fall hardest on the regions least responsible for emissions.</p>'
    },
    {
      id: 'crossed-planetary-boundaries',
      title: 'The Seven/Nine Crossed Planetary Boundaries',
      parent: 'planetary-boundaries',
      refs: ['Katherine Richardson et al., “Earth beyond six of nine planetary boundaries”, <em>Science Advances</em> 9, no. 37 (2023).'],
      html: '<p>Of the nine planetary boundaries defined by Johan Rockström and colleagues, an assessment in 2023 found six already transgressed – climate change, biosphere integrity, land-system change, freshwater change, biogeochemical flows and novel entities – and the Planetary Health Check of 2025 added a seventh, ocean acidification. Only stratospheric ozone and atmospheric aerosol loading remain within their safe limits.</p>'
    },
    {
      id: 'safe-operating-space',
      title: 'Safe Operating Space',
      parent: 'planetary-boundaries',
      refs: ['Johan Rockström et al., “A safe operating space for humanity”, <em>Nature</em> 461 (2009).'],
      html: '<p>The <em>safe operating space</em> for humanity is the range of conditions, bounded by the planetary boundaries, within which human societies can develop without risking abrupt and irreversible change to the Earth system. The concept, introduced by Johan Rockström and colleagues in 2009, frames sustainability as staying within the stable state of the Holocene that made civilisation possible.</p>'
    },
    {
      id: 'tipping-points',
      title: 'Tipping Points',
      parent: 'planetary-boundaries',
      refs: ['Timothy M. Lenton et al., “Tipping elements in the Earth’s climate system”, <em>PNAS</em> 105, no. 6 (2008).'],
      html: '<p><em>Tipping points</em> are thresholds beyond which a part of the Earth system shifts into a different state, often abruptly and irreversibly – the collapse of ice sheets, the dieback of the Amazon rainforest, the thawing of permafrost, the weakening of the Atlantic overturning circulation. Once crossed, they can trigger one another, so that warming feeds further warming beyond human control.</p>'
    },
    {
      id: 'the-great-simplification',
      title: 'The Great Simplification',
      parent: 'ecological-crisis',
      ref: 'Hagens',
      html: '<p><em>The Great Simplification</em> is Nate Hagens’s name for the coming contraction of the global economy as it adjusts to the end of cheap energy and the limits of the biosphere. Modern complexity, he argues, was built on a one-off pulse of fossil carbon; as that pulse passes, societies will have to become simpler, more local and less energy-intensive – by design if possible, or by crisis if not.</p>'
    },
    {
      id: 'carbon-pulse',
      title: 'Carbon Pulse',
      parent: 'the-great-simplification',
      ref: 'Hagens',
      html: '<p>The <em>carbon pulse</em> is the brief episode, a few centuries long, in which humanity has burned fossil carbon accumulated over hundreds of millions of years. Nate Hagens uses the term to stress that modern abundance rests on a one-time inheritance, drawn down far faster than it formed, rather than on a permanent condition.</p>'
    },
    {
      id: 'energy-blindness',
      title: 'Energy-Blindness',
      parent: 'the-great-simplification',
      ref: 'Hagens',
      html: '<p><em>Energy-blindness</em> is Nate Hagens’s term for the failure of economics, politics and everyday thinking to see the role energy plays in everything: economies are modelled as if money and technology produced wealth, while the vast labour performed by cheap fossil energy goes unnoticed. The blindness makes the end of cheap energy appear as a series of unrelated economic problems.</p>'
    },
    {
      id: 'the-mordor-economy',
      title: 'The Mordor Economy',
      parent: 'the-great-simplification',
      ref: 'Hagens',
      html: '<p><em>The Mordor economy</em> is Nate Hagens’s image for an economy that must spend an ever larger share of its energy and output simply on obtaining more energy and resources, and on repairing environmental damage, as easy reserves run out. Less and less is left for everything else – health, education, culture – as the economy turns into a machine for feeding itself.</p>'
    },
    {
      id: 'technological-crisis',
      title: 'Technological Crisis: Power Amplification',
      parent: 'problem-complex',
      html: '<p>The <em>technological crisis</em> is the amplification of human power beyond the capacity to govern it. Technologies such as nuclear weapons, artificial intelligence and synthetic biology give individuals and small groups destructive reach once confined to states, and advance faster than the institutions, norms and wisdom needed to control them.</p>'
    },
    {
      id: 'artificial-intelligence-risks',
      title: 'Artificial Intelligence Risks',
      parent: 'technological-crisis',
      html: '<p><em>Artificial intelligence risks</em> range from present harms – bias, surveillance, disinformation, the concentration of power and the displacement of labour – to the prospect of systems more capable than humans pursuing goals misaligned with human interests. The speed of development and the competitive pressure on developers make these risks hard to govern.</p>'
    },
    {
      id: 'synthetic-biotechnology-risks',
      title: 'Synthetic Biotechnology Risks',
      parent: 'technological-crisis',
      html: '<p><em>Synthetic biotechnology risks</em> arise from the growing power to read, write and edit living systems. The same tools that promise new medicines and materials could be used, deliberately or by accident, to create pathogens more dangerous than any found in nature – and as costs fall, the number of actors able to do so grows.</p>'
    },
    {
      id: 'cultural-crisis',
      title: 'Cultural Crisis: Collective Sensemaking',
      parent: 'problem-complex',
      html: '<p>The <em>cultural crisis</em> is the breakdown of collective sensemaking: a society’s shared capacity to understand what is happening, agree on what is true and deliberate about what to do. Without it, no other crisis can be addressed, because the means of recognising and responding to problems together has failed.</p>'
    },
    {
      id: 'techno-epistemic-dynamics',
      title: 'Techno-Epistemic Dynamics',
      parent: 'cultural-crisis',
      html: '<p><em>Techno-epistemic dynamics</em> are the ways in which information technologies shape what people know and believe. Platforms optimised for engagement reward outrage and novelty, flood attention with more than it can process and open new channels for manipulation – changing the conditions of knowing for whole societies.</p>'
    },
    {
      id: 'algorithmic-political-polarisation',
      title: 'Algorithmic Political Polarisation',
      parent: 'techno-epistemic-dynamics',
      html: '<p><em>Algorithmic political polarisation</em> is the deepening of political division by recommendation systems that learn what keeps people engaged and serve them more of it. Because content that provokes anger and confirms identity holds attention, the systems tend to push users towards more extreme and more homogeneous information environments. See <a href="#algorithmic-radicalisation">algorithmic radicalisation</a>.</p>'
    },
    {
      id: 'information-overload',
      title: 'Information Overload',
      parent: 'techno-epistemic-dynamics',
      html: '<p><em>Information overload</em> is the condition in which the volume of information exceeds the capacity to process it, so that more information produces less understanding. Attention fragments, judgement defers to whatever is loudest or most recent, and the ability to tell signal from noise declines.</p>'
    },
    {
      id: 'memetic-warfare',
      title: 'Memetic Warfare',
      parent: 'techno-epistemic-dynamics',
      html: '<p><em>Memetic warfare</em> is conflict waged through ideas, images and narratives designed to spread and change how people think and act. States, movements and individuals use it to sow division, demoralise opponents and shape elections, exploiting platforms that let messages travel faster than they can be checked. See <a href="#information-warfare">information warfare</a>.</p>'
    },
    {
      id: 'the-sensemaking-crisis',
      title: 'The Sensemaking Crisis',
      parent: 'cultural-crisis',
      html: '<p><em>The sensemaking crisis</em> is the failure of individuals and societies to make reliable sense of the world: to know what is true, whom to trust and what matters. It has technological causes, but also deeper ones in the successive shocks that modern thought has dealt to inherited frameworks of meaning – figured here as the Darwinian, Cartesian and Nietzschean crises. See <a href="#sensemaking">sensemaking</a>.</p>'
    },
    {
      id: 'the-darwinian-crisis',
      title: 'The Darwinian Crisis',
      parent: 'the-sensemaking-crisis',
      html: '<p><em>The Darwinian crisis</em> is the evolutionary mismatch between the civilisation of modernity – complex, globalised and technologically advanced – and the cognitive capacities humans evolved to make sense of their world. Human minds were shaped by natural selection for life in small groups, on a local scale, among visible causes and familiar faces; they are now asked to understand global supply chains, financial systems, climate dynamics and exponential technologies whose causes and effects lie far beyond anything they evolved to perceive.</p><p>The result is a world that has outgrown the minds that must steer it: people fall back on intuitions, narratives and heuristics fitted to an ancestral environment, and are easily overwhelmed, misled or manipulated by a reality too large and complex to model. See <a href="#socio-economic-evolutionary-mismatch">socio-economic evolutionary mismatch</a>.</p>'
    },
    {
      id: 'the-nietzschean-crisis',
      title: 'The Nietzschean Crisis',
      parent: 'the-sensemaking-crisis',
      html: '<p><em>The Nietzschean crisis</em> is the loss of shared foundations for value that Friedrich Nietzsche announced as the “death of God”. With the decline of the religious frameworks that had grounded morality and meaning, he warned, Western culture faced nihilism – the sense that nothing has value – unless new values could be created.</p>'
    },
    {
      id: 'geopolitical-crisis',
      title: 'Geopolitical Crisis: World-Order Contestation',
      parent: 'problem-complex',
      html: '<p>The <em>geopolitical crisis</em> is the contest over the shape of world order as the post-Cold War settlement breaks down. Rising and established powers, rival civilisational blocs and new technologies of conflict raise the risk of war at a time when global problems demand cooperation.</p>'
    },
    {
      id: 'international-competition-conflict-and-control',
      title: 'International Competition, Conflict & Control',
      parent: 'geopolitical-crisis',
      html: '<p><em>International competition, conflict and control</em> is the ordinary condition of an international system without a sovereign above states: each must look to its own power, so rivalry over territory, resources, technology and influence is constant. It drives arms races and makes the global cooperation needed for shared problems hard to achieve.</p>'
    },
    {
      id: 'world-war-iii',
      title: 'World War III',
      parent: 'geopolitical-crisis',
      html: '<p><em>World War III</em> names the prospect of a war between the great powers on the scale of the two world wars – now with nuclear weapons, cyberweapons and autonomous systems. Its paths include escalation from regional conflicts, competition for resources and the strain of a rising power meeting an established one.</p>'
    },
    {
      id: 'nuclear-war',
      title: 'Nuclear War',
      parent: 'world-war-iii',
      html: '<p><em>Nuclear war</em> is war fought with nuclear weapons. A large exchange would kill tens or hundreds of millions directly, and the soot from burning cities could cause a nuclear winter, collapsing harvests worldwide. Some nine states hold around twelve thousand warheads between them.</p>'
    },
    {
      id: 'resource-war',
      title: 'Resource War',
      parent: 'world-war-iii',
      html: '<p>A <em>resource war</em> is conflict over scarce resources – water, farmland, energy, critical minerals. As climate change and depletion increase scarcity, competition for what remains is expected to become a growing driver of conflict within and between states.</p>'
    },
    {
      id: 'thucydides-trap',
      title: 'The Thucydides Trap',
      parent: 'world-war-iii',
      ref: 'Allison',
      refs: ['Graham Allison, <em>Destined for War: Can America and China Escape Thucydides’s Trap?</em> (2017).'],
      html: '<p><em>The Thucydides trap</em> is Graham Allison’s name for the danger of war when a rising power threatens to displace an established one, after Thucydides’ account of the Peloponnesian War: “it was the rise of Athens and the fear that this instilled in Sparta that made war inevitable”. Allison found that most such transitions in the past five centuries ended in war, and applies the pattern to the United States and China.</p>'
    },
    {
      id: 'west-versus-islam',
      title: 'Western Civilisation versus Islamic Civilisation',
      parent: 'clash-of-civilisations',
      html: '<p>The opposition of <em>Western and Islamic civilisation</em> was the centrepiece of Samuel Huntington’s clash of civilisations thesis, and seemed to many to be confirmed by the September 11 attacks and the wars that followed. Critics argue that the framing treats diverse societies as monoliths and can help produce the conflict it predicts.</p>'
    },
    {
      id: 'us-versus-china',
      title: 'US Civilisation versus Chinese Civilisation',
      parent: 'clash-of-civilisations',
      html: '<p>The rivalry between <em>the United States and China</em> is increasingly framed as a contest between civilisations as well as states – liberal democracy against a Confucian-inflected party state – over technology, trade, Taiwan and the shape of world order. It is the central case of the <a href="#thucydides-trap">Thucydides trap</a>.</p>'
    },
    {
      id: 'global-south-and-indigenous-cultures',
      title: 'The Global South & Indigenous Cultures',
      parent: 'clash-of-civilisations',
      html: '<p><em>The Global South and Indigenous cultures</em> stand in an uneasy place in the contest of civilisations: often treated as terrain to be won rather than parties to the decision, yet holding most of the world’s population and much of its cultural and ecological knowledge. Their assertion – through new alignments, claims to sovereignty and alternative visions of development – is reshaping world order.</p>'
    },
    {
      id: 'macroeconomic-crisis',
      title: 'Macroeconomic Crisis: Major Disruption',
      parent: 'problem-complex',
      html: '<p>The <em>macroeconomic crisis</em> is the prospect of major disruption to the global economy: financial instability, unsustainable debt, the displacement of work by technology and the ageing of populations. Each strains the growth-dependent model on which modern economies rely.</p>'
    },
    {
      id: 'global-financial-crisis',
      title: 'Global Financial Crisis',
      parent: 'macroeconomic-crisis',
      html: '<p>A <em>global financial crisis</em> is a breakdown of the world’s financial system in which failures spread across institutions and countries. The crisis of 2007–08, triggered by the collapse of the US housing market, caused the deepest recession since the 1930s; the conditions behind it – leverage, complexity and interdependence – have since grown in many respects.</p>'
    },
    {
      id: 'world-debt-crisis',
      title: 'World Debt Crisis',
      parent: 'macroeconomic-crisis',
      html: '<p>The <em>world debt crisis</em> is the accumulation of public, corporate and household debt to levels without peacetime precedent, now well over twice the size of the world economy. High debt leaves states and firms fragile to rising interest rates and slowing growth, and ties economies to growth they may not be able to sustain.</p>'
    },
    {
      id: 'technological-unemployment',
      title: 'Technological Unemployment & Labour-for-Income-for-Consumption Cycle',
      parent: 'macroeconomic-crisis',
      html: '<p><em>Technological unemployment</em> is the loss of jobs to automation faster than new ones appear. It threatens the cycle on which market economies depend – people sell their labour for income, and spend that income on consumption that sustains demand – since if machines do the work, wages fall and with them the demand that keeps production running.</p>'
    },
    {
      id: 'ageing-populations',
      title: 'Ageing Populations & Demographic Collapse',
      parent: 'macroeconomic-crisis',
      html: '<p><em>Ageing populations</em> result from falling birth rates and longer lives. In many countries fertility is now far below replacement, so that the working-age population shrinks while the number of retirees grows – straining pensions, health systems and growth, and in some places pointing towards demographic collapse.</p>'
    },
    {
      id: 'bio-psycho-social-crisis',
      title: 'Bio-Psycho-Social Crisis: Population-Level Pathology',
      parent: 'problem-complex',
      html: '<p>The <em>bio-psycho-social crisis</em> is the decline of health – physical, mental and social – across whole populations. Chronic disease, mental illness, loneliness and social pathology are rising together in many societies, suggesting causes in the shared conditions of modern life rather than in individuals alone.</p>'
    },
    {
      id: 'global-public-health-crisis',
      title: 'Global Public Health Crisis',
      parent: 'bio-psycho-social-crisis',
      html: '<p>The <em>global public health crisis</em> is the burden of disease that modern societies have failed to prevent: chronic, non-communicable diseases tied to diet, inactivity, pollution and stress now cause most deaths worldwide, while infectious diseases persist where poverty is greatest.</p>'
    },
    {
      id: 'heart-disease',
      title: 'Heart Disease',
      parent: 'global-public-health-crisis',
      html: '<p><em>Heart disease</em> – above all coronary artery disease – is the leading cause of death worldwide. Most cases are linked to modifiable risks: diet, smoking, inactivity, high blood pressure and chronic stress.</p>'
    },
    {
      id: 'cancer',
      title: 'Cancer',
      parent: 'global-public-health-crisis',
      html: '<p><em>Cancer</em> is the second leading cause of death worldwide. Its incidence is rising with ageing populations and with exposures of modern life – tobacco, alcohol, obesity, pollution and inactivity.</p>'
    },
    {
      id: 'alzheimers-and-dementias',
      title: 'Alzheimers & Dementias',
      parent: 'global-public-health-crisis',
      html: '<p><em>Alzheimer’s disease and other dementias</em> affect more than fifty-five million people worldwide, a number rising quickly as populations age. They have no cure, and their care falls heavily on families and health systems.</p>'
    },
    {
      id: 'malaria',
      title: 'Malaria',
      parent: 'global-public-health-crisis',
      html: '<p><em>Malaria</em>, a parasitic disease spread by mosquitoes, kills around six hundred thousand people a year, most of them young children in sub-Saharan Africa. It is preventable and treatable, and its persistence is a measure of global inequality.</p>'
    },
    {
      id: 'hiv-aids',
      title: 'HIV-AIDS',
      parent: 'global-public-health-crisis',
      html: '<p><em>HIV</em>, the virus that causes AIDS, has killed more than forty million people since the 1980s, and around forty million live with it today. Treatment now allows a near-normal life, but access remains uneven.</p>'
    },
    {
      id: 'global-mental-health-crisis',
      title: 'Global Mental Health Crisis',
      parent: 'bio-psycho-social-crisis',
      html: '<p>The <em>global mental health crisis</em> is the high and in many places rising prevalence of depression, anxiety, addiction and suicide, alongside a large gap in care. Its causes are sought increasingly in social conditions – isolation, insecurity, digital life – as well as in individual biology.</p>'
    },
    {
      id: 'suicide-epidemic',
      title: 'Suicide Epidemic',
      parent: 'global-mental-health-crisis',
      html: '<p>The <em>suicide epidemic</em> refers to the hundreds of thousands of deaths by suicide each year worldwide, and to rising rates among particular groups in some countries, including young people and middle-aged men. Suicide is often treated as a social as well as an individual tragedy, reflecting despair, isolation and economic loss.</p>'
    },
    {
      id: 'addiction-epidemic',
      title: 'Addiction Epidemic',
      parent: 'global-mental-health-crisis',
      html: '<p>The <em>addiction epidemic</em> covers the spread of dependence on substances such as opioids, alcohol and stimulants, and on behaviours engineered to be compulsive, from gambling to social media. The opioid crisis in the United States alone has caused hundreds of thousands of deaths.</p>'
    },
    {
      id: 'loneliness-epidemic',
      title: 'Loneliness Epidemic',
      parent: 'global-mental-health-crisis',
      refs: ['Office of the US Surgeon General, <em>Our Epidemic of Loneliness and Isolation</em> (2023).'],
      html: '<p>The <em>loneliness epidemic</em> is the widespread experience of social isolation in modern societies. In 2023 the US Surgeon General declared it a public health crisis, citing evidence that loneliness raises the risk of heart disease, dementia and early death as much as smoking.</p>'
    },
    {
      id: 'global-psychological-disorder',
      title: 'Global Psychological Disorder',
      parent: 'bio-psycho-social-crisis',
      html: '<p><em>Global psychological disorder</em> names patterns of disordered psychology at the scale of whole populations – aggression, anti-social behaviour, manipulative and callous traits, and radicalisation – understood as products of social conditions and selection pressures rather than only of individual pathology.</p>'
    },
    {
      id: 'aggression-and-anti-social-behaviour',
      title: 'Aggression Levels & Anti-Social Behaviour',
      parent: 'global-psychological-disorder',
      html: '<p><em>Aggression and anti-social behaviour</em> – violence, hostility and disregard for others – vary greatly between societies and over time, and respond to inequality, insecurity and social fragmentation. Their levels are one measure of the health of a social order.</p>'
    },
    {
      id: 'dark-triad-traits',
      title: 'Dark Triad Traits',
      parent: 'global-psychological-disorder',
      refs: ['Delroy L. Paulhus and Kevin M. Williams, “The Dark Triad of personality: Narcissism, Machiavellianism, and psychopathy”, <em>Journal of Research in Personality</em> 36, no. 6 (2002).'],
      html: '<p>The <em>dark triad</em> is the cluster of three socially aversive personality traits identified by Delroy Paulhus and Kevin Williams in 2002: narcissism, Machiavellianism and psychopathy. Where institutions reward ruthlessness and self-promotion, people high in these traits may rise to positions of power. See the <a href="#psychopathic-selection-hypothesis">psychopathic selection hypothesis</a>.</p>'
    },
    {
      id: 'political-radicalisation',
      title: 'Political Radicalisation',
      parent: 'global-psychological-disorder',
      html: '<p><em>Political radicalisation</em> is the process by which people come to hold extreme political views and, sometimes, to support or use violence for them. It is driven by grievance, identity and the search for meaning, and accelerated by online networks.</p>'
    },
    {
      id: 'global-infertility',
      title: 'Global Infertility Levels',
      parent: 'bio-psycho-social-crisis',
      html: '<p><em>Infertility</em> affects around one in six people at some point in their lives, according to the World Health Organization. Studies also report a marked decline in sperm counts in many countries over recent decades, with environmental chemicals among the suspected causes.</p>'
    },
    {
      id: 'arms-races-and-tragedies-of-the-commons',
      title: 'Arms Races & Tragedies of the Commons',
      parent: 'generative-dynamics',
      html: '<p><em>Arms races</em> and <em>tragedies of the commons</em> are two forms of the same trap. In an arms race, each party builds power to avoid falling behind, so all end up less secure; in a <a href="#tragedy-of-the-commons">tragedy of the commons</a>, each takes more from a shared resource, so it is exhausted. In both, actions that are rational for each are ruinous for all.</p>'
    },
    {
      id: 'instrumental-convergence-and-strategy-stealing',
      title: 'Instrumental Convergence & Strategy Stealing',
      parent: 'generative-dynamics',
      refs: ['Stephen M. Omohundro, “The Basic AI Drives”, in <em>Artificial General Intelligence 2008</em> (2008).', 'Nick Bostrom, “The Superintelligent Will”, <em>Minds and Machines</em> 22 (2012).'],
      html: '<p><em>Instrumental convergence</em> is the thesis, set out by Steve Omohundro and Nick Bostrom, that agents with almost any final goal will pursue the same intermediate ones – resources, power, self-preservation – because these help achieve almost anything. <em>Strategy stealing</em>, from Paul Christiano, asks whether any strategy for gaining power can be copied by others; where it cannot, whoever finds it first may gain a decisive advantage.</p><p>Together they describe why competing agents, human or artificial, converge on the pursuit of power.</p>'
    },
    {
      id: 'narrow-metric-optimisation',
      title: 'Narrow Metric Optimisation & Negative Externalities',
      parent: 'generative-dynamics',
      html: '<p><em>Narrow metric optimisation</em> is the pursuit of a single measurable target – profit, GDP, engagement – at the expense of everything the metric leaves out. What it ignores becomes a <em>negative externality</em>: a cost borne by others or by the living world, which the optimiser has no reason to count.</p>'
    },
    {
      id: 'positive-feedback-loops-and-power-asymmetries',
      title: 'Positive Feedback Loops & Power Asymmetries',
      parent: 'generative-dynamics',
      html: '<p><em>Positive feedback loops</em> amplify whatever they act on: advantage brings further advantage, so that wealth, influence and capability concentrate. The resulting <em>power asymmetries</em> let the strongest shape the rules in their own favour, reinforcing the loop. See <a href="#feedback-loop">feedback loop</a>.</p>'
    },
    {
      id: 'exponential-technological-acceleration',
      title: 'Exponential Technological Acceleration',
      parent: 'generative-dynamics',
      html: '<p><em>Exponential technological acceleration</em> is the compounding growth of technological capability, in which each advance makes the next easier. Because institutions, cultures and minds change at a far slower pace, the gap between what we can do and what we can govern keeps widening. See <a href="#exponential-technology">exponential technology</a>.</p>'
    },
    {
      id: 'life-blind-search-processes',
      title: 'Life-Blind Search Processes',
      parent: 'generative-dynamics',
      html: '<p><em>Life-blind search processes</em> are processes – markets, competitive selection, optimisation by algorithm – that search for whatever succeeds by their own criterion while remaining blind to its effects on life. They produce great ingenuity, but nothing in them steers towards wellbeing unless wellbeing happens to pay. See <a href="#market-as-life-blind-watchmaker">the market as life-blind watchmaker</a>.</p>'
    },
    {
      id: 'abstraction-extraction-accumulation-cycle',
      title: 'Abstraction-Extraction-Accumulation Cycle',
      parent: 'generative-dynamics',
      html: '<p>The <em>abstraction-extraction-accumulation cycle</em> describes how living systems are first abstracted – reduced to quantities such as resources, labour or data – then extracted, and the value accumulated as capital, which funds further abstraction and extraction. Each turn of the cycle converts more of the living world into a stock of abstract value.</p>'
    },
    {
      id: 'perverse-incentive-structures',
      title: 'Perverse Incentive Structures',
      parent: 'generative-dynamics',
      html: '<p><em>Perverse incentive structures</em> reward the opposite of what they are meant to achieve: health systems paid for treatment rather than health, media rewarded for outrage rather than truth, firms for short-term returns rather than lasting value. Where incentives are perverse, even good people produce bad outcomes.</p>'
    },
    {
      id: 'left-hemispheric-conditioning',
      title: 'Ubiquitous Left-hemispheric Conditioning',
      parent: 'generative-dynamics',
      ref: 'McGilchrist',
      refs: ['Iain McGilchrist, <em>The Master and His Emissary: The Divided Brain and the Making of the Western World</em> (2009).'],
      html: '<p><em>Ubiquitous left-hemispheric conditioning</em> draws on Iain McGilchrist’s account, in <a href="#the-master-and-his-emissary">The Master and His Emissary</a> (2009), of the two hemispheres’ different modes of attention: the left narrow, analytic and focused on grasping and using; the right broad, contextual and attuned to the living whole. McGilchrist argues that modern Western culture has come to be dominated by the left hemisphere’s way of seeing, and that a world built in its image reinforces it in turn.</p>'
    },
    {
      id: 'modernist-cultural-paradigm',
      title: 'Modernist Cultural Paradigm',
      parent: 'generative-dynamics',
      ref: 'Pollock',
      html: '<p>The <em>modernist cultural paradigm</em> is the set of views and values that shape modern societies: individualism, materialism, faith in progress through growth and technology, and the separation of humans from nature and of facts from values. Rufus Pollock and the Second Renaissance project argue that the interconnected crises of the present are rooted in this paradigm, and that a fundamental shift in worldview is needed.</p>'
    },
    {
      id: 'scarcity-rivalry-orientation',
      title: 'Scarcity-Rivalry Orientation',
      parent: 'generative-dynamics',
      ref: 'Joseph',
      html: '<p>The <em>scarcity-rivalry orientation</em> is derived from Peter Joseph’s <a href="#root-socio-economic-orientation">root socio-economic orientation</a>: the assumption at the root of market economies that resources are scarce and must be competed for. Built into economic structures, it conditions people to treat one another as rivals, rewards hoarding and exploitation, and is reproduced even where technology could provide abundance.</p>'
    },
    {
      id: 'psychopathic-selection-hypothesis',
      title: 'Psychopathic Selection Hypothesis',
      parent: 'generative-dynamics',
      ref: 'Elliott',
      html: '<p>The <em>psychopathic selection hypothesis</em> is Greg Elliott’s proposal that, as human life is increasingly mediated by large-scale symbolic systems – markets, bureaucracies, institutions – selection pressures shift into these systems, where scale, anonymity and delayed consequences give advantage to instrumental, callous and exploitative strategies. Such strategies become built into the logic of institutions themselves and are reproduced by anyone who plays the game, whether or not they are personally psychopathic.</p>'
    },
    {
      id: 'collective-psychological-alienation',
      title: 'Collective Psychological Alienation',
      parent: 'generative-dynamics',
      ref: 'Temple (Stein, Wilber, Gafni)',
      refs: ['David J. Temple, <em>First Principles and First Values: Forty-Two Propositions on CosmoErotic Humanism, the Meta-Crisis, and the World to Come</em> (2024).'],
      html: '<p><em>Collective psychological alienation</em> is the estrangement of people from one another, from nature and from any sense of shared value. David J. Temple – the joint pseudonym of Marc Gafni, Zachary Stein and Ken Wilber – calls it a <em>global intimacy disorder</em>, and argues that it is the root of the metacrisis: a failure to experience ourselves within a field of shared intrinsic value, which leaves rivalry and win–lose metrics to fill the gap.</p>'
    },
    {
      id: 'reductionist-world-modelling',
      title: 'Reductionist World-Modelling',
      parent: 'generative-dynamics',
      html: '<p><em>Reductionist world-modelling</em> represents the world by breaking it into parts and studying each in isolation. It has been enormously productive, but used alone it misses the relationships, emergent properties and whole-system effects where many of today’s problems arise.</p>'
    },
    {
      id: 'isolated-problem-solving',
      title: 'Isolated Problem-Solving',
      parent: 'generative-dynamics',
      html: '<p><em>Isolated problem-solving</em> treats each problem separately, optimising a solution for one without regard to its effects on others. Because the crises of the problem complex are interconnected, solutions designed in isolation often create new problems elsewhere – the pattern of <a href="#problem-solution-externality-history">problem-solution-externality history</a>.</p>'
    },
    {
      id: 'structural-and-superstructural-separation',
      title: 'Structural & Superstructural Separation',
      parent: 'generative-dynamics',
      html: '<p><em>Structural and superstructural separation</em> is the division of humanity’s political organisation and its cultural psychologies into separate units. Structurally, the world is organised into sovereign states, each pursuing its own interest under no authority above it; superstructurally, it is divided into separate cultures, religions, ideologies and identities, each with its own picture of the world and of who belongs.</p><p>The two divisions reinforce each other – states draw loyalty from shared identities, and identities harden around state borders – and together they leave a species facing planetary problems without a political unit or a shared outlook at the scale of those problems. Separate units compete where they would need to cooperate, and see one another as rivals where they would need to see a common predicament.</p>'
    },
    {
      id: 'moral-wisdom-gap',
      title: 'Moral Wisdom Gap',
      parent: 'the-wisdom-gap',
      html: '<p>The <em>moral wisdom gap</em> is the distance between humanity’s power to act and its understanding of how it ought to act – the ethical maturity needed to use great power for good.</p>'
    },
    {
      id: 'structural-wisdom-gap',
      title: 'Structural Wisdom Gap',
      parent: 'the-wisdom-gap',
      html: '<p>The <em>structural wisdom gap</em> is the distance between the power of a civilisation’s technologies and the capacity of its institutions to govern them – the gap between what can be built and what can be coordinated.</p>'
    },
    {
      id: 'epistemic-wisdom-gap',
      title: 'Epistemic Wisdom Gap',
      parent: 'the-wisdom-gap',
      html: '<p>The <em>epistemic wisdom gap</em> is the distance between the complexity of the problems a civilisation faces and its capacity to understand them – to know what is true and to model the consequences of its actions.</p>'
    },
    {
      id: 'escalating-system-dynamics',
      title: 'Escalating System-Dynamics',
      parent: 'first-attractor',
      html: '<p><em>Escalating system-dynamics</em> are the self-reinforcing processes – runaway warming, cascading financial failure, ecological collapse – that can drive a civilisation into catastrophe without anyone choosing it, as feedback loops push systems past their tipping points.</p>'
    },
    {
      id: 'escalating-state-competition',
      title: 'Escalating Competition & Conflict between State Actors',
      parent: 'first-attractor',
      html: '<p><em>Escalating competition and conflict between states</em> – arms races, trade wars, proxy wars and great-power rivalry – is one road to the first attractor: each state’s pursuit of security makes all less secure, and the destructive power at stake grows with every round.</p>'
    },
    {
      id: 'escalating-rogue-actors',
      title: 'Escalating Power of Malevolent Rogue Actors',
      parent: 'first-attractor',
      html: '<p>The <em>escalating power of malevolent rogue actors</em> is the spread of catastrophic capabilities – engineered pathogens, cyberweapons, autonomous drones – to small groups and individuals outside the control of states. As destructive power becomes cheap and accessible, it takes only one malevolent actor to cause disaster.</p>'
    },
    {
      id: 'global-stable-totalitarianism',
      title: 'Global Stable Totalitarianism',
      parent: 'second-attractor',
      html: '<p><em>Global stable totalitarianism</em> is a worldwide regime of total control that could, with modern surveillance and enforcement, become permanent – unchallengeable from within and with no outside to escape to. It is sometimes counted among existential risks because it could lock in a bad future indefinitely.</p>'
    },
    {
      id: 'hyper-surveillance-capitalism',
      title: 'Hyper-Surveillance Capitalism',
      parent: 'second-attractor',
      html: '<p><em>Hyper-surveillance capitalism</em> is the intensification of <a href="#surveillance-capitalism">surveillance capitalism</a> to the point where every action and expression is recorded, predicted and shaped by commercial and state systems working together – control exercised less by force than by the management of behaviour.</p>'
    },
    {
      id: 'despotic-drift-and-closed-society',
      title: 'Despotic Drift & Closed Society',
      parent: 'second-attractor',
      html: '<p><em>Despotic drift</em> is the gradual slide of a state towards autocracy – emergency powers that become permanent, checks that erode, dissent that is criminalised – ending in a <a href="#closed-society">closed society</a>, in which information is restricted and decisions are imposed from above.</p>'
    },
    {
      id: 'decentralised-coordination',
      title: 'Decentralised Coordination',
      parent: 'third-attractor',
      html: '<p><em>Decentralised coordination</em> is the capacity of many actors to coordinate at scale without a central authority: through shared protocols, transparent information, aligned incentives and trust. It offers a way to manage dangerous technologies and shared resources without concentrating the power that leads to the second attractor.</p>'
    },
    {
      id: 'pluralistic-civilisation-alignment',
      title: 'Pluralistic Civilisation Alignment',
      parent: 'meta-utopia',
      html: '<p><em>Pluralistic civilisation alignment</em> is alignment that does not impose a single vision of the good but holds many together: a civilisation whose institutions allow different communities and value systems to coexist, cooperate and correct one another. See <a href="#civilisation-alignment">civilisation alignment</a>.</p>'
    },
    {
