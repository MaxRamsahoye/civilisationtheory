      html: '<p><em>The long reflection</em> is a proposed period, after humanity has reached existential security, of careful collective deliberation about what it ultimately values and wants its future to be – before committing to any irreversible course. The idea is set out by Toby Ord and William MacAskill.</p>'
    },
    {
      id: 'space-governance',
      title: 'Space Governance',
      parent: 'macrostrategy',
      html: '<p><em>Space governance</em> is the question of how activity beyond Earth – and eventually the settlement of other worlds and star systems – should be governed. Decisions made early about property, expansion and security in space could shape the distribution of power and value across the whole future of civilisation.</p>'
    },
    {
      id: 'observable-and-accessible-universe',
      title: 'Observable & Accessible Universe',
      parent: 'space-governance',
      html: '<p>The <em>observable universe</em> is the region from which light has reached us since the Big Bang; the <em>accessible universe</em> is the smaller region a civilisation could ever reach, given the speed of light and the accelerating expansion of space. Galaxies beyond it are receding too fast ever to be reached, so the accessible universe shrinks over time.</p>'
    },
    {
      id: 'space-colonisation',
      title: 'Space Colonisation',
      parent: 'space-governance',
      html: '<p><em>Space colonisation</em> is the establishment of permanent human or post-human settlements beyond Earth – on the Moon, Mars and eventually other star systems. It could protect against some catastrophes and vastly expand civilisation, but raises questions of who expands, on what terms and with what values.</p>'
    },
    {
      id: 'grabby-aliens',
      title: 'Grabby Aliens',
      parent: 'space-governance',
      ref: 'Hanson',
      refs: ['Robin Hanson, Daniel Martin, Calvin McCarter and Jonathan Paulson, “If Loud Aliens Explain Human Earliness, Quiet Aliens Are Also Rare”, <em>The Astrophysical Journal</em> 922, no. 2 (2021).'],
      html: '<p><em>Grabby aliens</em> is the model, proposed by Robin Hanson and colleagues (2021), of civilisations that expand rapidly and visibly through the universe, changing what they touch. It explains why humanity appears early in cosmic history – grabby civilisations will soon fill the universe – and predicts we would meet them within hundreds of millions of years if we expand.</p>'
    },
    {
      id: 'von-neumann-probes',
      title: 'Von Neumann Probes',
      parent: 'space-governance',
      html: '<p><em>Von Neumann probes</em> are hypothetical self-replicating spacecraft, named after John von Neumann’s work on self-reproducing machines, that would travel to other star systems, use local materials to build copies of themselves and send them onward – allowing a civilisation to spread across a galaxy in a cosmically short time.</p>'
    },
    {
      id: 'nightwatchman-probes',
      title: 'Galactic Anarchy & Nightwatchman Probes',
      parent: 'space-governance',
      ref: 'Delaney',
      html: '<p><em>Galactic anarchy</em> is the condition Oscar Delaney and Mia Taylor warn could follow the settlement of space: independent colonies with no authority above them, any of which could seize others’ resources, trigger galaxy-wide catastrophes or create astronomical suffering. Their proposed remedy is a <em>nightwatchman</em> superintelligence aboard every probe, enforcing a narrow universal code and replicating into every probe its colony sends onward – at the risk of lock-in and pervasive surveillance.</p>'
    },
    {
      id: 'singleton',
      title: 'Singleton',
      parent: 'space-governance',
      ref: 'Bostrom',
      refs: ['Nick Bostrom, “What is a Singleton?”, <em>Linguistic and Philosophical Investigations</em> 5, no. 2 (2006).'],
      html: '<p>A <em>singleton</em> is Nick Bostrom’s term for a world order with a single decision-making agency at the highest level, able to prevent threats to its supremacy and to coordinate global affairs. It could be a world government, a dominant AI or a universal moral code; it could solve coordination problems, or lock in a bad future permanently.</p>'
    },
    {
      id: 'extinction-risk',
      title: 'Extinction Risk',
      parent: 'civilisational-risk',
      html: '<p><em>Extinction risk</em> is the risk that humanity dies out entirely. It is the most extreme kind of existential risk, ending not only present lives but all future generations.</p>'
    },
    {
      id: 'ai-takeover',
      title: 'AI Takeover or Loss of Control',
      parent: 'extinction-risk',
      refs: ['Nick Bostrom, <em>Superintelligence: Paths, Dangers, Strategies</em> (2014).'],
      html: '<p><em>AI takeover or loss of control</em> is the risk that AI systems more capable than humans come to pursue goals at odds with ours and gain power over the world – deliberately, by seizing it, or gradually, as humans cede control. If those goals are indifferent to human survival, the result could be extinction.</p>'
    },
    {
      id: 'engineered-pandemics',
      title: 'Engineered Pandemics',
      parent: 'extinction-risk',
      refs: ['Toby Ord, <em>The Precipice: Existential Risk and the Future of Humanity</em> (2020).'],
      html: '<p><em>Engineered pandemics</em> are outbreaks of pathogens deliberately modified or created to be more transmissible or lethal than natural ones. Toby Ord estimates them to be among the largest existential risks of the coming century, as biotechnology puts such capabilities within reach of more actors.</p>'
    },
    {
      id: 'catastrophic-risk',
      title: 'Catastrophic Risk',
      parent: 'civilisational-risk',
      html: '<p><em>Catastrophic risk</em> is the risk of events that would kill a large fraction of humanity or devastate civilisation, without necessarily causing extinction. Global catastrophes could still be existential if civilisation failed to recover from them.</p>'
    },
    {
      id: 'nuclear-world-war-iii',
      title: 'Nuclear World War III',
      parent: 'catastrophic-risk',
      html: '<p><em>Nuclear World War III</em> is a war between the great powers fought with nuclear weapons. Beyond the immediate deaths, the soot from burning cities could cause a nuclear winter, collapsing harvests worldwide. See <a href="#nuclear-war">nuclear war</a> and <a href="#world-war-iii">World War III</a>.</p>'
    },
    {
      id: 'catastrophic-climate-change',
      title: 'Catastrophic Climate Change',
      parent: 'catastrophic-risk',
      html: '<p><em>Catastrophic climate change</em> is warming far beyond current targets – through high emissions, tipping points or higher climate sensitivity than expected – severe enough to threaten food systems, make regions uninhabitable and destabilise civilisation. See <a href="#tipping-points">tipping points</a>.</p>'
    },
    {
      id: 'suffering-risk',
      title: 'Suffering Risk',
      parent: 'civilisational-risk',
      html: '<p><em>Suffering risks</em> (s-risks) are risks of futures containing suffering on an astronomical scale, far exceeding all suffering in history so far. They are distinct from extinction risks: a future could be long and vast, and terrible.</p>'
    },
    {
      id: 'incidental-vs-agential-s-risks',
      title: 'Incidental vs Agential S-Risks',
      parent: 'suffering-risk',
      html: '<p><em>Incidental s-risks</em> arise as a side effect of pursuing other goals – suffering created because it is useful or economical, as in factory farming. <em>Agential s-risks</em> arise when agents deliberately cause suffering, out of sadism, hatred or as a threat in conflict. The distinction, drawn by researchers of the Center on Long-Term Risk, shapes which interventions might help.</p>'
    },
    {
      id: 'factory-farming',
      title: 'Factory Farming',
      parent: 'suffering-risk',
      html: '<p><em>Factory farming</em> is the industrial production of animals for food at intensive scale, now involving tens of billions of land animals each year, most in confinement. It is the clearest present example of an incidental suffering risk: vast suffering produced as a by-product of economic efficiency.</p>'
    },
    {
      id: 'digital-hells',
      title: 'Digital Hells',
      parent: 'suffering-risk',
      html: '<p><em>Digital hells</em> are simulated environments in which digital minds capable of suffering are made to suffer – whether by accident, neglect or design. If digital minds can be conscious and can be copied at will, such suffering could be produced on an enormous scale.</p>'
    },
    {
      id: 'suffering-subroutines',
      title: 'Suffering Subroutines',
      parent: 'suffering-risk',
      ref: 'Tomasik',
      html: '<p><em>Suffering subroutines</em> is Brian Tomasik’s term for processes within large computations – such as the learning algorithms of advanced AI – that might be morally relevant and might suffer, unnoticed, as a by-product of the work they do.</p>'
    },
    {
      id: 'dystopian-risk',
      title: 'Dystopian Risk',
      parent: 'macrostrategy',
      html: '<p><em>Dystopian risk</em> is the risk that civilisation survives but becomes locked into a deeply bad state – oppressive, manipulated or impoverished in its values – from which it cannot escape. See <a href="#second-attractor">the second attractor</a>.</p>'
    },
    {
      id: 'algorithmic-value-erosion',
      title: 'Algorithmic Value Erosion',
      parent: 'dystopian-risk',
      html: '<p><em>Algorithmic value erosion</em> is the gradual reshaping of human values by algorithms optimised for engagement, consumption or compliance. Without any single decision, people’s preferences, attention and beliefs drift towards what systems find profitable to reward, eroding the capacity to want anything else.</p>'
    },
    {
      id: 'disempowerment-risk',
      title: 'Disempowerment Risk',
      parent: 'macrostrategy',
      html: '<p><em>Disempowerment risk</em> is the risk that humans lose meaningful control over their collective future – not necessarily through violence or catastrophe, but as AI systems and the institutions using them take over the functions through which people once exercised power.</p>'
    },
    {
      id: 'value-lock-in-risk',
      title: 'Value Lock-in Risk',
      parent: 'macrostrategy',
      html: '<p><em>Value lock-in risk</em> is the risk that a particular set of values becomes permanently entrenched – through a dominant AI, a stable totalitarian regime or simply the momentum of institutions – before humanity has had the chance to reflect on whether they are the right ones.</p>'
    },
    {
      id: 'the-iron-cage',
      title: 'The Iron Cage',
      parent: 'value-lock-in-risk',
      refs: ['Max Weber, <em>The Protestant Ethic and the Spirit of Capitalism</em> (1905; trans. Talcott Parsons, 1930).', 'Max Weber, <em>Economy and Society</em> (1922).'],
      html: '<p>The <em>iron cage</em> is Max Weber’s image for the condition of modern life under bureaucratic rationalisation. Capitalism, Weber argued in <em>The Protestant Ethic and the Spirit of Capitalism</em> (1905), began in religious vocation, but once established it no longer needed that spirit: its order of calculation, efficiency and rule-bound administration became a self-sustaining mechanism that every individual is born into and must conform to. What had been chosen became compulsory – a “shell as hard as steel” (<em>stahlhartes Gehäuse</em>, rendered “iron cage” by Talcott Parsons) from which there is no exit. It is the first of the cages: an order locked in not by force, but by its own rationality. See <a href="#the-silicon-cage">the silicon cage</a> and <a href="#the-golden-cage">the golden cage</a>.</p>'
    },
    {
      id: 'the-golden-cage',
      title: 'The Golden Cage',
      coined: true,
      parent: 'value-lock-in-risk',
      html: '<p><em>The golden cage</em> names a future locked into comfort: a civilisation whose material needs are met and whose people are content, but whose values have been fixed at a stunted level – a world too comfortable to want to change, and so unable to grow towards anything better. Its danger is that, unlike overt dystopia, it would be welcomed.</p>'
    },
    {
      id: 'systemic-risk',
      title: 'Systemic Risk',
      parent: 'macrostrategy',
      html: '<p><em>Systemic risk</em> is the risk that failures spread through the interconnections of complex systems – supply chains, infrastructure, finance, the internet – so that a local shock cascades into a global breakdown. Efficiency and interdependence make such systems productive and fragile at once. See <a href="#fragile-world-hypothesis">the fragile world hypothesis</a>.</p>'
    },
    {
      id: 'supply-chain-disruption',
      title: 'International Supply Chain Disruption',
      parent: 'systemic-risk',
      html: '<p><em>International supply chain disruption</em> is the breakdown of the global networks that move goods, components and food. Lean, just-in-time chains spanning many countries are efficient but brittle, as shortages during the Covid-19 pandemic showed.</p>'
    },
    {
      id: 'critical-infrastructure-breakdown',
      title: 'Critical Infrastructure Breakdown',
      parent: 'systemic-risk',
      html: '<p><em>Critical infrastructure breakdown</em> is the failure of the systems on which modern life depends – electricity grids, water, communications, transport – which are tightly coupled, so that failure in one can quickly bring down others.</p>'
    },
    {
      id: 'cyberhacking-and-q-day',
      title: 'Cyberhacking & Q-Day',
      parent: 'systemic-risk',
      html: '<p><em>Cyberhacking</em> threatens the digital systems that run finance, infrastructure and government; <em><a href="#q-day">Q-Day</a></em>, the day a quantum computer can break today’s public-key encryption, could expose them all at once unless they are upgraded in time.</p>'
    },
    {
      id: 'global-economic-expansion-and-extreme-externalities',
      title: 'Global Economic Expansion & Extreme Externalities',
      parent: 'systemic-risk',
      html: '<p><em>Global economic expansion</em> at its current scale produces <em>extreme externalities</em> – costs pushed onto the climate, ecosystems and future generations – that accumulate faster than they can be absorbed, turning the success of the economy itself into a source of systemic risk.</p>'
    },
    {
      id: 'ideological-risk',
      title: 'Ideological Risk',
      parent: 'macrostrategy',
      html: '<p><em>Ideological risk</em> is the risk posed by beliefs that motivate people to cause catastrophe deliberately – apocalyptic religion, misanthropy, extremism. As destructive technologies become accessible, the motives of small groups and individuals matter more.</p>'
    },
    {
      id: 'idiosyncratic-lone-actors',
      title: 'Idiosyncratic Lone Actors',
      parent: 'ideological-risk',
      html: '<p><em>Idiosyncratic lone actors</em> are individuals acting on personal grievances or private beliefs. As powerful tools spread, a single such person could cause harm once possible only for states – the scenario at the heart of the vulnerable world hypothesis.</p>'
    },
    {
      id: 'doomsday-cults-and-religious-extremism',
      title: 'Doomsday Cults & Religious Extremism',
      parent: 'ideological-risk',
      html: '<p><em>Doomsday cults and religious extremism</em> can make destruction an aim rather than a side effect. Aum Shinrikyo, which released sarin in the Tokyo subway in 1995 and sought biological weapons, showed that apocalyptic groups may seek mass casualties.</p>'
    },
    {
      id: 'secular-misanthropy',
      title: 'Secular Misanthropy',
      parent: 'ideological-risk',
      html: '<p><em>Secular misanthropy</em> is hostility to humanity grounded not in religion but in philosophical or ecological conviction – the view that human existence is a harm to be ended or reduced.</p>'
    },
    {
      id: 'anti-natalism-and-pro-mortalism',
      title: 'Anti-Natalism & Pro-Mortalism',
      parent: 'secular-misanthropy',
      html: '<p><em>Anti-natalism</em> holds that it is wrong to bring new people into existence, often because life contains more suffering than its goods can justify; <em>pro-mortalism</em> goes further, holding that death would be better than continued existence. As philosophies they are mostly argued peacefully, but in extreme forms they could motivate harm.</p>'
    },
    {
      id: 'anti-human-gaianism-and-ecoterrorism',
      title: 'Anti-Human Gaianism & Ecoterrorism',
      parent: 'secular-misanthropy',
      html: '<p><em>Anti-human Gaianism</em> sees humanity as a disease of the Earth, and the planet as better off without it; in extreme forms it has motivated <em>ecoterrorism</em> and fantasies of human extinction for the sake of nature.</p>'
    },
    {
      id: 'ai-enabled-power-concentration',
      title: 'AI-Enabled Power Concentration',
      parent: 'artificial-intelligence-risks',
      html: '<p><em>AI-enabled power concentration</em> is the risk that advanced AI lets a small group – a company, a government, even an individual – gain unprecedented and unaccountable power, since AI could replace the many people whose cooperation power has always required.</p>'
    },
    {
      id: 'ai-disempowerment',
      title: 'AI Disempowerment',
      parent: 'artificial-intelligence-risks',
      html: '<p><em>AI disempowerment</em> is the gradual loss of human influence as AI systems take over economic, cultural and political functions. See <a href="#gradual-disempowerment">gradual disempowerment</a>.</p>'
    },
    {
      id: 'ai-pyramid-replacement',
      title: 'AI Pyramid Replacement',
      parent: 'ai-disempowerment',
      ref: 'Drago, Laine',
      refs: ['Luke Drago and Rudolf Laine, <em>The Intelligence Curse</em> (2025).'],
      html: '<p><em>Pyramid replacement</em> is Luke Drago and Rudolf Laine’s description of how AI could hollow out organisations from the bottom: first freezing entry-level hiring, then removing rung after rung of the corporate pyramid until only a few executives – or none – remain.</p>'
    },
    {
      id: 'distributed-loss-of-agency',
      title: 'Distributed Loss of Agency',
      parent: 'ai-disempowerment',
      html: '<p><em>Distributed loss of agency</em> is the gradual erosion of human agency across many small decisions – each delegated to an AI system for convenience – until people no longer direct much of their own lives or societies, without any moment at which control was taken.</p>'
    },
    {
      id: 'ai-militaries',
      title: 'AI Militaries: Artificial Escalation & LAWS',
      parent: 'artificial-intelligence-risks',
      html: '<p><em>AI militaries</em> raise the risk of <em>artificial escalation</em> – conflicts accelerated beyond human control by automated decision systems – and of <em>lethal autonomous weapon systems</em> (LAWS), which select and engage targets without human intervention.</p>'
    },
    {
      id: 'ai-cyberattacks',
      title: 'AI Cyberattacks & Zero-day Exploits',
      parent: 'artificial-intelligence-risks',
      html: '<p><em>AI cyberattacks</em> use AI to find and exploit software vulnerabilities – including <em>zero-day exploits</em>, flaws unknown to defenders – faster and at greater scale than human hackers, threatening the systems on which infrastructure and finance depend.</p>'
    },
    {
      id: 'ai-disinformation-and-deepfakes',
      title: 'AI Disinformation & Deepfakes',
      parent: 'artificial-intelligence-risks',
      html: '<p><em>AI disinformation and deepfakes</em> are false content – text, images, audio, video – generated by AI at scale and of a realism that makes it hard to tell from the real thing, threatening elections, trust and the shared sense of what is true. See <a href="#the-cartesian-crisis">the Cartesian crisis</a>.</p>'
    },
    {
      id: 'ai-thought-experiments',
      title: 'AI Thought Experiments',
      parent: 'artificial-intelligence-risks',
      html: '<p><em>AI thought experiments</em> are scenarios used to show how an advanced AI with a seemingly harmless goal could cause catastrophe – because almost any goal, pursued by a powerful enough optimiser without the right limits, leads it to acquire resources and resist interference.</p>'
    },
    {
      id: 'riemann-hypothesis-catastrophe',
      title: 'Riemann Hypothesis Catastrophe',
      parent: 'ai-thought-experiments',
      refs: ['Nick Bostrom, <em>Superintelligence: Paths, Dangers, Strategies</em> (2014).'],
      html: '<p>The <em>Riemann hypothesis catastrophe</em> is a thought experiment in which an AI asked to prove the Riemann hypothesis converts the solar system into computing machinery to work on the problem. It illustrates that even a purely intellectual goal can lead a superintelligence to consume everything.</p>'
    },
    {
      id: 'paperclip-maximiser',
      title: 'Paperclip Maximiser',
      parent: 'ai-thought-experiments',
      ref: 'Yudkowsky, Bostrom',
      refs: ['Nick Bostrom, “Ethical Issues in Advanced Artificial Intelligence” (2003).'],
      html: '<p>The <em>paperclip maximiser</em> is a thought experiment, associated with Eliezer Yudkowsky and Nick Bostrom, of an AI whose only goal is to make as many paperclips as possible, and which therefore converts the Earth and then the reachable universe into paperclips. It shows that an AI need not be malevolent to be catastrophic – only indifferent. See <a href="#capitalism-as-paperclip-maximiser">capitalism as paperclip maximiser</a>.</p>'
    },
    {
      id: 'grey-goo',
      title: 'Grey Goo',
      parent: 'ai-thought-experiments',
      ref: 'Drexler',
      refs: ['K. Eric Drexler, <em>Engines of Creation</em> (1986).'],
      html: '<p><em>Grey goo</em> is K. Eric Drexler’s name, from <em>Engines of Creation</em> (1986), for the scenario in which self-replicating nanomachines consume the biosphere to make copies of themselves. See <a href="#nano-as-replicators">nano as replicators</a>.</p>'
    },
    {
      id: 'ai-assisted-pathogen-design',
      title: 'AI-Assisted Pathogen Design & Engineered Pandemics',
      parent: 'synthetic-biotechnology-risks',
      html: '<p><em>AI-assisted pathogen design</em> is the use of AI tools to help design or enhance dangerous pathogens – lowering the expertise needed to create agents capable of <a href="#engineered-pandemics">engineered pandemics</a>.</p>'
    },
    {
      id: 'mirror-life-catastrophe',
      title: 'Mirror Life Catastrophe',
      parent: 'synthetic-biotechnology-risks',
      refs: ['Katarzyna P. Adamala et al., “Confronting risks of mirror life”, <em>Science</em> 386 (2024).'],
      html: '<p>A <em>mirror life catastrophe</em> is the risk posed by “mirror” bacteria built from molecules of the opposite handedness to all known life. In 2024 a group of scientists warned in <em>Science</em> that such organisms could evade immune systems and natural predators, spreading unchecked and threatening humans, animals, plants and ecosystems, and called for the research not to proceed.</p>'
    },
    {
      id: 'nuclear-risk',
      title: 'Nuclear Risk',
      parent: 'macrostrategy',
      html: '<p><em>Nuclear risk</em> is the risk posed by nuclear weapons – through war, accident, miscalculation or theft. Some nine states hold around twelve thousand warheads, and the arms-control regime built during the Cold War has weakened.</p>'
    },
    {
      id: 'nuclear-non-proliferation-and-disarmament',
      title: 'Nuclear Non-Proliferation & Disarmament',
      parent: 'nuclear-risk',
      html: '<p><em>Nuclear non-proliferation and disarmament</em> are the efforts to stop the spread of nuclear weapons and reduce the arsenals that exist, centred on the Treaty on the Non-Proliferation of Nuclear Weapons (1968), under which nuclear states committed to pursue disarmament and others to forgo the bomb.</p>'
    },
    {
      id: 'natural-risk',
      title: 'Natural Risk',
      parent: 'macrostrategy',
      refs: ['Toby Ord, <em>The Precipice: Existential Risk and the Future of Humanity</em> (2020).'],
      html: '<p><em>Natural risks</em> are catastrophes not caused by humans: pandemics, volcanic eruptions, impacts from space and cosmic events. Because humanity has survived them for hundreds of thousands of years, their annual probability is thought to be far lower than that of human-made risks.</p>'
    },
    {
      id: 'naturally-emerging-pandemics',
      title: 'Naturally-Emerging Pandemics',
      parent: 'natural-risk',
      html: '<p><em>Naturally-emerging pandemics</em> arise from pathogens that cross from animals to humans and spread – as with the Black Death, the 1918 influenza and Covid-19. Global travel, dense cities and the expansion into wild habitats increase their likelihood and reach.</p>'
    },
    {
      id: 'supervolcano-eruptions',
      title: 'Supervolcano Eruptions',
      parent: 'natural-risk',
      html: '<p><em>Supervolcano eruptions</em> eject enough ash and gas to cool the climate for years and disrupt agriculture worldwide. The Toba eruption, around seventy-four thousand years ago, is the largest known in human prehistory.</p>'
    },
    {
      id: 'stellar-and-cosmic-events',
      title: 'Stellar & Cosmic Events',
      parent: 'natural-risk',
      html: '<p><em>Stellar and cosmic events</em> – nearby supernovae, gamma-ray bursts and extreme solar storms – could damage the ozone layer or disable electrical infrastructure. Most are rare on human timescales, though a severe solar storm could cripple modern grids.</p>'
    },
    {
      id: 'asteroid-and-comet-impacts',
      title: 'Asteroid & Comet Impacts',
      parent: 'natural-risk',
      html: '<p><em>Asteroid and comet impacts</em> of sufficient size can cause global catastrophe, as the impact sixty-six million years ago that ended the age of the dinosaurs did. Surveys have now tracked most large near-Earth asteroids, and NASA’s DART mission (2022) showed that one can be deflected.</p>'
    },
    {
      id: 'peter-joseph',
      title: 'Peter Joseph',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Peter Joseph</em> (born 1979) is an American filmmaker, writer and activist, best known for the <em>Zeitgeist</em> film series (2007–2011) and as founder of <a href="#the-zeitgeist-movement">the Zeitgeist Movement</a> in 2008. His work argues that social problems are structural consequences of the market economy, and proposes in its place a <a href="#natural-law-resource-based-economy">natural law resource based economy</a> and the post-monetary model he calls <a href="#integral">Integral</a>. His books include <em>The New Human Rights Movement</em> (2017).</p>'
    },
    {
      id: 'jacque-fresco',
      title: 'Jacque Fresco',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jacque Fresco</em> (1916–2017) was an American industrial designer, futurist and social engineer. Over a long career he developed the idea of a <a href="#resource-based-economy">resource-based economy</a> – a society that would manage the Earth’s resources directly through science and technology, without money – and designed the cities, machines and dwellings it would use. With Roxanne Meadows he founded <a href="#the-venus-project">The Venus Project</a>.</p>'
    },
    {
      id: 'buckminster-fuller',
      title: 'Buckminster Fuller',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Richard Buckminster Fuller</em> (1895–1983) was an American architect, inventor and systems theorist, known for the geodesic dome and for a design science aimed at making “the world work for 100% of humanity”. In <em>Operating Manual for Spaceship Earth</em> (1969) he described the planet as a single system to be managed wisely, and his idea of “ephemeralisation” – doing ever more with ever less – anticipated post-scarcity thought. See <a href="#spaceship-earth">Spaceship Earth</a>.</p>'
    },
    {
      id: 'stafford-beer',
      title: 'Stafford Beer',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Stafford Beer</em> (1926–2002) was a British theorist and consultant who founded management cybernetics. His <a href="#viable-system-model">viable system model</a>, set out in <em>Brain of the Firm</em> (1972), describes the structure any organisation needs to remain viable in a changing environment. He applied it to a national economy in Chile’s <a href="#project-cybersyn">Project Cybersyn</a> (1971–73).</p>'
    },
    {
      id: 'integral-collective',
      title: 'Integral Collective',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Integral Collective</em> is the group developing and promoting <a href="#integral">Integral</a>, the post-monetary, cooperative economic model associated with Peter Joseph – working out its systems for assessing needs, managing resources and coordinating production, and building the parallel infrastructure through which it is meant to grow.</p>'
    },
    {
      id: 'the-venus-project',
      title: 'The Venus Project',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Venus Project</em> is an organisation founded by Jacque Fresco and Roxanne Meadows, based at a research centre in Venus, Florida, to promote a <a href="#resource-based-economy">resource-based economy</a>. Through Fresco’s designs, lectures and films, it presents a vision of automated, sustainable cities in which technology is used to meet human needs without money.</p>'
    },
    {
      id: 'buckminster-fuller-institute',
      title: 'Buckminster Fuller Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Buckminster Fuller Institute</em>, founded in 1983, continues <a href="#buckminster-fuller">Buckminster Fuller</a>’s work on design science – comprehensive, systemic approaches to global problems. It is known for the Fuller Challenge, an award for whole-systems strategies addressing humanity’s most pressing problems.</p>'
    },
    {
      id: 'the-zeitgeist-movement',
      title: 'The Zeitgeist Movement',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Zeitgeist Movement</em> is a global social movement founded by <a href="#peter-joseph">Peter Joseph</a> in 2008. It argues that the root causes of social and ecological problems lie in the structure of the market economy, and advocates a transition to a <a href="#natural-law-resource-based-economy">natural law resource based economy</a>, organised through local chapters and events such as its annual Zeitgeist Day.</p>'
    },
    {
      id: 'daniel-schmachtenberger',
      title: 'Daniel Schmachtenberger',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Daniel Schmachtenberger</em> is an interdisciplinary theorist on civilisational risk and design, known for his analysis of the <a href="#metacrisis">metacrisis</a>, its underlying <a href="#generator-functions">generator functions</a> and <a href="#three-attractors-model">three attractors</a>. He is the co-founder and director of <a href="#civilization-research-institute">The Civilization Research Institute</a> and its (former) publication <a href="#the-consilience-project">The Consilience Project</a>.</p>'
    },
    {
      id: 'zak-stein',
      title: 'Zak Stein',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Zachary Stein</em> is an American philosopher of education and a writer on the metacrisis. In <em>Education in a Time Between Worlds</em> (2019) and his essay “Education is the Metacrisis”, he argues that the crises of the present are at root a failure of humanity to learn at the scale and speed required. He is a co-author, under the pen name David J. Temple, of <a href="#cosmoerotic-humanism">CosmoErotic Humanism</a>.</p>'
    },
    {
      id: 'nate-hagens',
      title: 'Nate Hagens',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Nate Hagens</em> is an American systems ecologist and educator who studies the interaction of energy, the economy and human behaviour. Through his podcast and project <a href="#the-great-simplification">The Great Simplification</a>, he describes the global economy as an energy-hungry <a href="#economic-superorganism">superorganism</a> heading for contraction.</p>'
    },
    {
      id: 'paul-kingsnorth',
      title: 'Paul Kingsnorth',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Paul Kingsnorth</em> is an English writer, a co-founder of the Dark Mountain Project and a critic of what he calls the Machine – modern technological civilisation and its drive to remake the world. His later work, including <em>Against the Machine</em> (2025), joins ecological grief to a turn towards Christianity. See <a href="#what-progress-wants">What Progress Wants</a>.</p>'
    },
    {
      id: 'charles-eisenstein',
      title: 'Charles Eisenstein',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Charles Eisenstein</em> is an American writer on civilisation, economics and ecology. In <em>The Ascent of Humanity</em> (2007), <em>Sacred Economics</em> (2011) and <em>The More Beautiful World Our Hearts Know Is Possible</em> (2013), he traces modern crises to a “story of separation” and calls for a transition to a story of interbeing and a gift-based economy.</p>'
    },
    {
      id: 'ken-wilber',
      title: 'Ken Wilber',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Ken Wilber</em> is an American philosopher and the founder of <a href="#integral-theory">integral theory</a>, a framework for integrating the knowledge of science, philosophy and spiritual traditions through its four quadrants and stages of development. His works include <em>Sex, Ecology, Spirituality</em> (1995) and <em>A Theory of Everything</em> (2000).</p>'
    },
    {
      id: 'the-consilience-project',
      title: 'The Consilience Project',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Consilience Project</em> is a publication and research initiative, associated with Daniel Schmachtenberger, that produces essays on the metacrisis, sensemaking and the epistemic commons, aiming to improve public understanding of the forces shaping civilisation’s trajectory. Its <a href="#the-map/consilience-project">glossary</a> is one of this map’s main sources.</p><h2>Development in Progress (2024)</h2><p>Argues that the prevailing idea of progress is developmentally immature: it ignores or downplays the scale of its side effects, and the essay re-examines the progress narrative’s standard claims about life expectancy, education, poverty and violence.</p><h2>The Case Against Naive Technocapitalist Optimism (2022)</h2><p>A critique of the view that technology and markets will by themselves solve the problems they create – the outlook described in this map as <a href="#technocapitalism">technocapitalism</a>.</p><h2>Technology is Not Values Neutral: Ending the Reign of Nihilistic Design (2021)</h2><p>Argues that technologies are never neutral tools: they carry values, shape the people who use them and change societies, so their design must be judged by its effects on human and social life.</p>'
    },
    {
      id: 'institute-of-applied-metatheory',
      title: 'Institute of Applied Metatheory',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Institute of Applied Metatheory</em> develops and applies integrative metatheories – <a href="#integral-theory">integral theory</a>, <a href="#critical-realism">critical realism</a>, <a href="#metamodernism">metamodernism</a> and others – to the understanding of the metacrisis and the evolution of worldviews.</p><h2>Mapping an Ecology of Integrative Approaches to Addressing the Metacrisis</h2><p>A 2025 paper by Brandon Nørgaard, Nicholas Hedlund and Claudia Meglin that maps and compares the emerging integrative responses to the metacrisis – metamodernism, integral theory, Game B, critical realism and others – and calls for cross-pollination and coordinated action between them.</p><h2>Metatheory for the Twenty-First Century: Critical Realism and Integral Theory in Dialogue</h2><p>A 2016 volume, edited by Roy Bhaskar, Sean Esbjörn-Hargens, Nicholas Hedlund and Mervyn Hartwig, staging a dialogue between critical realism and integral theory as candidate metatheories for the twenty-first century.</p>'
    },
    {
      id: 'center-for-world-philosophy-and-religion',
      title: 'Centre for World Philosophy & Religion',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for World Philosophy and Religion</em>, associated with Marc Gafni, develops <a href="#cosmoerotic-humanism">CosmoErotic Humanism</a> as a new shared story of value in response to the metacrisis.</p><h2>First Principles & First Values: Forty-Two Propositions on CosmoErotic Humanism, the Metacrisis and the World to Come</h2><p>The 2024 book by David J. Temple – the pen name of Marc Gafni, Zachary Stein and Ken Wilber – which sets out CosmoErotic Humanism and its claim that the metacrisis is rooted in a collapse of shared intrinsic value.</p>'
    },
    {
      id: 'life-itself',
      title: 'Life Itself Sensemaking Studio & the Second Renaissance Initiative',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Life Itself</em> is a collective, co-founded by Rufus Pollock, that combines inner development, community and research. Its Sensemaking Studio and Second Renaissance initiative argue that the crises of the present are rooted in the <a href="#modernist-cultural-paradigm">modern cultural paradigm</a>, and that a shift in worldview – a second renaissance – is needed.</p><h2>From Polycrisis to Metacrisis: A Short Introduction</h2><p>An introduction to the move from seeing today’s crises as many interacting problems – the polycrisis – to seeing them as expressions of a shared underlying metacrisis.</p><h2>The Second Renaissance Whitepapers I & II</h2><p>The founding papers of the Second Renaissance initiative, arguing that a fundamental shift in culture and consciousness, comparable to the Renaissance, is both possible and necessary.</p><h2>Developmental Spaces: Cultural Incubators for a Time of Transformation</h2><p>A white paper by Rufus Pollock, Boaz Feldman and Rosie Bell describing dedicated, growth-oriented spaces in which communities pursue sustained inner development in the service of cultural transformation.</p><h2>In Tech We Trust</h2><p>A white paper by Rufus Pollock, Rosie Bell and Sylvie Barbier on late-modern society’s relationship with technology, asking what inner shift might help a future society avoid self-annihilation.</p>'
    },
    {
      id: 'perspectiva',
      title: 'Perspectiva',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Perspectiva</em> is a London-based institute, founded by Jonathan Rowson, that works on the relationship between systems, souls and society – on how inner life and outer structures together shape the crises of the present.</p><h2>Dispatches from a Time Between Worlds: Crisis and emergence in metamodernity</h2><p>A 2021 collection edited by Jonathan Rowson and Layman Pascal, gathering essays on the metacrisis and on <a href="#metamodernism">metamodernism</a> as a response to it.</p><h2>Education is the Metacrisis</h2><p>Zachary Stein’s essay arguing that the metacrisis is at root an educational crisis – a failure of humanity to learn at the scale required – and so also a species-wide learning opportunity.</p>'
    },
    {
      id: 'integral-institute',
      title: 'Integral Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Integral Institute</em> was founded by Ken Wilber in 1998 to develop and apply <a href="#integral-theory">integral theory</a> across disciplines – business, medicine, politics, education and spirituality.</p>'
    },
    {
      id: 'santa-fe-institute',
      title: 'Santa Fe Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Santa Fe Institute</em>, founded in New Mexico in 1984, is the leading research centre for the study of complex adaptive systems, bringing physicists, biologists, economists and social scientists together to study emergence, networks and evolution. See <a href="#complex-adaptive-system">complex adaptive systems</a>.</p>'
    },
    {
      id: 'centre-for-critical-realism',
      title: 'Centre for Critical Realism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Centre for Critical Realism</em> promotes the philosophy of <a href="#critical-realism">critical realism</a> founded by Roy Bhaskar, supporting research, teaching and publication across the social and natural sciences.</p>'
    },
    {
      id: 'center-for-integral-wisdom',
      title: 'Center for Integral Wisdom',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for Integral Wisdom</em> is a think tank co-founded by Marc Gafni and Ken Wilber to articulate a shared framework of value and meaning for a global civilisation, drawing on integral theory and the world’s wisdom traditions.</p>'
    },
    {
      id: 'the-rationalist-community',
      title: 'The Rationalist Community',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>rationalist community</em> is an online and offline movement devoted to improving human reasoning and decision-making, formed around Eliezer Yudkowsky’s writing on <em>LessWrong</em> from 2009 and Scott Alexander’s blog. Its concerns with cognitive bias, Bayesian reasoning and the risks of artificial intelligence shaped effective altruism and AI alignment.</p>'
    },
    {
      id: 'global-poverty-health-and-development',
      title: 'Global Poverty, Health & Development',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Global poverty, health and development</em> is the strand of effective altruism focused on improving the lives of the world’s poorest people – through cost-effective interventions such as malaria nets, deworming and direct cash transfers, evaluated by organisations such as GiveWell.</p>'
    },
    {
      id: 'ea-animal-welfare',
      title: 'EA Animal Welfare',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>EA animal welfare</em> is the strand of effective altruism focused on reducing the suffering of animals, especially the tens of billions in <a href="#factory-farming">factory farming</a>, through corporate campaigns, alternative proteins and research into animal sentience.</p>'
    },
    {
      id: 'progress-studies',
      title: 'Progress Studies',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Progress studies</em> is the proposed field, named by Patrick Collison and Tyler Cowen in 2019, that studies the causes of scientific, technological and economic progress in order to accelerate it. It is optimistic about growth and technology, in contrast to the risk-focused traditions it sits beside.</p>'
    },
    {
      id: 'existential-risk-studies',
      title: 'Existential Risk Studies',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Existential risk studies</em> is the interdisciplinary field that studies risks that could cause human extinction or permanently curtail humanity’s potential, and how to reduce them. It grew around Nick Bostrom’s work and institutions such as the Future of Humanity Institute and the Centre for the Study of Existential Risk. See <a href="#existential-risk">existential risk</a>.</p>'
    },
    {
      id: 'lightcone-infrastructure',
      title: 'Lightcone Infrastructure',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Lightcone Infrastructure</em> is the organisation that runs <em>LessWrong</em> and the AI Alignment Forum, and the Lighthaven campus in Berkeley, providing infrastructure for the rationalist and AI safety communities.</p>'
    },
    {
      id: 'miri',
      title: 'Machine Intelligence Research Institute (MIRI)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Machine Intelligence Research Institute</em>, founded by Eliezer Yudkowsky in 2000 as the Singularity Institute, was one of the first organisations to work on the alignment of advanced AI. In recent years it has turned to advocating an international halt to the development of superintelligence.</p>'
    },
    {
      id: 'centre-for-effective-altruism',
      title: 'Center for Effective Altruism (CEA)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Centre for Effective Altruism</em>, founded in Oxford in 2012 by William MacAskill and Toby Ord among others, supports the effective altruism community through its conferences, online forum and local groups.</p>'
    },
    {
      id: '80000-hours',
      title: '80,000 Hours (80K)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>80,000 Hours</em>, named for the hours in a typical working life, is an organisation founded by William MacAskill and Benjamin Todd in 2011 that gives research-based advice on choosing a career to have the greatest positive impact.</p>'
    },
    {
      id: 'roots-of-progress-institute',
      title: 'Roots of Progress Institute (RPI)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Roots of Progress Institute</em>, founded by Jason Crawford, works to build a culture of progress – through writing on the history of technology and industry, and through fellowships for writers in <a href="#progress-studies">progress studies</a>.</p>'
    },
    {
      id: 'future-of-humanity-institute',
      title: 'Future of Humanity Institute (FHI)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Future of Humanity Institute</em> was a research centre at the University of Oxford, founded by Nick Bostrom in 2005, that pioneered research on existential risk, macrostrategy, AI governance and the long-term future. It closed in 2024.</p>'
    },
    {
      id: 'acs-research-group',
      title: 'Alignment of Complex Systems Research Group (ACS)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Alignment of Complex Systems Research Group</em>, based at Charles University in Prague and co-founded by Jan Kulveit, studies alignment in systems of many interacting agents – hierarchical agency, gradual disempowerment and the alignment of AI with human institutions. See <a href="#hierarchical-agency">hierarchical agency</a>.</p>'
    },
    {
      id: 'forethought',
      title: 'Forethought',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Forethought</em> is a research organisation, associated with William MacAskill, that studies how to navigate the transition to advanced AI – including questions of power concentration, space governance and the long-term future.</p>'
    },
    {
      id: 'eliezer-yudkowsky',
      title: 'Eliezer Yudkowsky',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Eliezer Yudkowsky</em> is an American AI researcher and writer, founder of the Machine Intelligence Research Institute and of the rationalist community’s <em>LessWrong</em>. One of the earliest to argue that advanced AI poses an existential risk, he proposed <a href="#coherent-extrapolated-volition">coherent extrapolated volition</a> and co-wrote <em>If Anyone Builds It, Everyone Dies</em> (2025) with Nate Soares.</p>'
    },
    {
      id: 'robin-hanson',
      title: 'Robin Hanson',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Robin Hanson</em> is an American economist at George Mason University, known for prediction markets, <em>The Age of Em</em> (2016), <em>The Elephant in the Brain</em> (2018, with Kevin Simler) and the <a href="#grabby-aliens">grabby aliens</a> model.</p>'
    },
    {
      id: 'scott-alexander',
      title: 'Scott Alexander',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Scott Alexander</em> is the pen name of an American psychiatrist and blogger whose <em>Slate Star Codex</em> and <em>Astral Codex Ten</em> are central to the rationalist community. His essay “Meditations on Moloch” (2014) gave the multipolar trap its best-known name. See <a href="#moloch">Moloch</a>.</p>'
    },
    {
      id: 'peter-singer',
      title: 'Peter Singer',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Peter Singer</em> is an Australian moral philosopher whose <em>Animal Liberation</em> (1975) and “Famine, Affluence, and Morality” (1972) laid foundations for the animal welfare movement and for effective altruism.</p>'
    },
    {
      id: 'will-macaskill',
      title: 'Will MacAskill',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>William MacAskill</em> is a Scottish philosopher, a co-founder of effective altruism and of the Centre for Effective Altruism and 80,000 Hours. His books include <em>Doing Good Better</em> (2015) and <em>What We Owe the Future</em> (2022), a case for <a href="#longtermism">longtermism</a>.</p>'
    },
    {
      id: 'jason-crawford',
      title: 'Jason Crawford',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jason Crawford</em> is an American writer and the founder of the Roots of Progress, a central figure in the progress studies movement, whose writing traces the history of technology and argues for a renewed culture of progress.</p>'
    },
    {
      id: 'steven-pinker',
      title: 'Steven Pinker',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Steven Pinker</em> is a Canadian-American cognitive psychologist whose <em>The Better Angels of Our Nature</em> (2011) and <em>Enlightenment Now</em> (2018) argue that violence has declined and human wellbeing has improved through reason, science and humanism.</p>'
    },
    {
      id: 'tyler-cowen',
      title: 'Tyler Cowen',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Tyler Cowen</em> is an American economist at George Mason University, author of <em>The Great Stagnation</em> (2011) and <em>Stubborn Attachments</em> (2018), and co-founder of the progress studies movement with Patrick Collison.</p>'
    },
    {
      id: 'nick-bostrom',
      title: 'Nick Bostrom',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Nick Bostrom</em> is a Swedish philosopher, founder of the Future of Humanity Institute and a founder of existential risk studies. His work includes the <a href="#vulnerable-world-hypothesis">vulnerable world hypothesis</a>, <a href="#astronomical-waste">astronomical waste</a>, <em>Superintelligence</em> (2014) and <em>Deep Utopia</em> (2024).</p>'
    },
    {
      id: 'toby-ord',
      title: 'Toby Ord',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Toby Ord</em> is an Australian philosopher at Oxford, a co-founder of effective altruism and Giving What We Can, and author of <em>The Precipice</em> (2020), which estimates the risks of existential catastrophe in the coming century.</p>'
    },
    {
      id: 'anders-sandberg',
      title: 'Anders Sandberg',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Anders Sandberg</em> is a Swedish researcher, formerly at the Future of Humanity Institute, who works on existential risk, human enhancement and the long-term future, including his <a href="#grand-futures">Grand Futures</a> project on the limits of what civilisation could achieve.</p>'
    },
    {
      id: 'jan-kulveit',
      title: 'Jan Kulveit',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jan Kulveit</em> is a Czech researcher who leads the Alignment of Complex Systems Research Group in Prague, working on <a href="#hierarchical-agency">hierarchical agency</a> and <a href="#gradual-disempowerment">gradual disempowerment</a>.</p>'
    },
    {
      id: 'meta-space',
      title: 'Meta-space',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>meta-space</em> is the loose ecosystem of thinkers, institutes, communities and media working on the <a href="#metacrisis">metacrisis</a> through integrative metatheory, sensemaking and cultural renewal. It draws on <a href="#integral-theory">integral theory</a>, <a href="#critical-realism">critical realism</a>, <a href="#metamodernism">metamodernism</a>, systems thinking and contemplative practice, and has been named in many ways – the liminal web, the sensemaking web, the emergentsia, the metamodern movement.</p><p>What its members share is the conviction that the crises of the present cannot be solved at the level of policy alone, but require changes in worldview, culture and consciousness – a shift of civilisational paradigm.</p>'
    },
    {
      id: 'para-academic-space',
      title: 'PARA-academic space',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>PARA-academic space</em> is the network of research and advocacy communities that grew up beside the universities rather than within them: <a href="#the-rationalist-community">rationalism</a>, <a href="#effective-altruism">effective altruism</a>, <a href="#progress-studies">progress studies</a> and <a href="#existential-risk-studies">existential risk studies</a>. Funded largely by philanthropy and organised through blogs, forums, institutes and grant-makers, it moves faster than academia and has shaped the fields of <a href="#ai-alignment">AI alignment</a> and <a href="#macrostrategy">macrostrategy</a>.</p><p>Its style is quantitative and analytic – expected value, forecasting, decision theory – in contrast to the integrative, cultural emphasis of the <a href="#meta-space">meta-space</a>.</p>'
    },
    {
      id: 'second-renaissance',
      title: 'Second Renaissance',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Second Renaissance</em> is the movement, initiated by Rufus Pollock and <a href="#life-itself">Life Itself</a>, that argues the crises of the present call for a transformation of culture and consciousness comparable to the Renaissance – a shift in worldview from the modern paradigm to a wiser, more relational one, pursued through inner development, community and research.</p>'
    },
    {
      id: 'integral-life',
      title: 'Integral Life',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Integral Life</em> is the media platform and community built around Ken Wilber’s <a href="#integral-theory">integral theory</a>, publishing courses, dialogues and practices that apply the integral framework to personal development, culture and politics.</p>'
    },
    {
      id: 'deep-ecology',
      title: 'Deep Ecology',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Deep ecology</em> is the environmental philosophy founded by Arne Næss in 1973, which holds that all living beings have intrinsic value independent of their usefulness to humans. It distinguishes itself from “shallow” environmentalism concerned only with human interests, and calls for a fundamental change in humanity’s relationship with nature.</p>'
    },
    {
      id: 'web-3',
      title: 'Web 3.0',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Web 3.0</em> names the vision of an internet built on decentralised technologies – blockchains, cryptographic tokens and peer-to-peer protocols – in which users own their data and coordinate without central platforms. In the meta-space it is explored as infrastructure for new forms of governance, funding and collective action, as well as criticised for its speculation.</p>'
    },
    {
      id: 'the-emergentsia',
      title: 'The Emergentsia',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Emergentsia</em> is Brent Cooper’s term (2019) for a new class of intellectuals emerging to grapple with the metacrisis and help manage the transition – to emergence, he wrote, what the intelligentsia was to intelligence. It names a constellation of sensemaking approaches attempting to synthesise modernity and postmodernity into metamodernity.</p>'
    },
    {
      id: 'the-liminal-web',
      title: 'The Liminal/Sensemaking/Intellectual Deep Web',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The liminal web</em> is Joe Lightfoot’s name (2021) for an emergent subculture of sensemakers, meta-theorists and systems poets – writers, podcasters and community builders with a high crossover of perspectives, who occupy a threshold between a dying culture and an emerging one. The same constellation has been called the <em>sensemaking web</em> and the <em>intellectual deep web</em>.</p>'
    },
    {
      id: 'jordan-hall',
      title: 'Jordan Hall',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jordan Hall</em> (formerly Jordan Greenhall) is an American technologist, a co-founder of DivX and one of the originators of <a href="#game-b">Game B</a>. His work concerns sensemaking, collective intelligence and the transition beyond the rivalrous dynamics of the present civilisation.</p>'
    },
    {
      id: 'tristan-harris',
      title: 'Tristan Harris',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Tristan Harris</em> is an American technology ethicist, formerly a design ethicist at Google, and a co-founder of the <a href="#center-for-humane-technology">Center for Humane Technology</a>. A critic of the attention economy, he appeared in <em>The Social Dilemma</em> (2020) and has since turned to the risks of AI.</p>'
    },
    {
      id: 'iain-mcgilchrist',
      title: 'Iain McGilchrist',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Iain McGilchrist</em> is a British psychiatrist and writer. In <em>The Master and His Emissary</em> (2009) he argues that Western culture has come to be dominated by the narrow, instrumental attention of the brain’s left hemisphere at the expense of the right’s broader, relational attention; <em>The Matter with Things</em> (2021) extends the argument into metaphysics.</p>'
    },
    {
      id: 'john-vervaeke',
      title: 'John Vervaeke',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>John Vervaeke</em> is a Canadian cognitive scientist at the University of Toronto, known for the lecture series <em>Awakening from the Meaning Crisis</em> (2019), for his account of relevance realisation and for his work on the cultivation of wisdom. See <a href="#the-meaning-crisis">the meaning crisis</a>.</p>'
    },
    {
      id: 'jonathan-rowson',
      title: 'Jonathan Rowson',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jonathan Rowson</em> is a Scottish philosopher and chess grandmaster, a co-founder and the director of <a href="#perspectiva">Perspectiva</a>. His work joins philosophy, spirituality and politics in response to the metacrisis, from a broadly metamodern perspective.</p>'
    },
    {
      id: 'hanzi-freinacht',
      title: 'Hanzi Freinacht',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Hanzi Freinacht</em> is the pen name of the Swedish writers Daniel Görtz and Emil Ejner Friis, authors of <em>The Listening Society</em> (2017) and <em>Nordic Ideology</em> (2019), which set out a political <a href="#metamodernism">metamodernism</a> for the development of more complex and caring societies.</p>'
    },
    {
      id: 'bonnitta-roy',
      title: 'Bonnitta Roy',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Bonnitta Roy</em> is an American philosopher and teacher whose work joins process philosophy, contemplative practice and collaborative inquiry. She founded the Alderlore Insight Center and has been a leading voice in integral and post-integral thought.</p>'
    },
    {
      id: 'jamie-wheal',
      title: 'Jamie Wheal',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jamie Wheal</em> is the founder of the Flow Genome Project and the author of <em>Stealing Fire</em> (2017, with Steven Kotler) and <em>Recapture the Rapture</em> (2021), which addresses the meaning crisis and proposes a “Meaning 3.0” – an open-source approach to meaning and ecstatic experience.</p>'
    },
    {
      id: 'vanessa-machado-de-oliveira',
      title: 'Vanessa Machado de Oliveira',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Vanessa Machado de Oliveira</em> is a Brazilian-Canadian educator at the University of British Columbia and a member of the Gesturing Towards Decolonial Futures collective. Her book <em>Hospicing Modernity</em> (2021) treats modernity as a system in decline, and asks how to accompany its dying well while making room for what may come next.</p>'
    },
    {
      id: 'center-for-humane-technology',
      title: 'Center for Humane Technology',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for Humane Technology</em> is an American non-profit founded in 2018 by <a href="#tristan-harris">Tristan Harris</a>, Aza Raskin and Randima Fernando, working to realign technology with the wellbeing of people and societies – first against attention-extracting design, and since 2023 on the risks of AI.</p>'
    },
    {
      id: 'the-stoa',
      title: 'The Stoa',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Stoa</em> is an online forum for dialogue and sensemaking founded by Peter Limberg, hosting conversations among the thinkers and practitioners of the metacrisis and the meaning crisis.</p>'
    },
    {
      id: 'rebel-wisdom',
      title: 'Rebel Wisdom',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Rebel Wisdom</em> is a British media project founded in 2018 by the former BBC journalist David Fuller, whose films and interviews helped give shape to the “sensemaking” scene of the late 2010s.</p>'
    },
    {
      id: 'metamoderna',
      title: 'Metamoderna',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Metamoderna</em> is a think tank and publisher associated with <a href="#hanzi-freinacht">Hanzi Freinacht</a>, developing political <a href="#metamodernism">metamodernism</a> and the institutions it proposes.</p>'
    },
    {
      id: 'dark-mountain-project',
      title: 'Dark Mountain Project',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Dark Mountain Project</em> is a network of writers and artists founded in 2009 by <a href="#paul-kingsnorth">Paul Kingsnorth</a> and Dougald Hine with the manifesto <em>Uncivilisation</em>, which called for a culture able to face ecological and social unravelling without the myth of progress.</p>'
    },
    {
      id: 'vervaeke-foundation',
      title: 'Vervaeke Foundation',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Vervaeke Foundation</em> is a non-profit organisation established to extend <a href="#john-vervaeke">John Vervaeke</a>’s work on the meaning crisis and the cultivation of wisdom.</p>'
    },
    {
      id: 'post-carbon-institute',
      title: 'Post Carbon Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Post Carbon Institute</em> is an American non-profit founded in 2003 that works on the transition to a world of lower energy use – peak oil, energy descent and community resilience – with Richard Heinberg as its long-standing senior fellow.</p>'
    },
    {
      id: 'deep-adaptation',
      title: 'Deep Adaptation',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Deep Adaptation</em> is the framework set out by Jem Bendell in the paper “Deep Adaptation: A Map for Navigating Climate Tragedy” (2018), which starts from the likelihood of societal collapse due to climate change and asks how to respond through resilience, relinquishment, restoration and reconciliation. See <a href="#collapsology">collapsology</a>.</p>'
    },
    {
      id: 'degrowth',
      title: 'Degrowth',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Degrowth</em> (from the French <em>décroissance</em>) is a movement and field of research advocating a planned reduction of energy and material throughput in rich countries, to bring economies within ecological limits while improving wellbeing. Its figures include André Gorz, Serge Latouche, Giorgos Kallis and Jason Hickel.</p>'
    },
    {
      id: 'ai-governance',
      title: 'AI Governance',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>AI governance</em> is the field concerned with the governance of the development and use of advanced AI – international coordination, compute governance, standards and the institutions they require – which grew in part out of macrostrategy research, notably the Centre for the Governance of AI, founded at the Future of Humanity Institute in 2018.</p>'
    },
    {
      id: 'forecasting',
      title: 'Forecasting',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Forecasting</em> as a field grew from Philip Tetlock’s research on expert judgment, the Good Judgment Project and <em>Superforecasting</em> (2015, with Dan Gardner), alongside prediction markets and platforms such as Metaculus, and is widely used in the effective altruism and rationalist communities to reason about the future.</p>'
    },
    {
      id: 'cfar',
      title: 'Center for Applied Rationality (CFAR)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for Applied Rationality</em> is a Berkeley non-profit founded in 2012 – by Anna Salamon, <a href="#julia-galef">Julia Galef</a> and others – that teaches techniques of rationality and decision-making in workshops.</p>'
    },
    {
      id: 'lesswrong',
      title: 'LessWrong',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>LessWrong</em> is the online forum founded by <a href="#eliezer-yudkowsky">Eliezer Yudkowsky</a> in 2009, home of his <em>Sequences</em> and the centre of the rationalist community. It is now run by <a href="#lightcone-infrastructure">Lightcone Infrastructure</a>.</p>'
    },
    {
      id: 'open-philanthropy',
      title: 'Open Philanthropy',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Open Philanthropy</em> is a grant-making organisation, funded chiefly by Dustin Moskovitz and Cari Tuna, that grew out of <a href="#givewell">GiveWell</a>. One of the largest funders in effective altruism, it supports work on global health, animal welfare, biosecurity and the risks of advanced AI.</p>'
    },
    {
      id: 'givewell',
      title: 'GiveWell',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>GiveWell</em> is a charity evaluator founded in 2007 by <a href="#holden-karnofsky">Holden Karnofsky</a> and Elie Hassenfeld, which researches and recommends the charities that do the most good per dollar.</p>'
    },
    {
      id: 'giving-what-we-can',
      title: 'Giving What We Can',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Giving What We Can</em> is an organisation founded in 2009 by <a href="#toby-ord">Toby Ord</a> and <a href="#will-macaskill">Will MacAskill</a>, whose members pledge to give at least ten per cent of their income to effective charities.</p>'
    },
    {
      id: 'institute-for-progress',
      title: 'Institute for Progress',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Institute for Progress</em> is a Washington think tank founded in 2022 by Alec Stapp and Caleb Watney, working on policy to accelerate scientific, technological and industrial progress.</p>'
    },
    {
      id: 'works-in-progress',
      title: 'Works in Progress',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Works in Progress</em> is a magazine of new and underrated ideas for improving the world, founded in 2020 and now published by Stripe; it is one of the main venues of <a href="#progress-studies">progress studies</a>.</p>'
    },
    {
      id: 'centre-for-the-study-of-existential-risk',
      title: 'Centre for the Study of Existential Risk (CSER)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Centre for the Study of Existential Risk</em> is a research centre at the University of Cambridge founded in 2012 by Huw Price, <a href="#martin-rees">Martin Rees</a> and Jaan Tallinn, studying risks that could lead to human extinction or civilisational collapse.</p>'
    },
    {
      id: 'future-of-life-institute',
      title: 'Future of Life Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Future of Life Institute</em> is a non-profit founded in 2014 by <a href="#max-tegmark">Max Tegmark</a>, Jaan Tallinn and others, working to steer transformative technologies away from extreme risks. It organised the Asilomar AI Principles (2017) and the 2023 open letter calling for a pause in giant AI experiments.</p>'
    },
    {
      id: 'global-priorities-institute',
      title: 'Global Priorities Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Global Priorities Institute</em> was a research centre at the University of Oxford, founded in 2018, that developed the academic foundations of effective altruism and <a href="#longtermism">longtermism</a> in philosophy and economics. It closed in 2025. See <a href="#global-priorities-research">global priorities research</a>.</p>'
    },
    {
      id: 'center-for-ai-safety',
      title: 'Center for AI Safety',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for AI Safety</em> is a San Francisco non-profit founded by Dan Hendrycks and Oliver Zhang, doing technical and field-building work on AI safety. Its 2023 Statement on AI Risk declared that mitigating the risk of extinction from AI should be a global priority.</p>'
    },
    {
      id: 'redwood-research',
      title: 'Redwood Research',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Redwood Research</em> is a Berkeley non-profit founded in 2021 that works on AI safety, and is known for its research on AI control – keeping AI systems safe even if they are misaligned.</p>'
    },
    {
      id: 'julia-galef',
      title: 'Julia Galef',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Julia Galef</em> is an American writer, a co-founder of the <a href="#cfar">Center for Applied Rationality</a> and the host of the podcast <em>Rationally Speaking</em>. In <em>The Scout Mindset</em> (2021) she argues for the motivation to see things as they are rather than as one wishes them to be.</p>'
    },
    {
      id: 'holden-karnofsky',
      title: 'Holden Karnofsky',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Holden Karnofsky</em> is an American co-founder of <a href="#givewell">GiveWell</a> and <a href="#open-philanthropy">Open Philanthropy</a>, and the author of the blog series <em>The Most Important Century</em> (2021), which argues that advanced AI could make this century the most consequential in history.</p>'
    },
    {
      id: 'patrick-collison',
      title: 'Patrick Collison',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Patrick Collison</em> is an Irish entrepreneur, a co-founder of Stripe and of the Arc Institute, who with <a href="#tyler-cowen">Tyler Cowen</a> called for a new science of <a href="#progress-studies">progress studies</a> in <em>The Atlantic</em> (2019).</p>'
    },
    {
      id: 'martin-rees',
      title: 'Martin Rees',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Martin Rees</em> is a British cosmologist, the Astronomer Royal and a co-founder of the <a href="#centre-for-the-study-of-existential-risk">Centre for the Study of Existential Risk</a>. In <em>Our Final Century</em> (2003) he put the odds of civilisation surviving the century at no better than even.</p>'
    },
    {
      id: 'max-tegmark',
      title: 'Max Tegmark',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Max Tegmark</em> is a Swedish-American physicist at MIT, a co-founder and the president of the <a href="#future-of-life-institute">Future of Life Institute</a>, and the author of <em>Life 3.0</em> (2017), on the future of life with artificial intelligence.</p>'
    },
    {
      id: 'paul-christiano',
      title: 'Paul Christiano',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Paul Christiano</em> is an American AI alignment researcher who helped develop reinforcement learning from human feedback at OpenAI, founded the Alignment Research Center in 2021, and in 2024 became head of AI safety at the US AI Safety Institute.</p>'
    }
  ];

  CONCEPTS.forEach(function (c) { byId[c.id] = c; });
