      parent: 'hyper-agents',
      ref: 'Fredona and Reinert',
      html: '<p><em>Kraken</em> is the figure Robert Fredona and Sophus Reinert set beside Hobbes’s Leviathan in “Leviathan and Kraken: States, Corporations, and Political Economy” (<em>History and Theory</em>, 2020). Where Leviathan stands for the state, the kraken – a sea monster of many arms – stands for the corporation: a body that is also an artificial person, reaching across borders and sometimes rivalling the state itself.</p><p>Tracing the chartered trading companies of early modern Europe, they argue that political economy has always been shaped by the relation between these two monsters, not by states alone.</p>'
    },
    {
      id: '4e-cognition',
      refs: ['Francisco J. Varela, Evan Thompson and Eleanor Rosch, <em>The Embodied Mind: Cognitive Science and Human Experience</em> (1991).', 'Andy Clark and David Chalmers, “The Extended Mind”, <em>Analysis</em> 58, no. 1 (1998).'],
      title: '4E Cognition',
      parent: '4e-ontology',
      html: '<p><em>4E cognition</em> is the family of approaches in cognitive science holding that the mind is <em>embodied</em> (shaped by the body), <em>embedded</em> (dependent on its environment), <em>enacted</em> (brought forth through activity) and <em>extended</em> (reaching into tools and other people). It developed from Francisco Varela, Evan Thompson and Eleanor Rosch’s <em>The Embodied Mind</em> (1991) and Andy Clark and David Chalmers’s “The Extended Mind” (1998).</p><p>Against the picture of the mind as a computer sealed in the skull, it treats cognition as something that happens between an organism and its world. It is the source on which the map’s other 4E concepts build.</p>'
    },
    {
      id: 'natural-order',
      title: 'Natural Order',
      parent: 'civilisational-mechanics',
      html: '<p><em>Natural order</em> is order that exists independently of human design or action: the regularities of physics, the cycles of ecosystems, the structures of living things. In older political thought the phrase also named the order supposedly given by nature or God – the physiocrats’ <em>ordre naturel</em>, or a fixed hierarchy of beings – against which human arrangements could be judged.</p>'
    },
    {
      id: 'artificial-order',
      title: 'Artificial Order',
      parent: 'civilisational-mechanics',
      html: '<p><em>Artificial order</em> is order deliberately designed and imposed: a plan, a code of law, an organisation, a machine. Friedrich Hayek called it <em>taxis</em> – made order – and contrasted it with the <em>kosmos</em> of spontaneous order, arguing that designed orders can only be as complex as their designers can understand.</p>'
    },
    {
      id: 'spontaneous-order',
      refs: ['Adam Ferguson, <em>An Essay on the History of Civil Society</em> (1767).', 'Michael Polanyi, <em>The Logic of Liberty</em> (1951).', 'F. A. Hayek, <em>Law, Legislation and Liberty</em>, vol. 1, <em>Rules and Order</em> (1973).'],
      title: 'Spontaneous Order',
      parent: 'civilisational-mechanics',
      html: '<p><em>Spontaneous order</em> is order that emerges from the interaction of many individuals following their own purposes, without anyone designing it: languages, markets, common law, the paths worn across a field. The idea runs from the Scottish Enlightenment – Adam Ferguson’s “the result of human action, but not of human design” – to Michael Polanyi, who coined the term, and Friedrich Hayek, who made it central to his defence of the market.</p><p>Its critics accept that such orders arise but deny that they are reliably benign: the same processes can produce disorder, or orders no one would choose.</p>'
    },
    {
      id: 'technological-revolutions',
      title: 'Technological Revolutions',
      parent: 'civilisational-mechanics',
      html: '<p><em>Technological revolutions</em> are the transformations in which a new set of technologies reorganises the whole of a society – how it produces, communicates, fights and lives. They are revolutions not because they are sudden but because they change the ground on which everything else stands; each has taken generations to unfold.</p><p>The usual sequence runs from the agricultural and industrial revolutions to the information revolution, with the economist Carlota Perez among those who have traced their recurring pattern of installation, financial bubble and deployment.</p>'
    },
    {
      id: 'cognitive-evolution',
      title: 'Cognitive Evolution',
      parent: 'technological-revolutions',
      html: '<p><em>Cognitive evolution</em> is the long development of the human capacities for language, symbolic thought, cooperation and cumulative culture that preceded and made possible every later revolution. Some place a decisive shift around 70,000 years ago – the “cognitive revolution” of Yuval Noah Harari’s <em>Sapiens</em> (2011) – while others, such as Merlin Donald and Michael Tomasello, describe a series of stages in which minds, culture and social life evolved together.</p>'
    },
    {
      id: 'agricultural-revolution',
      title: 'Agricultural Revolution',
      parent: 'technological-revolutions',
      html: '<p>The <em>agricultural revolution</em> – the Neolithic revolution, in V. Gordon Childe’s phrase – is the transition, beginning around 12,000 years ago in several regions independently, from foraging to farming and settled life. It made possible surplus, cities, writing and the state, and also brought inequality, epidemic disease and organised war on a new scale.</p>'
    },
    {
      id: 'industrial-revolution',
      title: 'Industrial Revolution',
      parent: 'technological-revolutions',
      html: '<p>The <em>Industrial Revolution</em> is the transformation that began in Britain in the late eighteenth century, as machines driven by coal and steam took over production in factories. It broke the long pattern in which economic growth was soon swallowed by population, and began the sustained rise in output and living standards – and in fossil-fuel use – that continues today.</p>'
    },
    {
      id: 'information-revolution',
      title: 'Information Revolution',
      parent: 'technological-revolutions',
      html: '<p>The <em>information revolution</em> is the transformation driven by digital computing and networked communication from the mid-twentieth century: the microprocessor, the internet and the smartphone. It made information cheap to copy and move, reorganised work and media around data, and gave rise to new concentrations of power in the platforms that mediate it.</p>'
    },
    {
      id: 'intelligence-revolution',
      title: 'Intelligence Revolution',
      parent: 'technological-revolutions',
      html: '<p>The <em>intelligence revolution</em> is the transformation now under way as artificial intelligence takes on tasks of perception, language, judgement and decision once reserved for people. Where earlier revolutions mechanised muscle and then information, this one automates cognition itself – and with it the possibility that the systems doing the work also come to direct it.</p>'
    },
    {
      id: 'capitalism',
      title: 'Capitalism',
      parent: 'civilisational-mechanics',
      html: '<p><em>Capitalism</em> is an economic system in which the means of production are privately owned and operated for profit, and in which goods, services and labour are exchanged in markets. Its defining dynamic is accumulation: profit is reinvested to produce further profit, so that the system must grow to remain stable.</p><p>Its history is usually told in stages – mercantile, industrial, financial, digital – each reorganising production, work and power, and each with its own crises and critics, from Marx to the present.</p>'
    },
    {
      id: 'primitive-accumulation',
      refs: ['Karl Marx, <em>Capital: A Critique of Political Economy</em>, vol. 1 (1867), part VIII.'],
      title: 'Primitive Accumulation',
      parent: 'capitalism',
      ref: 'Marx',
      html: '<p><em>Primitive accumulation</em> is Karl Marx’s term, in the first volume of <em>Capital</em> (1867), for the process by which capitalism began: not through thrift, as its defenders claimed, but through the forcible separation of people from the land and means of subsistence – enclosure, colonial plunder and the slave trade. It created both the concentrated wealth and the propertyless workers that capitalist production required.</p><p>Later writers, from Rosa Luxemburg to David Harvey’s “accumulation by dispossession”, argued that it is not only a historical origin but a continuing process.</p>'
    },
    {
      id: 'industrial-capitalism',
      title: 'Industrial Capitalism',
      parent: 'capitalism',
      html: '<p><em>Industrial capitalism</em> is the form capitalism took with the Industrial Revolution, when profit came chiefly from factory production using wage labour and machinery. It gave rise to the industrial working class, the factory town and the modern labour movement, and to the classic analyses of Marx, Engels and Weber.</p>'
    },
    {
      id: 'late-stage-capitalism',
      refs: ['Ernest Mandel, <em>Late Capitalism</em> (1972).', 'Fredric Jameson, <em>Postmodernism, or, the Cultural Logic of Late Capitalism</em> (1991).'],
      title: 'Late-Stage Capitalism',
      parent: 'capitalism',
      html: '<p><em>Late-stage capitalism</em> – late capitalism, from Werner Sombart’s <em>Spätkapitalismus</em> – names a period in which capitalism is understood to have reached a mature or declining phase. Ernest Mandel’s <em>Late Capitalism</em> (1972) and Fredric Jameson’s <em>Postmodernism, or, the Cultural Logic of Late Capitalism</em> (1991) gave it its modern sense; in popular usage the phrase now names the absurdities and indignities of a market reaching into every corner of life.</p>'
    },
    {
      id: 'techno-feudalism',
      refs: ['Cédric Durand, <em>Techno-féodalisme: Critique de l’économie numérique</em> (2020).', 'Yanis Varoufakis, <em>Technofeudalism: What Killed Capitalism</em> (2023).'],
      title: 'Techno-Feudalism',
      parent: 'capitalism',
      html: '<p><em>Techno-feudalism</em> is the thesis, advanced by Yanis Varoufakis in <em>Technofeudalism</em> (2023) and Cédric Durand in <em>Techno-féodalisme</em> (2020), that digital platforms have begun to replace capitalism with something closer to feudalism. Profit from producing goods for markets gives way to rent extracted from those who must use the platforms – “cloud capital” – so that users and businesses become something like vassals of the owners of the digital estate.</p>'
    },
    {
      id: 'civilisation-alignment',
      title: 'Civilisation Alignment',
      parent: 'macrostrategy',
      html: '<p><em>Civilisation alignment</em> is the problem of aligning civilisation as a whole – its economies, states, technologies and cultures – with the wellbeing of the people and the living world it depends on. It extends the question of <a href="#ai-alignment">AI alignment</a> from a single artificial system to the larger system of which AI is only the newest part: markets, institutions and nation-states are themselves optimising processes that pursue proxies of value (profit, growth, power) and can drift away from the ends they were meant to serve.</p><p>Seen this way, a misaligned civilisation is one whose institutions reward what they were never meant to – short-term gain, unpriced harm, power for its own sake – and so drift towards outcomes no one chose. Aligning it means changing what the system rewards until it coincides with what is actually good – a problem that, unlike AI alignment, has been worked on for as long as there have been constitutions. See also <a href="#the-great-alignment">the great alignment</a>.</p>'
    },
    {
      id: 'civilisational-collapse',
      title: 'Civilisational Collapse',
      parent: 'metacrisis',
      html: '<p><em>Civilisational collapse</em> is the rapid, lasting loss of a civilisation’s social, political and economic complexity – the breakdown of its institutions, its capacity to coordinate and its ability to sustain its population. Joseph Tainter’s <em>The Collapse of Complex Societies</em> (1988) explained it as the point at which further investment in complexity yields diminishing and then negative returns; Jared Diamond’s <em>Collapse</em> (2005) stressed environmental overshoot and the choices societies make in response to it.</p><p>Historical collapses – the Western Roman Empire, the Classic Maya, Bronze Age Mediterranean civilisation – were regional. The question the present raises is whether a single, globally interconnected civilisation could collapse as a whole, and whether its recovery would be possible at all. See <a href="#critical-collapsology">critical collapsology</a>, <a href="#civilisational-risk">civilisational risk</a> and <a href="#existential-risk">existential risk</a>.</p>'
    },
    {
      id: 'civilisational-risk',
      title: 'Civilisational Risk',
      parent: 'metacrisis',
      html: '<p><em>Civilisational risk</em> is risk to civilisation as a whole: hazards severe enough to cause <a href="#civilisational-collapse">civilisational collapse</a>, or to set civilisation back by generations, even where they fall short of human extinction. It sits between global catastrophic risk, which is measured in lives and damage, and <a href="#existential-risk">existential risk</a>, which concerns the permanent loss of humanity’s future.</p><p>Its sources range from climate breakdown and ecological overshoot to nuclear war, engineered pandemics and uncontrolled artificial intelligence. Because these interact – a war disrupting food systems, a pandemic straining already fragile institutions – the risk to civilisation is greater than the sum of the separate hazards.</p>'
    },
    {
      id: 'civilisation-scale',
      title: 'Civilisation-Scale',
      parent: 'civilisational-mechanics',
      html: '<p><em>Civilisation-scale</em> is the scale at which civilisation itself becomes the unit of analysis and action: the whole human world-system, across its full span of time, rather than any single nation, market or generation. Problems at this scale – planetary boundaries, exponential technology, the coordination of billions – cannot be seen from within narrower frames, and cannot be solved by actors who operate only within them.</p><p>Civilisation theory is theory applied at a civilisation-scale: it treats the initial conditions, developmental process and dominant paradigm of civilisation as objects of study in their own right. See <a href="#macrohistory">macrohistory</a> and <a href="#civilisational-risk">civilisational risk</a>.</p>'
    },
    {
      id: 'civilisation-research-paradigm',
      title: 'Civilisation Research Paradigm',
      parent: 'metatheory',
      order: 0,
      coined: true,
      html: '<p>The <em>civilisation research paradigm</em> is the framework by which this map organises the study of civilisation: a set of shared questions, divisions and methods – a paradigm in Thomas Kuhn’s sense – for treating civilisation as a single object of inquiry rather than a background to other subjects. It divides the field into nine sections in three sets of three, each set approaching civilisation from a different altitude.</p>'
        + '<ul>'
        + '<li><strong>Civilisational:</strong> how a civilisation works (<a href="#civilisational-mechanics">civilisational mechanics</a>), how it could be designed (<a href="#civilisation-design">civilisation design</a>), and how it could change from one form to another (<a href="#civilisation-transition">civilisational transition</a>).</li>'
        + '<li><strong>Meta:</strong> the crisis it faces (<a href="#metacrisis">metacrisis</a>), the culture through which it makes meaning (<a href="#metamodernism">metamodernism</a>), and the theories through which it understands itself (<a href="#metatheory">metatheory</a>).</li>'
        + '<li><strong>Macro:</strong> civilisation at the largest scales of time, society and action – its history (<a href="#macrohistory">macrohistory</a>), its social structures (<a href="#macrosociology">macrosociology</a>), and the strategy by which its long-run trajectory might be steered (<a href="#macrostrategy">macrostrategy</a>).</li>'
        + '</ul>'
        + '<p>Read together, the three sets move from mechanism to meaning to scale: what civilisation is and could be, how it is framed and experienced, and where it has come from and might go. The paradigm is the backbone of <a href="#the-map">the map</a>, and the starting point of its curated sequence.</p>'
    },
    {
      id: 'the-wizarding-away-of-the-state',
      title: 'The Wizarding Away of the State',
      parent: 'post-capitalism',
      coined: true,
      html: '<p><em>The wizarding away of the state</em> plays on Marx and Engels’s prophecy of the “withering away of the state”: the idea that, once class society had been overcome, the coercive apparatus of the state would no longer be needed and would gradually fall away. In place of that slow political withering, it names the prospect of the state being superseded by technology – its functions of coordination, administration and enforcement absorbed into automated systems, platforms and artificial intelligence so capable that, in Arthur C. Clarke’s phrase, they are “indistinguishable from magic”.</p><p>The question it poses is who holds the wand: whether such a transition would dissolve domination, as the socialist tradition hoped, or concentrate it in whoever owns the systems, as in <a href="#the-silicon-cage">the silicon cage</a>. See also <a href="#fully-automated-luxury-communism">fully automated luxury communism</a> and <a href="#meta-marxism">meta-Marxism</a>.</p>'
    },
    {
      id: 'civilization-research-institute',
      title: 'Civilization Research Institute',
      parent: 'metacrisis',
      order: 1,
      ref: 'civilizationresearchinstitute.org',
      html: '<p>The <em>Civilization Research Institute</em> is a research organisation devoted to the <a href="#metacrisis">metacrisis</a>: the shared underlying dynamics that generate humanity’s converging global risks, and the conditions under which a civilisation could navigate them without collapsing into catastrophe or dystopia.</p><p>Rather than treating climate, AI, biotechnology, inequality and institutional decay as separate problems, it studies them as expressions of common <a href="#generator-functions">generator functions</a> – rivalrous competition, extractive growth and exponential technology without commensurate wisdom – and asks what it would take to address them at that level. Its metacrisis frame is one of the direct inspirations of this map.</p><h2>Reality Check? (2025)</h2><p>A 2025 publication of the Institute, the first in its Reality Check series, on the state of humanity’s existential and social risks.</p><h2>General Regulatory Process for Advanced Technology</h2><p>A proposal for how advanced technologies could be assessed and governed before deployment, so that their risks and side effects are weighed in advance rather than after the fact.</p><h2>Steps for Prudent Problem-Solving</h2><p>A method for addressing problems without generating worse ones elsewhere – the pattern this map calls <a href="#problem-solution-externality-history">problem-solution-externality history</a>.</p>'
    },
    {
      id: 'civilization-emerging',
      title: 'Civilization Emerging',
      parent: 'metacrisis',
      order: 2,
      ref: 'Daniel Schmachtenberger',
      html: '<p><em>Civilization Emerging</em> was an earlier project of Daniel Schmachtenberger’s: a body of essays, talks and interviews from the late 2010s on the drivers of existential risk and the design criteria for a civilisation capable of surviving its own technological power. Much of the vocabulary that later shaped discussion of the <a href="#metacrisis">metacrisis</a> was worked out there – <a href="#generator-functions">generator functions</a>, the <a href="#multipolar-trap">multipolar trap</a>, and the <a href="#third-attractor">third attractor</a> between catastrophe and dystopia – together with the argument that only a civilisation redesigned at the level of its underlying incentives and institutions can be both safe and free.</p>'
    },
    {
      id: 'metanarrative',
      title: 'Metanarrative',
      parent: 'metamodernism',
      ref: 'Lyotard, The Postmodern Condition (1979)',
      html: '<p>A <em>metanarrative</em> (or grand narrative) is an overarching story that claims to explain history as a whole and to give every event its place and meaning – the progress of reason, the triumph of the free market, the dialectic of class struggle. Jean-François Lyotard defined the postmodern condition (1979) as “incredulity toward metanarratives”: the loss of faith in any single story able to legitimate knowledge and politics for everyone.</p><p><a href="#metamodernism">Metamodernism</a> takes up the question that postmodernity left open – whether, knowing that every grand narrative is partial and constructed, a civilisation can still hold a sincere story about where it is going. Without one, societies drift into <a href="#the-meaning-crisis">the meaning crisis</a>; with a naive one, into <a href="#the-age-of-ideology">ideology</a>.</p>'
    },
    {
      id: 'metaphysics',
      title: 'Metaphysics',
      parent: 'metatheory',
      html: '<p><em>Metaphysics</em> is the branch of philosophy concerned with the most basic features of reality: what exists, what it is to be something, the nature of causation, time, mind and matter, and how they relate.</p><p>Every civilisation rests on a metaphysics, usually unexamined – assumptions about what is real and what counts, which shape its science, economics and ethics long before anyone argues about them. Modern industrial societies carry a largely mechanistic and materialist metaphysics, in which the world is a store of separable objects to be used; critics from Alfred North Whitehead to today’s process philosophers have argued for a more relational alternative. See also <a href="#epistemology">epistemology</a>.</p>'
    },
    {
      id: 'metapsychology',
      title: 'Metapsychology',
      parent: 'metatheory',
      ref: 'Zachary Stein; Freud',
      html: '<p><em>Metapsychology</em> is theory about the psyche as a whole – not one school of psychology among others, but a framework for how minds are structured, develop and relate to culture, within which particular psychologies can be placed. The term was Sigmund Freud’s; the philosopher of education Zachary Stein has renewed it as an integrative account of human development, arguing that a civilisation in crisis needs an explicit, shared understanding of what people are and can become in order to educate, govern and care for them well.</p><p>On this view a civilisational crisis is also a crisis of human development, and the transition to a new civilisation is as much psychological and educational as it is technological or political. See also <a href="#psychology">psychology</a> and <a href="#pedagogy">pedagogy</a>.</p>'
    },

    {
      id: 'cp-commons',
      title: 'Commons',
      parent: 'political-economy',
      cpOnly: true,
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>A general term for collective resources in which every participant of the collective has an equal interest. Prominent examples are air, nature, culture, and the quality of our shared sensemaking basis or information commons.</p><p class="cp-note">This is the Consilience Project’s definition. See also this map’s own entry: <a href="#commons">Commons</a>.</p>'
    },
    {
      id: 'cp-epistemic-commons',
      title: 'Epistemic Commons',
      parent: 'civilisation-design',
      cpOnly: true,
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>It is both the public spaces (e.g., town hall, Twitter) and private spaces where people come together to pursue a mutual understanding of issues critical to their society, and the collection of norms, systems, and institutions underpinning this society-wide process of learning. The epistemic commons is a public resource; these spaces and norms are available to all of us, shaped by all of us, and in turn, also influence the way in which all of us engage in learning with each other. For informed and consensual decision-making, open societies and democratic governance depend upon an epistemic commons in which groups and individuals can collectively reflect and communicate in ways that promote mutual learning.</p><p class="cp-note">This is the Consilience Project’s definition. See also this map’s own entry: <a href="#the-epistemic-commons">The Epistemic Commons</a>.</p>'
    },
    {
      id: 'cp-hyperobjects',
      title: 'Hyperobjects',
      parent: 'metacrisis',
      cpOnly: true,
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Processes that occupy vast expanses of both time and space, defying the more traditional sense of an “object” as a thing that can be singled out. The concept, introduced by Timothy Morton, invites us to conceive of processes that are difficult to measure, always around us, globally distributed and only observed in pieces. Examples include climate change, ocean pollution, the Internet, and global nuclear armaments and related risks.</p><p class="cp-note">This is the Consilience Project’s definition. See also this map’s own entry: <a href="#hyperobjects">Hyper-Objects</a>.</p>'
    },
    {
      id: 'cp-open-society',
      title: 'Open Society',
      parent: 'civilisation-design',
      cpOnly: true,
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Open societies promote the free exchange of information and public discourse, as well as democratic governance based on the participation of the people in shared choices about their social futures. Unlike the tight control over communications and suppression of dissenting views that characterize closed societies, open societies promote transparent governance and embrace good-faith public scrutiny.</p><p class="cp-note">This is the Consilience Project’s definition. See also this map’s own entry: <a href="#open-society">Open Society</a>.</p>'
    },
    {
      id: 'cp-risk-society',
      title: 'Risk Society',
      parent: 'metacrisis',
      cpOnly: true,
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>A term proposed by sociologists to characterize emergent properties of social systems after the Second World War. Risk societies are increasingly preoccupied with securing the future against widespread and unpredictable risks. Grappling with these risks differentiate risk societies from modern societies, given these risks are the byproduct of modernity’s scientific, industrial, and economic advances. This preoccupation with risk is stimulating a feedback loop and a series of changes in political, cultural, and technological aspects of society.</p><p class="cp-note">This is the Consilience Project’s definition. See also this map’s own entry: <a href="#world-risk-society">World Risk Society: Manufactured Risk</a>.</p>'
    },
    {
      id: 'cp-sensemaking',
      title: 'Sensemaking',
      parent: 'epistemic-crisis',
      cpOnly: true,
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>A process by which people interpret information and experiences, and structure their understanding of a given domain of knowledge. It is the basis of decision-making: our interpretation of events will inform the rationale for what we do next. As we make sense of the world and accordingly act within it, we also gather feedback that allows us to improve our sensemaking and our capacity to learn. Sensemaking can occur at an individual level through interaction with one’s environment, collectively among groups engaged in discussion, or through socially-distributed reasoning in public discourse.</p><p class="cp-note">This is the Consilience Project’s definition. See also this map’s own entry: <a href="#sensemaking">Sensemaking</a>.</p>'
    },
    {
      id: 'affordance',
      title: 'Affordance',
      parent: 'theories-of-technology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary; Gibson',
      html: '<p>The noun was coined by the American ecological psychologist James J. Gibson. It was initially used in the study of animal-environment interaction and has also been used in the study of human-technology interaction. An affordance is an available use or purpose of a thing or an entity. For example, a couch affords being sat on, a microwave button affords being pressed, and a social media platform has an affordance of letting users share with each other.</p>'
    },
    {
      id: 'agent-provocateur',
      title: 'Agent Provocateur',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Agent provocateur translates to “inciting incident” in French. It is used to reference individuals who attempt to persuade another individual or group to partake in a crime or rash behavior or to implicate them in such acts. This is done to defame, delegitimize, or criminalize the target. For example, starting a conflict at a peaceful protest or attempting to implicate a political figure in a crime.</p>'
    },
    {
      id: 'information-warfare',
      title: 'Information Warfare',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Information warfare is a primary aspect of fourth- and fifth-generation warfare. It can be thought of as war with bits and memes instead of guns and bombs. Examples of information warfare include psychological operations like disinformation, propaganda, or manufactured media, or non-kinetic interference in an enemy’s communication capacity or quality.</p>'
    },
    {
      id: 'non-kinetic-warfare',
      title: 'Non-kinetic warfare',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>A form of rivalry between nation-states or conflicting groups, by which tactical aims are realized through means other than direct physical violence. Examples include election meddling, blackmailing politicians, or information warfare.</p>'
    },
    {
      id: 'sock-puppet',
      title: 'Sock Puppet',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>A fake online persona, crafted to manipulate public opinion without implicating the account creator—the puppeteer. These fabricated identities can be wielded by anyone, from independent citizens to political organizations and information warfare operatives, with the aim of advancing their chosen agenda. Sock puppet personas can embody any identity their puppeteers want, and a single individual can create and operate numerous accounts. Combined with computational technology such as AI-generated text or automation scripts, propagandists can mimic multiple seemingly legitimate voices to create the illusion of organic popular trends within the public discourse.</p>'

    {

      title: 'Plausible deniability',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>The ability of an individual or institutional entity to deny knowing about unethical or illegal activities because there is no evidence to the contrary or no such information has been provided.</p>'
    },
    {
      id: 'algorithmic-radicalisation',
      title: 'Algorithmic Radicalization',
      parent: 'attention-economy',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Ideological polarization is generated as a side-effect of content recommendation algorithms optimizing for user engagement and advertising revenues. These algorithms will upregulate content that reinforces existing views and filters out countervailing information because this has been proven to drive time on-site. The result is an increasingly polarized perspective founded on a biased information landscape.</p>'
    },
    {
      id: 'limbic-hijack',
      title: 'Limbic Hijack',
      parent: 'attention-economy',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>The phenomenon of having your attention captured by emotionally triggering stimuli. These stimuli strategically target the brain center that we share with other mammals that is responsible for emotional processing and arousal—the limbic system. This strategy of activating the limbic system is deliberately exploited by online algorithmic content recommendations to stimulate increased user engagement. Two effective stimuli for achieving this effect are those that can induce disgust or rage, as these sentiments naturally produce highly salient responses in people.</p>'
    },
    {
      id: 'microtargeting',
      title: 'Microtargeting',
      parent: 'attention-economy',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>An online advertising strategy in which companies create personal profiles about individual users from vast quantities of trace data left behind from their online activity. According to these psychometric profiles, companies display content that matches each user’s specific interests at moments when they are most likely to be impacted by it. While traditional advertising appeals to its audience’s demographics, microtargeting curates advertising for individuals and becomes increasingly personalized by analyzing new data.</p>'
    },
    {
      id: 'sensationalism',
      title: 'Sensationalism',
      parent: 'attention-economy',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Sensationalism is a tactic often used in mass media and journalism in which news stories are explicitly chosen and worded to excite the greatest number of readers or viewers, typically at the expense of accuracy. This may be achieved by exaggeration, omission of facts and information, and/or deliberate obstruction of the truth to spark controversy.</p>'
    },
    {
      id: 'misinformation',
      title: 'Misinformation',
      parent: 'epistemic-crisis',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>False or misleading information, irrespective of the intent to mislead. Within the category of misinformation, disinformation is a term used to refer to misinformation with intent. In news media, the public generally expects a higher standard for journalistic integrity and editorial safeguards against misinformation; in this context, misinformation is often referred to as “fake news”.</p>'
    },
    {
      id: 'deep-fakes',
      title: 'Deep Fakes',
      parent: 'epistemic-crisis',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>A deep fake is a digitally-altered (via AI) recording of a person for the purpose of political propaganda, sexual objectification, defamation, or parody. They are progressively becoming more indistinguishable from reality to an untrained eye.</p>'
    },
    {
      id: 'epistemic-nihilism',
      title: 'Epistemic Nihilism',
      parent: 'epistemic-crisis',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>This form of nihilism is a diffuse and usually subconscious feeling that it is impossible to really know anything, because, for example, “the science is too complex” or “there is fake news everywhere.” Without a shared ability to make sense of the world as a means to inform our choices, we are left with only the game of power. Claims of “truth” are seen as unwarranted or intentional manipulations, as weaponized or not earnestly believed in.</p>'
    },
    {
      id: 'epistemic-hubris',
      title: 'Epistemic Hubris',
      parent: 'epistemic-crisis',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Inadvertent emotionally or politically -motivated closed-mindedness, manifesting as certainty or overconfidence when dealing with complex indeterminate problems. Epistemic hubris can appear in many forms. For example, it is often demonstrated in the convictions of individuals influenced by highly politicized groups, it shows up in corporate or bureaucratic contexts that err towards certainty through information compression requirements, and it appears in media, where polarized rhetoric is incentivized due to its attention-grabbing effects. Note: for some kinds of problems it may be appropriate or even imperative to have a degree of confidence in one’s knowledge—this is not epistemic hubris.</p>'
    },
    {
      id: 'frame-control',
      title: 'Frame Control',
      parent: 'epistemic-crisis',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>The ability of an individual or group to shape the perception of an issue or topic by setting the narrative and determining the context for the debate. A “frame” is the way in which an issue is presented or “framed”, including the language, images, assumptions, and perspectives used to describe it. Controlling the frame can give immense social and political power to the actor who uses it because the narratives created or distorted by frame control are often covertly beneficial to the specific interests of the individual or group that has established the frame. As an example, politicians advocating for tax cuts or pro-business policies may use the phrase “job creators” when referring to wealthy corporations in order to suggest their focus is on improving livelihoods, potentially influencing public perception in favor of the politician’s interests.</p>'
    },
    {
      id: 'cherry-picking',
      title: 'Cherry Picking',
      parent: 'sensemaking',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>To “cherry pick” when making an argument is to selectively present evidence that supports one’s position or desired outcome, while ignoring or omitting any contradicting evidence.</p>'
    },
    {
      id: 'confirmation-bias',
      title: 'Confirmation Bias',
      parent: 'sensemaking',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>The cognitive bias of 1) exclusively seeking or recalling evidence in support of one’s current beliefs or values, 2) interpreting ambiguous information in favor of one’s beliefs or values, and 3) ignoring any contrary information. This bias is especially strong when the issues in question are particularly important to one’s identity.</p>'
    },
    {
      id: 'strawman-arguments',
      title: 'Strawman Arguments',
      parent: 'sensemaking',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Presenting the argument of disagreeable others in their weakest forms, and after dismissing those, claiming to have discredited their position as a whole.</p>'
    },
    {
      id: 'thought-terminating-cliches',
      title: 'Thought-Terminating Clichés',
      parent: 'sensemaking',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Used as part of propaganda or advertising campaigns, these are brief, highly-reductive, and definitive-sounding phrases that stop further questioning of ideas. Often used in contexts in which social approval requires unreflective use of the cliché, which can result in confusion at the individual and collective level. Examples include all advertising jingles and catchphrases, and certain political slogans.</p>'
    },
    {
      id: 'villainisation',
      title: 'Villainization',
      parent: 'sensemaking',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Creating the image of an anti-hero who epitomizes the worst of the disagreeable group, and contrasts with the best qualities of one’s own, then characterizing all members of the other group as if they were identical to that image.</p>'
    },
    {
      id: 'epistemic-humility',
      title: 'Epistemic Humility',
      parent: 'sensemaking',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>An ethos of learning that involves a healthy balance between confidence and openness to new ideas. It is neither hubristic, meaning overly confident or arrogant, nor nihilistic, meaning believing that nothing can be known for certain. Instead, it is a subtle orientation that seeks new learning, recognizes the limitations of one’s own knowledge, and avoids absolutisms or fundamentalisms—which are rigid and unyielding beliefs that refuse to consider alternative viewpoints. Those that demonstrate epistemic humility will embrace truths where these are possible to attain but are generally inclined to continuously upgrade their beliefs with new information.</p>'
    },
    {
      id: 'good-faith-communications',
      title: 'Good Faith Communications',
      parent: 'sensemaking',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Discourse oriented towards mutual understanding and coordinated action, with the result of increasing the faith that participants have in the value of communicating. The goal of good faith communication is not to reach a consensus, but to make it possible for all parties to change positions, learn, and continue productive, ongoing interaction.</p>'
    },
    {
      id: 'consilience',
      title: 'Consilience',
      parent: 'metatheory',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>In science and history, consilience is the principle that evidence from independent, unrelated sources can “converge” on strong conclusions. That is, when multiple sources of evidence are in agreement, the conclusion can be very strong even when none of the individual sources of evidence is significantly so on its own.</p>'
    },
    {
      id: 'epistemology',
      title: 'Epistemology',
      parent: 'metatheory',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Epistemology is the philosophical study of knowing and the nature of knowledge. It deals with questions such as “how does one know?” and “what is knowing, known, and knowledge?”. Epistemology is considered one of the four main branches of philosophy, along with ethics, logic, and metaphysics.</p>'
    },
    {
      id: 'empiricism',
      title: 'Empiricism',
      parent: 'metatheory',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary; Locke',
      html: '<p>Empiricism is a philosophical theory that states that knowledge is derived from sensory experiences and relies heavily on scientific evidence to arrive at a body of truth. English philosopher John Locke proposed that rather than being born with innate ideas or principles, man’s life begins as a “blank slate” and only through his senses is he able to develop his mind and understand the world.</p>'
    },
    {
      id: 'paradigm',
      title: 'Paradigm',
      parent: 'metatheory',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary; Kuhn',
      html: '<p>The modern use of the term ‘paradigm’ was introduced by the philosopher of science Thomas Kuhn in his work “The Structure of Scientific Revolutions”. Kuhn’s idea is that a paradigm is the set of concepts and practices that define a scientific discipline at any particular period of time. A good example of a paradigm is behaviorism – a paradigm under which studying externally observable behavior was viewed as the only scientifically legitimate form of psychology. Kuhn also argued that science progresses by the way of “paradigm shifts,” when a leading paradigm transforms into another through advances in understanding and methodology; for example, when the leading paradigm in psychology transformed from behaviorism to cognitivism, which looked at the human mind from an information processing perspective.</p>'
    },
    {
      id: 'unverifiable',
      title: 'Unverifiable',
      parent: 'metatheory',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>A proposition or a state of affairs is impossible to be verified, or proven to be true. A further distinction is that a state of affairs can be unverifiable at this time, for example, due to constraints in our technical capacity, or a state of affairs can be unverifiable in principle, which means that there is no possible way to verify the claim.</p>'
    },
    {
      id: 'closed-society',
      title: 'Closed Society',
      parent: 'civilisation-design',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Closed societies restrict the free exchange of information and public discourse, as well as impose top down decisions on their populus. Unlike the open communications and dissenting views that characterize open societies, closed societies promote opaque governance and prevent public opposition that might be found in free and open discourse.</p>'
    },
    {
      id: 'civic-virtue',
      title: 'Civic Virtue',
      parent: 'civilisation-design',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>The ethical behavior exhibited by individuals in service of bettering their communities and their state, sometimes foregoing personal gain for the pursuit of a greater good for all. In contrast to other sets of moral virtues, civic virtue refers specifically to standards of behavior in the context of citizens participating in governance or civil society. What constitutes civic virtue has evolved over time and may differ across political philosophies. For example, in modern-day democracies, civic virtue includes values such as guaranteeing all citizens the right to vote, and freedom of culture, race, sex, religion, nationality, sexual orientation, or gender identity. A shared understanding of civic virtue among the populace is integral to the stability of a just political system, and waning civic virtue may result in disengagement from collective responsibilities, noncompliance with the rule of law, a breakdown in trust between individuals and the state, and degradation of the intergenerational process of passing on civic virtues.</p>'
    },
    {
      id: 'public-sphere',
      title: 'Public Sphere',
      parent: 'civilisation-design',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary; Habermas',
      html: '<p>First coined by philosopher Jürgen Habermas, the term refers to the collective common spaces where people come together to publicly articulate matters of mutual interest for members of society. By extension, the related theory suggests that impartial, representative governance relies on the capacity of the public sphere to facilitate healthy debate.</p>'
    },
    {
      id: 'social-contract-theory',
      title: 'Social Contract Theory',
      parent: 'civilisation-design',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary; Hobbes; Locke; Rousseau; Rawls',
      html: '<p>A theory stating that individuals are willing to sacrifice some of their freedom and agree to state authority under certain legal rules, in exchange for the protection of their remaining rights, provided the rest of society adheres to the same rules of engagement. This model of political philosophy originated during the Age of Enlightenment from theorists including, but not limited to John Locke, Thomas Hobbes, and Jean-Jacques Rousseau. It was revived in the 20th century by John Rawls and is used as the basis for modern democratic theory.</p>'
    },
    {
      id: 'ethos',
      title: 'Ethos',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Derived from a Greek word meaning custom, habit, or character; The set of ideals or customs which lay the foundations around which a group of people coheres. This includes the set of values upon which a culture derives its ethical principles.</p>'
    },
    {
      id: 'cultural-enlightenment',
      title: 'Cultural Enlightenment',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>While “The Enlightenment” was a specific instantiation of cultural enlightenment in 18th-century Europe, cultural enlightenment is a more general process that has occurred multiple times in history, in many different cultures. When a culture goes through a period of increasing reflectivity on itself it is undergoing cultural enlightenment. This period of reflectivity brings about the awareness required for a culture to reimagine its institutions from a new perspective. Similarly, “The Renaissance” refers to a specific period in Europe while the process of a cultural renaissance has occurred elsewhere. A cultural renaissance is more general than (and may precede) an enlightenment, as it describes a period of renewed interest in a particular topic.</p>'
    },
    {
      id: 'renaissance',
      title: 'Renaissance',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>The word itself is French for rebirth, and this meaning is maintained across its many purposes. The term is commonly used with reference to the European Renaissance, a period of European cultural, artistic, political, and economic renewal following the middle ages. The term can refer to other periods of great social change, such as the Bengal Renaissance (beginning in late 18th century India).</p>'
    },
    {
      id: 'pedagogy',
      title: 'Pedagogy',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>The theory and practice of teaching and learning, and how this process influences, and is influenced by, the social, political, and psychological development of learners.</p>'
    },
    {
      id: 'intergenerational-transmission',
      title: 'Intergenerational transmission',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Refers to the foundational process of education which underlies and enables societal and cultural cohesion across generations by passing down values, capacities, knowledge, and personality types.</p>'
    },
    {
      id: 'societal-autopoiesis',
      title: 'Societal Autopoiesis',
      parent: 'macrosociology',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>Autopoiesis from the Greek αὐτo- (auto-) ‘self’, and ποίησις (poiesis) ‘creation, production’—is a term coined in biology that refers to a system’s capability for reproducing and maintaining itself by metabolizing energy to create its own parts, and eventually new emergent components. All living systems are autopoietic. Societal Autopoiesis is an extension of the biological term, making reference to the process by which a society maintains its capacity to perpetuate and adapt while experiencing relative continuity of shared identity.</p>'
    },
    {
      id: 'monetarism',
      title: 'Monetarism',
      parent: 'civilisational-mechanics',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>A prevailing school of economic thought that emphasizes the government’s role in controlling the supply of money circulating in an economy as the primary determinant of economic growth. This involves central banks using various methods of increasing or decreasing the money supply of their currency (e.g., altering interest rates).</p>'
    },
    {
      id: 'technocapitalism',
      title: 'Technocapitalism',
      parent: 'civilisational-mechanics',
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>A worldview that holds technology, specifically developed by private corporations, as the primary driver of civilizational progress. For evidence of its success, adherents point to the consistent global progress in reducing metrics like child mortality and poverty while capitalism has been the dominant economic paradigm. However, the market incentives driving this progress have also resulted in new, sometimes greater, societal problems as externalities.</p><p>In Nick Land’s darker usage – <em>techno-capital</em> – the term names not a worldview but a process: capital and technology fused into a single self-accelerating system that uses human beings as its medium, and that is, in Land’s account, already becoming an intelligence in its own right.</p>'
    },
    {
      id: 'goodharts-law',
      title: 'Goodhart’s Law',
      parent: 'civilisation-design',
      ref: 'Goodhart (1975); Strathern (1997)',
      html: '<p><em>Goodhart’s law</em> holds that any measure used to steer a system loses its value once it becomes a target: “when a measure becomes a target, it ceases to be a good measure”, in Marilyn Strathern’s later phrasing of the economist Charles Goodhart’s 1975 observation about monetary policy. Once people are rewarded for moving an indicator, they find ways to move the indicator rather than the thing it was meant to track.</p><p>Economic growth measured by GDP, attention measured by engagement, and research measured by citations are examples. Any institution that governs through metrics tends to drift towards optimising the proxy at the expense of the goal; Donald Campbell made the same point for social policy: the more a quantitative indicator is used for decisions, the more it will be corrupted.</p>'
    },
    {
      id: 'collingridge-dilemma',
      title: 'The Collingridge Dilemma',
      parent: 'theories-of-technology',
      ref: 'Collingridge, The Social Control of Technology (1980)',
      html: '<p>The <em>Collingridge dilemma</em>, set out by David Collingridge in <em>The Social Control of Technology</em> (1980), is the double bind of governing a new technology. Early on, when it would still be easy to change, too little is known about its consequences to justify controlling it; by the time those consequences are clear, the technology is so embedded in markets, infrastructure and habits that changing it has become costly or impossible. The dilemma sharpens with <a href="#exponential-technology">exponential technology</a>, where the window between “too early to know” and “too late to change” keeps shrinking.</p>'
    },
    {
      id: 'resourcism-and-extractivism',
      title: 'Resourcism & Extractivism',
      parent: 'civilisational-mechanics',
      html: '<p><em>Resourcism</em> is the stance that treats the living world as a stock of resources existing for human use; <em>extractivism</em> is the economic model built on removing those resources at scale, often from peripheral regions for consumption elsewhere. Together they describe the material metabolism of the present civilisation and the ecological and social damage it leaves behind.</p>'
    },
    {
      id: 'disaster-capitalism',
      title: 'Disaster Capitalism',
      parent: 'civilisational-mechanics',
      ref: 'Klein',
      html: '<p><em>Disaster capitalism</em> is Naomi Klein’s term, from <em>The Shock Doctrine</em> (2007), for the exploitation of crises – wars, natural disasters, economic collapses – to push through market reforms and privatisations that populations would not accept in ordinary times. It describes how shock and disorientation become opportunities for the reorganisation of society in the interests of capital.</p>'
    },
    {
      id: 'root-socio-economic-orientation',
      refs: ['Peter Joseph, <em>The New Human Rights Movement: Reinventing the Economy to End Oppression</em> (2017).'],
      title: 'Root Socio-Economic Orientation',
      parent: 'civilisational-mechanics',
      ref: 'Joseph',
      html: '<blockquote class="entry-quote"><p>Since the Neolithic Revolution, we’ve had a process of economically driven cultural adaptation built around the survival requisites of the relatively new, settled agrarian paradigm. This evolution of post-Neolithic culture was self-guided by systemic environmental pressures and survival inferences common to the natural dynamics of the new mode of production. This gave birth to dominance-oriented incentives, values, and protections, evolving patterns of conflict, hierarchy, and disproportional allocation of physical and social resources. Over time, these incentives, values, and protections became accepted as “just the way it is” and what most consider “normality” today has been the result.</p><footer>Peter Joseph, <em>The New Human Rights Movement</em> (2017)</footer></blockquote>' +
        '<p>The <em>root socio-economic orientation</em> is <a href="#peter-joseph">Peter Joseph</a>’s term, from <em>The New Human Rights Movement</em> (2017), for the guiding orientation that underlies market economics and <a href="#capitalism">capitalism</a>: a society built around scarcity, self-interest, competition and dominance, and ultimately a sociology formed around scarcity, fear and in-group/out-group bias. From the assumption of universal and unnuanced scarcity, it justifies competition, hierarchy, inequality and oppression. For Joseph it is the common thread of every social system since the advent of agriculture – ancient slavery, feudalism, mercantilism and capitalism alike – and the reason they have all been foundationally elitist. See also the <a href="#scarcity-rivalry-orientation">scarcity-rivalry orientation</a>.</p>' +
        '<p>Capitalism, for Joseph, is simply a structurally mature form of market economics: the economic systems since the Neolithic Revolution have changed their form, but the root socio-economic orientation has remained the same.</p>'
    },
    {
      id: 'hayeks-great-wall',
      title: 'Hayek’s Great Wall',
      coined: true,
      parent: 'civilisation-design',
      ref: 'Hayek',
      html: '<p><em>Hayek’s great wall</em> refers to Friedrich Hayek’s argument, in “The Use of Knowledge in Society” (1945), that the knowledge needed to coordinate an economy is dispersed among millions of people and can only be integrated through prices. The argument has stood as a wall against central planning; the question it now faces is whether computation and new forms of coordination change what lies on either side of it.</p>'
    },
    {
      id: 'time-space-compression',
      title: 'Time-Space Compression',
      parent: 'civilisational-mechanics',
      ref: 'Harvey',
      html: '<p><em>Time-space compression</em> is David Harvey’s term, from <em>The Condition of Postmodernity</em> (1989), for the way capitalism accelerates the pace of life and shrinks the effective distance between places, through faster transport, communication and turnover of capital. It explains the disorienting speed of modern life as a product of capital’s need to overcome spatial and temporal barriers to accumulation.</p>'
    },
    {
      id: 'the-divide',
      title: 'The Divide',
      parent: 'civilisational-mechanics',
      ref: 'Hickel',
      html: '<p><em>The Divide</em> (2017) is Jason Hickel’s account of global inequality, which argues that the gap between rich and poor countries is not a natural stage of development but the product of colonialism and of the structures of debt, trade and finance that followed. It frames global poverty as a political outcome, sustained by a net flow of resources from the global South to the North.</p>'
    },
    {
      id: 'problem-solution-externality-history',
      title: 'Problem-Solution-Externality History',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p><em>Problem-solution-externality history</em> is a way of reading history as a chain in which each solution to a problem generates externalities that become the next problems. Agriculture, industry and modern technology each solved pressing needs while producing new harms. The pattern suggests that without addressing its generating dynamics, civilisation keeps trading old crises for new ones.</p>'
    },
    {
      id: 'the-wisdom-gap',
      title: 'The Wisdom Gap(s)',
      parent: 'metacrisis',
      html: '<p>The <em>wisdom gap</em> is the widening distance between humanity’s power – amplified by exponential technology – and the wisdom needed to use that power well. As capabilities grow faster than the ethical, institutional and cultural capacities to govern them, the consequences of error grow with them. Closing the gap, rather than halting power, is often framed as the central task of the century.</p>'
    },
    {
      id: 'spontaneous-disorder',
      title: 'Spontaneous Disorder',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Hayek (spontaneous order)',
      html: '<p><em>Spontaneous disorder</em> inverts Friedrich Hayek’s “spontaneous order”, the idea that markets and societies produce beneficial order without central design. The same decentralised processes can equally produce emergent disorder – ecological breakdown, financial crises, arms races and information chaos – that no one intended and no one controls.</p>'
    },
    {
      id: 'crucial-consideration',
      title: 'Crucial Considerations',
      parent: 'existential-risk',
      ref: 'Bostrom',
      html: '<p>A <em>crucial consideration</em>, in Nick Bostrom’s usage, is an idea or argument that, if taken into account, would radically change the direction of one’s efforts – not just their degree. Because the long-run value of actions is so uncertain, missing a single crucial consideration can reverse the sign of their expected impact, making the search for such considerations a priority in its own right.</p>'
    },
    {
      id: 'world-risk-society',
      title: 'World Risk Society: Manufactured Risk',
      parent: 'metacrisis',
      ref: 'Beck; Giddens',
      html: '<p>The <em>world risk society</em> is Ulrich Beck’s term, developed from <em>Risk Society</em> (1986), for a modernity preoccupied with managing the hazards it has itself produced. Unlike natural dangers, these <em>manufactured risks</em> – nuclear, chemical, ecological, financial – are consequences of industrial and technological development, and they cross borders and generations in ways existing institutions cannot contain.</p>'
    },
    {
      id: 'reflexive-modernisation',
      title: 'Reflexive Modernisation',
      parent: 'world-risk-society',
      ref: 'Beck, Giddens, Lash',
      html: '<p><em>Reflexive modernisation</em> is the idea, developed by Ulrich Beck, Anthony Giddens and Scott Lash (1994), that modernity has begun to confront its own foundations and consequences. As industrial society generates risks and undermines the institutions it built, modernisation turns back on itself, forcing a society to question and rework the very processes that made it.</p>'
    },
    {
      id: 'capitalogenic-risk',
      title: 'Capitalogenic Risk',
      parent: 'world-risk-society',
      ref: 'Moore',
      html: '<p><em>Capitalogenic risk</em> refers to risks generated by capitalism specifically, rather than by humanity in general. The term follows Jason W. Moore’s argument that crises such as climate change are better described as “capitalogenic” than “anthropogenic”, since they arise from a particular way of organising nature, labour and capital rather than from human existence as such.</p>'
    },
    {
      id: 'the-integral-accident',
      title: 'The Integral Accident',
      parent: 'metacrisis',
      ref: 'Virilio',
      html: '<p>The <em>integral accident</em> is Paul Virilio’s term for the catastrophe that every technology contains: to invent the ship is to invent the shipwreck. As technologies become global and instantaneous, their accidents do too, so that a failure in one place – a financial crash, a network collapse, a pandemic – can propagate everywhere at once.</p>'
    },
    {
      id: 'outside-context-problems',
      title: 'Outside Context Problems',
      parent: 'metacrisis',
      ref: 'Banks (Excession)',
      html: '<p>An <em>outside context problem</em>, a term from Iain M. Banks’s novel <em>Excession</em> (1996), is a problem so far beyond a civilisation’s experience that it cannot even be properly conceived until it arrives – like a society encountering a vastly more advanced one. It describes the limits of foresight when facing genuinely novel forces, such as transformative technologies.</p>'
    },
    {
      id: 'hyperobjects',
      title: 'Hyper-Objects',
      parent: 'metacrisis',
      ref: 'Morton',
      html: '<p><em>Hyperobjects</em> is Timothy Morton’s term, from <em>Hyperobjects</em> (2013), for entities so vastly distributed in time and space – such as global warming, plastics or nuclear waste – that they cannot be perceived directly or grasped as a whole. They are real and pressing, yet exceed the scales at which human perception, politics and ethics ordinarily work.</p>'
    },
    {
      id: 'red-teaming',
      title: 'Red Teaming',
      parent: 'metacrisis',
      html: '<p><em>Red teaming</em> is the practice of deliberately adopting an adversary’s perspective to find the weaknesses of a plan, system or institution before a real adversary does. Originating in military planning and now central to security and AI safety, it is a discipline for anticipating failure, and for countering the tendency of organisations to believe their own assumptions.</p>'
    },
    {
      id: 'doomsday-megamachine',
      title: 'The Doomsday Megamachine',
      parent: 'complex-world-system-dynamics',
      ref: 'Ellsberg; Mumford',
      html: '<p>The <em>doomsday megamachine</em> joins two ideas: Lewis Mumford’s “megamachine”, the vast social organisation of people and technology that makes large-scale power possible, and Daniel Ellsberg’s <em>The Doomsday Machine</em> (2017), his account of nuclear war planning built to destroy civilisation. Together they describe apparatuses of catastrophe sustained by ordinary institutions and routine work.</p>'
    },
    {
      id: 'meta-dystopia',
      title: 'Meta-Dystopia',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p>A <em>meta-dystopia</em> is a dystopia that is not imposed by any single tyrant or design, but emerges from the interaction of many systems – surveillance, markets, algorithms, geopolitics – each of which seems reasonable on its own. Because it has no centre, it is harder to recognise and resist than the dystopias of classic fiction, and may be experienced as normal.</p>'
    },
    {
      id: 'nightfall',
      title: 'Nightfall',
      parent: 'metacrisis',
      ref: 'Asimov',
      html: '<p><em>Nightfall</em> (1941) is Isaac Asimov’s story of a civilisation on a world lit by several suns, which experiences darkness only once every two thousand years – and collapses into madness each time the stars appear. It serves as a parable of civilisational cycles, of warnings ignored, and of the fragility of a society confronted with a reality beyond its frame.</p>'
    },
    {
      id: 'surveillance-capitalism',
      refs: ['Shoshana Zuboff, <em>The Age of Surveillance Capitalism: The Fight for a Human Future at the New Frontier of Power</em> (2019).'],
      title: 'Surveillance Capitalism',
      parent: 'macrosociology',
      ref: 'Zuboff',
      html: '<p><em>Surveillance capitalism</em> is Shoshana Zuboff’s term, from <em>The Age of Surveillance Capitalism</em> (2019), for an economic order that claims human experience as raw material, turning behavioural data into predictions sold to those who wish to influence behaviour. Its ultimate product, Zuboff argues, is not information but the ability to modify what people do.</p>'
    },
    {
      id: 'demons-of-surveillance-capitalism',
      title: 'Demons of Surveillance Capitalism',
      coined: true,
      parent: 'surveillance-capitalism',
      html: '<p>The <em>demons of surveillance capitalism</em> are the automated, profit-seeking processes – recommendation engines, ad-targeting systems, engagement optimisers – that act on people continuously and invisibly. Like the demons of older cosmologies, they are unseen agents that influence desire and belief, serving ends that are not those of the people they act upon.</p>'
    },
    {
      id: 'psychopolitics',
      title: 'Psychopolitics',
      parent: 'macrosociology',
      ref: 'Han',
      html: '<p><em>Psychopolitics</em> is Byung-Chul Han’s term, from <em>Psychopolitics</em> (2014), for a form of power that operates not by prohibition but by seduction – exploiting freedom, self-optimisation and the psyche itself. In the neoliberal subject who exploits themselves and voluntarily reveals everything, Han sees a control more efficient than any discipline imposed from outside.</p>'
    },
    {
      id: 'the-panopticon',
      title: 'The Panopticon',
      parent: 'macrosociology',
      ref: 'Bentham; Foucault',
      html: '<p>The <em>panopticon</em> is Jeremy Bentham’s design (1791) for a prison in which inmates can always be watched without knowing when they are. Michel Foucault, in <em>Discipline and Punish</em> (1975), made it the model of modern disciplinary power: people who might be observed at any moment come to discipline themselves – a logic extended by digital surveillance.</p>'
    },
    {
      id: 'the-gaze',
      title: 'The Gaze: Hell is Other People',
      parent: 'macrosociology',
      ref: 'Sartre',
      html: '<p><em>The gaze</em>, in Jean-Paul Sartre’s <em>Being and Nothingness</em> (1943), is the experience of being looked at by another, which turns the subject into an object in someone else’s world. His play <em>No Exit</em> (1944) dramatised it in the line “Hell is other people”. In an age of constant visibility and social comparison, the gaze has become a permanent condition.</p>'
    },
    {
      id: 'empire',
      title: 'Empire',
      parent: 'macrosociology',
      ref: 'Hardt & Negri',
      html: '<p><em>Empire</em> (2000), by Michael Hardt and Antonio Negri, describes a new form of global sovereignty that has no centre and no outside – a network of states, corporations and supranational institutions rather than any single imperial power. Against it they posed the “multitude”, the diverse global population whose cooperation both sustains Empire and could overturn it.</p>'
    },
    {
      id: 'necropolitics',
      title: 'Necropolitics',
      parent: 'macrosociology',
      ref: 'Mbembe',
      html: '<p><em>Necropolitics</em> is Achille Mbembe’s term (2003) for the power to decide who may live and who must die, and for the creation of zones and populations exposed to death. Extending Foucault’s biopolitics, it describes how modern sovereignty operates through occupation, abandonment and violence at the margins of the global order.</p>'
    },
    {
      id: 'high-modernism',
      title: 'High Modernism',
      parent: 'macrosociology',
      ref: 'Scott',
      html: '<p><em>High modernism</em>, in James C. Scott’s account, is the confident belief that society and nature can be comprehensively redesigned according to scientific and rational plans, imposed by a powerful state. Scott shows how such schemes – from planned cities to collectivised agriculture – repeatedly failed because they ignored the local, practical knowledge on which working systems depend.</p>'
    },
    {
      id: 'seeing-like-a-state',
      title: 'Seeing Like a State',
      parent: 'high-modernism',
      ref: 'Scott',
      html: '<p><em>Seeing Like a State</em> (1998) is James C. Scott’s study of how states make societies “legible” – simplifying them through maps, censuses, standard names and measures in order to govern them. Legibility enables administration, but when combined with high-modernist ambition and authoritarian power it can destroy the complex, informal orders that the simplifications cannot see.</p>'
    },
    {
      id: 'ship-of-theseus-of-the-state',
      title: 'The Ship of Theseus of the State',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p>The <em>ship of Theseus of the state</em> applies the ancient puzzle – is a ship still the same if every plank is replaced? – to government. As the functions of the state are progressively handed to automated systems, contractors and algorithms, it may retain its name, forms and symbols while becoming, piece by piece, an entirely different entity accountable to different forces.</p>'
    },
    {
      id: 'business-government',
      title: 'Business Government',
      parent: 'macrosociology',
      ref: 'Veblen',
      html: '<p><em>Business government</em> refers to Thorstein Veblen’s argument, in <em>The Theory of Business Enterprise</em> (1904), that modern governments act largely in the interests of business – that the state’s policies, laws and even wars serve the pursuit of profit. It names the fusion of political authority with commercial interest that shapes public life in market societies.</p>'
    },
    {
      id: 'structural-violence',
      title: 'Structural Violence',
      parent: 'macrosociology',
      ref: 'Galtung',
      html: '<p><em>Structural violence</em> is Johan Galtung’s term (1969) for harm caused by social structures rather than by identifiable individuals – when poverty, exclusion or unequal access to resources prevent people from meeting their needs. Because it is built into institutions and appears as the normal order of things, it often goes unrecognised as violence at all.</p>'
    },
    {
      id: 'mad-information-war',
      title: 'MAD Information War',
      parent: 'macrosociology',
      ref: 'Consilience Project',
      html: '<p><em>MAD information war</em> describes information warfare as a form of mutually assured destruction. Every side can deploy propaganda, disinformation and manipulation, and each has an incentive to do so; but the combined result is the degradation of the shared information environment on which all depend, leaving every society less able to make sense of the world or govern itself.</p>'
    },
    {
      id: 'the-second-cold-war',
      title: 'The Second Cold War',
      parent: 'macrosociology',
      html: '<p>The <em>second cold war</em> refers to the renewed rivalry between the great powers – principally the United States and China – spanning trade, technology, military power and ideology. Unlike the first Cold War, it unfolds within a deeply interdependent world economy and centres on control of critical technologies such as semiconductors and artificial intelligence.</p>'
    },
    {
      id: 'clash-of-civilisations',
      title: 'The Clash of Civilisations',
      parent: 'macrohistory',
      ref: 'Huntington',
      html: '<p><em>The Clash of Civilisations</em> is Samuel Huntington’s thesis (1993; book 1996) that after the Cold War the principal conflicts would arise between civilisations defined by culture and religion, rather than between ideologies or nations. Widely criticised for treating civilisations as fixed blocs, it remains influential as a frame for understanding identity-based conflict.</p>'
    },
    {
      id: 'the-meaning-crisis',
      title: 'The Meaning Crisis',
      parent: 'macrosociology',
      ref: 'Vervaeke',
      html: '<p>The <em>meaning crisis</em> is John Vervaeke’s term, developed in his lecture series <em>Awakening from the Meaning Crisis</em> (2019), for the widespread loss of a sense of meaning, connection and wisdom in modern life. He traces it to historical changes that eroded traditional frameworks for cultivating wisdom, leaving symptoms such as nihilism, loneliness and the search for substitute sources of meaning.</p>'
    },
    {
      id: 'lost-futures',
      title: 'Lost Futures',
      parent: 'macrosociology',
      ref: 'Fisher',
      html: '<p><em>Lost futures</em> refers to Mark Fisher’s diagnosis, in <em>Ghosts of My Life</em> (2014), of the “slow cancellation of the future”: the sense that culture has stopped imagining genuinely new possibilities and endlessly recycles the past. Connected to his idea of capitalist realism – that it is easier to imagine the end of the world than the end of capitalism – it names a crisis of the political imagination.</p>'
    },
    {
      id: 'hypernormalisation',
      title: 'Hypernormalisation',
      parent: 'macrosociology',
      ref: 'Yurchak; Curtis',
      html: '<p><em>Hypernormalisation</em> was coined by Alexei Yurchak to describe late Soviet life, in which everyone knew the official system was failing but went on as if it were normal, because no alternative could be imagined. Adam Curtis’s film <em>HyperNormalisation</em> (2016) applied the idea to the West, as a retreat into a simplified, fake world in the face of overwhelming complexity.</p>'
    },
    {
      id: 'the-cartesian-crisis',
      title: 'The Cartesian Crisis',
      parent: 'macrosociology',
      ref: 'Weinstein',
      html: '<p>The <em>Cartesian crisis</em> takes its name from René Descartes’s doubt about whether anything he perceived could be trusted. It describes a society in which synthetic media, manipulation and competing information sources make it genuinely difficult to know what is real, so that radical doubt ceases to be a philosophical exercise and becomes an everyday condition.</p>'
    },
    {
      id: 'the-master-and-his-emissary',
      title: 'The Master & His Emissary',
      parent: 'macrosociology',
      ref: 'McGilchrist',
      html: '<p><em>The Master and His Emissary</em> (2009) is Iain McGilchrist’s argument that the brain’s two hemispheres attend to the world in fundamentally different ways – the right to wholes, context and the living, the left to parts, abstraction and control. He contends that Western culture has increasingly come to be dominated by the left hemisphere’s mode, the “emissary” usurping the “master”.</p>'
    },
    {
      id: 'the-age-of-ideology',
      title: 'The Age of Ideology',
      parent: 'macrohistory',
      html: '<p>The <em>age of ideology</em> refers to the period, running from the nineteenth century through the twentieth, in which comprehensive political doctrines – liberalism, socialism, nationalism, fascism, communism – competed to organise whole societies around a single vision. Its catastrophes and its apparent end shape the present, in which grand narratives are distrusted yet no replacement has emerged.</p>'
    },
    {
      id: 'the-end-of-history',
      title: 'The End of History',
      parent: 'macrohistory',
      ref: 'Fukuyama',
      html: '<p><em>The End of History</em> is Francis Fukuyama’s thesis (1989; book 1992) that, with the end of the Cold War, liberal democracy and market economics had emerged as the final form of human government, with no serious ideological rival remaining. Its reception, and the events that have since challenged it, make it a touchstone for debates about whether history has a direction.</p>'
    },
    {
      id: 'the-angel-of-history',
      title: 'The Angel of History',
      parent: 'macrohistory',
