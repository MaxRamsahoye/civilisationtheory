      title: 'Institute of Applied Metatheory',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Institute of Applied Metatheory</em> develops and applies integrative metatheories – <a href="#integral-theory">integral theory</a>, <a href="#critical-realism">critical realism</a>, <a href="#metamodernism">metamodernism</a> and others – to the understanding of the metacrisis and the evolution of worldviews.</p><h2>Mapping an Ecology of Integrative Approaches to Addressing the Metacrisis</h2><p>A 2025 paper by Brandon Nørgaard, Nicholas Hedlund and Claudia Meglin that maps and compares the emerging integrative responses to the metacrisis – metamodernism, integral theory, Game B, critical realism and others – and calls for cross-pollination and coordinated action between them.</p><h2>Metatheory for the Twenty-First Century: Critical Realism and Integral Theory in Dialogue</h2><p>A 2016 volume, edited by Roy Bhaskar, Sean Esbjörn-Hargens, Nicholas Hedlund and Mervyn Hartwig, staging a dialogue between critical realism and integral theory as candidate metatheories for the twenty-first century.</p>'
    },
    {
      id: 'center-for-world-philosophy-and-religion',
      title: 'Centre for World Philosophy & Religion',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for World Philosophy and Religion</em>, associated with Marc Gafni, develops <a href="#cosmoerotic-humanism">CosmoErotic Humanism</a> as a new shared story of value in response to the metacrisis.</p><h2>First Principles & First Values: Forty-Two Propositions on CosmoErotic Humanism, the Metacrisis and the World to Come</h2><p>The 2024 book by David J. Temple – the pen name of Marc Gafni, Zachary Stein and Ken Wilber – which sets out CosmoErotic Humanism and its claim that the metacrisis is rooted in a collapse of shared intrinsic value.</p>'
    },
    {
      id: 'life-itself',
      title: 'Life Itself Sensemaking Studio & the Second Renaissance Initiative',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Life Itself</em> is a collective, co-founded by Rufus Pollock, that combines inner development, community and research. Its Sensemaking Studio and Second Renaissance initiative argue that the crises of the present are rooted in the <a href="#modernist-cultural-paradigm">modern cultural paradigm</a>, and that a shift in worldview – a second renaissance – is needed.</p><h2>From Polycrisis to Metacrisis: A Short Introduction</h2><p>An introduction to the move from seeing today’s crises as many interacting problems – the polycrisis – to seeing them as expressions of a shared underlying metacrisis.</p><h2>The Second Renaissance Whitepapers I & II</h2><p>The founding papers of the Second Renaissance initiative, arguing that a fundamental shift in culture and consciousness, comparable to the Renaissance, is both possible and necessary.</p><h2>Developmental Spaces: Cultural Incubators for a Time of Transformation</h2><p>A white paper by Rufus Pollock, Boaz Feldman and Rosie Bell describing dedicated, growth-oriented spaces in which communities pursue sustained inner development in the service of cultural transformation.</p><h2>In Tech We Trust</h2><p>A white paper by Rufus Pollock, Rosie Bell and Sylvie Barbier on late-modern society’s relationship with technology, asking what inner shift might help a future society avoid self-annihilation.</p>'
    },
    {
      id: 'perspectiva',
      title: 'Perspectiva',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Perspectiva</em> is a London-based institute, founded by Jonathan Rowson, that works on the relationship between systems, souls and society – on how inner life and outer structures together shape the crises of the present.</p><h2>Dispatches from a Time Between Worlds: Crisis and emergence in metamodernity</h2><p>A 2021 collection edited by Jonathan Rowson and Layman Pascal, gathering essays on the metacrisis and on <a href="#metamodernism">metamodernism</a> as a response to it.</p><h2>Education is the Metacrisis</h2><p>Zachary Stein’s essay arguing that the metacrisis is at root an educational crisis – a failure of humanity to learn at the scale required – and so also a species-wide learning opportunity.</p>'
    },
    {
      id: 'integral-institute',
      title: 'Integral Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Integral Institute</em> was founded by Ken Wilber in 1998 to develop and apply <a href="#integral-theory">integral theory</a> across disciplines – business, medicine, politics, education and spirituality.</p>'
    },
    {
      id: 'santa-fe-institute',
      title: 'Santa Fe Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Santa Fe Institute</em>, founded in New Mexico in 1984, is the leading research centre for the study of complex adaptive systems, bringing physicists, biologists, economists and social scientists together to study emergence, networks and evolution. See <a href="#complex-adaptive-system">complex adaptive systems</a>.</p>'
    },
    {
      id: 'centre-for-critical-realism',
      title: 'Centre for Critical Realism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Centre for Critical Realism</em> promotes the philosophy of <a href="#critical-realism">critical realism</a> founded by Roy Bhaskar, supporting research, teaching and publication across the social and natural sciences.</p>'
    },
    {
      id: 'center-for-integral-wisdom',
      title: 'Center for Integral Wisdom',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for Integral Wisdom</em> is a think tank co-founded by Marc Gafni and Ken Wilber to articulate a shared framework of value and meaning for a global civilisation, drawing on integral theory and the world’s wisdom traditions.</p>'
    },
    {
      id: 'the-rationalist-community',
      title: 'The Rationalist Community',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>rationalist community</em> is an online and offline movement devoted to improving human reasoning and decision-making, formed around Eliezer Yudkowsky’s writing on <em>LessWrong</em> from 2009 and Scott Alexander’s blog. Its concerns with cognitive bias, Bayesian reasoning and the risks of artificial intelligence shaped effective altruism and AI alignment.</p>'
    },
    {
      id: 'global-poverty-health-and-development',
      title: 'Global Poverty, Health & Development',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Global poverty, health and development</em> is the strand of effective altruism focused on improving the lives of the world’s poorest people – through cost-effective interventions such as malaria nets, deworming and direct cash transfers, evaluated by organisations such as GiveWell.</p>'
    },
    {
      id: 'ea-animal-welfare',
      title: 'EA Animal Welfare',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>EA animal welfare</em> is the strand of effective altruism focused on reducing the suffering of animals, especially the tens of billions in <a href="#factory-farming">factory farming</a>, through corporate campaigns, alternative proteins and research into animal sentience.</p>'
    },
    {
      id: 'progress-studies',
      title: 'Progress Studies',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Progress studies</em> is the proposed field, named by Patrick Collison and Tyler Cowen in 2019, that studies the causes of scientific, technological and economic progress in order to accelerate it. It is optimistic about growth and technology, in contrast to the risk-focused traditions it sits beside.</p>'
    },
    {
      id: 'existential-risk-studies',
      title: 'Existential Risk Studies',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Existential risk studies</em> is the interdisciplinary field that studies risks that could cause human extinction or permanently curtail humanity’s potential, and how to reduce them. It grew around Nick Bostrom’s work and institutions such as the Future of Humanity Institute and the Centre for the Study of Existential Risk. See <a href="#existential-risk">existential risk</a>.</p>'
    },
    {
      id: 'lightcone-infrastructure',
      title: 'Lightcone Infrastructure',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Lightcone Infrastructure</em> is the organisation that runs <em>LessWrong</em> and the AI Alignment Forum, and the Lighthaven campus in Berkeley, providing infrastructure for the rationalist and AI safety communities.</p>'
    },
    {
      id: 'miri',
      title: 'Machine Intelligence Research Institute (MIRI)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Machine Intelligence Research Institute</em>, founded by Eliezer Yudkowsky in 2000 as the Singularity Institute, was one of the first organisations to work on the alignment of advanced AI. In recent years it has turned to advocating an international halt to the development of superintelligence.</p>'
    },
    {
      id: 'centre-for-effective-altruism',
      title: 'Center for Effective Altruism (CEA)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Centre for Effective Altruism</em>, founded in Oxford in 2012 by William MacAskill and Toby Ord among others, supports the effective altruism community through its conferences, online forum and local groups.</p>'
    },
    {
      id: '80000-hours',
      title: '80,000 Hours (80K)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>80,000 Hours</em>, named for the hours in a typical working life, is an organisation founded by William MacAskill and Benjamin Todd in 2011 that gives research-based advice on choosing a career to have the greatest positive impact.</p>'
    },
    {
      id: 'roots-of-progress-institute',
      title: 'Roots of Progress Institute (RPI)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Roots of Progress Institute</em>, founded by Jason Crawford, works to build a culture of progress – through writing on the history of technology and industry, and through fellowships for writers in <a href="#progress-studies">progress studies</a>.</p>'
    },
    {
      id: 'future-of-humanity-institute',
      title: 'Future of Humanity Institute (FHI)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Future of Humanity Institute</em> was a research centre at the University of Oxford, founded by Nick Bostrom in 2005, that pioneered research on existential risk, macrostrategy, AI governance and the long-term future. It closed in 2024.</p>'
    },
    {
      id: 'acs-research-group',
      title: 'Alignment of Complex Systems Research Group (ACS)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Alignment of Complex Systems Research Group</em>, based at Charles University in Prague and co-founded by Jan Kulveit, studies alignment in systems of many interacting agents – hierarchical agency, gradual disempowerment and the alignment of AI with human institutions. See <a href="#hierarchical-agency">hierarchical agency</a>.</p>'
    },
    {
      id: 'forethought',
      title: 'Forethought',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Forethought</em> is a research organisation, associated with William MacAskill, that studies how to navigate the transition to advanced AI – including questions of power concentration, space governance and the long-term future.</p>'
    },
    {
      id: 'eliezer-yudkowsky',
      title: 'Eliezer Yudkowsky',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Eliezer Yudkowsky</em> is an American AI researcher and writer, founder of the Machine Intelligence Research Institute and of the rationalist community’s <em>LessWrong</em>. One of the earliest to argue that advanced AI poses an existential risk, he proposed <a href="#coherent-extrapolated-volition">coherent extrapolated volition</a> and co-wrote <em>If Anyone Builds It, Everyone Dies</em> (2025) with Nate Soares.</p>'
    },
    {
      id: 'robin-hanson',
      title: 'Robin Hanson',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Robin Hanson</em> is an American economist at George Mason University, known for prediction markets, <em>The Age of Em</em> (2016), <em>The Elephant in the Brain</em> (2018, with Kevin Simler) and the <a href="#grabby-aliens">grabby aliens</a> model.</p>'
    },
    {
      id: 'scott-alexander',
      title: 'Scott Alexander',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Scott Alexander</em> is the pen name of an American psychiatrist and blogger whose <em>Slate Star Codex</em> and <em>Astral Codex Ten</em> are central to the rationalist community. His essay “Meditations on Moloch” (2014) gave the multipolar trap its best-known name. See <a href="#moloch">Moloch</a>.</p>'
    },
    {
      id: 'peter-singer',
      title: 'Peter Singer',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Peter Singer</em> is an Australian moral philosopher whose <em>Animal Liberation</em> (1975) and “Famine, Affluence, and Morality” (1972) laid foundations for the animal welfare movement and for effective altruism.</p>'
    },
    {
      id: 'will-macaskill',
      title: 'Will MacAskill',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>William MacAskill</em> is a Scottish philosopher, a co-founder of effective altruism and of the Centre for Effective Altruism and 80,000 Hours. His books include <em>Doing Good Better</em> (2015) and <em>What We Owe the Future</em> (2022), a case for <a href="#longtermism">longtermism</a>.</p>'
    },
    {
      id: 'jason-crawford',
      title: 'Jason Crawford',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jason Crawford</em> is an American writer and the founder of the Roots of Progress, a central figure in the progress studies movement, whose writing traces the history of technology and argues for a renewed culture of progress.</p>'
    },
    {
      id: 'steven-pinker',
      title: 'Steven Pinker',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Steven Pinker</em> is a Canadian-American cognitive psychologist whose <em>The Better Angels of Our Nature</em> (2011) and <em>Enlightenment Now</em> (2018) argue that violence has declined and human wellbeing has improved through reason, science and humanism.</p>'
    },
    {
      id: 'tyler-cowen',
      title: 'Tyler Cowen',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Tyler Cowen</em> is an American economist at George Mason University, author of <em>The Great Stagnation</em> (2011) and <em>Stubborn Attachments</em> (2018), and co-founder of the progress studies movement with Patrick Collison.</p>'
    },
    {
      id: 'nick-bostrom',
      title: 'Nick Bostrom',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Nick Bostrom</em> is a Swedish philosopher, founder of the Future of Humanity Institute and a founder of existential risk studies. His work includes the <a href="#vulnerable-world-hypothesis">vulnerable world hypothesis</a>, <a href="#astronomical-waste">astronomical waste</a>, <em>Superintelligence</em> (2014) and <em>Deep Utopia</em> (2024).</p>'
    },
    {
      id: 'toby-ord',
      title: 'Toby Ord',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Toby Ord</em> is an Australian philosopher at Oxford, a co-founder of effective altruism and Giving What We Can, and author of <em>The Precipice</em> (2020), which estimates the risks of existential catastrophe in the coming century.</p>'
    },
    {
      id: 'anders-sandberg',
      title: 'Anders Sandberg',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Anders Sandberg</em> is a Swedish researcher, formerly at the Future of Humanity Institute, who works on existential risk, human enhancement and the long-term future, including his <a href="#grand-futures">Grand Futures</a> project on the limits of what civilisation could achieve.</p>'
    },
    {
      id: 'jan-kulveit',
      title: 'Jan Kulveit',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jan Kulveit</em> is a Czech researcher who leads the Alignment of Complex Systems Research Group in Prague, working on <a href="#hierarchical-agency">hierarchical agency</a> and <a href="#gradual-disempowerment">gradual disempowerment</a>.</p>'
    },
    {
      id: 'meta-space',
      title: 'Meta-space',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>meta-space</em> is the loose ecosystem of thinkers, institutes, communities and media working on the <a href="#metacrisis">metacrisis</a> through integrative metatheory, sensemaking and cultural renewal. It draws on <a href="#integral-theory">integral theory</a>, <a href="#critical-realism">critical realism</a>, <a href="#metamodernism">metamodernism</a>, systems thinking and contemplative practice, and has been named in many ways – the liminal web, the sensemaking web, the emergentsia, the metamodern movement.</p><p>What its members share is the conviction that the crises of the present cannot be solved at the level of policy alone, but require changes in worldview, culture and consciousness – a shift of civilisational paradigm.</p>'
    },
    {
      id: 'para-academic-space',
      title: 'PARA-academic space',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>PARA-academic space</em> is the network of research and advocacy communities that grew up beside the universities rather than within them: <a href="#the-rationalist-community">rationalism</a>, <a href="#effective-altruism">effective altruism</a>, <a href="#progress-studies">progress studies</a> and <a href="#existential-risk-studies">existential risk studies</a>. Funded largely by philanthropy and organised through blogs, forums, institutes and grant-makers, it moves faster than academia and has shaped the fields of <a href="#ai-alignment">AI alignment</a> and <a href="#macrostrategy">macrostrategy</a>.</p><p>Its style is quantitative and analytic – expected value, forecasting, decision theory – in contrast to the integrative, cultural emphasis of the <a href="#meta-space">meta-space</a>.</p>'
    },
    {
      id: 'second-renaissance',
      title: 'Second Renaissance',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Second Renaissance</em> is the movement, initiated by Rufus Pollock and <a href="#life-itself">Life Itself</a>, that argues the crises of the present call for a transformation of culture and consciousness comparable to the Renaissance – a shift in worldview from the modern paradigm to a wiser, more relational one, pursued through inner development, community and research.</p>'
    },
    {
      id: 'integral-life',
      title: 'Integral Life',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Integral Life</em> is the media platform and community built around Ken Wilber’s <a href="#integral-theory">integral theory</a>, publishing courses, dialogues and practices that apply the integral framework to personal development, culture and politics.</p>'
    },
    {
      id: 'deep-ecology',
      title: 'Deep Ecology',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Deep ecology</em> is the environmental philosophy founded by Arne Næss in 1973, which holds that all living beings have intrinsic value independent of their usefulness to humans. It distinguishes itself from “shallow” environmentalism concerned only with human interests, and calls for a fundamental change in humanity’s relationship with nature.</p>'
    },
    {
      id: 'web-3',
      title: 'Web 3.0',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Web 3.0</em> names the vision of an internet built on decentralised technologies – blockchains, cryptographic tokens and peer-to-peer protocols – in which users own their data and coordinate without central platforms. In the meta-space it is explored as infrastructure for new forms of governance, funding and collective action, as well as criticised for its speculation.</p>'
    },
    {
      id: 'the-emergentsia',
      title: 'The Emergentsia',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Emergentsia</em> is Brent Cooper’s term (2019) for a new class of intellectuals emerging to grapple with the metacrisis and help manage the transition – to emergence, he wrote, what the intelligentsia was to intelligence. It names a constellation of sensemaking approaches attempting to synthesise modernity and postmodernity into metamodernity.</p>'
    },
    {
      id: 'alt-humanities',
      title: 'Alt-Humanities',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>alt-humanities</em> are the heterodox currents of theory that broke, from the 1990s onwards, with the humanist and social-constructivist consensus of late twentieth-century thought. Where that consensus centred the human subject, language and discourse, these currents turn towards technology, capital, matter and the non-human: <a href="#accelerationism">accelerationism</a>, which treats capital and technology as forces in their own right; <a href="#xenofeminism">xenofeminism</a>, which repurposes technology against the naturalisation of gender; and <a href="#speculative-realism">speculative realism</a>, which seeks to think a reality independent of human thought. Alongside them stand the older radical traditions they draw on and contend with: the many branches of <a href="#marxism">Marxism</a>, and the <a href="#critical-theory">critical theory</a> of <a href="#the-frankfurt-school">the Frankfurt School</a> and its successors. Much of this work has developed outside or at the edges of the academy – in independent presses, art institutions and online.</p>'
    },
    {
      id: 'landian-accelerationism',
      title: 'Landian Accelerationism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Nick Land, <em>Fanged Noumena: Collected Writings 1987–2007</em> (2011).'],
      html: '<p><em>Landian accelerationism</em> is the original form of <a href="#accelerationism">accelerationism</a>, developed by Nick Land with the Cybernetic Culture Research Unit (CCRU) at the University of Warwick in the 1990s. It treats capital as an alien, self-organising intelligence – a runaway process of techno-economic acceleration that dissolves human institutions and subjectivity on its way to a post-human future – and, rather than resisting this process, affirms it.</p>'
    },
    {
      id: 'unconditional-accelerationism',
      title: 'Unconditional Accelerationism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Unconditional accelerationism</em> (u/acc) is a current that emerged online in the 2010s, refusing both the left and right appropriations of <a href="#accelerationism">accelerationism</a>. It holds that acceleration is not a political programme to be steered towards any end, but an unconditional process already under way, which no subject – left or right – can direct; the only coherent stance is to understand it, not to command it.</p>'
    },
    {
      id: 'right-accelerationism',
      title: 'Right Accelerationism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Nick Land, “The Dark Enlightenment” (2012).'],
      html: '<p><em>Right accelerationism</em> (r/acc) affirms the intensification of capitalism and technology as desirable in itself, and sees the dissolution it brings to democratic and egalitarian institutions as a gain rather than a cost. Associated with the later work of Nick Land, including “The Dark Enlightenment” (2012), it is linked to neoreactionary ideas of hierarchy, competition and “exit” from the state. See <a href="#landian-accelerationism">Landian accelerationism</a> and <a href="#left-accelerationism-and-the-red-stack">left accelerationism</a>.</p>'
    },
    {
      id: 'cyberfeminism',
      title: 'Cyberfeminism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Donna Haraway, “A Cyborg Manifesto” (1985).', 'Sadie Plant, <em>Zeros + Ones: Digital Women and the New Technoculture</em> (1997).'],
      html: '<p><em>Cyberfeminism</em> is the movement of the 1990s that explored the relations between women, technology and cyberspace, embracing digital technology as a means of undoing patriarchal and binary orders rather than rejecting it as male domain. Prefigured by Donna Haraway’s “A Cyborg Manifesto” (1985), it was named in the work of the Australian art collective VNS Matrix (1991) and developed by Sadie Plant in <em>Zeros + Ones</em> (1997). It is a direct precursor of <a href="#xenofeminism">xenofeminism</a>.</p>'
    },
    {
      id: 'gender-abolitionism',
      title: 'Gender Abolitionism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Shulamith Firestone, <em>The Dialectic of Sex</em> (1970).', 'Laboria Cuboniks, <em>Xenofeminism: A Politics for Alienation</em> (2015).'],
      html: '<p><em>Gender abolitionism</em> is the aim of abolishing gender as a social category and hierarchy, rather than reforming the relations between genders. Its roots lie in radical feminism, notably Shulamith Firestone’s <em>The Dialectic of Sex</em> (1970), which looked to technology to free women from the biological basis of their subordination; <a href="#xenofeminism">xenofeminism</a> renewed it with the call to “let a hundred sexes bloom”. See <a href="#post-genderism">post-genderism</a>.</p>'
    },
    {
      id: 'anti-essentialism',
      title: 'Anti-Essentialism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Simone de Beauvoir, <em>The Second Sex</em> (1949).', 'Judith Butler, <em>Gender Trouble</em> (1990).'],
      html: '<p><em>Anti-essentialism</em> is the rejection of the idea that categories such as gender, race or human nature are defined by fixed, natural essences. Simone de Beauvoir’s “one is not born, but rather becomes, a woman” (1949) is its classic statement, and Judith Butler’s account of gender as performance (1990) its best-known development. In <a href="#xenofeminism">xenofeminism</a> it becomes anti-naturalism: the refusal to treat what is given by nature as therefore right.</p>'
    },
    {
      id: 'speculative-realism',
      title: 'Speculative Realism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Quentin Meillassoux, <em>After Finitude</em> (2006).', 'Graham Harman, <em>Speculative Realism: An Introduction</em> (2018).'],
      html: '<p><em>Speculative realism</em> is the movement in continental philosophy named after a 2007 workshop at Goldsmiths, London, with Ray Brassier, Iain Hamilton Grant, Graham Harman and Quentin Meillassoux. Its members differ widely, but share a rejection of what Meillassoux calls “correlationism” – the post-Kantian assumption that we can only ever know the correlation between thought and world, never the world in itself – and an attempt to think reality as it is independent of human access.</p>'
    },
    {
      id: 'assemblage-theory',
      title: 'Assemblage Theory',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Gilles Deleuze and Félix Guattari, <em>A Thousand Plateaus</em> (1980).', 'Manuel DeLanda, <em>A New Philosophy of Society: Assemblage Theory and Social Complexity</em> (2006).'],
      html: '<p><em>Assemblage theory</em> describes social and natural entities as assemblages – wholes composed of heterogeneous parts whose properties emerge from their relations, and whose parts can be detached and plugged into other assemblages. It derives from Gilles Deleuze and Félix Guattari’s <em>agencement</em> in <em>A Thousand Plateaus</em> (1980), and was developed into a social ontology by Manuel DeLanda (2006), for whom persons, organisations, cities and states are assemblages at different scales.</p>'
    },
    {
      id: 'object-oriented-ontology',
      title: 'Object-Oriented Ontology',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Graham Harman, <em>Tool-Being: Heidegger and the Metaphysics of Objects</em> (2002).', 'Graham Harman, <em>Object-Oriented Ontology: A New Theory of Everything</em> (2018).'],
      html: '<p><em>Object-oriented ontology</em> (OOO) is the branch of <a href="#speculative-realism">speculative realism</a> developed by Graham Harman from the late 1990s, and taken up by Levi Bryant, Ian Bogost and Timothy Morton. It holds that reality is made of objects – human, natural, technical and fictional alike – and that every object withdraws from full access, both by humans and by other objects, so that no relation exhausts what a thing is. It rejects the privileging of human experience as the measure of what exists.</p>'
    },
    {
      id: 'dark-ecology',
      title: 'Dark Ecology',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Timothy Morton, <em>Dark Ecology: For a Logic of Future Coexistence</em> (2016).'],
      html: '<p><em>Dark ecology</em> is Timothy Morton’s name for an ecological awareness that abandons the idea of Nature as a harmonious whole outside us. Ecological awareness, on this view, is uncanny and melancholy: we find ourselves entangled with other beings and with <a href="#hyperobjects">hyperobjects</a> such as climate change, implicated in what harms them, with no outside position from which to act. Morton traces its roots to agriculture and the logic that has organised human life since the Neolithic.</p>'
    },
    {
      id: 'alien-phenomenology',
      title: 'Alien Phenomenology',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Ian Bogost, <em>Alien Phenomenology, or What It’s Like to Be a Thing</em> (2012).'],
      html: '<p><em>Alien phenomenology</em> is Ian Bogost’s approach, in <em>Alien Phenomenology, or What It’s Like to Be a Thing</em> (2012), to speculating about the experience of things – how a computer, a microprocessor or a cup “perceives” and relates to the world – from within <a href="#object-oriented-ontology">object-oriented ontology</a>. Rather than describing things only through their use for humans, it asks what it is like to be them, often through the making of artefacts and software. See <a href="#critical-alien-phenomenology">critical alien phenomenology</a>.</p>'
    },
    {
      id: 'effective-accelerationism',
      title: 'Effective Accelerationism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Marc Andreessen, “The Techno-Optimist Manifesto” (2023).'],
      html: '<p><em>Effective accelerationism</em> (e/acc) is a techno-optimist movement that emerged in Silicon Valley and online in 2022, associated with Guillaume Verdon (“Beff Jezos”) and endorsed by figures such as Marc Andreessen, whose “Techno-Optimist Manifesto” (2023) drew on it. Its name plays on effective altruism, against whose concern with AI risk it defined itself. Grounding its claims in thermodynamics, it holds that the growth of technology and capital is a natural process of increasing energy use and complexity which should be accelerated rather than restrained, and opposes regulation and deceleration of AI. Unlike <a href="#landian-accelerationism">Landian accelerationism</a>, from which it borrows its name, it presents acceleration as good for humanity rather than indifferent to it. See <a href="#right-accelerationism">right accelerationism</a>.</p>'
    },
    {
      id: 'post-marxism',
      title: 'Post-Marxism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Ernesto Laclau and Chantal Mouffe, <em>Hegemony and Socialist Strategy</em> (1985).'],
      html: '<p><em>Post-Marxism</em> is the body of thought that retains elements of <a href="#marxism">Marxism</a> while abandoning some of its core commitments – above all the primacy of the economy and of class as the determining force of history. Its defining work is Ernesto Laclau and Chantal Mouffe’s <em>Hegemony and Socialist Strategy</em> (1985), which recasts politics as the contingent construction of hegemony through discourse, across a plurality of struggles – of class, gender, race, ecology – none of which is privileged in advance.</p>'
    },
    {
      id: 'freudo-marxism',
      title: 'Freudo-Marxism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Wilhelm Reich, <em>The Mass Psychology of Fascism</em> (1933).', 'Herbert Marcuse, <em>Eros and Civilization</em> (1955).'],
      html: '<p><em>Freudo-Marxism</em> is the attempt to join <a href="#marxism">Marxism</a> with psychoanalysis: to explain how economic and social domination is reproduced within the psyche, through repression, character and desire, and why the oppressed so often come to want their own subordination. Its pioneers were Wilhelm Reich, in <em>The Mass Psychology of Fascism</em> (1933), and Erich Fromm; it was developed within <a href="#the-frankfurt-school">the Frankfurt School</a>, notably by Herbert Marcuse in <em>Eros and Civilization</em> (1955), and later by Deleuze and Guattari.</p>'
    },
    {
      id: 'marxism-and-darwinism',
      title: 'Marxism & Darwinism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Anton Pannekoek, <em>Marxism and Darwinism</em> (1909).', 'Peter Singer, <em>A Darwinian Left: Politics, Evolution and Cooperation</em> (1999).'],
      html: '<p><em>Marxism and Darwinism</em> names the long and uneasy relation between the two great nineteenth-century theories of historical change. Marx and Engels welcomed <em>On the Origin of Species</em> (1859) as a natural-scientific basis for their materialist view of history, and Engels likened Marx to Darwin at his graveside. Later Marxists, such as Anton Pannekoek in <em>Marxism and Darwinism</em> (1909), distinguished the laws of biological evolution from those of social development, rejecting the use of Darwin to naturalise competition; and Peter Singer’s <em>A Darwinian Left</em> (1999) asked what a left politics would look like that took evolved human nature seriously.</p>'
    },
    {
      id: 'marxism-and-behaviourism',
      title: 'Marxism & Behaviourism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Ivan Pavlov, <em>Conditioned Reflexes</em> (1927).', 'B. F. Skinner, <em>Walden Two</em> (1948).'],
      html: '<p><em>Marxism and behaviourism</em> names the meeting of two programmes that hold human nature to be shaped by its conditions. If, as Marx argued, human beings are the ensemble of their social relations, then changing those relations should change people – a premise that made Ivan Pavlov’s reflexology central to Soviet science and to the project of forming a “New Soviet Man”. B. F. Skinner’s utopia <em>Walden Two</em> (1948) and his <a href="#technology-of-behaviour">technology of behaviour</a> pursued a similar aim of designing society by designing environments, though without Marx’s politics. Both raise the question of who conditions the conditioners.</p>'
    },
    {
      id: 'the-frankfurt-school',
      title: 'The Frankfurt School',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Max Horkheimer and Theodor W. Adorno, <em>Dialectic of Enlightenment</em> (1944/1947).', 'Martin Jay, <em>The Dialectical Imagination</em> (1973).'],
      html: '<p><em>The Frankfurt School</em> is the circle of thinkers associated with the Institute for Social Research, founded in Frankfurt in 1923 and directed from 1930 by Max Horkheimer, which founded <a href="#critical-theory">critical theory</a>. Its members – among them Theodor W. Adorno, Herbert Marcuse, Erich Fromm, Friedrich Pollock and, at its edges, Walter Benjamin – sought to understand why the revolution Marx predicted had not come, turning to culture, psychology and the “culture industry” to explain the stability of capitalism and the rise of fascism. Exiled under Nazism, the Institute returned to Frankfurt after the war.</p>'
    },
    {
      id: 'generations-of-critical-theory',
      title: '1st, 2nd & 3rd Generations of Critical Theory',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Jürgen Habermas, <em>The Theory of Communicative Action</em> (1981).', 'Axel Honneth, <em>The Struggle for Recognition</em> (1992).'],
      html: '<p><a href="#critical-theory">Critical theory</a> in the line of <a href="#the-frankfurt-school">the Frankfurt School</a> is commonly divided into generations. The <em>first generation</em> – Horkheimer, Adorno and Marcuse – developed a critique of instrumental reason, mass culture and the “administered world”, increasingly pessimistic about the prospects for emancipation. The <em>second generation</em>, led by Jürgen Habermas, grounded critique instead in communication, in <em>The Theory of Communicative Action</em> (1981), defending the unfinished project of modernity and deliberative democracy. The <em>third generation</em>, led by Axel Honneth, recentred it on the struggle for recognition (1992); later figures such as Rainer Forst and Rahel Jaeggi are sometimes counted as a fourth.</p>'
    },
    {
      id: 'classical-atheism',
      title: 'Classical Atheism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Paul-Henri Thiry, Baron d’Holbach, <em>The System of Nature</em> (1770).'],
      html: '<p><em>Classical atheism</em> is the tradition of disbelief in God that runs from the materialists of antiquity – Democritus, Epicurus and Lucretius – through the radical Enlightenment of Baron d’Holbach and Denis Diderot to the nineteenth-century critiques of Ludwig Feuerbach, Karl Marx, Friedrich Nietzsche and Sigmund Freud, who sought to explain religion as a human projection, an ideology or an illusion. Where <a href="#new-atheism">New Atheism</a> argued chiefly from natural science, classical atheism was rooted in philosophy and in a critique of religion’s social and psychological functions.</p>'
    },
    {
      id: 'anti-theism',
      title: 'Anti-theism',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Christopher Hitchens, <em>God Is Not Great: How Religion Poisons Everything</em> (2007).'],
      html: '<p><em>Anti-theism</em> is opposition to theism itself, going beyond the atheist’s lack of belief in God to the claim that belief in God – and religion as an institution – is harmful, and that it would be bad if God existed. Christopher Hitchens, who described himself as an anti-theist rather than merely an atheist, gave it its best-known form in <em>God Is Not Great</em> (2007), arguing that a supreme authority with total power over human life would amount to a “celestial dictatorship”. It was a defining stance of <a href="#new-atheism">New Atheism</a>.</p>'
    },
    {
      id: 'secular-spirituality',
      title: 'Secular Spirituality',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      refs: ['Sam Harris, <em>Waking Up: A Guide to Spirituality Without Religion</em> (2014).'],
      html: '<p><em>Secular spirituality</em> is the pursuit of spiritual experience and practice – meditation, contemplation, self-transcendence, a sense of the sacred – without religious belief or doctrine. Sam Harris, one of the leading figures of <a href="#new-atheism">New Atheism</a>, gave it its best-known recent statement in <em>Waking Up: A Guide to Spirituality Without Religion</em> (2014) and the meditation app of the same name, arguing that insights found in contemplative traditions such as Buddhism and Advaita Vedanta – above all, that the sense of a separate self is an illusion – can be tested in experience and stand apart from the metaphysical claims of religion. See <a href="#post-theism">post-theism</a>.</p>'
    },
    {
      id: 'the-liminal-web',
      title: 'The Liminal/Sensemaking/Intellectual Deep Web',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The liminal web</em> is Joe Lightfoot’s name (2021) for an emergent subculture of sensemakers, meta-theorists and systems poets – writers, podcasters and community builders with a high crossover of perspectives, who occupy a threshold between a dying culture and an emerging one. The same constellation has been called the <em>sensemaking web</em> and the <em>intellectual deep web</em>.</p>'
    },
    {
      id: 'jordan-hall',
      title: 'Jordan Hall',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jordan Hall</em> (formerly Jordan Greenhall) is an American technologist, a co-founder of DivX and one of the originators of <a href="#game-b">Game B</a>. His work concerns sensemaking, collective intelligence and the transition beyond the rivalrous dynamics of the present civilisation.</p>'
    },
    {
      id: 'tristan-harris',
      title: 'Tristan Harris',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Tristan Harris</em> is an American technology ethicist, formerly a design ethicist at Google, and a co-founder of the <a href="#center-for-humane-technology">Center for Humane Technology</a>. A critic of the attention economy, he appeared in <em>The Social Dilemma</em> (2020) and has since turned to the risks of AI.</p>'
    },
    {
      id: 'iain-mcgilchrist',
      title: 'Iain McGilchrist',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Iain McGilchrist</em> is a British psychiatrist and writer. In <em>The Master and His Emissary</em> (2009) he argues that Western culture has come to be dominated by the narrow, instrumental attention of the brain’s left hemisphere at the expense of the right’s broader, relational attention; <em>The Matter with Things</em> (2021) extends the argument into metaphysics.</p>'
    },
    {
      id: 'john-vervaeke',
      title: 'John Vervaeke',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>John Vervaeke</em> is a Canadian cognitive scientist at the University of Toronto, known for the lecture series <em>Awakening from the Meaning Crisis</em> (2019), for his account of relevance realisation and for his work on the cultivation of wisdom. See <a href="#the-meaning-crisis">the meaning crisis</a>.</p>'
    },
    {
      id: 'jonathan-rowson',
      title: 'Jonathan Rowson',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jonathan Rowson</em> is a Scottish philosopher and chess grandmaster, a co-founder and the director of <a href="#perspectiva">Perspectiva</a>. His work joins philosophy, spirituality and politics in response to the metacrisis, from a broadly metamodern perspective.</p>'
    },
    {
      id: 'hanzi-freinacht',
      title: 'Hanzi Freinacht',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Hanzi Freinacht</em> is the pen name of the Swedish writers Daniel Görtz and Emil Ejner Friis, authors of <em>The Listening Society</em> (2017) and <em>Nordic Ideology</em> (2019), which set out a political <a href="#metamodernism">metamodernism</a> for the development of more complex and caring societies.</p>'
    },
    {
      id: 'bonnitta-roy',
      title: 'Bonnitta Roy',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Bonnitta Roy</em> is an American philosopher and teacher whose work joins process philosophy, contemplative practice and collaborative inquiry. She founded the Alderlore Insight Center and has been a leading voice in integral and post-integral thought.</p>'
    },
    {
      id: 'jamie-wheal',
      title: 'Jamie Wheal',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jamie Wheal</em> is the founder of the Flow Genome Project and the author of <em>Stealing Fire</em> (2017, with Steven Kotler) and <em>Recapture the Rapture</em> (2021), which addresses the meaning crisis and proposes a “Meaning 3.0” – an open-source approach to meaning and ecstatic experience.</p>'
    },
    {
      id: 'vanessa-machado-de-oliveira',
      title: 'Vanessa Machado de Oliveira',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Vanessa Machado de Oliveira</em> is a Brazilian-Canadian educator at the University of British Columbia and a member of the Gesturing Towards Decolonial Futures collective. Her book <em>Hospicing Modernity</em> (2021) treats modernity as a system in decline, and asks how to accompany its dying well while making room for what may come next.</p>'
    },
    {
      id: 'center-for-humane-technology',
      title: 'Center for Humane Technology',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for Humane Technology</em> is an American non-profit founded in 2018 by <a href="#tristan-harris">Tristan Harris</a>, Aza Raskin and Randima Fernando, working to realign technology with the wellbeing of people and societies – first against attention-extracting design, and since 2023 on the risks of AI.</p>'
    },
    {
      id: 'the-stoa',
      title: 'The Stoa',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Stoa</em> is an online forum for dialogue and sensemaking founded by Peter Limberg, hosting conversations among the thinkers and practitioners of the metacrisis and the meaning crisis.</p>'
    },
    {
      id: 'rebel-wisdom',
      title: 'Rebel Wisdom',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Rebel Wisdom</em> is a British media project founded in 2018 by the former BBC journalist David Fuller, whose films and interviews helped give shape to the “sensemaking” scene of the late 2010s.</p>'
    },
    {
      id: 'metamoderna',
      title: 'Metamoderna',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Metamoderna</em> is a think tank and publisher associated with <a href="#hanzi-freinacht">Hanzi Freinacht</a>, developing political <a href="#metamodernism">metamodernism</a> and the institutions it proposes.</p>'
    },
    {
      id: 'dark-mountain-project',
      title: 'Dark Mountain Project',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Dark Mountain Project</em> is a network of writers and artists founded in 2009 by <a href="#paul-kingsnorth">Paul Kingsnorth</a> and Dougald Hine with the manifesto <em>Uncivilisation</em>, which called for a culture able to face ecological and social unravelling without the myth of progress.</p>'
    },
    {
      id: 'vervaeke-foundation',
      title: 'Vervaeke Foundation',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Vervaeke Foundation</em> is a non-profit organisation established to extend <a href="#john-vervaeke">John Vervaeke</a>’s work on the meaning crisis and the cultivation of wisdom.</p>'
    },
    {
      id: 'post-carbon-institute',
      title: 'Post Carbon Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Post Carbon Institute</em> is an American non-profit founded in 2003 that works on the transition to a world of lower energy use – peak oil, energy descent and community resilience – with Richard Heinberg as its long-standing senior fellow.</p>'
    },
    {
      id: 'deep-adaptation',
      title: 'Deep Adaptation',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Deep Adaptation</em> is the framework set out by Jem Bendell in the paper “Deep Adaptation: A Map for Navigating Climate Tragedy” (2018), which starts from the likelihood of societal collapse due to climate change and asks how to respond through resilience, relinquishment, restoration and reconciliation. See <a href="#collapsology">collapsology</a>.</p>'
    },
    {
      id: 'degrowth',
      title: 'Degrowth',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Degrowth</em> (from the French <em>décroissance</em>) is a movement and field of research advocating a planned reduction of energy and material throughput in rich countries, to bring economies within ecological limits while improving wellbeing. Its figures include André Gorz, Serge Latouche, Giorgos Kallis and Jason Hickel.</p>'
    },
    {
      id: 'ai-governance',
      title: 'AI Governance',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>AI governance</em> is the field concerned with the governance of the development and use of advanced AI – international coordination, compute governance, standards and the institutions they require – which grew in part out of macrostrategy research, notably the Centre for the Governance of AI, founded at the Future of Humanity Institute in 2018.</p>'
    },
    {
      id: 'forecasting',
      title: 'Forecasting',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Forecasting</em> as a field grew from Philip Tetlock’s research on expert judgment, the Good Judgment Project and <em>Superforecasting</em> (2015, with Dan Gardner), alongside prediction markets and platforms such as Metaculus, and is widely used in the effective altruism and rationalist communities to reason about the future.</p>'
    },
    {
      id: 'cfar',
      title: 'Center for Applied Rationality (CFAR)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for Applied Rationality</em> is a Berkeley non-profit founded in 2012 – by Anna Salamon, <a href="#julia-galef">Julia Galef</a> and others – that teaches techniques of rationality and decision-making in workshops.</p>'
    },
    {
      id: 'lesswrong',
      title: 'LessWrong',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>LessWrong</em> is the online forum founded by <a href="#eliezer-yudkowsky">Eliezer Yudkowsky</a> in 2009, home of his <em>Sequences</em> and the centre of the rationalist community. It is now run by <a href="#lightcone-infrastructure">Lightcone Infrastructure</a>.</p>'
    },
    {
      id: 'open-philanthropy',
      title: 'Open Philanthropy',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Open Philanthropy</em> is a grant-making organisation, funded chiefly by Dustin Moskovitz and Cari Tuna, that grew out of <a href="#givewell">GiveWell</a>. One of the largest funders in effective altruism, it supports work on global health, animal welfare, biosecurity and the risks of advanced AI.</p>'
    },
    {
      id: 'givewell',
      title: 'GiveWell',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>GiveWell</em> is a charity evaluator founded in 2007 by <a href="#holden-karnofsky">Holden Karnofsky</a> and Elie Hassenfeld, which researches and recommends the charities that do the most good per dollar.</p>'
    },
    {
      id: 'giving-what-we-can',
      title: 'Giving What We Can',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Giving What We Can</em> is an organisation founded in 2009 by <a href="#toby-ord">Toby Ord</a> and <a href="#will-macaskill">Will MacAskill</a>, whose members pledge to give at least ten per cent of their income to effective charities.</p>'
    },
    {
      id: 'institute-for-progress',
      title: 'Institute for Progress',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Institute for Progress</em> is a Washington think tank founded in 2022 by Alec Stapp and Caleb Watney, working on policy to accelerate scientific, technological and industrial progress.</p>'
    },
    {
      id: 'works-in-progress',
      title: 'Works in Progress',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Works in Progress</em> is a magazine of new and underrated ideas for improving the world, founded in 2020 and now published by Stripe; it is one of the main venues of <a href="#progress-studies">progress studies</a>.</p>'
    },
    {
      id: 'centre-for-the-study-of-existential-risk',
      title: 'Centre for the Study of Existential Risk (CSER)',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Centre for the Study of Existential Risk</em> is a research centre at the University of Cambridge founded in 2012 by Huw Price, <a href="#martin-rees">Martin Rees</a> and Jaan Tallinn, studying risks that could lead to human extinction or civilisational collapse.</p>'
    },
    {
      id: 'future-of-life-institute',
      title: 'Future of Life Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Future of Life Institute</em> is a non-profit founded in 2014 by <a href="#max-tegmark">Max Tegmark</a>, Jaan Tallinn and others, working to steer transformative technologies away from extreme risks. It organised the Asilomar AI Principles (2017) and the 2023 open letter calling for a pause in giant AI experiments.</p>'
    },
    {
      id: 'global-priorities-institute',
      title: 'Global Priorities Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Global Priorities Institute</em> was a research centre at the University of Oxford, founded in 2018, that developed the academic foundations of effective altruism and <a href="#longtermism">longtermism</a> in philosophy and economics. It closed in 2025. See <a href="#global-priorities-research">global priorities research</a>.</p>'
    },
    {
      id: 'center-for-ai-safety',
      title: 'Center for AI Safety',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Center for AI Safety</em> is a San Francisco non-profit founded by Dan Hendrycks and Oliver Zhang, doing technical and field-building work on AI safety. Its 2023 Statement on AI Risk declared that mitigating the risk of extinction from AI should be a global priority.</p>'
    },
    {
      id: 'redwood-research',
      title: 'Redwood Research',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Redwood Research</em> is a Berkeley non-profit founded in 2021 that works on AI safety, and is known for its research on AI control – keeping AI systems safe even if they are misaligned.</p>'
    },
    {
      id: 'julia-galef',
      title: 'Julia Galef',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Julia Galef</em> is an American writer, a co-founder of the <a href="#cfar">Center for Applied Rationality</a> and the host of the podcast <em>Rationally Speaking</em>. In <em>The Scout Mindset</em> (2021) she argues for the motivation to see things as they are rather than as one wishes them to be.</p>'
    },
    {
      id: 'holden-karnofsky',
      title: 'Holden Karnofsky',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Holden Karnofsky</em> is an American co-founder of <a href="#givewell">GiveWell</a> and <a href="#open-philanthropy">Open Philanthropy</a>, and the author of the blog series <em>The Most Important Century</em> (2021), which argues that advanced AI could make this century the most consequential in history.</p>'
    },
    {
      id: 'patrick-collison',
      title: 'Patrick Collison',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Patrick Collison</em> is an Irish entrepreneur, a co-founder of Stripe and of the Arc Institute, who with <a href="#tyler-cowen">Tyler Cowen</a> called for a new science of <a href="#progress-studies">progress studies</a> in <em>The Atlantic</em> (2019).</p>'
    },
    {
      id: 'martin-rees',
      title: 'Martin Rees',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Martin Rees</em> is a British cosmologist, the Astronomer Royal and a co-founder of the <a href="#centre-for-the-study-of-existential-risk">Centre for the Study of Existential Risk</a>. In <em>Our Final Century</em> (2003) he put the odds of civilisation surviving the century at no better than even.</p>'
    },
    {
      id: 'max-tegmark',
      title: 'Max Tegmark',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Max Tegmark</em> is a Swedish-American physicist at MIT, a co-founder and the president of the <a href="#future-of-life-institute">Future of Life Institute</a>, and the author of <em>Life 3.0</em> (2017), on the future of life with artificial intelligence.</p>'
    },
    {
      id: 'paul-christiano',
      title: 'Paul Christiano',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Paul Christiano</em> is an American AI alignment researcher who helped develop reinforcement learning from human feedback at OpenAI, founded the Alignment Research Center in 2021, and in 2024 became head of AI safety at the US AI Safety Institute.</p>'
    }
  ];

    var parentOf = {}, sibsOf = {}, topOf = {}, kidsOf = {}, cur = root, parent = land ? { title: land.title, heading: true } : sec, blocks = false;
    function at(id, x) {   // (its parent, list, block and nested concepts at this place)

      } else if (seg.indexOf('h:') === 0 || seg.indexOf('q:') === 0) {

    var loc = place && (LOC_VIA[c.id] && placeFromLoc(LOC_VIA[c.id], c) ? LOC_VIA[c.id] : landscapeLoc(c.id));

  // A concept's own place in the paradigm (the first place it is filed, as the paradigm's walk

    var f = document.getElementById('site-footer');
    var concepts = CONCEPTS.filter(inAZ);
    var coined = CONCEPTS.filter(function (c) { return c.coined && c !== ROOT && !c.cpOnly; }).length;
    var sections = childrenOf(ROOT.id);
    var NUM = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
    function group(title, items) { return '<p class="foot-head">' + title + '</p><ul>' + items.join('') + '</ul>'; }
    function li(inner) { return '<li>' + inner + '</li>'; }
    f.innerHTML = '<div class="foot-inner"><div class="foot-main">' +
      '<div class="foot-lede">' +
        '<p class="foot-title"><a href="#the-map">Civilisation Theory Map</a></p>' +
        '<p class="foot-desc">A conceptual adaptive system: a map of the concepts needed to understand civilisation – its mechanics, design, transition and alignment.</p>' +
        '<p class="foot-stats"><span>' + concepts.length + ' Concepts</span> <span>' + coined + ' Conceptual Engineerings</span></p>' +
      '</div>' +
      '<div class="foot-cols"><div class="foot-col">' +
        // Explore: the same icons as the header (map, about, search)
        '<p class="foot-head">Explore</p><nav class="head-icons foot-icons" aria-label="Explore">' +
          document.querySelector('#site-header .head-icons').innerHTML.replace(/ data-page="[^"]*"/g, '') + '</nav>' +
        '</div><div class="foot-col foot-sections"><p class="foot-head">Sections</p><div class="foot-secs">' +
        sectionSets(sections).map(function (set) {
          return '<ul>' + set.map(function (d) {
            // Each opens its section of the Civilisation Research Paradigm on the Map.
            return li('<span class="foot-num">' + NUM[sections.indexOf(d)] + '</span><a href="#the-map" data-view-link="cs" data-section="' + d.id + '">' + esc(d.title) + '</a>');
          }).join('') + '</ul>';
        }).join('') +
      '</div></div></div></div>' +
      '</div>';
    f.addEventListener('click', function (e) {
      var v = e.target.closest('[data-view-link]');
      if (v) {
        var view = v.getAttribute('data-view-link');
        document.documentElement.setAttribute('data-index', view);
        var sec = v.getAttribute('data-section');
        var onMap = document.documentElement.classList.contains('page-map');
        if (onMap) e.preventDefault();
        // Bring the section (or else the tabs) into view – at once when already on the Map, and
        // once the Map has opened otherwise.
        setTimeout(function () {
          var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
          var t = sec ? document.getElementById('nidx-' + sec) : document.querySelector('#entry .index-tabs');
          if (t && document.documentElement.classList.contains('page-map')) window.scrollTo({ top: window.scrollY + t.getBoundingClientRect().top - (sec ? 3 * rem : 40), behavior: 'smooth' });
        }, onMap ? 0 : 700);
      }
    });
  })();

  // Once the footer scrolls into view the sidebar closes and its toggle hides, until the footer
  // is scrolled back out of view.
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      var inView = entries[entries.length - 1].isIntersecting;
      document.body.classList.toggle('footer-in-view', inView);
      if (inView && !document.body.classList.contains('sidebar-closed')) setSidebar(false, false);
    }).observe(document.getElementById('site-footer'));
  }

  // A load or refresh reopens the page in the address; one that names no page opens the Map, the
  // site's front page (and its loading sequence).
  var noLoadIn = document.documentElement.classList.contains('no-loadin');
  if (noLoadIn) {
    var openId = decodeURIComponent(location.hash.replace(/^#/, ''));
    var isView = Object.keys(MAP_VIEWS).some(function (v) { return location.hash === mapViewHref(v); });
    if (!(isView || byId[openId] || PAGES[openId] || openId === ROOT.id) || (openId === 'infinite' && !SHOW_INFINITE)) {
      noLoadIn = false;
      document.documentElement.classList.remove('no-loadin');
      document.documentElement.setAttribute('data-theme', 'midnight');
      document.documentElement.classList.add('awaiting-theme', 'loading-topo', 'loading-hud');
    }
  }
  var keepView = Object.keys(MAP_VIEWS).some(function (v) { return location.hash === mapViewHref(v); });
  // A view opened directly shows the Map's opening, its terrain risen, for a moment before gliding down to it.
  if (noLoadIn && keepView) viewPause = 900;
  if (!noLoadIn && !keepView) history.replaceState(null, '', location.pathname + location.search + '#the-map');
  trail[0].hash = location.hash;   // (the Back trail starts from the page opened)
  // …at its top: the browser is not to restore an earlier scroll position on reload.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  render();

  // ---------- Loading screen ----------
  // 'topo': the Map's topography alone, full-screen, before the page fades in over it.
  // 'typed': (stored away) the title typed out inside a filling ring.
  var LOADER = 'topo';
  // Opened on a page other than the Map: no loading sequence, the page as it is.
  if (noLoadIn) (function () {
    document.getElementById('loader').classList.add('done');
    document.documentElement.classList.add('topo-go');
    if (typeof topo !== 'undefined') topo.start();
  })();
  else if (LOADER === 'topo') (function () {
    var root = document.documentElement, loader = document.getElementById('loader');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finished = false, timer, typing = null, endTyping = null;
    // The title types itself out, letter by letter, as one phrase.
    function typeTitle(done) {
      var h1 = document.querySelector('#entry h1'), text = h1 ? h1.textContent : '', html = h1 ? h1.innerHTML : '';
      if (!h1 || !text || reduce) { done(); return; }
      h1.setAttribute('aria-label', text);
      // One phrase, letter by letter, with a little more time at each space.
      var steps = [];
      text.split('').forEach(function (ch) {
        if (ch === ' ') { steps.push(null); return; }
        var sp = document.createElement('span'); sp.className = 'tw'; sp.setAttribute('aria-hidden', 'true'); sp.textContent = ch;
        steps.push(sp);
      });
      h1.textContent = '';
      steps.forEach(function (sp) { h1.appendChild(sp || document.createTextNode(' ')); });
      var i = 0;
      endTyping = function () {
        endTyping = null; clearTimeout(typing);
        h1.innerHTML = html; h1.removeAttribute('aria-label');
        done();
      };
      (function tick() {
        if (i >= steps.length) { typing = setTimeout(endTyping, 300); return; }
        var step = steps[i++];
        if (step) { step.classList.add('on'); keyClick(); }
        typing = setTimeout(tick, (step ? 85 : 140) + Math.random() * 40);
      })();
    }
    function finish() {
      if (finished) { if (endTyping) endTyping(); return; }   // a second key or click skips the typing
      finished = true;
      clearTimeout(timer);
      loader.classList.add('done');
      root.classList.add('title-typing');
      root.classList.remove('loading-topo');
      typeTitle(reveal);
    }
    function reveal() {
      // Then the subtitle fades in under the typed title; the interface (hidden from the start) follows once they are in;
      // and only once that has settled does the blue of the loading screen give way to the
      // system's theme.
      root.classList.add('topo-reveal', 'flow-late');
      void root.offsetWidth;
      root.classList.remove('title-typing');
      setTimeout(function () { root.classList.remove('loading-hud'); }, 2800);
      setTimeout(function () {
        root.classList.remove('topo-reveal', 'awaiting-theme');
        if (themeChosen) return;
        root.classList.add('theme-shift');
        var t = root.getAttribute('data-theme-after') || 'light';
        root.setAttribute('data-theme', t); setFavicon(t);
        setTimeout(function () { root.classList.remove('theme-shift'); }, 1600);
      }, 4400);
      document.removeEventListener('keydown', skip, true);
      document.removeEventListener('pointerdown', skip, true);
    }
    function skip(e) { e.preventDefault(); e.stopPropagation(); go(); finish(); }
    document.addEventListener('keydown', skip, true);
    document.addEventListener('pointerdown', skip, true);
    // A blank moment first, while the site is built: wait for the fonts, then for the frames to
    // run smoothly (a few in a row on time), so that building the page never slows the terrain.
    // Only then does it fade in and start moving, and the loading screen's time begins.
    var going = false;
    function go() {
      if (going) return;
      going = true;
      root.classList.add('topo-go');
      if (typeof topo !== 'undefined') topo.start();
    }
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () {
      var calm = 0, prev = 0, begun = performance.now();
      (function watch(now) {
        if (finished) return;
        if (prev && now - prev < 24) calm++; else calm = 0;
        prev = now;
        if (calm >= 6 || now - begun > 1500) { go(); timer = setTimeout(finish, reduce ? 700 : 3600); return; }
        requestAnimationFrame(watch);
      })(performance.now());
    });
  })();
  else (function () {
    document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme-after') || 'light');
    document.documentElement.classList.remove('loading-topo', 'loading-hud', 'awaiting-theme');
    document.documentElement.classList.add('topo-go'); if (typeof topo !== 'undefined') topo.start();
    var loader = document.getElementById('loader');
    var out = document.getElementById('loader-text');
    var title = 'Civilisational';
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finished = false, timer;
    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      out.textContent = title;
      fillRing(title.length);
      loader.classList.add('done');
      document.removeEventListener('keydown', skip, true);
      document.removeEventListener('pointerdown', skip, true);
    }
    function skip(e) { e.preventDefault(); e.stopPropagation(); finish(); }
    document.addEventListener('keydown', skip, true);
    document.addEventListener('pointerdown', skip, true);

    var ring = document.getElementById('loader-fill');
    // Keep the ring's line about 1.4px thick whatever its (very large) size.
    var ringSvg = document.querySelector('.loader-ring');
    function ringStroke() {
      var w = ringSvg.getBoundingClientRect().width || 1;
      ringSvg.querySelectorAll('circle').forEach(function (c) { c.style.strokeWidth = String(1.4 * 400 / w); });
    }
    ringStroke();
    window.addEventListener('resize', ringStroke);
    var RING_C = 2 * Math.PI * 180;
    function fillRing(i) {
      ring.style.strokeDashoffset = String(RING_C * (1 - i / title.length));
      // Once complete, draw a solid circle so no seam or gap can remain at the join.
      if (i >= title.length) setTimeout(function () { ring.style.strokeDasharray = 'none'; }, 80);
    }
    function type(i) {
      out.textContent = title.slice(0, i);
      fillRing(i);
      if (i < title.length) { timer = setTimeout(function () { type(i + 1); }, 75); return; }
      timer = setTimeout(finish, 700);
    }
    // Wait for ET Bembo so the title doesn't reflow mid-animation (capped so a slow font never blocks).
    var fontsReady = document.fonts && document.fonts.load ? document.fonts.load('700 1em "ET Bembo"') : Promise.resolve();
    var fontsOrTimeout = Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 1500); })]);
    fontsOrTimeout.then(function () {
      if (finished) return;
      if (reduce) { out.textContent = title; fillRing(title.length); timer = setTimeout(finish, 600); return; }
      timer = setTimeout(function () { type(1); }, 250);
    });
  })();
</script>
</body>
</html>
