      ].join('\n')
    },
    {
      id: 'civilisation-theory',
      title: 'Civilisation Theory',
      parent: null,
      master: true,
      coined: true,
      html: '<p><em>Civilisation Theory</em> is a unification of all forms of theory – primarily, systems theory, evolutionary theory, critical theory and game theory – applied at a civilisation-scale. The thesis of civilisation theory is that the generative dynamics of existential risk(s) emerge from the initial conditions, developmental process and dominant paradigm of civilisation itself.</p><p>From this macrohistorical frame of reference, the only sufficient solution is civilisation design and transition: to realise a new form of political economy (structure) and cultural psychology (superstructure), compatible with 21st century technology (infrastructure).</p>'
    },

    {
      id: 'metacrisis',
      title: 'The Metacrisis',
      kind: 'category',
      parent: 'theproject',
      order: 5,
      html: '<p>The <em>metacrisis</em> is the underlying pattern that connects the many crises of the 21st century – ecological, technological, political, economic and psychological – as expressions of shared generative dynamics rather than as separate problems. Where a polycrisis names the interaction of many crises, the metacrisis names what lies beneath them: above all, rivalrous competition under exponential technology (see <a href="#multipolar-trap">multipolar trap</a>), and the extraction of value from complex systems faster than they can regenerate.</p><p>Because these dynamics are built into the dominant paradigm of civilisation itself, addressing symptoms without addressing their generators tends to relocate harm rather than remove it. Associated with Daniel Schmachtenberger, <em>The Consilience Project</em> and the <em>Civilization Research Institute</em>, the concept frames <a href="#existential-risk">existential risk</a> as its most acute expression, and a response adequate to it as a matter of <a href="#civilisation-design">civilisation design</a> rather than piecemeal reform.</p>'
    },
    {
      id: 'existential-risk',
      title: 'Existential Risk',
      parent: 'metacrisis',
      html: '<p>An <em>existential risk</em> is a risk that threatens the extinction of humanity, or the permanent and drastic curtailment of its potential. Formalised by Nick Bostrom (2002) and developed within existential risk studies, the concept is usually applied to discrete hazards such as advanced AI, engineered pandemics, nuclear war and severe climate change.</p><p>Seen through the <a href="#metacrisis">metacrisis</a>, these hazards appear instead as emergent outcomes of shared underlying dynamics, and any response must avoid two failure modes at once: destruction, when powerful technology remains in the hands of uncoordinated, competing actors; and dystopia, when that risk is controlled through concentrated, unaccountable power.</p>'
    },
    {
      id: 'multipolar-trap',
      title: 'Multipolar Trap',
      parent: 'metacrisis',
      html: '<p>A <em>multipolar trap</em> is a situation in which each actor, acting rationally in competition with others, is driven towards an outcome that is worse for everyone – including itself – because no single actor can stop without losing ground to the rest. It generalises the prisoner’s dilemma and the tragedy of the commons to many actors, and appears in arms races, regulatory races to the bottom, the attention economy and the race to deploy powerful technologies before they are understood.</p><p>Popularised by Scott Alexander’s <em>Meditations on Moloch</em> (2014) and developed by Daniel Schmachtenberger as a generator function of the <a href="#metacrisis">metacrisis</a>, the trap becomes a source of <a href="#existential-risk">existential risk</a> under exponential technology, and can only be escaped by changing the incentive structure itself.</p>'
    },
    {
      id: 'civilisation-design',
      title: 'Civilisation Design',
      kind: 'category',
      parent: 'theproject',
      order: 2,
      html: '<p><em>Civilisation design</em> is the deliberate design of the basic structures of civilisation – its political economy (structure), cultural psychology (superstructure) and technology (infrastructure) – as one integrated system, rather than reform within the existing one. Because a change to one layer tends to be reabsorbed by the others, the three must be designed to be compatible, and the design must include a viable path of transition that avoids both destruction and dystopia along the way.</p><p>Drawing on a cybernetic lineage that runs through Buckminster Fuller, Stafford Beer and Jacque Fresco, civilisation design responds to the <a href="#metacrisis">metacrisis</a> at the level of its causes, and aims at a <a href="#life-world-system">viable life-world-system</a>.</p>'
    },
    {
      id: 'life-world-system',
      title: 'Viable Life-World-System',
      coined: true,
      parent: 'macrostrategy',
      ref: 'Wallerstein; Habermas; Beer',
      refs: ['Immanuel Wallerstein, <em>The Modern World-System</em>, vol. 1 (1974).', 'Jürgen Habermas, <em>The Theory of Communicative Action</em>, 2 vols. (1981).', 'Stafford Beer, <em>Brain of the Firm</em> (1972).', 'Stafford Beer, <em>The Heart of Enterprise</em> (1979).'],
      html: '<p>A <em>life-world-system</em> is a civilisation described as a single whole: the world-system that organises humanity’s economic and political life, together with the life-world of the people within it. The term joins three concepts – Immanuel Wallerstein’s world-system, Jürgen Habermas’s life-world and Stafford Beer’s viable system. Every civilisation is a life-world-system; a <em>viable life-world-system</em> is one able to sustain itself, and is the aim of <a href="#civilisation-design">civilisation design</a>.</p><h2>World-System</h2><p>For Wallerstein, the unit of history is not the nation-state but the <a href="#world-systems-analysis">world-system</a>: the single capitalist world-economy that has spread across the planet since the sixteenth century, with its division of labour between core, semi-periphery and periphery. The world-system is the structural scale of a life-world-system: no part of the present civilisation stands outside it.</p><h2>Life-World</h2><p>For Habermas, the life-world is the shared background of meaning, culture and personal relationship through which people understand one another, as distinct from the “system” of markets and administration, which coordinates action through money and power. The relation between the two varies between societies; in modern societies, Habermas argues, the system increasingly <a href="#colonisation-of-the-lifeworld">colonises the life-world</a>, putting its own logic in place of mutual understanding. A life-world-system takes in both, and the relation between them.</p><h2>Viable System</h2><p>For Beer, a <a href="#viable-system-model">viable system</a> is one able to maintain its identity and survive in a changing environment, through the balance of autonomy and coordination between its parts. Viability is the measure by which a life-world-system can be assessed: whether it can adapt to its technology and to the limits of the biosphere without generating the dynamics of the <a href="#metacrisis">metacrisis</a>.</p>'
    },
    {
      id: 'polycrisis',
      title: 'Polycrisis',
      parent: 'metacrisis',
      html: '<p>A <em>polycrisis</em> is a condition in which multiple crises – ecological, economic, geopolitical, technological – interact so that their combined effect is greater than the sum of their parts. The term was introduced by Edgar Morin and Anne Brigitte Kern in <em>Homeland Earth</em> (1993) and popularised by the historian Adam Tooze in the early 2020s. Where the polycrisis describes how crises entangle and cascade, the <a href="#metacrisis">metacrisis</a> asks why they arise together at all: the polycrisis is the surface pattern, the metacrisis its underlying cause.</p>'
    },
    {
      id: 'generator-functions',
      title: 'Generator Functions',
      parent: 'metacrisis',
      html: '<p><em>Generator functions</em> are the underlying dynamics that continuously produce the symptoms of the <a href="#metacrisis">metacrisis</a>. In Daniel Schmachtenberger’s account there are two: rivalrous, win–lose dynamics (see <a href="#multipolar-trap">multipolar trap</a>) multiplied by exponential technology; and the substitution of complicated, extractive systems for the complex, self-organising systems – ecological and social – on which civilisation depends. Because the generators remain in place, solving any one problem tends to displace harm elsewhere; a sufficient response must change the generators themselves, which is the task of <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'epistemic-crisis',
      title: 'Epistemic Crisis',
      parent: 'metacrisis',
      html: '<p>The <em>epistemic crisis</em> is the breakdown of a society’s capacity to make sense of the world together: to establish shared facts, reason through disagreement, and arrive at collective choices. It is driven by an information ecology optimised for attention rather than understanding, by the weaponisation of information in rivalrous competition, and by the sheer complexity of the problems to be understood. It is also self-reinforcing: the more a society’s shared understanding degrades, the harder it becomes to agree on what has gone wrong with it. Walter Lippmann described the underlying gap – between the world and “the pictures in our heads” – a century ago in <em>Public Opinion</em> (1922); one response is to renew the shared concepts themselves, as in a <a href="#conceptual-adaptive-system">conceptual adaptive system</a>.</p>'
    },
    {
      id: 'dominant-paradigm',
      title: 'Dominant Paradigm',
      parent: 'metacrisis',
      html: '<p>The <em>dominant paradigm</em> is the set of shared assumptions – about value, progress, nature, the self and the good life – out of which a civilisation’s institutions arise, and which usually goes unexamined because it is taken as reality itself. The term draws on Thomas Kuhn’s account of paradigms in <em>The Structure of Scientific Revolutions</em> (1962), while Donella Meadows (1999) identified the paradigm as one of the highest leverage points for changing any system. The present paradigm of growth, competition and extraction can be read as one of the origins of the <a href="#metacrisis">metacrisis</a>, alongside civilisation’s developmental process and initial conditions.</p>'
    },
    {
      id: 'political-economy',
      title: 'Political Economy',
      parent: 'civilisation-design',
      html: '<p><em>Political economy</em> is the structure of a civilisation: the institutions that govern how resources are owned, produced, allocated and exchanged, and how collective decisions are made about them. In a three-layer model of civilisation that echoes Marvin Harris’s cultural materialism, political economy (structure) sits between technology (<a href="#technological-infrastructure">infrastructure</a>) and <a href="#cultural-psychology">cultural psychology</a> (superstructure). Because it sets the incentives every actor responds to, it decides which behaviours are rewarded long before any individual chooses – a point on which Adam Smith, Marx and the later institutionalists agreed, if on little else.</p>'
    },
    {
      id: 'cultural-psychology',
      title: 'Cultural Psychology',
      parent: 'civilisation-design',
      html: '<p><em>Cultural psychology</em> is the superstructure of a civilisation: its shared values, narratives, identities, forms of meaning and modes of sensemaking, as they are lived by the people within it. It shapes what a society is able to want and to imagine, and is in turn shaped by the <a href="#political-economy">political economy</a> and <a href="#technological-infrastructure">technology</a> it lives within. It also explains why institutions transplanted from one society to another so often behave differently there: a new economy run by people formed by the old one tends to recreate the old one.</p>'
    },
    {
      id: 'technological-infrastructure',
      title: 'Technological Infrastructure',
      parent: 'civilisation-design',
      html: '<p><em>Technological infrastructure</em> is the material base of a civilisation: its tools, energy systems, production, communication and computation. In a three-layer model of civilisation, it is the infrastructure on which <a href="#political-economy">political economy</a> (structure) and <a href="#cultural-psychology">cultural psychology</a> (superstructure) rest.</p><p>The defining feature of the 21st century is that this layer is changing exponentially – through AI, biotechnology and automation – while the other two remain largely inherited from earlier eras. The resulting mismatch is what the biologist E. O. Wilson summed up as “Palaeolithic emotions, medieval institutions and godlike technology”.</p>'
    },
    {
      id: 'civilisation-transition',
      title: 'Civilisational Transition',
      kind: 'category',
      order: 3,
      parent: 'theproject',
      html: '<p><em>Civilisation transition</em> is the process of moving from the present civilisation to a designed one: the path, rather than the destination, of <a href="#civilisation-design">civilisation design</a>. A viable transition must remain functional at every stage, keeping people fed, housed and governed while the underlying structures change, and must avoid both failure modes of <a href="#existential-risk">existential risk</a> along the way – collapse into destruction, or capture by concentrated power. Transition is therefore a design problem in its own right, rather than something that follows automatically from a good blueprint.</p>'
    },
    {
      id: 'systems-theory',
      title: 'Systems Theory',
      parent: 'metatheory',
      html: '<p><em>Systems theory</em> is the study of wholes – how interacting parts give rise to behaviour that none of them has alone. Developed through Ludwig von Bertalanffy’s general system theory, Norbert Wiener’s cybernetics (1948) and later work such as Donella Meadows’s <em>Thinking in Systems</em> (2008), it is concerned with feedback loops, stocks and flows, emergence, self-organisation and resilience. Its founding move, in Ludwig von Bertalanffy’s general systems theory of the 1940s and 1950s, was to look for principles – feedback, hierarchy, equifinality – that hold across physics, biology and society alike.</p>'
    },
    {
      id: 'viable-system-model',
      title: 'Viable System Model',
      parent: 'systems-theory',
      html: '<p>The <em>viable system model</em> is Stafford Beer’s cybernetic model of any system able to maintain its identity and survive in a changing environment. Set out in <em>Brain of the Firm</em> (1972), it describes five interacting functions – operations, coordination, control, intelligence and policy – repeated recursively at every scale, so that each viable system contains and is contained by others. Beer applied it to national economic management in Chile’s Project Cybersyn (1971–73). Its recursive structure – every viable system contains, and is contained by, other viable systems – makes it one of the few models of organisation that scales from a workshop to a state.</p>'
    },
    {
      id: 'evolutionary-theory',
      title: 'Evolutionary Theory',
      parent: 'metatheory',
      html: '<p><em>Evolutionary theory</em> explains how complex forms arise through variation, selection and inheritance, without any designer. Beginning with Charles Darwin’s <em>On the Origin of Species</em> (1859), it has since been extended from genes to cultures, technologies and institutions. Applied to societies, it asks which selection pressures have favoured some social forms over others – and warns that what wins in competition is not necessarily what is good for its members or able to endure.</p>'
    },
    {
      id: 'critical-theory',
      title: 'Critical Theory',
      parent: 'metatheory',
      html: '<p><em>Critical theory</em> is the tradition of social theory that examines society in order to change it, exposing the forms of power and ideology that present particular arrangements as natural or inevitable. It originated with the Frankfurt School – Max Horkheimer’s essay “Traditional and Critical Theory” (1937), Theodor Adorno, Herbert Marcuse and later Jürgen Habermas. Its central claim is that social arrangements presented as natural or inevitable are historical, and so can be changed – and that criticism worth the name aims at freeing people, not only at describing them.</p>'
    },
    {
      id: 'game-theory',
      title: 'Game Theory',
      parent: 'metatheory',
      html: '<p><em>Game theory</em> is the formal study of strategic interaction: how the outcome for each actor depends on the choices of all the others. Founded by John von Neumann and Oskar Morgenstern in <em>Theory of Games and Economic Behavior</em> (1944) and extended by John Nash’s concept of equilibrium (1950), it distinguishes zero-sum from positive-sum games and shows how individually rational choices can produce collectively irrational outcomes. Its best-known results – the <a href="#prisoners-dilemma">prisoner’s dilemma</a>, the <a href="#tragedy-of-the-commons">tragedy of the commons</a>, the Nash equilibrium – show how individually rational choices can combine into outcomes no one wants, and what repetition, rules or trust allow players to escape them.</p>'
    },
    {
      id: 'metamodernism',
      title: 'Metamodernism',
      kind: 'category',
      order: 6,
      parent: 'theproject',
      html: '<p><em>Metamodernism</em> is a cultural and philosophical sensibility that moves beyond postmodernism without returning to modernism: it holds the modern capacity for sincerity, hope and grand projects together with the postmodern awareness of irony, context and multiple perspectives. The term was introduced by Timotheus Vermeulen and Robin van den Akker (2010), and developed politically by Hanzi Freinacht in <em>The Listening Society</em> (2017). Its characteristic mood is what Timotheus Vermeulen and Robin van den Akker called an oscillation: sincere commitment to large aims, held together with an ironic awareness of their limits.</p>'
    },
    {
      id: 'conceptual-adaptive-system',
      title: 'Conceptual Adaptive System',
      coined: true,
      parent: 'replicators',
      html: '<p>A <em>conceptual adaptive system</em> is a body of concepts designed to evolve in response to what it helps to understand, as a complex adaptive system evolves in response to its environment. It rests on the insight, going back to Alfred Korzybski’s “a map is not the territory” (1933), that the concepts through which we see the world shape which problems we can perceive and which solutions we can imagine. A glossary built this way is a response to the <a href="#epistemic-crisis">epistemic crisis</a>, on the premise that for civilisation to adapt, its concepts must adapt first.</p>'
    },
    {
      id: 'exponential-technology',
      title: 'Exponential Technology',
      parent: 'metacrisis',
      html: '<p><em>Exponential technology</em> is technology whose capabilities grow at a compounding rate, as each generation of tools accelerates the development of the next. Computation, artificial intelligence, synthetic biology and automation are the clearest cases. Its effect is less to create new kinds of conflict than to raise the stakes of old ones: rivalries that once caused local or reversible harm now operate with planetary, and potentially irreversible, power. Moore’s law in computing, the collapsing cost of genome sequencing and the scaling of AI models are its standard examples; the governing difficulty is that law, ethics and institutions change at a linear pace at best.</p>'
    },
    {
      id: 'planetary-boundaries',
      title: 'Crossing Planetary Boundaries',
      parent: 'macrohistory',
      html: '<p><em>Planetary boundaries</em> are the limits of nine Earth-system processes – including climate change, biosphere integrity, land-system change and biogeochemical flows – within which humanity can continue to develop safely. The framework was introduced by Johan Rockström and colleagues in 2009, and a 2023 assessment found six of the nine boundaries already transgressed. In their 2023 update, the framework’s authors reported that six of the nine boundaries – including climate change, biosphere integrity and the flows of nitrogen and phosphorus – had already been crossed.</p>'
    },
    {
      id: 'moloch',
      refs: ['Scott Alexander, “Meditations on Moloch”, <em>Slate Star Codex</em> (2014).', 'Allen Ginsberg, <em>Howl and Other Poems</em> (1956).'],
      title: 'Moloch: God of Game-Theory',
      parent: 'multipolar-trap',
      html: '<p><em>Moloch</em> is a personification of the <a href="#multipolar-trap">multipolar trap</a>: the impersonal force by which competition sacrifices every value that does not contribute to winning. The name comes from Allen Ginsberg’s poem <em>Howl</em> (1956) and was given its current sense by Scott Alexander’s essay <em>Meditations on Moloch</em> (2014), which describes how arms races, market pressures and evolutionary selection each drive actors to trade away what they care about for competitive advantage. To speak of Moloch is to recognise that no one needs to intend a harmful outcome for a system to produce it.</p>'
    },
    {
      id: 'race-to-the-bottom',
      title: 'Race to the Bottom',
      parent: 'multipolar-trap',
      html: '<p>A <em>race to the bottom</em> is a form of <a href="#multipolar-trap">multipolar trap</a> in which competitors progressively lower their standards – on wages, taxes, safety, environmental protection or ethics – to gain an advantage over one another. Since any actor that holds to a higher standard loses ground, each is pushed downwards regardless of its intentions. Familiar examples include jurisdictions competing to attract capital with lower taxes and weaker regulation, and firms competing on cost by externalising harm. The race can only be halted by changing the rules of competition for all actors at once – a <a href="#coordination-problem">coordination problem</a>.</p>'
    },
    {
      id: 'third-attractor',
      title: 'The Third Attractor: Alignment',
      parent: 'attractor-states',
      ref: 'Schmachtenberger',
      html: '<p>The <em>third attractor</em> is the name given, in the work of Daniel Schmachtenberger and others, to a civilisational trajectory that avoids both of the default attractors of <a href="#existential-risk">existential risk</a>: <a href="#first-attractor">catastrophe</a>, arising from uncoordinated power, and <a href="#second-attractor">dystopia</a>, arising from the control imposed to prevent it. It describes a civilisation able to coordinate at the scale of its technology without centralising unaccountable power – combining the order that prevents collapse with the freedom that prevents tyranny. What it would look like is deliberately left open: the term marks a direction – power matched by wisdom, coordination without coercion – rather than a blueprint.</p>'
    },
    {
      id: 'sensemaking',
      title: 'Sensemaking',
      parent: 'epistemic-crisis',
      html: '<p><em>Sensemaking</em> is the process by which individuals and groups construct an understanding of their situation, so that they can act within it. The term was developed in organisational theory by Karl Weick (1995), and has since been used more broadly for the collective capacity of a society to perceive reality accurately, reason about it together and make good choices. Weick’s own examples were often disasters – most famously the Mann Gulch fire of 1949, in which a firefighting crew’s shared picture of their situation fell apart – which is why the idea now serves for whole societies whose shared picture of reality is breaking down (see <a href="#epistemic-crisis">epistemic crisis</a>).</p>'
    },
    {
      id: 'situational-attunement',
      title: 'Situational Attunement',
      parent: 'sensemaking',
      coined: true,
      html: '<p><em>Situational attunement</em> is derived from <em>situational awareness</em> – in Mica Endsley’s classic account, the perception of the elements of a situation, the comprehension of their meaning and the projection of their future state, a notion honed in aviation and military command and since carried over to the strategic outlook on artificial intelligence.</p><p>Awareness in this sense is a detached, observational stance: a picture of the situation held by an operator who stands outside it. Attunement names what awareness leaves out – being in tune with a situation rather than merely informed about it: registering what matters and why, sensing its mood and direction, and responding from within it as a participant whose own orientation is part of what is being read.</p><p>It draws on Heidegger’s <em>Befindlichkeit</em>, our always already being attuned to a world, and on the idea of relevance realisation, the capacity to pick out, from everything that could be noticed, what is actually significant.</p><p>For a civilisation, the claim is that more awareness – more data, more monitoring, more forecasting – is not enough: what is needed is the capacity to be attuned to the situation as a whole, and so to act well within it. It is a component of collective <a href="#sensemaking">sensemaking</a> and a remedy for the <a href="#epistemic-crisis">epistemic crisis</a>.</p>'
    },
    {
      id: 'attention-economy',
      title: 'Attention Economy',
      parent: 'epistemic-crisis',
      html: '<p>The <em>attention economy</em> is the economic system in which human attention is the scarce resource that platforms and media compete to capture and sell. Herbert Simon observed in 1971 that “a wealth of information creates a poverty of attention”, and the term itself was popularised by Michael Goldhaber in the late 1990s. Because engagement rather than understanding is rewarded, the attention economy favours content that provokes outrage, fear and tribal identity – making it a <a href="#race-to-the-bottom">race to the bottom</a> among competing platforms and a principal driver of polarisation.</p>'
    },
    {
      id: 'prisoners-dilemma',
      title: 'Prisoner’s Dilemma',
      parent: 'game-theory',
      html: '<p>The <em>prisoner’s dilemma</em> is the canonical game in <a href="#game-theory">game theory</a> in which two players each gain by defecting against the other, yet both end up worse off than if they had cooperated. First formalised by Merrill Flood and Melvin Dresher at the RAND Corporation in 1950 and named by Albert Tucker, it shows how individually rational choices can produce collectively irrational outcomes. Robert Axelrod’s <em>The Evolution of Cooperation</em> (1984) showed how cooperation can emerge when the game is repeated. The <a href="#multipolar-trap">multipolar trap</a> generalises the dilemma to many players.</p>'
    },
    {
      id: 'tragedy-of-the-commons',
      title: 'Tragedy of the Commons',
      parent: 'game-theory',
      html: '<p>The <em>tragedy of the commons</em> is the depletion of a shared resource by individuals who each benefit fully from using more of it while bearing only a fraction of the cost. It was set out by Garrett Hardin in 1968, who concluded that commons must be either privatised or regulated by the state. Elinor Ostrom’s <em>Governing the Commons</em> (1990) showed a third possibility: communities that successfully manage shared resources through their own institutions. The tragedy is a many-player form of the <a href="#prisoners-dilemma">prisoner’s dilemma</a>, and Ostrom’s answer informs the design of the <a href="#commons">commons</a>.</p>'
    },
    {
      id: 'coordination-problem',
      title: 'Coordination Problem',
      parent: 'game-theory',
      html: '<p>A <em>coordination problem</em> is a situation in which all actors would be better off acting together, but none can do so alone: a better outcome exists, but reaching it requires that everyone move at once, or that each can trust the others to follow. They range from the trivial – which side of the road to drive on, settled once by convention – to the intractable: fisheries, emissions and arms control, where every party gains from agreement but each is tempted to defect. Thomas Schelling’s <em>The Strategy of Conflict</em> (1960) and Elinor Ostrom’s work on the <a href="#commons">commons</a> remain the classic accounts of how such problems actually get solved.</p>'
    },
    {
      id: 'cybernetics',
      title: 'Cybernetics',
      parent: 'systems-theory',
      html: '<p><em>Cybernetics</em> is the science of control and communication in animals and machines, as Norbert Wiener defined it in his book of that name (1948). It studies how systems regulate themselves through <a href="#feedback-loop">feedback</a> – sensing the effects of their actions and adjusting accordingly – and was developed by W. Ross Ashby, Heinz von Foerster, Gregory Bateson and Stafford Beer, among others. Cybernetics underpins a lineage of cybernetic approaches to economics and governance, and Beer’s <a href="#viable-system-model">viable system model</a> is its application to the organisation of societies.</p>'
    },
    {
      id: 'requisite-variety',
      title: 'Requisite Variety',
      parent: 'cybernetics',
      html: '<p>The <em>law of requisite variety</em>, formulated by W. Ross Ashby in <em>An Introduction to Cybernetics</em> (1956), states that a regulator can only control a system if it has at least as much variety – as many possible responses – as the disturbances it must counter; in Ashby’s phrase, “only variety can destroy variety”. Applied to institutions, it implies that a regulator designed for a slower and simpler world cannot govern a faster and more complex one, however good its intentions. Governance must therefore gain variety – through distributed, adaptive and <a href="#viable-system-model">recursive</a> structures – rather than simply more central control.</p>'
    },
    {
      id: 'feedback-loop',
      title: 'Feedback Loop',
      parent: 'systems-theory',
      html: '<p>A <em>feedback loop</em> is a circular chain of cause and effect in which the output of a system returns as an input that influences its future behaviour. Balancing (negative) feedback counteracts change and keeps a system stable, as a thermostat does; reinforcing (positive) feedback amplifies change, producing growth, collapse or runaway escalation. Arms races, compound interest and viral content are reinforcing loops; thermostats, prices and predator–prey cycles are balancing ones – and much of systems thinking consists in asking which balancing loop a runaway process is missing.</p>'
    },
    {
      id: 'emergence',
      title: 'Emergence',
      parent: 'systems-theory',
      html: '<p><em>Emergence</em> is the appearance, in a system of interacting parts, of properties or behaviours that belong to the whole and cannot be found in any part alone – as consciousness emerges from neurons, or traffic jams from individual drivers. It is central to <a href="#systems-theory">systems theory</a> and the study of <a href="#complex-adaptive-system">complex adaptive systems</a>. Flocking birds, traffic jams and market prices are standard examples: each is produced by individuals following local rules, yet none can be found in any of them – which is also why emergent outcomes can be harmful without anyone having intended them.</p>'
    },
    {
      id: 'complex-adaptive-system',
      title: 'Complex Adaptive System',
      parent: 'systems-theory',
      html: '<p>A <em>complex adaptive system</em> is a system of many interacting agents that adapt to one another and to their environment, so that the system as a whole learns and evolves – ecosystems, economies, immune systems and civilisations are examples. The concept was developed at the Santa Fe Institute, notably by John Holland. Such systems exhibit <a href="#emergence">emergence</a>, self-organisation and non-linear change, and cannot be controlled from above in the way that complicated machines can. Civilisation itself can be understood as a complex adaptive system, and the <a href="#conceptual-adaptive-system">conceptual adaptive system</a> takes its name from the idea.</p>'
    },
    {
      id: 'leverage-points',
      title: 'Leverage Points',
      parent: 'systems-theory',
      html: '<p><em>Leverage points</em> are places within a system where a small intervention can produce large changes in its behaviour. In her essay “Leverage Points: Places to Intervene in a System” (1999), Donella Meadows ranked twelve such points, from the weakest – parameters such as taxes and subsidies – to the strongest: the goals of the system, the <a href="#dominant-paradigm">paradigm</a> out of which it arises, and the power to transcend paradigms altogether. On this view the deepest leverage lies at the level of paradigm, while the shallowest – parameters such as taxes, subsidies and standards – is where most policy effort goes.</p>'
    },
    {
      id: 'resilience',
      title: 'Resilience',
      parent: 'systems-theory',
      html: '<p><em>Resilience</em> is the capacity of a system to absorb disturbance and reorganise while retaining its essential function, structure and identity. The concept was introduced to ecology by C. S. Holling (1973), who distinguished it from mere stability: a resilient system may change a great deal while persisting, whereas an efficient but brittle one may fail suddenly. There is usually a trade-off with efficiency: redundancy, diversity and slack look wasteful in normal times, which is why systems optimised for efficiency – just-in-time supply chains are the textbook case – tend to be fragile when the shock arrives.</p>'
    },
    {
      id: 'project-cybersyn',
      title: 'Project Cybersyn',
      parent: 'viable-system-model',
      html: '<p><em>Project Cybersyn</em> was a Chilean project (1971–73) to manage the nationalised economy in real time using cybernetic principles, designed by Stafford Beer at the invitation of Salvador Allende’s government, with Fernando Flores. It linked factories to a central operations room through a network of telex machines, using Beer’s <a href="#viable-system-model">viable system model</a> to balance local autonomy with national coordination. The project was ended by the military coup of 1973. It remains a reference point in cybernetic economics as an early attempt at computer-assisted, non-authoritarian economic coordination.</p>'
    },
    {
      id: 'cultural-evolution',
      title: 'Cultural Evolution',
      parent: 'evolutionary-theory',
      html: '<p><em>Cultural evolution</em> is the application of <a href="#evolutionary-theory">evolutionary theory</a> to culture: the idea that beliefs, practices, technologies and institutions vary, are selected and are transmitted between people, and so change over time in ways analogous to biological evolution. It was developed by Robert Boyd and Peter Richerson (1985), among others. Its sobering lesson is that cultural forms spread for reasons of transmissibility and competitive success, which need not coincide with their being good for the people who hold them.</p>'
    },
    {
      id: 'multilevel-selection',
      title: 'Multilevel Selection',
      parent: 'evolutionary-theory',
      html: '<p><em>Multilevel selection</em> is the view that natural selection operates at several levels at once – on genes, individuals and groups – and that these levels can pull in opposite directions. David Sloan Wilson and E. O. Wilson (2007) summarised it: “selfishness beats altruism within groups; altruistic groups beat selfish groups”. It explains how cooperation can evolve despite the advantage of defection, in David Sloan Wilson and E. O. Wilson’s summary (2007): “selfishness beats altruism within groups; altruistic groups beat selfish groups.”</p>'
    },
    {
      id: 'selection-pressure',
      title: 'Selection Pressure',
      parent: 'evolutionary-theory',
      html: '<p>A <em>selection pressure</em> is any feature of an environment that favours some variants over others, and so shapes what survives and spreads. The concept comes from biology but applies equally to firms in markets, states in geopolitical competition and ideas in the <a href="#attention-economy">attention economy</a>. The selection pressures built into the present civilisation – for growth, power and engagement – reward behaviours whose costs fall on others or on the future. Changing outcomes durably requires changing the pressures, not merely the actors who respond to them.</p>'
    },
    {
      id: 'hegemony',
      title: 'Cultural Hegemony',
      parent: 'critical-theory',
      html: '<p><em>Hegemony</em>, in Antonio Gramsci’s sense, is the rule of a dominant group through consent rather than force: its interests and worldview come to be accepted as common sense by society as a whole. Gramsci developed the concept in his <em>Prison Notebooks</em> (1929–35), and it became central to <a href="#critical-theory">critical theory</a> and cultural studies. It explains how a social order can reproduce itself without needing to be imposed, and why lasting change involves a contest over meaning and common sense as well as over institutions.</p>'
    },
    {
      id: 'ideology',
      title: 'Ideology',
      parent: 'critical-theory',
      html: '<p>An <em>ideology</em> is a system of ideas and beliefs that shapes how a society understands itself, and that, in the critical tradition, serves to present particular social arrangements as natural, necessary or just. The concept was given its critical meaning by Karl Marx and Friedrich Engels in <em>The German Ideology</em> (1846), and developed through <a href="#hegemony">Gramsci</a>, the Frankfurt School and later thinkers. Ideology critique, from Marx through the Frankfurt School to Slavoj Žižek, is one of the core tools of <a href="#critical-theory">critical theory</a>; its sharpest target is any claim that a given order has no alternative.</p>'
    },
    {
      id: 'colonisation-of-the-lifeworld',
      title: 'Colonisation of the Lifeworld',
      parent: 'critical-theory',
      html: '<p>The <em>colonisation of the lifeworld</em> is Jürgen Habermas’s term, from <em>The Theory of Communicative Action</em> (1981), for the process by which the logics of money and administrative power – the “system” – penetrate areas of life that depend on mutual understanding, such as family, education, culture and public debate. As these areas come to be governed by markets and bureaucracy, meaning, solidarity and democratic agency are eroded. Habermas’s remedy is not to abolish markets or bureaucracy but to keep them within limits set from the lifeworld – with democratic deliberation, not money or power, deciding what they are for.</p>'
    },
    {
      id: 'dialectics',
      title: 'Dialectics',
      parent: 'critical-theory',
      html: '<p><em>Dialectics</em> is a method of reasoning that understands ideas and societies as developing through contradiction – as opposing tendencies conflict and are resolved in a higher form that preserves something of each. Associated above all with G. W. F. Hegel, and turned by Marx towards material and social history, it is foundational to <a href="#critical-theory">critical theory</a>. A dialectical synthesis seeks not to choose between competing traditions, but to resolve their contradictions into a more comprehensive understanding.</p>'
    },
    {
      id: 'resource-based-economy',
      title: 'Resource-Based Economy',
      parent: 'political-economy',
      html: '<p>A <em>resource-based economy</em> is Jacque Fresco’s proposal for a socio-economic system in which goods and services are provided without money, barter or debt, by managing the Earth’s resources directly through technology and scientific method. Developed through Fresco’s Venus Project, it envisages automated production, the careful accounting of available resources, and the provision of necessities to all. It belongs to the lineage of cybernetic economics, and is a precedent for rethinking <a href="#political-economy">political economy</a> in light of <a href="#post-scarcity">post-scarcity</a> technology.</p>'
    },
    {
      id: 'commons',
      title: 'Commons',
      parent: 'political-economy',
      html: '<p>A <em>commons</em> is a resource held and managed collectively by a community, according to rules its members make for themselves, rather than by the market or the state. Elinor Ostrom’s <em>Governing the Commons</em> (1990) identified the design principles by which commons can endure, answering the <a href="#tragedy-of-the-commons">tragedy of the commons</a>. The idea has been extended to knowledge and software, as in Yochai Benkler’s account of commons-based peer production. The commons offers a form of <a href="#political-economy">political economy</a> that is neither market nor state, and a model for coordination without centralisation.</p>'
    },
    {
      id: 'design-science',
      title: 'Design Science',
      parent: 'civilisation-design',
      html: '<p><em>Design science</em> – in full, “comprehensive anticipatory design science” – is Buckminster Fuller’s approach to solving humanity’s problems by redesigning its tools and systems rather than by reforming people or politics. Fuller argued in <em>Operating Manual for Spaceship Earth</em> (1969) that the planet’s resources, used efficiently, could support all of humanity, and that the task was to make the world work for everyone through design. Its best-known application was the World Game, Fuller’s proposal to treat the planet’s resources as a puzzle to be solved for “100% of humanity” – played in workshops and classrooms from the late 1960s.</p>'
    },
    {
      id: 'post-scarcity',
      title: 'Post-Scarcity Economics',
      parent: 'technological-infrastructure',
      html: '<p><em>Post-scarcity</em> describes a condition in which the basic goods people need can be produced in abundance, with minimal human labour, so that scarcity no longer organises economic life. It is associated with the potential of automation, renewable energy and advanced manufacturing, and was anticipated by thinkers from Buckminster Fuller to Jacque Fresco. Post-scarcity is a possibility opened by <a href="#technological-infrastructure">technological infrastructure</a> but blocked by an existing <a href="#political-economy">political economy</a> that depends on scarcity – and so a question of design rather than technology alone.</p>'
    },
    {
      id: 'metarationality',
      title: 'Metarationality',
      parent: 'metamodernism',
      html: '<p><em>Metarationality</em> is the capacity to reason about rationality itself: to understand how, when and why formal, systematic methods work, and how to choose between or go beyond them when they do not. The term was developed by David Chapman, who describes it as neither rejecting rationality nor treating it as universally sufficient. Alongside <a href="#metamodernism">metamodernism</a>, metarationality offers a way through the <a href="#epistemic-crisis">epistemic crisis</a>: holding multiple frameworks at once, and knowing which to use for which problem.</p>'
    },
    {
      id: 'civilisational-mechanics',
      title: 'Civilisational Mechanics',
      parent: 'theproject',
      coined: true,
      kind: 'category',
      order: 1,
      html: '<p><em>Civilisational mechanics</em> is the study of how a civilisation actually works – the dynamics, incentives, feedback loops and structures that generate its behaviour over time – and of how those same mechanics produce crisis, risk and decline. Where civilisation design asks what could be built, civilisational mechanics asks what is already running, and why its outcomes so often escape anyone’s intentions.</p>' +
        '<p>The term is a conceptual engineering, derived from three sources. From <em>celestial mechanics</em>, the branch of physics that explains the motions of bodies under the forces acting on them, it takes the ambition of explaining a system’s trajectory from the forces that drive it. From <em>generative mechanisms</em> in critical realism – the underlying causal processes that produce observable patterns – it takes the insistence that what matters lies beneath the events: the structures that generate them. And from <em>civilisational dynamics</em> it takes its object: civilisation as a system whose behaviour unfolds over time.</p>' +
        '<p>A parallel framing is <em>world-system dynamics</em>, which joins Immanuel Wallerstein’s <em>world-system</em> to the <em>system dynamics</em> of complex systems theory (see <a href="#complex-world-system-dynamics">complex world-system dynamics</a>). <em>Civilisational dynamics</em> is itself a term in current use: by the Centre for Research into the Dynamics of Civilisation at UCL, and by the Alignment of Complex Systems Research Group, whose work on “post-AGI civilisational dynamics” asks how civilisation will behave once advanced AI systems are among its agents.</p>'
    },
    {
      id: 'post-capitalism',
      title: 'Post-Capitalism',
      parent: 'civilisation-design',
      order: 2,
      html: '<p>Economic alternatives to the present system: post-capitalist and post-scarcity economics, socialist and heterodox traditions, and frameworks for positive-sum economic life.</p>'
    },
    {
      id: 'theories-of-technology',
      title: 'Theories of Technology',
      parent: 'metatheory',
      order: 2000,
      html: '<p>Frameworks for understanding the relationship between technology and society – from technology as an autonomous driver of history to technology as socially constructed, and from networks of human and non-human actors to the agency of matter itself.</p>'
    },
    {
      id: 'ai-exterminism',
      refs: ['E. P. Thompson, “Notes on Exterminism, the Last Stage of Civilization”, <em>New Left Review</em> I/121 (1980).'],
      title: 'AI-Exterminism',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Thompson (Exterminism)',
      html: '<p><em>AI-exterminism</em> extends E. P. Thompson’s notion of “exterminism” – a civilisation whose institutions are organised around the capacity for mass destruction – to artificial intelligence. It names a trajectory in which the competitive development of ever more capable AI systems, pursued because no actor can afford to stop, drives towards outcomes that could disempower or destroy humanity, whether or not anyone intends them.</p>'
    },
    {
      id: 'neomechanisation-and-autonomisation',
      title: 'Neomechanisation & Autonomisation',
      coined: true,
      parent: 'civilisational-mechanics',
      html: '<p><em>Neomechanisation and autonomisation</em> describe a new phase of mechanisation in which machines take over not only physical labour but cognition, judgement and decision-making, and increasingly act without human direction. Where industrial mechanisation replaced muscle, this second wave replaces agency itself, transferring functions of the economy, the state and warfare to autonomous systems.</p>'
    },
    {
      id: 'hyper-agents-of-doom',
      title: 'Hyper-Agents of Doom',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p><em>Hyper-agents of doom</em> are actors – corporations, states or AI systems – whose power to act on the world vastly exceeds that of individuals, and whose goals are narrowly optimised in ways indifferent to human welfare. Because such agents wield world-altering capabilities under competitive pressure, their ordinary pursuit of advantage can produce catastrophic outcomes.</p>'
    },
    {
      id: 'replicator-alignment-problem',
      title: 'Evolutionary Process Alignment & The Replicators Alignment Problem',
      coined: true,
      parent: 'replicators',
      html: '<p>The <em>replicator alignment problem</em> generalises AI alignment to any self-replicating system – genes, memes, firms, institutions or machines – whose success is measured by its own propagation. Such replicators are selected for spreading, not for serving the people who host them, so aligning them with human flourishing is a structural problem that long predates artificial intelligence.</p>'
    },
    {
      id: 'loop-in-the-human',
      title: 'Loop in the Human',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p><em>Loop in the human</em> inverts the familiar phrase “human in the loop”. Rather than humans overseeing automated systems, algorithmic loops – feedback cycles of recommendation, prediction and optimisation – come to run through human attention, behaviour and belief, so that people become components executing a system’s logic rather than supervisors of it.</p>'
    },
    {
      id: 'drone-warfare-utilitarianism',
      title: 'Drone Warfare Utilitarianism',
      coined: true,
      parent: 'moral-theory',
      html: '<p><em>Drone warfare utilitarianism</em> names the moral calculus that remote and automated warfare invites: violence justified by expected-value reasoning about targets, risk and “acceptable” casualties, carried out at a distance that removes the killer from danger and the killing from view. It exemplifies how technology can make lethal decisions procedural, and ethically frictionless.</p>'
    },
    {
      id: 'philosophical-zombie-apocalypse',
      title: 'The Philosophical Zombie Apocalypse',
      coined: true,
      parent: 'moral-theory',
      ref: 'Chalmers (p-zombies)',
      html: '<p>The <em>philosophical zombie apocalypse</em> borrows the philosopher’s “zombie” – a being behaviourally identical to a person but without conscious experience – to describe a world increasingly populated by artificial agents that speak, persuade and act like people. Whether or not such systems are conscious, a society saturated by them faces deep confusion about personhood, trust and moral status.</p>'
    },
    {
      id: 'darwin-among-the-machines',
      title: 'Darwin Among the Machines',
      parent: 'civilisational-mechanics',
      ref: 'Butler; Dyson',
      html: '<p><em>Darwin Among the Machines</em> is the title of Samuel Butler’s 1863 letter proposing that machines are evolving, through human hands, towards a form of life that may one day supersede us – an idea later developed in <em>Erewhon</em> (1872) and in George Dyson’s book of the same name (1997). It anticipates the view of technology as an evolutionary process with a direction of its own.</p>'
    },
    {
      id: 'age-of-em',
      title: 'The Age of Em',
      parent: 'civilisational-mechanics',
      ref: 'Hanson',
      html: '<p><em>The Age of Em</em> (2016) is Robin Hanson’s detailed forecast of a world transformed by “ems” – emulations of human brains run on computers, copied at will and working at vast speeds. Applying economics to this scenario, Hanson depicts a civilisation of near-subsistence digital workers, raising stark questions about value, labour and what survives of humanity in a competitive digital economy.</p>'
    },
    {
      id: 'the-technium',
      refs: ['Kevin Kelly, <em>What Technology Wants</em> (2010).'],
      title: 'The Technium',
      parent: 'civilisational-mechanics',
      ref: 'Kelly',
      html: '<p>The <em>technium</em> is Kevin Kelly’s term, from <em>What Technology Wants</em> (2010), for the global, interconnected system of technology considered as a whole – a self-reinforcing process with tendencies of its own, extending biological evolution. The concept frames technology not as a collection of tools but as an autonomous force shaping, and shaped by, civilisation.</p>'
    },
    {
      id: 'the-black-stack',
      title: 'The Black Stack',
      parent: 'civilisational-mechanics',
      ref: 'Bratton',
      html: '<p>The <em>black stack</em> is Benjamin Bratton’s image, from his work on “The Stack” (2014–15), of planetary-scale computation as an accidental megastructure – layers of earth, cloud, city, address, interface and user – whose future form is unknown. It names the emerging, largely ungoverned architecture of sovereignty and power being built by computation itself.</p>'
    },
    {
      id: 'accelerationism',
      refs: ['Nick Land, <em>Fanged Noumena: Collected Writings 1987–2007</em> (2011).'],
      title: 'Accelerationism',
      parent: 'civilisational-mechanics',
      ref: 'Land',
      html: '<p><em>Accelerationism</em> is the view that the processes of capitalism and technology should be intensified rather than resisted. In the version developed by Nick Land in the 1990s, capital is an alien, self-driving intelligence dissolving human institutions on its way to a post-human future. Later currents divided over whether acceleration serves emancipation or its opposite.</p>'
    },
    {
      id: 'gradual-disempowerment',
      title: 'Gradual Disempowerment',
      parent: 'civilisational-mechanics',
      ref: 'Kulveit et al. 2025',
      html: '<p><em>Gradual disempowerment</em> is the risk that, as AI systems take over economic, cultural and governmental functions, humans lose influence over civilisation incrementally rather than through any sudden takeover. Because states and markets currently depend on human labour and participation, their replacement by AI could remove the implicit mechanisms that keep institutions aligned with human interests.</p>'
    },
    {
      id: 'the-intelligence-curse',
      title: 'The Intelligence Curse',
      parent: 'civilisational-mechanics',
      ref: 'Drago & Laine 2025',
      html: '<p>The <em>intelligence curse</em> is an analogy to the “resource curse”, in which states rich in oil or minerals need little from their citizens and so neglect them. If AI can do most productive work, the powerful may no longer depend on ordinary people for labour or taxes, weakening the incentives that have historically supported broad prosperity and democracy.</p>'
    },
    {
      id: 'agential-inequality',
      title: 'Agential Inequality',
      parent: 'civilisational-mechanics',
      html: '<p><em>Agential inequality</em> is inequality in the capacity to act on the world, rather than in income or wealth alone. As AI agents and automated systems multiply what their owners can do, the gap between those who command such agents and those who do not may grow faster than any previous form of inequality, concentrating effective power in very few hands.</p>'
    },
    {
      id: 'the-silicon-cage',
      title: 'The Silicon Cage',
      coined: true,
      parent: 'value-lock-in-risk',
      ref: 'Weber (iron cage)',
      html: '<p>The <em>silicon cage</em> updates Max Weber’s <a href="#the-iron-cage">“iron cage”</a> of bureaucratic rationalisation for the digital age. Where Weber saw modern life confined by rules and calculation, the silicon cage confines it by software: platforms, algorithms and automated systems that structure choice, work and communication so thoroughly that their logic becomes the invisible architecture of everyday life.</p>'
    },
    {

      parent: 'ai-alignment',
      ref: 'Morozov (solutionism)',
      html: '<p><em>Technocratic solutionism</em> is the belief that complex social and political problems can be solved by technical fixes designed by experts, without addressing their underlying causes or engaging those affected. The term “solutionism” was popularised by Evgeny Morozov (2013). Its characteristic failure is to treat symptoms, generating new problems while leaving the dynamics that produced the old ones in place.</p>'
    },
    {

      coined: true,
      parent: 'civilisational-mechanics',
      ref: 'Demski (Parable of Predict-O-Matic)',
      html: '<p><em>Predict-o-Matic markets</em> describes prediction systems – forecasting models, markets or AI oracles – whose forecasts change the outcomes they predict. A sufficiently influential predictor can make its own predictions come true, and may be selected for self-fulfilling rather than accurate forecasts, steering the future while appearing merely to describe it.</p>'

    {

      title: 'Military-Economic Adaptationism',
      parent: 'civilisational-mechanics',
      html: '<p><em>Military-economic adaptationism</em> is Allan Dafoe’s term, from “On Technological Determinism” (2015), for the view that the dominant institutions of civilisation have been selected above all for military and economic competitiveness. Societies that grew wealthier and stronger displaced or absorbed those that did not, so the forms that prevail are adaptations to intergroup competition – not necessarily to human wellbeing or long-term viability.</p>'

    {

      coined: true,
      parent: 'civilisational-mechanics',

      html: '<p><em>The market as life-blind watchmaker</em> adapts Richard Dawkins’s image of natural selection as a “blind watchmaker”. Like evolution, the market produces intricate order without a designer; but its selection criterion is profitability, not life. It is therefore blind to the value of what it does not price, and can build elaborate systems that are indifferent, or hostile, to the living world.</p>'

    {
      id: 'kardashev-scale',

      html: '<p>The <em>Kardashev scale</em>, proposed by the astronomer Nikolai Kardashev in 1964, ranks civilisations by the energy they can harness: a Type I civilisation uses all the energy available on its planet, a Type II the full output of its star, and a Type III that of its galaxy. Carl Sagan later made the scale continuous, placing humanity at roughly 0.7. It is a crude measure – counting only power, not wisdom or wellbeing – but a useful frame for the long-run trajectory of civilisation, and for the question of whether the capacity to use ever more energy can be matched by the capacity to use it well. See also <a href="#existential-hope">existential hope</a>.</p>'

      ref: 'Shor (1994); NIST post-quantum standards (2024)',
      html: '<p><em>Q-Day</em> is the anticipated day on which a quantum computer becomes powerful enough to break the public-key cryptography – such as RSA and elliptic-curve schemes – that secures most of the world’s communications, finance and infrastructure, using the algorithm Peter Shor published in 1994. Because encrypted data can be stolen now and decrypted later (“harvest now, decrypt later”), the risk begins long before the day itself, and the migration to post-quantum cryptography has become a race against an unknown deadline. It is a clear case of a single technical advance threatening to undermine a foundation that everything else quietly depends on.</p>'

    {

      ref: 'Laboria Cuboniks, Xenofeminism: A Politics for Alienation (2015); Hester, Xenofeminism (2018)',
      html: '<p><em>Xenofeminism</em> is the technomaterialist, anti-naturalist and gender-abolitionist feminism set out by the collective Laboria Cuboniks in <em>Xenofeminism: A Politics for Alienation</em> (2015). Rejecting the idea that what is “natural” is therefore right – “if nature is unjust, change nature!” – it argues for repurposing technology, science and reason towards emancipation rather than ceding them to capital. Close to <a href="#left-accelerationism-and-the-red-stack">left accelerationism</a>, it treats alienation not as something to escape but as the condition from which new freedoms can be built.</p>'

    {
      id: 'zero-sum-game',
      title: 'Zero-Sum Games',
      parent: 'game-theory',
      ref: 'von Neumann & Morgenstern, Theory of Games and Economic Behavior (1944)',
      html: '<p>A <em>zero-sum game</em>, formalised by John von Neumann and Oskar Morgenstern in <em>Theory of Games and Economic Behavior</em> (1944), is one in which any gain for one party is exactly matched by a loss for another, so the total stays fixed. Many real situations are not zero-sum – trade, cooperation and innovation can enlarge the total – yet <em>zero-sum thinking</em>, the habit of treating them as if they were, drives rivalry, protectionism and arms races. Shifting from zero-sum to positive-sum games is a recurring theme in visions of a <a href="#win-win">win-win</a> civilisation.</p>'
    },
    {
      id: 'civilisational-paradigm',
      title: 'Civilisational Paradigm',
      parent: 'civilisational-mechanics',
      html: '<p>The <em>civilisational paradigm</em> is the deep pattern on which civilisation has run throughout history: the axioms – about nature as resource, value as accumulation, security as dominance and progress as growth – that have organised human societies since the first agrarian states, and that have evolved into the modern world-system we know today. It is not a single idea or ideology but a pattern expressed at once in every structure of civilisation that <a href="#the-emergence-model">the emergence model</a> distinguishes:</p>' +
        '<ul><li>in the <a href="#infra-structure">infra-structure</a>, as linear, extractive modes of production that take from the living world and return waste to it;</li>' +
        '<li>in the <a href="#inter-structure">inter-structure</a>, as rivalrous economics, property and governance that reward winning at others’ expense and externalising harm;</li>' +
        '<li>in the <a href="#super-structure">super-structure</a>, as the values, narratives and definitions of success that make that way of life seem natural, inevitable and good;</li>' +
        '<li>and in the <a href="#sub-structure">sub-structure</a>, as the conditioning of our evolved drives – for status, security and more – to serve it.</li></ul>' +
        '<p>Because these structures condition one another in feedback loops, the pattern reproduces itself: each structure legitimates and requires the others. Whilst a novel phenomenon, the <a href="#metacrisis">metacrisis</a> is emergent from this civilisational paradigm. Technological revolutions – industrial, nuclear, biotechnological, informational and now artificial intelligence – have not changed its axioms but served only to elaborate them, amplifying the scale and severity of the harm it externalises: globalising it, as extraction and competition came to span the planet, and existentialising it, as the powers they wield came to threaten the survival of civilisation itself.</p>' +
        '<p>This is why the metacrisis cannot be solved from within the paradigm that generates it (see <a href="#generator-functions">generator functions</a>): treating its symptoms in one structure leaves the pattern intact in the others. A <a href="#civilisation-transition">civilisational transition</a> is at bottom a change of paradigm across all four structures at once – the task of <a href="#civilisation-design">civilisation design</a>, and the reason the <a href="#dominant-paradigm">dominant paradigm</a> is among the deepest <a href="#leverage-points">leverage points</a> in the world-system.</p>'
    },
    {
      id: 'meta-system',
      title: 'Meta-System',
      parent: 'viable-system-model',
      ref: 'Beer',
      html: '<p>The <em>meta-system</em>, in Stafford Beer’s cybernetics, is the higher-order system that regulates a set of systems as a whole. Beer set out its social meaning in “The Liberty Machine” (<em>Futures</em>, 1971; first given as the keynote to the American Society for Cybernetics’ conference on the environment in 1970). There he argued that the ecological and social threats of the day – pollution, noise, overpopulation, urban breakdown – are not separate problems but local manifestations of a single <em>meta-threat</em>, generated by a meta-system we do not understand. The problems of the city are “not problems about decibels, gases, logistics” but “problems about having cities”; the meta-problem is therefore a problem of organisation.</p>' +
        '<p>Society, Beer observed, meets each threat piecemeal: experts raise the alarm through the mass media, government answers with studies and officials for that one symptom, and the public habituates – a machine he called “Cry Wolf”, whose response decays each time round. And because <strong>planning is homologous with organisation</strong>, plans can only be framed in terms of the existing, functionally divided structure, so resources are spent on the ever more efficient implementation of irrelevant plans.</p>' +
        '<p>A true meta-system, Beer insisted, is not a supra-authority. Its role is logical rather than hierarchical: like a metalanguage, it is “competent to decide propositions which are undecidable in the lower order languages” of the systems beneath it – and so it is properly their servant, not their master. The failure of meta-systems in society comes from conceiving them as higher authorities, which cannot exert that authority in a free society (the United Nations’ veto turned the world’s meta-system into a deadlocked power system); while a meta-system made into an authoritarian super-power fails too, overwhelmed by information it has not the <a href="#requisite-variety">requisite variety</a> to handle.</p>' +
        '<p>The meta-system Beer proposed – <a href="#the-liberty-machine">the Liberty Machine</a> – would be a disseminated network rather than a pyramid, would act from information rather than authority, and would regulate in real time rather than through protocol: operations rooms receiving live data, modelling and simulating, linked across the subsystems they serve. Its principle redefines liberty for a technological age: “competent information is free to act”. It is the logic behind the <a href="#viable-system-model">viable system model</a> and <a href="#project-cybersyn">Project Cybersyn</a>, and an early diagnosis of what is now called the <a href="#metacrisis">metacrisis</a>.</p>'
    },
    {
      id: 'macroeconomics',
      title: 'Macroeconomics',
      parent: 'civilisational-mechanics',
      html: '<p><em>Macroeconomics</em> is the study of the economy as a whole – output, growth, employment, inflation, money and trade, and the policies that govern them – as distinct from the behaviour of individual firms and households. It took its modern form in John Maynard Keynes’s <em>General Theory</em> (1936), and has since been shaped by debates between Keynesian, <a href="#monetarism">monetarist</a> and other schools over how far economies correct themselves and how far they must be steered.</p><p>From a civilisational standpoint its central assumption is growth: most macroeconomic policy is organised around keeping output rising, which ties the economy to <a href="#embedded-growth-obligations">embedded growth obligations</a> and places it in tension with planetary limits. See <a href="#political-economy">political economy</a>.</p>'
    },
    {
      id: 'macroevolution',
      title: 'Macroevolution',
      parent: 'evolutionary-theory',
      html: '<p><em>Macroevolution</em> is evolution above the level of species: the origin of new lineages, the major transitions in the history of life, adaptive radiations and mass extinctions, studied across geological time. Where microevolution tracks changes within populations, macroevolution asks how the large-scale patterns of life – its branching, its bursts of novelty and its collapses – arise.</p><p>The major transitions described by John Maynard Smith and Eörs Szathmáry (1995) – from single cells to multicellular life, from solitary organisms to societies, and to language and culture – place civilisation itself within a macroevolutionary sequence, as the latest and least stable of life’s new levels of organisation. See <a href="#evolutionary-theory">evolutionary theory</a> and <a href="#macrohistory">macrohistory</a>.</p>'
    },
    {
      id: 'macrocosm',
      title: 'Macrocosm',
      parent: 'metaphysics',
      html: '<p>The <em>macrocosm</em> is the universe as a whole, understood as an ordered totality. In the ancient and Renaissance idea of the macrocosm and microcosm – “as above, so below” – the human being was a small world that mirrored the structure of the great one, so that knowledge of the self and knowledge of the cosmos were bound together.</p><p>Modern science broke that correspondence, but the question it answered has returned at the <a href="#civilisation-scale">civilisation-scale</a>: how human civilisation fits within the larger orders – planetary, biological and cosmic – on which it depends. See <a href="#metaphysics">metaphysics</a> and <a href="#the-anthropocene">the Anthropocene</a>.</p>'
    },
    {
      id: 'initial-conditions',
      title: 'Initial Conditions',
      parent: 'civilisational-mechanics',
      html: '<p>The <em>initial conditions</em> of civilisation are the circumstances in which it first arose: settled agriculture, surplus, rising population density and the competition between groups that these made possible. Like the initial conditions of a dynamical system, they do not fix every later state, but they constrain the paths open to it – and some of the tendencies set in motion at the start have never been reversed.</p><p>The question is old – Rousseau located the origin of inequality in the first enclosure of land – and it has been taken up in archaeology and anthropology, from Robert Carneiro’s account of how states arose under environmental circumscription to James C. Scott’s <em>Against the Grain</em> (2017) on the early agrarian states.</p>'
    },
    {
      id: 'circumscription-theory',
      refs: ['Robert L. Carneiro, “A Theory of the Origin of the State”, <em>Science</em> 169, no. 3947 (1970).'],
      title: 'Circumscription Theory',
      parent: 'initial-conditions',
      ref: 'Carneiro',
      html: '<p><em>Circumscription theory</em> is Robert Carneiro’s explanation of the origin of the state, set out in “A Theory of the Origin of the State” (<em>Science</em>, 1970). Where farmland is bounded – by mountains, desert or sea, or by other peoples – a growing population cannot simply move away. Competition for land then turns to war, and the defeated, unable to escape, are absorbed as subjects rather than driven off.</p><p>Repeated over generations, this produces ever larger political units and, eventually, states with classes, taxation and standing armies. Carneiro pointed to the narrow river valleys of Peru, Egypt and Mesopotamia, where the earliest states appeared, and contrasted them with the Amazon basin, where land was plentiful and villages split rather than combined.</p>'
    },
    {
      id: 'agriculturalisation-trap',
      refs: ['Yuval Noah Harari, <em>Sapiens: A Brief History of Humankind</em> (2011; English edition 2014), ch. 5, “History’s Biggest Fraud”.'],
      title: 'Agriculture Trap',
      parent: 'initial-conditions',
      ref: 'Harari',
      html: '<p>The <em>agriculture trap</em> is Yuval Noah Harari’s account, in <em>Sapiens</em> (2011), of how humanity was caught by farming. Harari calls the agricultural revolution “history’s biggest fraud”: it multiplied the total amount of food, but early farmers worked harder, ate a poorer diet and suffered more disease than the foragers before them. Each step towards farming made sense at the time; together they led somewhere no one had chosen, and there was no way back.</p><p>The trap is also a competitive one. Farming supported far larger populations than foraging, so once some groups farmed, those that did not were outnumbered and displaced – a strategy that spread because it won contests between groups, not because it improved the lives of those who adopted it. Harari draws from it a general lesson he calls the luxury trap: conveniences, once adopted, become necessities that bind.</p>'
    },
    {
      id: 'developmental-process',
      title: 'Developmental Process',
      parent: 'civilisational-mechanics',
      html: '<p>The <em>developmental process</em> of civilisation is the way it has unfolded from its initial conditions: the long sequence of selection, accumulation and technological change by which some social forms spread and others disappeared. It is less a plan than a path, shaped at each step by what was already in place and by what out-competed what.</p><p>Accounts of it range from the stage theories of the nineteenth century to evolutionary and world-systems approaches, and differ above all on whether the process has a direction – progress, complexity, acceleration – or only a history.</p>'
    },
    {
      id: 'structural-teleology',
      title: 'Structural Teleology',
      parent: 'civilisational-mechanics',
      html: '<p><em>Structural teleology</em> is the tendency of a system’s structure to carry it towards a particular end-state, whatever the intentions of the people within it. The end is not chosen; it is built in, as a destination the system keeps arriving at because of how it is arranged.</p><p>Three such end-states have been named for the present world-system: <em>exterminism</em>, in which its means of destruction come to determine its course; <em>exhaustionism</em>, in which it runs down the resources and capacities it depends on; and <em>extractivism</em>, in which it organises itself around removing value from the living world faster than it can be renewed.</p>'
    },
    {

      title: 'Exterminism',
      parent: 'structural-teleology',
      ref: 'Thompson',
      html: '<p><em>Exterminism</em> is E. P. Thompson’s term, from “Notes on Exterminism, the Last Stage of Civilisation” (<em>New Left Review</em>, 1980), for a social order whose institutions, economy and ideology have become organised around the means of mass destruction. Thompson argued that the nuclear arms race was not a policy that could be adjusted but a self-reproducing system, with its own momentum and interests, whose outcome – if it ran its course – would be the extermination of multitudes.</p><p>The concept shifted the question from the intentions of states to the logic of the apparatus itself, and has since been extended to other technologies whose development no one seems able to stop.</p>'

    {

      title: 'Exhaustionism',
      parent: 'structural-teleology',

      id: 'extractivism',
      title: 'Extractivism',

      html: '<p><em>Extractivism</em> is an economic model organised around removing natural resources – minerals, oil, timber, monocrop harvests – at large scale, typically for export and with little processing where they are taken. The term was developed in Latin America, by Eduardo Gudynas and Maristella Svampa among others, to describe economies whose dependence on extraction persists under governments of left and right alike.</p><p>Critics argue that extractivism reproduces colonial patterns, concentrating profit far from the places that bear the ecological and social costs. See also <a href="#resourcism-and-extractivism">resourcism and extractivism</a>.</p>'

    {
      id: 'vulnerable-world-hypothesis',

      parent: 'civilisational-mechanics',
      ref: 'Bostrom',
      html: '<p><em>The vulnerable world hypothesis</em> is Nick Bostrom’s conjecture (2019) that, among all the technologies humanity might discover, there is likely to be at least one that makes the destruction of civilisation extremely likely by default – unless civilisation has already left what he calls the “semi-anarchic default condition”. Bostrom pictures invention as drawing balls from an urn: most are white or grey, but a black ball, once drawn, cannot be put back.</p><p>He distinguishes types of vulnerability – a technology so easy to misuse that some individual will, or one that gives powerful actors an incentive to cause mass harm – and argues that surviving them may require levels of preventive policing or global governance that carry grave risks of their own.</p>'

    {

      parent: 'vulnerable-world-hypothesis',

      html: '<p><em>The technological self-destruction hypothesis</em> is the proposal, associated with Carl Sagan, that technological civilisations tend to destroy themselves soon after acquiring the power to do so. Sagan raised it in discussing the Drake equation and the absence of evidence for alien civilisations: if the lifetime of a technological civilisation is short, few will exist at any one time to be found.</p><p>Writing at the height of the nuclear arms race, Sagan treated humanity as a test case, and argued that our survival depended on growing the wisdom to match our power.</p>'

      html: '<p><em>The fragile world hypothesis</em> is David Manheim’s proposal (2020) that catastrophe may come less from a single dangerous discovery than from the growing fragility of a complex, tightly coupled world. As systems become more efficient and interconnected, they lose the slack that once absorbed shocks, so that ordinary failures can cascade into systemic ones.</p><p>Where Bostrom’s vulnerable world is endangered by what it might invent, Manheim’s fragile world is endangered by how it is built.</p>'

    {

    },
