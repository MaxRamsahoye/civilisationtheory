<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civilisation Theory Map</title>
<meta name="description" content="A glossary of concepts for Civilisation Theory: a conceptual adaptive system for civilisation design and transition.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='0,0 100,0 0,100' fill='%23000'/></svg>">
<script>
  // Apply saved theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem('ct-theme'); } catch (e) {}
    if (['light', 'sepia', 'midnight', 'dark'].indexOf(t) < 0) {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* ET Bembo (ET Book), MIT licence — https://github.com/edwardtufte/et-book */
  @font-face {
    font-family: 'ET Bembo';
    src: url('fonts/et-book-roman-old-style-figures.woff') format('woff');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'ET Bembo';
    src: url('fonts/et-book-display-italic-old-style-figures.woff') format('woff');
    font-weight: 400; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: 'ET Bembo';
    src: url('fonts/et-book-semi-bold-old-style-figures.woff') format('woff');
    font-weight: 600; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'ET Bembo';
    src: url('fonts/et-book-bold-line-figures.woff') format('woff');
    font-weight: 700; font-style: normal; font-display: swap;
  }

  /* IBM Plex Sans Arabic (latin subset), SIL Open Font Licence — interface labels */
  @font-face {
    font-family: 'IBM Plex Sans Arabic';
    src: url('fonts/ibm-plex-sans-arabic-latin-400-normal.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans Arabic';
    src: url('fonts/ibm-plex-sans-arabic-latin-500-normal.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans Arabic';
    src: url('fonts/ibm-plex-sans-arabic-latin-600-normal.woff2') format('woff2');
    font-weight: 600; font-style: normal; font-display: swap;
  }

  :root {
    --bg: #fffff8;
    --bg-side: #f7f6ee;
    --text: #111111;
    --muted: #6b6b64;
    --rule: #dcdad0;
    --link: #111111;
    --link-underline: #9a988e;
    --active: #111111;
    --side-w: 17rem;
    --measure: 36rem;
    --select: #d9e3ec;
    /* Arrow cursors: outline by default, filled over links and buttons */
    --cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g stroke-linejoin='miter' stroke-linecap='square'><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23fffff8' stroke='%23fffff8' stroke-width='3.4'/><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='none' stroke='%23111111' stroke-width='1.4'/><line x1='2.0' y1='2.0' x2='9.01' y2='9.01' stroke='%23111111' stroke-width='1.4'/></g></svg>") 2 2, auto;
    --cursor-link: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g stroke-linejoin='miter' stroke-linecap='square'><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23fffff8' stroke='%23fffff8' stroke-width='3.4'/><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23111111' stroke='%23111111' stroke-width='1.4'/><line x1='2.0' y1='2.0' x2='9.01' y2='9.01' stroke='%23fffff8' stroke-width='1.4'/></g></svg>") 2 2, pointer;
  }
  :root[data-theme="dark"] {
    --select: #3b4757;
    --bg: #151515;
    --bg-side: #1b1b1a;
    --text: #e8e6de;
    --muted: #8f8d85;
    --rule: #333330;
    --link: #e8e6de;
    --link-underline: #6d6b64;
    --active: #ffffff;
    --cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g stroke-linejoin='miter' stroke-linecap='square'><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23151515' stroke='%23151515' stroke-width='3.4'/><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='none' stroke='%23e8e6de' stroke-width='1.4'/><line x1='2.0' y1='2.0' x2='9.01' y2='9.01' stroke='%23e8e6de' stroke-width='1.4'/></g></svg>") 2 2, auto;
    --cursor-link: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g stroke-linejoin='miter' stroke-linecap='square'><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23151515' stroke='%23151515' stroke-width='3.4'/><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23e8e6de' stroke='%23e8e6de' stroke-width='1.4'/><line x1='2.0' y1='2.0' x2='9.01' y2='9.01' stroke='%23151515' stroke-width='1.4'/></g></svg>") 2 2, pointer;
  }

  :root[data-theme="sepia"] {
    --select: #e4cc9c;
    --bg: #f4ecd8;
    --bg-side: #ece2c8;
    --text: #3b2e1e;
    --muted: #85735a;
    --rule: #d8c9a8;
    --link: #3b2e1e;
    --link-underline: #ae9b79;
    --active: #3b2e1e;
    --cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g stroke-linejoin='miter' stroke-linecap='square'><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23f4ecd8' stroke='%23f4ecd8' stroke-width='3.4'/><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='none' stroke='%233b2e1e' stroke-width='1.4'/><line x1='2.0' y1='2.0' x2='9.01' y2='9.01' stroke='%233b2e1e' stroke-width='1.4'/></g></svg>") 2 2, auto;
    --cursor-link: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g stroke-linejoin='miter' stroke-linecap='square'><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23f4ecd8' stroke='%23f4ecd8' stroke-width='3.4'/><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%233b2e1e' stroke='%233b2e1e' stroke-width='1.4'/><line x1='2.0' y1='2.0' x2='9.01' y2='9.01' stroke='%23f4ecd8' stroke-width='1.4'/></g></svg>") 2 2, pointer;
  }
  :root[data-theme="midnight"] {
    --select: #3a4d7c;
    --bg: #161f36;
    --bg-side: #121a2e;
    --text: #e4e8f2;
    --muted: #9aa3bb;
    --rule: #2b3654;
    --link: #e4e8f2;
    --link-underline: #5d6a8a;
    --active: #ffffff;
    --cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g stroke-linejoin='miter' stroke-linecap='square'><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23161f36' stroke='%23161f36' stroke-width='3.4'/><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='none' stroke='%23e4e8f2' stroke-width='1.4'/><line x1='2.0' y1='2.0' x2='9.01' y2='9.01' stroke='%23e4e8f2' stroke-width='1.4'/></g></svg>") 2 2, auto;
    --cursor-link: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g stroke-linejoin='miter' stroke-linecap='square'><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23161f36' stroke='%23161f36' stroke-width='3.4'/><polygon points='2.0,2.0 6.84,16.99 9.01,9.01 16.99,6.84' fill='%23e4e8f2' stroke='%23e4e8f2' stroke-width='1.4'/><line x1='2.0' y1='2.0' x2='9.01' y2='9.01' stroke='%23161f36' stroke-width='1.4'/></g></svg>") 2 2, pointer;
  }

  * { box-sizing: border-box; }
  ::selection { background: var(--select); color: var(--text); }
  html { font-size: 17px; scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  @media (min-width: 900px) { html { font-size: 19px; } }

  html, body { cursor: var(--cursor); }
  a, button, a *, button * { cursor: var(--cursor-link); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'ET Bembo', 'ETBembo', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    line-height: 1.55;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: oldstyle-nums;
    transition: background-color .2s ease, color .2s ease;
  }

  a {
    color: var(--link);
    text-decoration: underline;
    text-decoration-color: var(--link-underline);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  a:hover { text-decoration-color: var(--text); }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: var(--cursor-link);
  }
  button:focus-visible, a:focus-visible {
    outline: 1px solid var(--text);
    outline-offset: 3px;
  }

  /* ---------- Controls ---------- */
  .control {
    position: fixed;
    z-index: 30;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: color .2s ease, opacity .25s ease, left .25s ease;
  }
  .control:hover { color: var(--text); }
  /* Lines stay 1.4px whatever each icon's viewBox scale, so all icons share one weight */
  .control svg * { vector-effect: non-scaling-stroke; }
  .control svg {
    width: 1.05rem;
    height: 1.05rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4px;
    stroke-linejoin: miter;
    overflow: visible;
    transition: transform .25s ease;
  }
  /* Sidebar toggle: middle of the left side; points left to close, right to open */
  #sidebar-toggle {
    top: 50%;
    left: calc(var(--side-w) - 2.4rem);
    transform: translateY(-50%);
  }
  body.sidebar-closed #sidebar-toggle { left: 1.4rem; }
  /* Open: arrow pointing left (close). Closed: map icon (open). */
  #sidebar-toggle .i-close { transform: rotate(90deg); }
  #sidebar-toggle .i-map, body.sidebar-closed #sidebar-toggle .i-close { display: none; }
  body.sidebar-closed #sidebar-toggle .i-map { display: block; }
  #theme-toggle { top: 0.8rem; right: 0.9rem; }
  /* One icon per theme: sun (white), moon (black), filled sun (sepia), moon and star (blue) */
  #theme-toggle svg { display: none; width: 1.25rem; height: 1.25rem; }
  :root[data-theme="light"] #theme-toggle .i-light,
  :root[data-theme="dark"] #theme-toggle .i-dark,
  :root[data-theme="sepia"] #theme-toggle .i-sepia,
  :root[data-theme="midnight"] #theme-toggle .i-midnight { display: block; }
  #theme-toggle .fill { fill: currentColor; stroke: none; }
  #to-top { bottom: 1.4rem; right: 1.4rem; opacity: 0; pointer-events: none; }
  #to-top svg { transform: rotate(180deg); }
  #to-top.visible { opacity: 1; pointer-events: auto; }

  /* ---------- Reading progress (replaces the scrollbar) ---------- */
  #progress {
    position: fixed;
    top: 0; right: 0;
    width: 5px;
    height: 100%;
    background: var(--text);
    transform-origin: top;
    transform: scaleY(0);
    z-index: 40;
    pointer-events: none;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--side-w);
    background: var(--bg-side);
    border-right: 1px solid var(--rule);
    padding: 3.6rem 1.4rem 2rem;
    overflow-y: auto;
    scrollbar-width: none;
    z-index: 20;
    transition: transform .25s ease, background-color .2s ease;
  }
  body.sidebar-closed #sidebar { transform: translateX(-100%); }

  /* Interface labels (map, tree string, contents) are set in IBM Plex Sans Arabic */
  .side-title, .tree-string, .count {
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
    font-variant-numeric: normal;
  }
  .side-title, .tree-string, .count {
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .side-title { margin: 0 0 1rem; }
  .side-title a { color: inherit; text-decoration: none; }
  .side-title a:hover, .side-title a[aria-current="page"] { color: var(--text); }
  .tree, .tree ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .tree ul { padding-left: 1.2rem; }
  .tree li { margin: 0.15rem 0; }
  .tree a {
    text-decoration: none;
    color: var(--muted);
    display: inline-block;
    line-height: 1.35;
    padding: 0.1rem 0;
  }
  .tree a:hover { color: var(--text); }
  .tree a[aria-current="page"] { color: var(--active); }
  .tree .empty {
    color: var(--muted);
    margin-top: 0.35rem;
  }

  /* ---------- Main ---------- */
  /* Short entries sit centred on screen; long ones start at the 5rem top cap */
  main {
    padding: 5rem 0 6rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: padding-left .25s ease;
    container-type: inline-size;
  }
  .page { width: 100%; }
  @media (min-width: 900px) {
    body:not(.sidebar-closed) main { padding-left: var(--side-w); }
  }
  .page {
    display: grid;
    grid-template-columns: minmax(1.5rem, 1fr) minmax(0, var(--measure)) minmax(1.5rem, 1fr);
  }
  article {
    grid-column: 2;
    text-align: left;
    min-width: 0;
  }

  /* ---------- Contents (left of the text column) ---------- */
  #toc {
    grid-column: 1;
    /* Centred in the left column: equal space to the screen (or map) edge and to the text */
    justify-self: center;
    width: max-content;
    max-width: 7rem;
    position: sticky;
    top: 50vh;
    transform: translateY(-50%);
    align-self: start;
    font-size: 0.85rem;
    line-height: 1.35;
  }
  #toc .toc-title {
    display: block;
    font-size: 1.2em;
    line-height: 1.2;
    font-weight: 600;
    margin: 0 0 0.8rem;
  }
  #toc ul { list-style: none; margin: 0; padding: 0; }
  #toc li { margin: 0 0 0.55rem; }
  #toc a { color: var(--muted); text-decoration: none; }
  #toc a:hover, #toc a.active { color: var(--text); }
  /* Contents only show while the map is closed */
  body:not(.sidebar-closed) #toc { display: none; }
  /* Map closed: the map arrow sits at the screen edge, so keep clear of it */
  @container (max-width: 66rem) {
    body.sidebar-closed #toc { display: none; }
  }
  /* Map closed and room to spare: widen so every entry fits on one line */
  @container (min-width: 72rem) {
    body.sidebar-closed #toc { max-width: 11.5rem; }
  }

  .tree-string { margin: 0 0 1.2rem; }
  .tree-string a { color: var(--muted); text-decoration: none; }
  .tree-string a:hover { color: var(--text); }
  .tree-string > a, .tree-string > span:not(.sep) { white-space: nowrap; }
  .tree-string .sep { margin: 0 0.45em; }

  h1 {
    font-weight: 700;
    font-size: 2.6rem;
    line-height: 1.1;
    margin: 0 0 1.6rem;
    letter-spacing: -0.005em;
  }
  h2 {
    font-weight: 600;
    font-size: 1.45rem;
    line-height: 1.2;
    margin: 2.4rem 0 0.8rem;
  }
  h1, h2 { scroll-margin-top: 1.5rem; }
  p { margin: 0 0 1.1rem; }
  /* Body text: 1.2 line spacing, 12px between paragraphs (and list items) */
  .description { font-size: 1.1rem; line-height: 1.2; }
  .description p, .description ul { margin: 0 0 12px; }
  .description ul { padding-left: 1.3rem; }
  .description li { margin-bottom: 12px; padding-left: 0.2rem; }
  .description li strong { font-weight: 700; font-size: 1em; }

  .count {
    border-top: 1px solid var(--rule);
    padding-top: 0.8rem;
    margin-top: 1.4rem;
  }
  .index-list { list-style: none; padding: 0; margin: 0.6rem 0 0; }
  .index-list li { margin: 0.2rem 0; }

  /* ---------- Loading screen ---------- */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 1.5rem;
    background: var(--bg);
    transition: opacity .6s ease, visibility 0s linear .6s;
  }
  #loader.done { opacity: 0; visibility: hidden; }
  #loader h1 { position: relative; margin: 0; white-space: nowrap; }
  /* The invisible full title fixes the width, so typing grows from a stable left edge */
  #loader .ghost { visibility: hidden; }
  #loader .typed { position: absolute; left: 0; top: 0; }

  /* Mobile: sidebar overlays the page */
  #scrim {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 15;
  }
  @media (max-width: 899px) {
    /* Phones: the text column reaches the edge, so the map toggle moves to the top-left corner */
    body.sidebar-closed #sidebar-toggle { top: 0.8rem; left: 0.9rem; transform: none; }
    body:not(.sidebar-closed) #scrim { display: block; }
    h1 { font-size: 2.1rem; }
  }
</style>
</head>
<body>

<div id="loader" aria-hidden="true">
  <h1><span class="ghost">Civilisation Theory</span><span class="typed"><span id="loader-text"></span></span></h1>
</div>
<noscript><style>#loader { display: none; }</style></noscript>

<div id="progress" aria-hidden="true"></div>
<button id="sidebar-toggle" class="control" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Hide concept map" aria-keyshortcuts="Space">
  <svg class="i-map" viewBox="-9.5 -9.5 118.9 118.9" aria-hidden="true"><polygon points="6,22 36,10 64,22 94,10 94,78 64,90 36,78 6,90"/><line x1="36" y1="10" x2="36" y2="78"/><line x1="64" y1="22" x2="64" y2="90"/></svg>
  <svg class="i-close" viewBox="-8.3 -7.3 116.7 116.7" aria-hidden="true"><polygon points="8,10 50,34 92,10 50,92"/><line x1="50" y1="34" x2="50" y2="92"/></svg>
</button>
<button id="theme-toggle" class="control" type="button" aria-label="Change theme (white, black, sepia, blue)" aria-keyshortcuts="T">
  <svg class="i-light" viewBox="-3.7 -3.7 107.3 107.3" aria-hidden="true"><circle cx="50" cy="50" r="18"/><line x1="81.0" y1="50.0" x2="94.0" y2="50.0"/><line x1="71.9" y1="71.9" x2="81.1" y2="81.1"/><line x1="50.0" y1="81.0" x2="50.0" y2="94.0"/><line x1="28.1" y1="71.9" x2="18.9" y2="81.1"/><line x1="19.0" y1="50.0" x2="6.0" y2="50.0"/><line x1="28.1" y1="28.1" x2="18.9" y2="18.9"/><line x1="50.0" y1="19.0" x2="50.0" y2="6.0"/><line x1="71.9" y1="28.1" x2="81.1" y2="18.9"/></svg>
  <svg class="i-dark" viewBox="-5.4 2.6 102.9 102.9" aria-hidden="true"><path class="fill" d="M40.3 18.4 A36 36 0 1 0 81.6 59.7 A30 30 0 0 1 40.3 18.4 Z"/></svg>
  <svg class="i-sepia" viewBox="-3.7 -3.7 107.3 107.3" aria-hidden="true"><circle class="fill" cx="50" cy="50" r="21.5"/><line x1="81.0" y1="50.0" x2="94.0" y2="50.0"/><line x1="71.9" y1="71.9" x2="81.1" y2="81.1"/><line x1="50.0" y1="81.0" x2="50.0" y2="94.0"/><line x1="28.1" y1="71.9" x2="18.9" y2="81.1"/><line x1="19.0" y1="50.0" x2="6.0" y2="50.0"/><line x1="28.1" y1="28.1" x2="18.9" y2="18.9"/><line x1="50.0" y1="19.0" x2="50.0" y2="6.0"/><line x1="71.9" y1="28.1" x2="81.1" y2="18.9"/></svg>
  <svg class="i-midnight" viewBox="-2.8 4.7 98.6 98.6" aria-hidden="true"><path d="M40.3 18.4 A36 36 0 1 0 81.6 59.7 A30 30 0 0 1 40.3 18.4 Z"/><path class="fill" d="M72 21 L75.2 28.8 L83 32 L75.2 35.2 L72 43 L68.8 35.2 L61 32 L68.8 28.8 Z"/></svg>

<script>
  /*
   * Concept entries.
   * Each entry: id (URL slug), title, parent (id of parent concept, or null for the root),
   * and html (the description). The root entry is the homepage.
   * To add a concept, append an object with a parent id — the tree, tree string,
   * index and concept count all update automatically.
   */
  // Shared by the homepage's closing section and the standalone Map page.
  var MAP_INTRO = '<p>Below is a complete index of concepts on this site. Over time, this map will extend to cover hundreds of entries.</p>';

  var CONCEPTS = [
    {
      id: 'civilisation-theory',
      title: 'Civilisation Theory',
      parent: null,
      html: [
        '<p><em>Civilisation Theory</em> is a unification of all forms of theory – primarily, systems theory, evolutionary theory, critical theory and game theory – applied at a civilisational-scale. The thesis of civilisation theory is that the generative dynamics of existential risk(s) emerge from the developmental process, initial conditions and dominant paradigm of civilisation itself. From this macrohistorical frame of reference, the only sufficient solution to avoid both destruction and dystopia is civilisation design and transition: to realise a new form of political economy (structure) and cultural psychology (superstucture), compatible with 21st century technology (infrastructure), a viable life-world-system.</p>',

        '<h2>A Conceptual Adaptive System</h2>',
        '<p>This glossary site serves to create a <em>conceptual adaptive system</em> for this ultimate project. For civilisation to adapt, we must first adapt the concepts we use to understand it: our map of the territory or world-model. In other words, recursively within the civilisational crisis, is an epistemic crisis to process it. The <a href="https://maxramsahoye.github.io/civilisationtheory">Civilisation Theory Map</a> is a response to this crisis: a collective knowledge base to aid the formation of collective understanding, and in turn, collective action.</p>',

        '<h2>Project Context</h2>',
        '<p>The Civilisation Theory Map is inspired by <a href="https://consilienceproject.org/glossary/">the glossary of <em>The Consilience Project</em></a> and the metacrisis frame of the <a href="https://civilizationresearchinstitute.org/"><em>Civilization Research Institute</em></a>. More broadly, Civilisation Theory is a critical dialectical synthesis of three core clusters of intellectual subcultures:</p>',
        '<ul>',
        '<li><strong>The Meta-space:</strong> oriented around the metacrisis, metamodernism and metatheory (also metaphysics, metanarrative, metasystem, metarationality, metacognition)</li>',
        '<li><strong>The PARA-academic space:</strong> encompassing progress studies, AI alignment, rationalism and effective altruism (also existential risk studies).</li>',
        '<li><strong>The Cybernetic Economics lineage:</strong> across Buckminster Fuller (1969), Jacque Fresco (1985), Stafford Beer (1971), Daniel Schmachtenberger (2017, 21), Peter Joseph (2014, 17, 25)</li>',
        '</ul>',

        '<h2>The Map</h2>',
        MAP_INTRO,
        '<!--INDEX-->'
      ].join('\n')
    },
    {
      id: 'metacrisis',
      title: 'Metacrisis',
      parent: 'civilisation-theory',
      html: '<p>The <em>metacrisis</em> is the underlying pattern that connects the many crises of the 21st century – ecological, technological, political, economic and psychological – as expressions of shared generative dynamics rather than as separate problems. Where a polycrisis names the interaction of many crises, the metacrisis names what lies beneath them: above all, rivalrous competition under exponential technology (see <a href="#multipolar-trap">multipolar trap</a>), and the extraction of value from complex systems faster than they can regenerate. Because these dynamics are built into the dominant paradigm of civilisation itself, addressing symptoms without addressing their generators tends to relocate harm rather than remove it. Associated with Daniel Schmachtenberger, <em>The Consilience Project</em> and the <em>Civilization Research Institute</em>, the metacrisis is the problem statement of Civilisation Theory: its most acute expression is <a href="#existential-risk">existential risk</a>, and its sufficient response is <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'existential-risk',
      title: 'Existential Risk',
      parent: 'metacrisis',
      html: '<p>An <em>existential risk</em> is a risk that threatens the extinction of humanity, or the permanent and drastic curtailment of its potential. Formalised by Nick Bostrom (2002) and developed within existential risk studies, the concept is usually applied to discrete hazards such as advanced AI, engineered pandemics, nuclear war and severe climate change. Civilisation Theory treats these instead as emergent outcomes of the <a href="#metacrisis">metacrisis</a>, and identifies two failure modes that any response must avoid at once: destruction, when powerful technology remains in the hands of uncoordinated, competing actors; and dystopia, when that risk is controlled through concentrated, unaccountable power.</p>'
    },
    {
      id: 'multipolar-trap',
      title: 'Multipolar Trap',
      parent: 'metacrisis',
      html: '<p>A <em>multipolar trap</em> is a situation in which each actor, acting rationally in competition with others, is driven towards an outcome that is worse for everyone – including itself – because no single actor can stop without losing ground to the rest. It generalises the prisoner’s dilemma and the tragedy of the commons to many actors, and appears in arms races, regulatory races to the bottom, the attention economy and the race to deploy powerful technologies before they are understood. Popularised by Scott Alexander’s <em>Meditations on Moloch</em> (2014) and developed by Daniel Schmachtenberger as a generator function of the <a href="#metacrisis">metacrisis</a>, the trap becomes a source of <a href="#existential-risk">existential risk</a> under exponential technology, and can only be escaped by changing the incentive structure itself.</p>'
    },
    {
      id: 'civilisation-design',
      title: 'Civilisation Design',
      parent: 'civilisation-theory',
      html: '<p><em>Civilisation design</em> is the deliberate design of the basic structures of civilisation – its political economy (structure), cultural psychology (superstructure) and technology (infrastructure) – as one integrated system, rather than reform within the existing one. Because a change to one layer tends to be reabsorbed by the others, the three must be designed to be compatible, and the design must include a viable path of transition that avoids both destruction and dystopia along the way. Drawing on the Cybernetic Economics lineage of Buckminster Fuller, Stafford Beer and Jacque Fresco, civilisation design is Civilisation Theory’s response to the <a href="#metacrisis">metacrisis</a>, and its aim is a <a href="#life-world-system">life-world-system</a>.</p>'
    },
    {
      id: 'life-world-system',
      title: 'Life-World-System',
      parent: 'civilisation-design',
      html: '<p>A <em>life-world-system</em> is the aim of <a href="#civilisation-design">civilisation design</a>: a civilisation that is viable at every level – for life (the biosphere), for the world of human meaning and experience (the life-world), and for the structures that coordinate society as a whole (the system). The term draws on Jürgen Habermas’s distinction between the lifeworld and the system of money and administrative power, which in the present civilisation colonises it; in a life-world-system the two are integrated rather than in conflict. Viable in Stafford Beer’s sense – able to maintain its identity while adapting to a changing environment – it is compatible with 21st century technology without depending on the dynamics that generate the <a href="#metacrisis">metacrisis</a>.</p>'
    },
    {
      id: 'polycrisis',
      title: 'Polycrisis',
      parent: 'metacrisis',
      html: '<p>A <em>polycrisis</em> is a condition in which multiple crises – ecological, economic, geopolitical, technological – interact so that their combined effect is greater than the sum of their parts. The term was introduced by Edgar Morin and Anne Brigitte Kern in <em>Homeland Earth</em> (1993) and popularised by the historian Adam Tooze in the early 2020s. Where the polycrisis describes how crises entangle and cascade, the <a href="#metacrisis">metacrisis</a> asks why they arise together at all: the polycrisis is the surface pattern, the metacrisis its underlying cause.</p>'
    },
    {
      id: 'generator-functions',
      title: 'Generator Functions',
      parent: 'metacrisis',
      html: '<p><em>Generator functions</em> are the underlying dynamics that continuously produce the symptoms of the <a href="#metacrisis">metacrisis</a>. In Daniel Schmachtenberger’s account there are two: rivalrous, win–lose dynamics (see <a href="#multipolar-trap">multipolar trap</a>) multiplied by exponential technology; and the substitution of complicated, extractive systems for the complex, self-organising systems – ecological and social – on which civilisation depends. Because the generators remain in place, solving any one problem tends to displace harm elsewhere; a sufficient response must change the generators themselves, which is the task of <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'epistemic-crisis',
      title: 'Epistemic Crisis',
      parent: 'metacrisis',
      html: '<p>The <em>epistemic crisis</em> is the breakdown of a society’s capacity to make sense of the world together: to establish shared facts, reason through disagreement, and arrive at collective choices. It is driven by an information ecology optimised for attention rather than understanding, by the weaponisation of information in rivalrous competition, and by the sheer complexity of the problems to be understood. Civilisation Theory treats the epistemic crisis as recursive within the <a href="#metacrisis">metacrisis</a> – a civilisation cannot adapt to a crisis it cannot perceive – which is why a <a href="#conceptual-adaptive-system">conceptual adaptive system</a> is its first step.</p>'
    },
    {
      id: 'dominant-paradigm',
      title: 'Dominant Paradigm',
      parent: 'metacrisis',
      html: '<p>The <em>dominant paradigm</em> is the set of shared assumptions – about value, progress, nature, the self and the good life – out of which a civilisation’s institutions arise, and which usually goes unexamined because it is taken as reality itself. The term draws on Thomas Kuhn’s account of paradigms in <em>The Structure of Scientific Revolutions</em> (1962), while Donella Meadows (1999) identified the paradigm as one of the highest leverage points for changing any system. For Civilisation Theory, the dominant paradigm of growth, competition and extraction is one of the three origins of the <a href="#metacrisis">metacrisis</a>, alongside civilisation’s developmental process and initial conditions.</p>'
    },
    {
      id: 'political-economy',
      title: 'Political Economy',
      parent: 'civilisation-design',
      html: '<p><em>Political economy</em> is the structure of a civilisation: the institutions that govern how resources are owned, produced, allocated and exchanged, and how collective decisions are made about them. In the three-layer model that Civilisation Theory shares with Marvin Harris’s cultural materialism, political economy (structure) sits between technology (<a href="#technological-infrastructure">infrastructure</a>) and <a href="#cultural-psychology">cultural psychology</a> (superstructure). Because it sets the incentives every actor responds to, it is where <a href="#generator-functions">generator functions</a> such as the <a href="#multipolar-trap">multipolar trap</a> are either reproduced or dissolved, and so a central object of <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'cultural-psychology',
      title: 'Cultural Psychology',
      parent: 'civilisation-design',
      html: '<p><em>Cultural psychology</em> is the superstructure of a civilisation: its shared values, narratives, identities, forms of meaning and modes of sensemaking, as they are lived by the people within it. It shapes what a society is able to want and to imagine, and is in turn shaped by the <a href="#political-economy">political economy</a> and <a href="#technological-infrastructure">technology</a> it lives within. Civilisation Theory holds that no new structure is stable without a cultural psychology compatible with it – a new economy run by people formed by the old one tends to recreate the old one – so <a href="#civilisation-design">civilisation design</a> must address inner as well as outer conditions.</p>'
    },
    {
      id: 'technological-infrastructure',
      title: 'Technological Infrastructure',
      parent: 'civilisation-design',
      html: '<p><em>Technological infrastructure</em> is the material base of a civilisation: its tools, energy systems, production, communication and computation. In the three-layer model of Civilisation Theory it is the infrastructure on which <a href="#political-economy">political economy</a> (structure) and <a href="#cultural-psychology">cultural psychology</a> (superstructure) rest. The defining feature of the 21st century is that this layer is changing exponentially – through AI, biotechnology and automation – while the other two remain largely inherited from earlier eras. The resulting mismatch is a source of <a href="#existential-risk">existential risk</a>, and the requirement that any design be compatible with 21st century technology is central to <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'civilisation-transition',
      title: 'Civilisation Transition',
      parent: 'civilisation-design',
      html: '<p><em>Civilisation transition</em> is the process of moving from the present civilisation to a designed one: the path, rather than the destination, of <a href="#civilisation-design">civilisation design</a>. A viable transition must remain functional at every stage, keeping people fed, housed and governed while the underlying structures change, and must avoid both failure modes of <a href="#existential-risk">existential risk</a> along the way – collapse into destruction, or capture by concentrated power. For this reason Civilisation Theory treats transition as a design problem in its own right, rather than something that follows automatically from a good blueprint.</p>'
    },
    {
      id: 'systems-theory',
      title: 'Systems Theory',
      parent: 'civilisation-theory',
      html: '<p><em>Systems theory</em> is the study of wholes – how interacting parts give rise to behaviour that none of them has alone. Developed through Ludwig von Bertalanffy’s general system theory, Norbert Wiener’s cybernetics (1948) and later work such as Donella Meadows’s <em>Thinking in Systems</em> (2008), it is concerned with feedback loops, stocks and flows, emergence, self-organisation and resilience. It is one of the four core forms of theory unified in Civilisation Theory, supplying the view of civilisation as a single complex adaptive system whose crises are properties of its structure rather than isolated failures.</p>'
    },
    {
      id: 'viable-system-model',
      title: 'Viable System Model',
      parent: 'systems-theory',
      html: '<p>The <em>viable system model</em> is Stafford Beer’s cybernetic model of any system able to maintain its identity and survive in a changing environment. Set out in <em>Brain of the Firm</em> (1972), it describes five interacting functions – operations, coordination, control, intelligence and policy – repeated recursively at every scale, so that each viable system contains and is contained by others. Beer applied it to national economic management in Chile’s Project Cybersyn (1971–73). Within Civilisation Theory it offers a working definition of viability, and a model for the <a href="#life-world-system">life-world-system</a>.</p>'
    },
    {
      id: 'evolutionary-theory',
      title: 'Evolutionary Theory',
      parent: 'civilisation-theory',
      html: '<p><em>Evolutionary theory</em> explains how complex forms arise through variation, selection and inheritance, without any designer. Beginning with Charles Darwin’s <em>On the Origin of Species</em> (1859), it has since been extended from genes to cultures, technologies and institutions. It is one of the four core forms of theory unified in Civilisation Theory, which draws on it to understand civilisation’s developmental process: the selection pressures that have favoured some social forms over others, and why those that win in competition – as in the <a href="#multipolar-trap">multipolar trap</a> – are not necessarily those that are good for their members or can endure.</p>'
    },
    {
      id: 'critical-theory',
      title: 'Critical Theory',
      parent: 'civilisation-theory',
      html: '<p><em>Critical theory</em> is the tradition of social theory that examines society in order to change it, exposing the forms of power and ideology that present particular arrangements as natural or inevitable. Originating with the Frankfurt School – Max Horkheimer’s essay “Traditional and Critical Theory” (1937), Theodor Adorno, Herbert Marcuse and later Jürgen Habermas – it is one of the four core forms of theory unified in Civilisation Theory. It supplies the critique of the <a href="#dominant-paradigm">dominant paradigm</a>, and the insistence that a response to the <a href="#metacrisis">metacrisis</a> must be emancipatory, avoiding dystopia as well as destruction.</p>'
    },
    {
      id: 'game-theory',
      title: 'Game Theory',
      parent: 'civilisation-theory',
      html: '<p><em>Game theory</em> is the formal study of strategic interaction: how the outcome for each actor depends on the choices of all the others. Founded by John von Neumann and Oskar Morgenstern in <em>Theory of Games and Economic Behavior</em> (1944) and extended by John Nash’s concept of equilibrium (1950), it distinguishes zero-sum from positive-sum games and shows how individually rational choices can produce collectively irrational outcomes. It is one of the four core forms of theory unified in Civilisation Theory, providing the analysis of the <a href="#multipolar-trap">multipolar trap</a> and of the coordination that <a href="#civilisation-design">civilisation design</a> must make possible.</p>'
    },
    {
      id: 'metamodernism',
      title: 'Metamodernism',
      parent: 'civilisation-theory',
      html: '<p><em>Metamodernism</em> is a cultural and philosophical sensibility that moves beyond postmodernism without returning to modernism: it holds the modern capacity for sincerity, hope and grand projects together with the postmodern awareness of irony, context and multiple perspectives. The term was introduced by Timotheus Vermeulen and Robin van den Akker (2010), and developed politically by Hanzi Freinacht in <em>The Listening Society</em> (2017). As part of the Meta-space from which Civilisation Theory draws, metamodernism offers a stance for a project of <a href="#civilisation-design">civilisation design</a>: sincere in its aims, yet aware of its own limits.</p>'
    },
    {
      id: 'conceptual-adaptive-system',
      title: 'Conceptual Adaptive System',
      parent: 'civilisation-theory',
      html: '<p>A <em>conceptual adaptive system</em> is a body of concepts designed to evolve in response to what it helps to understand, as a complex adaptive system evolves in response to its environment. It rests on the insight, going back to Alfred Korzybski’s “a map is not the territory” (1933), that the concepts through which we see the world shape which problems we can perceive and which solutions we can imagine. The Civilisation Theory Map is itself a conceptual adaptive system: a response to the <a href="#epistemic-crisis">epistemic crisis</a>, on the premise that for civilisation to adapt, its concepts must adapt first.</p>'
    }
  ];

  var byId = {};
  CONCEPTS.forEach(function (c) { byId[c.id] = c; });
  var ROOT = CONCEPTS.filter(function (c) { return !c.parent; })[0];

  // Site pages: routed like concepts, but not part of the tree, index or concept count.
  var PAGES = {
    'the-map': { id: 'the-map', title: 'The Map', parent: ROOT.id, html: MAP_INTRO + '\n<!--INDEX-->' }
  };

  function childrenOf(id) {
    return CONCEPTS.filter(function (c) { return c.parent === id; })
      .sort(function (a, b) { return a.title.localeCompare(b.title); });
  }
  function pathTo(c) {
    var path = [];
    while (c) { path.unshift(c); c = c.parent ? byId[c.parent] : null; }
    return path;
  }
  function esc(s) {
    return s.replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }
  function href(c) { return c === ROOT ? '#' : '#' + c.id; }

  // ---------- Sidebar tree ----------
  function buildTree(c) {
    var kids = childrenOf(c.id);
    var html = '<li><a href="' + href(c) + '" data-id="' + c.id + '">' + esc(c.title) + '</a>';
    if (kids.length) html += '<ul>' + kids.map(buildTree).join('') + '</ul>';
    return html + '</li>';
  }
  var treeEl = document.getElementById('tree');
  var mapLink = document.querySelector('.side-title a');
  treeEl.innerHTML = buildTree(ROOT) +
    (CONCEPTS.length === 1 ? '<li class="empty">Concepts forthcoming.</li>' : '');

  // ---------- Entry rendering ----------
  function indexHtml() {
    var concepts = CONCEPTS.filter(function (c) { return c !== ROOT; })
      .sort(function (a, b) { return a.title.localeCompare(b.title); });
    var list = concepts.length
      ? '<ul class="index-list">' + concepts.map(function (c) {
          return '<li><a href="' + href(c) + '">' + esc(c.title) + '</a></li>';
        }).join('') + '</ul>'
      : '';
    return '<p class="count">Concept Count: ' + concepts.length + '</p>' + list;
  }

  function render() {
    var id = decodeURIComponent(location.hash.replace(/^#/, ''));
    var c = byId[id] || PAGES[id] || ROOT;
    var crumbs = pathTo(c).map(function (p, i, arr) {
      return i === arr.length - 1
        ? '<span>' + esc(p.title) + '</span>'
        : '<a href="' + href(p) + '">' + esc(p.title) + '</a>';
    }).join('<span class="sep">&gt;</span>');

    document.getElementById('entry').innerHTML =
      '<p class="tree-string">' + crumbs + '</p>' +
      '<h1>' + esc(c.title) + '</h1>' +
      '<div class="description">' + c.html.replace('<!--INDEX-->', indexHtml()) + '</div>';

    buildToc();
    document.title = c === ROOT ? 'Civilisation Theory Map' : c.title + ' · Civilisation Theory Map';
    if (c.id === 'the-map') mapLink.setAttribute('aria-current', 'page');
    else mapLink.removeAttribute('aria-current');
    treeEl.querySelectorAll('a').forEach(function (a) {
      if (a.getAttribute('data-id') === c.id) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    if (window.matchMedia('(max-width: 899px)').matches) setSidebar(false, false);
    window.scrollTo(0, 0);
    onScroll();
  }
  window.addEventListener('hashchange', render);

  // ---------- Contents ----------
  var tocEl = document.getElementById('toc');
  var tocHeads = [];
  function slug(s) {
    return 'h-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }
  function buildToc() {
    tocHeads = Array.prototype.slice.call(document.querySelectorAll('#entry h1, #entry h2'));
    tocHeads.forEach(function (h) { h.id = slug(h.textContent); });
    // The concept heading titles the contents; its subheadings are listed beneath.
    var head = tocHeads[0];
    // An entry without subheadings has nothing to navigate, so no contents.
    tocEl.hidden = tocHeads.length < 2;
    tocEl.innerHTML = '<a href="#" class="toc-title" data-target="' + head.id + '">' + esc(head.textContent) + '</a><ul>' +
      tocHeads.slice(1).map(function (h) {
        return '<li><a href="#" data-target="' + h.id + '">' + esc(h.textContent) + '</a></li>';
      }).join('') + '</ul>';
  }
  // Contents links scroll within the page without touching the concept route in the URL hash.
  tocEl.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-target]');
    if (!a) return;
    e.preventDefault();
    document.getElementById(a.getAttribute('data-target')).scrollIntoView({ behavior: 'smooth' });
  });

  // ---------- Scroll: progress bar, back-to-top, active contents entry ----------
  var progressEl = document.getElementById('progress');
  var topBtn = document.getElementById('to-top');
  function onScroll() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var y = window.scrollY;
    progressEl.style.transform = 'scaleY(' + (max > 0 ? Math.min(1, y / max) : 0) + ')';
    topBtn.classList.toggle('visible', y > 300);
    var current = tocHeads[0];
    tocHeads.forEach(function (h) { if (h.getBoundingClientRect().top < window.innerHeight * 0.3) current = h; });
    if (max > 0 && y >= max - 2) current = tocHeads[tocHeads.length - 1];
    tocEl.querySelectorAll('a').forEach(function (a) {
      a.classList.toggle('active', !!current && a.getAttribute('data-target') === current.id);
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  topBtn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // ---------- Sidebar toggle ----------
  var sideBtn = document.getElementById('sidebar-toggle');
  function setSidebar(open, remember) {
    document.body.classList.toggle('sidebar-closed', !open);
    sideBtn.setAttribute('aria-label', open ? 'Hide concept map' : 'Show concept map');
    sideBtn.setAttribute('aria-expanded', String(open));
    if (remember) { try { localStorage.setItem('ct-sidebar', open ? 'open' : 'closed'); } catch (e) {} }
  }
  sideBtn.addEventListener('click', function () {
    setSidebar(document.body.classList.contains('sidebar-closed'), true);
  });
  document.getElementById('scrim').addEventListener('click', function () { setSidebar(false, false); });

  var savedSide = null;
  try { savedSide = localStorage.getItem('ct-sidebar'); } catch (e) {}
  var narrow = window.matchMedia('(max-width: 899px)').matches;
  setSidebar(narrow ? false : savedSide !== 'closed', false);

  // ---------- Theme toggle ----------
  document.getElementById('theme-toggle').addEventListener('click', function () {
    // Cycle: white → black → sepia → blue
    var order = ['light', 'dark', 'sepia', 'midnight'];
    var next = order[(order.indexOf(document.documentElement.getAttribute('data-theme')) + 1) % order.length];
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ct-theme', next); } catch (e) {}
  });

  // ---------- Keyboard shortcuts: Backspace = top, Space = map, T = theme ----------
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var el = e.target;
    if (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    if (e.key === 'Backspace') {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (!e.repeat) sideBtn.click();
    } else if ((e.key === 't' || e.key === 'T') && !e.repeat) {
      document.getElementById('theme-toggle').click();
    }
  });

  // Every load or refresh opens the homepage: drop any concept slug left in the URL.
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  render();

  // ---------- Loading screen: type the title, then fade out (any key or click skips) ----------
  (function () {
    var loader = document.getElementById('loader');
    var out = document.getElementById('loader-text');
    var title = 'Civilisation Theory';
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finished = false, timer;
    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      out.textContent = title;
      loader.classList.add('done');
      document.removeEventListener('keydown', skip, true);
      document.removeEventListener('pointerdown', skip, true);
    }
    function skip(e) { e.preventDefault(); e.stopPropagation(); finish(); }
    document.addEventListener('keydown', skip, true);
    document.addEventListener('pointerdown', skip, true);

    function type(i) {
      out.textContent = title.slice(0, i);
      if (i < title.length) { timer = setTimeout(function () { type(i + 1); }, 75); return; }
      timer = setTimeout(finish, 700);
    }
    // Wait for ET Bembo so the title doesn't reflow mid-animation (capped so a slow font never blocks).
    var fontsReady = document.fonts && document.fonts.load ? document.fonts.load('700 1em "ET Bembo"') : Promise.resolve();
    Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () {
      if (finished) return;
      if (reduce) { out.textContent = title; timer = setTimeout(finish, 600); return; }
      timer = setTimeout(function () { type(1); }, 250);
    });
  })();
</script>
</body>
</html>
