      title: 'Prometheanism',
      refs: ['Ray Brassier, “Prometheanism and its Critics”, in Robin Mackay and Armen Avanessian (eds.), <em>#Accelerate: The Accelerationist Reader</em> (2014).'],
      html: '<p><em>Prometheanism</em> is the affirmation of humanity’s capacity to understand and remake the world – including itself – through reason, science and technology, against the view that there are natural or sacred limits that human beings should not transgress. In contemporary theory it is associated above all with <a href="#left-accelerationism-and-the-red-stack">left accelerationism</a>: Ray Brassier’s “Prometheanism and its Critics” (2014) defended it against critics from Heidegger to the ecological movement who see in technological mastery the source of modernity’s ills, arguing that the problem is not the project of remaking the world but who controls it and to what ends. Its critics reply that the promise of total mastery is what has brought civilisation to the edge of catastrophe.</p><h2>Prometheus</h2><p><em>Prometheus</em>, the Titan who stole fire from the gods for humanity, stands for technological ambition and the human capacity to remake the world – and for its risks. In debates about the future, a Promethean stance affirms reason, technology and human agency against both fatalism and the view that humanity should retreat from transforming nature.</p>'
    },
    {
      id: 'moral-circle-expansion',
      title: 'Moral Circle Expansion',
      ref: 'Singer (The Expanding Circle)',
      html: '<p><em>Moral circle expansion</em> is the historical and ethical process by which the range of beings granted moral consideration widens – from kin and tribe to all humans, animals and potentially future or digital minds. Peter Singer’s <em>The Expanding Circle</em> (1981) traced its logic. Expanding the circle further is often seen as crucial to how the long-term future goes.</p>'
    },
    {
      id: 'existential-hope',
      title: 'Existential Hope',
      ref: 'Cotton-Barratt & Ord',
      html: '<p><em>Existential hope</em> is the counterpart to existential risk: the possibility of events that dramatically improve humanity’s long-term prospects. The term was introduced by Owen Cotton-Barratt and Toby Ord (2015). It turns attention from avoiding catastrophe to envisioning and pursuing the best achievable futures.</p>'
    },
    {
      id: 'utopia-unified-theory',
      title: 'UTOPIA: Unified Theory of the Principles of Intelligence & Alignment',
      coined: true,
      html: '<p><em>UTOPIA</em> – a Unified Theory of the Principles of Intelligence and Alignment – names the aspiration to a single framework explaining what intelligence is, human and artificial, and what it means for intelligent systems to be aligned with one another and with what is good. The acronym signals that the good society and the aligned mind may be two faces of the same problem.</p>'
    },
    {
      id: 'human-inner-alignment-problem',
      title: 'The Human Inner Alignment Problem',
      coined: true,
      html: '<p>The <em>human inner alignment problem</em> applies the language of AI alignment to people: just as an AI trained for one goal may develop different internal objectives, human beings shaped by evolution and culture pursue drives – status, comfort, short-term reward – that diverge from their considered values and collective wellbeing. Solving it concerns psychology, culture and education as much as policy.</p>'
    },
    {
      id: 'viatopia',
      title: 'Viatopia',
      html: '<p><em>Viatopia</em> is a destination-agnostic alternative to utopia: rather than a blueprint for a perfect end-state, it describes a state from which civilisation is well placed to keep improving – able to reflect, deliberate and correct its course. It prioritises preserving options and good processes over committing prematurely to any single vision of the good.</p>'
    },
    {
      id: 'cosmic-veil-and-stratified-utopia',
      title: 'The Cosmic Veil of Ignorance & Stratified Utopia',
      coined: true,
      ref: 'Nora, Carlo',
      html: '<p>The <em>cosmic veil of ignorance</em> extends John Rawls’s thought experiment – choosing principles of justice without knowing one’s place in society – to the scale of the cosmos and the long-term future, including future and non-human minds. <em>Stratified utopia</em> describes a future composed of multiple layers or regions, each realising different visions of the good.</p>'
    },
    {
      id: 'pragmatic-utopianism',
      title: 'Pragmatic Utopianism',
      html: '<p><em>Pragmatic utopianism</em> combines the ambition of utopian thinking with a commitment to feasible steps and testable experiments. It holds that radically better societies are worth aiming for, but that they are built incrementally, through institutions and practices that work in the present and can be improved over time.</p>'
    },
    {
      id: 'second-enlightenment',
      title: 'Second Enlightenment',
      ref: 'MacAskill, Pinker',
      html: '<p>A <em>second enlightenment</em> would renew the Enlightenment’s commitments – reason, science, humanism and progress – for the challenges of the twenty-first century, correcting its blind spots in light of ecological limits, complexity and the risks of powerful technology. It envisions a new flowering of collective reasoning and moral progress adequate to a civilisation-scale transition.</p>'
    },
    {
      id: 'the-novacene',
      title: 'The Novacene',
      ref: 'Lovelock',
      html: '<p>The <em>Novacene</em> is James Lovelock’s term, from <em>Novacene</em> (2019), for a coming age succeeding the Anthropocene, in which hyper-intelligent artificial beings emerge as the dominant form of intelligence on Earth. Lovelock suggested such beings might have an interest in preserving a habitable planet, and so in cooperating with the Gaian system of which humans are part.</p>'
    },
    {
      id: 'the-culture',
      title: 'The Culture',
      ref: 'Banks',
      html: '<p><em>The Culture</em> is the post-scarcity, galaxy-spanning civilisation of Iain M. Banks’s novels (1987–2012), in which humans live freely alongside benevolent artificial Minds that manage the society. Anarchic, abundant and secular, it remains one of the most influential imagined pictures of a good future with superintelligent machines.</p><h2>Post-scarcity Space-Utopia</h2><p>The Culture is the best-known picture of a post-scarcity space-utopia: a civilisation so technologically advanced that material want has disappeared, money does not exist, and every member can live as they choose, while vast artificial Minds run its ships and habitats with benevolent care. It answers the question of what a good future with superintelligence might look like – abundance, freedom, pleasure and play – and raises the questions that remain once scarcity is gone: what gives life meaning when nothing needs to be done, and what becomes of human agency when the Minds could do everything better. See <a href="#post-scarcity">post-scarcity economics</a> and <a href="#solved-world">solved world</a>.</p>'
    },
    {
      id: 'metamathics',
      title: 'Metamathics',
      ref: 'Banks',
      html: '<p><em>Metamathics</em>, in Iain M. Banks’s Culture novels, is the exploration by the Culture’s artificial Minds of the mathematics of alternative, hypothetical universes – a pursuit so absorbing that some Minds prefer it to engaging with reality. It is Banks’s image of what a superintelligence might find meaningful once every practical problem is solved.</p>'
    },

    {
      id: 'effective-altruism',
      title: 'Effective Altruism',
      html: '<p><em>Effective altruism</em> is a movement and philosophy that uses evidence and reason to identify the most effective ways to benefit others, and acts on them. It has directed resources to global health, animal welfare and the reduction of existential risk, and has attracted both wide influence and significant criticism.</p>'
    },
    {
      id: 'integral-altruism',
      title: 'Integral Altruism',
      html: '<p><em>Integral altruism</em> seeks to combine the rigour of effective altruism with a more holistic view of human development – attending to inner transformation, culture and systems as well as measurable outcomes. It aims to integrate doing good effectively with becoming the kind of people and societies that can sustain such good.</p>'
    },
    {
      id: 'religion-that-is-not-a-religion',
      title: 'The Religion that is not a Religion',
      ref: 'Vervaeke',
      html: '<p>The <em>religion that is not a religion</em> is John Vervaeke’s phrase for a response to the meaning crisis: an ecology of practices that cultivates wisdom, meaning and self-transcendence, as religions have done, without requiring belief in supernatural doctrines. It aims to recover the functions of religion within a secular, scientific worldview.</p>'
    },
    {
      id: 'syntheism',
      title: 'Syntheism',
      ref: 'Bard & Söderqvist',
      html: '<p><em>Syntheism</em> is a religious movement and philosophy introduced by Alexander Bard and Jan Söderqvist in <em>Syntheism: Creating God in the Internet Age</em> (2014). It holds that God is not a pre-existing being but something created by humanity through collective, participatory practices – a response to the spiritual needs of a networked society.</p>'
    },
    {
      id: 'new-atheism',
      title: 'New Atheism',
      html: '<p><em>New Atheism</em> was an early twenty-first-century intellectual movement, associated with Richard Dawkins, Sam Harris, Daniel Dennett and Christopher Hitchens, which argued that religion should be openly criticised and countered by rational argument and science. Its confidence in reason as a replacement for religion has since been questioned in light of the meaning crisis.</p>'
    },
    {
      id: 'post-theism',
      title: 'Post-Theism',
      html: '<p><em>Post-theism</em> describes a stance beyond both theism and atheism: rather than affirming or denying God, it holds that the question has been superseded, and turns to what can replace the social and existential functions that belief in God once served – meaning, community, moral orientation and a relation to the sacred.</p>'
    },
    {
      id: 'biowisdom',
      title: 'Biowisdom',
      coined: true,
      ref: 'Derived from Foucault (biopower); the wisdom gap; in the form of Fuller (weaponry/livingry) and Galtung (structural violence/peace)',
      refs: ['Michel Foucault, <em>The History of Sexuality, Volume 1: The Will to Knowledge</em> (1976).', 'R. Buckminster Fuller, <em>Critical Path</em> (1981).', 'Johan Galtung, “Violence, Peace, and Peace Research”, <em>Journal of Peace Research</em> 6 (1969).'],
      html: '<p><em>Biowisdom</em> is derived from Michel Foucault’s <em>biopower</em> – the modern form of power that takes life itself as its object, managing the bodies, health, reproduction and mortality of whole populations. Where biopower is the capacity to govern life, biowisdom is the wisdom to serve it: knowledge of living systems, beginning with the human body, put to work for the flourishing of the lives it touches rather than for their control, productivity or extraction.</p><p>It is a response to <a href="#the-wisdom-gap">the wisdom gap</a> as it opens in the domain of life, where the power to shape bodies, minds and populations – through medicine, food systems, pharmacology, biotechnology and the built environment – grows faster than the wisdom to use it well. In form it pairs with biopower as Buckminster Fuller’s <a href="#livingry">livingry</a> pairs with weaponry, and as Johan Galtung’s structural peace pairs with <a href="#structural-violence">structural violence</a>: the same capacities, turned from domination towards care. As a design principle for the <a href="#biostructure">biostructure</a>, it asks for a civilisation whose physiological conditions – nutrition, rest, environment, health – support rather than degrade the capacities on which judgement and cooperation depend.</p>'
    },
    {
      id: 'the-moral-landscape',
      title: 'The Moral Landscape',
      refs: ['Sam Harris, <em>The Moral Landscape: How Science Can Determine Human Values</em> (2010).'],
      html: '<p><em>The Moral Landscape</em> is Sam Harris’s argument, in <em>The Moral Landscape: How Science Can Determine Human Values</em> (2010), that questions of right and wrong have objectively better and worse answers, because they are ultimately questions about the wellbeing of conscious creatures – and wellbeing depends on facts about the world and the brain that science can, in principle, investigate. Harris pictures the space of possible ways of living as a landscape whose peaks are the states of greatest flourishing and whose valleys are the states of deepest suffering; there may be many peaks, so that different societies can flourish in different ways, but some ways of life are clearly lower than others, and moral progress is movement towards the heights. The book challenged the view that science must be silent on values, and was criticised by philosophers for passing too quickly over the is–ought problem and the definition of wellbeing. See <a href="#science-of-morality">science of morality</a>.</p>'
    },
    {
      id: 'science-of-morality',
      title: 'Science of Morality',
      ref: 'Harris',
      html: '<p>A <em>science of morality</em> is the proposal, advanced by Sam Harris in <em>The Moral Landscape</em> (2010), that moral questions have objectively better and worse answers, grounded in facts about the wellbeing of conscious creatures, and can in principle be investigated scientifically. It challenges the view that facts and values belong to separate domains.</p>'
    },
    {
      id: 'technology-of-behaviour',
      title: 'Technology of Behaviour',
      ref: 'Skinner',
      html: '<p>A <em>technology of behaviour</em> is B. F. Skinner’s proposal, in <em>Beyond Freedom and Dignity</em> (1971), for the deliberate design of environments and incentives to shape human behaviour for collective benefit. It raises the enduring question of who designs such environments, towards what ends, and how such power could be kept accountable.</p>'
    },
    {
      id: 'gaia',
      title: 'The Gaia Hypothesis',
      ref: 'Lovelock',
      html: '<p><em>Gaia</em> is James Lovelock’s hypothesis, developed with Lynn Margulis in the 1970s, that the Earth’s living organisms and their environment form a self-regulating system that maintains conditions suitable for life. Beyond its scientific influence on Earth system science, it has become a powerful image of the planet as a living whole.</p>'
    },
    {
      id: 'the-glass-bead-game',
      title: 'The Glass Bead Game',
      ref: 'Hesse',
      html: '<p><em>The Glass Bead Game</em> (1943) is Hermann Hesse’s novel of a future intellectual order devoted to a game that synthesises all knowledge – music, mathematics, philosophy – into a single language of connections. It is an image of integrated understanding, and a warning about intellectual life detached from the world.</p><h2>Interdisciplinary Synthesis</h2><p>Hesse’s game is an image of interdisciplinary synthesis: a single language in which the patterns of music, mathematics, philosophy and every other discipline can be expressed and connected, so that knowledge becomes one whole rather than many separate fields. It anticipates the aspiration of <a href="#metatheory">metatheory</a> and of maps like this one – to integrate what the disciplines know into a coherent understanding. The novel’s hero, Joseph Knecht, finally leaves the order, judging that a synthesis cut off from the life and suffering of the world has become sterile; the lesson is that integration must serve action in the world, not replace it.</p>'
    },
    {
      id: 'complex-world-system-dynamics',
      title: 'Complex World-System Dynamics',
      order: 2,
      html: '<p>The emergent behaviour of the world-system as a whole: how markets, states, technologies and institutions interact to produce outcomes – disorder, securitisation, runaway optimisation, new forms of totalitarianism – that no single actor designs or controls.</p>'
    },
    {
      id: 'ai-alignment',
      title: 'AI Alignment',
      order: 4,
      html: '<p>The problem of ensuring that artificial intelligence, and the wider systems it becomes part of, pursue ends compatible with human and planetary flourishing – and what the framing of alignment reveals about intelligence itself.</p>'
    },
    {
      id: 'replicators',
      title: 'Replicators',
      order: 1500,
      html: '<p>Frameworks for understanding self-propagating systems – genes, memes, institutions, machines – and the philosophical frames and paradigms needed to think about agency, intelligence and alignment across all of them.</p>'
    },
    {
      id: 'moral-theory',
      title: 'Moral Theory',
      order: 6,
      html: '<p>Moral questions raised by civilisation-scale power and long-run futures: the ethics of automated violence, of cosmic stakes and plural values, of consciousness and moral status, and of how societies know what they ought to do.</p>'
    },
    {
      id: 'twin-nuclei-problem',
      title: 'The Twin Nuclei Problem',
      ref: 'Eric Weinstein',
      html: '<p>The <em>twin nuclei problem</em> is Eric Weinstein’s name for the two thresholds humanity crossed in the twentieth century when it learned to reach into the two nuclei at the base of matter and of life: the nucleus of the atom, opened by nuclear fission, and the nucleus of the cell, opened by the discovery and engineering of DNA. Each confers a power once reserved for nature – to release the energy that binds matter, and to rewrite the code that builds organisms – and each carries the potential for catastrophe at the scale of the species.</p><p>The problem is that this power arrived long before the wisdom and institutions needed to govern it, making the pair an early and defining instance of the <a href="#the-wisdom-gap">wisdom gap</a>.</p>'
    },
    {
      id: 'critical-collapsology',
      title: 'Critical Collapsology',
      ref: 'Hames; Servigne & Stevens',
      html: '<p><em>Critical collapsology</em> builds on “collapsology”, the interdisciplinary study of the collapse of industrial civilisation popularised by Pablo Servigne and Raphaël Stevens (2015). Its critical form examines not only whether and how collapse might happen, but whose collapse is imagined, which narratives of collapse serve which interests, and how the study of collapse can inform transition rather than resignation.</p><p>Richard Hames has developed it into a distinct paradigm: traditional collapsology, he argues, lacks a political concept of collapse, an account of what holds societies together, and a grasp of how capitalism thrives on crisis – and is blind to <a href="#applied-collapsology">applied collapsology</a>, the deliberate destruction of societies as a means of rule.</p>'
    },
    {
      id: 'goliaths-curse',
      title: 'Goliath’s Curse',
      ref: 'Kemp',
      html: '<p><em>Goliath’s Curse</em> (2025) is Luke Kemp’s history of societal collapse, which describes dominance hierarchies as “Goliaths” – states and empires built on the concentration of wealth and power. Kemp argues that the same inequality and extraction that make such societies powerful also make them fragile, and that today’s global Goliath faces the same curse at planetary scale.</p>'
    },    {
      id: 'goliath-traps',
      title: 'Goliath Traps',
      refs: ['Luke Kemp, <em>Goliath’s Curse: The History and Future of Societal Collapse</em> (2025).'],
      html: '<p><em>Goliath traps</em> are the conditions in which societies become locked into the dominance hierarchies that Luke Kemp, in <em>Goliath’s Curse</em> (2025), calls “Goliaths”. Once wealth, weapons and land can be concentrated and controlled by a few, competition between and within societies rewards those who concentrate them further, and it becomes hard for any group to step out of the hierarchy without being dominated by those who do not – so that the very structures that will later make a society fragile become self-reinforcing. See <a href="#goliaths-curse">Goliath’s curse</a> and <a href="#multipolar-trap">multipolar trap</a>.</p>'
    },
    {
      id: 'tree-of-doom',
      title: 'Tree of Doom',
      refs: ['Luke Kemp, <em>Goliath’s Curse: The History and Future of Societal Collapse</em> (2025).'],
      html: '<p>The <em>tree of doom</em> is an image for the causal structure of collapse in the account of <a href="#goliaths-curse">Goliath’s curse</a>: its roots in the concentration of wealth and power, its trunk in the extractive and inequality-driven dynamics of dominance hierarchies, and its branches in the many proximate triggers – war, famine, epidemic, ecological breakdown, political crisis – through which a fragile society finally falls. It directs attention away from the triggers historians often blame and towards the shared roots from which they grow. See <a href="#goliath-traps">Goliath traps</a>.</p>'
    },
    {
      id: 'agents-of-doom',
      title: 'Agents of Doom',
      refs: ['Luke Kemp, “Agents of Doom: Who Is Hastening the Apocalypse – and Why?”, <em>BBC Future</em> (2021).'],
      html: '<p><em>Agents of doom</em> is Luke Kemp’s term for the relatively small number of actors – among them fossil-fuel companies, arms manufacturers, frontier technology firms and the states and elites that back them – whose decisions drive most of the world’s global catastrophic risk. Kemp argues that catastrophic risk is not produced by “humanity” as a whole but by identifiable organisations pursuing profit and power, which makes it a question of accountability and governance rather than of human nature. See <a href="#goliaths-curse">Goliath’s curse</a> and <a href="#hyper-agents-of-doom">hyper-agents of doom</a>.</p>'
    },
    {
      id: 'darker-angels-of-our-nature',
      title: 'Darker Angels of Our Nature',
      refs: ['Philip Dwyer and Mark S. Micale (eds.), <em>The Darker Angels of Our Nature: Refuting the Pinker Theory of History and Violence</em> (2021).'],
      html: '<p><em>The Darker Angels of Our Nature</em> (2021), edited by the historians Philip Dwyer and Mark S. Micale, is a collective rebuttal of Steven Pinker’s <em>The Better Angels of Our Nature</em> (2011), which argued that violence has declined steadily over the course of history thanks to the rise of states, commerce and Enlightenment reason. Its contributors challenge Pinker’s use of evidence, his reading of premodern and non-Western societies, and the narrative of civilising progress itself. It belongs with <a href="#goliaths-curse">Goliath’s curse</a> in questioning whether state-based civilisation has made human life safer.</p>'
    },
    {
      id: 'the-great-divergence',
      title: 'The Great Divergence',
      refs: ['Kenneth Pomeranz, <em>The Great Divergence: China, Europe, and the Making of the Modern World Economy</em> (2000).'],
      html: '<p>The <em>Great Divergence</em> is the process by which Western Europe, and then its offshoots, pulled ahead of the other advanced civilisations of the world – above all China, India and the Islamic world – in wealth and power from the late eighteenth century. The term was popularised by Kenneth Pomeranz (2000), who argued that the most developed regions of Europe and China were broadly comparable until around 1800, and that Europe’s breakthrough owed much to the fortunes of accessible coal and the resources of its colonies. Why the divergence happened, and when, is one of the central questions of world history.</p>'
    },
    {
      id: 'the-great-convergence',
      title: 'The Great Convergence',
      refs: ['Richard Baldwin, <em>The Great Convergence: Information Technology and the New Globalization</em> (2016).'],
      html: '<p>The <em>Great Convergence</em> is the reversal of the <a href="#the-great-divergence">Great Divergence</a>: the rapid rise of a group of developing economies, led by China and India, towards the income and industrial capacity of the rich world since around 1990. Richard Baldwin (2016) traced it to the information and communication revolution, which allowed firms in rich countries to move production abroad while keeping control of it through global value chains – shifting the world’s share of manufacturing and growth back towards the regions that dominated the world economy before the industrial revolution.</p>'
    },
    {
      id: 'the-great-turning',
      title: 'The Great Turning',
      refs: ['Joanna Macy and Molly Young Brown, <em>Coming Back to Life</em> (1998).', 'David Korten, <em>The Great Turning: From Empire to Earth Community</em> (2006).'],
      html: '<p>The <em>Great Turning</em> is Joanna Macy’s name for the shift from an industrial growth society to a life-sustaining civilisation, which she sees as the essential adventure of our time. She describes it as unfolding in three mutually reinforcing dimensions: actions to slow the damage to Earth and its beings; the creation of new structures and alternatives; and a shift in consciousness and values. David Korten took up the term in <em>The Great Turning: From Empire to Earth Community</em> (2006), as the turn from five thousand years of dominator hierarchy to a partnership of peoples with one another and the living Earth.</p>'
    },

    {
      id: 'techno-capital-and-technomic',
      title: 'Techno-capital & Technomic',
      refs: ['Nick Land, “Machinic Desire” (1993), in <em>Fanged Noumena: Collected Writings 1987–2007</em> (2011).', 'Nick Land, “Teleoplexy: Notes on Acceleration” (2014), in <em>#Accelerate: The Accelerationist Reader</em>.'],
      html: '<p><em>Techno-capital</em> is Nick Land’s name for capitalism and technology understood as a single process rather than two: a self-organising, self-accelerating circuit in which capital drives technological development and technology drives the expansion of capital, each feeding the other. In Land’s account this circuit is not a tool of human purposes but an emerging agency in its own right, which uses human beings as its medium and tends towards autonomous machine intelligence. Its development is <em>technomic</em> – techno-economic, with technology and economy no longer separable – and, in “Teleoplexy” (2014), Land describes it as a runaway escalation of intelligence, measured not in calendar time but in the accumulation of technomic change. It is the strongest form of <a href="#technological-determinism">technological determinism</a>: history is driven by techno-capital, and human politics can at most accelerate or obstruct it. See <a href="#landian-accelerationism">Landian accelerationism</a>.</p>'
    },
    {
      id: 'techno-capitalist-progress-narrative',
      title: 'The Techno-Capitalist Progress Narrative',
      html: '<p>The <em>techno-capitalist progress narrative</em> is the story that technological innovation driven by markets naturally produces human progress, and that more growth and more technology are the solution to the problems they create. It functions as the unofficial creed of the present civilisation, making its trajectory seem both inevitable and benevolent.</p>'
    },
    {
      id: 'high-modern-panopticon',
      title: 'The High-Modern Panopticon',
      coined: true,
      ref: 'Scott; Bentham, Foucault',
      html: '<p>The <em>high-modern panopticon</em> joins James C. Scott’s high modernism – the drive to make society legible and redesign it from above – with the panopticon’s logic of total visibility. Digital technology makes possible a state or platform that sees everything and plans accordingly, combining the ambitions of central planning with the reach of universal surveillance.</p>'
    },
    {
      id: 'the-fourth-frontier',
      title: 'The Fourth Frontier: Engineered Stable Abundance',
      ref: 'Bret Weinstein & Heather Heying, A Hunter-Gatherer’s Guide to the 21st Century (2021)',
      refs: ['Heather Heying and Bret Weinstein, <em>A Hunter-Gatherer’s Guide to the 21st Century</em> (2021).'],
      html: '<p><em>The fourth frontier</em> is Bret Weinstein’s term, developed with Heather Heying in <em>A Hunter-Gatherer’s Guide to the 21st Century</em> (2021), for a way out of the growth trap. Historically, populations have prospered by reaching a frontier: a <a href="#first-frontier"><em>geographic</em> frontier</a> of new land, a <a href="#second-frontier"><em>technological</em> frontier</a> that lets the same land support more, or a <a href="#third-frontier"><em>transfer</em> frontier</a> of taking resources from others. Each is temporary, and the last is zero-sum.</p><p>The fourth frontier is a deliberately designed steady state that preserves the feeling of a frontier – abundance, opportunity and room to grow – without depending on endless expansion or extraction. It reframes sustainability not as sacrifice but as the engineering of a civilisation people would want to live in indefinitely, and so turns a <a href="#zero-sum-game">zero-sum</a> struggle into a positive-sum one.</p>'
    },
    {
      id: 'civilisation-x',
      title: 'Civilisation X',
      coined: true,
      html: '<p><em>Civilisation X</em> is a placeholder name for the civilisation that could succeed the present one – the unknown variable that civilisation design seeks to solve for. Leaving it unnamed resists committing prematurely to any existing ideology or blueprint, while insisting that a successor civilisation is both necessary and designable.</p>'
    },
    {
      id: 'game-b',
      title: 'Game B',
      html: '<p><em>Game B</em> is a loose community and set of ideas, associated with figures such as Jordan Hall and Jim Rutt, which contrasts “Game A” – the civilisational game of rivalrous competition for power and resources – with a hypothetical Game B: a new social operating system based on collective intelligence, cooperation and sustainability that could outcompete Game A without reproducing it.</p>'
    },

    {
      id: 'the-hinge-of-history',
      title: 'The Hinge of History',
      ref: 'Parfit; MacAskill',
      html: '<p>The <em>hinge of history</em> is the idea, expressed by Derek Parfit and examined by William MacAskill, that we may be living at an unusually influential moment, when choices made now will shape the long-run future of humanity to an exceptional degree. Whether this is true is itself contested, but the question bears directly on how present generations should act.</p>'
    },
    {
      id: 'mcluhans-aquarium',
      title: 'McLuhan’s Aquarium: The Fish in Water',
      coined: true,
      ref: 'McLuhan',
      html: '<p><em>McLuhan’s aquarium</em> draws on Marshall McLuhan’s observation that we do not know who discovered water, but we know it was not the fish. The environments we are most immersed in – media, technologies, economic systems – are the hardest to perceive. Seeing one’s own civilisation as an aquarium is a precondition for redesigning it.</p>'
    },
    {
      id: 'civilisational-sanity',
      title: 'Civilisational Sanity',
      html: '<p><em>Civilisational sanity</em> is the capacity of a civilisation to perceive reality accurately, reason about it collectively and act in its own long-term interest. By analogy with individual mental health, a civilisation can become collectively insane – pursuing self-destructive courses despite knowing better – and restoring its sanity is a precondition for any successful transition.</p>'
    },
    {
      id: 'megamechanical-turk',
      title: 'Megamechanical Turk',
      coined: true,
      ref: 'Mumford; Kempelen',
      html: '<p>The <em>megamechanical Turk</em> joins Lewis Mumford’s “megamachine” with the Mechanical Turk, the eighteenth-century chess automaton secretly operated by a hidden human. It names the vast socio-technical systems that appear automated and autonomous, but which in fact run on hidden human labour, judgement and attention distributed across the globe.</p>'
    },
    {
      id: 'mturkification',
      title: 'MTurkification',
      coined: true,
      ref: 'Amazon Mechanical Turk',
      html: '<p><em>MTurkification</em>, after Amazon’s Mechanical Turk platform, describes the breaking-down of work into small, anonymous, piece-rate tasks distributed through digital platforms – labelling data, moderating content, completing micro-jobs. It turns human workers into interchangeable components of automated systems, often invisible to the people who use their output.</p>'
    },
    {
      id: 'unaligned-artificial-artificial-superintelligence',
      title: 'Unaligned Artificial Artificial Superintelligence',
      coined: true,
      ref: 'Amazon MTurk slogan',
      html: '<p><em>Unaligned artificial artificial superintelligence</em> plays on “artificial artificial intelligence”, the slogan of Amazon’s Mechanical Turk, which used humans to perform tasks machines could not. It names collective systems of people and machines – corporations, markets, bureaucracies – that already act with superhuman capability, and are already misaligned with human wellbeing.</p>'
    },

    {
      id: 'planetary-reverse-turing-test',
      title: 'Planetary Reverse Turing Test',
      coined: true,
      ref: 'Turing; SETI',
      html: '<p>The <em>planetary reverse Turing test</em> turns the methods of the search for extraterrestrial intelligence back on our own planet. SETI looks for intelligence not by asking what other minds intend, but by reading their behaviour from the outside – their technosignatures: energy capture, the transformation of matter, the spread of infrastructure. Observed in this way, by a detached observer with no access to human intentions, the Earth of the present shows a planetary process that captures ever more energy, converts ecosystems into resources, builds self-replicating networks of machines and capital, and expands without apparent limit in pursuit of a single optimisable quantity.</p>' +
        '<p>The test is reversed in two senses. Turing asked whether a machine could pass as human; here the question is whether a human civilisation can still pass as human – or whether, from the outside, it is indistinguishable from a <a href="#artificial-superintelligence">machine superintelligence</a> pursuing an unaligned objective. On the evidence of its behaviour alone, much of the planet now fails it: the collective outcome looks less like the choices of billions of people than the optimisation process described in <a href="#capitalism-as-unaligned-asi">capitalism as unaligned ASI</a>. It makes <a href="#civilisation-alignment">civilisation alignment</a> a question about the agency civilisation actually exhibits, not the agency its members believe they have. See <a href="#complex-adaptive-agency">any sufficiently complex and adaptive system is indistinguishable from intelligent agency</a>.</p>'
    },
    {
      id: 'military-economic-maladaptation',
      title: 'Military Economic Maladaptation',
      coined: true,
      html: '<p><em>Military-economic maladaptation</em> is the flip side of military-economic adaptationism: the institutions selected for competitive success in war and trade become maladaptive once the stakes are planetary. Traits that once conferred advantage – expansion, secrecy, arms races, growth at any cost – now threaten the survival of the whole system that selected for them.</p>'
    },
    {
      id: 'negative-existential-externality',
      title: 'Negative Existential Externality',
      coined: true,
      html: '<p>A <em>negative existential externality</em> is a cost imposed on others that takes the form of existential risk: an activity profitable for those who undertake it, but which raises the probability of catastrophe for everyone. Because markets do not price such risks, they tend to be produced in excess – as by the race to deploy powerful technologies before they are safe.</p>'
    },
    {
      id: 'world-risk-factory',
      title: 'World-Risk Factory',
      coined: true,
      refs: ['Ulrich Beck, <em>World Risk Society</em> (1999).', 'Mario Tronti, “Factory and Society” (1962), in <em>Workers and Capital</em> (1966).'],
      html: '<p>The <em>world-risk factory</em> joins two ideas. From Ulrich Beck comes the <a href="#world-risk-society">world risk society</a>: a modernity whose principal dangers – nuclear, chemical, ecological, financial, technological – are <a href="#manufactured-risk">manufactured</a> by its own development, and spread across borders and generations. From the Italian workerist Mario Tronti comes the <em>social factory</em>: the argument (1962) that as capitalism develops, the relations of the factory extend beyond its walls until society as a whole becomes a factory, its time, space, relationships and reproduction organised for the production of value. Together they describe the world-system as a single planetary factory whose output is not only commodities and capital but risk – manufactured continuously, as a by-product of its ordinary operation, by the same processes that generate wealth. Risk is not an accident of this system but one of its principal products, and the whole of society, and the biosphere with it, is its shop floor. See <a href="#risk-production">risk-production</a>.</p>'
    },
    {
      id: '4e-ontology',
      title: '4E Ontology',
      coined: true,
      ref: '4E cognition',
      html: '<p><em>4E ontology</em> extends the “4E” account of cognition – that minds are embodied, embedded, enacted and extended – from the study of mind to the study of what exists. Where the 4E programme in cognitive science holds that thinking cannot be located inside a skull, 4E ontology holds that no entity of civilisational significance – an intelligence, an agent, a power, a social order – can be understood as a self-contained thing. Each is <em>embodied</em> in material forms, <em>embedded</em> in environments and institutions, <em>enacted</em> through ongoing activity, and <em>extended</em> across tools, networks and other minds.</p><p>It is the superconcept of the map’s 4E concepts, each of which applies the same four dimensions to a different object. Together they replace an ontology of isolated substances – the rogue AI, the sovereign individual, the state as a thing – with an ontology of relations and processes – closer to process philosophy and systems theory than to the common-sense picture of a world made of things. See <a href="#metaphysics">metaphysics</a>.</p>'
    },
    {
      id: '4e-agency',
      title: '4E Agency',
      coined: true,
      ref: '4E cognition',
      html: '<p><em>4E agency</em> applies the 4E account – embodied, embedded, enacted and extended – to agency: the capacity to act. It holds that agency does not belong to an isolated will, human or artificial, but is distributed across bodies, environments, practices and tools. An agent acts through its infrastructure, within institutions that shape what it can do, by way of habits and routines, and with the aid of instruments that carry part of the action.</p><p>This matters as artificial systems take on more of the work of acting in the world: the question is less whether a machine is an agent than how agency is being redistributed across the whole human–machine system, and who or what ends up steering it. See <a href="#4e-ontology">4E ontology</a> and <a href="#4e-intelligence">4E intelligence</a>.</p>'
    },
    {
      id: '4e-power',
      title: '4E Power',
      coined: true,
      ref: '4E cognition',
      html: '<p><em>4E power</em> applies the 4E account – embodied, embedded, enacted and extended – to power. Power is not a quantity held by a person or a state, but is embodied in material infrastructure and wealth, embedded in institutions and norms, enacted through the everyday practices that reproduce it, and extended through technologies that let it act at a distance and at scale.</p><p>Seen this way, the concentration of power by advanced technology is not only a matter of who owns the systems, but of how deeply power becomes built into the environment everyone else must live in – which is also why it is hard to see and hard to contest. See <a href="#4e-ontology">4E ontology</a> and power and control.</p>'
    },
    {
      id: '4e-utopia',
      title: '4E Utopia',
      coined: true,
      ref: '4E cognition',
      html: '<p><em>4E utopia</em> applies the 4E account – embodied, embedded, enacted and extended – to the idea of a good society. Rather than a blueprint of rules or an ideal set of values, a 4E utopia is a way of life embodied in its material infrastructure, embedded in its ecology and institutions, enacted in the daily practices of its members, and extended through the tools and systems that carry its intelligence.</p><p>On this view a better civilisation cannot simply be legislated or imagined into being: it has to be built into the world people inhabit and grown through the way they live. See <a href="#4e-ontology">4E ontology</a>.</p>'
    },
    {
      id: '4e-global-catastrophic-risk',
      title: '4E Risk',
      coined: true,
      ref: '4E cognition',
      html: '<p><em>4E risk</em> applies the “4E” account of cognition – embodied, embedded, enacted and extended – to catastrophic risk from AI. Rather than locating danger in a single rogue system, it looks at how AI becomes embodied in infrastructure, embedded in institutions, enacted through markets and extended across the world-system, so that risk emerges from the whole.</p>'
    },
    {
      id: 'world-command-and-control-system',
      title: 'The World Command-and-Control System',
      coined: true,
      html: '<p>The <em>world command-and-control system</em> is the planetary apparatus of surveillance, communication, finance and military power through which the world-system is monitored and steered. Increasingly automated and interlinked, it raises the questions of who, or what, is actually in command, and what happens when its components act faster than any human can oversee.</p>'
    },
    {
      id: 'world-system-securitisation',
      title: 'World-System Securitisation',
      coined: true,
      ref: 'Buzan, Wæver (securitisation)',
      html: '<p><em>World-system securitisation</em> applies securitisation theory, developed by Barry Buzan and Ole Wæver, which studies how issues are framed as existential threats to justify exceptional measures. As technology, climate, information and economics are each reframed as security issues, the world-system as a whole drifts towards a logic of emergency, secrecy and control.</p>'
    },
    {
      id: 'spontaneous-totalitarian-order',
      title: 'Spontaneous Totalitarian Order',
      coined: true,
      ref: 'Hayek (spontaneous order)',
      html: '<p><em>Spontaneous totalitarian order</em> is the possibility that total control could emerge without any dictator or plan – arising spontaneously from the interaction of surveillance, platforms, markets and security systems, each pursuing its own logic. It inverts Hayek’s hope that spontaneous order protects freedom, suggesting that decentralised processes can also converge on its opposite.</p>'
    },
    {
      id: 'stable-inverted-totalitarianism',
      title: 'Stable Inverted Totalitarianism',
      ref: 'Wolin',
      html: '<p><em>Inverted totalitarianism</em> is Sheldon Wolin’s term, from <em>Democracy Incorporated</em> (2008), for a system in which economic power dominates politics while democratic forms are retained – totalitarian in its reach, but managed rather than charismatic, and relying on apathy rather than mobilisation. Its stable form is one that has become self-perpetuating, with no crisis to disrupt it.</p>'
    },
    {
      id: 'demons-of-techno-capitalism',
      title: 'The Demons of Techno-Capitalism',
      coined: true,
      html: '<p>The <em>demons of techno-capitalism</em> are the autonomous, impersonal forces produced by the fusion of technology and capital – optimisation processes, algorithms and market dynamics that act with apparent intention, pursuing growth, engagement and profit through human beings without any human fully directing them.</p><p>The <em>demons of surveillance capitalism</em> are one species of this wider family: the automated, profit-seeking processes – recommendation engines, ad-targeting systems, engagement optimisers – that act on people continuously and invisibly. Like the demons of older cosmologies, they are unseen agents that influence desire and belief, serving ends that are not those of the people they act upon. See <a href="#surveillance-capitalism">surveillance capitalism</a>.</p>'
    },
    {
      id: 'marl-by-market-feedback',
      title: 'Multi-Agent Reinforcement Learning by Market Feedback',
      coined: true,
      html: '<p><em>Multi-agent reinforcement learning by market feedback</em> describes the market economy as a vast learning system in which many agents – firms, investors, consumers – adjust their behaviour in response to rewards and penalties signalled by prices and profits. Like any reinforcement learner, it optimises the reward it is given, not the outcomes its designers intended.</p>'
    },
    {
      id: 'evolutionary-match',
      title: 'Evolutionary Match',
      coined: true,
      html: '<p><em>Evolutionary match</em> is the counterpart of <a href="#socio-economic-evolutionary-mismatch">evolutionary mismatch</a>: the design of a civilisation’s environments, institutions and incentives so that they fit the evolved nature of the people who live in them, rather than exploiting or frustrating it. Where mismatch describes drives adapted to small groups and local scarcity misfiring in a globalised, technological world – appetites for sugar, status and novelty harnessed by markets and media – evolutionary match asks how the <a href="#sub-structure">sub-structure</a> of human nature can be met with conditions in which those drives serve the wellbeing of individuals and societies: in scale, community, work, food, movement and attention.</p>'
    },
    {
      id: 'socio-economic-evolutionary-mismatch',
      title: 'Socio-Economic Evolutionary Mismatch',
      coined: true,
      html: '<p><em>Socio-economic evolutionary mismatch</em> applies the biological concept of evolutionary mismatch – traits adapted to past environments that become harmful in new ones – to societies and economies. Human psychology evolved for small groups and local scarcity; institutions evolved for slower, smaller worlds. In a globalised, technological civilisation, both can drive behaviour that is no longer adaptive.</p>'
    },
    {
      id: 'the-capital-curse',
      title: 'The Capital Curse',
      coined: true,
      html: '<p>The <em>capital curse</em> is an analogy to the resource curse and the intelligence curse: when capital becomes the principal source of wealth and power, those who hold it need less from everyone else. As automation increases the returns to capital relative to labour, the incentives that once bound elites to the welfare of the broader population weaken.</p>'
    },
    {
      id: 'endgame-capitalism-and-exterminism',
      title: 'Endgame Capitalism & Exterminism',
      coined: true,
      ref: 'The Mechanist Win-Condition of Elite Class Warfare; Frase',
      html: '<p><em>Endgame capitalism</em> names the end-point of capitalism considered as a game: the win-condition in which an elite, owning the automated means of production, no longer depends on anyone else. Peter Frase, in <em>Four Futures</em> (2016), called one such future “exterminism” – abundance for the few combined with hierarchy, in which the rest of humanity becomes superfluous.</p>'
    },
    {
      id: '4e-intelligence',
      title: '4E Intelligence',
      coined: true,
      ref: '4E cognition',
      html: '<p><em>4E intelligence</em> applies the 4E account of cognition – embodied, embedded, enacted and extended – to intelligence in general. It holds that intelligence is not a property of an isolated brain or model, but arises from an agent’s body, environment, activity and tools, which has implications for how artificial intelligence should be understood and aligned.</p>'
    },
    {
      id: 'evolutionarily-stable-strategy',
      title: 'Evolutionarily Stable Strategy',
      refs: ['John Maynard Smith and George R. Price, “The Logic of Animal Conflict”, <em>Nature</em> 246 (1973).', 'John Maynard Smith, <em>Evolution and the Theory of Games</em> (1982).'],
      html: '<p>An <em>evolutionarily stable strategy</em> (ESS) is a strategy which, once adopted by most of a population, cannot be displaced by any rare alternative strategy, because the alternative does worse against the prevailing one than the prevailing one does against itself. The concept was introduced by John Maynard Smith and George Price (1973) to bring game theory into evolutionary biology, explaining why animals often fight with ritualised restraint rather than all-out aggression; it has since been applied to the evolution of cooperation, norms and institutions. For civilisational transition it names the stability problem: an existing order persists because no small group can profitably depart from it, so that a new pattern – a new economy, culture or form of governance – can take hold only if it can resist invasion by the old, or if conditions shift so far that the old strategy ceases to be stable and the system passes through a <a href="#phase-transition">phase transition</a>. See <a href="#aligned-evolutionarily-stable-social-structure">aligned evolutionarily stable social structure</a>.</p>'
    },
    {
      id: 'aligned-evolutionarily-stable-social-structure',
      title: 'Aligned Evolutionarily Stable Social Structure',
      coined: true,
      ref: 'Maynard Smith & Price (ESS)',
      html: '<p>An <em>aligned evolutionarily stable social structure</em> draws on the evolutionarily stable strategy of John Maynard Smith and George Price (1973) – a strategy that cannot be displaced by any alternative once established. It names a social structure that is both good for its members and stable against competitive displacement, so that alignment does not depend on everyone choosing to cooperate.</p>'
    },
    {
      id: 'philosophy',
      title: 'Philosophy',
      html: '<p><em>Philosophy</em> – from the Greek for “love of wisdom” – is the discipline of thinking systematically about the most fundamental questions: what exists (metaphysics), what can be known and how (epistemology), what is good and how to live (ethics), what is just and how to govern (political philosophy), what is beautiful (aesthetics), and how to reason well (logic). Unlike the sciences, which grew out of it, philosophy examines the concepts and assumptions that other inquiries take for granted, including its own. For the study of civilisation it supplies the deepest layer of any paradigm – the assumptions about reality, knowledge, value and the self out of which institutions and cultures arise – and so the layer at which the most fundamental change takes place. See <a href="#philosophical-paradigms">philosophical paradigms</a> and <a href="#metatheory">metatheory</a>.</p>'
    },
    {
      id: 'philosophical-frames',
      title: 'Philosophical Frames',
      html: '<p><em>Philosophical frames</em> are the underlying conceptual lenses – assumptions about what exists, what matters and how things can be known – through which a problem is perceived and posed. The same situation looks different through different frames, and many apparently intractable problems are artefacts of the frame used to describe them.</p>'
    },
    {
      id: 'millers-box',
      title: 'Miller’s Box',
      ref: 'Mark S. Miller & K. Eric Drexler, Comparative Ecology: A Computational Perspective (1988)',
      html: '<p><em>Miller’s box</em> refers to the comparative framework of Mark S. Miller, set out with K. Eric Drexler in “Comparative Ecology: A Computational Perspective” (1988).</p><p>It places biological ecosystems, human markets and computational systems side by side as kinds of <em>ecology</em> – systems in which many independent agents compete and cooperate without a central planner – and compares them along the features that shape what can evolve in each: whether agents act with foresight or only through blind variation and selection, and whether the boundaries of agents and their property are respected (trade) or routinely violated (predation, parasitism, theft). Biological evolution sits at one corner of the box, markets at another, and well-designed computational ecosystems – where boundaries can be enforced by the architecture itself – open corners that neither nature nor human institutions have occupied.</p><p>The box is a tool for asking which kind of ecology a civilisation, or a population of AI agents, is building, and so which <a href="#replicators">replicators</a> it will select for.</p>'
    },
    {
      id: 'complex-adaptive-agency',
      title: 'Any Sufficiently Complex and Adaptive System Is Indistinguishable from Intelligent Agency',
      coined: true,
      ref: 'Clarke’s third law (form)',
      html: '<p>This principle, modelled on Arthur C. Clarke’s third law, holds that any sufficiently complex and adaptive system – a market, a bureaucracy, an ecosystem – behaves in ways indistinguishable from the actions of an intelligent agent pursuing goals. Whether or not such systems “really” have minds, treating them as agents may be the most accurate way to predict and govern them.</p>'
    },
    {
      id: 'behaviour-of-a-system',
      title: 'The Behaviour of a System Is What It Is',
      coined: true,
      ref: 'The duck test; Beer (POSIWID)',
      html: '<p><em>The behaviour of a system is what it is</em> applies the duck test to systems: if it looks like a duck, swims like a duck and quacks like a duck, then it probably is a duck. The duck test is a form of abductive reasoning – inferring what something is from its observable behaviour, without access to its inner nature or to what it claims about itself. Applied to markets, states, corporations, technologies and civilisations, it holds that a system is to be identified by what it consistently does, not by its stated purposes, its designers’ intentions or the self-understanding of the people within it.</p><p>If a system behaves like an extractive machine, an arms race or an unaligned optimiser, then for every practical purpose that is what it is – whatever it is called. The principle echoes <a href="#stafford-beer">Stafford Beer</a>’s “the purpose of a system is what it does”, and it underlies the claims that <a href="#complex-adaptive-agency">any sufficiently complex and adaptive system is indistinguishable from intelligent agency</a>, that civilisation can fail the <a href="#planetary-reverse-turing-test">planetary reverse Turing test</a>, and that capitalism can be understood as an <a href="#capitalism-as-unaligned-asi">unaligned ASI</a>.</p>'
    },
    {
      id: 'philosophical-paradigms',
      title: 'Philosophical Paradigms',
      ref: 'Kuhn',
      html: '<p><em>Philosophical paradigms</em> are the comprehensive worldviews – materialism, idealism, mechanism, process philosophy and others – that set the terms within which whole fields of thought operate. Like Kuhn’s scientific paradigms, they change rarely and with difficulty, and a civilisational transition may require a shift at this deepest level.</p>'
    },
    {
      id: 'hyper-agential-hyper-realism',
      title: 'Hyper-Agential Hyper-Realism',
      coined: true,
      html: '<p><em>Hyper-agential hyper-realism</em> is a stance that takes seriously the reality and agency of large-scale, non-human systems – markets, states, algorithms, technologies – as actors more powerful than individuals. It treats these hyper-agents as real forces to be analysed and negotiated with, rather than as abstractions reducible to the people within them.</p>'
    },
    {
      id: 'cybernetic-neo-platonism',
      title: 'Cybernetic Neo-Platonism',
      coined: true,
      html: '<p><em>Cybernetic neo-Platonism</em> joins cybernetics with the Platonic tradition: it treats the patterns, forms and organising principles of systems – feedback, information, structure – as more fundamental than their material substrates. The same form of organisation can be realised in cells, societies or machines, and it is the form, not the matter, that explains behaviour.</p>'
    },
    {
      id: 'civilisation-as-superintelligence',
      title: 'Civilisation as Superintelligence',
      html: '<p><em>Civilisation as superintelligence</em> is the view that human civilisation – the combined system of people, markets, states, corporations, science and technology – already constitutes a superintelligence: an agent whose capacity to perceive, model, decide and act on the world vastly exceeds that of any individual within it. No one designs a smartphone, runs a global supply chain or produces the scientific picture of the world; the civilisation does, as an emergent collective intelligence. If so, the alignment problem is not only a future problem about artificial minds but a present one: whether the goals this superintelligence actually pursues – as revealed by its behaviour rather than by the intentions of its members – are aligned with the wellbeing of the people and living systems within it. The concepts beneath it ask how such an intelligence can be recognised (<a href="#planetary-reverse-turing-test">the planetary reverse Turing test</a>), what it is when it is unaligned (<a href="#unaligned-artificial-artificial-superintelligence">unaligned artificial artificial superintelligence</a>) and how it is composed of agents within agents (<a href="#hierarchical-agency">hierarchical agency</a>).</p>'
    },
    {
      id: 'society-as-machine-intelligence',
      title: 'Society as Machine Intelligence',
      html: '<p><em>Society as machine intelligence</em> treats a society as an information-processing machine: a system that takes in signals from its environment and its members, processes them through mechanisms such as markets, bureaucracies, elections and algorithms, and produces decisions. The view runs through the history of <a href="#computational-mechanism">computational mechanism</a> – from Friedrich Hayek’s account of the price system as a mechanism for using dispersed knowledge, and the socialist calculation debate over whether a planner’s computer could do the same, to Stafford Beer’s cybernetic models of the state and today’s algorithmic governance. It illuminates how societies coordinate at scales beyond human comprehension, but also what is lost when they are understood, and redesigned, purely as computation: the mechanism optimises what it can measure, and the purposes it serves become those of the machine rather than of the people within it. See <a href="#limits-to-alignment">limits to alignment</a> and <a href="#civilisation-as-superintelligence">civilisation as superintelligence</a>.</p>'
    },
    {
      id: 'computational-mechanism',
      title: 'Computational Mechanism',
      coined: true,
      ref: 'alt: Neomechanism',
      html: '<p><em>Computational mechanism</em>, or neomechanism, is the renewal of the mechanistic worldview in computational form: the view that minds, lives and societies can be understood as information-processing systems. It succeeds the clockwork mechanism of the early modern period, and underlies both the promise of AI and the tendency to treat everything as computable.</p>'
    },
    {
      id: 'the-techno-onto-logical',
      title: 'The Techno-Onto-Logical',
      coined: true,
      ref: 'Technological Rationality; Heidegger; Marcuse',
      html: '<p>The <em>techno-onto-logical</em> names the way technology shapes what counts as real and how things show up at all. It draws on Heidegger’s account of modern technology as “enframing”, which reveals everything as a resource, and on Herbert Marcuse’s “technological rationality”, in which the logic of efficiency and control becomes the logic of thought itself.</p>'
    },
    {
      id: 'ai-as-anthropological-mirror',
      title: 'AI as Anthropological Mirror',
      coined: true,
      refs: ['Sandy Starr, <em>AI: Separating Man From Machine</em> (2023).'],
      html: '<blockquote class="entry-quote"><p>But what is increasingly obvious is that the Turing test is in truth more an assessment of us than it is of our technology. If we lose the capacity to distinguish ourselves and one another from machines, then in some sense it is we who have failed a test, rather than our machines that have passed one… that we were content to behave like machines, or to treat other people as though they were machines, before it became feasible that we were literally talking to machines.</p><footer>Sandy Starr, <em>AI: Separating Man From Machine</em> (2023)</footer></blockquote>' +
        '<p><em>AI as anthropological mirror</em> treats artificial intelligence as a reflection of the civilisation that produces it. Trained on human data and shaped by human incentives, AI systems reveal – often starkly – the values, biases, priorities and blind spots of the societies that build them. What we fear in AI may be what we have not faced in ourselves.</p>'
    },
    {
      id: 'limits-to-alignment',
      title: 'Limits to Alignment',
      html: '<p><em>Limits to alignment</em> considers the possibility that some forms of alignment – of AI with human values, or of human institutions with collective wellbeing – are impossible in principle, not merely difficult. Values may be inconsistent, contested or unknowable, and powerful optimisers may inevitably drift. Recognising such limits shapes what can reasonably be hoped for.</p>'
    },
    {
      id: 'misaligned-world-hypothesis',
      title: 'Misaligned World Hypothesis',
      coined: true,
      ref: 'Bostrom (Vulnerable World Hypothesis)',
      html: '<p>The <em>misaligned world hypothesis</em>, modelled on Nick Bostrom’s vulnerable world hypothesis, proposes that the world is already governed by misaligned optimisers – markets, states and institutions pursuing goals that diverge from human wellbeing. On this view, AI alignment is not a new problem but a new instance of an old one: civilisation itself has never been aligned.</p>'
    },
    {
      id: 'value-assimilation-and-misalignment-cascades',
      title: 'The Value Assimilation Problem & Misalignment Cascades',
      coined: true,
      html: '<p>The <em>value assimilation problem</em> is the difficulty of absorbing new values, technologies or institutions into a civilisation without their distorting its existing values. <em>Misalignment cascades</em> describe how a misalignment at one level – a metric, an incentive, a system – propagates through the others, each amplifying the error until it reshapes the whole.</p>'
    },
    {
      id: 'the-emergence-model',
      title: 'The Emergence Model',
      ref: 'The Emergence Project (Daniel Schmachtenberger et al.); Wilber, four quadrants',
      html: '<p><em>The emergence model</em> is the conceptual framework of the Emergence Project, a think tank associated with Daniel Schmachtenberger that set out to understand why humanity’s global challenges keep arising and how to address them at their root. Its premise is that nearly all of those challenges are human-caused, and that human behaviour is not fixed by nature but <em>conditioned</em> – so lasting solutions must change the structures that condition it, rather than treat symptoms within the systems that produce them.</p><p>Adapted from Ken Wilber’s four-quadrant <a href="#integral-theory">integral</a> model, it sorts every factor that conditions human behaviour into four quadrants, each fundamental and irreducible to the others, and all bound together by feedback loops:</p><ul><li><strong><a href="#infra-structure">Infra-structure</a></strong> (infrastructure): modes of production, energy, agriculture, water, transport, building and waste.</li><li><strong><a href="#inter-structure">Inter-structure</a></strong> (social structure): economics, governance and law.</li><li><strong><a href="#super-structure">Super-structure</a></strong> (memetic structure): values, beliefs, meaning, worldview, identity, orienting narratives and definitions of success.</li><li><strong><a href="#sub-structure">Sub-structure</a></strong> (physiological structure, widened here to the evolved biology and psychology beneath it): nutrition, neurobiology, endocrinology, epigenetics and toxicity.</li></ul><p>Within each quadrant, the model catalogues the “metastructures” those structures can take, as criteria for replacing harm-externalising structures with omni-considerate ones. Its aim is the intentional emergence of an omni-considerate, integrally developed and effectively self-governing global civilisation – a transition from an adolescent phase of consumption and growth to a mature one of homeostasis, synergy and regeneration. On this map the model is extended to six structures: the four quadrants, with the physiological divided into evolved psychology (the <a href="#sub-structure">substructure</a>) and population physiology (the <a href="#biostructure">biostructure</a>), and a <a href="#metastructure">metastructure</a> of game-theoretic and system dynamics running through them all.</p>'
    },
    {
      id: 'infra-structure',
      title: 'Infrastructure: Technological Stack',
      order: 1,
      html: '<p>The <em>infra-structure</em> is the material base of a civilisation – the first of the four structures of <a href="#the-emergence-model">the emergence model</a>, where it is called infrastructure: its modes of production, energy, agriculture, water, transport, building and waste systems. It conditions behaviour by determining what is physically possible, cheap or easy, and so what patterns of life are rewarded; a civilisation built on extraction and disposal will predispose extractive, disposable habits whatever its values.</p><p>Redesigning it – towards closed loops, renewable energy and regenerative agriculture – changes the ground on which every other structure stands. See <a href="#infra-structure-global-redesign-institute">the Global Redesign Institute</a>.</p><h2>Technological Infrastructure</h2><p><em>Technological infrastructure</em> is the material base of a civilisation: its tools, energy systems, production, communication and computation. In a three-layer model of civilisation, it is the infrastructure on which <a href="#critical-political-economy">political economy</a> (structure) and <a href="#super-structure">cultural psychology</a> (superstructure) rest.</p><p>The defining feature of the 21st century is that this layer is changing exponentially – through AI, biotechnology and automation – while the other two remain largely inherited from earlier eras. The resulting mismatch is what the biologist E. O. Wilson summed up as “Palaeolithic emotions, medieval institutions and godlike technology”.</p>'
    },
    {
      id: 'inter-structure',
      title: 'Interstructure: Political Economy',
      order: 2,
      html: '<p>The <em>inter-structure</em> is the structure of relations between people – what <a href="#the-emergence-model">the emergence model</a> calls social structure: economics, governance and law. It conditions behaviour through incentives, rules and the distribution of power, deciding which actions are rewarded, permitted or punished. Where it rewards externalising harm and winning at others’ expense, even well-meaning people are pushed towards <a href="#race-to-the-bottom">races to the bottom</a>; redesigning it aims to align individual incentive with collective wellbeing. See <a href="#inter-structure-democracy-3">Democracy 3.0</a>.</p>'
    },
    {
      id: 'super-structure',
      title: 'Superstructure: Cultural Psychology',
      order: 3,
      html: '<p>The <em>super-structure</em> is the structure of meaning that sits above the material and social orders – what <a href="#the-emergence-model">the emergence model</a> calls memetic structure: a culture’s values, beliefs, worldview, identities, orienting narratives and definitions of success. It conditions behaviour from the inside, shaping what people want, admire and consider normal, and it both reflects and legitimates the other structures. A new civilisation needs a super-structure that makes sense of it and makes it worth wanting. See <a href="#coherence-of-civilisations">the coherence of civilisations</a>.</p><p><em>Cultural psychology</em> is the superstructure of a civilisation: its shared values, narratives, identities, forms of meaning and modes of sensemaking, as they are lived by the people within it. It shapes what a society is able to want and to imagine, and is in turn shaped by the <a href="#critical-political-economy">political economy</a> and <a href="#infra-structure">technology</a> it lives within. It also explains why institutions transplanted from one society to another so often behave differently there: a new economy run by people formed by the old one tends to recreate the old one.</p>'
    },
    {
      id: 'sub-structure',
      title: 'Substructure: Evolutionary Psychology',
      order: 4,
      html: '<p>The <em>sub-structure</em> is the evolved human nature on which every other structure of a civilisation rests: the psychology that natural selection built into the people who make it up – their drives for status, belonging and security, their in-group loyalties, their responses to threat and reward. It joins <a href="#evolutionary-biology">evolutionary biology</a>, the nature we inherit, to psychology, how that nature becomes thought, feeling and behaviour in a particular environment; the body’s present condition – nutrition, hormones, toxicity – is filed separately as the <a href="#biostructure">biostructure</a>.</p><p>The sub-structure conditions everything above it, because every economy, institution and culture has to be run by human animals with human needs, drives and limits. Civilisation design cannot rewrite it, but it can work with it rather than against it – building environments that fit our evolved needs instead of exploiting them, and so closing the gap described by <a href="#socio-economic-evolutionary-mismatch">socio-economic evolutionary mismatch</a>. See also <a href="#biowisdom">biowisdom</a>.</p>'
    },
    {
      id: 'evolutionary-biology',
      title: 'Evolutionary Biology',
      order: 1,
      html: '<p><em>Evolutionary biology</em> studies how living things came to be as they are through natural selection, sexual selection, drift and inheritance. For civilisation it is the deepest layer of the <a href="#sub-structure">sub-structure</a>: humans are evolved primates, shaped over hundreds of thousands of years for life in small, mobile, face-to-face groups. That inheritance equips us with capacities for cooperation, fairness, language and culture – and with drives for status, in-group loyalty, short-term reward and competition over resources that served our ancestors but can turn destructive at global scale and with modern technology.</p><p>Because selection acts on groups as well as individuals (<a href="#multilevel-selection">multilevel selection</a>), our evolved nature holds both competitive drives and a deep capacity for cooperation. An evolutionary view of human nature asks which environments and institutions bring out the second rather than the first. See also <a href="#evolutionary-theory">evolutionary theory</a>.</p>'
    },

    {

      html: '<p><em>Critical social epistemology</em> studies how a society comes to know what it knows – through its institutions of science, education, media, expertise and now algorithms – with attention to the forms of power, interest and distortion that shape that process. Social epistemology, developed by Steve Fuller and Alvin Goldman in the 1980s, asks how knowledge is produced and distributed collectively rather than by individual knowers; a critical social epistemology adds the questions of <a href="#critical-social-theory">critical social theory</a>: who controls the means of producing knowledge, whose interests the resulting picture of the world serves, and how communication is systematically distorted, as Jürgen Habermas argued, or how some knowers are denied credibility, as Miranda Fricker’s account of epistemic injustice (2007) describes. It treats a society’s capacity for collective sensemaking as a condition of its capacity to govern itself.</p>'

      html: '<p><em>Geodesign</em> is design at the scale of the planet: the deliberate shaping of the geographic, infrastructural and computational systems through which the Earth is inhabited and governed. The term began in landscape planning and geographic information systems, for design informed by spatial data; Benjamin Bratton widens it, in <em>The Stack</em> (2015), into a design discipline for planetary-scale computation – the layered megastructure of earth, cloud, city, address, interface and user that now cuts across the territories of states.</p><p>For Bratton the question is no longer whether the planet is designed but how well: its energy, logistics and sensing systems already form an accidental architecture, and geodesign is the attempt to make that architecture deliberate, accountable and fit for the planet it runs on.</p>'

    {
      id: 'utopia',

      html: '<p>A <em>utopia</em> is an imagined society in which the problems of the present have been overcome – a model of the good society, set against the real one. The word was coined by Thomas More for his <em>Utopia</em> (1516), punning on the Greek <em>ou-topos</em>, “no place”, and <em>eu-topos</em>, “good place”: a perfect society that exists nowhere. Utopias have served both as blueprints to be built and as critical mirrors exposing what is wrong with the world as it is; after the twentieth century, when attempts to impose total visions of the good ended in catastrophe, utopian thought has turned increasingly towards open-ended and pluralistic forms – <a href="#viatopia">viatopia</a>, <a href="#paretotopia">paretotopia</a> and <a href="#meta-utopia">meta-utopia</a> – which describe conditions for continued improvement rather than a fixed end-state. See <a href="#utopian-studies">utopian studies</a>.</p>'

    {

      ref: 'Weinstein',
      refs: ['Heather Heying and Bret Weinstein, <em>A Hunter-Gatherer’s Guide to the 21st Century</em> (2021).'],
      html: '<p><em>The first frontier</em> is geographic: prosperity won by reaching new, unoccupied land and its resources. It is the oldest frontier, and it lasts only until the new land is full.</p>'
    },
    {
      id: 'anti-rivalrous-dynamics',
      title: 'Anti-Rivalrous Dynamics',
      html: '<p><em>Anti-rivalrous dynamics</em> are those in which one party’s gain adds to others’ rather than subtracting from them. Rivalrous goods are diminished by use; anti-rivalrous goods – knowledge, open-source software, trust, a shared language – become more valuable the more people use them.</p><p>In Game B thinking, a civilisation that escapes rivalrous competition must be built around dynamics like these, so that cooperating is the winning move.</p>'
    },
    {
      id: 'antifragility',
      title: 'Anti-fragility',
      ref: 'Taleb',
      refs: ['Nassim Nicholas Taleb, <em>Antifragile: Things That Gain from Disorder</em> (2012).'],
      html: '<p><em>Anti-fragility</em> is Nassim Nicholas Taleb’s term, from <em>Antifragile</em> (2012), for the property of systems that grow stronger from shocks, stress and volatility, rather than merely surviving them. The fragile breaks under stress and the robust resists it, but the anti-fragile improves – as bones strengthen under load and ecosystems renew themselves through small fires.</p><p>For civilisation design it shifts the aim from preventing every shock to building systems that learn and adapt from the ones that come.</p>'
    },
    {
      id: 'broadcast-vs-network-modality',
      title: 'Broadcast vs Network Modality',
      html: '<p><em>Broadcast and network modality</em> are two ways a society can make sense of the world and coordinate. In broadcast modality a few centres – states, media, churches – send information outward to many receivers, producing shared narratives but concentrating control over them. In network modality many participants exchange information with one another directly, so that sense is made and decisions are reached through their interaction.</p><p>Game B thinking holds that the digital age has eroded the old broadcast order without yet building a healthy network one, and that a new civilisation needs ways of sensemaking and coordination native to networks.</p>'
    },
    {
      id: 'protobs',
      title: 'ProtoBs',
      ref: 'Rutt',
      html: '<p><em>ProtoBs</em> – proto–Game B communities – is Jim Rutt’s term for on-the-ground communities of people trying to live Game B lives now: coherent groups sharing land, housing, work or governance in ways meant to be whole, if not yet complete. They serve as experiments and seeds, testing in practice how a Game B civilisation might work and showing others that it can.</p>'
    },
    {
      id: 'society-4-0',
      title: 'Society 4.0',
      ref: 'Haupt',
      html: '<p><em>Society 4.0</em> is Michael Haupt’s name for an emerging meta-society: a global network of people working to redesign the value systems, reward systems and social contracts on which modern society rests. It frames the present as a transition to a new stage of social evolution, and approaches it as a game that anyone can join – a real-world game whose adversaries are war, poverty, inequality and environmental destruction.</p>'
    },
    {
      id: 'cybernetic-economics',
      title: 'Cybernetic Economics',
      html: '<p><em>Cybernetic economics</em> is the tradition of organising economies through feedback, information and control rather than through prices and markets alone. It treats the economy as a system to be steered: measuring resources and needs in real time, and adjusting production and distribution as conditions change.</p><p>It runs from Stafford Beer’s work on viable systems and Project Cybersyn in Chile, through Jacque Fresco’s resource-based economy, to recent proposals for post-monetary planning made feasible by computation and sensing.</p>'
    },
    {
      id: 'integral',
      title: 'Integral',
      ref: 'Joseph',
      html: '<p><em>Integral</em> is Peter Joseph’s name for a proposed post-monetary economic model: a federated, cooperative economy in which production and distribution are coordinated cybernetically, through connected systems for assessing needs, managing resources and allocating labour, rather than through markets. It is meant to grow alongside the existing economy as parallel infrastructure, gradually taking over from market dependence rather than replacing it by revolution.</p>'
    },
    {
      id: 'natural-law-resource-based-economy',
      title: 'Natural Law Resource Based Economy',
      ref: 'Joseph',
      refs: ['Peter Joseph et al., <em>The Zeitgeist Movement Defined: Realizing a New Train of Thought</em> (2014).'],
