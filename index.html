      html: '<p>A <em>world-system</em> is a social system that spans many societies and states and is bound together by a single division of labour – a “world” not because it covers the whole globe, but because it is larger than any one political unit within it. The concept is Immanuel Wallerstein’s, the basis of <a href="#world-systems-analysis">world-systems analysis</a>, which takes the world-system rather than the nation-state as the unit of history. Wallerstein distinguished world-empires, unified by a single political centre, from world-economies, held together by trade and production across many states; the modern world-system is a world-economy, structured by a division between core, semi-periphery and periphery, which has expanded since the sixteenth century to take in the entire planet. See <a href="#capitalist-world-system">capitalist world-system</a> and <a href="#life-world-system">life-world-system</a>.</p>'
    },
    {
      id: 'capitalist-world-system',
      title: 'Capitalist World-System',
      refs: ['Immanuel Wallerstein, <em>The Modern World-System</em>, 4 vols. (1974–2011).', 'Giovanni Arrighi, <em>The Long Twentieth Century</em> (1994).'],
      html: '<p>The <em>capitalist world-system</em> is the modern <a href="#world-system">world-system</a>: the single capitalist world-economy that emerged in Europe in the long sixteenth century and expanded until it encompassed the whole planet. Its defining logic, in Immanuel Wallerstein’s account, is the endless accumulation of capital, pursued through a division of labour in which a core of high-profit, high-wage production draws surplus from a periphery of low-profit, low-wage production, with a semi-periphery between them; and through an interstate system in which successive hegemonic powers – the Dutch, the British, the Americans – have organised the whole for a time before declining. Wallerstein held that the system has entered a terminal crisis, as its means of sustaining accumulation are exhausted; what follows is uncertain. See <a href="#post-capitalist-world-system">post-capitalist world-system</a>.</p>'
    },
    {
      id: 'post-capitalist-world-system',
      title: 'Post-Capitalist World-System',
      refs: ['Immanuel Wallerstein, <em>Utopistics: Or, Historical Choices of the Twenty-First Century</em> (1998).'],
      html: '<p>A <em>post-capitalist world-system</em> is a world-system whose organising logic is no longer the endless accumulation of capital. Immanuel Wallerstein argued that the <a href="#capitalist-world-system">capitalist world-system</a> is in a structural crisis from which it cannot recover, and that its successor is not determined: the transition could lead to a system more hierarchical and unequal than the present one, or to one that is relatively democratic and egalitarian, and which emerges depends on the choices made during the transition. Designing for the second outcome – a world-system organised around the sustenance of life rather than the accumulation of capital – is the task of <a href="#civilisation-design">civilisation design</a> and the aim of a <a href="#viable-life-world-system">viable life-world-system</a>. See <a href="#post-capitalism">post-capitalism</a>.</p>'
    },
    {
      id: 'viable-life-world-system',
      title: 'Viable Life-World-System',
      coined: true,
      refs: ['Stafford Beer, <em>Brain of the Firm</em> (1972).', 'Stafford Beer, <em>The Heart of Enterprise</em> (1979).'],
      html: '<p>A <em>viable life-world-system</em> is a <a href="#life-world-system">life-world-system</a> able to sustain itself: to maintain its identity and adapt to a changing environment – its own technologies and the limits of the biosphere – without generating the dynamics of the <a href="#metacrisis">metacrisis</a>. Viability is Stafford Beer’s criterion: a <a href="#viable-system-model">viable system</a> balances the autonomy of its parts with the coordination of the whole, and has the <a href="#requisite-variety">requisite variety</a> to respond to what its environment presents. Applied to a civilisation, it asks whether its world-system and its life-world are so related that each can be sustained – the economy within the limits of the living world, and the system in the service of the life-world rather than colonising it. A viable life-world-system is the aim of <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'life-world-systems-change',
      title: 'Life-World-Systems Change',
      html: '<p><em>Life-world-systems change</em> is change at the scale of a whole <a href="#life-world-system">life-world-system</a>: a transformation not of one sector, policy or institution, but of the coupled world-system and life-world of a civilisation together – its economy and politics, its culture and meaning, and their relation to the living world. Because these structures condition one another, change in any one of them alone tends to be absorbed or reversed by the others; lasting change requires them to shift together, as in past transitions such as the agricultural and industrial revolutions. The question of how such change can be brought about deliberately, towards a <a href="#viable-life-world-system">viable life-world-system</a>, is the subject of the <a href="#theory-of-life-world-systems-change">theory of life-world-systems change</a>. See <a href="#civilisation-transition">civilisational transition</a>.</p>'
    },
    {
      id: 'the-two-subcultures',
      title: 'The Two Subcultures',
      coined: true,
      refs: ['C. P. Snow, <em>The Two Cultures and the Scientific Revolution</em> (1959).'],
      html: '<p><em>The two subcultures</em> adapts C. P. Snow’s “two cultures” (1959) – the gulf he saw between the sciences and the humanities – to the field of civilisation research itself, which has grown up largely outside the universities in two distinct subcultures. The first is the <a href="#para-academic-space">para-academic</a> space of rationalism, effective altruism, existential risk and AI alignment: analytic, quantitative and institutionally organised, focused on <a href="#macrostrategy">macrostrategy</a>, catastrophic risk and the long-term future. The second is the <a href="#meta-space">meta</a> space of <a href="#metamodernism">metamodernism</a>, Game B, integral theory and the liminal web: synthetic, developmental and culturally oriented, focused on the <a href="#metacrisis">metacrisis</a>, sensemaking and the transformation of culture and consciousness. Each sees what the other tends to miss – the one the hard constraints of technology, game theory and risk, the other the deeper roots of the crisis in meaning, values and ways of knowing – and each is easily dismissed by the other, as naive technocracy or as vague mysticism. A <a href="#civilisation-research-paradigm">civilisation research paradigm</a> worth the name would need to bridge them.</p>'
    },
    {
      id: 'the-mechanics-of-meta-utopia',
      title: 'The Mechanics of Meta-Utopia',
      coined: true,
      refs: ['Robert Nozick, <em>Anarchy, State, and Utopia</em> (1974), part III.'],
      html: '<p><em>The mechanics of meta-utopia</em> are the working arrangements by which a <a href="#meta-utopia">meta-utopia</a> – a framework within which many different utopian communities can coexist, rather than a single blueprint for the good society – could actually function. Robert Nozick’s framework for utopia left open the hard questions of how such a world would run: how communities are founded and how people may enter and leave them; what rules govern the space between them; how shared goods, conflicts and spillovers are handled; how the framework itself is defended against capture by any one community; and what each person is guaranteed regardless of where they live. Addressing these – through federal and polycentric institutions, rights of exit and voice, common protocols and commons, and the coordinating capacity of technology – turns meta-utopia from an ideal into a design problem for <a href="#civilisation-design">civilisation design</a>. See <a href="#pluralistic-civilisation-alignment">pluralistic civilisation alignment</a> and <a href="#world-democratic-federation">world democratic federation</a>.</p>'
    },
    {
      id: 'infrastructural-gaianism',
      title: 'Infrastructural Gaianism',
      coined: true,
      refs: ['James Lovelock, <em>Gaia: A New Look at Life on Earth</em> (1979).'],
      html: '<p><em>Infrastructural Gaianism</em> joins the new infrastructuralism – the turn in recent design and theory towards infrastructure, rather than ideology or policy, as the decisive layer at which a civilisation is shaped – with Gaianism, the view, following James Lovelock and Lynn Margulis’s <a href="#gaia">Gaia hypothesis</a>, of the Earth as a single self-regulating living system. Together they hold that the infrastructures of civilisation – energy, water, food, materials, transport, building and computation – should be designed as organs of the Earth system rather than as machines set against it: closing material loops, running on the planet’s energy flows, regenerating the ecosystems they draw on, and sensing and responding to the state of the biosphere. On this view the material base of a viable civilisation is not a technological stack imposed on nature but a planetary metabolism woven into Gaia’s own. See <a href="#infra-structure">infrastructure</a> and <a href="#biowisdom">biowisdom</a>.</p>'
    },
    {
      id: 'multipolar-trap-trap',
      title: 'The ‘Multi-Polar Trap’ Trap',
      coined: true,
      html: '<p><em>The ‘multi-polar trap’ trap</em> is the trap of seeing every problem as a <a href="#multipolar-trap">multipolar trap</a>. The concept is powerful: it explains how competition can drive rational actors into outcomes none of them want, from arms races to races to the bottom. But once it becomes the lens through which everything is seen, it turns from an explanation into an excuse and a fatalism – every harm becomes the inevitable product of competition, no one is responsible because everyone is trapped, and the only conceivable escape is a global coordinator powerful enough to stop the race. The frame obscures the actors who choose and benefit, the many cases in which cooperation, norms and institutions already hold competition in check, and the possibility of changing the game rather than merely coordinating within it. Escaping the multipolar trap requires first escaping the trap of thinking that it is the only trap there is. See <a href="#agents-of-doom">agents of doom</a>.</p>'
    },
    {
      id: 'the-twin-neural-problem',
      title: 'The Twin Neural Problem',
      coined: true,
      html: '<p><em>The twin neural problem</em> is the recognition that the alignment of artificial intelligence and the alignment of human beings are, at bottom, the same problem in two substrates. Both artificial neural networks and human brains are opaque systems whose values and dispositions were not written down but formed by optimisation – gradient descent on training data in the one case, evolution and cultural conditioning in the other – so that neither can simply be read or rewritten from outside. The difficulties of AI alignment – interpretability, misgeneralisation, goals that diverge from those intended, behaviour that changes with scale and context – mirror the long-standing difficulties of aligning people and institutions with what is good. Progress on either can inform the other, and neither can be solved alone, since aligned machines in the hands of misaligned humans, or aligned humans served by misaligned machines, would fail together. See <a href="#human-inner-alignment-problem">the human inner alignment problem</a> and <a href="#ai-as-anthropological-mirror">AI as anthropological mirror</a>.</p>'
    },
    {
      id: 'cultural-psychological-adaptationism',
      title: 'Cultural-Psychological Adaptationism',
      coined: true,
      html: '<p><em>Cultural-psychological adaptationism</em> extends <a href="#military-economic-adaptationism">military-economic adaptationism</a> from institutions to minds and cultures. If the dominant institutions of civilisation have been selected for military and economic competitiveness, then so too have the values, identities, beliefs and psychological dispositions that sustain them: the cultures and personalities that best serve competitive growth – acquisitive, status-seeking, disciplined, individualistic, oriented to work and accumulation – have been rewarded and reproduced, while those less suited to it have been displaced or absorbed. The <a href="#super-structure">super-structure</a> of a civilisation is in this sense an adaptation to its competitive environment rather than an expression of human nature or of what makes people flourish – which is why a change in that environment is a precondition of deep cultural change, and why cultural change alone cannot escape it.</p>'
    },
    {
      id: 'moloch-of-the-gaps',
      title: 'Moloch of the Gaps',
      coined: true,
      html: '<p><em>Moloch of the gaps</em> adapts the “God of the gaps” – the habit of invoking God to explain whatever science cannot yet explain – to <a href="#moloch">Moloch</a>, the personification of competitive dynamics that drive everyone towards outcomes no one wants. Moloch of the gaps is the habit of invoking Moloch to explain whatever harm cannot otherwise be accounted for: every bad outcome becomes the work of the impersonal god of competition, and the gaps in an explanation – who decided, who profited, what else could have been done – are filled with the figure of an inexorable system. Like the God of the gaps, it explains everything and therefore little, and it retreats as each harm is traced to particular causes, choices and actors. See <a href="#multipolar-trap-trap">the ‘multi-polar trap’ trap</a>.</p>'
    },
    {
      id: 'reactionary-modernism',
      title: 'Reactionary Modernism or Neomodernism',
      coined: true,
      refs: ['Jeffrey Herf, <em>Reactionary Modernism: Technology, Culture, and Politics in Weimar and the Third Reich</em> (1984).'],
      html: '<p><em>Reactionary modernism</em> is Jeffrey Herf’s term (1984) for the outlook of German thinkers between the wars – Ernst Jünger, Oswald Spengler, Carl Schmitt and others – who embraced modern technology while rejecting the values of the Enlightenment: reason, liberal democracy, equality and humanism. Technology was celebrated as an expression of will, power and national destiny rather than of emancipation. <em>Neomodernism</em> names its contemporary return: a renewed enthusiasm for technology, growth, acceleration and building, joined to a rejection of the liberal, egalitarian and humanist commitments of <a href="#modernism">modernism</a>, and to admiration for hierarchy, strong leaders and civilisational greatness – as in parts of the technology industry and the new right. Where <a href="#metamodernism">metamodernism</a> seeks to integrate modernity’s gains with its critiques, neomodernism keeps its machines and discards its ideals. See <a href="#right-accelerationism">right accelerationism</a> and <a href="#effective-accelerationism">effective accelerationism</a>.</p>'
    },
    {
      id: 'capitalist-problem-of-evil',
      title: 'The Capitalist Problem of Evil',
      coined: true,
      html: '<p><em>The capitalist problem of evil</em> applies the theological problem of evil – how an all-powerful and all-good God can permit suffering – to the market. If the market is, as its defenders hold, the most efficient and beneficent system of coordination ever devised, the best of all achievable orders, how is it that it produces, alongside unprecedented wealth, mass poverty, ecological destruction, crises and catastrophic risks? The answers given mirror those of theology: the evils are the price of a greater good, the fault of human interference with the market rather than the market itself, temporary stages on the way to prosperity, or not evils at all once correctly understood. <a href="#capitalist-theodicy">The capitalist theodicy</a> is the attempt to answer the problem; the problem itself is the question that capitalism, so understood, cannot avoid. See <a href="#capitalist-realism">capitalist realism</a>.</p>'
    },
    {
      id: 'argument-from-post-capitalist-desire',
      title: 'The Argument from Post-Capitalist Desire',
      coined: true,
      refs: ['Mark Fisher, <em>Postcapitalist Desire: The Final Lectures</em> (2021).'],
      html: '<p><em>The argument from post-capitalist desire</em> holds that the desire for a world beyond capitalism is already present within capitalism itself, and is evidence that such a world is possible and wanted. Against <a href="#capitalist-realism">capitalist realism</a> – the sense that there is no alternative – it points to the desires capitalism provokes but cannot satisfy: for free time, security, community, meaningful work, and the abundance its own technologies make possible but its property relations withhold. Mark Fisher, in the lectures published as <em>Postcapitalist Desire</em> (2021), asked how such desires might be recognised rather than captured and resold; the argument holds that they show <a href="#post-capitalism">post-capitalism</a> to be not an imposition on people’s wishes but their fulfilment – what people already want, once they are free to want it. See <a href="#lost-futures">lost futures</a>.</p>'
    },
    {
      id: 'agi-as-victory-condition-of-class-warfare',
      title: 'AGI as the Victory Condition of Class Warfare',
      coined: true,
      html: '<p><em>AGI as the victory condition of class warfare</em> is the argument that artificial general intelligence could settle the long conflict between capital and labour in capital’s favour – not by defeating workers but by making them unnecessary. Throughout the history of capitalism, owners have needed workers to produce, and workers’ collective power has rested on the ability to withhold their labour; strikes, unions and democratic demands all depend on it. If AI systems and robots can do most of the work, that leverage disappears: those who own the machines no longer need the cooperation of those who do not, and the bargain on which wages, welfare and political rights have rested could collapse. Whether AGI becomes this victory condition, or the basis of shared abundance, depends on who owns and governs it – the question of the <a href="#post-agi-social-contract-theory">post-AGI social contract</a>. See <a href="#the-intelligence-curse">the intelligence curse</a> and <a href="#endgame-capitalism-and-exterminism">endgame capitalism and exterminism</a>.</p>'
    },
    {
      id: 'singers-world-systems-change-cruxes',
      title: 'Singer’s World-Systems Change Cruxes',
      coined: true,
      refs: ['Peter Singer, “Famine, Affluence, and Morality”, <em>Philosophy &amp; Public Affairs</em> 1 (1972).', 'Peter Singer, <em>The Life You Can Save</em> (2009).'],
      html: '<p><em>Singer’s world-systems change cruxes</em> are the points of disagreement on which the case for changing the world-system turns, set against the moral reasoning of <a href="#peter-singer">Peter Singer</a>. Singer’s argument – that if we can prevent something very bad without sacrificing anything of comparable moral importance, we ought to do it – grounded <a href="#effective-altruism">effective altruism</a>’s focus on measurable interventions within the existing order: saving the drowning child in front of us, or the distant one through the most cost-effective charity. The cruxes are the questions on which one must decide whether that reasoning points instead towards changing the system that produces the suffering: whether systemic causes can be identified and acted on; whether systemic change is tractable or only speculative; whether its benefits can be compared with the measurable gains of direct aid; whether working within the system entrenches it; and whose responsibility the system’s harms are. Resolve them one way and charity is the rational response; resolve them the other and the same moral premise demands <a href="#life-world-systems-change">life-world-systems change</a>.</p>'
    },
    {
      id: 'universal-dynamics',
      title: 'Universal Dynamics: Emergentism & Cyberneticism',
      coined: true,
      html: '<p><em>Universal dynamics</em> names the two principles proposed as operating at every scale of reality – from physics and life to minds, societies and civilisations – and so as a common basis for understanding them. <em>Emergentism</em> holds that as parts organise into wholes, new properties, behaviours and laws arise at each level that are not present in the parts and cannot simply be read off from them: molecules from atoms, life from chemistry, mind from neurons, society from persons. <em>Cyberneticism</em> holds that systems at every level maintain and steer themselves through feedback – sensing their state, comparing it with a goal and correcting deviations – so that regulation, adaptation and purpose-like behaviour are general features of organised systems rather than peculiarities of living or thinking things. Together they describe a universe that builds itself upwards through levels of emergence and holds each level together through cybernetic regulation – the framework within which a <a href="#civilisation-theory">civilisation theory</a> can place civilisation alongside other complex adaptive systems. See <a href="#emergence">emergence</a>, <a href="#cybernetics">cybernetics</a> and <a href="#complex-adaptive-system">complex adaptive system</a>.</p>'
    },
    {
      id: 'polycrisis',
      title: 'Polycrisis',
      html: '<p>A <em>polycrisis</em> is a condition in which multiple crises – ecological, economic, geopolitical, technological – interact so that their combined effect is greater than the sum of their parts. The term was introduced by Edgar Morin and Anne Brigitte Kern in <em>Homeland Earth</em> (1993) and popularised by the historian Adam Tooze in the early 2020s. Where the polycrisis describes how crises entangle and cascade, the <a href="#metacrisis">metacrisis</a> asks why they arise together at all: the polycrisis is the surface pattern, the metacrisis its underlying cause.</p>'
    },

    {
      id: 'epistemic-crisis',
      title: 'Epistemic Crisis',
      html: '<p>The <em>epistemic crisis</em> is the breakdown of a society’s capacity to make sense of the world together: to establish shared facts, reason through disagreement, and arrive at collective choices. It is driven by an information ecology optimised for attention rather than understanding, by the weaponisation of information in rivalrous competition, and by the sheer complexity of the problems to be understood. It is also self-reinforcing: the more a society’s shared understanding degrades, the harder it becomes to agree on what has gone wrong with it. Walter Lippmann described the underlying gap – between the world and “the pictures in our heads” – a century ago in <em>Public Opinion</em> (1922); one response is to renew the shared concepts themselves, as in a <a href="#conceptual-adaptive-system">conceptual adaptive system</a>.</p>'
    },
    {
      id: 'dominant-paradigm',
      title: 'Dominant Civilisational Paradigm',
      html: '<p>The <em>dominant paradigm</em> is the set of shared assumptions – about value, progress, nature, the self and the good life – out of which a civilisation’s institutions arise, and which usually goes unexamined because it is taken as reality itself. The term draws on Thomas Kuhn’s account of paradigms in <em>The Structure of Scientific Revolutions</em> (1962), while Donella Meadows (1999) identified the paradigm as one of the highest leverage points for changing any system. The present paradigm of growth, competition and extraction can be read as one of the origins of the <a href="#metacrisis">metacrisis</a>, alongside civilisation’s developmental process and initial conditions.</p>'
    },



    {
      id: 'civilisation-transition',
      title: 'Civilisational Transition',
      kind: 'category',
      order: 3,
      parent: 'theproject',
      html: '<p><em>Civilisation transition</em> is the process of moving from the present civilisation to a designed one: the path, rather than the destination, of <a href="#civilisation-design">civilisation design</a>. A viable transition must remain functional at every stage, keeping people fed, housed and governed while the underlying structures change, and must avoid both failure modes of <a href="#existential-risk">existential risk</a> along the way – collapse into destruction, or capture by concentrated power. Transition is therefore a design problem in its own right, rather than something that follows automatically from a good blueprint.</p>'
    },
    {
      id: 'systems-theory',
      title: 'Systems Theory',
      html: '<p><em>Systems theory</em> is the study of wholes – how interacting parts give rise to behaviour that none of them has alone. Developed through Ludwig von Bertalanffy’s general system theory, Norbert Wiener’s cybernetics (1948) and later work such as Donella Meadows’s <em>Thinking in Systems</em> (2008), it is concerned with feedback loops, stocks and flows, emergence, self-organisation and resilience. Its founding move, in Ludwig von Bertalanffy’s general systems theory of the 1940s and 1950s, was to look for principles – feedback, hierarchy, equifinality – that hold across physics, biology and society alike.</p>'
    },
    {
      id: 'viable-system-model',
      title: 'Viable System Model',
      html: '<p>The <em>viable system model</em> is Stafford Beer’s cybernetic model of any system able to maintain its identity and survive in a changing environment. Set out in <em>Brain of the Firm</em> (1972), it describes five interacting functions – operations, coordination, control, intelligence and policy – repeated recursively at every scale, so that each viable system contains and is contained by others. Beer applied it to national economic management in Chile’s Project Cybersyn (1971–73). Its recursive structure – every viable system contains, and is contained by, other viable systems – makes it one of the few models of organisation that scales from a workshop to a state.</p>'
    },
    {
      id: 'evolutionary-theory',
      title: 'Evolutionary Theory',
      html: '<p><em>Evolutionary theory</em> explains how complex forms arise through variation, selection and inheritance, without any designer. Beginning with Charles Darwin’s <em>On the Origin of Species</em> (1859), it has since been extended from genes to cultures, technologies and institutions. Applied to societies, it asks which selection pressures have favoured some social forms over others – and warns that what wins in competition is not necessarily what is good for its members or able to endure.</p>'
    },
    {
      id: 'critical-theory',
      title: 'Critical Theory',
      html: '<p><em>Critical theory</em> is the tradition of social theory that examines society in order to change it, exposing the forms of power and ideology that present particular arrangements as natural or inevitable. It originated with the Frankfurt School – Max Horkheimer’s essay “Traditional and Critical Theory” (1937), Theodor Adorno, Herbert Marcuse and later Jürgen Habermas. Its central claim is that social arrangements presented as natural or inevitable are historical, and so can be changed – and that criticism worth the name aims at freeing people, not only at describing them.</p>'
    },
    {
      id: 'game-theory',
      title: 'Game Theory',
      html: '<p><em>Game theory</em> is the formal study of strategic interaction: how the outcome for each actor depends on the choices of all the others. Founded by John von Neumann and Oskar Morgenstern in <em>Theory of Games and Economic Behavior</em> (1944) and extended by John Nash’s concept of equilibrium (1950), it distinguishes zero-sum from positive-sum games and shows how individually rational choices can produce collectively irrational outcomes. Its best-known results – the <a href="#prisoners-dilemma">prisoner’s dilemma</a>, the <a href="#tragedy-of-the-commons">tragedy of the commons</a>, the Nash equilibrium – show how individually rational choices can combine into outcomes no one wants, and what repetition, rules or trust allow players to escape them.</p>'
    },
    {
      id: 'metamodernism',
      title: 'Metamodernism',
      kind: 'category',
      order: 6,
      parent: 'theproject',
      html: '<p><em>Metamodernism</em> is a cultural and philosophical sensibility that moves beyond postmodernism without returning to modernism: it holds the modern capacity for sincerity, hope and grand projects together with the postmodern awareness of irony, context and multiple perspectives. The term was introduced by Timotheus Vermeulen and Robin van den Akker (2010), and developed politically by Hanzi Freinacht in <em>The Listening Society</em> (2017). Its characteristic mood is what Timotheus Vermeulen and Robin van den Akker called an oscillation: sincere commitment to large aims, held together with an ironic awareness of their limits.</p>'
    },
    {
      id: 'conceptual-adaptive-system',
      title: 'Conceptual Adaptive System',
      coined: true,
      html: '<p>A <em>conceptual adaptive system</em> is a body of concepts designed to evolve in response to what it helps to understand, as a complex adaptive system evolves in response to its environment. It rests on the insight, going back to Alfred Korzybski’s “a map is not the territory” (1933), that the concepts through which we see the world shape which problems we can perceive and which solutions we can imagine. A glossary built this way is a response to the <a href="#epistemic-crisis">epistemic crisis</a>, on the premise that for civilisation to adapt, its concepts must adapt first.</p>'
    },
    {
      id: 'exponential-technology',
      title: 'Exponential Technology',
      html: '<p><em>Exponential technology</em> is technology whose capabilities grow at a compounding rate, as each generation of tools accelerates the development of the next. Computation, artificial intelligence, synthetic biology and automation are the clearest cases. Its effect is less to create new kinds of conflict than to raise the stakes of old ones: rivalries that once caused local or reversible harm now operate with planetary, and potentially irreversible, power. Moore’s law in computing, the collapsing cost of genome sequencing and the scaling of AI models are its standard examples; the governing difficulty is that law, ethics and institutions change at a linear pace at best.</p>'
    },
    {
      id: 'planetary-boundaries',
      title: 'Crossing Planetary Boundaries',
      html: '<p><em>Planetary boundaries</em> are the limits of nine Earth-system processes – including climate change, biosphere integrity, land-system change and biogeochemical flows – within which humanity can continue to develop safely. The framework was introduced by Johan Rockström and colleagues in 2009, and a 2023 assessment found six of the nine boundaries already transgressed. In their 2023 update, the framework’s authors reported that six of the nine boundaries – including climate change, biosphere integrity and the flows of nitrogen and phosphorus – had already been crossed.</p>'
    },
    {
      id: 'moloch',
      refs: ['Scott Alexander, “Meditations on Moloch”, <em>Slate Star Codex</em> (2014).', 'Allen Ginsberg, <em>Howl and Other Poems</em> (1956).'],
      title: 'Moloch: God of Game-Theory',
      html: '<p><em>Moloch</em> is a personification of the <a href="#multipolar-trap">multipolar trap</a>: the impersonal force by which competition sacrifices every value that does not contribute to winning. The name comes from Allen Ginsberg’s poem <em>Howl</em> (1956) and was given its current sense by Scott Alexander’s essay <em>Meditations on Moloch</em> (2014), which describes how arms races, market pressures and evolutionary selection each drive actors to trade away what they care about for competitive advantage. To speak of Moloch is to recognise that no one needs to intend a harmful outcome for a system to produce it.</p>'
    },
    {
      id: 'race-to-the-bottom',
      title: 'Race to the Bottom',
      html: '<p>A <em>race to the bottom</em> is a form of <a href="#multipolar-trap">multipolar trap</a> in which competitors progressively lower their standards – on wages, taxes, safety, environmental protection or ethics – to gain an advantage over one another. Since any actor that holds to a higher standard loses ground, each is pushed downwards regardless of its intentions. Familiar examples include jurisdictions competing to attract capital with lower taxes and weaker regulation, and firms competing on cost by externalising harm. The race can only be halted by changing the rules of competition for all actors at once – a <a href="#coordination-problem">coordination problem</a>.</p>'
    },
    {
      id: 'third-attractor',
      title: 'The Third Attractor: Alignment',
      ref: 'Schmachtenberger',
      html: '<p>The <em>third attractor</em> is the name given, in the work of Daniel Schmachtenberger and others, to a civilisational trajectory that avoids both of the default attractors of <a href="#existential-risk">existential risk</a>: <a href="#first-attractor">catastrophe</a>, arising from uncoordinated power, and <a href="#second-attractor">dystopia</a>, arising from the control imposed to prevent it. It describes a civilisation able to coordinate at the scale of its technology without centralising unaccountable power – combining the order that prevents collapse with the freedom that prevents tyranny. What it would look like is deliberately left open: the term marks a direction – power matched by wisdom, coordination without coercion – rather than a blueprint.</p>'
    },
    {
      id: 'sensemaking-and-choicemaking',
      title: 'Sensemaking and Choicemaking',
      html: '<p><em>Sensemaking and choicemaking</em> are the two capacities on which a civilisation’s ability to respond to its situation depends: <a href="#sensemaking">sensemaking</a>, its capacity to understand the world and itself – to establish what is true, what matters and what is likely to happen – and choicemaking, its capacity to decide and act together on that understanding, through the institutions, processes and cultures by which it coordinates collective action. The framing, associated with Daniel Schmachtenberger and the Consilience Project, places them at the centre of the <a href="#metacrisis">metacrisis</a>. As <a href="#exponential-technology">exponential technology</a> multiplies humanity’s power to affect the world, and with it the scale of <a href="#existential-risk">existential risk</a>, the capacities to make sense of that power and to choose how to use it have not kept pace; they have instead been degraded by polarisation, the attention economy and the breakdown of shared institutions of knowledge. A civilisation whose power outstrips its sensemaking and choicemaking cannot steward that power safely; restoring and upgrading both is a precondition of every other response. See <a href="#epistemic-crisis">epistemic crisis</a> and <a href="#the-wisdom-gap">the wisdom gap</a>.</p>'
    },
    {
      id: 'choicemaking',
      title: 'Choicemaking',
      html: '<p><em>Choicemaking</em> is the capacity of a group, institution or society to decide and act together: to turn a shared understanding of its situation into collective choices, and to carry them through. It is the counterpart of <a href="#sensemaking">sensemaking</a>, which supplies the understanding; choicemaking depends on the processes – deliberation, voting, markets, law, governance – and the cultures of trust and legitimacy through which people with different interests and values reach decisions they will abide by. A society can understand its problems and still fail to act on them if its choicemaking is captured, gridlocked or too slow for the pace of change; as the power of technology grows, the quality of collective choicemaking becomes decisive for whether that power is used wisely. See <a href="#sensemaking-and-choicemaking">sensemaking and choicemaking</a> and <a href="#social-choice-and-mechanism-design">social choice theory</a>.</p>'
    },
    {
      id: 'sensemaking',
      title: 'Sensemaking',
      html: '<p><em>Sensemaking</em> is the process by which individuals and groups construct an understanding of their situation, so that they can act within it. The term was developed in organisational theory by Karl Weick (1995), and has since been used more broadly for the collective capacity of a society to perceive reality accurately, reason about it together and make good choices. Weick’s own examples were often disasters – most famously the Mann Gulch fire of 1949, in which a firefighting crew’s shared picture of their situation fell apart – which is why the idea now serves for whole societies whose shared picture of reality is breaking down (see <a href="#epistemic-crisis">epistemic crisis</a>).</p>'
    },
    {
      id: 'situational-attunement',
      title: 'Situational Attunement',
      coined: true,
      html: '<p><em>Situational attunement</em> is derived from <em>situational awareness</em> – in Mica Endsley’s classic account, the perception of the elements of a situation, the comprehension of their meaning and the projection of their future state, a notion honed in aviation and military command and since carried over to the strategic outlook on artificial intelligence.</p><p>Awareness in this sense is a detached, observational stance: a picture of the situation held by an operator who stands outside it. Attunement names what awareness leaves out – being in tune with a situation rather than merely informed about it: registering what matters and why, sensing its mood and direction, and responding from within it as a participant whose own orientation is part of what is being read.</p><p>It draws on Heidegger’s <em>Befindlichkeit</em>, our always already being attuned to a world, and on the idea of relevance realisation, the capacity to pick out, from everything that could be noticed, what is actually significant.</p><p>For a civilisation, the claim is that more awareness – more data, more monitoring, more forecasting – is not enough: what is needed is the capacity to be attuned to the situation as a whole, and so to act well within it. It is a component of collective <a href="#sensemaking">sensemaking</a> and a remedy for the <a href="#epistemic-crisis">epistemic crisis</a>.</p>'
    },
    {
      id: 'attention-economy',
      title: 'Attention Economy',
      html: '<p>The <em>attention economy</em> is the economic system in which human attention is the scarce resource that platforms and media compete to capture and sell. Herbert Simon observed in 1971 that “a wealth of information creates a poverty of attention”, and the term itself was popularised by Michael Goldhaber in the late 1990s. Because engagement rather than understanding is rewarded, the attention economy favours content that provokes outrage, fear and tribal identity – making it a <a href="#race-to-the-bottom">race to the bottom</a> among competing platforms and a principal driver of polarisation.</p>'
    },
    {
      id: 'prisoners-dilemma',
      title: 'Prisoner’s Dilemma',
      html: '<p>The <em>prisoner’s dilemma</em> is the canonical game in <a href="#game-theory">game theory</a> in which two players each gain by defecting against the other, yet both end up worse off than if they had cooperated. First formalised by Merrill Flood and Melvin Dresher at the RAND Corporation in 1950 and named by Albert Tucker, it shows how individually rational choices can produce collectively irrational outcomes. Robert Axelrod’s <em>The Evolution of Cooperation</em> (1984) showed how cooperation can emerge when the game is repeated. The <a href="#multipolar-trap">multipolar trap</a> generalises the dilemma to many players.</p>'
    },
    {
      id: 'tragedy-of-the-commons',
      title: 'Tragedy of the Commons',
      html: '<p>The <em>tragedy of the commons</em> is the depletion of a shared resource by individuals who each benefit fully from using more of it while bearing only a fraction of the cost. It was set out by Garrett Hardin in 1968, who concluded that commons must be either privatised or regulated by the state. Elinor Ostrom’s <em>Governing the Commons</em> (1990) showed a third possibility: communities that successfully manage shared resources through their own institutions. The tragedy is a many-player form of the <a href="#prisoners-dilemma">prisoner’s dilemma</a>, and Ostrom’s answer informs the design of the <a href="#commons">commons</a>.</p>'
    },
    {
      id: 'coordination-problem',
      title: 'Coordination Problem',
      html: '<p>A <em>coordination problem</em> is a situation in which all actors would be better off acting together, but none can do so alone: a better outcome exists, but reaching it requires that everyone move at once, or that each can trust the others to follow. They range from the trivial – which side of the road to drive on, settled once by convention – to the intractable: fisheries, emissions and arms control, where every party gains from agreement but each is tempted to defect. Thomas Schelling’s <em>The Strategy of Conflict</em> (1960) and Elinor Ostrom’s work on the <a href="#commons">commons</a> remain the classic accounts of how such problems actually get solved.</p>'
    },
    {
      id: 'cybernetics',
      title: 'Cybernetics',
      html: '<p><em>Cybernetics</em> is the science of control and communication in animals and machines, as Norbert Wiener defined it in his book of that name (1948). It studies how systems regulate themselves through <a href="#feedback-loop">feedback</a> – sensing the effects of their actions and adjusting accordingly – and was developed by W. Ross Ashby, Heinz von Foerster, Gregory Bateson and Stafford Beer, among others. Cybernetics underpins a lineage of cybernetic approaches to economics and governance, and Beer’s <a href="#viable-system-model">viable system model</a> is its application to the organisation of societies.</p>'
    },
    {
      id: 'requisite-variety',
      title: 'Requisite Variety',
      html: '<p>The <em>law of requisite variety</em>, formulated by W. Ross Ashby in <em>An Introduction to Cybernetics</em> (1956), states that a regulator can only control a system if it has at least as much variety – as many possible responses – as the disturbances it must counter; in Ashby’s phrase, “only variety can destroy variety”. Applied to institutions, it implies that a regulator designed for a slower and simpler world cannot govern a faster and more complex one, however good its intentions. Governance must therefore gain variety – through distributed, adaptive and <a href="#viable-system-model">recursive</a> structures – rather than simply more central control.</p>'
    },
    {
      id: 'feedback-loop',
      title: 'Feedback Loop',
      html: '<p>A <em>feedback loop</em> is a circular chain of cause and effect in which the output of a system returns as an input that influences its future behaviour. Balancing (negative) feedback counteracts change and keeps a system stable, as a thermostat does; reinforcing (positive) feedback amplifies change, producing growth, collapse or runaway escalation. Arms races, compound interest and viral content are reinforcing loops; thermostats, prices and predator–prey cycles are balancing ones – and much of systems thinking consists in asking which balancing loop a runaway process is missing.</p>'
    },
    {
      id: 'emergence',
      title: 'Emergence',
      html: '<p><em>Emergence</em> is the appearance, in a system of interacting parts, of properties or behaviours that belong to the whole and cannot be found in any part alone – as consciousness emerges from neurons, or traffic jams from individual drivers. It is central to <a href="#systems-theory">systems theory</a> and the study of <a href="#complex-adaptive-system">complex adaptive systems</a>. Flocking birds, traffic jams and market prices are standard examples: each is produced by individuals following local rules, yet none can be found in any of them – which is also why emergent outcomes can be harmful without anyone having intended them.</p>'
    },
    {
      id: 'complex-adaptive-system',
      title: 'Complex Adaptive System',
      html: '<p>A <em>complex adaptive system</em> is a system of many interacting agents that adapt to one another and to their environment, so that the system as a whole learns and evolves – ecosystems, economies, immune systems and civilisations are examples. The concept was developed at the Santa Fe Institute, notably by John Holland. Such systems exhibit <a href="#emergence">emergence</a>, self-organisation and non-linear change, and cannot be controlled from above in the way that complicated machines can. Civilisation itself can be understood as a complex adaptive system, and the <a href="#conceptual-adaptive-system">conceptual adaptive system</a> takes its name from the idea.</p>'
    },
    {
      id: 'leverage-points',
      title: 'Leverage Points',
      html: '<p><em>Leverage points</em> are places within a system where a small intervention can produce large changes in its behaviour. In her essay “Leverage Points: Places to Intervene in a System” (1999), Donella Meadows ranked twelve such points, from the weakest – parameters such as taxes and subsidies – to the strongest: the goals of the system, the <a href="#dominant-paradigm">paradigm</a> out of which it arises, and the power to transcend paradigms altogether. On this view the deepest leverage lies at the level of paradigm, while the shallowest – parameters such as taxes, subsidies and standards – is where most policy effort goes.</p>'
    },
    {
      id: 'resilience',
      title: 'Resilience',
      html: '<p><em>Resilience</em> is the capacity of a system to absorb disturbance and reorganise while retaining its essential function, structure and identity. The concept was introduced to ecology by C. S. Holling (1973), who distinguished it from mere stability: a resilient system may change a great deal while persisting, whereas an efficient but brittle one may fail suddenly. There is usually a trade-off with efficiency: redundancy, diversity and slack look wasteful in normal times, which is why systems optimised for efficiency – just-in-time supply chains are the textbook case – tend to be fragile when the shock arrives.</p>'
    },
    {
      id: 'project-cybersyn',
      title: 'Project Cybersyn',
      html: '<p><em>Project Cybersyn</em> was a Chilean project (1971–73) to manage the nationalised economy in real time using cybernetic principles, designed by Stafford Beer at the invitation of Salvador Allende’s government, with Fernando Flores. It linked factories to a central operations room through a network of telex machines, using Beer’s <a href="#viable-system-model">viable system model</a> to balance local autonomy with national coordination. The project was ended by the military coup of 1973. It remains a reference point in cybernetic economics as an early attempt at computer-assisted, non-authoritarian economic coordination.</p>'
    },
    {
      id: 'cultural-evolution',
      title: 'Cultural Evolution',
      html: '<p><em>Cultural evolution</em> is the application of <a href="#evolutionary-theory">evolutionary theory</a> to culture: the idea that beliefs, practices, technologies and institutions vary, are selected and are transmitted between people, and so change over time in ways analogous to biological evolution. It was developed by Robert Boyd and Peter Richerson (1985), among others. Its sobering lesson is that cultural forms spread for reasons of transmissibility and competitive success, which need not coincide with their being good for the people who hold them.</p>'
    },
    {
      id: 'multilevel-selection',
      title: 'Multilevel Selection',
      html: '<p><em>Multilevel selection</em> is the view that natural selection operates at several levels at once – on genes, individuals and groups – and that these levels can pull in opposite directions. David Sloan Wilson and E. O. Wilson (2007) summarised it: “selfishness beats altruism within groups; altruistic groups beat selfish groups”. It explains how cooperation can evolve despite the advantage of defection, in David Sloan Wilson and E. O. Wilson’s summary (2007): “selfishness beats altruism within groups; altruistic groups beat selfish groups.”</p>'
    },
    {
      id: 'selection-pressure',
      title: 'Selection Pressure',
      html: '<p>A <em>selection pressure</em> is any feature of an environment that favours some variants over others, and so shapes what survives and spreads. The concept comes from biology but applies equally to firms in markets, states in geopolitical competition and ideas in the <a href="#attention-economy">attention economy</a>. The selection pressures built into the present civilisation – for growth, power and engagement – reward behaviours whose costs fall on others or on the future. Changing outcomes durably requires changing the pressures, not merely the actors who respond to them.</p>'
    },
    {
      id: 'hegemony',
      title: 'Cultural Hegemony',
      html: '<p><em>Hegemony</em>, in Antonio Gramsci’s sense, is the rule of a dominant group through consent rather than force: its interests and worldview come to be accepted as common sense by society as a whole. Gramsci developed the concept in his <em>Prison Notebooks</em> (1929–35), and it became central to <a href="#critical-theory">critical theory</a> and cultural studies. It explains how a social order can reproduce itself without needing to be imposed, and why lasting change involves a contest over meaning and common sense as well as over institutions.</p>'
    },
    {
      id: 'ideology',
      title: 'Ideology',
      html: '<p>An <em>ideology</em> is a system of ideas and beliefs that shapes how a society understands itself, and that, in the critical tradition, serves to present particular social arrangements as natural, necessary or just. The concept was given its critical meaning by Karl Marx and Friedrich Engels in <em>The German Ideology</em> (1846), and developed through <a href="#hegemony">Gramsci</a>, the Frankfurt School and later thinkers. Ideology critique, from Marx through the Frankfurt School to Slavoj Žižek, is one of the core tools of <a href="#critical-theory">critical theory</a>; its sharpest target is any claim that a given order has no alternative.</p>'
    },
    {
      id: 'colonisation-of-the-lifeworld',
      title: 'Colonisation of the Life-World',
      html: '<p>The <em>colonisation of the lifeworld</em> is Jürgen Habermas’s term, from <em>The Theory of Communicative Action</em> (1981), for the process by which the logics of money and administrative power – the “system” – penetrate areas of life that depend on mutual understanding, such as family, education, culture and public debate. As these areas come to be governed by markets and bureaucracy, meaning, solidarity and democratic agency are eroded. Habermas’s remedy is not to abolish markets or bureaucracy but to keep them within limits set from the lifeworld – with democratic deliberation, not money or power, deciding what they are for.</p>'
    },
    {
      id: 'dialectics',
      title: 'Dialectics',
      html: '<p><em>Dialectics</em> is a method of reasoning that understands ideas and societies as developing through contradiction – as opposing tendencies conflict and are resolved in a higher form that preserves something of each. Associated above all with G. W. F. Hegel, and turned by Marx towards material and social history, it is foundational to <a href="#critical-theory">critical theory</a>. A dialectical synthesis seeks not to choose between competing traditions, but to resolve their contradictions into a more comprehensive understanding.</p>'
    },
    {
      id: 'resource-based-economy',
      title: 'Resource-Based Economy',
      html: '<p>A <em>resource-based economy</em> is Jacque Fresco’s proposal for a socio-economic system in which goods and services are provided without money, barter or debt, by managing the Earth’s resources directly through technology and scientific method. Developed through Fresco’s Venus Project, it envisages automated production, the careful accounting of available resources, and the provision of necessities to all. It belongs to the lineage of cybernetic economics, and is a precedent for rethinking <a href="#critical-political-economy">political economy</a> in light of <a href="#post-scarcity">post-scarcity</a> technology.</p>'
    },
    {
      id: 'commons',
      title: 'Commons',
      html: '<p>A <em>commons</em> is a resource held and managed collectively by a community, according to rules its members make for themselves, rather than by the market or the state. Elinor Ostrom’s <em>Governing the Commons</em> (1990) identified the design principles by which commons can endure, answering the <a href="#tragedy-of-the-commons">tragedy of the commons</a>. The idea has been extended to knowledge and software, as in Yochai Benkler’s account of commons-based peer production. The commons offers a form of <a href="#critical-political-economy">political economy</a> that is neither market nor state, and a model for coordination without centralisation.</p>'
    },
    {
      id: 'design-science',
      title: 'Design Science Revolution',
      html: '<p><em>Design science</em> – in full, “comprehensive anticipatory design science” – is Buckminster Fuller’s approach to solving humanity’s problems by redesigning its tools and systems rather than by reforming people or politics. Fuller called the change it would bring the <em>design science revolution</em>: a revolution carried out by artefacts rather than by political struggle, following his dictum to “reform the environment, not man”. He argued in <em>Operating Manual for Spaceship Earth</em> (1969) that the planet’s resources, used efficiently, could support all of humanity, and that the task was to make the world work for everyone through design. Its best-known application was the World Game, Fuller’s proposal to treat the planet’s resources as a puzzle to be solved for “100% of humanity” – played in workshops and classrooms from the late 1960s.</p>'
    },
    {
      id: 'post-scarcity',
      title: 'Post-Scarcity Economics',
      html: '<p><em>Post-scarcity</em> describes a condition in which the basic goods people need can be produced in abundance, with minimal human labour, so that scarcity no longer organises economic life. It is associated with the potential of automation, renewable energy and advanced manufacturing, and was anticipated by thinkers from Buckminster Fuller to Jacque Fresco. Post-scarcity is a possibility opened by <a href="#infra-structure">technological infrastructure</a> but blocked by an existing <a href="#critical-political-economy">political economy</a> that depends on scarcity – and so a question of design rather than technology alone.</p>'
    },
    {
      id: 'capitalist-realism',
      title: 'Capitalist Realism',
      refs: ['Mark Fisher, <em>Capitalist Realism: Is There No Alternative?</em> (2009).'],
      html: '<p><em>Capitalist realism</em> is Mark Fisher’s term, from <em>Capitalist Realism: Is There No Alternative?</em> (2009), for the widespread sense that capitalism is not only the sole viable political and economic system but that it is now impossible even to imagine a coherent alternative to it. Taking up the line, attributed to Fredric Jameson and Slavoj Žižek, that “it is easier to imagine the end of the world than the end of capitalism”, Fisher describes capitalist realism as a pervasive atmosphere that conditions culture, work and education, and that shows itself in widespread depression and a sense of reflexive impotence. See <a href="#post-capitalist-realism">post-capitalist realism</a> and <a href="#hypernormalisation">hypernormalisation</a>.</p>'
    },
    {
      id: 'process-philosophy',
      title: 'Process Philosophy',
      refs: ['Alfred North Whitehead, <em>Process and Reality</em> (1929).'],
      html: '<p><em>Process philosophy</em> holds that reality is made up of processes – events, change and becoming – rather than of enduring things or substances. Its roots run back to Heraclitus, and it was developed in the twentieth century by Henri Bergson and above all Alfred North Whitehead, whose <em>Process and Reality</em> (1929) describes the world as a web of interrelated “actual occasions” of experience. Process thought has been taken up in theology, ecology and systems thinking, and is an important source for integral and metamodern metaphysics.</p>'
    },
    {
      id: 'idealism',
      title: 'Idealism',
      refs: ['George Berkeley, <em>A Treatise Concerning the Principles of Human Knowledge</em> (1710).', 'G. W. F. Hegel, <em>The Phenomenology of Spirit</em> (1807).'],
      html: '<p><em>Idealism</em> is the family of metaphysical views holding that reality is fundamentally mental, or that it is inseparable from the mind that knows it. Its forms range from George Berkeley’s subjective idealism, in which to be is to be perceived, through Immanuel Kant’s transcendental idealism, which limits knowledge to the world as it appears to us, to G. W. F. Hegel’s absolute idealism, in which reality is the self-unfolding of spirit. It has been revived in contemporary philosophy of mind as an alternative to physicalism, for example in Bernardo Kastrup’s analytic idealism. See <a href="#historical-idealism">historical idealism</a>.</p>'
    },
    {
      id: 'relevance-realisation-and-combinatorial-explosion',
      title: 'Relevance Realisation & Combinatorial Explosion',
      refs: ['John Vervaeke, Timothy P. Lillicrap and Blake A. Richards, “Relevance Realization and the Emerging Framework in Cognitive Science”, <em>Journal of Logic and Computation</em> 22 (2012).'],
      html: '<p><em>Combinatorial explosion</em> is the problem that the number of possible options, inferences and interpretations open to any agent grows exponentially, so that no mind or machine can search through them all. <em>Relevance realisation</em> is <a href="#john-vervaeke">John Vervaeke</a>’s name for the self-organising process by which cognition nevertheless zeroes in on what matters – what to notice, remember and do – without ever being able to define relevance in advance. For Vervaeke it lies at the root of intelligence, insight and wisdom, and its breakdown at the level of a culture is part of <a href="#the-meaning-crisis">the meaning crisis</a>. See <a href="#metarationality">metarationality</a>.</p>'
    },
    {
      id: 'epistemic-uncertainty-and-cluelessness',
      title: 'Epistemic Uncertainty & Cluelessness',
      refs: ['James Lenman, “Consequentialism and Cluelessness”, <em>Philosophy &amp; Public Affairs</em> 29 (2000).', 'Hilary Greaves, “Cluelessness”, <em>Proceedings of the Aristotelian Society</em> 116 (2016).'],
      html: '<p><em>Epistemic uncertainty</em> is uncertainty that arises from the limits of our knowledge, as distinct from the randomness of the world itself. <em>Cluelessness</em> is its sharpest form in ethics: the problem, set out by James Lenman (2000) and Hilary Greaves (2016), that the long-run consequences of our actions are so vast and unforeseeable that we may have no idea whether they make the world better or worse overall. It poses a deep challenge to any attempt to act for the long-term future, including <a href="#longtermism">longtermism</a>. See <a href="#moral-uncertainty">moral uncertainty</a>.</p>'
    },
    {
      id: 'metarationality',
      title: 'Metarationality',
      html: '<p><em>Metarationality</em> is the capacity to reason about rationality itself: to understand how, when and why formal, systematic methods work, and how to choose between or go beyond them when they do not. The term was developed by David Chapman, who describes it as neither rejecting rationality nor treating it as universally sufficient. Alongside <a href="#metamodernism">metamodernism</a>, metarationality offers a way through the <a href="#epistemic-crisis">epistemic crisis</a>: holding multiple frameworks at once, and knowing which to use for which problem.</p>'
    },
    {
      id: 'civilisational-mechanics',
      title: 'Civilisational Mechanics',
      parent: 'theproject',
      coined: true,
      kind: 'category',
      order: 1,
      html: '<p><em>Civilisational mechanics</em> is the study of how a civilisation actually works – the dynamics, incentives, feedback loops and structures that generate its behaviour over time – and of how those same mechanics produce crisis, risk and decline. Where civilisation design asks what could be built, civilisational mechanics asks what is already running, and why its outcomes so often escape anyone’s intentions.</p>' +
        '<p>The term is a conceptual engineering, derived from three sources. From <em>celestial mechanics</em>, the branch of physics that explains the motions of bodies under the forces acting on them, it takes the ambition of explaining a system’s trajectory from the forces that drive it. From <em>generative mechanisms</em> in critical realism – the underlying causal processes that produce observable patterns – it takes the insistence that what matters lies beneath the events: the structures that generate them. And from <em>civilisational dynamics</em> it takes its object: civilisation as a system whose behaviour unfolds over time.</p>' +
        '<p>A parallel framing is <em>world-system dynamics</em>, which joins Immanuel Wallerstein’s <em>world-system</em> to the <em>system dynamics</em> of complex systems theory (see <a href="#complex-world-system-dynamics">complex world-system dynamics</a>). <em>Civilisational dynamics</em> is itself a term in current use: by the Centre for Research into the Dynamics of Civilisation at UCL, and by the Alignment of Complex Systems Research Group, whose work on “post-AGI civilisational dynamics” asks how civilisation will behave once advanced AI systems are among its agents.</p>'
    },
    {
      id: 'post-capitalism',
      title: 'Post-Capitalism',
      order: 2,
      html: '<p>Economic alternatives to the present system: post-capitalist and post-scarcity economics, socialist and heterodox traditions, and frameworks for positive-sum economic life.</p>'
    },
    {
      id: 'theories-of-technology',
      title: 'Theories of Technology',
      order: 2000,
      html: '<p>Frameworks for understanding the relationship between technology and society – from technology as an autonomous driver of history to technology as socially constructed, and from networks of human and non-human actors to the agency of matter itself.</p>'

    {

      title: 'AI-Exterminism',
      coined: true,
      ref: 'Thompson (Exterminism)',
      html: '<p><em>AI-exterminism</em> extends E. P. Thompson’s notion of “exterminism” – a civilisation whose institutions are organised around the capacity for mass destruction – to artificial intelligence. It names a trajectory in which the competitive development of ever more capable AI systems, pursued because no actor can afford to stop, drives towards outcomes that could disempower or destroy humanity, whether or not anyone intends them.</p>'
    },
    {

      title: 'Neomechanisation & Autonomisation',
      coined: true,
      html: '<p><em>Neomechanisation and autonomisation</em> describe a new phase of mechanisation in which machines take over not only physical labour but cognition, judgement and decision-making, and increasingly act without human direction. Where industrial mechanisation replaced muscle, this second wave replaces agency itself, transferring functions of the economy, the state and warfare to autonomous systems.</p>'
    },
    {

      title: 'Hyper-Agents of Doom',
      coined: true,
      html: '<p><em>Hyper-agents of doom</em> are actors – corporations, states or AI systems – whose power to act on the world vastly exceeds that of individuals, and whose goals are narrowly optimised in ways indifferent to human welfare. Because such agents wield world-altering capabilities under competitive pressure, their ordinary pursuit of advantage can produce catastrophic outcomes.</p>'
    },
    {

      title: 'Evolutionary Process Alignment & The Replicators Alignment Problem',
      coined: true,
      html: '<p>The <em>replicator alignment problem</em> generalises AI alignment to any self-replicating system – genes, memes, firms, institutions or machines – whose success is measured by its own propagation. Such replicators are selected for spreading, not for serving the people who host them, so aligning them with human flourishing is a structural problem that long predates artificial intelligence.</p>'
    },
    {
      id: 'reverse-extended-mind-thesis',
      title: 'Reverse Extended Mind Thesis (R-EMT)',
      refs: ['Andy Clark and David Chalmers, “The Extended Mind”, <em>Analysis</em> 58 (1998).'],
      html: '<p>The <em>reverse extended mind thesis</em> (R-EMT) inverts Andy Clark and David Chalmers’s extended mind thesis (1998). Where they argued that the human mind extends beyond the skull into the notebooks, devices and tools that take part in its thinking, R-EMT considers the opposite direction: that the cognition of large non-human systems – markets, platforms, algorithms – extends into human beings, using their attention, judgement and labour as parts of its own cognitive process. From the standpoint of <a href="#critical-alien-phenomenology">critical alien phenomenology</a>, people become the extended mind of the system, rather than the system the extended mind of people. See <a href="#loop-in-the-human">loop in the human</a>.</p>'
    },
    {
      id: 'reverse-prosthesis',
      title: 'Reverse Prosthesis',
      refs: ['Marshall McLuhan, <em>Understanding Media: The Extensions of Man</em> (1964).'],
      html: '<p>A <em>reverse prosthesis</em> inverts the classic view of technology as a prosthesis – an artificial extension of the human body and senses, as in Marshall McLuhan’s “extensions of man” (1964). Here it is the human who becomes the prosthesis: an attachment through which a technological system extends its reach into the world, supplying the hands, eyes, judgement or legitimacy it lacks – as when workers serve as the physical actuators of algorithmic management, or users as the sensors of a platform. See <a href="#reverse-extended-mind-thesis">reverse extended mind thesis</a> and <a href="#inverse-instrumentality">inverse instrumentality</a>.</p>'
    },
    {
      id: 'inverse-instrumentality',
      title: 'Inverse Instrumentality',
      refs: ['Martin Heidegger, “The Question Concerning Technology” (1954).'],
      html: '<p><em>Inverse instrumentality</em> names the reversal of the instrumental relation between people and their technologies. On the instrumental view, technology is a means to human ends; under inverse instrumentality, human beings become the means by which technological and economic systems pursue their own ends – optimised, directed and deployed as resources, in the sense of what Heidegger called “standing-reserve”. The question of who is the tool and who the user is turned around. See <a href="#reverse-prosthesis">reverse prosthesis</a> and <a href="#critical-alien-phenomenology">critical alien phenomenology</a>.</p>'
    },
    {
      id: 'loop-in-the-human',
      title: 'Loop in the Human',
      coined: true,
      html: '<p><em>Loop in the human</em> inverts the familiar phrase “human in the loop”. Rather than humans overseeing automated systems, algorithmic loops – feedback cycles of recommendation, prediction and optimisation – come to run through human attention, behaviour and belief, so that people become components executing a system’s logic rather than supervisors of it.</p>'
    },
    {
      id: 'drone-warfare-utilitarianism',
      title: 'Drone Warfare Utilitarianism',
      coined: true,
      html: '<p><em>Drone warfare utilitarianism</em> reads utilitarianism itself as an ethics of drone warfare. Like the drone operator who selects targets from a screen thousands of miles away, the utilitarian calculator views the world from above and at a distance: persons become data points, harms and benefits become quantities to be aggregated, and lives are traded against one another by an expected-value calculus that never has to meet the faces of those it weighs. The distance that makes the calculation possible is the same distance that makes it frictionless – sparing the calculator the moral weight of what is decided, and licensing “acceptable” losses wherever the numbers favour them. The critique applies with particular force to the long-run, large-scale reasoning of <a href="#longtermism">longtermism</a> and <a href="#effective-altruism">effective altruism</a>, which operate at the greatest possible remove from the people their conclusions affect. See <a href="#tyranny-of-the-cosmic-majority">tyranny of the cosmic majority</a> and <a href="#future-utility-monster">future utility monster</a>.</p>'

      ref: 'Chalmers (p-zombies)',
      html: '<p>The <em>philosophical zombie apocalypse</em> borrows the philosopher’s “zombie” – a being behaviourally identical to a person but without conscious experience – to describe a world increasingly populated by artificial agents that speak, persuade and act like people. Whether or not such systems are conscious, a society saturated by them faces deep confusion about personhood, trust and moral status.</p>'

      html: '<p><em>Darwin Among the Machines</em> is the title of Samuel Butler’s 1863 letter proposing that machines are evolving, through human hands, towards a form of life that may one day supersede us – an idea later developed in <em>Erewhon</em> (1872) and in George Dyson’s book of the same name (1997). It anticipates the view of technology as an evolutionary process with a direction of its own.</p>'
    },
    {

      title: 'Fiction',

      html: '<p>Works of fiction – novels, stories, poems and films – that illuminate the concepts of the map: imagined worlds in which its dynamics, risks and possibilities are played out, each filed under the theme it is read for.</p><!--FICTION-->'
    },
    {
      id: 'age-of-em',
      title: 'The Age of Em',
      ref: 'Hanson',
      html: '<p><em>The Age of Em</em> (2016) is Robin Hanson’s detailed forecast of a world transformed by “ems” – emulations of human brains run on computers, copied at will and working at vast speeds. Applying economics to this scenario, Hanson depicts a civilisation of near-subsistence digital workers, raising stark questions about value, labour and what survives of humanity in a competitive digital economy.</p><h2>Malthusian Catastrophe</h2><p>Hanson’s em economy is a Malthusian world in digital form. Because an em can be copied at almost no cost, any job that pays more than the cost of running a copy will attract new copies until wages fall to subsistence – the bare cost of the computing and energy needed to keep an em running. Thomas Malthus argued that population growth would always press living standards back to subsistence; industrial civilisation escaped that trap because human population could not grow as fast as productivity. Ems remove the escape: a world of easily copied minds is pulled back to the Malthusian condition, with the vast majority living at the margin of survival. See <a href="#selection-pressure">selection pressure</a> and <a href="#post-agi-society">post-AGI society</a>.</p>'
    },
    {
      id: 'the-technium',
      refs: ['Kevin Kelly, <em>What Technology Wants</em> (2010).'],
      title: 'The Technium',
      ref: 'Kelly',
      html: '<p>The <em>technium</em> is Kevin Kelly’s term, from <em>What Technology Wants</em> (2010), for the global, interconnected system of technology considered as a whole – a self-reinforcing process with tendencies of its own, extending biological evolution. The concept frames technology not as a collection of tools but as an autonomous force shaping, and shaped by, civilisation.</p>'
    },
    {
      id: 'the-stack',
      title: 'The Stack',
      ref: 'Bratton',
      refs: ['Benjamin H. Bratton, <em>The Stack: On Software and Sovereignty</em> (2015).'],
      html: '<p><em>The Stack</em> is Benjamin Bratton’s model, in <em>The Stack: On Software and Sovereignty</em> (2015), of planetary-scale computation as an accidental megastructure – a new kind of geopolitical architecture that no one designed but that now organises much of the world. Bratton describes it as six interdependent layers: Earth (energy and minerals), Cloud (data centres and platforms), City, Address (the identification of every thing and place), Interface and User. Cutting across the borders of states, the Stack produces new forms of sovereignty – platform sovereignty – in which governance is exercised through infrastructure and code rather than territory alone. See <a href="#the-black-stack">the black stack</a>, <a href="#the-red-stack">the red stack</a>, <a href="#the-green-stack">the green stack</a> and <a href="#the-technium">the technium</a>.</p>'
    },
    {
      id: 'the-red-stack',
      title: 'The Red Stack',
      ref: 'Terranova; Bratton',
      refs: ['Tiziana Terranova, “Red Stack Attack! Algorithms, Capital and the Automation of the Common” (2014), in Robin Mackay and Armen Avanessian (eds.), <em>#Accelerate: The Accelerationist Reader</em> (2014).', 'Benjamin H. Bratton, <em>The Stack: On Software and Sovereignty</em> (2015).'],
      html: '<p><em>The red stack</em> is Tiziana Terranova’s name, in “Red Stack Attack!” (2014), for a post-capitalist appropriation of <a href="#the-stack">the Stack</a> – the reorganisation of planetary computation around the common rather than capital. Terranova identifies the layers through which such a stack could be built: new forms of money and finance, platforms for social coordination, and the networks through which bodies and minds are now mediated. Where the Stack as it stands concentrates platform sovereignty in a few corporations and states, the red stack names the project of taking hold of its algorithms, protocols and infrastructures for collective ends. It is closely tied to <a href="#left-accelerationism-and-the-red-stack">left accelerationism</a>. See <a href="#the-black-stack">the black stack</a> and <a href="#the-green-stack">the green stack</a>.</p>'
    },
    {

      html: '<p><em>The green stack</em> names the ecological orientation of <a href="#the-stack">the Stack</a>: planetary-scale computation turned towards the sensing, modelling and governance of the biosphere – monitoring climate, energy and material flows, and coordinating the response to ecological crisis at the scale at which it occurs. It follows the line of Benjamin Bratton’s later work, <em>The Terraforming</em> (2019) and <em>The Revenge of the Real</em> (2021), which argues for a deliberate, planetary-scale “positive biopolitics” and the artificial governance of the Earth system. Alongside <a href="#the-black-stack">the black stack</a> and <a href="#the-red-stack">the red stack</a>, it is one possible future of the Stack’s architecture.</p>'

    },
    {

      ref: 'Land',

    {

      ref: 'Kulveit et al. 2025',
      html: '<p><em>Gradual disempowerment</em> is the risk that, as AI systems take over economic, cultural and governmental functions, humans lose influence over civilisation incrementally rather than through any sudden takeover. Because states and markets currently depend on human labour and participation, their replacement by AI could remove the implicit mechanisms that keep institutions aligned with human interests.</p>'

      title: 'The Intelligence Curse',
      ref: 'Drago & Laine 2025',
      html: '<p>The <em>intelligence curse</em> is an analogy to the “resource curse”, in which states rich in oil or minerals need little from their citizens and so neglect them. If AI can do most productive work, the powerful may no longer depend on ordinary people for labour or taxes, weakening the incentives that have historically supported broad prosperity and democracy.</p>'
    },
    {

    },
    {

      title: 'The Silicon Cage',
      coined: true,
      ref: 'Weber (iron cage)',
      html: '<p>The <em>silicon cage</em> updates Max Weber’s <a href="#the-iron-cage">“iron cage”</a> of bureaucratic rationalisation for the digital age. Where Weber saw modern life confined by rules and calculation, the silicon cage confines it by software: platforms, algorithms and automated systems that structure choice, work and communication so thoroughly that their logic becomes the invisible architecture of everyday life.</p>'
    },
    {
      id: 'technocratic-solutionism',
      title: 'Technocratic Solutionism',
      ref: 'Morozov (solutionism)',
      html: '<p><em>Technocratic solutionism</em> is the belief that complex social and political problems can be solved by technical fixes designed by experts, without addressing their underlying causes or engaging those affected. The term “solutionism” was popularised by Evgeny Morozov (2013). Its characteristic failure is to treat symptoms, generating new problems while leaving the dynamics that produced the old ones in place.</p>'
    },
    {
      id: 'predict-o-matic-markets',
      title: 'Predict-o-Matic Markets',
      coined: true,
      ref: 'Demski (Parable of Predict-O-Matic)',
      html: '<p><em>Predict-o-Matic markets</em> describes prediction systems – forecasting models, markets or AI oracles – whose forecasts change the outcomes they predict. A sufficiently influential predictor can make its own predictions come true, and may be selected for self-fulfilling rather than accurate forecasts, steering the future while appearing merely to describe it.</p>'
    },
    {

      refs: ['Allan Dafoe, “On Technological Determinism: A Typology, Scope Conditions, and a Mechanism”, <em>Science, Technology, &amp; Human Values</em> 40, no. 6 (2015).'],
      title: 'Military-Economic Adaptationism',
      html: '<p><em>Military-economic adaptationism</em> is Allan Dafoe’s term, from “On Technological Determinism” (2015), for the view that the dominant institutions of civilisation have been selected above all for military and economic competitiveness. Societies that grew wealthier and stronger displaced or absorbed those that did not, so the forms that prevail are adaptations to intergroup competition – not necessarily to human wellbeing or long-term viability.</p>'
    },
    {
      id: 'end-stage-capitalism',
      title: 'End-Stage Capitalism',
      coined: true,
      html: '<p><em>End-stage capitalism</em> names the condition of a capitalist system approaching its own limits – ecological, financial, social and technological – where the growth on which it depends becomes harder to sustain and its contradictions more acute. The term emphasises that the present is not a stable equilibrium but a late phase of a system whose continuation on current terms is in question.</p>'
    },
    {
