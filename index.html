      coined: true,
      html: '<p><em>Great grower competition</em> describes the rivalry between the world’s largest economies and powers, each compelled to maximise growth because falling behind means losing security, influence and legitimacy. Played between great powers, it locks the whole system into expansion regardless of ecological limits or common interest.</p>'
    },
    {
      id: 'embedded-growth-obligations',
      title: 'Embedded Growth Obligations',
      html: '<p><em>Embedded growth obligations</em> are the structural features of an economy that require it to keep growing: interest-bearing debt, returns expected on investment, pension and welfare commitments, and employment dependent on expansion. Because these obligations are built into the system’s foundations, a halt in growth threatens crisis, making growth an imperative rather than a choice.</p>'
    },
    {

      title: 'Capitalism as Paperclip Maximiser',
      ref: 'Bostrom (paperclip maximiser)',
      html: '<p><em>Capitalism as paperclip maximiser</em> applies Nick Bostrom’s thought experiment – an AI that converts everything into paperclips in pursuit of a single goal – to the market economy. Capitalism, on this view, is already a misaligned optimiser: an impersonal system maximising a narrow metric, capital accumulation, and converting the living world into that metric as it goes.</p>'

    {

      title: 'The Market as Life-Blind Watchmaker',
      coined: true,
      ref: 'Dawkins (Blind Watchmaker)',
      html: '<p><em>The market as life-blind watchmaker</em> adapts Richard Dawkins’s image of natural selection as a “blind watchmaker”. Like evolution, the market produces intricate order without a designer; but its selection criterion is profitability, not life. It is therefore blind to the value of what it does not price, and can build elaborate systems that are indifferent, or hostile, to the living world.</p>'
    },
    {

      ref: 'Hagens and King',
      html: '<p>The <em>economic superorganism</em> is Nate Hagens’s term for the global economy considered as a single emergent entity, driven by energy and oriented to growth, which no individual or government controls. In “Economics for the Future – Beyond the Superorganism” (2020), Hagens argues that this entity is running on finite fossil energy and faces a necessary contraction.</p>'

    {

      title: 'Jevons Paradox',
      ref: 'Jevons; Hagens',
      html: '<p>The <em>Jevons paradox</em> is the observation, made by William Stanley Jevons in <em>The Coal Question</em> (1865), that improvements in the efficiency of using a resource tend to increase, rather than reduce, its total consumption – because cheaper use drives greater demand. It is a central reason why efficiency alone has not reduced humanity’s overall use of energy and materials.</p>'
    },
    {
      id: 'kardashev-scale',
      title: 'The Kardashev Scale',
      ref: 'Kardashev (1964); Sagan (1973)',
      html: '<p>The <em>Kardashev scale</em>, proposed by the astronomer Nikolai Kardashev in 1964, ranks civilisations by the energy they can harness: a Type I civilisation uses all the energy available on its planet, a Type II the full output of its star, and a Type III that of its galaxy. Carl Sagan later made the scale continuous, placing humanity at roughly 0.7. It is a crude measure – counting only power, not wisdom or wellbeing – but a useful frame for the long-run trajectory of civilisation, and for the question of whether the capacity to use ever more energy can be matched by the capacity to use it well. See also <a href="#existential-hope">existential hope</a>.</p>'

    {

      html: '<p><em>Q-Day</em> is the anticipated day on which a quantum computer becomes powerful enough to break the public-key cryptography – such as RSA and elliptic-curve schemes – that secures most of the world’s communications, finance and infrastructure, using the algorithm Peter Shor published in 1994. Because encrypted data can be stolen now and decrypted later (“harvest now, decrypt later”), the risk begins long before the day itself, and the migration to post-quantum cryptography has become a race against an unknown deadline. It is a clear case of a single technical advance threatening to undermine a foundation that everything else quietly depends on.</p>'
    },

      html: '<p><em>Xenofeminism</em> is the technomaterialist, anti-naturalist and gender-abolitionist feminism set out by the collective Laboria Cuboniks in <em>Xenofeminism: A Politics for Alienation</em> (2015). Rejecting the idea that what is “natural” is therefore right – “if nature is unjust, change nature!” – it argues for repurposing technology, science and reason towards emancipation rather than ceding them to capital. Close to <a href="#left-accelerationism-and-the-red-stack">left accelerationism</a>, it treats alienation not as something to escape but as the condition from which new freedoms can be built.</p>'
    },
    {
      id: 'zero-sum-game',
      title: 'Zero-Sum Games',
      ref: 'von Neumann & Morgenstern, Theory of Games and Economic Behavior (1944)',
      html: '<p>A <em>zero-sum game</em>, formalised by John von Neumann and Oskar Morgenstern in <em>Theory of Games and Economic Behavior</em> (1944), is one in which any gain for one party is exactly matched by a loss for another, so the total stays fixed. Many real situations are not zero-sum – trade, cooperation and innovation can enlarge the total – yet <em>zero-sum thinking</em>, the habit of treating them as if they were, drives rivalry, protectionism and arms races. Shifting from zero-sum to positive-sum games is a recurring theme in visions of a <a href="#win-win">win-win</a> civilisation.</p>'
    },
    {
      id: 'civilisational-paradigm',
      title: 'Civilisational Paradigm',
      html: '<p>The <em>civilisational paradigm</em> is the deep pattern on which civilisation has run throughout history: the axioms – about nature as resource, value as accumulation, security as dominance and progress as growth – that have organised human societies since the first agrarian states, and that have evolved into the modern world-system we know today. It is not a single idea or ideology but a pattern expressed at once in every structure of civilisation that <a href="#the-emergence-model">the emergence model</a> distinguishes:</p>' +
        '<ul><li>in the <a href="#infra-structure">infra-structure</a>, as linear, extractive modes of production that take from the living world and return waste to it;</li>' +
        '<li>in the <a href="#inter-structure">inter-structure</a>, as rivalrous economics, property and governance that reward winning at others’ expense and externalising harm;</li>' +
        '<li>in the <a href="#super-structure">super-structure</a>, as the values, narratives and definitions of success that make that way of life seem natural, inevitable and good;</li>' +
        '<li>and in the <a href="#sub-structure">sub-structure</a>, as the conditioning of our evolved drives – for status, security and more – to serve it.</li></ul>' +
        '<p>Because these structures condition one another in feedback loops, the pattern reproduces itself: each structure legitimates and requires the others. Whilst a novel phenomenon, the <a href="#metacrisis">metacrisis</a> is emergent from this civilisational paradigm. Technological revolutions – industrial, nuclear, biotechnological, informational and now artificial intelligence – have not changed its axioms but served only to elaborate them, amplifying the scale and severity of the harm it externalises: globalising it, as extraction and competition came to span the planet, and existentialising it, as the powers they wield came to threaten the survival of civilisation itself.</p>' +
        '<p>This is why the metacrisis cannot be solved from within the paradigm that generates it (see <a href="#generative-dynamics">generator functions</a>): treating its symptoms in one structure leaves the pattern intact in the others. A <a href="#civilisation-transition">civilisational transition</a> is at bottom a change of paradigm across all four structures at once – the task of <a href="#civilisation-design">civilisation design</a>, and the reason the <a href="#dominant-paradigm">dominant paradigm</a> is among the deepest <a href="#leverage-points">leverage points</a> in the world-system.</p>'

    {
      id: 'counter-hegemonic-civilisational-paradigm',

      refs: ['Antonio Gramsci, <em>Prison Notebooks</em> (1929–35).', 'Donella Meadows, “Leverage Points: Places to Intervene in a System” (1999).'],
      html: '<p>A <em>counter-hegemonic civilisational paradigm</em> is a pattern of civilisation that stands against the <a href="#dominant-paradigm">dominant civilisational paradigm</a> – a different set of axioms about nature, value, security and progress, expressed across all of a civilisation’s structures at once. The term draws on Antonio Gramsci’s account of hegemony, in which a ruling order sustains itself less by force than by the consent of a common sense it has made seem natural, and of counter-hegemony, the building of an alternative common sense within the old order. Where the dominant paradigm treats nature as resource, value as accumulation, security as dominance and progress as growth, a counter-hegemonic paradigm would treat nature as kin, value as wellbeing, security as mutual flourishing and progress as maturation. Because a paradigm is, as Donella Meadows argued, among the deepest <a href="#leverage-points">leverage points</a> in a system, the emergence of a coherent counter-hegemonic paradigm is a precondition of <a href="#civilisation-transition">civilisational transition</a>. See <a href="#civilisational-paradigm">civilisational paradigm</a>.</p>'

    {
      id: 'megamachine',
      title: 'The Megamachine',
      refs: ['Lewis Mumford, <em>The Myth of the Machine</em>, vol. 1: <em>Technics and Human Development</em> (1967).'],
      html: '<p>The <em>megamachine</em> is Lewis Mumford’s term, from <em>The Myth of the Machine</em> (1967–70), for the vast organisation of human beings into a single machine – the first and largest machine of all, made not of metal but of people. In the ancient kingdoms of Egypt and Mesopotamia, divine kingship, bureaucracy, a priesthood and an army assembled tens of thousands of workers and soldiers into a coordinated apparatus capable of building pyramids, irrigating river valleys and waging war on an unprecedented scale. Mumford argued that the megamachine has been reassembled in the modern age, on a far greater scale, from science, industry, the military and the state – a system that subordinates human life to the pursuit of power, speed and control. See <a href="#pentagon-of-power">the pentagon of power</a> and <a href="#doomsday-megamachine">the doomsday megamachine</a>.</p>'

    {
      id: 'meta-system',
      title: 'Meta-System',
      ref: 'Beer',
      html: '<p>The <em>meta-system</em>, in Stafford Beer’s cybernetics, is the higher-order system that regulates a set of systems as a whole. Beer set out its social meaning in “The Liberty Machine” (<em>Futures</em>, 1971; first given as the keynote to the American Society for Cybernetics’ conference on the environment in 1970). There he argued that the ecological and social threats of the day – pollution, noise, overpopulation, urban breakdown – are not separate problems but local manifestations of a single <em>meta-threat</em>, generated by a meta-system we do not understand. The problems of the city are “not problems about decibels, gases, logistics” but “problems about having cities”; the meta-problem is therefore a problem of organisation.</p>' +
        '<p>Society, Beer observed, meets each threat piecemeal: experts raise the alarm through the mass media, government answers with studies and officials for that one symptom, and the public habituates – a machine he called “Cry Wolf”, whose response decays each time round. And because <strong>planning is homologous with organisation</strong>, plans can only be framed in terms of the existing, functionally divided structure, so resources are spent on the ever more efficient implementation of irrelevant plans.</p>' +
        '<p>A true meta-system, Beer insisted, is not a supra-authority. Its role is logical rather than hierarchical: like a metalanguage, it is “competent to decide propositions which are undecidable in the lower order languages” of the systems beneath it – and so it is properly their servant, not their master. The failure of meta-systems in society comes from conceiving them as higher authorities, which cannot exert that authority in a free society (the United Nations’ veto turned the world’s meta-system into a deadlocked power system); while a meta-system made into an authoritarian super-power fails too, overwhelmed by information it has not the <a href="#requisite-variety">requisite variety</a> to handle.</p>' +
        '<p>The meta-system Beer proposed – <a href="#the-liberty-machine">the Liberty Machine</a> – would be a disseminated network rather than a pyramid, would act from information rather than authority, and would regulate in real time rather than through protocol: operations rooms receiving live data, modelling and simulating, linked across the subsystems they serve. Its principle redefines liberty for a technological age: “competent information is free to act”. It is the logic behind the <a href="#viable-system-model">viable system model</a> and <a href="#project-cybersyn">Project Cybersyn</a>, and an early diagnosis of what is now called the <a href="#metacrisis">metacrisis</a>.</p>'

    {
      id: 'macroeconomics',

    {
      id: 'macroevolution',

    {
      id: 'initial-conditions',
      title: 'Initial Conditions',
      html: '<p>The <em>initial conditions</em> of civilisation are the circumstances in which it first arose: settled agriculture, surplus, rising population density and the competition between groups that these made possible. Like the initial conditions of a dynamical system, they do not fix every later state, but they constrain the paths open to it – and some of the tendencies set in motion at the start have never been reversed.</p><p>The question is old – Rousseau located the origin of inequality in the first enclosure of land – and it has been taken up in archaeology and anthropology, from Robert Carneiro’s account of how states arose under environmental circumscription to James C. Scott’s <em>Against the Grain</em> (2017) on the early agrarian states.</p>'

      html: '<p>The <em>information revolution</em> is the transformation driven by digital computing and networked communication from the mid-twentieth century: the microprocessor, the internet and the smartphone. It made information cheap to copy and move, reorganised work and media around data, and gave rise to new concentrations of power in the platforms that mediate it.</p>'

    {
      id: 'intelligence-revolution',
      title: 'Intelligence Revolution',
      html: '<p>The <em>intelligence revolution</em> is the transformation now under way as artificial intelligence takes on tasks of perception, language, judgement and decision once reserved for people. Where earlier revolutions mechanised muscle and then information, this one automates cognition itself – and with it the possibility that the systems doing the work also come to direct it.</p>'
    },
    {
      id: 'capitalism',
      title: 'Capitalism',
      html: '<p><em>Capitalism</em> is an economic system in which the means of production are privately owned and operated for profit, and in which goods, services and labour are exchanged in markets. Its defining dynamic is accumulation: profit is reinvested to produce further profit, so that the system must grow to remain stable.</p><p>Its history is usually told in stages – mercantile, industrial, financial, digital – each reorganising production, work and power, and each with its own crises and critics, from Marx to the present.</p>'
    },
    {
      id: 'primitive-accumulation',
      refs: ['Karl Marx, <em>Capital: A Critique of Political Economy</em>, vol. 1 (1867), part VIII.'],
      title: 'Primitive Accumulation',
      ref: 'Marx',
      html: '<p><em>Primitive accumulation</em> is Karl Marx’s term, in the first volume of <em>Capital</em> (1867), for the process by which capitalism began: not through thrift, as its defenders claimed, but through the forcible separation of people from the land and means of subsistence – enclosure, colonial plunder and the slave trade. It created both the concentrated wealth and the propertyless workers that capitalist production required.</p><p>Later writers, from Rosa Luxemburg to David Harvey’s “accumulation by dispossession”, argued that it is not only a historical origin but a continuing process.</p>'
    },
    {
      id: 'industrial-capitalism',
      title: 'Industrial Capitalism',
      html: '<p><em>Industrial capitalism</em> is the form capitalism took with the Industrial Revolution, when profit came chiefly from factory production using wage labour and machinery. It gave rise to the industrial working class, the factory town and the modern labour movement, and to the classic analyses of Marx, Engels and Weber.</p>'
    },
    {
      id: 'late-stage-capitalism',

      title: 'Late-Stage Capitalism',
      html: '<p><em>Late-stage capitalism</em> – late capitalism, from Werner Sombart’s <em>Spätkapitalismus</em> – names a period in which capitalism is understood to have reached a mature or declining phase. Ernest Mandel’s <em>Late Capitalism</em> (1972) and Fredric Jameson’s <em>Postmodernism, or, the Cultural Logic of Late Capitalism</em> (1991) gave it its modern sense; in popular usage the phrase now names the absurdities and indignities of a market reaching into every corner of life.</p>'

    {
      id: 'techno-feudalism',
      refs: ['Cédric Durand, <em>Techno-féodalisme: Critique de l’économie numérique</em> (2020).', 'Yanis Varoufakis, <em>Technofeudalism: What Killed Capitalism</em> (2023).'],
      title: 'Techno-Feudalism',
      html: '<p><em>Techno-feudalism</em> is the thesis, advanced by Yanis Varoufakis in <em>Technofeudalism</em> (2023) and Cédric Durand in <em>Techno-féodalisme</em> (2020), that digital platforms have begun to replace capitalism with something closer to feudalism. Profit from producing goods for markets gives way to rent extracted from those who must use the platforms – “cloud capital” – so that users and businesses become something like vassals of the owners of the digital estate.</p>'
    },
    {
      id: 'civilisation-alignment',
      title: 'Civilisation Alignment',
      kind: 'category',
      parent: 'theproject',
      order: 4,
      html: '<p><em>Civilisation alignment</em> is the problem of aligning civilisation as a whole – its economies, states, technologies and cultures – with the wellbeing of the people and the living world it depends on. It extends the question of <a href="#ai-alignment">AI alignment</a> from a single artificial system to the larger system of which AI is only the newest part: markets, institutions and nation-states are themselves optimising processes that pursue proxies of value (profit, growth, power) and can drift away from the ends they were meant to serve.</p><p>Seen this way, a misaligned civilisation is one whose institutions reward what they were never meant to – short-term gain, unpriced harm, power for its own sake – and so drift towards outcomes no one chose. Aligning it means changing what the system rewards until it coincides with what is actually good – a problem that, unlike AI alignment, has been worked on for as long as there have been constitutions. See also <a href="#the-great-alignment">the great alignment</a>.</p>'
    },
    {
      id: 'civilisational-collapse',
      title: 'Civilisational Collapse',
      html: '<p><em>Civilisational collapse</em> is the rapid, lasting loss of a civilisation’s social, political and economic complexity – the breakdown of its institutions, its capacity to coordinate and its ability to sustain its population. Joseph Tainter’s <em>The Collapse of Complex Societies</em> (1988) explained it as the point at which further investment in complexity yields diminishing and then negative returns; Jared Diamond’s <em>Collapse</em> (2005) stressed environmental overshoot and the choices societies make in response to it.</p><p>Historical collapses – the Western Roman Empire, the Classic Maya, Bronze Age Mediterranean civilisation – were regional. The question the present raises is whether a single, globally interconnected civilisation could collapse as a whole, and whether its recovery would be possible at all. See <a href="#critical-collapsology">critical collapsology</a>, <a href="#civilisational-risk">civilisational risk</a> and <a href="#existential-risk">existential risk</a>.</p>'
    },
    {
      id: 'civilisational-risk',
      title: 'Civilisational Risk',
      html: '<p><em>Civilisational risk</em> is risk to civilisation as a whole: hazards severe enough to cause <a href="#civilisational-collapse">civilisational collapse</a>, or to set civilisation back by generations, even where they fall short of human extinction. It sits between global catastrophic risk, which is measured in lives and damage, and <a href="#existential-risk">existential risk</a>, which concerns the permanent loss of humanity’s future.</p><p>Its sources range from climate breakdown and ecological overshoot to nuclear war, engineered pandemics and uncontrolled artificial intelligence. Because these interact – a war disrupting food systems, a pandemic straining already fragile institutions – the risk to civilisation is greater than the sum of the separate hazards.</p>'
    },
    {
      id: 'civilisation-scale',
      title: 'Civilisation-Scale',
      html: '<p><em>Civilisation-scale</em> is the scale at which civilisation itself becomes the unit of analysis and action: the whole human world-system, across its full span of time, rather than any single nation, market or generation. Problems at this scale – planetary boundaries, exponential technology, the coordination of billions – cannot be seen from within narrower frames, and cannot be solved by actors who operate only within them.</p><p>Civilisation theory is theory applied at a civilisation-scale: it treats the initial conditions, developmental process and dominant paradigm of civilisation as objects of study in their own right. See <a href="#macrohistory">macrohistory</a> and <a href="#civilisational-risk">civilisational risk</a>.</p>'
    },
    {
      id: 'civilisation-research-paradigm',
      title: 'Civilisation Research Paradigm',
      order: 0,
      coined: true,
      html: '<p>The <em>civilisation research paradigm</em> is the framework by which this map organises the study of civilisation: a set of shared questions, divisions and methods – a paradigm in Thomas Kuhn’s sense – for treating civilisation as a single object of inquiry rather than a background to other subjects. It divides the field into nine sections in three sets of three, each set approaching civilisation from a different altitude.</p>'
        + '<ul>'
        + '<li><strong>Civilisational:</strong> how a civilisation works (<a href="#civilisational-mechanics">civilisational mechanics</a>), how it could be designed (<a href="#civilisation-design">civilisation design</a>), and how it could change from one form to another (<a href="#civilisation-transition">civilisational transition</a>).</li>'
        + '<li><strong>Meta:</strong> the crisis it faces (<a href="#metacrisis">metacrisis</a>), the culture through which it makes meaning (<a href="#metamodernism">metamodernism</a>), and the theories through which it understands itself (<a href="#metatheory">metatheory</a>).</li>'
        + '<li><strong>Macro:</strong> civilisation at the largest scales of time, society and action – its history (<a href="#macrohistory">macrohistory</a>), its social structures (<a href="#macrosociology">macrosociology</a>), and the strategy by which its long-run trajectory might be steered (<a href="#macrostrategy">macrostrategy</a>).</li>'
        + '</ul>'
        + '<p>Read together, the three sets move from mechanism to meaning to scale: what civilisation is and could be, how it is framed and experienced, and where it has come from and might go. The paradigm is the backbone of <a href="#the-map">the map</a>, and the starting point of its curated sequence.</p>'
    },
    {
      id: 'the-wizarding-away-of-the-state',
      title: 'The Wizarding Away of the State',
      coined: true,
      html: '<p><em>The wizarding away of the state</em> plays on Marx and Engels’s prophecy of the “withering away of the state”: the idea that, once class society had been overcome, the coercive apparatus of the state would no longer be needed and would gradually fall away. In place of that slow political withering, it names the prospect of the state being superseded by technology – its functions of coordination, administration and enforcement absorbed into automated systems, platforms and artificial intelligence so capable that, in Arthur C. Clarke’s phrase, they are “indistinguishable from magic”.</p><p>The question it poses is who holds the wand: whether such a transition would dissolve domination, as the socialist tradition hoped, or concentrate it in whoever owns the systems, as in <a href="#the-silicon-cage">the silicon cage</a>. See also <a href="#fully-automated-luxury-communism">fully automated luxury communism</a> and <a href="#meta-marxism">meta-Marxism</a>.</p>'
    },
    {
      id: 'civilization-research-institute',
      title: 'Civilization Research Institute',
      order: 1,
      ref: 'civilizationresearchinstitute.org',
      html: '<p>The <em>Civilization Research Institute</em> is a research organisation devoted to the <a href="#metacrisis">metacrisis</a>: the shared underlying dynamics that generate humanity’s converging global risks, and the conditions under which a civilisation could navigate them without collapsing into catastrophe or dystopia.</p><p>Rather than treating climate, AI, biotechnology, inequality and institutional decay as separate problems, it studies them as expressions of common <a href="#generative-dynamics">generator functions</a> – rivalrous competition, extractive growth and exponential technology without commensurate wisdom – and asks what it would take to address them at that level. Its metacrisis frame is one of the direct inspirations of this map.</p><h2>Reality Check? (2025)</h2><p>A 2025 publication of the Institute, the first in its Reality Check series, on the state of humanity’s existential and social risks.</p><h2>General Regulatory Process for Advanced Technology</h2><p>A proposal for how advanced technologies could be assessed and governed before deployment, so that their risks and side effects are weighed in advance rather than after the fact.</p><h2>Steps for Prudent Problem-Solving</h2><p>A method for addressing problems without generating worse ones elsewhere – the pattern this map calls <a href="#problem-solution-externality-history">problem-solution-externality history</a>.</p>'
    },
    {
      id: 'civilization-emerging',
      title: 'Civilization Emerging',
      order: 2,
      ref: 'Daniel Schmachtenberger',
      html: '<p><em>Civilization Emerging</em> was an earlier project of Daniel Schmachtenberger’s: a body of essays, talks and interviews from the late 2010s on the drivers of existential risk and the design criteria for a civilisation capable of surviving its own technological power. Much of the vocabulary that later shaped discussion of the <a href="#metacrisis">metacrisis</a> was worked out there – <a href="#generative-dynamics">generator functions</a>, the <a href="#multipolar-trap">multipolar trap</a>, and the <a href="#third-attractor">third attractor</a> between catastrophe and dystopia – together with the argument that only a civilisation redesigned at the level of its underlying incentives and institutions can be both safe and free.</p>'
    },
    {
      id: 'metanarrative',
      title: 'Metanarrative',
      ref: 'Lyotard, The Postmodern Condition (1979)',
      html: '<p>A <em>metanarrative</em> (or grand narrative) is an overarching story that claims to explain history as a whole and to give every event its place and meaning – the progress of reason, the triumph of the free market, the dialectic of class struggle. Jean-François Lyotard defined the postmodern condition (1979) as “incredulity toward metanarratives”: the loss of faith in any single story able to legitimate knowledge and politics for everyone.</p><p><a href="#metamodernism">Metamodernism</a> takes up the question that postmodernity left open – whether, knowing that every grand narrative is partial and constructed, a civilisation can still hold a sincere story about where it is going. Without one, societies drift into <a href="#the-meaning-crisis">the meaning crisis</a>; with a naive one, into <a href="#the-age-of-ideology">ideology</a>.</p>'
    },
    {
      id: 'metaphysics',
      title: 'Metaphysics',
      html: '<p><em>Metaphysics</em> is the branch of philosophy concerned with the most basic features of reality: what exists, what it is to be something, the nature of causation, time, mind and matter, and how they relate.</p><p>Every civilisation rests on a metaphysics, usually unexamined – assumptions about what is real and what counts, which shape its science, economics and ethics long before anyone argues about them. Modern industrial societies carry a largely mechanistic and materialist metaphysics, in which the world is a store of separable objects to be used; critics from Alfred North Whitehead to today’s process philosophers have argued for a more relational alternative. See also <a href="#epistemology">epistemology</a>.</p>'
    },
    {
      id: 'metapsychology',
      title: 'Metapsychology',
      ref: 'Zachary Stein; Freud',
      html: '<p><em>Metapsychology</em> is theory about the psyche as a whole – not one school of psychology among others, but a framework for how minds are structured, develop and relate to culture, within which particular psychologies can be placed. The term was Sigmund Freud’s; the philosopher of education Zachary Stein has renewed it as an integrative account of human development, arguing that a civilisation in crisis needs an explicit, shared understanding of what people are and can become in order to educate, govern and care for them well.</p><p>On this view a civilisational crisis is also a crisis of human development, and the transition to a new civilisation is as much psychological and educational as it is technological or political. See also psychology and <a href="#pedagogy">pedagogy</a>.</p>'
    },

      cpOnly: true,
      tags: ['consilience'],
      ref: 'The Consilience Project, Glossary',
      html: '<p>It is both the public spaces (e.g., town hall, Twitter) and private spaces where people come together to pursue a mutual understanding of issues critical to their society, and the collection of norms, systems, and institutions underpinning this society-wide process of learning. The epistemic commons is a public resource; these spaces and norms are available to all of us, shaped by all of us, and in turn, also influence the way in which all of us engage in learning with each other. For informed and consensual decision-making, open societies and democratic governance depend upon an epistemic commons in which groups and individuals can collectively reflect and communicate in ways that promote mutual learning.</p><p class="cp-note">This is the Consilience Project’s definition. See also this map’s own entry: <a href="#the-epistemic-commons">The Epistemic Commons</a>.</p>'

      html: '<p><em>The new categorical imperative</em> is Theodor Adorno’s reformulation of Kant’s moral law after the Holocaust. In <em>Negative Dialectics</em> (1966) he writes that Hitler has imposed upon humanity a new categorical imperative: to arrange thought and action so that Auschwitz will not repeat itself, so that nothing similar will happen. Unlike Kant’s, it is grounded not in pure reason but in historical experience and the bodily revulsion at suffering – a negative ethics, defined by the catastrophe it forbids rather than by a positive ideal.</p>'
    },
    {
      id: 'dialectic-of-enlightenment',
      title: 'Dialectic of Enlightenment',

      html: '<p><em>Dialectic of Enlightenment</em> (1944; 1947) is the book in which Max Horkheimer and Theodor Adorno argue that enlightenment, the project of freeing humanity from myth through reason, reverts into a new mythology. Reason reduced to an instrument of calculation and control turns the domination of nature into the domination of human beings, culminating in fascism, administered society and the <a href="#culture-industry">culture industry</a>. Their thesis – “myth is already enlightenment, and enlightenment reverts to mythology” – became a founding text of the Frankfurt School’s critique of modernity. See <a href="#critical-theory">critical theory</a>.</p>'
    },
    {
      id: 'means-ends-reversal',
      title: 'Means-Ends Reversal',

      html: '<p>A <em>means-ends reversal</em> occurs when what began as a means to some end comes to be pursued as an end in itself, displacing the goals it was meant to serve. Georg Simmel saw it in money, which turns from a means of exchange into the object of desire; Max Weber in the rationalised bureaucracy that outlives its purposes; and Max Horkheimer, in <em>Eclipse of Reason</em> (1947), in the triumph of instrumental reason, which can calculate the means to any end but can no longer judge the ends themselves. In modern societies, growth, profit, efficiency and technological capacity are its characteristic examples.</p>'
    },
    {
      id: 'social-pathology',
      title: 'Social Pathology',

      html: '<p>A <em>social pathology</em> is a disorder not of individuals but of a form of social life itself – a systematic distortion in the way a society is organised that undermines the conditions for its members to live well, even when it is widely accepted as normal. The idea runs through critical theory from Rousseau and Marx’s alienation to Erich Fromm’s <em>The Sane Society</em> (1955), and was set out as the defining task of social philosophy by Axel Honneth (1996): to diagnose the pathologies of the social, such as reification, alienation and the <a href="#colonisation-of-the-lifeworld">colonisation of the life-world</a>.</p>'
    },
    {

      html: '<p><em>Recognition justice</em> is the dimension of justice concerned with whether people are accorded equal standing and respect, as distinct from how material goods are distributed. Developed from Hegel by Axel Honneth in <em>The Struggle for Recognition</em> (1992), and by Charles Taylor, it holds that identity and self-respect depend on recognition by others – in love, rights and social esteem – and that misrecognition is itself a form of injustice. Nancy Fraser argued that justice requires both recognition and redistribution, together with political representation, an exchange set out in <em>Redistribution or Recognition?</em> (2003).</p>'
    },
    {
      id: 'critical-social-theory',
      title: 'Critical Social Theory',
      refs: ['Max Horkheimer, “Traditional and Critical Theory” (1937).'],
      html: '<p><em>Critical social theory</em> is social theory that examines society in order to change it: it seeks not only to describe how a social order works, but to diagnose what is wrong with it – the forms of domination, exploitation and suffering it produces and conceals – and to identify the possibilities for emancipation within it. Its core is the <a href="#critical-theory">critical theory</a> of <a href="#the-frankfurt-school">the Frankfurt School</a>, from Horkheimer, Adorno, Marcuse and Benjamin to Habermas and Honneth, which joined Marx’s critique of political economy with philosophy, psychoanalysis and cultural analysis. In a wider sense it includes other traditions that share that aim: institutional critiques of business and the state, Foucault’s analyses of power, and postcolonial accounts of global inequality. What unites them is the conviction that social arrangements presented as natural, necessary or rational are historical and can be otherwise.</p>'

    {
      id: 'ape-and-essence',
      title: 'Ape & Essence',

      ref: 'Le Guin',
      html: '<p><em>The Ones Who Walk Away from Omelas</em> (1973) is Ursula K. Le Guin’s story of a utopian city whose happiness depends on the perpetual suffering of a single child. Most citizens accept the bargain; some walk away. The story poses the question of whether any civilisation’s prosperity can justify the suffering on which it rests.</p><h2>Critique of Utilitarianism</h2><p>Le Guin wrote the story as a response to William James’s challenge to utilitarianism: would we accept a world of perfect happiness for millions on the condition that one lost soul suffer endless torment? In Omelas the utilitarian calculus is satisfied – the sum of happiness is immense, the cost one child – yet the story makes its readers feel that the bargain is unacceptable. It is a critique of utilitarianism from within experience rather than argument: some forms of suffering cannot be outweighed, and those who walk away refuse to let the greater good justify them. See <a href="#future-utility-monster">future utility monster</a> and <a href="#drone-warfare-utilitarianism">drone warfare utilitarianism</a>.</p>'

    {
      id: 'paradigm-shift',

      html: '<p>A <em>paradigm-shift</em> is a fundamental change in the basic concepts, assumptions and practices of a field – in Thomas Kuhn’s account of science, in <em>The Structure of Scientific Revolutions</em> (1962), the replacement of one <a href="#paradigm">paradigm</a> by another. Normal science works within a paradigm, solving the puzzles it defines; anomalies that it cannot explain accumulate until they provoke a crisis, and a new paradigm emerges that reorganises the whole field – as Copernican astronomy replaced Ptolemaic, or relativity Newtonian mechanics. Kuhn argued that rival paradigms are partly incommensurable, so that the change is less a step-by-step correction than a conversion, a shift in how the world is seen. The term has since spread far beyond science to any deep change in a society’s way of thinking. See <a href="#civilisational-paradigm-shift">civilisational paradigm-shift</a>.</p>'

    {

      title: 'Civilisational Paradigm-Paralysis',

    {

      title: 'Legitimising Myths',
      refs: ['Jim Sidanius and Felicia Pratto, <em>Social Dominance: An Intergroup Theory of Social Hierarchy and Oppression</em> (1999).'],
      html: '<p><em>Legitimising myths</em> are the beliefs, values, attitudes and stereotypes that provide moral and intellectual justification for a social order – and in particular for the inequalities within it. The term comes from Jim Sidanius and Felicia Pratto’s <a href="#social-dominance-theory">social dominance theory</a>, which distinguishes <em>hierarchy-enhancing</em> myths, such as meritocracy, the divine right of kings, the natural superiority of a group or the belief that the poor deserve their poverty, from <em>hierarchy-attenuating</em> myths, such as universal human rights, egalitarianism and solidarity. “Myth” here does not mean that such beliefs are false, but that they work as shared stories whose function is to make an arrangement of power seem natural, deserved or inevitable – the role that Marxist theory assigns to <a href="#dominant-ideology">ideology</a>. See <a href="#myth-of-the-autonomous-man">the myth of the autonomous man</a>.</p>'

    {

      html: '<p><em>Social dominance theory</em>, developed by Jim Sidanius and Felicia Pratto in the 1990s, holds that human societies tend to organise themselves as group-based hierarchies – by age, by sex, and by arbitrary categories such as class, caste, ethnicity, nation or religion – in which a dominant group enjoys a disproportionate share of what is valued and subordinate groups a disproportionate share of what is not. Such hierarchies are maintained through discrimination by individuals and institutions, through the asymmetrical behaviour of dominant and subordinate groups, and above all through <a href="#legitimising-myths">legitimising myths</a> that make them seem just. The theory also measures individuals’ <em>social dominance orientation</em> – their preference for hierarchy and inequality between groups – which predicts support for hierarchy-enhancing ideologies and policies.</p>'

    {

    {
      id: 'critical-political-economy',
      title: 'Critical Political Economy',
      html: '<p><em>Critical political economy</em> studies the economy as a system of power, social relations and history rather than as a neutral mechanism. Drawing on Marx, institutional economics and critical theory, it asks who benefits from economic arrangements, how they are maintained, and how they might be changed – treating the economy as a political and human creation.</p><h2>Political Economy</h2><p><em>Political economy</em> is the structure of a civilisation: the institutions that govern how resources are owned, produced, allocated and exchanged, and how collective decisions are made about them. In a three-layer model of civilisation that echoes Marvin Harris’s cultural materialism, political economy (structure) sits between technology (<a href="#infra-structure">infrastructure</a>) and <a href="#super-structure">cultural psychology</a> (superstructure). Because it sets the incentives every actor responds to, it decides which behaviours are rewarded long before any individual chooses – a point on which Adam Smith, Marx and the later institutionalists agreed, if on little else.</p>'

    },
    {
      id: 'science-and-technology-studies',

      html: '<p><em>Science and technology studies</em> (STS) is the interdisciplinary field that examines how science and technology shape, and are shaped by, society, politics and culture. Emerging in the 1970s and 1980s from the sociology of scientific knowledge, the history and philosophy of science and critical studies of technology, it treats scientific facts and technical artefacts not as neutral products of discovery and invention, but as outcomes of social processes that in turn reorganise social life. Its central debates turn on how far technology determines society (<a href="#technological-determinism">technological determinism</a>), how far society constructs technology (<a href="#social-construction-of-technology">the social construction of technology</a>), and how both are entangled in networks of human and non-human actors (<a href="#actor-network-theory">actor-network theory</a>). See <a href="#axiological-design">axiological design</a>.</p>'

    {
      id: 'second-order-cybernetics',
      title: 'Second-Order Cybernetics',
      refs: ['Heinz von Foerster, <em>Observing Systems</em> (1981).', 'Humberto Maturana and Francisco Varela, <em>Autopoiesis and Cognition</em> (1980).'],
      html: '<p><em>Second-order cybernetics</em> – the “cybernetics of cybernetics” – is the turn, led from the late 1960s by Heinz von Foerster with Margaret Mead, Gregory Bateson, Humberto Maturana and Francisco Varela, from the study of observed systems to the study of observing systems. Where first-order cybernetics treated the controller as standing outside the system it regulates, second-order cybernetics includes the observer within the system observed: every description is made by someone, from somewhere, and shapes what it describes. It underlies the theory of autopoiesis and much later work on self-organisation, constructivism and reflexive social science. See <a href="#participant-observers">participant-observers</a> and <a href="#cybernetics-and-systems-theory">cybernetics and systems theory</a>.</p>'

    {
      id: 'axiological-design',
      title: 'Axiological Design',
      ref: 'Consilience Project',
      refs: ['The Consilience Project, “Technology is Not Values Neutral: Ending the Reign of Nihilistic Design” (26 June 2022).', 'Langdon Winner, <em>Autonomous Technology: Technics-out-of-Control as a Theme in Political Thought</em> (1977).', 'Lewis Mumford, <em>Technics and Civilization</em> (1934).'],
      html: '<p><em>Axiological design</em> is the approach to technology proposed by <a href="#the-consilience-project">the Consilience Project</a> in “Technology is Not Values Neutral: Ending the Reign of Nihilistic Design” (2022): “design that factors and leverages the intrinsic values inevitably encoded in all technology-human interfaces.” Axiology is the philosophical study of value, and axiological design is the application of principled judgment about value to the design of technology – not a single method but a general model, which treats the effects of a technology on how people think, behave and relate as core design goals and constraints, rather than as afterthoughts.</p>' +
        '<div class="long-only"><h2>Technology Is Not Values Neutral</h2><p>The starting point is that “technologies encode practices and values into the societies that adopt them”, often unpredictably and unintentionally, as second- and third-order effects. Every technology is created in pursuit of certain values, and in spreading it creates new ones. Alongside the physical externalities of technology, there are therefore <em>psychosocial externalities</em>: its ethical, cultural and psychological consequences, which are harder to see and still largely ignored.</p>' +
        '<h2>Four Approaches to Design</h2><ul>' +
          '<li><strong>Naively optimistic design</strong>, from early modernity, assumes that positive values are built into every technology.</li>' +
          '<li><strong>Luddite design</strong>, reacting against the machine age, assumes negative values are built into every technology and seeks to roll it back – a stance that disempowers those who take it, since technologies confer power on those who adopt them.</li>' +
          '<li><strong>Nihilistic design</strong>, the dominant approach today, ignores or downplays value altogether: technology is held to be neutral, only as good or bad as its users. It corresponds to what Langdon Winner called the “technological orthodoxy”, whose tenets are that we fully understand the technologies we create, that they are under our control, that they are neutral, and that building ever larger and more demanding systems is itself progress.</li>' +
          '<li><strong>Axiological design</strong>, responding to the crises of late modernity, including <a href="#existential-risk">existential risk</a>, understands technology as intrinsically value-laden and value-creating, and designs with that in mind.</li></ul>' +
        '<h2>Ending Nihilistic Design</h2><p>Technologies, in this view, never exist alone: tools, technologies, ecologies of technologies, infrastructures and whole technological epochs build on one another into a “second nature” to which people must adapt. Today that second nature is being built by nihilistic design – an “accidental planetary computational stack”, shaped by near-term market forces rather than by any consideration of its effects on minds, relationships and cultures As the <em>article</em> concludes: “The dangerous reign of nihilistic design must end if our civilization is not to.” See <a href="#design-science">design science</a>.</p></div>'
    },
    {
      id: 'ontological-design',
      title: 'Ontological Design',
      ref: 'Fraga; Winograd & Flores; Willis',
      refs: ['Terry Winograd and Fernando Flores, <em>Understanding Computers and Cognition: A New Foundation for Design</em> (1986).', 'Anne-Marie Willis, “Ontological Designing”, <em>Design Philosophy Papers</em> 4, no. 2 (2006).', 'Daniel Fraga, <em>Ontological Design: Subject is Project</em> (2022).'],
      html: '<p><em>Ontological design</em> is the idea that in designing tools, environments and systems we also design ourselves: what we design designs us back, shaping how we perceive, act and understand our own being. Developed by Terry Winograd and Fernando Flores (1986) and later Anne-Marie Willis, it makes design a matter of which kinds of human beings a civilisation produces.</p><p>Daniel Fraga’s <em>Ontological Design: Subject is Project</em> (2022) takes the idea further: if the human subject is always being designed – by social media, platforms and institutions as much as by architects – then subjectivity itself becomes a project, and the question is who designs it and to what end.</p>'

      id: 'convergent-cultural-evolution',
      title: 'Convergent Cultural Evolution',
      refs: ['Nick Bostrom, “What is a Singleton?”, <em>Linguistic and Philosophical Investigations</em> 5:2 (2006).'],
      html: '<p><em>Convergent cultural evolution</em> is the possibility that cultures developing independently come, as they advance, to the same values and goals – as convergent evolution in biology produces eyes, wings and streamlined bodies in unrelated lineages. Nick Bostrom identified it as one of the routes by which a <a href="#singleton">singleton</a> – a world order with a single decision-making agency at the highest level – could form without conquest or deliberate unification: if all sufficiently advanced individuals or cultures turn out to accept fundamentally the same values, those shared values, together with everyone who holds them, would act as a single agency in the broad sense, and the world would in effect be governed as one.</p><blockquote class="entry-quote"><p>Yet another way in which a singleton could form is through convergent evolution, e.g. if it turns out that all sufficiently advanced individuals or cultures come to accept fundamentally the same values or goals. These common values in combination with all the individuals and cultures that embrace them would then be an “agency” in the broad sense intended here, and it would constitute a singleton.</p><footer>Nick Bostrom, “What is a Singleton?” (2006)</footer></blockquote><p>Whether such convergence is likely – and whether the values that cultures converge on would be good ones, or merely those that win under competition – bears on whether the world’s civilisations will <a href="#clash-of-civilisations">clash</a> or <a href="#coherence-of-civilisations">cohere</a>.</p>'
    },
    {
      id: 'coherence-of-civilisations',
      title: 'The Coherence of Civilisations',
      coined: true,
      html: '<p><em>The coherence of civilisations</em> is an alternative to Samuel Huntington’s <a href="#clash-of-civilisations">clash of civilisations</a>, the thesis that the world’s civilisations, defined by culture and religion, are set on a course of conflict along their fault lines. Against it, the coherence of civilisations holds that they are converging: under shared pressures – a single global economy and information network, common technologies, a single biosphere and a common exposure to global catastrophic risk – the world’s civilisations are drawn towards compatible institutions, values and ways of understanding the world, as separate lineages in <a href="#convergent-cultural-evolution">convergent cultural evolution</a> arrive at similar solutions to similar problems. Their differences do not lead to collision but are progressively integrated into a mutually intelligible whole, so that humanity can come to act as one coherent civilisation in the face of challenges that no single civilisation can meet alone.</p>'
    },
    {
      id: 'blue-skies-social-science',
      title: 'Blue Skies Social Science & Green Grass Social Experimentation',
      coined: true,
      html: '<p><em>Blue skies social science research</em> applies the idea of curiosity-driven, open-ended research – long established in the natural sciences – to the study of society. It supports inquiry into fundamentally new social, economic and political forms without requiring immediate application, on the view that the design of better civilisations requires basic research as ambitious as that behind new technologies.</p>'
    },
    {
      id: 'pre-tragic-tragic-post-tragic',
      title: 'Pre-tragic, Tragic, Post-tragic',
      html: '<p><em>Pre-tragic, tragic and post-tragic</em> name three stances towards the brokenness of the world, a distinction taught by Marc Gafni and developed by Zak Stein and Daniel Schmachtenberger. The <em>pre-tragic</em> stance is naive: it has not yet faced how deep suffering, loss and failure go, and its optimism is untested – the stance of the idealist who believes good intentions are enough. The <em>tragic</em> stance has faced them, and been broken by them: it sees clearly that the world is not as it should be and that efforts to change it often fail, and so falls into cynicism, despair or resignation. The <em>post-tragic</em> stance has passed through the tragic without denying it: it holds the full weight of the world’s brokenness while still acting, out of love and responsibility, to make things better – not because success is assured, but because it is called for. It is the stance asked of those working on civilisational transition in the face of the <a href="#metacrisis">metacrisis</a>. See <a href="#acting-irrespective-of-hope">acting irrespective of hope</a>.</p>'
    },
    {
      id: 'acting-irrespective-of-hope',
      title: 'Acting Irrespective of Hope',
      html: '<p><em>Acting irrespective of hope</em> is the stance, drawn by Fabian Freyenhagen from the ethics of Theodor Adorno, of doing what is right without depending on the expectation that it will succeed. Adorno held that in a radically wrong world there can be no right life, only a life lived less wrongly; and that the prospects for transformation may be slight. Rather than making action conditional on optimism – and so abandoning it when hope fails – one acts because the wrong is wrong, resisting it and refusing complicity whatever the odds. Freed from the need for hope, action is also freed from the despair that follows its loss. See <a href="#pre-tragic-tragic-post-tragic">post-tragic</a> and <a href="#the-new-categorical-imperative">the new categorical imperative</a>.</p>'
    },
    {
      id: 'cybernetic-existentialism',
      title: 'Cybernetic Existentialism',
      coined: true,
      html: '<p><em>Cybernetic existentialism</em> joins the systems view of cybernetics with the existentialist emphasis on freedom and responsibility. It holds that human beings are embedded in feedback systems that shape them, yet remain responsible for the systems they build and sustain – so that designing the structures of civilisation becomes a matter of existential choice rather than technical management alone.</p>'
    },
    {
      id: 'the-post-status-quo',
      title: 'The Post-Status Quo',
      coined: true,
      html: '<p>The <em>post status quo</em> names the recognition that the present order cannot simply continue: its trajectories are unsustainable, so the real choice is not between change and stability but between different kinds of change. The concept reframes transition as unavoidable, and asks whether it will be designed and deliberate or chaotic and imposed by crisis.</p>'
    },
    {
      id: 'multi-scale-ethics',
      title: 'Multi-Scale Ethics',
      coined: true,
      html: '<p><em>Multi-scale ethics</em> holds that moral reasoning must operate consistently across scales – from the individual to the community, the nation, humanity and the biosphere – and across timescales from the immediate to the very long term. Actions that are good at one scale can be harmful at another, so an adequate ethics must weigh consequences across all of them together.</p>'
    },
    {
      id: 'super-critical-path',
      title: 'Super-Critical Path',
      coined: true,
      ref: 'Fuller (Critical Path)',
      html: '<p>The <em>super-critical path</em> builds on Buckminster Fuller’s <em>Critical Path</em> (1981), which traced the sequence of developments by which humanity might achieve success for all. It names the sequence of changes – technological, economic and cultural – that must happen, in the right order, for a civilisation to make its transition successfully, and the dependencies that make some steps preconditions for others.</p>'
    },
    {
      id: 'spaceship-earth',
      title: 'Spaceship Earth',
      ref: 'Fuller',
      html: '<p><em>Spaceship Earth</em> is Buckminster Fuller’s image, from <em>Operating Manual for Spaceship Earth</em> (1969), of the planet as a vehicle with finite resources and no spare parts, whose crew must learn to operate it wisely. It expresses a comprehensive, design-oriented view of the Earth as a single system to be managed for the benefit of all its passengers.</p>'
    },
    {
      id: 'world-livingry-service',
      title: 'World Livingry Production & Distribution Service',
      refs: ['Buckminster Fuller, <em>Critical Path</em> (1981).'],
      html: '<p>The <em>World Livingry Production &amp; Distribution Service</em> is Buckminster Fuller’s proposal to redirect the world’s productive capacity – above all the vast industrial, scientific and logistical resources devoted to weaponry – to the production and distribution of <a href="#livingry">livingry</a>, the tools and systems that support human life, for the whole of humanity. Fuller held that the technological means to provide a high standard of living for everyone already existed, and that what was lacking was a global service designed to deliver it, operating on comprehensive data about the planet’s resources and needs rather than on the logic of national advantage and profit. See <a href="#design-science">design science revolution</a> and <a href="#the-world-game">the World Game</a>.</p>'
    },
    {
      id: 'critical-path',
      title: 'Critical Path',
      refs: ['Buckminster Fuller with Kiyoshi Kuromiya, <em>Critical Path</em> (1981).'],
      html: '<p><em>Critical Path</em> (1981) is Buckminster Fuller’s last major book, written with Kiyoshi Kuromiya. It takes its title from the critical path method of project management – the sequence of dependent tasks that determines how soon a complex project can be completed – and applies it to humanity as a whole: tracing the long history of how power and knowledge came to be concentrated, and setting out the sequence of developments by which humanity could, for the first time, make the world work for everyone. Fuller argued that the technical means for universal prosperity were already within reach, and that humanity faced a choice between “utopia or oblivion”. See <a href="#super-critical-path">super-critical path</a>.</p>'
    },
    {
      id: 'the-world-game',
      title: 'The World Game',
      ref: 'Fuller',
      html: '<p>The <em>World Game</em> was Buckminster Fuller’s proposal, from the 1960s, for a large-scale simulation in which participants would work out how to make the world work for all of humanity in the shortest possible time, through spontaneous cooperation and without harm to anyone. It was an early attempt to use comprehensive data and play to plan global resource use.</p>'
    },
    {
      id: 'livingry',
      title: 'Livingry',
      ref: 'Fuller',
      html: '<p><em>Livingry</em> is Buckminster Fuller’s term for technology that supports and enhances human life, in contrast to “weaponry”. Fuller argued that humanity had devoted most of its ingenuity to weapons, and that redirecting it towards livingry could provide for everyone’s needs – a principle for choosing what to design and build.</p>'
    },
    {
      id: 'positive-externalities',
      title: 'Positive Externalities',
      html: '<p><em>Positive externalities</em> are benefits that an activity confers on others who do not pay for them – as education, research or healthy ecosystems benefit society as a whole. Because markets reward only what can be priced, such activities tend to be under-provided. Designing systems that recognise and reward positive externalities is a counterpart to controlling negative ones.</p>'
    },
    {
      id: 'post-capitalist-realism',
      title: 'Post-capitalist Realism: Post-Capitalism for the 21st Century',
      coined: true,
      html: '<p><em>Post-capitalist realism</em> answers Mark Fisher’s “capitalist realism” – the sense that there is no alternative – by insisting on concrete, workable alternatives suited to 21st century conditions. Rather than utopian blueprints or nostalgic revivals, it seeks realistic paths beyond capitalism grounded in present technologies, institutions and constraints.</p>'
    },
    {
      id: 'left-accelerationism-and-the-red-stack',
      title: 'Left Accelerationism',
      ref: 'Srnicek & Williams',
      html: '<p><em>Left accelerationism</em>, set out in Nick Srnicek and Alex Williams’s “Manifesto for an Accelerationist Politics” (2013) and <em>Inventing the Future</em> (2015), argues for repurposing the technologies of capitalism towards post-work, post-capitalist ends. See <a href="#the-red-stack">the red stack</a>.</p>'
    },
    {
      id: 'fully-automated-luxury-communism',
      title: 'Fully Automated Luxury Communism',
      ref: 'Bastani',
      html: '<p><em>Fully Automated Luxury Communism</em> (2019) is Aaron Bastani’s argument that technologies such as automation, renewable energy, asteroid mining and synthetic biology could make scarcity obsolete, enabling a society of abundance for all. The obstacle, he argues, is not technology but a political economy organised around scarcity and private ownership.</p>'
    },
    {
      id: 'the-end-of-the-economic-problem',
      title: 'The End of the Economic Problem',
      ref: 'Keynes',
      html: '<p>The <em>end of the economic problem</em> refers to John Maynard Keynes’s prediction, in “Economic Possibilities for our Grandchildren” (1930), that within a century productivity would grow enough to solve the problem of scarcity, allowing people to work perhaps fifteen hours a week and turn to the question of how to live well. Why this has not happened is one of the central puzzles of modern economics.</p>'
    },
    {
      id: 'meta-marxism',
      title: 'Meta-Marxism',
      refs: ['Brent Cooper, “Meta-Marxism: The Abstract Critique of Late Capitalism in the Metamodern Age”.'],
      html: '<p><em>Meta-Marxism</em> is the abstraction of <a href="#marxism">Marxism</a> – “after, between, and beyond Marxism(s)” – developed by Brent Cooper in “Meta-Marxism: The Abstract Critique of Late Capitalism in the Metamodern Age”. Since the term “Marxism” is equated with communism by the right and held at a distance by the left, meta-Marxism seeks to recover the conceptual toolbox beneath it – historical materialism, commodity abstraction, class consciousness, alienation – while retiring anachronistic terms such as “proletariat” and “bourgeoisie” for contemporary ones such as the “precariat”. It necessarily includes an autocritique of Marxism itself.</p>'
    },
    {
      id: 'heterodox-economics',
      title: 'Heterodox Economics',
      html: '<p><em>Heterodox economics</em> is the collective name for schools of economic thought outside the neoclassical mainstream – including post-Keynesian, Marxian, institutional, ecological, feminist and complexity economics. They share a scepticism of equilibrium models and rational-actor assumptions, and an attention to power, history, uncertainty and the economy’s embedding in society and nature.</p>'
    },
    {
      id: 'amoral-economy',
      title: 'Amoral Economy',
      coined: true,
      ref: 'Derived from E. P. Thompson (moral economy)',
      refs: ['E. P. Thompson, “The Moral Economy of the English Crowd in the Eighteenth Century”, <em>Past &amp; Present</em> 50 (1971).', 'Karl Polanyi, <em>The Great Transformation</em> (1944).', 'James C. Scott, <em>The Moral Economy of the Peasant</em> (1976).'],
      html: '<p>The <em>amoral economy</em> is derived from E. P. Thompson’s moral economy – the customary norms of fairness and obligation that once bounded economic life – by naming what replaces it: an economy coordinated by prices and optimisation alone, in which moral claims have no standing except as preferences that can be priced. It is not immoral by intent but indifferent by design, treating whatever cannot be counted – dignity, community, the living world – as an externality. What Karl Polanyi called the disembedding of the economy from society is, in these terms, the passage from a moral to an amoral economy.</p><h2>Moral Economy</h2><p>A <em>moral economy</em> is an economy governed by shared norms of fairness and obligation rather than by market prices alone. E. P. Thompson (1971) used the term for the customary expectations of eighteenth-century English crowds, and James C. Scott (1976) for the subsistence ethics of peasant societies. It reminds us that economies are always embedded in moral expectations.</p>'
    },

    {
      id: 'post-capitalist-peace-theory',
      title: 'Post-Capitalist Peace Theory',
      coined: true,
      html: '<p><em>Post-capitalist peace theory</em> considers how peace between societies could be secured once competition for growth and markets no longer drives their relations. Where the “capitalist peace” holds that trade and interdependence reduce war, a post-capitalist account asks what would sustain peace in a world no longer organised around economic rivalry.</p>'
    },
    {
      id: 'win-win',
      title: 'Win-Win',
      ref: 'Boeree',
      html: '<p><em>Win-win</em> refers to positive-sum dynamics in which all parties can benefit, as opposed to zero-sum games in which one side’s gain is another’s loss. Championed by Liv Boeree and others as a counter to <a href="#moloch">Moloch</a>, it emphasises finding and building the structures that allow cooperation to outcompete destructive rivalry.</p>'
    },
    {
      id: 'paretotopia',
      title: 'Paretotopia',
      ref: 'Drexler',
      html: '<p><em>Paretotopia</em> is Eric Drexler’s term for a future in which advanced technology creates such abundance that nearly everyone can be made better off at once – a Pareto improvement on a vast scale. Drexler argues that recognising this possibility could reduce the incentive for destructive competition over the transition to powerful AI, since the gains from cooperation would be so large.</p>'
    },
    {
      id: 'the-liberty-machine',
      title: 'The Liberty Machine',
      ref: 'Beer',
      html: '<p><em>The Liberty Machine</em> is Stafford Beer’s term (1970) for a cybernetic system of governance designed to maximise freedom by giving people and institutions the information and feedback they need to regulate themselves. Beer saw well-designed cybernetic coordination not as control from above, but as a means of preserving autonomy while achieving coherence.</p>'
    },
    {
      id: 'collective-intelligence',
      title: 'Collective Intelligence',
      html: '<p><em>Collective intelligence</em> is the capacity of groups to think, learn and solve problems together in ways that exceed their individual members. It can emerge in markets, science, open-source communities and deliberative institutions, and is increasingly amplified by digital tools. Its study runs from Francis Galton’s ox-weighing crowd (1907) to Wikipedia and prediction markets – and to the opposite failures, groupthink and information cascades, in which a group knows less than its members.</p>'
    },
    {
      id: 'social-choice-and-mechanism-design',
      title: 'Social Choice Theory',
      ref: 'Arrow; Hurwicz, Maskin, Myerson',
      html: '<p><em>Social choice theory</em> studies how individual preferences can be aggregated into collective decisions, and famously shows, through Kenneth Arrow’s impossibility theorem (1951), that no voting rule satisfies every desirable condition. <a href="#mechanism-design">Mechanism design</a> works in reverse, designing rules and incentives so that self-interested behaviour produces desired collective outcomes.</p>'
    },
    {
      id: 'the-epistemic-commons',
      title: 'The Epistemic Commons',
      html: '<p>The <em>epistemic commons</em> is the shared infrastructure of knowledge on which a society depends – its trusted sources, institutions of inquiry, public discourse and common facts. Like any commons, it can be degraded by those who exploit it for private advantage. Protecting and rebuilding it is a precondition for collective <a href="#sensemaking">sensemaking</a> and self-government.</p>'
    },
    {
      id: 'open-society',
      title: 'Open Society',
      ref: 'Popper; Consilience Project',
      html: '<p>An <em>open society</em>, in Karl Popper’s <em>The Open Society and Its Enemies</em> (1945), is one in which institutions can be criticised and changed peacefully, and in which no authority claims final truth. Renewing it for the digital age means asking how open societies can remain resilient against disinformation and coordinate effectively while staying free.</p>'
    },
    {
      id: 'yellow-teaming',
      title: 'Yellow Teaming',
      ref: 'Consilience Project',
      html: '<p><em>Yellow teaming</em> is a counterpart to <a href="#red-teaming">red teaming</a>: rather than asking how a plan could be attacked, it asks what the plan could cause if it succeeds – its second- and third-order effects and externalities. It is a discipline for anticipating the harms that even well-intended, successful innovations can produce.</p>'
    },
    {
      id: 'the-benevolent-dictator',
      title: 'The Benevolent Dictator: Morality & ‘Its’ Demands',
      coined: true,
      refs: ['Max Ramsahoye, “The Benevolent Dictator: Rousseau &amp; Bentham on Morality &amp; ‘Its’ Demands – Living the Good Life as the Conscious Means to the Kingdom of Ends”.', 'Jean-Jacques Rousseau, <em>Emile, or On Education</em> (1762).', 'Jeremy Bentham, <em>An Introduction to the Principles of Morals and Legislation</em> (1789).', 'Peter Singer, “Famine, Affluence, and Morality”, <em>Philosophy &amp; Public Affairs</em> 1 (1972).', 'Fyodor Dostoevsky, <em>The Brothers Karamazov</em> (1880).'],
      html: '<blockquote class="entry-quote"><p>The only tyrant I accept in this world is the ‘still small voice’ within me.</p><footer>Mahatma Gandhi</footer></blockquote>' +
        '<blockquote class="entry-quote"><p>Nothing is more seductive for man than his freedom of conscience. But nothing is a greater cause of suffering.</p><footer>Fyodor Dostoevsky, <em>The Brothers Karamazov</em> (1880)</footer></blockquote>' +
        '<p><em>The benevolent dictator</em> is the personification of morality as a ‘more-than-human’ ‘egregore’ projected from the human mind (‘the conscience’) out into the world like a secular God to rule over our lives. This ‘benevolent dictator’ demands we act in certain ways and not in others, instructing us on how we ought to act for our own good (our sense of virtue) and the good of others (the wider consequences of our actions).</p>' +
        '<h2>Rousseau &amp; Bentham</h2><p>To represent the nature of morality and the mind, Rousseau and Bentham anthropomorphise conscience and ‘the pleasure principle’ as powerful and benevolent rulers:</p>' +
        '<blockquote class="entry-quote"><p>Too often does reason deceive us; we have only too good a right to doubt her; but conscience never deceives us; she is the true guide of man; it is to the soul what instinct is to the body; he who obeys his conscience is following nature and he need not fear that he will go astray… Let us obey the call of nature; we shall see that her yoke is easy and that when we give heed to her voice we find a joy in the answer of a good conscience.</p><footer>Jean-Jacques Rousseau, <em>Emile, or On Education</em></footer></blockquote>' +
        '<blockquote class="entry-quote"><p>Nature has placed mankind under the governance of two sovereign masters, pain and pleasure. It is for them alone to point out what we ought to do, as well as to determine what we shall do. On the one hand the standard of right and wrong, on the other the chain of causes and effects, are fastened to their throne. They govern us in all we do, in all we say, in all we think: every effort we can make to throw off our subjection, will serve but to demonstrate and confirm it. In words a man may pretend to abjure their empire: but in reality he will remain subject to it all the while.</p><footer>Jeremy Bentham, <em>The Principles of Morals and Legislation</em></footer></blockquote>' +
        '<h2>The Demandingness of Morality</h2><p>Utilitarian morality is often criticised for being too demanding. This ‘demandingness objection’ prompted by <a href="#peter-singer">Singer</a>’s ‘principle of sacrifice’, articulated in his classic essay <em>Famine, Affluence and Morality</em>, states that certain normative actions that come at a great cost to our own welfare are not morally obligatory; such as sacrificing most of our own time, money and pleasure for the lives of (spatially and temporally) distant strangers.</p>' +
        '<p>The benevolent dictator metaphorically represents the demandingness of <a href="#effective-altruism">Effective Altruism</a> – the philosophy of using one’s life to do the most good. Upon failure to adhere to its demands, as aspiring ethical subjects, it punishes us with guilt, self-hatred and depression (anhedonia, absence of positive affect). Upon success, it rewards us with relief (absence of negative affect) and perhaps even pride and gratitude for our existence (second-order goods).</p>' +
        '<h2>A Secular Theology of Morality</h2><p>Overall, the idea of the ‘benevolent dictator’ aims to bring divine command theory and the theory of the bicameral mind into a secular context; to reflect philosophical conceptions of <a href="#memetics">memetics</a> and doxastic involuntarism (‘that we do not have beliefs, but beliefs have us’); the ethics of being an object and the inverse instrumentality of morality (‘the hands of God or the Good’); and the almost theological character of ‘the moral landscape’ (that ‘heaven – and hell – is a place on Earth’) and the ‘messiah complex’ of Effective Altruism (‘saving the world’). Most importantly, the metaphor serves to imaginatively capture the EA experience of self-moralisation and to aid others in forming a healthy relationship to living the good life, as the conscious means to the ‘kingdom of ends’.</p>'
    },
    {
      id: 'theory-of-change',
      title: 'Theory of Change',
      html: '<p>A <em>theory of change</em> is an explicit account of how a set of actions is expected to produce a desired outcome – the causal pathway from interventions to results, and the assumptions it depends on. Making it explicit allows it to be tested and revised. At the scale of civilisation, it asks how deep structural change could actually come about.</p>'
    },
    {
      id: 'all-watched-over-by-machines',
      title: 'All Watched Over by Machines of Loving Grace',
      ref: 'Brautigan; Curtis',
      html: '<p><em>All Watched Over by Machines of Loving Grace</em> is the title of Richard Brautigan’s 1967 poem imagining a harmony of humans, nature and benevolent computers, and of Adam Curtis’s documentary series (2011), which examined how the dream of self-regulating systems shaped modern politics and ecology. It names both the hope and the danger of handing coordination to machines.</p><h2>Cybernetic Poetry</h2><p>Brautigan’s poem is cybernetic poetry: it imagines a “cybernetic meadow” and a “cybernetic forest” in which mammals and computers live together “in mutually programming harmony”, and humans are freed from labour, “all watched over by machines of loving grace”. It captures the utopian hope that <a href="#cybernetics">cybernetics</a> could reconcile technology, nature and human freedom in a single self-regulating system. Read alongside Curtis’s documentary, the same lines become ambiguous – the loving grace of the machines may also be a form of control, and the harmony of the system may leave no room for the people within it to steer it.</p>'
    },
    {
      id: 'ecological-civilisation',
      title: 'Ecological Civilisation',
      ref: 'Xi Jinping; CPC',
      html: '<p><em>Ecological civilisation</em> is a concept of a society organised in harmony with nature, adopted as an official goal by the Chinese state and written into its constitution in 2018. Beyond its Chinese usage, the term is used more widely to describe a civilisation whose economy, culture and institutions are designed around ecological sustainability.</p>'
    },
    {
      id: 'the-great-alignment',
      title: 'The Great Alignment',
      coined: true,
      html: '<p>The <em>great alignment</em> is the project of aligning not only artificial intelligence with human values, but humanity’s institutions, economies and technologies with the long-term flourishing of people and the biosphere. It frames AI alignment as one instance of a broader civilisational problem: bringing powerful optimising systems of every kind into accord with what is truly valuable.</p>'
    },
    {
      id: 'macrostrategy',
      title: 'Macrostrategy',
      kind: 'category',
      order: 10,
      parent: 'theproject',
      ref: 'Bostrom',
      html: '<p><em>Macrostrategy</em>, as developed by Nick Bostrom and the Future of Humanity Institute, is the study of how long-term outcomes for humanity depend on present choices – which interventions matter most, in what order, and in light of which <a href="#crucial-consideration">crucial considerations</a>. It seeks the big-picture strategy by which civilisation might navigate transformative technologies safely.</p>'
    },
    {
      id: 'solved-world',
      title: 'Solved World',
      ref: 'Bostrom (Deep Utopia)',
      html: '<p>A <em>solved world</em>, in Nick Bostrom’s <em>Deep Utopia</em> (2024), is one in which advanced technology has solved humanity’s practical problems – scarcity, disease, even the need for work. Bostrom asks what meaning and purpose would remain for people in such a world, and whether a life without necessity could still be a good one.</p>'
    },
    {
      id: 'longtermism',
      title: 'Longtermism',
      html: '<p><em>Longtermism</em> is the view that positively influencing the long-term future is a key moral priority of our time, because the number of people who may live in the future is vast and what we do now may shape their lives. It motivates particular attention to existential risks and to choices that could lock in the long-run trajectory of civilisation.</p>'
    },
    {
      id: 'post-humanism',
      title: 'Posthumanism',
      ref: 'Humanism',
      html: '<p><em>Post-humanism</em> covers two related currents: a critique of humanism that questions the human as the measure of all things, and the prospect of beings – enhanced, digital or artificial – that go beyond present human forms. Both challenge the assumption that the human, as currently constituted, is the fixed centre of value and history.</p>'
    },
    {
      id: 'life-3-0',
      title: 'Life 3.0',
      ref: 'Tegmark',
      html: '<p><em>Life 3.0</em> is Max Tegmark’s term, from his book of that name (2017), for life that can design both its software and its hardware. Where biological life (1.0) evolves both and cultural life (2.0) can learn new software, life 3.0 – enabled by AI – could redesign itself entirely. Tegmark uses the frame to explore the futures AI might bring.</p>'
    },
    {
      id: 'prometheanism',
