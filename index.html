<title>Civilisation Theory Map</title>

<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='0,0 100,0 0,100' fill='%23000'/></svg>">
<script>
  // Never restore the previous scroll position: every load starts at the top.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.addEventListener('pageshow', function () { window.scrollTo(0, 0); });

  // Favicon follows the theme: the black triangle, recoloured to each theme's text on its background.
  var FAVICON_COLOURS = {
    light: ['#fffff8', '#111111'], dark: ['#151515', '#e8e6de'],
    sepia: ['#f4ecd8', '#3b2e1e'], midnight: ['#161f36', '#e4e8f2']
  };
  function setFavicon(theme) {
    var c = FAVICON_COLOURS[theme] || FAVICON_COLOURS.light;
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +
      "<rect width='100' height='100' rx='18' fill='" + c[0] + "'/>" +
      "<polygon points='18,18 82,18 18,82' fill='" + c[1] + "'/></svg>";
    var link = document.getElementById('favicon');
    if (link) link.href = 'data:image/svg+xml,' + svg.replace(/#/g, '%23');
  }

  // Apply saved theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem('ct-theme'); } catch (e) {}
    if (['light', 'sepia', 'midnight', 'dark'].indexOf(t) < 0) {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    setFavicon(t);
    try {
      var a = localStorage.getItem('ct-accent');
      if (a === 'on' || a === 'alt') document.documentElement.classList.add('accent');
      if (a === 'alt') document.documentElement.classList.add('accent-alt');
    } catch (e) {}
    var v = null;
    try { v = localStorage.getItem('ct-index'); } catch (e) {}
    document.documentElement.setAttribute('data-index', v === 'az' || v === 'ce' ? v : 'tree');
  })();
</script>

  * { box-sizing: border-box; }
  /* Accent links (toggled with C, off by default) */
  /* White has a second accent (C cycles: off → first → second → off) */
  :root[data-theme="light"].accent-alt { --accent: #a8402a; }
  :root.accent .description a {
    color: var(--accent);
    text-decoration-color: color-mix(in srgb, var(--accent) 50%, transparent);
  }
  :root.accent .description a:hover { text-decoration-color: var(--accent); }
  ::selection { background: var(--select); color: var(--text); }
  html { font-size: 17px; scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  @media (min-width: 900px) { html { font-size: 19px; } }

  html, body { cursor: var(--cursor); }
  a, button, a *, button * { cursor: var(--cursor-link); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'ET Bembo', 'ETBembo', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    line-height: 1.55;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: oldstyle-nums;
    transition: background-color .2s ease, color .2s ease;
  }

  a {
    color: var(--link);
    text-decoration: underline;
    text-decoration-color: var(--link-underline);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  a:hover { text-decoration-color: var(--text); }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: var(--cursor-link);
  }
  button:focus-visible, a:focus-visible {
    outline: 1px solid var(--text);
    outline-offset: 3px;
  }

  /* ---------- Controls ---------- */
  .control {
    position: fixed;
    z-index: 30;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: color .2s ease, opacity .25s ease, left .25s ease;
  }
  .control:hover { color: var(--text); }
  /* Lines stay 1.4px whatever each icon's viewBox scale, so all icons share one weight */
  .control svg * { vector-effect: non-scaling-stroke; }
  .control svg {
    width: 1.05rem;
    height: 1.05rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4px;
    stroke-linejoin: miter;
    overflow: visible;
    transition: transform .25s ease;
  }
  /* Sidebar toggle: middle of the left side; points left to close, right to open */
  #sidebar-toggle {
    top: 50%;
    /* Open: just outside the sidebar's right edge */
    left: calc(var(--side-w) + 0.4rem);
    transform: translateY(-50%);
  }
  body.sidebar-closed #sidebar-toggle { left: 1.4rem; }
  /* With the footer in view the sidebar is closed and its toggle steps away */
  body.footer-in-view #sidebar-toggle { opacity: 0; pointer-events: none; }
  /* Open: arrow pointing left (close). Closed: map icon (open). */
  #sidebar-toggle .i-close { transform: rotate(90deg); }
  #sidebar-toggle .i-map, body.sidebar-closed #sidebar-toggle .i-close { display: none; }
  body.sidebar-closed #sidebar-toggle .i-map { display: block; }
  #theme-toggle { top: 0.8rem; right: 0.9rem; }
  /* Back arrow: top-left corner of the page area (beside the sidebar when it is open) */
  #back-btn { top: 0.8rem; left: 1.4rem; transition: left .25s ease, opacity .2s ease; }
  body:not(.sidebar-closed) #back-btn { left: calc(var(--side-w) + 1rem); }
  /* U-turn arrow: square ends and a finer line than the other icons */
  #back-btn svg { stroke-linecap: butt; stroke-width: 1.1px; }
  html.page-home #back-btn { display: none; }
  #back-btn:disabled { opacity: 0.25; pointer-events: none; }
  /* One icon per theme: sun (white), moon (black), filled sun (sepia), moon and star (blue) */
  #theme-toggle svg { display: none; width: 1.25rem; height: 1.25rem; }
  :root[data-theme="light"] #theme-toggle .i-light,
  :root[data-theme="dark"] #theme-toggle .i-dark,
  :root[data-theme="sepia"] #theme-toggle .i-sepia,
  :root[data-theme="midnight"] #theme-toggle .i-midnight { display: block; }
  #theme-toggle .fill { fill: currentColor; stroke: none; }
  #to-top { bottom: 1.4rem; right: 1.4rem; opacity: 0; pointer-events: none; }
  #to-top svg { transform: rotate(180deg); }
  #to-top.visible { opacity: 1; pointer-events: auto; }

  /* ---------- Press effect (click and keyboard shortcuts) ---------- */
  /* Icons: a squeeze and an expanding ring; text links and buttons: a highlight flash */
  .side-icons a { position: relative; }
  .control.pressed, .side-icons a.pressed, .head-icons .pressed { color: var(--text); }
  .control.pressed svg, .side-icons a.pressed svg, .head-icons .pressed svg { animation: press-squeeze .32s ease; }
  .control.pressed::after, .side-icons a.pressed::after, .head-icons .pressed::after {
    content: '';
    position: absolute;
    inset: -0.15rem;
    border-radius: 50%;
    border: 1.4px solid currentColor;
    pointer-events: none;
    animation: press-ring .55s ease-out forwards;
  }
  a.pressed:not(.side-icons a):not(.head-icons a), button.pressed:not(.control):not(.head-icons button) {
    animation: press-flash .6s ease-out;
    border-radius: 2px;
  }
  @keyframes press-squeeze { 0% { scale: 1; } 35% { scale: 0.78; } 100% { scale: 1; } }
  @keyframes press-ring { from { transform: scale(0.45); opacity: 0.7; } to { transform: scale(1.45); opacity: 0; } }
  @keyframes press-flash { from { background-color: var(--select); } to { background-color: transparent; } }
  @media (prefers-reduced-motion: reduce) {
    .control.pressed svg, .side-icons a.pressed svg, .control.pressed::after, .side-icons a.pressed::after { animation: none; }
  }

  /* ---------- Search (top of the sidebar) ---------- */
  #search {
    position: relative;
    margin: 0 0 1.3rem;
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
  }
  #search > svg {
    position: absolute;
    left: 0;
    top: 0.5rem;
    width: 0.8rem;
    height: 0.8rem;
    fill: none;
    stroke: var(--muted);
    stroke-width: 1.4px;
    pointer-events: none;
  }
  #search > svg * { vector-effect: non-scaling-stroke; }
  #search-input {
    width: 100%;
    font: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--text);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--rule);
    padding: 0.35rem 0 0.35rem 1.3rem;
    border-radius: 0;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  #search-input::placeholder { color: var(--muted); }
  #search-input:focus { border-bottom-color: var(--text); }
  #search-input::-webkit-search-cancel-button { -webkit-appearance: none; }
  #search-results {
    list-style: none;
    margin: 0.4rem 0 0;
    padding: 0.3rem 0;
    max-height: 50vh;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--rule);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }
  #search-results li a {
    display: block;
    padding: 0.4rem 0.8rem;
    text-decoration: none;
    color: var(--text);
  }
  #search-results li a[aria-selected="true"], #search-results li a:hover { background: var(--select); }
  #search-results .r-title { display: block; font-family: 'ET Bembo', Georgia, serif; font-size: 0.95rem; line-height: 1.25; }
  #search-results .r-path { display: block; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.1rem; }
  #search-results .r-none { padding: 0.4rem 0.8rem; font-size: 0.72rem; color: var(--muted); }
  @media (max-width: 899px) {
  }

  /* ---------- Reading progress (replaces the scrollbar) ---------- */
  #progress {
    position: fixed;
    top: 0; right: 0;
    width: 5px;
    height: 100%;
    background: var(--text);
    transform-origin: top;
    transform: scaleY(0);
    z-index: 40;
    pointer-events: none;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--side-w);
    background: var(--bg-side);
    border-right: 1px solid var(--rule);
    padding: 1.6rem 1.4rem 2rem;
    overflow-y: auto;
    scrollbar-width: none;
    z-index: 20;
    transition: transform .25s ease, background-color .2s ease;
  }
  body.sidebar-closed #sidebar { transform: translateX(-100%); }

  /* Interface labels (map, tree string, contents) are set in IBM Plex Sans Arabic */
  .side-title, .tree-string, .count {
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
    font-variant-numeric: normal;
  }
  .side-title, .tree-string, .count {
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .side-title { margin: 0 0 1rem; }
  .side-title a { color: inherit; text-decoration: none; }
  .side-title a:hover, .side-title a[aria-current="page"] { color: var(--text); }
  .side-icons { display: flex; gap: 0.9rem; margin: 0 0 1.1rem; }
  .side-icons a { display: flex; color: var(--muted); }
  .side-icons a:hover, .side-icons a[aria-current="page"] { color: var(--text); }
  .side-icons svg {
    width: 1.05rem;
    height: 1.05rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4px;
    stroke-linejoin: miter;
    overflow: visible;
  }
  .side-icons svg * { vector-effect: non-scaling-stroke; }
  .tree, .tree ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .tree ul { padding-left: 1.2rem; }
  /* The sections sit flush under the top Civilisation Theory entry, not indented beneath it */
  #tree > li > ul { padding-left: 0; }
  .tree li { margin: 0.15rem 0; }
  .tree a {
    text-decoration: none;
    color: var(--muted);
    display: inline-block;
    line-height: 1.35;
    padding: 0.1rem 0;
  }
  .tree a:hover { color: var(--text); }
  /* Categories in the sidebar tree: small spaced capitals, like the map label */
  .tree li.is-category > a {
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }
  /* The nine sections: no indent beneath them – set apart by size and weight instead */
  #tree > li > ul > li > ul { padding-left: 0; }
  #tree > li > ul > li > a {
    font-family: inherit;
    font-size: 1.12em;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
    color: var(--text);
    margin-top: 1.3rem;
  }
  #tree > li > ul > li:first-child > a { margin-top: 0; }
  /* The root (Civilisation Theory) is not listed: the sidebar starts at the sections */
  #tree > li > a { display: none; }
  #tree > li > ul > li > a:hover { color: var(--text); text-decoration: underline; text-decoration-color: var(--link-underline); text-underline-offset: 3px; }
  .tree a[aria-current] { color: var(--active); }
  /* Filtering from the sidebar search: non-matches folded away; matches in full text colour */
  .tree li.f-out { display: none; }
  .tree.filtering a:not(.hit) { opacity: 0.75; }
  #tree > li > ul > li > a { opacity: 1 !important; }
  .tree a.hit { color: var(--text); }
  .tree a.hit mark { background: var(--select); color: inherit; }
  .tree a.hit.sel { text-decoration: underline; text-decoration-color: var(--link-underline); text-underline-offset: 3px; }
  #tree-none { margin: 0.6rem 0 0; font-size: 0.9rem; color: var(--muted); }
  .tree .empty {
    color: var(--muted);
    margin-top: 0.35rem;
  }

  /* ---------- Main ---------- */
  /* Short entries sit centred on screen; long ones start at the 5rem top cap */
  main {
    padding: 5rem 0 6rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: padding-left .25s ease;
    container-type: inline-size;
  }
  .page { width: 100%; }
  @media (min-width: 900px) {
    body:not(.sidebar-closed) main { padding-left: var(--side-w); }
  }
  .page {
    display: grid;
    grid-template-columns: minmax(1.5rem, 1fr) minmax(0, var(--measure)) minmax(1.5rem, 1fr);
  }
  /* Map open on desktop: keep the text clear of the close arrow beside the sidebar edge */
  @media (min-width: 900px) {
    body:not(.sidebar-closed) .page {
      grid-template-columns: minmax(3.4rem, 1fr) minmax(0, var(--measure)) minmax(1.5rem, 1fr);
    }
  }
  article {
    grid-column: 2;
    text-align: left;
    min-width: 0;
  }

  /* ---------- Header: the title in the top-right corner, the menu icons running on to its right
     (ending beside the theme toggle, which completes the row) ---------- */
  #site-header { border-bottom: 1px solid var(--rule); background: var(--bg-side); }
  /* Header and footer frame the main pages only; concept entries stand alone */
  html:not(.main-page) #site-footer { display: none; }
  /* On entries the header sits over the top of the page in the page's own colour, with no rule,
     and takes no space, so entries stay centred on screen */
  html:not(.main-page) #site-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    background: var(--bg); border-bottom: 0;
  }
  /* Hudless mode (H): only the text itself – no header, footer, sidebar, icons, contents or tree string */
  /* The interface fades out (and back in); nothing moves, so the text stays exactly where it is */
  html.hudless #site-header, html.hudless #site-footer, html.hudless #sidebar, html.hudless #scrim,
  html.hudless .control, html.hudless #progress, html.hudless #toc,
  html.hudless #entry > p.tree-string { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
  html.hud-fade #site-header, html.hud-fade #site-footer, html.hud-fade #sidebar, html.hud-fade #scrim,
  html.hud-fade .control, html.hud-fade #progress, html.hud-fade #toc,
  html.hud-fade #entry > p.tree-string { transition: opacity .6s ease, visibility .6s, transform .25s ease, left .25s ease !important; }
  .head-inner {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 1.4rem;
    padding: 0.8rem 3.1rem 0.8rem 1.5rem;  /* right: clear of the theme toggle */
    min-height: 2rem;
  }
  .head-title {
    font-size: 1.12rem; font-weight: 700; line-height: 1; letter-spacing: 0.005em;
    color: var(--text); text-decoration: none; white-space: nowrap;
  }
  .head-icons { display: flex; align-items: center; gap: 0.25rem; }
  .head-icons a, .head-icons button {
    position: relative;
    width: 2rem; height: 2rem;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); background: none;
    transition: color .2s ease;
  }
  .head-icons a:hover, .head-icons button:hover, .head-icons a[aria-current="page"] { color: var(--text); }
  /* Entries: shortly after the page opens, the header icons (and the theme toggle) slide right and
     fade into a single menu icon in the corner; hovering it slides them back out */
  #site-header .head-icons a, #site-header .head-icons button, #theme-toggle {
    transition: color .2s ease, transform .5s cubic-bezier(.4, 0, .2, 1), opacity .4s ease;
  }
  html.icons-folded:not(.icons-open) #site-header .head-icons a,
  html.icons-folded:not(.icons-open) #site-header .head-icons button {
    transform: translateX(var(--fold-x, 0px)); opacity: 0; pointer-events: none;
  }
  html.icons-folded:not(.icons-open) #theme-toggle { opacity: 0; pointer-events: none; }
  #head-menu {
    position: fixed; top: 0.8rem; right: 0.9rem; z-index: 29;
    width: 2rem; height: 2rem;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); background: none;
    opacity: 0; pointer-events: none;
    transition: opacity .4s ease;
  }
  #head-menu svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentColor; stroke-width: 1.4px; overflow: visible; }
  #head-menu svg * { vector-effect: non-scaling-stroke; }
  html.icons-folded:not(.icons-open) #head-menu { opacity: 1; pointer-events: auto; transition-delay: .2s; }
  html.icons-folded #head-menu:hover { color: var(--text); }
  html.hudless #head-menu { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
  /* The current page: a short rule beneath its icon */
  .head-icons a[aria-current="page"]::before {
    content: ''; position: absolute; left: 0.55rem; right: 0.55rem; bottom: -0.1rem;
    border-bottom: 1px solid var(--text);
  }
  .head-icons svg * { vector-effect: non-scaling-stroke; }
  .head-icons svg {
    width: 1.05rem; height: 1.05rem;
    fill: none; stroke: currentColor; stroke-width: 1.4px; stroke-linejoin: miter; overflow: visible;
  }
  /* Phones: tighter, and clear of the map and back controls in the top-left corner */
  @media (max-width: 640px) {
    .head-inner { gap: 0.6rem; padding-left: 5.3rem; padding-right: 2.9rem; }
    .head-title { font-size: 0.98rem; }
    .head-icons { gap: 0; }
    .head-icons [data-page="home"] { display: none; }  /* the title links home */
    .head-icons a, .head-icons button { width: 1.8rem; }
  }

  /* ---------- Search page ---------- */
  .sp-field { position: relative; border-bottom: 1px solid var(--text); margin: 0.4rem 0 1rem; }
  .sp-field svg {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 1.3rem; height: 1.3rem; fill: none; stroke: var(--muted); stroke-width: 1.4px;
  }
  .sp-field svg * { vector-effect: non-scaling-stroke; }
  #sp-input {
    width: 100%; font: inherit; font-size: 1.9rem; line-height: 1.2; color: var(--text);
    background: none; border: 0; outline: none; padding: 0.5rem 0 0.6rem 2.3rem;
    -webkit-appearance: none; appearance: none;
  }
  #sp-input::placeholder { color: var(--muted); opacity: 0.6; }
  #sp-input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .description .sp-meta {
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 2rem;
  }
  .description .sp-results { list-style: none; padding: 0; margin: 0; }
  .description .sp-results li {
    position: relative; margin: 0; padding: 1.1rem 0 1.15rem; border-top: 1px solid var(--rule);
  }
  /* The result Enter would open: a short bar in the margin */
  .description .sp-results li.sel::before {
    content: ''; position: absolute; left: -1rem; top: 1.25rem; bottom: 1.3rem; border-left: 2px solid var(--text);
  }
  .sp-title { font-size: 1.3rem; font-weight: 600; line-height: 1.2; }
  .sp-path {
    display: block; margin-top: 0.35rem;
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.58rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  }
  .description .sp-snip { margin: 0.55rem 0 0; font-size: 0.95rem; line-height: 1.5; color: var(--muted); }
  .sp-snip mark { background: var(--select); color: var(--text); }
  @media (max-width: 640px) { #sp-input { font-size: 1.5rem; } }

  /* ---------- Page transitions: the old page fades out, then the new one fades in ---------- */
  /* The fixed interface stays put while the page changes beneath it */
  #sidebar { view-transition-name: ui-sidebar; }
  #sidebar-toggle { view-transition-name: ui-toggle; }
  #back-btn { view-transition-name: ui-back; }
  #theme-toggle { view-transition-name: ui-theme; }
  #to-top { view-transition-name: ui-top; }
  #progress { view-transition-name: ui-progress; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none; }
  ::view-transition-group(ui-sidebar), ::view-transition-group(ui-toggle), ::view-transition-group(ui-back),
  ::view-transition-group(ui-theme), ::view-transition-group(ui-top), ::view-transition-group(ui-progress) { z-index: 5; }
  ::view-transition-old(root) { animation: page-fade-out .22s ease-in both; }
  ::view-transition-new(root) { animation: page-fade-in .32s ease-out .2s both; }
  @keyframes page-fade-out { to { opacity: 0; } }
  @keyframes page-fade-in { from { opacity: 0; } }

  /* ---------- Footer ---------- */
  #site-footer {
    border-top: 1px solid var(--rule);
    background: var(--bg-side);
    padding: 3.4rem 0 3.6rem;
    transition: padding-left .25s ease;
  }
  @media (min-width: 900px) {
    body:not(.sidebar-closed) #site-footer { padding-left: var(--side-w); }
  }
  #site-footer { container-type: inline-size; }
  /* Only as wide as its content, and centred, so the space either side is equal */
  .foot-inner { width: fit-content; max-width: calc(100% - 3rem); margin: 0 auto; }
  /* Title and description on the left; the menus in two columns on the right */
  .foot-main { display: grid; grid-template-columns: 31rem auto; gap: 3rem; }
  .foot-title { margin: 0 0 0.6rem; font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
  .foot-title a { color: inherit; text-decoration: none; }
  .foot-desc { margin: 0 0 1rem; color: var(--muted); font-size: 0.93rem; line-height: 1.5; }
  .foot-stats, .foot-head, .foot-num {
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
  }
  .foot-stats { margin: 0; font-size: 0.74rem; font-weight: 500; letter-spacing: 0.01em; color: var(--muted); line-height: 1.8; }
  .foot-stats span { white-space: nowrap; }
  .foot-stats span + span::before { content: '·'; margin: 0 0.7em 0 0.45em; }
  .foot-cols { display: grid; grid-template-columns: max-content max-content; gap: 2.2rem; padding-top: 0.5rem; }
  .foot-head { margin: 0 0 0.9rem; font-size: 0.74rem; font-weight: 600; letter-spacing: 0.01em; color: var(--muted); }
  .foot-secs { display: grid; grid-template-columns: repeat(3, max-content); gap: 0 1.6rem; }
  .foot-col li { white-space: nowrap; }
  .foot-col ul { list-style: none; margin: 0; padding: 0; }
  .foot-col ul + .foot-head { margin-top: 1.9rem; }
  .foot-icons { flex-direction: column; align-items: flex-start; gap: 0; margin-left: -0.5rem; }
  /* One icon per row, each row the same height as a section row, so they line up across */
  .head-icons.foot-icons a { height: calc(0.92rem * 1.3); margin-bottom: 0.6rem; }  /* first icon's stroke in line with the heading */
  .foot-col li { display: flex; align-items: baseline; margin: 0 0 0.6rem; font-size: 0.92rem; line-height: 1.3; }
  .foot-col a { color: var(--text); text-decoration: none; }
  .foot-col a:hover { text-decoration: underline; text-decoration-color: var(--link-underline); text-underline-offset: 0.15em; }
  .foot-num { flex: none; width: 1.9rem; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
  /* Not wide enough for everything in one row: title and description above, menus beneath */
  @container (max-width: 1435px) {
    .foot-main { grid-template-columns: 1fr; gap: 2.2rem; }
    .foot-lede { max-width: 40rem; }
  }
  @media (max-width: 899px) {
    .foot-main { grid-template-columns: 1fr; gap: 2.4rem; }
    .foot-cols { grid-template-columns: 1fr; gap: 2rem; }
    .foot-secs { grid-template-columns: 1fr; }
    .foot-col li { white-space: normal; }
  }
  @media (max-width: 640px) {
    #site-footer { padding-bottom: 4.6rem; }  /* clear of the back-to-top arrow */
    .foot-num { width: 1.8rem; }
  }

  /* ---------- Contents (left of the text column) ---------- */
  #toc {
    grid-column: 1;
    /* Centred in the left column: equal space to the screen (or map) edge and to the text */
    justify-self: center;
    width: max-content;
    max-width: 7rem;
    position: sticky;
    top: 50vh;
    transform: translateY(-50%);
    align-self: start;
    font-size: 0.85rem;
    line-height: 1.35;
  }
  #toc .toc-title {
    display: block;
    font-size: 1.2em;
    line-height: 1.2;
    font-weight: 600;
    margin: 0 0 0.8rem;
  }
  #toc ul { list-style: none; margin: 0; padding: 0; }
  #toc li { margin: 0 0 0.55rem; }
  #toc a { color: var(--muted); text-decoration: none; }
  #toc a:hover, #toc a.active { color: var(--text); }
  /* Contents only show while the map is closed */
  body:not(.sidebar-closed) #toc { display: none; }
  /* Map closed: the map arrow sits at the screen edge, so keep clear of it */
  @container (max-width: 66rem) {
    body.sidebar-closed #toc { display: none; }
  }
  /* Map closed and room to spare: widen so every entry fits on one line */
  @container (min-width: 72rem) {
    body.sidebar-closed #toc { max-width: 11.5rem; }
  }

  .tree-string { margin: 0 0 1.8rem; line-height: 2; }
  .tree-string a { color: var(--muted); text-decoration: none; }
  .tree-string a:hover { color: var(--text); }
  .tree-string .node { white-space: nowrap; }
  .tree-string .sep { margin: 0 0.45em; }
  /* When the string would run onto a second line, its earliest nodes step out above it as a
     smaller, fainter vertical stack – just enough of them for the rest to fit on one line */
  .ts-stack { display: block; font-size: 0.86em; opacity: 0.6; line-height: 2.15; margin-bottom: 0.4rem; }
  .ts-stack .ts-row { display: block; }
  .ts-line { display: block; }
  /* On an entry, the stack sits above the line without taking up space, so it can fold away
     after the page loads (and unfold on hover) without moving anything else on the page */
  p.tree-string:not(.slide-meta) { position: relative; }
  p.tree-string:not(.slide-meta) .ts-stack {
    position: absolute; left: 0; bottom: 100%;
    margin: 0; padding-bottom: 0.4rem;
    transition: opacity .45s ease, transform .45s ease, visibility 0s;
  }
  p.tree-string.ts-folded .ts-stack {
    opacity: 0; visibility: hidden; transform: translateY(0.4rem);
    transition: opacity .45s ease, transform .45s ease, visibility 0s .45s;
  }
  p.tree-string.ts-folded:hover .ts-stack {
    opacity: 0.6; visibility: visible; transform: none;
    transition: opacity .3s ease, transform .3s ease, visibility 0s;
  }

  h1 {
    font-weight: 700;
    font-size: 2.6rem;
    line-height: 1.1;
    margin: 0 0 1.6rem;
    letter-spacing: -0.005em;
  }
  h2 {
    font-weight: 600;
    font-size: 1.45rem;
    line-height: 1.2;
    margin: 2.4rem 0 0.8rem;
  }
  h1, h2 { scroll-margin-top: 1.5rem; }
  p { margin: 0 0 1.1rem; }
  /* Body text: 1.4 line spacing, 15px between paragraphs (and list items) */
  .description { font-size: 1.1rem; line-height: 1.4; }
  .description p, .description ul { margin: 0 0 15px; }
  .description ul { padding-left: 1.3rem; }
  .description li { margin-bottom: 15px; padding-left: 0.2rem; }
  .description li strong { font-weight: 700; font-size: 1em; }

  .description .count {
    border-top: 1px solid var(--rule);
    padding-top: 2.4rem;
    margin-top: 3.4rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .index-view button {
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: var(--muted);
  }
  .index-view button:hover { color: var(--text); }
  .index-view .sep { margin: 0 0.5em; }
  :root[data-index="tree"] .index-view [data-view="tree"],
  :root[data-index="az"] .index-view [data-view="az"] { color: var(--text); }
  :root[data-index="tree"] .az-view,
  :root[data-index="tree"] .ce-list,
  :root[data-index="az"] .index-list,
  :root[data-index="az"] .ce-list,
  :root[data-index="ce"] .index-list,
  :root[data-index="ce"] .az-view { display: none; }
  .az-view { margin-top: 2.4rem; }
  .az-view .az-list { margin-top: 0; }
  :root[data-index="ce"] .index-view [data-view="ce"] { color: var(--text); }
  /* The Map page's view switcher: three equal tabs, each hung from a rule that thickens and
     darkens under the view in use; name in Bembo, tally in the interface face beneath */
  .description .index-tabs {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.4rem;
    margin: 3.4rem 0 0;
  }
  html.page-map .description .index-tabs { gap: 2.4rem; }
  .index-tabs button {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    text-align: left;
    padding: 1rem 0 0;
    border-top: 1px solid var(--rule);
    background: none;
    box-shadow: inset 0 1px 0 transparent;
    color: var(--muted);
    transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .index-tabs button:hover { color: var(--text); border-top-color: var(--muted); }
  .index-tabs .tab-name {
    font-family: inherit;
    font-size: 1.22rem;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: 0;
    text-transform: none;
  }
  .index-tabs .tab-meta {
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  :root[data-index="tree"] .index-tabs [data-view="tree"],
  :root[data-index="az"] .index-tabs [data-view="az"],
  :root[data-index="ce"] .index-tabs [data-view="ce"] {
    color: var(--text);
    border-top-color: var(--text);
    box-shadow: inset 0 1px 0 var(--text);
  }
  @media (max-width: 640px) {
    /* Phones: the three tabs stay side by side, names only */
    .description .index-tabs { gap: 0.9rem; }
    .index-tabs button { padding-top: 0.75rem; }
    .index-tabs .tab-name { font-size: 0.95rem; }
    .index-tabs .tab-meta { display: none; }
  }
  /* The Map page: a much wider text column, with four columns in each index view */
  html.page-map { --measure: 54rem; }
  /* The Map page's index is more generously spaced */
  html.page-map .description .index-cols,
  html.page-map .description .ce-list ul { column-gap: 2.4rem; line-height: 1.4; }
  html.page-map .az-list { column-gap: 2.4rem; row-gap: 2.8rem; line-height: 1.4; }
  html.page-map .description .index-cols li,
  html.page-map .description .az-list li { margin-bottom: 0.7rem; }
  html.page-map .description .ce-list li { margin-bottom: 1.1rem; }
  html.page-map .description .index-cols ul { margin-top: 0.7rem; }
  html.page-map .description .index-cols > li.has-kids { padding-bottom: 1.8rem; }
  html.page-map .description .index-cols > li:not(.has-kids) + li.has-kids { padding-top: 1.1rem; }
  html.page-map .description .index-domain { margin-top: 3.6rem; padding-top: 2.8rem; }
  html.page-map .description .index-domain.set-start { margin-top: 4.8rem; }
  html.page-map .description .domain-desc { margin-bottom: 2.4rem; }
  html.page-map .description .index-menu { padding-bottom: 2rem; }
  html.page-map .description .menu-cols { gap: 2.4rem; }
  @media (min-width: 641px) { html.page-map .description .menu-col + .menu-col { padding-left: 2.4rem; } }
  html.page-map .description .menu-sec { margin-bottom: 1.4rem; }
  html.page-map .description .az-letter { margin-bottom: 1rem; }
  /* Conceptual Engineerings list */
  .ce-list { margin-top: 2.4rem; }
  .description .ce-title { font-size: 1.7rem; font-weight: 700; line-height: 1.15; margin: 3.4rem 0 0.8rem; }
  .description .ce-desc { color: var(--muted); font-size: 0.92em; line-height: 1.45; margin: 0 0 2.8rem; max-width: 36rem; }
  .description .ce-intro {
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 1.4rem;
  }
  .description .ce-list ul { list-style: none; padding: 0; margin: 0; columns: 3; column-gap: 1.4rem; font-size: 0.9em; line-height: 1.3; }
  .description .ce-list li { margin: 0 0 0.95rem; padding: 0; break-inside: avoid; }
  @media (max-width: 640px) { .description .ce-list ul { columns: 1; font-size: 1em; } }

  /* ---------- Infinite: one concept per full-screen slide ---------- */
  .slide-nav { display: none; }
  html.snap-slides .slide-nav { display: block; }
  #slide-prev, #slide-next { right: 1.4rem; }
  #slide-prev { top: calc(50% - 2.3rem); }
  #slide-next { top: calc(50% + 0.3rem); }
  #slide-prev svg { transform: rotate(180deg); }
  .slide-nav .control:disabled { opacity: 0.25; pointer-events: none; }
  [hidden] { display: none !important; }
  /* Deck menu: every concept A–Z, or one of the nine sections (three columns, one per set) */
  .description .deck-menu {
    margin: 3.4rem 0 0;
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
  }
  .deck-menu button {
    display: grid;
    grid-template-columns: 1.9rem 1fr auto;
    column-gap: 0.6rem;
    align-items: baseline;
    width: 100%;
    text-align: left;
    background: none;
    color: var(--muted);
    font: inherit;
    padding: 0.55rem 0;
    border-top: 1px solid var(--rule);
    transition: color 0.2s ease;
  }
  .deck-menu button:hover { color: var(--text); }
  .deck-menu button[aria-pressed="true"] { color: var(--text); }
  .deck-menu button[aria-pressed="true"] .deck-name { font-weight: 600; }

  html.snap-slides { scroll-snap-type: y proximity; }
  .slide {
    min-height: 100vh;

    flex-direction: column;
    justify-content: center;

    border-bottom: 1px solid var(--rule);

  .slide:last-child { border-bottom: 0; }
  .slides { margin-top: 1rem; }
  .description .slide-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    align-items: last baseline;  /* the count sits level with the single line, below any stack */

    margin: 0 0 1.2rem;
  }
  .slide-meta .crumbs { flex: 1 1 auto; min-width: 0; }
  .slide-count { white-space: nowrap; }
  .description .slide-title {

  .slide-title a:hover { text-decoration: underline; text-decoration-color: var(--link-underline); }
  @media (max-width: 899px) { .description .slide-title { font-size: 2.1rem; } }

  /* A–Z: letters dealt across three columns (A, B, C, then D under A, E under B…), each letter's
     concepts listed down beneath it; each column keeps its own height, so no row gaps */
  .az-list {
    margin-top: 2.4rem; font-size: 0.9em; line-height: 1.3;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 1.4rem; row-gap: 2rem;
    align-items: start;
  }
  .az-col { min-width: 0; display: flex; flex-direction: column; gap: 2rem; }
  html.page-map .az-col { gap: 2.8rem; }
  .az-group { min-width: 0; }
  .description .az-letter {
    font-size: 1.31em;
    font-weight: 700;
    line-height: 1;
    margin: 0 0 0.6rem;
    padding-top: 0.2rem;
  }
  .description .az-list ul { list-style: none; padding: 0; margin: 0; }
  .description .az-list li { margin: 0 0 0.4rem; padding: 0; break-inside: avoid; }
  .az-list li a { font-size: 1.01em; }
  /* ---------- Tree index: one section per domain, groups in columns ---------- */
  .description .index-list { margin-top: 2.4rem; }
  /* Section menu at the head of the tree: one column per set (Civilisational / Meta / Macro),
     each section numbered as in the index below, with its categories run on beneath it.
     Set in the interface face, IBM Plex Sans Arabic. */
  .description .index-menu {
    margin: 0;
    padding: 0 0 1.6rem;
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
  }
  .description .menu-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.4rem; }
  .description .menu-col { min-width: 0; }
  .description .menu-col + .menu-col { border-left: 1px solid var(--rule); padding-left: 1.4rem; }
  .description .menu-set {
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 1.1rem;
    line-height: 1;
  }
  .description .index-menu ul { list-style: none; padding: 0; margin: 0; }
  .description .menu-sec { display: grid; grid-template-columns: 1.9rem 1fr; margin: 0 0 1.15rem; padding: 0; }
  .description .menu-sec:last-child { margin-bottom: 0; }
  .description .menu-num {
    font-family: 'IBM Plex Sans Arabic', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--muted);

  .description .index-menu a { text-decoration: none; color: inherit; }
  .description .index-menu a:hover { text-decoration: underline; text-decoration-color: var(--link-underline); text-underline-offset: 0.15em; }
  .description .menu-section { display: block; font-size: 0.86rem; font-weight: 600; line-height: 1.25; }
  .description .menu-cats { margin-top: 0.35rem; font-size: 0.72rem; line-height: 1.5; color: var(--muted); }

  .description .menu-cats a:hover { color: var(--text); }
  .description .menu-cats span + span::before { content: '·'; margin: 0 0.4em; color: var(--rule); }
  /* Menu links and section headings: always underlined, never in the accent colour */
  :root .description .index-menu a,
  :root .description .domain-title a {
    text-decoration: underline;
    text-decoration-color: var(--link-underline);
    text-decoration-thickness: 1px;

  .description .index-cols, .description .index-cols ul { list-style: none; padding: 0; margin: 0; }

  .description .index-cols ul { padding-left: 0.9rem; margin-top: 0.4rem; }
  .description .index-cols li { margin: 0 0 0.4rem; padding: 0; }
  /* Each group (a sub-category or a concept with its children) stays whole in one column */
  .description .index-cols > li { break-inside: avoid; padding-bottom: 0.4rem; margin: 0; }
  /* Only groups (items with nested concepts) are spaced apart; single concepts sit together */
  .description .index-cols > li.has-kids { padding-bottom: 1.1rem; }
  .description .index-cols > li:not(.has-kids) + li.has-kids { padding-top: 0.7rem; }
  /* Type steps down with depth: group heading, concept, sub-concept */
  .description .index-cols > li > a { font-size: 1.04em; font-weight: 600; }

  .description .branch-list, .description .branch-list ul { list-style: none; padding: 0; margin: 0; }

  /* ---------- Loading screen ---------- */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 1.5rem;
    background: var(--bg);
    transition: opacity .6s ease, visibility 0s linear .6s;
  }
  #loader.done { opacity: 0; visibility: hidden; }
  .loader-mark, .loader-ring { z-index: 2; }
  #loader h1 { position: relative; margin: 0; white-space: nowrap; }
  /* Ring encircles the title, scaled from the title's width, and fills in step with the typewriter */
  .loader-mark { position: relative; display: inline-block; }
  /* Small ring at the bottom middle of the screen; the title stays centred on its own */
  .loader-ring {
    position: fixed;
    left: 50%;
    bottom: 2.6rem;
    width: 2.6rem;
    aspect-ratio: 1;
    /* Start at the top and fill anti-clockwise (the flip mirrors the stroke's direction) */
    transform: translateX(-50%) rotate(-90deg) scaleY(-1);
    overflow: visible;
  }
  .loader-ring circle { fill: none; stroke-width: 1.1; }
  .loader-ring .track { stroke: var(--rule); }
  .loader-ring .fill {
    stroke: var(--accent);  /* the theme's accent colour */
    stroke-dasharray: 1130.97;
    stroke-dashoffset: 1130.97;
    transition: stroke-dashoffset 75ms linear;
  }
  /* The invisible full title fixes the width, so typing grows from a stable left edge */
  #loader .ghost { visibility: hidden; }
  #loader .typed { position: absolute; left: 0; top: 0; }

  /* Mobile: sidebar overlays the page */
  #scrim {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 15;
  }
  @media (max-width: 899px) {
    /* Phones: the text column reaches the edge, so the map toggle moves to the top-left corner */
    body.sidebar-closed #sidebar-toggle { top: 0.8rem; left: 0.9rem; transform: none; }
    #back-btn, body:not(.sidebar-closed) #back-btn { left: 3.1rem; }
    /* Open over the dimmed page: give the close arrow a solid backing so it stays visible */
    body:not(.sidebar-closed) #sidebar-toggle { background: var(--bg); color: var(--text); border-radius: 50%; }
    body:not(.sidebar-closed) #scrim { display: block; }
    h1 { font-size: 2.1rem; }
  }
</style>

<script>
  /*
   * Concept entries.
   * Each entry: id (URL slug), title, parent (id of parent entry, or null for the root),
   * and html (the description). The root entry is the homepage.
   * Optional: kind: 'category' marks a category (shown as a group in the tree, with its own
   * page listing its members, but not counted as a concept); order sorts siblings before the
   * alphabetical default; ref holds sources for internal reference only (never displayed);
   * coined: true lists the entry under Conceptual Engineerings (the author's own novel terms).
   * To add a concept, append an object with a parent id — the tree, tree string,
   * index and concept count all update automatically.
   */
  // Shared by the homepage's closing section and the standalone Map page.
  var MAP_INTRO = '<p>Below is a complete index of concepts on this site. Over time, this map will extend to cover hundreds of entries.</p>';

  var CONCEPTS = [
    {
      id: 'civilisation-theory',
      title: 'Civilisation Theory',
      parent: null,
      html: [
        '<p><em>Civilisation Theory</em> is a unification of all forms of theory – primarily, systems theory, evolutionary theory, critical theory and game theory – applied at a civilisational-scale. The thesis of civilisation theory is that the generative dynamics of existential risk(s) emerge from the developmental process, initial conditions and dominant paradigm of civilisation itself. From this macrohistorical frame of reference, the only sufficient solution to avoid both destruction and dystopia is civilisation design and transition: to realise a new form of political economy (structure) and cultural psychology (superstucture), compatible with 21st century technology (infrastructure), a viable life-world-system.</p>',

        '<h2>A Conceptual Adaptive System</h2>',
        '<p>This glossary site serves to create a <em>conceptual adaptive system</em> for this ultimate project. For civilisation to adapt, we must first adapt the concepts we use to understand it: our map of the territory or world-model. In other words, recursively within the civilisational crisis, is an epistemic crisis to process it. The <a href="https://maxramsahoye.github.io/civilisationtheory">Civilisation Theory Map</a> is a response to this crisis: a collective knowledge base to aid the formation of collective understanding, and in turn, collective action.</p>',

        '<h2>Project Context</h2>',
        '<p>The Civilisation Theory Map is inspired by <a href="https://consilienceproject.org/glossary/">the glossary of <em>The Consilience Project</em></a> and the metacrisis frame of the <a href="https://civilizationresearchinstitute.org/"><em>Civilization Research Institute</em></a>. More broadly, Civilisation Theory is a critical dialectical synthesis of three core clusters of intellectual subcultures:</p>',
        '<ul>',
        '<li><strong>The Meta-space:</strong> oriented around the metacrisis, metamodernism and metatheory (also metaphysics, metanarrative, metasystem, metarationality, metacognition)</li>',
        '<li><strong>The PARA-academic space:</strong> encompassing progress studies, AI alignment, rationalism and effective altruism (also existential risk studies).</li>',
        '<li><strong>The Cybernetic Economics lineage:</strong> across Buckminster Fuller (1969), Jacque Fresco (1985), Stafford Beer (1971), Daniel Schmachtenberger (2017, 21), Peter Joseph (2014, 17, 25)</li>',
        '</ul>',

        '<h2>The Map</h2>',
        MAP_INTRO,
        '<p>The index can also be viewed via the sidebar or on <a href="#the-map">its own page</a>.</p>',
        '<!--INDEX-->'
      ].join('\n')
    },
    {
      id: 'metacrisis',
      title: 'Metacrisis',
      kind: 'category',
      parent: 'civilisation-theory',
      order: 4,
      html: '<p>The <em>metacrisis</em> is the underlying pattern that connects the many crises of the 21st century – ecological, technological, political, economic and psychological – as expressions of shared generative dynamics rather than as separate problems. Where a polycrisis names the interaction of many crises, the metacrisis names what lies beneath them: above all, rivalrous competition under exponential technology (see <a href="#multipolar-trap">multipolar trap</a>), and the extraction of value from complex systems faster than they can regenerate. Because these dynamics are built into the dominant paradigm of civilisation itself, addressing symptoms without addressing their generators tends to relocate harm rather than remove it. Associated with Daniel Schmachtenberger, <em>The Consilience Project</em> and the <em>Civilization Research Institute</em>, the concept frames <a href="#existential-risk">existential risk</a> as its most acute expression, and a response adequate to it as a matter of <a href="#civilisation-design">civilisation design</a> rather than piecemeal reform.</p>'
    },
    {
      id: 'existential-risk',
      title: 'Existential Risk',
      parent: 'risk-and-catastrophe',
      html: '<p>An <em>existential risk</em> is a risk that threatens the extinction of humanity, or the permanent and drastic curtailment of its potential. Formalised by Nick Bostrom (2002) and developed within existential risk studies, the concept is usually applied to discrete hazards such as advanced AI, engineered pandemics, nuclear war and severe climate change. Seen through the <a href="#metacrisis">metacrisis</a>, these hazards appear instead as emergent outcomes of shared underlying dynamics, and any response must avoid two failure modes at once: destruction, when powerful technology remains in the hands of uncoordinated, competing actors; and dystopia, when that risk is controlled through concentrated, unaccountable power.</p>'
    },
    {
      id: 'multipolar-trap',
      title: 'Multipolar Trap',
      parent: 'metacrisis',
      html: '<p>A <em>multipolar trap</em> is a situation in which each actor, acting rationally in competition with others, is driven towards an outcome that is worse for everyone – including itself – because no single actor can stop without losing ground to the rest. It generalises the prisoner’s dilemma and the tragedy of the commons to many actors, and appears in arms races, regulatory races to the bottom, the attention economy and the race to deploy powerful technologies before they are understood. Popularised by Scott Alexander’s <em>Meditations on Moloch</em> (2014) and developed by Daniel Schmachtenberger as a generator function of the <a href="#metacrisis">metacrisis</a>, the trap becomes a source of <a href="#existential-risk">existential risk</a> under exponential technology, and can only be escaped by changing the incentive structure itself.</p>'
    },
    {
      id: 'civilisation-design',
      title: 'Civilisation Design',
      kind: 'category',
      parent: 'civilisation-theory',
      order: 2,
      html: '<p><em>Civilisation design</em> is the deliberate design of the basic structures of civilisation – its political economy (structure), cultural psychology (superstructure) and technology (infrastructure) – as one integrated system, rather than reform within the existing one. Because a change to one layer tends to be reabsorbed by the others, the three must be designed to be compatible, and the design must include a viable path of transition that avoids both destruction and dystopia along the way. Drawing on a cybernetic lineage that runs through Buckminster Fuller, Stafford Beer and Jacque Fresco, civilisation design responds to the <a href="#metacrisis">metacrisis</a> at the level of its causes, and aims at a <a href="#life-world-system">life-world-system</a>.</p>'
    },
    {
      id: 'life-world-system',
      title: 'Viable Life-World-System',
      coined: true,
      parent: 'alignment-and-futures',
      html: '<p>A <em>life-world-system</em> is the aim of <a href="#civilisation-design">civilisation design</a>: a civilisation that is viable at every level – for life (the biosphere), for the world of human meaning and experience (the life-world), and for the structures that coordinate society as a whole (the system). The term draws on Jürgen Habermas’s distinction between the lifeworld and the system of money and administrative power, which in the present civilisation colonises it; in a life-world-system the two are integrated rather than in conflict. Viable in Stafford Beer’s sense – able to maintain its identity while adapting to a changing environment – it is compatible with 21st century technology without depending on the dynamics that generate the <a href="#metacrisis">metacrisis</a>.</p>'
    },
    {
      id: 'polycrisis',
      title: 'Polycrisis',
      parent: 'metacrisis',
      html: '<p>A <em>polycrisis</em> is a condition in which multiple crises – ecological, economic, geopolitical, technological – interact so that their combined effect is greater than the sum of their parts. The term was introduced by Edgar Morin and Anne Brigitte Kern in <em>Homeland Earth</em> (1993) and popularised by the historian Adam Tooze in the early 2020s. Where the polycrisis describes how crises entangle and cascade, the <a href="#metacrisis">metacrisis</a> asks why they arise together at all: the polycrisis is the surface pattern, the metacrisis its underlying cause.</p>'
    },
    {
      id: 'generator-functions',
      title: 'Generator Functions',
      parent: 'metacrisis',
      html: '<p><em>Generator functions</em> are the underlying dynamics that continuously produce the symptoms of the <a href="#metacrisis">metacrisis</a>. In Daniel Schmachtenberger’s account there are two: rivalrous, win–lose dynamics (see <a href="#multipolar-trap">multipolar trap</a>) multiplied by exponential technology; and the substitution of complicated, extractive systems for the complex, self-organising systems – ecological and social – on which civilisation depends. Because the generators remain in place, solving any one problem tends to displace harm elsewhere; a sufficient response must change the generators themselves, which is the task of <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'epistemic-crisis',
      title: 'Epistemic Crisis',
      parent: 'metacrisis',
      html: '<p>The <em>epistemic crisis</em> is the breakdown of a society’s capacity to make sense of the world together: to establish shared facts, reason through disagreement, and arrive at collective choices. It is driven by an information ecology optimised for attention rather than understanding, by the weaponisation of information in rivalrous competition, and by the sheer complexity of the problems to be understood. The epistemic crisis is recursive within the <a href="#metacrisis">metacrisis</a> – a civilisation cannot adapt to a crisis it cannot perceive – which is why renewing shared concepts, as in a <a href="#conceptual-adaptive-system">conceptual adaptive system</a>, comes first.</p>'
    },
    {
      id: 'dominant-paradigm',
      title: 'Dominant Paradigm',
      parent: 'metacrisis',
      html: '<p>The <em>dominant paradigm</em> is the set of shared assumptions – about value, progress, nature, the self and the good life – out of which a civilisation’s institutions arise, and which usually goes unexamined because it is taken as reality itself. The term draws on Thomas Kuhn’s account of paradigms in <em>The Structure of Scientific Revolutions</em> (1962), while Donella Meadows (1999) identified the paradigm as one of the highest leverage points for changing any system. The present paradigm of growth, competition and extraction can be read as one of the origins of the <a href="#metacrisis">metacrisis</a>, alongside civilisation’s developmental process and initial conditions.</p>'
    },
    {
      id: 'political-economy',
      title: 'Political Economy',
      parent: 'civilisation-design',
      html: '<p><em>Political economy</em> is the structure of a civilisation: the institutions that govern how resources are owned, produced, allocated and exchanged, and how collective decisions are made about them. In a three-layer model of civilisation that echoes Marvin Harris’s cultural materialism, political economy (structure) sits between technology (<a href="#technological-infrastructure">infrastructure</a>) and <a href="#cultural-psychology">cultural psychology</a> (superstructure). Because it sets the incentives every actor responds to, it is where <a href="#generator-functions">generator functions</a> such as the <a href="#multipolar-trap">multipolar trap</a> are either reproduced or dissolved, and so a central object of <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'cultural-psychology',
      title: 'Cultural Psychology',
      parent: 'civilisation-design',
      html: '<p><em>Cultural psychology</em> is the superstructure of a civilisation: its shared values, narratives, identities, forms of meaning and modes of sensemaking, as they are lived by the people within it. It shapes what a society is able to want and to imagine, and is in turn shaped by the <a href="#political-economy">political economy</a> and <a href="#technological-infrastructure">technology</a> it lives within. No new structure is stable without a cultural psychology compatible with it – a new economy run by people formed by the old one tends to recreate the old one – so <a href="#civilisation-design">civilisation design</a> must address inner as well as outer conditions.</p>'
    },
    {
      id: 'technological-infrastructure',
      title: 'Technological Infrastructure',
      parent: 'civilisation-design',
      html: '<p><em>Technological infrastructure</em> is the material base of a civilisation: its tools, energy systems, production, communication and computation. In a three-layer model of civilisation, it is the infrastructure on which <a href="#political-economy">political economy</a> (structure) and <a href="#cultural-psychology">cultural psychology</a> (superstructure) rest. The defining feature of the 21st century is that this layer is changing exponentially – through AI, biotechnology and automation – while the other two remain largely inherited from earlier eras. The resulting mismatch is a source of <a href="#existential-risk">existential risk</a>, and the requirement that any design be compatible with 21st century technology is central to <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'civilisation-transition',
      title: 'Civilisational Transition',
      kind: 'category',
      order: 3,
      parent: 'civilisation-theory',
      html: '<p><em>Civilisation transition</em> is the process of moving from the present civilisation to a designed one: the path, rather than the destination, of <a href="#civilisation-design">civilisation design</a>. A viable transition must remain functional at every stage, keeping people fed, housed and governed while the underlying structures change, and must avoid both failure modes of <a href="#existential-risk">existential risk</a> along the way – collapse into destruction, or capture by concentrated power. Transition is therefore a design problem in its own right, rather than something that follows automatically from a good blueprint.</p>'
    },
    {
      id: 'systems-theory',
      title: 'Systems Theory',
      parent: 'metatheory',
      html: '<p><em>Systems theory</em> is the study of wholes – how interacting parts give rise to behaviour that none of them has alone. Developed through Ludwig von Bertalanffy’s general system theory, Norbert Wiener’s cybernetics (1948) and later work such as Donella Meadows’s <em>Thinking in Systems</em> (2008), it is concerned with feedback loops, stocks and flows, emergence, self-organisation and resilience. Applied at the scale of civilisation, it shows a single complex adaptive system whose crises are properties of its structure rather than isolated failures.</p>'
    },
    {
      id: 'viable-system-model',
      title: 'Viable System Model',
      parent: 'systems-theory',
      html: '<p>The <em>viable system model</em> is Stafford Beer’s cybernetic model of any system able to maintain its identity and survive in a changing environment. Set out in <em>Brain of the Firm</em> (1972), it describes five interacting functions – operations, coordination, control, intelligence and policy – repeated recursively at every scale, so that each viable system contains and is contained by others. Beer applied it to national economic management in Chile’s Project Cybersyn (1971–73). Applied to civilisation as a whole, it offers a working definition of viability, and a model for the <a href="#life-world-system">life-world-system</a>.</p>'
    },
    {
      id: 'evolutionary-theory',
      title: 'Evolutionary Theory',
      parent: 'metatheory',
      html: '<p><em>Evolutionary theory</em> explains how complex forms arise through variation, selection and inheritance, without any designer. Beginning with Charles Darwin’s <em>On the Origin of Species</em> (1859), it has since been extended from genes to cultures, technologies and institutions. Applied to civilisation, it illuminates its developmental process: the selection pressures that have favoured some social forms over others, and why those that win in competition – as in the <a href="#multipolar-trap">multipolar trap</a> – are not necessarily those that are good for their members or can endure.</p>'
    },
    {
      id: 'critical-theory',
      title: 'Critical Theory',
      parent: 'metatheory',
      html: '<p><em>Critical theory</em> is the tradition of social theory that examines society in order to change it, exposing the forms of power and ideology that present particular arrangements as natural or inevitable. It originated with the Frankfurt School – Max Horkheimer’s essay “Traditional and Critical Theory” (1937), Theodor Adorno, Herbert Marcuse and later Jürgen Habermas. It supplies the critique of the <a href="#dominant-paradigm">dominant paradigm</a>, and the insistence that a response to the <a href="#metacrisis">metacrisis</a> must be emancipatory, avoiding dystopia as well as destruction.</p>'
    },
    {
      id: 'game-theory',
      title: 'Game Theory',
      parent: 'metatheory',
      html: '<p><em>Game theory</em> is the formal study of strategic interaction: how the outcome for each actor depends on the choices of all the others. Founded by John von Neumann and Oskar Morgenstern in <em>Theory of Games and Economic Behavior</em> (1944) and extended by John Nash’s concept of equilibrium (1950), it distinguishes zero-sum from positive-sum games and shows how individually rational choices can produce collectively irrational outcomes. It provides the formal analysis of the <a href="#multipolar-trap">multipolar trap</a>, and of the coordination that any response to it must make possible.</p>'
    },
    {
      id: 'metamodernism',
      title: 'Metamodernism',
      kind: 'category',
      order: 5,
      parent: 'civilisation-theory',
      html: '<p><em>Metamodernism</em> is a cultural and philosophical sensibility that moves beyond postmodernism without returning to modernism: it holds the modern capacity for sincerity, hope and grand projects together with the postmodern awareness of irony, context and multiple perspectives. The term was introduced by Timotheus Vermeulen and Robin van den Akker (2010), and developed politically by Hanzi Freinacht in <em>The Listening Society</em> (2017). Metamodernism offers a stance suited to projects of <a href="#civilisation-design">civilisation design</a>: sincere in their aims, yet aware of their own limits.</p>'
    },
    {
      id: 'conceptual-adaptive-system',
      title: 'Conceptual Adaptive System',
      coined: true,
      parent: 'replicators',
      html: '<p>A <em>conceptual adaptive system</em> is a body of concepts designed to evolve in response to what it helps to understand, as a complex adaptive system evolves in response to its environment. It rests on the insight, going back to Alfred Korzybski’s “a map is not the territory” (1933), that the concepts through which we see the world shape which problems we can perceive and which solutions we can imagine. A glossary built this way is a response to the <a href="#epistemic-crisis">epistemic crisis</a>, on the premise that for civilisation to adapt, its concepts must adapt first.</p>'
    },
    {
      id: 'exponential-technology',
      title: 'Exponential Technology',
      parent: 'metacrisis',
      html: '<p><em>Exponential technology</em> is technology whose capabilities grow at a compounding rate, as each generation of tools accelerates the development of the next. Computation, artificial intelligence, synthetic biology and automation are the clearest cases. Exponential technology acts as the multiplier in the <a href="#metacrisis">metacrisis</a>: the same rivalrous dynamics that once produced local or reversible harm now operate with planetary, and potentially irreversible, power. This is why the old patterns of the <a href="#multipolar-trap">multipolar trap</a> become sources of <a href="#existential-risk">existential risk</a>, and why any viable civilisation must be designed to be compatible with 21st century technology.</p>'
    },
    {
      id: 'planetary-boundaries',
      title: 'Planetary Boundaries',
      parent: 'ecology-and-earth-system',
      html: '<p><em>Planetary boundaries</em> are the limits of nine Earth-system processes – including climate change, biosphere integrity, land-system change and biogeochemical flows – within which humanity can continue to develop safely. The framework was introduced by Johan Rockström and colleagues in 2009, and a 2023 assessment found six of the nine boundaries already transgressed. The boundaries give the ecological dimension of the <a href="#metacrisis">metacrisis</a> a measurable form, and set the outer limits within which any <a href="#life-world-system">life-world-system</a> must operate.</p>'
    },
    {
      id: 'moloch',
      title: 'Moloch: God of Game-Theory',
      parent: 'multipolar-trap',
      html: '<p><em>Moloch</em> is a personification of the <a href="#multipolar-trap">multipolar trap</a>: the impersonal force by which competition sacrifices every value that does not contribute to winning. The name comes from Allen Ginsberg’s poem <em>Howl</em> (1956) and was given its current sense by Scott Alexander’s essay <em>Meditations on Moloch</em> (2014), which describes how arms races, market pressures and evolutionary selection each drive actors to trade away what they care about for competitive advantage. To speak of Moloch is to recognise that no one needs to intend a harmful outcome for a system to produce it.</p>'
    },
    {
      id: 'race-to-the-bottom',
      title: 'Race to the Bottom',
      parent: 'multipolar-trap',
      html: '<p>A <em>race to the bottom</em> is a form of <a href="#multipolar-trap">multipolar trap</a> in which competitors progressively lower their standards – on wages, taxes, safety, environmental protection or ethics – to gain an advantage over one another. Since any actor that holds to a higher standard loses ground, each is pushed downwards regardless of its intentions. Familiar examples include jurisdictions competing to attract capital with lower taxes and weaker regulation, and firms competing on cost by externalising harm. The race can only be halted by changing the rules of competition for all actors at once – a <a href="#coordination-problem">coordination problem</a>.</p>'
    },
    {
      id: 'third-attractor',
      title: 'Third Attractor',
      parent: 'existential-risk',
      html: '<p>The <em>third attractor</em> is the name given, in the work of Daniel Schmachtenberger and others, to a civilisational trajectory that avoids both of the default attractors of <a href="#existential-risk">existential risk</a>: catastrophe, arising from uncoordinated power, and dystopia, arising from the control imposed to prevent it. It describes a civilisation able to coordinate at the scale of its technology without centralising unaccountable power – combining the order that prevents collapse with the freedom that prevents tyranny. The third attractor names the direction in which <a href="#civilisation-design">civilisation design</a> and <a href="#civilisation-transition">transition</a> would need to move.</p>'
    },
    {
      id: 'sensemaking',
      title: 'Sensemaking',
      parent: 'epistemic-crisis',
      html: '<p><em>Sensemaking</em> is the process by which individuals and groups construct an understanding of their situation, so that they can act within it. The term was developed in organisational theory by Karl Weick (1995), and has since been used more broadly for the collective capacity of a society to perceive reality accurately, reason about it together and make good choices. The breakdown of collective sensemaking is the <a href="#epistemic-crisis">epistemic crisis</a>, and restoring it is a precondition for any coordinated response to the <a href="#metacrisis">metacrisis</a>.</p>'
    },
    {
      id: 'attention-economy',
      title: 'Attention Economy',
      parent: 'epistemic-crisis',
      html: '<p>The <em>attention economy</em> is the economic system in which human attention is the scarce resource that platforms and media compete to capture and sell. Herbert Simon observed in 1971 that “a wealth of information creates a poverty of attention”, and the term itself was popularised by Michael Goldhaber in the late 1990s. Because engagement rather than understanding is rewarded, the attention economy favours content that provokes outrage, fear and tribal identity – making it both a <a href="#multipolar-trap">multipolar trap</a> among competing platforms and a principal driver of the <a href="#epistemic-crisis">epistemic crisis</a>.</p>'
    },
    {
      id: 'prisoners-dilemma',
      title: 'Prisoner’s Dilemma',
      parent: 'game-theory',
      html: '<p>The <em>prisoner’s dilemma</em> is the canonical game in <a href="#game-theory">game theory</a> in which two players each gain by defecting against the other, yet both end up worse off than if they had cooperated. First formalised by Merrill Flood and Melvin Dresher at the RAND Corporation in 1950 and named by Albert Tucker, it shows how individually rational choices can produce collectively irrational outcomes. Robert Axelrod’s <em>The Evolution of Cooperation</em> (1984) showed how cooperation can emerge when the game is repeated. The <a href="#multipolar-trap">multipolar trap</a> generalises the dilemma to many players.</p>'
    },
    {
      id: 'tragedy-of-the-commons',
      title: 'Tragedy of the Commons',
      parent: 'game-theory',
      html: '<p>The <em>tragedy of the commons</em> is the depletion of a shared resource by individuals who each benefit fully from using more of it while bearing only a fraction of the cost. It was set out by Garrett Hardin in 1968, who concluded that commons must be either privatised or regulated by the state. Elinor Ostrom’s <em>Governing the Commons</em> (1990) showed a third possibility: communities that successfully manage shared resources through their own institutions. The tragedy is a many-player form of the <a href="#prisoners-dilemma">prisoner’s dilemma</a>, and Ostrom’s answer informs the design of the <a href="#commons">commons</a>.</p>'
    },
    {
      id: 'coordination-problem',
      title: 'Coordination Problem',
      parent: 'game-theory',
      html: '<p>A <em>coordination problem</em> is a situation in which all actors would be better off acting together, but none can do so alone: a better outcome exists, but reaching it requires that everyone move at once, or that each can trust the others to follow. Coordination problems underlie the <a href="#multipolar-trap">multipolar trap</a>, the <a href="#race-to-the-bottom">race to the bottom</a> and most collective responses to <a href="#existential-risk">existential risk</a>. Solving coordination problems at the scale of exponential technology, without resorting to concentrated, unaccountable power, is a central task of <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'cybernetics',
      title: 'Cybernetics',
      parent: 'systems-theory',
      html: '<p><em>Cybernetics</em> is the science of control and communication in animals and machines, as Norbert Wiener defined it in his book of that name (1948). It studies how systems regulate themselves through <a href="#feedback-loop">feedback</a> – sensing the effects of their actions and adjusting accordingly – and was developed by W. Ross Ashby, Heinz von Foerster, Gregory Bateson and Stafford Beer, among others. Cybernetics underpins a lineage of cybernetic approaches to economics and governance, and Beer’s <a href="#viable-system-model">viable system model</a> is its application to the organisation of societies.</p>'
    },
    {
      id: 'requisite-variety',
      title: 'Requisite Variety',
      parent: 'cybernetics',
      html: '<p>The <em>law of requisite variety</em>, formulated by W. Ross Ashby in <em>An Introduction to Cybernetics</em> (1956), states that a regulator can only control a system if it has at least as much variety – as many possible responses – as the disturbances it must counter; in Ashby’s phrase, “only variety can destroy variety”. Applied to civilisation, it implies that institutions designed for a slower and simpler world cannot govern the complexity produced by <a href="#exponential-technology">exponential technology</a>. Governance must therefore gain variety – through distributed, adaptive and <a href="#viable-system-model">recursive</a> structures – rather than simply more central control.</p>'
    },
    {
      id: 'feedback-loop',
      title: 'Feedback Loop',
      parent: 'systems-theory',
      html: '<p>A <em>feedback loop</em> is a circular chain of cause and effect in which the output of a system returns as an input that influences its future behaviour. Balancing (negative) feedback counteracts change and keeps a system stable, as a thermostat does; reinforcing (positive) feedback amplifies change, producing growth, collapse or runaway escalation. Much of the <a href="#metacrisis">metacrisis</a> can be read as reinforcing loops – arms races, compound growth, the <a href="#attention-economy">attention economy</a> – that lack adequate balancing loops, and much of <a href="#civilisation-design">civilisation design</a> as the task of building them.</p>'
    },
    {
      id: 'emergence',
      title: 'Emergence',
      parent: 'systems-theory',
      html: '<p><em>Emergence</em> is the appearance, in a system of interacting parts, of properties or behaviours that belong to the whole and cannot be found in any part alone – as consciousness emerges from neurons, or traffic jams from individual drivers. It is central to <a href="#systems-theory">systems theory</a> and the study of <a href="#complex-adaptive-system">complex adaptive systems</a>. Emergence explains how the <a href="#metacrisis">metacrisis</a> can arise without anyone intending it: catastrophic outcomes can be emergent properties of a civilisation whose individual actors are each behaving reasonably.</p>'
    },
    {
      id: 'complex-adaptive-system',
      title: 'Complex Adaptive System',
      parent: 'systems-theory',
      html: '<p>A <em>complex adaptive system</em> is a system of many interacting agents that adapt to one another and to their environment, so that the system as a whole learns and evolves – ecosystems, economies, immune systems and civilisations are examples. The concept was developed at the Santa Fe Institute, notably by John Holland. Such systems exhibit <a href="#emergence">emergence</a>, self-organisation and non-linear change, and cannot be controlled from above in the way that complicated machines can. Civilisation itself can be understood as a complex adaptive system, and the <a href="#conceptual-adaptive-system">conceptual adaptive system</a> takes its name from the idea.</p>'
    },
    {
      id: 'leverage-points',
      title: 'Leverage Points',
      parent: 'systems-theory',
      html: '<p><em>Leverage points</em> are places within a system where a small intervention can produce large changes in its behaviour. In her essay “Leverage Points: Places to Intervene in a System” (1999), Donella Meadows ranked twelve such points, from the weakest – parameters such as taxes and subsidies – to the strongest: the goals of the system, the <a href="#dominant-paradigm">paradigm</a> out of which it arises, and the power to transcend paradigms altogether. On this view the deepest leverage lies at the level of paradigm, which is why lasting change must address <a href="#cultural-psychology">cultural psychology</a> as well as policy.</p>'
    },
    {
      id: 'resilience',
      title: 'Resilience',
      parent: 'systems-theory',
      html: '<p><em>Resilience</em> is the capacity of a system to absorb disturbance and reorganise while retaining its essential function, structure and identity. The concept was introduced to ecology by C. S. Holling (1973), who distinguished it from mere stability: a resilient system may change a great deal while persisting, whereas an efficient but brittle one may fail suddenly. Optimising civilisation for efficiency and growth has tended to erode its resilience, and restoring it – through redundancy, diversity and distributed structures – is a requirement of any <a href="#life-world-system">life-world-system</a>.</p>'
    },
    {
      id: 'project-cybersyn',
      title: 'Project Cybersyn',
      parent: 'viable-system-model',
      html: '<p><em>Project Cybersyn</em> was a Chilean project (1971–73) to manage the nationalised economy in real time using cybernetic principles, designed by Stafford Beer at the invitation of Salvador Allende’s government, with Fernando Flores. It linked factories to a central operations room through a network of telex machines, using Beer’s <a href="#viable-system-model">viable system model</a> to balance local autonomy with national coordination. The project was ended by the military coup of 1973. It remains a reference point in cybernetic economics as an early attempt at computer-assisted, non-authoritarian economic coordination.</p>'
    },
    {
      id: 'cultural-evolution',
      title: 'Cultural Evolution',
      parent: 'evolutionary-theory',
      html: '<p><em>Cultural evolution</em> is the application of <a href="#evolutionary-theory">evolutionary theory</a> to culture: the idea that beliefs, practices, technologies and institutions vary, are selected and are transmitted between people, and so change over time in ways analogous to biological evolution. It was developed by Robert Boyd and Peter Richerson (1985), among others. Cultural evolution explains how the <a href="#dominant-paradigm">dominant paradigm</a> came to be – and why cultural forms that spread successfully, such as those that win in competition, need not be those that are good for the people who hold them.</p>'
    },
    {
      id: 'multilevel-selection',
      title: 'Multilevel Selection',
      parent: 'evolutionary-theory',
      html: '<p><em>Multilevel selection</em> is the view that natural selection operates at several levels at once – on genes, individuals and groups – and that these levels can pull in opposite directions. David Sloan Wilson and E. O. Wilson (2007) summarised it: “selfishness beats altruism within groups; altruistic groups beat selfish groups”. The theory explains how cooperation can evolve despite the advantage of defection, and suggests that the <a href="#multipolar-trap">multipolar trap</a> can be overcome when selection at a higher level – between whole societies, or at the scale of humanity – comes to favour cooperation.</p>'
    },
    {
      id: 'selection-pressure',
      title: 'Selection Pressure',
      parent: 'evolutionary-theory',
      html: '<p>A <em>selection pressure</em> is any feature of an environment that favours some variants over others, and so shapes what survives and spreads. The concept comes from biology but applies equally to firms in markets, states in geopolitical competition and ideas in the <a href="#attention-economy">attention economy</a>. The selection pressures built into the present civilisation – for growth, power and engagement – reward behaviours that drive the <a href="#metacrisis">metacrisis</a>. Changing outcomes durably requires changing the pressures, not merely the actors who respond to them.</p>'
    },
    {
      id: 'hegemony',
      title: 'Hegemony',
      parent: 'critical-theory',
      html: '<p><em>Hegemony</em>, in Antonio Gramsci’s sense, is the rule of a dominant group through consent rather than force: its interests and worldview come to be accepted as common sense by society as a whole. Gramsci developed the concept in his <em>Prison Notebooks</em> (1929–35), and it became central to <a href="#critical-theory">critical theory</a> and cultural studies. Hegemony explains how the <a href="#dominant-paradigm">dominant paradigm</a> reproduces itself without needing to be imposed, and why <a href="#civilisation-transition">transition</a> involves a contest over meaning as well as over institutions.</p>'
    },
    {
      id: 'ideology',
      title: 'Ideology',
      parent: 'critical-theory',
