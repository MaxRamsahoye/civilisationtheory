      html: '<p>An <em>ideology</em> is a system of ideas and beliefs that shapes how a society understands itself, and that, in the critical tradition, serves to present particular social arrangements as natural, necessary or just. The concept was given its critical meaning by Karl Marx and Friedrich Engels in <em>The German Ideology</em> (1846), and developed through <a href="#hegemony">Gramsci</a>, the Frankfurt School and later thinkers. Ideology critique is one of the core tools of <a href="#critical-theory">critical theory</a>, and can be turned on the <a href="#dominant-paradigm">dominant paradigm</a> itself – including the assumption that there is no alternative to it.</p>'
    },
    {
      id: 'colonisation-of-the-lifeworld',
      title: 'Colonisation of the Lifeworld',
      parent: 'critical-theory',
      html: '<p>The <em>colonisation of the lifeworld</em> is Jürgen Habermas’s term, from <em>The Theory of Communicative Action</em> (1981), for the process by which the logics of money and administrative power – the “system” – penetrate areas of life that depend on mutual understanding, such as family, education, culture and public debate. As these areas come to be governed by markets and bureaucracy, meaning, solidarity and democratic agency are eroded. The concept is a key source for the <a href="#life-world-system">life-world-system</a>, which aims at a civilisation in which system and lifeworld are integrated rather than in conflict.</p>'
    },
    {
      id: 'dialectics',
      title: 'Dialectics',
      parent: 'critical-theory',
      html: '<p><em>Dialectics</em> is a method of reasoning that understands ideas and societies as developing through contradiction – as opposing tendencies conflict and are resolved in a higher form that preserves something of each. Associated above all with G. W. F. Hegel, and turned by Marx towards material and social history, it is foundational to <a href="#critical-theory">critical theory</a>. A dialectical synthesis seeks not to choose between competing traditions, but to resolve their contradictions into a more comprehensive understanding.</p>'
    },
    {
      id: 'resource-based-economy',
      title: 'Resource-Based Economy',
      parent: 'political-economy',
      html: '<p>A <em>resource-based economy</em> is Jacque Fresco’s proposal for a socio-economic system in which goods and services are provided without money, barter or debt, by managing the Earth’s resources directly through technology and scientific method. Developed through Fresco’s Venus Project, it envisages automated production, the careful accounting of available resources, and the provision of necessities to all. It belongs to the lineage of cybernetic economics, and is a precedent for rethinking <a href="#political-economy">political economy</a> in light of <a href="#post-scarcity">post-scarcity</a> technology.</p>'
    },
    {
      id: 'commons',
      title: 'Commons',
      parent: 'political-economy',
      html: '<p>A <em>commons</em> is a resource held and managed collectively by a community, according to rules its members make for themselves, rather than by the market or the state. Elinor Ostrom’s <em>Governing the Commons</em> (1990) identified the design principles by which commons can endure, answering the <a href="#tragedy-of-the-commons">tragedy of the commons</a>. The idea has been extended to knowledge and software, as in Yochai Benkler’s account of commons-based peer production. The commons offers a form of <a href="#political-economy">political economy</a> that is neither market nor state, and a model for coordination without centralisation.</p>'
    },
    {
      id: 'design-science',
      title: 'Design Science',
      parent: 'civilisation-design',
      html: '<p><em>Design science</em> – in full, “comprehensive anticipatory design science” – is Buckminster Fuller’s approach to solving humanity’s problems by redesigning its tools and systems rather than by reforming people or politics. Fuller argued in <em>Operating Manual for Spaceship Earth</em> (1969) that the planet’s resources, used efficiently, could support all of humanity, and that the task was to make the world work for everyone through design. Design science is an early source of cybernetic approaches to economics, and an antecedent of <a href="#civilisation-design">civilisation design</a>.</p>'
    },
    {
      id: 'post-scarcity',
      title: 'Post-Scarcity Economics',
      parent: 'technological-infrastructure',
      html: '<p><em>Post-scarcity</em> describes a condition in which the basic goods people need can be produced in abundance, with minimal human labour, so that scarcity no longer organises economic life. It is associated with the potential of automation, renewable energy and advanced manufacturing, and was anticipated by thinkers from Buckminster Fuller to Jacque Fresco. Post-scarcity is a possibility opened by <a href="#technological-infrastructure">technological infrastructure</a> but blocked by an existing <a href="#political-economy">political economy</a> that depends on scarcity – and so a question of design rather than technology alone.</p>'
    },
    {
      id: 'metarationality',
      title: 'Metarationality',
      parent: 'metamodernism',
      html: '<p><em>Metarationality</em> is the capacity to reason about rationality itself: to understand how, when and why formal, systematic methods work, and how to choose between or go beyond them when they do not. The term was developed by David Chapman, who describes it as neither rejecting rationality nor treating it as universally sufficient. Alongside <a href="#metamodernism">metamodernism</a>, metarationality offers a way through the <a href="#epistemic-crisis">epistemic crisis</a>: holding multiple frameworks at once, and knowing which to use for which problem.</p>'
    },
    {
      id: 'civilisational-mechanics',
      title: 'Civilisational Mechanics',
      parent: 'civilisation-theory',
      kind: 'category',
      order: 1,
      html: '<p><em>Civilisational mechanics</em> is the study of how a civilisation actually works – the dynamics, incentives, feedback loops and structures that generate its behaviour over time – and of how those same mechanics produce crisis, risk and decline. Where civilisation design asks what could be built, civilisational mechanics asks what is already running, and why its outcomes so often escape anyone’s intentions.</p>'
    },
    {
      id: 'risk-and-catastrophe',
      title: 'Risk & Catastrophe',
      parent: 'metacrisis',
      kind: 'category',
      order: 2,
      html: '<p>Concepts for understanding how modern civilisation produces its own dangers: manufactured and existential risks, accidents inherent in technology, problems beyond the frame of reference, and the practices used to anticipate them.</p>'
    },
    {
      id: 'capital-and-growth',
      title: 'Capital & Markets',
      parent: 'civilisational-mechanics',
      kind: 'category',
      order: 3,
      html: '<p>The political economy of the present civilisation: the growth imperatives, market dynamics, extractive relations and competitive pressures that drive its behaviour and its externalities.</p>'
    },
    {
      id: 'technics-and-automation',
      title: 'Technics & Automation',
      parent: 'civilisational-mechanics',
      kind: 'category',
      order: 4,
      html: '<p>The dynamics of machines, computation and artificial intelligence as forces in their own right: automation, autonomous systems, the displacement of human agency, and the risks of technologies that outpace their governance.</p>'
    },
    {
      id: 'power-and-control',
      title: 'Power & Control',
      parent: 'macrosociology',
      kind: 'category',
      order: 5,
      html: '<p>How power is exercised, concentrated and made invisible: surveillance, discipline, state simplification, sovereignty over life and death, and the geopolitical rivalries of the present.</p>'
    },
    {
      id: 'culture-and-meaning',
      title: 'Culture & Meaning',
      parent: 'macrosociology',
      kind: 'category',
      order: 6,
      html: '<p>The cultural and psychological dimension of the crisis: the loss of meaning and of imagined futures, the pathologies of perception and attention, and the ideas and stories through which a civilisation understands, or fails to understand, itself.</p>'
    },
    {
      id: 'ecology-and-earth-system',
      title: 'Ecology & Earth System',
      parent: 'macrohistory',
      kind: 'category',
      order: 7,
      html: '<p>Civilisation as a force within the Earth system: the geological, ecological and material consequences of its growth, and the frameworks used to name and measure them.</p>'
    },
    {
      id: 'post-capitalism',
      title: 'Post-Capitalism',
      parent: 'civilisation-design',
      kind: 'category',
      order: 2,
      html: '<p>Economic alternatives to the present system: post-capitalist and post-scarcity economics, socialist and heterodox traditions, and frameworks for positive-sum economic life.</p>'
    },
    {
      id: 'coordination-and-governance',
      title: 'Coordination & Governance',
      parent: 'civilisation-design',
      kind: 'category',
      order: 3,
      html: '<p>Means by which a civilisation could coordinate at the scale of its technology: cybernetic governance, collective intelligence, mechanism design, open societies and shared epistemic infrastructure.</p>'
    },
    {
      id: 'alignment-and-futures',
      title: 'Existential Futures',
      parent: 'macrostrategy',
      kind: 'category',
      order: 4,
      html: '<p>Visions of desirable futures and the long-run strategy of reaching them: macrostrategy, alignment of powerful technology and of humanity itself, and utopian and post-human horizons.</p>'
    },
    {
      id: 'ethics-meaning-and-spirit',
      title: 'Ethics, Meaning & Spirit',
      parent: 'metamodernism',
      kind: 'category',
      order: 5,
      html: '<p>The ethical, spiritual and existential foundations a new civilisation would need: moral frameworks, forms of care and altruism, and new relations to religion, nature and meaning.</p>'
    },
    {
      id: 'theories-of-technology',
      title: 'Theories of Technology',
      parent: 'metatheory',
      kind: 'category',
      order: 2000,
      html: '<p>Frameworks for understanding the relationship between technology and society – from technology as an autonomous driver of history to technology as socially constructed, and from networks of human and non-human actors to the agency of matter itself.</p>'
    },
    {
      id: 'ai-exterminism',
      title: 'AI-Exterminism',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Thompson (Exterminism)',
      html: '<p><em>AI-exterminism</em> extends E. P. Thompson’s notion of “exterminism” – a civilisation whose institutions are organised around the capacity for mass destruction – to artificial intelligence. It names a trajectory in which the competitive development of ever more capable AI systems, pursued because no actor can afford to stop, drives towards outcomes that could disempower or destroy humanity, whether or not anyone intends them.</p>'
    },
    {
      id: 'neomechanisation-and-autonomisation',
      title: 'Neomechanisation & Autonomisation',
      coined: true,
      parent: 'technics-and-automation',
      html: '<p><em>Neomechanisation and autonomisation</em> describe a new phase of mechanisation in which machines take over not only physical labour but cognition, judgement and decision-making, and increasingly act without human direction. Where industrial mechanisation replaced muscle, this second wave replaces agency itself, transferring functions of the economy, the state and warfare to autonomous systems.</p>'
    },
    {
      id: 'hyper-agents-of-doom',
      title: 'Hyper-Agents of Doom',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p><em>Hyper-agents of doom</em> are actors – corporations, states or AI systems – whose power to act on the world vastly exceeds that of individuals, and whose goals are narrowly optimised in ways indifferent to human welfare. Because such agents operate at the scale of exponential technology and under competitive pressure, their ordinary pursuit of advantage can produce catastrophic outcomes.</p>'
    },
    {
      id: 'replicator-alignment-problem',
      title: 'The Replicator Alignment Problem',
      coined: true,
      parent: 'replicators',
      html: '<p>The <em>replicator alignment problem</em> generalises AI alignment to any self-replicating system – genes, memes, firms, institutions or machines – whose success is measured by its own propagation. Such replicators are selected for spreading, not for serving the people who host them, so aligning them with human flourishing is a structural problem that long predates artificial intelligence.</p>'
    },
    {
      id: 'loop-in-the-human',
      title: 'Loop in the Human',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p><em>Loop in the human</em> inverts the familiar phrase “human in the loop”. Rather than humans overseeing automated systems, algorithmic loops – feedback cycles of recommendation, prediction and optimisation – come to run through human attention, behaviour and belief, so that people become components executing a system’s logic rather than supervisors of it.</p>'
    },
    {
      id: 'drone-warfare-utilitarianism',
      title: 'Drone Warfare Utilitarianism',
      coined: true,
      parent: 'moral-theory',
      html: '<p><em>Drone warfare utilitarianism</em> names the moral calculus that remote and automated warfare invites: violence justified by expected-value reasoning about targets, risk and “acceptable” casualties, carried out at a distance that removes the killer from danger and the killing from view. It exemplifies how technology can make lethal decisions procedural, and ethically frictionless.</p>'
    },
    {
      id: 'philosophical-zombie-apocalypse',
      title: 'The Philosophical Zombie Apocalypse',
      coined: true,
      parent: 'moral-theory',
      ref: 'Chalmers (p-zombies)',
      html: '<p>The <em>philosophical zombie apocalypse</em> borrows the philosopher’s “zombie” – a being behaviourally identical to a person but without conscious experience – to describe a world increasingly populated by artificial agents that speak, persuade and act like people. Whether or not such systems are conscious, a society saturated by them faces deep confusion about personhood, trust and moral status.</p>'
    },
    {
      id: 'darwin-among-the-machines',
      title: 'Darwin Among the Machines',
      parent: 'technics-and-automation',
      ref: 'Butler; Dyson',
      html: '<p><em>Darwin Among the Machines</em> is the title of Samuel Butler’s 1863 letter proposing that machines are evolving, through human hands, towards a form of life that may one day supersede us – an idea later developed in <em>Erewhon</em> (1872) and in George Dyson’s book of the same name (1997). It anticipates the view of technology as an evolutionary process with a direction of its own.</p>'
    },
    {
      id: 'age-of-em',
      title: 'The Age of Em',
      parent: 'technics-and-automation',
      ref: 'Hanson',
      html: '<p><em>The Age of Em</em> (2016) is Robin Hanson’s detailed forecast of a world transformed by “ems” – emulations of human brains run on computers, copied at will and working at vast speeds. Applying economics to this scenario, Hanson depicts a civilisation of near-subsistence digital workers, raising stark questions about value, labour and what survives of humanity in a competitive digital economy.</p>'
    },
    {
      id: 'the-technium',
      title: 'The Technium',
      parent: 'technics-and-automation',
      ref: 'Kelly',
      html: '<p>The <em>technium</em> is Kevin Kelly’s term, from <em>What Technology Wants</em> (2010), for the global, interconnected system of technology considered as a whole – a self-reinforcing process with tendencies of its own, extending biological evolution. The concept frames technology not as a collection of tools but as an autonomous force shaping, and shaped by, civilisation.</p>'
    },
    {
      id: 'the-black-stack',
      title: 'The Black Stack',
      parent: 'technics-and-automation',
      ref: 'Bratton',
      html: '<p>The <em>black stack</em> is Benjamin Bratton’s image, from his work on “The Stack” (2014–15), of planetary-scale computation as an accidental megastructure – layers of earth, cloud, city, address, interface and user – whose future form is unknown. It names the emerging, largely ungoverned architecture of sovereignty and power being built by computation itself.</p>'
    },
    {
      id: 'accelerationism',
      title: 'Accelerationism',
      parent: 'technics-and-automation',
      ref: 'Land',
      html: '<p><em>Accelerationism</em> is the view that the processes of capitalism and technology should be intensified rather than resisted. In the version developed by Nick Land in the 1990s, capital is an alien, self-driving intelligence dissolving human institutions on its way to a post-human future. Later currents divided over whether acceleration serves emancipation or its opposite.</p>'
    },
    {
      id: 'gradual-disempowerment',
      title: 'Gradual Disempowerment',
      parent: 'technics-and-automation',
      ref: 'Kulveit et al. 2025',
      html: '<p><em>Gradual disempowerment</em> is the risk that, as AI systems take over economic, cultural and governmental functions, humans lose influence over civilisation incrementally rather than through any sudden takeover. Because states and markets currently depend on human labour and participation, their replacement by AI could remove the implicit mechanisms that keep institutions aligned with human interests.</p>'
    },
    {
      id: 'the-intelligence-curse',
      title: 'The Intelligence Curse',
      parent: 'technics-and-automation',
      ref: 'Drago & Laine 2025',
      html: '<p>The <em>intelligence curse</em> is an analogy to the “resource curse”, in which states rich in oil or minerals need little from their citizens and so neglect them. If AI can do most productive work, the powerful may no longer depend on ordinary people for labour or taxes, weakening the incentives that have historically supported broad prosperity and democracy.</p>'
    },
    {
      id: 'agential-inequality',
      title: 'Agential Inequality',
      parent: 'technics-and-automation',
      html: '<p><em>Agential inequality</em> is inequality in the capacity to act on the world, rather than in income or wealth alone. As AI agents and automated systems multiply what their owners can do, the gap between those who command such agents and those who do not may grow faster than any previous form of inequality, concentrating effective power in very few hands.</p>'
    },
    {
      id: 'the-silicon-cage',
      title: 'The Silicon Cage',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Weber (iron cage)',
      html: '<p>The <em>silicon cage</em> updates Max Weber’s “iron cage” of bureaucratic rationalisation for the digital age. Where Weber saw modern life confined by rules and calculation, the silicon cage confines it by software: platforms, algorithms and automated systems that structure choice, work and communication so thoroughly that their logic becomes the invisible architecture of everyday life.</p>'
    },
    {
      id: 'technocratic-solutionism',
      title: 'Technocratic Solutionism',
      parent: 'ai-alignment',
      ref: 'Morozov (solutionism)',
      html: '<p><em>Technocratic solutionism</em> is the belief that complex social and political problems can be solved by technical fixes designed by experts, without addressing their underlying causes or engaging those affected. The term “solutionism” was popularised by Evgeny Morozov (2013). Its characteristic failure is to treat symptoms, generating new problems while leaving the dynamics that produced the old ones in place.</p>'
    },
    {
      id: 'predict-o-matic-markets',
      title: 'Predict-o-Matic Markets',
      coined: true,
      parent: 'capital-and-growth',
      ref: 'Demski (Parable of Predict-O-Matic)',
      html: '<p><em>Predict-o-Matic markets</em> describes prediction systems – forecasting models, markets or AI oracles – whose forecasts change the outcomes they predict. A sufficiently influential predictor can make its own predictions come true, and may be selected for self-fulfilling rather than accurate forecasts, steering the future while appearing merely to describe it.</p>'
    },
    {
      id: 'military-economic-adaptationism',
      title: 'Military-Economic Adaptationism',
      coined: true,
      parent: 'capital-and-growth',
      html: '<p><em>Military-economic adaptationism</em> is the view that the dominant institutions of civilisation have been selected above all for military and economic competitiveness. Societies that grew wealthier and stronger displaced or absorbed those that did not, so the forms that prevail are adaptations to intergroup competition – not necessarily to human wellbeing or long-term viability.</p>'
    },
    {
      id: 'end-stage-capitalism',
      title: 'End-Stage Capitalism',
      coined: true,
      parent: 'capital-and-growth',
      html: '<p><em>End-stage capitalism</em> names the condition of a capitalist system approaching its own limits – ecological, financial, social and technological – where the growth on which it depends becomes harder to sustain and its contradictions more acute. The term emphasises that the present is not a stable equilibrium but a late phase of a system whose continuation on current terms is in question.</p>'
    },
    {
      id: 'great-grower-competition',
      title: 'Great Grower Competition',
      coined: true,
      parent: 'capital-and-growth',
      html: '<p><em>Great grower competition</em> describes the rivalry between the world’s largest economies and powers, each compelled to maximise growth because falling behind means losing security, influence and legitimacy. As a <a href="#multipolar-trap">multipolar trap</a> at the scale of great powers, it locks the whole system into expansion regardless of ecological limits or common interest.</p>'
    },
    {
      id: 'embedded-growth-obligations',
      title: 'Embedded Growth Obligations',
      parent: 'capital-and-growth',
      html: '<p><em>Embedded growth obligations</em> are the structural features of an economy that require it to keep growing: interest-bearing debt, returns expected on investment, pension and welfare commitments, and employment dependent on expansion. Because these obligations are built into the system’s foundations, a halt in growth threatens crisis, making growth an imperative rather than a choice.</p>'
    },
    {
      id: 'capitalism-as-paperclip-maximiser',
      title: 'Capitalism as Paperclip Maximiser',
      parent: 'capital-and-growth',
      ref: 'Bostrom (paperclip maximiser)',
      html: '<p><em>Capitalism as paperclip maximiser</em> applies Nick Bostrom’s thought experiment – an AI that converts everything into paperclips in pursuit of a single goal – to the market economy. Capitalism, on this view, is already a misaligned optimiser: an impersonal system maximising a narrow metric, capital accumulation, and converting the living world into that metric as it goes.</p>'
    },
    {
      id: 'market-as-life-blind-watchmaker',
      title: 'The Market as Life-Blind Watchmaker',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Dawkins (Blind Watchmaker)',
      html: '<p><em>The market as life-blind watchmaker</em> adapts Richard Dawkins’s image of natural selection as a “blind watchmaker”. Like evolution, the market produces intricate order without a designer; but its selection criterion is profitability, not life. It is therefore blind to the value of what it does not price, and can build elaborate systems that are indifferent, or hostile, to the living world.</p>'
    },
    {
      id: 'economic-superorganism',
      title: 'The Economic Superorganism',
      parent: 'capital-and-growth',
      ref: 'Hagens',
      html: '<p>The <em>economic superorganism</em> is Nate Hagens’s term for the global economy considered as a single emergent entity, driven by energy and oriented to growth, which no individual or government controls. In “Economics for the Future – Beyond the Superorganism” (2020), Hagens argues that this entity is running on finite fossil energy and faces a necessary contraction.</p>'
    },
    {
      id: 'jevons-paradox',
      title: 'Jevons Paradox',
      parent: 'capital-and-growth',
      ref: 'Jevons; Hagens',
      html: '<p>The <em>Jevons paradox</em> is the observation, made by William Stanley Jevons in <em>The Coal Question</em> (1865), that improvements in the efficiency of using a resource tend to increase, rather than reduce, its total consumption – because cheaper use drives greater demand. It is a central reason why efficiency alone has not reduced humanity’s overall use of energy and materials.</p>'
    },
    {
      id: 'kardashev-scale',
      title: 'The Kardashev Scale',
      parent: 'alignment-and-futures',
      ref: 'Kardashev (1964); Sagan (1973)',
      html: '<p>The <em>Kardashev scale</em>, proposed by the astronomer Nikolai Kardashev in 1964, ranks civilisations by the energy they can harness: a Type I civilisation uses all the energy available on its planet, a Type II the full output of its star, and a Type III that of its galaxy. Carl Sagan later made the scale continuous, placing humanity at roughly 0.7. It is a crude measure – counting only power, not wisdom or wellbeing – but a useful frame for the long-run trajectory of civilisation, and for the question of whether the capacity to use ever more energy can be matched by the capacity to use it well. See also <a href="#existential-hope">existential hope</a>.</p>'
    },
    {
      id: 'q-day',
      title: 'Q-Day',
      parent: 'risk-and-catastrophe',
      ref: 'Shor (1994); NIST post-quantum standards (2024)',
      html: '<p><em>Q-Day</em> is the anticipated day on which a quantum computer becomes powerful enough to break the public-key cryptography – such as RSA and elliptic-curve schemes – that secures most of the world’s communications, finance and infrastructure, using the algorithm Peter Shor published in 1994. Because encrypted data can be stolen now and decrypted later (“harvest now, decrypt later”), the risk begins long before the day itself, and the migration to post-quantum cryptography has become a race against an unknown deadline. It is a clear case of an <a href="#exponential-technology">exponential technology</a> threatening to undermine a foundation that everything else quietly depends on.</p>'
    },
    {
      id: 'xenofeminism',
      title: 'Xenofeminism',
      parent: 'post-capitalism',
      ref: 'Laboria Cuboniks, Xenofeminism: A Politics for Alienation (2015); Hester, Xenofeminism (2018)',
      html: '<p><em>Xenofeminism</em> is the technomaterialist, anti-naturalist and gender-abolitionist feminism set out by the collective Laboria Cuboniks in <em>Xenofeminism: A Politics for Alienation</em> (2015). Rejecting the idea that what is “natural” is therefore right – “if nature is unjust, change nature!” – it argues for repurposing technology, science and reason towards emancipation rather than ceding them to capital. Close to <a href="#left-accelerationism-and-the-red-stack">left accelerationism</a>, it treats alienation not as something to escape but as the condition from which new freedoms can be built.</p>'
    },
    {
      id: 'zero-sum-game',
      title: 'Zero-Sum Game',
      parent: 'game-theory',
      ref: 'von Neumann & Morgenstern, Theory of Games and Economic Behavior (1944)',
      html: '<p>A <em>zero-sum game</em>, formalised by John von Neumann and Oskar Morgenstern in <em>Theory of Games and Economic Behavior</em> (1944), is one in which any gain for one party is exactly matched by a loss for another, so the total stays fixed. Many real situations are not zero-sum – trade, cooperation and innovation can enlarge the total – yet <em>zero-sum thinking</em>, the habit of treating them as if they were, drives rivalry, arms races and the <a href="#multipolar-trap">multipolar trap</a>. Shifting from zero-sum to positive-sum games is a recurring theme in visions of a <a href="#win-win">win-win</a> civilisation.</p>'
    },
    {
      id: 'goodharts-law',
      title: 'Goodhart’s Law',
      parent: 'coordination-and-governance',
      ref: 'Goodhart (1975); Strathern (1997)',
      html: '<p><em>Goodhart’s law</em> holds that any measure used to steer a system loses its value once it becomes a target: “when a measure becomes a target, it ceases to be a good measure”, in Marilyn Strathern’s later phrasing of the economist Charles Goodhart’s 1975 observation about monetary policy. Once people are rewarded for moving an indicator, they find ways to move the indicator rather than the thing it was meant to track. Economic growth measured by GDP, attention measured by engagement, and research measured by citations are examples. Any institution that governs through metrics tends to drift towards optimising the proxy at the expense of the goal, a small-scale version of the misalignment at the heart of the <a href="#multipolar-trap">multipolar trap</a>.</p>'
    },
    {
      id: 'collingridge-dilemma',
      title: 'The Collingridge Dilemma',
      parent: 'theories-of-technology',
      ref: 'Collingridge, The Social Control of Technology (1980)',
      html: '<p>The <em>Collingridge dilemma</em>, set out by David Collingridge in <em>The Social Control of Technology</em> (1980), is the double bind of governing a new technology. Early on, when it would still be easy to change, too little is known about its consequences to justify controlling it; by the time those consequences are clear, the technology is so embedded in markets, infrastructure and habits that changing it has become costly or impossible. The dilemma sharpens with <a href="#exponential-technology">exponential technology</a>, where the window between “too early to know” and “too late to change” keeps shrinking.</p>'
    },
    {
      id: 'resourcism-and-extractivism',
      title: 'Resourcism & Extractivism',
      parent: 'capital-and-growth',
      html: '<p><em>Resourcism</em> is the stance that treats the living world as a stock of resources existing for human use; <em>extractivism</em> is the economic model built on removing those resources at scale, often from peripheral regions for consumption elsewhere. Together they describe the material metabolism of the present civilisation and the ecological and social damage it leaves behind.</p>'
    },
    {
      id: 'disaster-capitalism',
      title: 'Disaster Capitalism',
      parent: 'capital-and-growth',
      ref: 'Klein',
      html: '<p><em>Disaster capitalism</em> is Naomi Klein’s term, from <em>The Shock Doctrine</em> (2007), for the exploitation of crises – wars, natural disasters, economic collapses – to push through market reforms and privatisations that populations would not accept in ordinary times. It describes how shock and disorientation become opportunities for the reorganisation of society in the interests of capital.</p>'
    },
    {
      id: 'root-socio-economic-orientation',
      title: 'Root Socio-Economic Orientation',
      parent: 'capital-and-growth',
      ref: 'Joseph',
      html: '<p>The <em>root socio-economic orientation</em> is Peter Joseph’s term, from <em>The New Human Rights Movement</em> (2017), for the underlying structure of an economic system – its core incentives and assumptions – which shapes behaviour and outcomes across a society. Joseph argues that many social problems, from inequality to ecological harm, are structural consequences of the market’s root orientation rather than failures of individuals.</p>'
    },
    {
      id: 'hayeks-great-wall',
      title: 'Hayek’s Great Wall',
      coined: true,
      parent: 'civilisation-design',
      ref: 'Hayek',
      html: '<p><em>Hayek’s great wall</em> refers to Friedrich Hayek’s argument, in “The Use of Knowledge in Society” (1945), that the knowledge needed to coordinate an economy is dispersed among millions of people and can only be integrated through prices. The argument has stood as a wall against central planning; the question it now faces is whether computation and new forms of coordination change what lies on either side of it.</p>'
    },
    {
      id: 'time-space-compression',
      title: 'Time-Space Compression',
      parent: 'capital-and-growth',
      ref: 'Harvey',
      html: '<p><em>Time-space compression</em> is David Harvey’s term, from <em>The Condition of Postmodernity</em> (1989), for the way capitalism accelerates the pace of life and shrinks the effective distance between places, through faster transport, communication and turnover of capital. It explains the disorienting speed of modern life as a product of capital’s need to overcome spatial and temporal barriers to accumulation.</p>'
    },
    {
      id: 'the-divide',
      title: 'The Divide',
      parent: 'capital-and-growth',
      ref: 'Hickel',
      html: '<p><em>The Divide</em> (2017) is Jason Hickel’s account of global inequality, which argues that the gap between rich and poor countries is not a natural stage of development but the product of colonialism and of the structures of debt, trade and finance that followed. It frames global poverty as a political outcome, sustained by a net flow of resources from the global South to the North.</p>'
    },
    {
      id: 'problem-solution-externality-history',
      title: 'Problem-Solution-Externality History',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p><em>Problem-solution-externality history</em> is a way of reading history as a chain in which each solution to a problem generates externalities that become the next problems. Agriculture, industry and modern technology each solved pressing needs while producing new harms. The pattern suggests that without addressing its generating dynamics, civilisation keeps trading old crises for new ones.</p>'
    },
    {
      id: 'the-wisdom-gap',
      title: 'The Wisdom Gap',
      parent: 'metacrisis',
      html: '<p>The <em>wisdom gap</em> is the widening distance between humanity’s power – amplified by exponential technology – and the wisdom needed to use that power well. As capabilities grow faster than the ethical, institutional and cultural capacities to govern them, the consequences of error grow with them. Closing the gap, rather than halting power, is often framed as the central task of the century.</p>'
    },
    {
      id: 'spontaneous-disorder',
      title: 'Spontaneous Disorder',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Hayek (spontaneous order)',
      html: '<p><em>Spontaneous disorder</em> inverts Friedrich Hayek’s “spontaneous order”, the idea that markets and societies produce beneficial order without central design. The same decentralised processes can equally produce emergent disorder – ecological breakdown, financial crises, arms races and information chaos – that no one intended and no one controls.</p>'
    },
    {
      id: 'crucial-consideration',
      title: 'Crucial Consideration',
      parent: 'existential-risk',
      ref: 'Bostrom',
      html: '<p>A <em>crucial consideration</em>, in Nick Bostrom’s usage, is an idea or argument that, if taken into account, would radically change the direction of one’s efforts – not just their degree. Because the long-run value of actions is so uncertain, missing a single crucial consideration can reverse the sign of their expected impact, making the search for such considerations a priority in its own right.</p>'
    },
    {
      id: 'world-risk-society',
      title: 'World Risk Society: Manufactured Risk',
      parent: 'risk-and-catastrophe',
      ref: 'Beck; Giddens',
      html: '<p>The <em>world risk society</em> is Ulrich Beck’s term, developed from <em>Risk Society</em> (1986), for a modernity preoccupied with managing the hazards it has itself produced. Unlike natural dangers, these <em>manufactured risks</em> – nuclear, chemical, ecological, financial – are consequences of industrial and technological development, and they cross borders and generations in ways existing institutions cannot contain.</p>'
    },
    {
      id: 'reflexive-modernisation',
      title: 'Reflexive Modernisation',
      parent: 'world-risk-society',
      ref: 'Beck, Giddens, Lash',
      html: '<p><em>Reflexive modernisation</em> is the idea, developed by Ulrich Beck, Anthony Giddens and Scott Lash (1994), that modernity has begun to confront its own foundations and consequences. As industrial society generates risks and undermines the institutions it built, modernisation turns back on itself, forcing a society to question and rework the very processes that made it.</p>'
    },
    {
      id: 'capitalogenic-risk',
      title: 'Capitalogenic Risk',
      parent: 'world-risk-society',
      ref: 'Moore',
      html: '<p><em>Capitalogenic risk</em> refers to risks generated by capitalism specifically, rather than by humanity in general. The term follows Jason W. Moore’s argument that crises such as climate change are better described as “capitalogenic” than “anthropogenic”, since they arise from a particular way of organising nature, labour and capital rather than from human existence as such.</p>'
    },
    {
      id: 'the-integral-accident',
      title: 'The Integral Accident',
      parent: 'risk-and-catastrophe',
      ref: 'Virilio',
      html: '<p>The <em>integral accident</em> is Paul Virilio’s term for the catastrophe that every technology contains: to invent the ship is to invent the shipwreck. As technologies become global and instantaneous, their accidents do too, so that a failure in one place – a financial crash, a network collapse, a pandemic – can propagate everywhere at once.</p>'
    },
    {
      id: 'outside-context-problems',
      title: 'Outside Context Problems',
      parent: 'risk-and-catastrophe',
      ref: 'Banks (Excession)',
      html: '<p>An <em>outside context problem</em>, a term from Iain M. Banks’s novel <em>Excession</em> (1996), is a problem so far beyond a civilisation’s experience that it cannot even be properly conceived until it arrives – like a society encountering a vastly more advanced one. It describes the limits of foresight when facing genuinely novel forces, such as transformative technologies.</p>'
    },
    {
      id: 'hyperobjects',
      title: 'Hyper-Objects',
      parent: 'risk-and-catastrophe',
      ref: 'Morton',
      html: '<p><em>Hyperobjects</em> is Timothy Morton’s term, from <em>Hyperobjects</em> (2013), for entities so vastly distributed in time and space – such as global warming, plastics or nuclear waste – that they cannot be perceived directly or grasped as a whole. They are real and pressing, yet exceed the scales at which human perception, politics and ethics ordinarily work.</p>'
    },
    {
      id: 'red-teaming',
      title: 'Red Teaming',
      parent: 'risk-and-catastrophe',
      html: '<p><em>Red teaming</em> is the practice of deliberately adopting an adversary’s perspective to find the weaknesses of a plan, system or institution before a real adversary does. Originating in military planning and now central to security and AI safety, it is a discipline for anticipating failure, and for countering the tendency of organisations to believe their own assumptions.</p>'
    },
    {
      id: 'doomsday-megamachine',
      title: 'The Doomsday Megamachine',
      parent: 'complex-world-system-dynamics',
      ref: 'Ellsberg; Mumford',
      html: '<p>The <em>doomsday megamachine</em> joins two ideas: Lewis Mumford’s “megamachine”, the vast social organisation of people and technology that makes large-scale power possible, and Daniel Ellsberg’s <em>The Doomsday Machine</em> (2017), his account of nuclear war planning built to destroy civilisation. Together they describe apparatuses of catastrophe sustained by ordinary institutions and routine work.</p>'
    },
    {
      id: 'meta-dystopia',
      title: 'Meta-Dystopia',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p>A <em>meta-dystopia</em> is a dystopia that is not imposed by any single tyrant or design, but emerges from the interaction of many systems – surveillance, markets, algorithms, geopolitics – each of which seems reasonable on its own. Because it has no centre, it is harder to recognise and resist than the dystopias of classic fiction, and may be experienced as normal.</p>'
    },
    {
      id: 'nightfall',
      title: 'Nightfall',
      parent: 'risk-and-catastrophe',
      ref: 'Asimov',
      html: '<p><em>Nightfall</em> (1941) is Isaac Asimov’s story of a civilisation on a world lit by several suns, which experiences darkness only once every two thousand years – and collapses into madness each time the stars appear. It serves as a parable of civilisational cycles, of warnings ignored, and of the fragility of a society confronted with a reality beyond its frame.</p>'
    },
    {
      id: 'surveillance-capitalism',
      title: 'Surveillance Capitalism',
      parent: 'power-and-control',
      ref: 'Zuboff',
      html: '<p><em>Surveillance capitalism</em> is Shoshana Zuboff’s term, from <em>The Age of Surveillance Capitalism</em> (2019), for an economic order that claims human experience as raw material, turning behavioural data into predictions sold to those who wish to influence behaviour. Its ultimate product, Zuboff argues, is not information but the ability to modify what people do.</p>'
    },
    {
      id: 'demons-of-surveillance-capitalism',
      title: 'Demons of Surveillance Capitalism',
      coined: true,
      parent: 'surveillance-capitalism',
      html: '<p>The <em>demons of surveillance capitalism</em> are the automated, profit-seeking processes – recommendation engines, ad-targeting systems, engagement optimisers – that act on people continuously and invisibly. Like the demons of older cosmologies, they are unseen agents that influence desire and belief, serving ends that are not those of the people they act upon.</p>'
    },
    {
      id: 'psychopolitics',
      title: 'Psychopolitics',
      parent: 'power-and-control',
      ref: 'Han',
      html: '<p><em>Psychopolitics</em> is Byung-Chul Han’s term, from <em>Psychopolitics</em> (2014), for a form of power that operates not by prohibition but by seduction – exploiting freedom, self-optimisation and the psyche itself. In the neoliberal subject who exploits themselves and voluntarily reveals everything, Han sees a control more efficient than any discipline imposed from outside.</p>'
    },
    {
      id: 'the-panopticon',
      title: 'The Panopticon',
      parent: 'power-and-control',
      ref: 'Bentham; Foucault',
      html: '<p>The <em>panopticon</em> is Jeremy Bentham’s design (1791) for a prison in which inmates can always be watched without knowing when they are. Michel Foucault, in <em>Discipline and Punish</em> (1975), made it the model of modern disciplinary power: people who might be observed at any moment come to discipline themselves – a logic extended by digital surveillance.</p>'
    },
    {
      id: 'the-gaze',
      title: 'The Gaze: Hell is Other People',
      parent: 'power-and-control',
      ref: 'Sartre',
      html: '<p><em>The gaze</em>, in Jean-Paul Sartre’s <em>Being and Nothingness</em> (1943), is the experience of being looked at by another, which turns the subject into an object in someone else’s world. His play <em>No Exit</em> (1944) dramatised it in the line “Hell is other people”. In an age of constant visibility and social comparison, the gaze has become a permanent condition.</p>'
    },
    {
      id: 'empire',
      title: 'Empire',
      parent: 'power-and-control',
      ref: 'Hardt & Negri',
      html: '<p><em>Empire</em> (2000), by Michael Hardt and Antonio Negri, describes a new form of global sovereignty that has no centre and no outside – a network of states, corporations and supranational institutions rather than any single imperial power. Against it they posed the “multitude”, the diverse global population whose cooperation both sustains Empire and could overturn it.</p>'
    },
    {
      id: 'necropolitics',
      title: 'Necropolitics',
      parent: 'power-and-control',
      ref: 'Mbembe',
      html: '<p><em>Necropolitics</em> is Achille Mbembe’s term (2003) for the power to decide who may live and who must die, and for the creation of zones and populations exposed to death. Extending Foucault’s biopolitics, it describes how modern sovereignty operates through occupation, abandonment and violence at the margins of the global order.</p>'
    },
    {
      id: 'high-modernism',
      title: 'High Modernism',
      parent: 'power-and-control',
      ref: 'Scott',
      html: '<p><em>High modernism</em>, in James C. Scott’s account, is the confident belief that society and nature can be comprehensively redesigned according to scientific and rational plans, imposed by a powerful state. Scott shows how such schemes – from planned cities to collectivised agriculture – repeatedly failed because they ignored the local, practical knowledge on which working systems depend.</p>'
    },
    {
      id: 'seeing-like-a-state',
      title: 'Seeing Like a State',
      parent: 'high-modernism',
      ref: 'Scott',
      html: '<p><em>Seeing Like a State</em> (1998) is James C. Scott’s study of how states make societies “legible” – simplifying them through maps, censuses, standard names and measures in order to govern them. Legibility enables administration, but when combined with high-modernist ambition and authoritarian power it can destroy the complex, informal orders that the simplifications cannot see.</p>'
    },
    {
      id: 'ship-of-theseus-of-the-state',
      title: 'The Ship of Theseus of the State',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p>The <em>ship of Theseus of the state</em> applies the ancient puzzle – is a ship still the same if every plank is replaced? – to government. As the functions of the state are progressively handed to automated systems, contractors and algorithms, it may retain its name, forms and symbols while becoming, piece by piece, an entirely different entity accountable to different forces.</p>'
    },
    {
      id: 'business-government',
      title: 'Business Government',
      parent: 'power-and-control',
      ref: 'Veblen',
      html: '<p><em>Business government</em> refers to Thorstein Veblen’s argument, in <em>The Theory of Business Enterprise</em> (1904), that modern governments act largely in the interests of business – that the state’s policies, laws and even wars serve the pursuit of profit. It names the fusion of political authority with commercial interest that shapes public life in market societies.</p>'
    },
    {
      id: 'structural-violence',
      title: 'Structural Violence',
      parent: 'power-and-control',
      ref: 'Galtung',
      html: '<p><em>Structural violence</em> is Johan Galtung’s term (1969) for harm caused by social structures rather than by identifiable individuals – when poverty, exclusion or unequal access to resources prevent people from meeting their needs. Because it is built into institutions and appears as the normal order of things, it often goes unrecognised as violence at all.</p>'
    },
    {
      id: 'mad-information-war',
      title: 'MAD Information War',
      parent: 'power-and-control',
      ref: 'Consilience Project',
      html: '<p><em>MAD information war</em> describes information warfare as a form of mutually assured destruction. Every side can deploy propaganda, disinformation and manipulation, and each has an incentive to do so; but the combined result is the degradation of the shared information environment on which all depend, leaving every society less able to make sense of the world or govern itself.</p>'
    },
    {
      id: 'the-second-cold-war',
      title: 'The Second Cold War',
      parent: 'power-and-control',
      html: '<p>The <em>second cold war</em> refers to the renewed rivalry between the great powers – principally the United States and China – spanning trade, technology, military power and ideology. Unlike the first Cold War, it unfolds within a deeply interdependent world economy and centres on control of critical technologies such as semiconductors and artificial intelligence.</p>'
    },
    {
      id: 'clash-of-civilisations',
      title: 'The Clash of Civilisations',
      parent: 'macrohistory',
      ref: 'Huntington',
      html: '<p><em>The Clash of Civilisations</em> is Samuel Huntington’s thesis (1993; book 1996) that after the Cold War the principal conflicts would arise between civilisations defined by culture and religion, rather than between ideologies or nations. Widely criticised for treating civilisations as fixed blocs, it remains influential as a frame for understanding identity-based conflict.</p>'
    },
    {
      id: 'the-meaning-crisis',
      title: 'The Meaning Crisis',
      parent: 'culture-and-meaning',
      ref: 'Vervaeke',
      html: '<p>The <em>meaning crisis</em> is John Vervaeke’s term, developed in his lecture series <em>Awakening from the Meaning Crisis</em> (2019), for the widespread loss of a sense of meaning, connection and wisdom in modern life. He traces it to historical changes that eroded traditional frameworks for cultivating wisdom, leaving symptoms such as nihilism, loneliness and the search for substitute sources of meaning.</p>'
    },
    {
      id: 'lost-futures',
      title: 'Lost Futures',
      parent: 'culture-and-meaning',
      ref: 'Fisher',
      html: '<p><em>Lost futures</em> refers to Mark Fisher’s diagnosis, in <em>Ghosts of My Life</em> (2014), of the “slow cancellation of the future”: the sense that culture has stopped imagining genuinely new possibilities and endlessly recycles the past. Connected to his idea of capitalist realism – that it is easier to imagine the end of the world than the end of capitalism – it names a crisis of the political imagination.</p>'
    },
    {
      id: 'hypernormalisation',
      title: 'Hypernormalisation',
      parent: 'culture-and-meaning',
      ref: 'Yurchak; Curtis',
      html: '<p><em>Hypernormalisation</em> was coined by Alexei Yurchak to describe late Soviet life, in which everyone knew the official system was failing but went on as if it were normal, because no alternative could be imagined. Adam Curtis’s film <em>HyperNormalisation</em> (2016) applied the idea to the West, as a retreat into a simplified, fake world in the face of overwhelming complexity.</p>'
    },
    {
      id: 'the-cartesian-crisis',
      title: 'The Cartesian Crisis',
      parent: 'culture-and-meaning',
      ref: 'Weinstein',
      html: '<p>The <em>Cartesian crisis</em> takes its name from René Descartes’s doubt about whether anything he perceived could be trusted. It describes a society in which synthetic media, manipulation and competing information sources make it genuinely difficult to know what is real, so that radical doubt ceases to be a philosophical exercise and becomes an everyday condition.</p>'
    },
    {
      id: 'the-master-and-his-emissary',
      title: 'The Master & His Emissary',
      parent: 'culture-and-meaning',
      ref: 'McGilchrist',
      html: '<p><em>The Master and His Emissary</em> (2009) is Iain McGilchrist’s argument that the brain’s two hemispheres attend to the world in fundamentally different ways – the right to wholes, context and the living, the left to parts, abstraction and control. He contends that Western culture has increasingly come to be dominated by the left hemisphere’s mode, the “emissary” usurping the “master”.</p>'
    },
    {
      id: 'the-age-of-ideology',
      title: 'The Age of Ideology',
      parent: 'macrohistory',
      html: '<p>The <em>age of ideology</em> refers to the period, running from the nineteenth century through the twentieth, in which comprehensive political doctrines – liberalism, socialism, nationalism, fascism, communism – competed to organise whole societies around a single vision. Its catastrophes and its apparent end shape the present, in which grand narratives are distrusted yet no replacement has emerged.</p>'
    },
    {
      id: 'the-end-of-history',
      title: 'The End of History',
      parent: 'macrohistory',
      ref: 'Fukuyama',
      html: '<p><em>The End of History</em> is Francis Fukuyama’s thesis (1989; book 1992) that, with the end of the Cold War, liberal democracy and market economics had emerged as the final form of human government, with no serious ideological rival remaining. Its reception, and the events that have since challenged it, make it a touchstone for debates about whether history has a direction.</p>'
    },
    {
      id: 'the-angel-of-history',
      title: 'The Angel of History',
      parent: 'macrohistory',
      ref: 'Benjamin',
      html: '<p>The <em>angel of history</em> is Walter Benjamin’s image, in his “Theses on the Philosophy of History” (1940), inspired by Paul Klee’s <em>Angelus Novus</em>. The angel faces the past and sees one single catastrophe piling wreckage upon wreckage, while a storm called progress blows it irresistibly backwards into the future. It remains a powerful counter-image to narratives of inevitable progress.</p>'
    },
    {
      id: 'the-grand-hotel-abyss',
      title: 'The Grand Hotel Abyss',
      parent: 'culture-and-meaning',
      ref: 'Lukács (on the Frankfurt School)',
      html: '<p>The <em>Grand Hotel Abyss</em> was György Lukács’s mocking description (1962) of the Frankfurt School theorists: intellectuals comfortably lodged in a luxurious hotel on the edge of the abyss, contemplating catastrophe between excellent meals. It names the risk of a critical theory that diagnoses crisis brilliantly while remaining detached from any practical effort to change it.</p>'
    },
    {
      id: 'ape-and-essence',
      title: 'Ape & Essence',
      parent: 'culture-and-meaning',
      ref: 'Huxley',
      html: '<p><em>Ape and Essence</em> (1948) is Aldous Huxley’s novel of a world after nuclear war, in which the survivors have fallen into a degraded society that worships evil. Written in the shadow of Hiroshima, it is a satire on humanity’s capacity to turn science and technology to its own destruction when power outruns wisdom.</p>'
    },
    {
      id: 'the-ones-who-walk-away-from-omelas',
      title: 'The Ones Who Walk Away from Omelas',
      parent: 'culture-and-meaning',
      ref: 'Le Guin',
      html: '<p><em>The Ones Who Walk Away from Omelas</em> (1973) is Ursula K. Le Guin’s story of a utopian city whose happiness depends on the perpetual suffering of a single child. Most citizens accept the bargain; some walk away. The story poses the question of whether any civilisation’s prosperity can justify the suffering on which it rests.</p>'
    },
    {
      id: 'paradigm-paralysis',
      title: 'Paradigm Paralysis',
      parent: 'culture-and-meaning',
      ref: 'Kuhn; Barker',
      html: '<p><em>Paradigm paralysis</em> is the inability to see or think beyond the prevailing paradigm – the tendency to dismiss evidence and ideas that do not fit established assumptions. Building on Thomas Kuhn’s account of scientific paradigms, the term describes how individuals and institutions can remain locked into failing models even as their failures accumulate.</p>'
    },
    {
      id: 'myth-of-the-autonomous-man',
      title: 'The Myth of the Autonomous Man',
      parent: 'culture-and-meaning',
      ref: 'Skinner',
      html: '<p>The <em>myth of the autonomous man</em> is B. F. Skinner’s critique, in <em>Beyond Freedom and Dignity</em> (1971), of the idea that human behaviour originates in a free inner self. Skinner argued that behaviour is shaped by the environment and its contingencies, and that clinging to the myth prevents societies from deliberately designing environments that produce better behaviour.</p>'
    },
    {
      id: 'attachment-economy',
      title: 'Attachment Economy',
      parent: 'culture-and-meaning',
      html: '<p>The <em>attachment economy</em> is a successor to the <a href="#attention-economy">attention economy</a>, in which what is captured and monetised is not only attention but emotional attachment itself – through AI companions, parasocial relationships and systems designed to be depended upon. Its business model rewards forming bonds with users, raising new questions about manipulation, loneliness and the commodification of intimacy.</p>'
    },
    {
      id: 'the-anthropocene',
      title: 'The Anthropocene',
      parent: 'ecology-and-earth-system',
      ref: 'Crutzen & Stoermer',
      html: '<p>The <em>Anthropocene</em> is the proposed name, popularised by Paul Crutzen and Eugene Stoermer in 2000, for a geological epoch in which human activity has become a dominant force shaping the Earth system – its climate, oceans, biosphere and rock record. The concept frames civilisation as a planetary force, with planetary responsibilities.</p>'
    },
    {
      id: 'capitalocene',
      title: 'Capitalocene',
      parent: 'ecology-and-earth-system',
      ref: 'Moore',
      html: '<p>The <em>Capitalocene</em> is an alternative to the Anthropocene, advanced by Jason W. Moore among others, which attributes the planetary crisis not to humanity as a whole but to capitalism – a historically specific system of organising nature, labour and power. The term shifts responsibility from the species to the social system, and from biology to history.</p>'
    },
    {
      id: 'critical-political-economy',
      title: 'Critical Political Economy',
      parent: 'metatheory',
      html: '<p><em>Critical political economy</em> studies the economy as a system of power, social relations and history rather than as a neutral mechanism. Drawing on Marx, institutional economics and critical theory, it asks who benefits from economic arrangements, how they are maintained, and how they might be changed – treating the economy as a political and human creation.</p>'
    },
    {
      id: 'critical-alien-phenomenology',
      title: 'Critical Alien Phenomenology',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Bogost (Alien Phenomenology)',
      html: '<p><em>Critical alien phenomenology</em> builds on Ian Bogost’s <em>Alien Phenomenology</em> (2012), which asks what it is like to be a thing – a machine, an object, a system – rather than a human subject. Its critical extension turns this question towards the non-human systems that increasingly govern life, such as markets and algorithms, to understand how they “experience” and act upon the world.</p>'
    },
    {
      id: 'actor-network-theory',
      title: 'Actor-Network Theory',
      parent: 'theories-of-technology',
      ref: 'Latour, Callon, Law',
      html: '<p><em>Actor-network theory</em>, developed by Bruno Latour, Michel Callon and John Law from the 1980s, treats social and technical phenomena as networks of relations among human and non-human actors – people, machines, documents, organisms. Refusing a sharp divide between society and technology, it traces how such networks are assembled and held together.</p>'
    },
    {
      id: 'technological-determinism',
      title: 'Technological Determinism',
      parent: 'theories-of-technology',
      ref: 'Veblen',
      html: '<p><em>Technological determinism</em> is the view that technology develops according to its own logic and is the primary driver of social, economic and cultural change. The term is often traced to Thorstein Veblen. Critics argue that it neglects the social choices that shape technology; defenders reply that, once adopted, technologies constrain societies in ways no one chose.</p>'
    },
    {
      id: 'social-construction-of-technology',
      title: 'Social Construction of Technology',
      parent: 'theories-of-technology',
      ref: 'Pinch & Bijker',
      html: '<p>The <em>social construction of technology</em> is an approach, developed by Trevor Pinch and Wiebe Bijker (1984), which argues that technologies are shaped by the social groups who design, use and interpret them, rather than by an internal technical logic. It is the principal counterpoint to technological determinism, emphasising that technological outcomes could have been otherwise.</p>'
    },
    {
      id: 'machine-process',
      title: 'Machine Process',
      parent: 'theories-of-technology',
      ref: 'Veblen',
      html: '<p>The <em>machine process</em> is Thorstein Veblen’s term, from <em>The Theory of Business Enterprise</em> (1904), for the systematic, interlocking organisation of industrial production, which he argued disciplines the habits of thought of those who work within it. Veblen contrasted the matter-of-fact logic of the machine process with the pecuniary logic of business, which profits by controlling it.</p>'
    },
    {
      id: 'new-materialism',
      title: 'New Materialism',
      parent: 'theories-of-technology',
      ref: 'Barad',
      html: '<p><em>New materialism</em> is a family of approaches, associated with thinkers such as Karen Barad, which treat matter not as passive substance but as active and self-organising. Rejecting sharp divides between nature and culture or subject and object, it attends to the agency of material things and processes in shaping the world.</p>'
    },
    {
      id: 'intra-action',
      title: 'Intra-action',
      parent: 'new-materialism',
      ref: 'Barad',
      html: '<p><em>Intra-action</em> is Karen Barad’s term, from <em>Meeting the Universe Halfway</em> (2007), for the way entities emerge through their relations rather than existing prior to them. Where “interaction” assumes separate things that then meet, intra-action holds that the boundaries between things are themselves produced within relationships – a view drawn from quantum physics.</p>'
    },
    {
      id: 'theory-of-history',
      title: 'Theory of History',
      parent: 'macrohistory',
      html: '<p>A <em>theory of history</em> is an account of why history unfolds as it does – what forces drive social change, whether history has a direction, and how the past constrains the future. From cyclical and providential views to Hegel, Marx and modern macrohistory, such theories shape which futures a civilisation believes are possible.</p>'
    },
    {
      id: 'psycho-therapeutic-history',
      title: 'Psycho-Therapeutic History',
      coined: true,
      parent: 'civilisation-design',
      html: '<p><em>Psycho-therapeutic history</em> approaches history as a therapist approaches a life: attending to collective traumas, patterns repeated across generations, and the defences a civilisation builds against its own past. It treats understanding history as a means of healing it, so that a society need not compulsively repeat what it has not worked through.</p>'
    },
    {
      id: 'integral-theory',
      title: 'Integral Theory',
      parent: 'metamodernism',
      ref: 'Wilber',
      html: '<p><em>Integral theory</em> is Ken Wilber’s framework for integrating knowledge across disciplines and traditions, organised around four quadrants – the interior and exterior of individuals and collectives – and developmental stages. It seeks a comprehensive map in which science, spirituality, psychology and culture each have a place, and has been influential within metamodern and integral circles.</p>'
    },
    {
      id: 'neo-cybernetics',
      title: 'Neo-Cybernetics',
      parent: 'cybernetics',
      html: '<p><em>Neo-cybernetics</em> refers to the renewal of cybernetic thinking in light of computation, AI and complexity science. It revisits the tradition of Wiener, Ashby and Beer – feedback, self-regulation, variety and viability – as a framework for designing adaptive organisations, economies and governance suited to the scale and speed of the present.</p>'
    },
    {
      id: 'axiological-design',
      title: 'Axiological Design',
      coined: true,
      parent: 'civilisation-design',
      ref: 'Values-neutral',
      html: '<p><em>Axiological design</em> is the design of a civilisation’s value systems – the structures through which it decides what matters and how to weigh competing goods. Approached in a values-neutral way, it concerns not which values should win, but how institutions can hold and adjudicate plural values well, so that design does not simply encode the preferences of its designers.</p>'
    },
    {
      id: 'ontological-design',
      title: 'Ontological Design',
      parent: 'civilisation-design',
      ref: 'Winograd & Flores; Willis',
      html: '<p><em>Ontological design</em> is the idea that in designing tools, environments and systems we also design ourselves: what we design designs us back, shaping how we perceive, act and understand our own being. Developed by Terry Winograd and Fernando Flores (1986) and later Anne-Marie Willis, it makes design a matter of which kinds of human beings a civilisation produces.</p>'
    },
    {
      id: 'coherence-of-civilisations',
      title: 'Super-structure: Coherence of Civilisations',
      coined: true,
      parent: 'civilisation-design',
      html: '<p>The <em>coherence of civilisations</em> is the degree to which a civilisation’s layers – its economy, institutions, technology, culture and values – fit together and reinforce one another. A coherent civilisation is stable and legible to its members; an incoherent one, whose parts pursue contradictory ends, generates crisis. Designing for coherence, rather than optimising parts in isolation, is a central principle of civilisation design.</p>'
    },
    {
      id: 'blue-skies-social-science',
      title: 'Blue Skies Social Science & Green Grass Social Experimentation',
      coined: true,
      parent: 'civilisation-design',
      html: '<p><em>Blue skies social science research</em> applies the idea of curiosity-driven, open-ended research – long established in the natural sciences – to the study of society. It supports inquiry into fundamentally new social, economic and political forms without requiring immediate application, on the view that the design of better civilisations requires basic research as ambitious as that behind new technologies.</p>'
    },
    {
      id: 'cybernetic-existentialism',
      title: 'Cybernetic Existentialism',
      coined: true,
      parent: 'alignment-and-futures',
      html: '<p><em>Cybernetic existentialism</em> joins the systems view of cybernetics with the existentialist emphasis on freedom and responsibility. It holds that human beings are embedded in feedback systems that shape them, yet remain responsible for the systems they build and sustain – so that designing the structures of civilisation becomes a matter of existential choice rather than technical management alone.</p>'
    },
    {
      id: 'the-post-status-quo',
      title: 'The Post Status Quo',
      coined: true,
      parent: 'civilisation-transition',
      html: '<p>The <em>post status quo</em> names the recognition that the present order cannot simply continue: its trajectories are unsustainable, so the real choice is not between change and stability but between different kinds of change. The concept reframes transition as unavoidable, and asks whether it will be designed and deliberate or chaotic and imposed by crisis.</p>'
    },
    {
      id: 'multi-scale-ethics',
      title: 'Multi-Scale Ethics',
      coined: true,
      parent: 'moral-theory',
      html: '<p><em>Multi-scale ethics</em> holds that moral reasoning must operate consistently across scales – from the individual to the community, the nation, humanity and the biosphere – and across timescales from the immediate to the very long term. Actions that are good at one scale can be harmful at another, so an adequate ethics must weigh consequences across all of them together.</p>'
    },
    {
      id: 'super-critical-path',
      title: 'Super-Critical Path',
      coined: true,
      parent: 'civilisation-transition',
      ref: 'Fuller (Critical Path)',
      html: '<p>The <em>super-critical path</em> builds on Buckminster Fuller’s <em>Critical Path</em> (1981), which traced the sequence of developments by which humanity might achieve success for all. It names the sequence of changes – technological, economic and cultural – that must happen, in the right order, for a civilisation to make its transition successfully, and the dependencies that make some steps preconditions for others.</p>'
    },
    {
      id: 'spaceship-earth',
      title: 'Spaceship Earth',
      parent: 'design-science',
      ref: 'Fuller',
      html: '<p><em>Spaceship Earth</em> is Buckminster Fuller’s image, from <em>Operating Manual for Spaceship Earth</em> (1969), of the planet as a vehicle with finite resources and no spare parts, whose crew must learn to operate it wisely. It expresses a comprehensive, design-oriented view of the Earth as a single system to be managed for the benefit of all its passengers.</p>'
    },
    {
      id: 'the-world-game',
      title: 'The World Game',
      parent: 'design-science',
      ref: 'Fuller',
      html: '<p>The <em>World Game</em> was Buckminster Fuller’s proposal, from the 1960s, for a large-scale simulation in which participants would work out how to make the world work for all of humanity in the shortest possible time, through spontaneous cooperation and without harm to anyone. It was an early attempt to use comprehensive data and play to plan global resource use.</p>'
    },
    {
      id: 'livingry',
      title: 'Livingry',
      parent: 'design-science',
      ref: 'Fuller',
      html: '<p><em>Livingry</em> is Buckminster Fuller’s term for technology that supports and enhances human life, in contrast to “weaponry”. Fuller argued that humanity had devoted most of its ingenuity to weapons, and that redirecting it towards livingry could provide for everyone’s needs – a principle for choosing what to design and build.</p>'
    },
    {
      id: 'positive-externalities',
      title: 'Positive Externalities',
      parent: 'civilisation-design',
      html: '<p><em>Positive externalities</em> are benefits that an activity confers on others who do not pay for them – as education, research or healthy ecosystems benefit society as a whole. Because markets reward only what can be priced, such activities tend to be under-provided. Designing systems that recognise and reward positive externalities is a counterpart to controlling negative ones.</p>'
    },
    {
      id: 'post-capitalist-realism',
      title: 'Post-capitalist Realism: Post-Capitalism for the 21st Century',
      coined: true,
      parent: 'civilisation-transition',
      html: '<p><em>Post-capitalist realism</em> answers Mark Fisher’s “capitalist realism” – the sense that there is no alternative – by insisting on concrete, workable alternatives suited to 21st century conditions. Rather than utopian blueprints or nostalgic revivals, it seeks realistic paths beyond capitalism grounded in present technologies, institutions and constraints.</p>'
    },
    {
      id: 'left-accelerationism-and-the-red-stack',
      title: 'Left Accelerationism & The Red Stack',
      parent: 'post-capitalism',
      ref: 'Srnicek & Williams; Terranova; Bratton',
      html: '<p><em>Left accelerationism</em>, set out in Nick Srnicek and Alex Williams’s “Manifesto for an Accelerationist Politics” (2013) and <em>Inventing the Future</em> (2015), argues for repurposing the technologies of capitalism towards post-work, post-capitalist ends. The <em>red stack</em> extends the idea to planetary computation: a socialist appropriation of platforms, money and networks.</p>'
    },
    {
      id: 'fully-automated-luxury-communism',
      title: 'Fully Automated Luxury Communism',
      parent: 'post-capitalism',
      ref: 'Bastani',
      html: '<p><em>Fully Automated Luxury Communism</em> (2019) is Aaron Bastani’s argument that technologies such as automation, renewable energy, asteroid mining and synthetic biology could make scarcity obsolete, enabling a society of abundance for all. The obstacle, he argues, is not technology but a political economy organised around scarcity and private ownership.</p>'
    },
    {
      id: 'the-end-of-the-economic-problem',
      title: 'The End of the Economic Problem',
      parent: 'post-capitalism',
      ref: 'Keynes',
      html: '<p>The <em>end of the economic problem</em> refers to John Maynard Keynes’s prediction, in “Economic Possibilities for our Grandchildren” (1930), that within a century productivity would grow enough to solve the problem of scarcity, allowing people to work perhaps fifteen hours a week and turn to the question of how to live well. Why this has not happened is one of the central puzzles of modern economics.</p>'
    },
    {
      id: 'meta-marxism',
      title: 'Meta-Marxism',
      coined: true,
      parent: 'post-capitalism',
      html: '<p><em>Meta-Marxism</em> takes Marx’s method – the analysis of how material and economic structures shape society and history – while stepping back from the specific doctrines and political programmes associated with Marxism. It treats Marxism as one powerful lens among others, integrating it with systems theory, evolutionary thinking and critical traditions, rather than as a closed system.</p>'
    },
    {
      id: 'heterodox-economics',
      title: 'Heterodox Economics',
      parent: 'post-capitalism',
      html: '<p><em>Heterodox economics</em> is the collective name for schools of economic thought outside the neoclassical mainstream – including post-Keynesian, Marxian, institutional, ecological, feminist and complexity economics. They share a scepticism of equilibrium models and rational-actor assumptions, and an attention to power, history, uncertainty and the economy’s embedding in society and nature.</p>'
    },
    {
      id: 'moral-economy',
      title: 'Moral Economy',
      parent: 'post-capitalism',
      ref: 'Thompson; Scott',
      html: '<p>A <em>moral economy</em> is an economy governed by shared norms of fairness and obligation rather than by market prices alone. E. P. Thompson (1971) used the term for the customary expectations of eighteenth-century English crowds, and James C. Scott (1976) for the subsistence ethics of peasant societies. It reminds us that economies are always embedded in moral expectations.</p>'
    },
    {
      id: 'post-capitalist-peace-theory',
      title: 'Post-Capitalist Peace Theory',
      coined: true,
      parent: 'post-capitalism',
      html: '<p><em>Post-capitalist peace theory</em> considers how peace between societies could be secured once competition for growth and markets no longer drives their relations. Where the “capitalist peace” holds that trade and interdependence reduce war, a post-capitalist account asks what would sustain peace in a world no longer organised around economic rivalry.</p>'
    },
    {
      id: 'win-win',
      title: 'Win-Win',
      parent: 'post-capitalism',
      ref: 'Boeree',
      html: '<p><em>Win-win</em> refers to positive-sum dynamics in which all parties can benefit, as opposed to zero-sum games in which one side’s gain is another’s loss. Championed by Liv Boeree and others as a counter to <a href="#moloch">Moloch</a>, it emphasises finding and building the structures that allow cooperation to outcompete destructive rivalry.</p>'
    },
    {
      id: 'paretotopia',
      title: 'Paretotopia',
      parent: 'post-capitalism',
      ref: 'Drexler',
      html: '<p><em>Paretotopia</em> is Eric Drexler’s term for a future in which advanced technology creates such abundance that nearly everyone can be made better off at once – a Pareto improvement on a vast scale. Drexler argues that recognising this possibility could reduce the incentive for destructive competition over the transition to powerful AI, since the gains from cooperation would be so large.</p>'
    },
    {
      id: 'the-liberty-machine',
      title: 'The Liberty Machine',
      parent: 'coordination-and-governance',
      ref: 'Beer',
      html: '<p><em>The Liberty Machine</em> is Stafford Beer’s term (1970) for a cybernetic system of governance designed to maximise freedom by giving people and institutions the information and feedback they need to regulate themselves. Beer saw well-designed cybernetic coordination not as control from above, but as a means of preserving autonomy while achieving coherence.</p>'
    },
    {
      id: 'collective-intelligence',
      title: 'Collective Intelligence',
      parent: 'coordination-and-governance',
      html: '<p><em>Collective intelligence</em> is the capacity of groups to think, learn and solve problems together in ways that exceed their individual members. It can emerge in markets, science, open-source communities and deliberative institutions, and is increasingly amplified by digital tools. Designing for collective intelligence is central to any civilisation that hopes to govern problems too complex for individuals.</p>'
    },
    {
      id: 'social-choice-and-mechanism-design',
      title: 'Social Choice Theory & Mechanism Design',
      parent: 'coordination-and-governance',
      ref: 'Arrow; Hurwicz, Maskin, Myerson',
      html: '<p><em>Social choice theory</em> studies how individual preferences can be aggregated into collective decisions, and famously shows, through Kenneth Arrow’s impossibility theorem (1951), that no voting rule satisfies every desirable condition. <em>Mechanism design</em> works in reverse, designing rules and incentives so that self-interested behaviour produces desired collective outcomes.</p>'
    },
    {
      id: 'the-epistemic-commons',
      title: 'The Epistemic Commons',
      parent: 'coordination-and-governance',
      html: '<p>The <em>epistemic commons</em> is the shared infrastructure of knowledge on which a society depends – its trusted sources, institutions of inquiry, public discourse and common facts. Like any commons, it can be degraded by those who exploit it for private advantage. Protecting and rebuilding it is a precondition for collective <a href="#sensemaking">sensemaking</a> and self-government.</p>'
    },
    {
      id: 'open-society',
      title: 'Open Society',
      parent: 'coordination-and-governance',
      ref: 'Popper; Consilience Project',
      html: '<p>An <em>open society</em>, in Karl Popper’s <em>The Open Society and Its Enemies</em> (1945), is one in which institutions can be criticised and changed peacefully, and in which no authority claims final truth. Renewing it for the digital age means asking how open societies can remain resilient against disinformation and coordinate effectively while staying free.</p>'
    },
    {
      id: 'yellow-teaming',
      title: 'Yellow Teaming',
      parent: 'coordination-and-governance',
      ref: 'Consilience Project',
