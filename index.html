      html: '<p><em>Liberalism</em>, as a pillar of modernism, is the political philosophy of individual liberty, equal rights, limited government and the rule of law. It replaced inherited hierarchy with the consent of the governed, and remains the dominant framework of modern political order.</p>'
    },
    {
      id: 'individualism',
      title: 'Individualism',
      html: '<p><em>Individualism</em> is the view that the individual person, rather than the family, community or state, is the basic unit of moral and social life – the bearer of rights, choices and identity. It liberated people from inherited roles, and is also blamed for the isolation and fragmentation of modern societies.</p>'
    },
    {
      id: 'egalitarianism',
      title: 'Egalitarianism',
      html: '<p><em>Egalitarianism</em> is the principle that all people are of equal worth and should be treated as equals – in rights, in standing before the law and, in some versions, in opportunities or outcomes. It is one of modernity’s defining commitments, and a standard by which it has repeatedly been found wanting.</p>'
    },
    {
      id: 'pluralism',
      title: 'Pluralism',
      html: '<p><em>Pluralism</em> is the acceptance of a diversity of values, beliefs and ways of life within one society, and of institutions that let them coexist. Liberal pluralism holds that no single conception of the good should be imposed by the state.</p>'
    },
    {
      id: 'nationalism',
      title: 'Nationalism',
      html: '<p><em>Nationalism</em> is the principle that the nation – a people bound by shared language, history or identity – should govern itself in a state of its own. It became the organising principle of the modern political world, uniting peoples into democracies and also driving them into war.</p>'
    },
    {
      id: 'deconstruction',
      title: 'Deconstruction',
      html: '<p><em>Deconstruction</em> is Jacques Derrida’s method of reading texts to expose the hierarchies and oppositions on which their meaning depends – speech over writing, presence over absence, centre over margin – and to show how those oppositions undo themselves. It became a byword for postmodernism’s unsettling of fixed meanings.</p>'
    },
    {
      id: 'relativism',
      title: 'Relativism',
      html: '<p><em>Relativism</em> is the view that truth, knowledge or morality are relative to a culture, language or standpoint, so that there is no neutral position from which to judge between them. It encourages humility about one’s own assumptions, but at its extreme leaves no ground for saying anything is better or truer than anything else.</p>'
    },
    {
      id: 'social-constructivism',
      title: 'Social Constructivism',
      html: '<p><em>Social constructivism</em> is the view that much of what seems natural or given – categories, identities, institutions, even knowledge – is produced by social processes and could be otherwise. Associated with Peter Berger and Thomas Luckmann’s <em>The Social Construction of Reality</em> (1966), it opens social arrangements to question and change.</p>'
    },
    {
      id: 'identity-politics',
      title: 'Identity Politics',
      html: '<p><em>Identity politics</em> is political action organised around shared identities – of race, gender, sexuality, religion or ethnicity – and the injustices experienced by those who hold them. It brought into politics experiences that universal categories had overlooked, and is criticised for fragmenting solidarity into competing groups.</p>'
    },
    {
      id: 'cultural-metamodernism',
      title: 'Cultural Metamodernism',
      ref: 'Dempsey',
      refs: ['Brendan Graham Dempsey, <em>Metamodernism: Or, the Cultural Logic of Cultural Logics</em> (2023).'],
      html: '<p><em>Cultural metamodernism</em> is metamodernism understood as a new structure of feeling and cultural logic beyond postmodernism. Brendan Graham Dempsey’s <em>Metamodernism: Or, the Cultural Logic of Cultural Logics</em> (2023) surveys its strands and argues that, by turning critical self-reflection on itself, it transmutes irony into sincerity, deconstruction into reconstruction and relativity into directionality.</p>'
    },
    {
      id: 'political-metamodernism',
      title: 'Political Metamodernism',
      ref: 'Freinacht',
      refs: ['Hanzi Freinacht, <em>The Listening Society: A Metamodern Guide to Politics, Book One</em> (2017).', 'Hanzi Freinacht, <em>Nordic Ideology: A Metamodern Guide to Politics, Book Two</em> (2019).'],
      html: '<p><em>Political metamodernism</em> is the political philosophy set out by Hanzi Freinacht – the pen name of Daniel Görtz and Emil Ejner Friis – in <em>The Listening Society</em> (2017) and <em>Nordic Ideology</em> (2019). It proposes a politics aimed at the inner development of citizens as well as their material welfare, extending the Nordic welfare state into a “listening society” that attends to psychological and existential needs.</p>'
    },
    {
      id: 'technological-metamodernism',
      title: 'Technological Metamodernism',
      ref: 'Reid',
      html: '<p><em>Technological metamodernism</em> is Stephen Reid’s project for a metamodern approach to technology, beyond both techno-scepticism and the techno-optimism of accelerationists and longtermists. Drawing on Ivan Illich, E. F. Schumacher and Murray Bookchin, and on contemporary work on decentralised technology, augmented deliberation and cosmo-localism, it asks how technology can serve human and ecological flourishing and inner development.</p>'
    },
    {
      id: 'oscillation',
      title: 'Oscillation',
      refs: ['Timotheus Vermeulen and Robin van den Akker, “Notes on Metamodernism”, <em>Journal of Aesthetics &amp; Culture</em> 2 (2010).'],
      html: '<p><em>Oscillation</em> is the movement between opposites that Timotheus Vermeulen and Robin van den Akker, in “Notes on Metamodernism” (2010), took to define the metamodern sensibility: a swinging between modern enthusiasm and postmodern irony, hope and doubt, sincerity and detachment, without settling in either.</p>'
    },
    {
      id: 'informed-naivety',
      title: 'Informed Naivety',
      html: '<p><em>Informed naivety</em> is the metamodern stance of committing sincerely to hopes and ideals while fully aware of the postmodern critiques that make them seem naive. It chooses to act as if meaning and progress were possible – not from ignorance, but having seen through the reasons for cynicism.</p>'
    },
    {

      refs: ['Roy Bhaskar, <em>A Realist Theory of Science</em> (1975).'],
      html: '<p><em>Critical realism</em> is the philosophy of science developed by Roy Bhaskar, which holds that a real world exists independently of our knowledge of it, while our knowledge of it is always fallible and socially produced. It offers a path between naive realism and postmodern relativism, and is often adopted as the epistemology of metamodernism.</p>'
    },
    {
      id: 'reconstructive-synthesis',
      title: 'Reconstructive Synthesis',
      html: '<p><em>Reconstructive synthesis</em> is the metamodern move of building again after deconstruction: integrating the insights of premodern, modern and postmodern perspectives into new, provisional frameworks – new narratives, systems and ways of organising life – rather than only criticising the old. In Hanzi Freinacht’s phrase, after deconstruction must follow reconstruction.</p>'
    },
    {
      id: 'neo-romanticism',
      title: 'Neo-Romanticism',
      html: '<p><em>Neo-romanticism</em> is the revival of the Romantic movement’s concerns – feeling, imagination, nature, the sacred and the sublime – as a counterweight to the rationalism of modernity and the irony of postmodernity. In metamodern culture it appears as a renewed earnestness about beauty, wonder and depth.</p>'
    },
    {
      id: 'post-secularism',
      title: 'Post-Secularism',
      ref: 'Habermas',
      html: '<p><em>Post-secularism</em> describes a condition in which religion persists and regains public significance in societies once expected to become wholly secular. Jürgen Habermas used the term to call for mutual learning between secular and religious citizens; in metamodern thought it signals a renewed openness to spirituality and transcendence without a return to premodern authority.</p>'

    {

      html: '<p><em>Appropriate technology</em> is technology suited to the scale, resources and needs of the communities that use it – small, affordable, locally controllable and environmentally sound. The idea was popularised by E. F. Schumacher’s <em>Small Is Beautiful</em> (1973) and his concept of “intermediate technology”.</p>'
    },
    {
      id: 'meta-frames',
      title: 'Meta-frames',
      html: '<p><em>Meta-frames</em> are the frames within which frames are made: the overarching narratives, the accounts of what is ultimately real and the ways of reasoning that together shape how a culture understands the world. Each cultural paradigm – premodern, modern, postmodern, metamodern – is defined by its meta-frames, and changing paradigms means changing them.</p>'
    },
    {
      id: 'cultural-paradigm',
      title: 'Cultural Paradigm',
      ref: 'Pollock',
      html: '<p>A <em>cultural paradigm</em> is the deep set of assumptions – about reality, knowledge, value and the self – that a culture shares and seldom questions, shaping its institutions, technologies and ways of life. Rufus Pollock and the Second Renaissance project argue that the crises of the present are rooted in the modern cultural paradigm, and that a new one is needed. See <a href="#modernist-cultural-paradigm">the modernist cultural paradigm</a>.</p>'

    {
      id: 'stadial-theories-of-history',
      title: 'Stadial Theories of History',
      html: '<p><em>Stadial theories of history</em> divide human history into a sequence of stages through which societies pass. The Scottish Enlightenment’s four-stage theory – hunting, pasturage, agriculture, commerce – set out by Adam Smith and others, was followed by Auguste Comte’s three stages of thought and Marx’s succession of modes of production. The sequence from primitivism to metamodernism is a stadial theory of cultural paradigms.</p>'
    },
    {
      id: 'historical-dialectic',
      title: 'Historical Dialectic',
      html: '<p>The <em>historical dialectic</em> is the idea, from Hegel and Marx, that history develops through the conflict of opposing forces – each stage generating the contradictions that drive it into the next, which preserves and transcends what came before. Metamodernism is often presented dialectically, as a synthesis of modernism and its postmodern antithesis. See <a href="#dialectics">dialectics</a>.</p>'
    },
    {
      id: 'utok',
      title: 'Unified Theory of Knowledge (UTOK)',
      ref: 'Henriques',
      refs: ['Gregg Henriques, <em>A New Unified Theory of Psychology</em> (2011).', 'Gregg Henriques, <em>A New Synthesis for Solving the Problem of Psychology</em> (2022).'],
      html: '<p>The <em>Unified Theory of Knowledge</em> (UTOK) is Gregg Henriques’s metatheory for integrating the sciences and the humanities. It maps reality as four planes of existence – Matter, Life, Mind and Culture – each emerging from the one below, and links them through a set of models of behaviour and justification, so that psychology in particular can find its place between biology and the social sciences.</p>'
    },
    {
      id: 'cosmoerotic-humanism',
      title: 'CosmoErotic Humanism',
      ref: 'Temple',
      refs: ['David J. Temple, <em>First Principles and First Values: Forty-Two Propositions on CosmoErotic Humanism, the Meta-Crisis, and the World to Come</em> (2024).'],
      html: '<p><em>CosmoErotic Humanism</em> is the metatheory developed by David J. Temple – the joint pseudonym of Marc Gafni, Zachary Stein and Ken Wilber, among others. It proposes a new shared story of value: that reality is animated throughout by “Eros”, an evolving impulse towards connection and intimacy, and that a recognition of intrinsic value at every level of the cosmos is the foundation needed to respond to the metacrisis. See <a href="#collective-psychological-alienation">collective psychological alienation</a>.</p>'
    },
    {
      id: 'cybernetics-and-systems-theory',
      title: 'Cybernetics & Systems Theory',
      html: '<p><em>Cybernetics and systems theory</em> together form a metatheory of organisation: an account of how wholes arise from interacting parts, regulate themselves through feedback and adapt to their environments, whatever they are made of. Applied across physics, biology, minds and societies, they offer a common language for the structure of complex systems. See <a href="#cybernetics">cybernetics</a> and <a href="#systems-theory">systems theory</a>.</p>'
    },
    {
      id: 'complex-thought',
      title: 'Complex Thought',
      ref: 'Morin',
      refs: ['Edgar Morin, <em>La Méthode</em>, 6 vols. (1977–2004).', 'Edgar Morin, <em>On Complexity</em> (2008).'],
      html: '<p><em>Complex thought</em> is Edgar Morin’s metatheory, developed across the six volumes of <em>La Méthode</em> (1977–2004). Against a “paradigm of simplification” that separates and reduces, it seeks to think in terms of relations, contexts and wholes – holding together order and disorder, the part and the whole, the observer and the observed.</p>'
    },
    {
      id: 'archtheory',
      title: 'Archtheory',
      html: '<p><em>Archtheory</em> is theory one level above metatheory: an account of how different unifying metatheories fit together. The term comes from work on “archdisciplinarity”, which looks for the patterns – “arches” – that recur across integrative frameworks such as integral theory, critical realism and complex thought, and uses them as the basis on which those frameworks can be joined.</p>'
    },
    {
      id: 'complex-integral-realism',
      title: 'Complex Integral Realism',
      ref: 'Marshall',
      refs: ['Paul Marshall, <em>A Complex Integral Realist Perspective: Towards a New Axial Vision</em> (2016).'],
      html: '<p><em>Complex integral realism</em> is Paul Marshall’s integration of three integrative metatheories – Edgar Morin’s complex thought, Ken Wilber’s integral theory and Roy Bhaskar’s critical realism – into a single perspective, built from what they share and correcting each with the others.</p>'
    },
    {
      id: 'ontological-stratification',
      title: 'Ontological Stratification',
      html: '<p><em>Ontological stratification</em> is the view that reality is layered: physical, chemical, biological, psychological and social levels, each emerging from those below and having powers of its own that cannot be reduced to them. Central to Roy Bhaskar’s critical realism, it allows each science its own domain while placing them all in one world.</p>'
    },
    {
      id: 'transcend-and-include',
      title: 'Transcend and Include',
      ref: 'Wilber',
      refs: ['Ken Wilber, <em>Sex, Ecology, Spirituality: The Spirit of Evolution</em> (1995).'],
      html: '<p><em>Transcend and include</em> is Ken Wilber’s formula for development: each new stage goes beyond the one before while keeping it as a part of itself, as molecules include atoms and cells include molecules. Applied to cultures, it holds that a later worldview should integrate the truths of earlier ones rather than discard them.</p>'
    },
    {
      id: 'multi-perspectivalism',
      title: 'Multi-Perspectivalism',
      html: '<p><em>Multi-perspectivalism</em> is the principle that any phenomenon can be seen truly from many perspectives – first-person, second-person and third-person, individual and collective, inside and outside – and that each reveals something the others miss. Metatheories such as integral theory make it a method: to understand something fully, look at it from all of them.</p>'
    },
    {
      id: 'big-history',
      title: 'Big History',
      ref: 'Christian',
      refs: ['David Christian, <em>Maps of Time: An Introduction to Big History</em> (2004).'],
      html: '<p><em>Big History</em> is the study of history on the largest scale, from the Big Bang to the present, as a single story of increasing complexity. Developed by David Christian, it places human history within cosmic, geological and biological history, organised around “thresholds” at which new kinds of complexity emerged.</p>'
    },
    {

      title: 'Cliodynamics',
      ref: 'Turchin',

      html: '<p><em>Cliodynamics</em> is the mathematical study of history, founded by Peter Turchin: it treats history as a science, building dynamic models of how populations, states and societies change, and testing them against large historical databases. It has identified recurring “secular cycles” of integration and disintegration in agrarian states.</p>'
    },
    {

      html: '<p><em>Structural-demographic theory</em>, developed by Jack Goldstone and extended by Peter Turchin, explains political instability through the interaction of population, elites and the state. Population growth depresses wages, the number of elites outgrows the positions available to them, and state finances weaken – together producing waves of unrest, revolution and civil war.</p>'
    },
    {

      html: '<p><em>World-systems analysis</em> is Immanuel Wallerstein’s approach to history, which takes as its unit not the nation-state but the world-system: the capitalist world-economy that emerged in the sixteenth century, divided into a core, a semi-periphery and a periphery between which surplus flows. Development and underdevelopment are two sides of one system.</p>'
    },
    {

      html: '<p><em>Memetics</em> is the study of culture as the evolution of memes – units of cultural information that replicate from mind to mind, a term coined by Richard Dawkins in <em>The Selfish Gene</em> (1976). Developed by Susan Blackmore and others, it treats ideas as replicators with interests of their own. See <a href="#memes-as-replicators">memes as replicators</a>.</p>'
    },
    {

      refs: ['G. W. F. Hegel, <em>Lectures on the Philosophy of History</em> (1837).'],
      html: '<p><em>Idealism</em>, as a theory of history, holds that history is driven by ideas – for Hegel, by the self-unfolding of Spirit (<em>Geist</em>) towards consciousness of its own freedom. Each age expresses a stage in that development, and its conflicts drive the movement to the next.</p>'

    {

      html: '<p><em>Historical materialism</em> is Marx’s theory of history, which inverts Hegel’s idealism: history is driven not by ideas but by the material conditions of production. Each mode of production – ancient, feudal, capitalist – rests on a particular economic base, generates class struggle, and gives way to the next when its relations of production fetter the forces of production.</p>'
    },
    {

      ref: 'Adorno',
      refs: ['Theodor W. Adorno, <em>Negative Dialectics</em> (1966).'],
      html: '<p><em>Negative Dialectics</em> (1966) is Theodor Adorno’s critique of the dialectical tradition: dialectics without the reconciling synthesis, refusing to see history as a progress towards a final unity. After Auschwitz, Adorno argued, no philosophy of history could claim that reason was being realised in the world.</p>'
    },
    {

      title: 'Great Man Theory',
      ref: 'Carlyle',
      refs: ['Thomas Carlyle, <em>On Heroes, Hero-Worship, and the Heroic in History</em> (1841).'],
      html: '<p>The <em>great man</em> theory of history, associated with Thomas Carlyle, holds that history is shaped decisively by exceptional individuals – heroes, statesmen, prophets – whose will and genius change its course. It has been criticised since Herbert Spencer for ignoring the social conditions that make such individuals possible.</p>'
    },
    {

      title: 'Great Founder Theory',
      ref: 'Burja',
      refs: ['Samo Burja, <em>Great Founder Theory</em> (2020).'],
      html: '<p><em>Great founder</em> theory is Samo Burja’s account of how civilisations are made: functional institutions are built by rare founders who create new social technology, and decay as the knowledge needed to run them is lost. Societies live on the institutions their founders left, and depend on the occasional emergence of new ones.</p>'
    },
    {

      refs: ['Peter Turchin, <em>End Times: Elites, Counter-Elites, and the Path of Political Disintegration</em> (2023).'],
      html: '<p><em>Elite overproduction</em> is Peter Turchin’s term for a society producing more aspirants to elite status than there are elite positions. The surplus of frustrated would-be elites competes ever more fiercely, forms counter-elites and mobilises popular discontent – one of the main drivers of instability in structural-demographic theory.</p>'
    },
    {

      html: '<p><em>Diminishing returns on complexity</em> is Joseph Tainter’s explanation of collapse. Societies solve problems by adding complexity – institutions, specialists, controls – which costs energy and resources; at first the returns are high, but they fall until further complexity costs more than it yields, and collapse becomes the cheaper option.</p>'
    },
    {

      html: '<p><em>Ecological overshoot</em> is the condition of a population consuming resources faster than its environment can renew them. <em>The Limits to Growth</em> (1972), commissioned by the Club of Rome, modelled overshoot and collapse for the world economy; Jared Diamond’s <em>Collapse</em> (2005) traced how past societies destroyed the environments they depended on.</p>'
    },
    {

      title: 'Life-Cycle',
      ref: 'Spengler',
      refs: ['Oswald Spengler, <em>The Decline of the West</em>, 2 vols. (1918–22).'],
      html: '<p>The <em>life-cycle</em> theory of civilisation, set out by Oswald Spengler in <em>The Decline of the West</em> (1918–22), holds that every high culture passes through the stages of an organism – birth, growth, maturity and decline – ending as a rigid “civilisation” that has exhausted its creative force. Spengler saw the West entering its final phase.</p>'
    },
    {
      id: 'collapsology',
      title: 'Collapsology',
      ref: 'Servigne & Stevens',
      refs: ['Pablo Servigne and Raphaël Stevens, <em>Comment tout peut s’effondrer</em> (2015).'],
      html: '<p><em>Collapsology</em> is the interdisciplinary study of the possible collapse of industrial civilisation, a term popularised by Pablo Servigne and Raphaël Stevens in <em>Comment tout peut s’effondrer</em> (2015). It draws together evidence from ecology, energy, finance and the study of past collapses to ask how, and how soon, the present system might break down, and how to live through it.</p>'
    },
    {
      id: 'applied-collapsology',
      title: 'Applied Collapsology',
      ref: 'Hames',
      html: '<p><em>Applied collapsology</em> is Richard Hames’s name for the dark tradition of deliberate collapse: the destruction of societies through colonisation, war and genocide, used as a means of rule, which helped create the present world. Ordinary collapsology, he argues, is blind to it because it treats collapse as something that happens to societies rather than something done to them.</p>'
    },
    {
      id: 'geological-epochs',
      title: 'Geological Epochs',
      html: '<p><em>Geological epochs</em> are divisions of Earth’s history defined by changes recorded in rock. The proposal that humanity has ushered in a new epoch, the Anthropocene, has made the naming of the present a question of history and politics – who or what is responsible for the changes, and since when.</p>'
    },
    {
      id: 'the-deep-anthropocene',
      title: 'The Deep Anthropocene',
      html: '<p><em>The Deep Anthropocene</em> extends the study of human impacts on the Earth system far back before industrialisation – through the spread of farming, deforestation, extinctions and fire across thousands of years. It shows a long history of human–environment systems, some marked by degradation and collapse and others by resilience and co-adaptation.</p>'
    },
    {
      id: 'twenty-first-century-civilisational-hypothesis',
      title: '21st Century Civilisational Hypothesis',
      html: '<p>A <em>21st-century civilisational hypothesis</em> is a large claim about the shape world history will take after the Cold War. The two most influential – Francis Fukuyama’s end of history and Samuel Huntington’s clash of civilisations – offered opposing answers: convergence on liberal democracy, or conflict along the fault lines between civilisations.</p>'
    },
    {
      id: 'structural-functionalism',
      title: 'Structural Functionalism',
      ref: 'Parsons',
      html: '<p><em>Structural functionalism</em> is the sociological approach, dominant in the mid-twentieth century and led by Talcott Parsons, that views society as a system of interdependent parts, each serving a function that maintains the stability of the whole. It explains institutions by what they do for society, and was criticised for neglecting conflict and change.</p>'
    },
    {
      id: 'functional-prerequisites',
      title: 'Functional Prerequisites',
      ref: 'Parsons',
      refs: ['Talcott Parsons, <em>The Social System</em> (1951).'],
      html: '<p><em>Functional prerequisites</em> are the needs any society must meet to survive. Talcott Parsons organised them in his AGIL scheme: adaptation to the environment (the economy), goal attainment (the polity), integration of its members (law and community) and latency, or the maintenance of shared values (family, education, religion).</p>'
    },
    {
      id: 'conflict-theory',
      title: 'Conflict Theory',
      html: '<p><em>Conflict theory</em> views society not as a harmonious system but as an arena of struggle between groups over scarce resources, power and status. Social order, on this view, is maintained by domination as much as consent, and change comes from conflict. Its roots are in Marx and Weber.</p>'
    },
    {
      id: 'marxism',
      title: 'Marxism',
      html: '<p><em>Marxism</em> is the body of thought founded by Karl Marx and Friedrich Engels: an analysis of capitalism as a system of class exploitation, a theory of history driven by material production and class struggle, and a political programme for its overthrow. In sociology it is the founding form of conflict theory. See <a href="#historical-materialism">historical materialism</a>.</p>'
    },
    {
      id: 'social-ontology',
      title: 'Social Ontology',
      html: '<p><em>Social ontology</em> asks what society is: what kind of thing a social whole is, how it relates to the individuals within it, and what it means for social facts to exist. Different answers have been framed through governing metaphors – society as an organism, as a machine, or as a cybernetic hybrid of both.</p>'
    },
    {
      id: 'organicism',
      title: 'Organicism: Society as Organism',
      html: '<p><em>Organicism</em> treats society as a living organism: a whole whose parts, like organs, serve the life of the body, which grows, matures and may sicken or die. The metaphor runs from Plato through Herbert Spencer and Émile Durkheim to structural functionalism, and emphasises interdependence, health and natural development.</p>'
    },
    {
      id: 'mechanism-society-as-machine',
      title: 'Mechanism: Society as Machine',
      html: '<p><em>Mechanism</em> treats society as a machine: an artifice of parts, designed and assembled, which can be engineered, repaired and improved. The metaphor, rooted in Hobbes’s <em>Leviathan</em> and the scientific revolution, underlies modern social engineering and the bureaucratic state.</p>'
    },
    {
      id: 'cyberneticism',
      title: 'Cyberneticism: Society as Cyborg',
      html: '<p><em>Cyberneticism</em> treats society as a cyborg – a cybernetic hybrid of the organic and the technical, regulating itself through feedback, information and machines as much as through people. It overcomes the opposition of organism and machine by seeing both as self-organising systems, and describes societies increasingly steered by computation.</p>'
    },
    {
      id: 'structure-and-agency',
      title: 'Structure & Agency',
      html: '<p><em>Structure and agency</em> is the central problem of social theory: how far people’s actions are determined by the social structures around them – class, institutions, norms – and how far they are free to act and to change those structures. Theories differ in which they emphasise and how they connect the two.</p>'
    },
    {

      title: 'Structuration Theory',
      ref: 'Giddens',
      refs: ['Anthony Giddens, <em>The Constitution of Society</em> (1984).'],
      html: '<p><em>Structuration theory</em> is Anthony Giddens’s resolution of the structure–agency problem: structures are both the medium and the outcome of action, enabling and constraining what people do while existing only as they are reproduced by people doing it. He called this the duality of structure.</p>'
    },
    {

      title: 'Morphogenetic Approach',
      ref: 'Archer',
      refs: ['Margaret S. Archer, <em>Realist Social Theory: The Morphogenetic Approach</em> (1995).'],
      html: '<p>The <em>morphogenetic approach</em> is Margaret Archer’s alternative to structuration theory. Drawing on critical realism, it keeps structure and agency analytically distinct and traces them through time: pre-existing structures condition action, action produces structural change or reproduction, and the result conditions the next cycle.</p>'
    },
    {

      ref: 'Marx',
      html: '<p><em>Base and superstructure</em> is Marx’s model of society: the economic base – the forces and relations of production – shapes the superstructure of law, politics, religion and culture, which in turn legitimates and maintains the base. Later Marxists debated how strictly the base determines the superstructure, and gave culture increasing independence.</p>'

      html: '<p>The <em>dominant ideology</em> thesis holds, in Marx and Engels’s words, that “the ideas of the ruling class are in every epoch the ruling ideas”: the class that owns the means of material production also controls the means of mental production, so that its interests appear as everyone’s.</p>'

    {

      html: '<p><em>Ideological state apparatuses</em> are Louis Althusser’s name for the institutions – schools, churches, families, media – that reproduce the conditions of capitalist production by forming people’s beliefs and identities, alongside the repressive apparatus of police and courts. Through them ideology “interpellates” individuals as subjects.</p>'

    {

      html: '<p>The <em>culture industry</em> is Max Horkheimer and Theodor Adorno’s term, from <em>Dialectic of Enlightenment</em> (1944), for the mass production of culture as standardised commodities – film, radio, popular music – which, they argued, pacifies audiences and binds them to the existing order while seeming to entertain them.</p>'
    },
    {

      ref: 'Marcuse',

      html: '<p><em>One-Dimensional Man</em> (1964) is Herbert Marcuse’s critique of advanced industrial society, which he argued absorbs opposition by satisfying “false needs” through consumption and technology, flattening thought into a single dimension in which alternatives to the existing order can no longer be imagined.</p>'
    },
    {
      id: 'progress-and-externalities',
      title: 'Progress & Externalities',
      html: '<p><em>Progress and externalities</em> names the macrosociological question of who gains from development and who bears its costs. Theories of development disagree on whether progress spreads outward from advanced societies to the rest, or whether the advance of some is paid for by the underdevelopment of others.</p>'
    },
    {

      html: '<p><em>Dependency theory</em>, developed by Raúl Prebisch, André Gunder Frank and others from the 1950s, argues that poor countries are poor not because they are behind but because of their place in the world economy: resources flow from a dependent periphery to a wealthy core, producing what Frank called “the development of underdevelopment”.</p>'
    },
    {

      refs: ['W. W. Rostow, <em>The Stages of Economic Growth: A Non-Communist Manifesto</em> (1960).'],
      html: '<p><em>Modernisation theory</em> holds that societies develop along a common path from traditional to modern, through industrialisation, urbanisation and the spread of education, markets and democracy. W. W. Rostow’s <em>The Stages of Economic Growth</em> (1960) gave it its best-known form; dependency theorists criticised it for ignoring the global inequalities that shape development.</p>'
    },
    {
      id: 'macrosecuritisation',
      title: 'Macrosecuritisation & Existential Security',
      ref: 'Sears',
      refs: ['Nathan Alexander Sears, “Existential Security: Towards a Security Framework for the Survival of Humanity”, <em>Global Policy</em> 11, no. 2 (2020).'],
      html: '<p><em>Macrosecuritisation</em> is the framing of a threat to humanity as a whole – nuclear war, climate change, dangerous AI – as an issue of security that demands extraordinary collective action, beyond the ordinary security of states. Nathan Alexander Sears argues that great powers have repeatedly failed to macrosecuritise such threats because rivalry among them takes priority. <em>Existential security</em> is the condition the framing aims at: a world in which humanity’s survival is no longer at serious risk.</p>'
    },
    {
      id: 'global-priorities-research',
      title: 'Global Priorities Research',
      html: '<p><em>Global priorities research</em> asks which problems most deserve humanity’s limited resources and attention, combining economics, philosophy and decision theory to compare causes on a common scale. It has been developed above all at the Global Priorities Institute in Oxford, founded in 2018.</p>'
    },
    {
      id: 'trajectory-change',

      ref: 'Beckstead',
      refs: ['Nick Beckstead, <em>On the Overwhelming Importance of Shaping the Far Future</em> (PhD thesis, Rutgers, 2013).'],
      html: '<p>A <em>trajectory change</em> is a change that alters the long-run path of civilisation, not just its present state – so that its effects persist and compound over the whole future. Nick Beckstead argued that because the future could be so long, even small lasting changes to its trajectory may matter more than large temporary benefits.</p>'
    },
    {
      id: 'state-vs-transition-risk',
      title: 'State vs Transition Risk',
      ref: 'Ord',
      refs: ['Toby Ord, <em>The Precipice: Existential Risk and the Future of Humanity</em> (2020).'],
      html: '<p><em>State risk</em> is risk that accrues for as long as a civilisation remains in a vulnerable condition, like the ongoing chance of nuclear war each year; <em>transition risk</em> is the risk incurred once, in passing through a dangerous transition, such as the arrival of transformative AI. Toby Ord uses the distinction to compare strategies: lingering in a vulnerable state can be riskier than moving quickly through a transition, and vice versa.</p>'
    },
    {
      id: 'future-of-humanity',
      title: 'The Future of Humanity',
      ref: 'Bostrom',
      refs: ['Nick Bostrom, “The Future of Humanity”, in <em>New Waves in Philosophy of Technology</em> (2009).'],
      html: '<p><em>The Future of Humanity</em> (2009) is Nick Bostrom’s essay setting out four broad classes of long-run scenario for humanity: <a href="#extinction">extinction</a>, <a href="#recurrent-collapse">recurrent collapse</a>, a <a href="#plateau">plateau</a> at roughly the present level of development, and <a href="#posthumanity">posthumanity</a>. Mapping these possibilities, he argued, is the first step in thinking about which to steer towards.</p>'
    },
    {

      refs: ['Nick Bostrom, “The Future of Humanity”, in <em>New Waves in Philosophy of Technology</em> (2009).'],
      html: '<p><em>Extinction</em>, in Bostrom’s scheme, is the scenario in which humanity dies out – whether through its own technologies, natural catastrophe or some unforeseen cause – ending all of its future potential.</p>'

      title: 'Recurrent Collapse',
      refs: ['Nick Bostrom, “The Future of Humanity”, in <em>New Waves in Philosophy of Technology</em> (2009).'],
      html: '<p><em>Recurrent collapse</em> is the scenario in which civilisation repeatedly rises and falls, never reaching a state of lasting maturity – each collapse undoing the progress made since the last.</p>'
    },
    {
      id: 'plateau',
      title: 'Plateau',
      refs: ['Nick Bostrom, “The Future of Humanity”, in <em>New Waves in Philosophy of Technology</em> (2009).'],
      html: '<p><em>Plateau</em> is the scenario in which civilisation stabilises at roughly its present level of technology and development and remains there for a very long time, neither collapsing nor transforming.</p>'
    },
    {
      id: 'posthumanity',
      title: 'Posthumanity',
      refs: ['Nick Bostrom, “The Future of Humanity”, in <em>New Waves in Philosophy of Technology</em> (2009).'],
      html: '<p><em>Posthumanity</em> is the scenario in which humanity, through technology, becomes something radically different – beings with capacities far beyond those of present humans, in a civilisation transformed accordingly. See <a href="#post-humanism">posthumanism</a>.</p>'
    },
    {
      id: 'differential-progress',
      title: 'Differential Progress',
      html: '<p><em>Differential progress</em> is the strategy of changing not how fast progress happens overall but the order in which things are developed: advancing protective capabilities, wisdom and coordination ahead of dangerous ones, so that civilisation is ready for risks before they arrive.</p>'
    },
    {
      id: 'differential-technological-development',
      title: 'Differential Technological Development',
      ref: 'Bostrom',
      refs: ['Nick Bostrom, “Existential Risks: Analyzing Human Extinction Scenarios and Related Hazards”, <em>Journal of Evolution and Technology</em> 9 (2002).'],
      html: '<p><em>Differential technological development</em> is Nick Bostrom’s principle (2002) of retarding dangerous and harmful technologies while accelerating beneficial ones – especially those that reduce the risks posed by others, such as defences against engineered pathogens before the pathogens themselves.</p>'
    },
    {
      id: 'differential-intellectual-progress',
      title: 'Differential Intellectual Progress',
      html: '<p><em>Differential intellectual progress</em> extends differential development from technology to ideas: prioritising progress in philosophy, ethics, strategy and safety research over raw capability, so that understanding of how to use power keeps ahead of the power itself.</p>'
    },
    {
      id: 'pacing-problem',
      title: 'Pacing Problem',
      ref: 'Marchant',
      html: '<p>The <em>pacing problem</em> is the growing gap between the speed of technological change and the slower pace at which law, regulation and ethical oversight can adapt to it. Named by Gary Marchant, it means that governance is always catching up with technologies already in use.</p>'
    },
    {
      id: 'urn-of-invention',
      title: 'The Urn of Invention',
      ref: 'Bostrom',
      refs: ['Nick Bostrom, “The Vulnerable World Hypothesis”, <em>Global Policy</em> 10, no. 4 (2019).'],
      html: '<p><em>The urn of invention</em> is Nick Bostrom’s image for technological discovery: humanity draws balls from an urn, most white (beneficial) or grey (mixed), but some may be black – technologies that by default destroy the civilisation that invents them. We have no way to put a ball back once drawn, and have so far been lucky not to draw a black one.</p>'
    },
    {
      id: 'high-tech-panopticon',
      title: 'High-Tech Panopticon & Turn-Key Totalitarianism',
      ref: 'Bostrom',
      refs: ['Nick Bostrom, “The Vulnerable World Hypothesis”, <em>Global Policy</em> 10, no. 4 (2019).'],
      html: '<p>The <em>high-tech panopticon</em> is the form of ubiquitous, AI-assisted surveillance that Nick Bostrom suggests a vulnerable world might need to stop individuals from using black-ball technologies. Its danger is <em>turn-key totalitarianism</em>: once such a system exists, it could be turned to oppression by whoever controls it.</p>'
    },
    {
      id: 'strong-vs-weak-longtermism',
      title: 'Strong vs. Weak Longtermism',
      refs: ['Hilary Greaves and William MacAskill, “The Case for Strong Longtermism” (Global Priorities Institute working paper, 2021).'],
      html: '<p><em>Weak longtermism</em> holds that positively influencing the long-term future is a key moral priority; <em>strong longtermism</em> holds that it is the most important feature of our actions today, so that the best actions are those with the best effects on the far future. Hilary Greaves and William MacAskill have defended the strong version.</p>'
    },
    {
      id: 'cosmic-endowment',
      title: 'The Long-term Future, Lightcone & Cosmic Endowment',
      ref: 'Bostrom',
      refs: ['Nick Bostrom, <em>Superintelligence: Paths, Dangers, Strategies</em> (2014).'],
      html: '<p>The <em>cosmic endowment</em> is Nick Bostrom’s term for the resources – stars, galaxies, matter and energy – that an Earth-originating civilisation could in principle reach and use: everything within its future <em>lightcone</em>, the region of space it could reach travelling at up to the speed of light. Its scale is what makes the long-term future, on longtermist views, so important.</p>'
    },
    {
      id: 'grand-futures',
      title: 'Grand Futures',
      ref: 'Sandberg',
      html: '<p><em>Grand futures</em> are the largest futures physics allows a civilisation: expansion across galaxies, the use of stars and black holes for energy and computation, and survival over cosmic timescales. Anders Sandberg has surveyed their limits in his long-running Grand Futures project.</p>'
    },
    {
      id: 'astronomical-waste',
      title: 'Astronomical Waste',
      ref: 'Bostrom',
      refs: ['Nick Bostrom, “Astronomical Waste: The Opportunity Cost of Delayed Technological Development”, <em>Utilitas</em> 15, no. 3 (2003).'],
      html: '<p><em>Astronomical waste</em> is Nick Bostrom’s argument (2003) that every moment colonisation of the universe is delayed, vast resources that could support valuable lives are lost forever – yet that reducing existential risk matters far more than speeding up, since extinction would waste the whole endowment.</p>'
    },
    {
      id: 'population-ethics',
      title: 'Population Ethics',
      ref: 'Parfit',
      refs: ['Derek Parfit, <em>Reasons and Persons</em> (1984).'],
      html: '<p><em>Population ethics</em> is the branch of ethics concerned with decisions that affect who and how many people will exist. Its puzzles, set out by Derek Parfit in <em>Reasons and Persons</em> (1984), include the “repugnant conclusion” – and its answers determine how much weight the possibility of future lives should carry.</p>'
    },
    {
      id: 'total-view',
      title: 'Total View',
      html: '<p>The <em>total view</em> holds that one outcome is better than another if it contains a greater total of wellbeing, counting everyone who would exist. On this view, bringing additional happy people into existence makes the world better, so the loss of all future generations through extinction would be an enormous harm.</p>'
    },
    {
      id: 'person-affecting-view',
      title: 'Person-Affecting View',
      html: '<p>The <em>person-affecting view</em> holds that an outcome can only be better or worse if it is better or worse for someone. On this view there is no obligation to create happy people who would not otherwise exist, and the weight of the far future is much reduced.</p>'
    },
    {
      id: 'survival-vs-flourishing',
      title: 'Survival vs Flourishing',
      html: '<p><em>Survival versus flourishing</em> distinguishes two ways of improving the long-term future: ensuring that civilisation survives at all, and improving how good its future is if it does. William MacAskill and others have argued that work on flourishing may be as important as, or more neglected than, work on survival.</p>'
    },
    {
      id: 'moral-uncertainty',
      title: 'Moral Uncertainty',
      refs: ['William MacAskill, Krister Bykvist and Toby Ord, <em>Moral Uncertainty</em> (2020).'],
      html: '<p><em>Moral uncertainty</em> is uncertainty about which moral views are correct. Since we cannot be sure which ethical theory is right, philosophers such as William MacAskill, Toby Ord and Krister Bykvist argue that we should act in ways that do reasonably well across the theories we find plausible, weighted by our confidence in them.</p>'
    },
    {
      id: 'option-value',
      title: 'Option Value',
      html: '<p><em>Option value</em> is the value of keeping options open. Under deep uncertainty about what is best, actions that preserve future choices – above all, avoiding irreversible catastrophes and lock-in – are valuable because they let wiser future people decide.</p>'
    },
    {
      id: 'the-long-reflection',
      title: 'The Long Reflection',
      refs: ['Toby Ord, <em>The Precipice: Existential Risk and the Future of Humanity</em> (2020).'],
      html: '<p><em>The long reflection</em> is a proposed period, after humanity has reached existential security, of careful collective deliberation about what it ultimately values and wants its future to be – before committing to any irreversible course. The idea is set out by Toby Ord and William MacAskill.</p>'
    },
    {
      id: 'space-governance',
      title: 'Space Governance',
      html: '<p><em>Space governance</em> is the question of how activity beyond Earth – and eventually the settlement of other worlds and star systems – should be governed. Decisions made early about property, expansion and security in space could shape the distribution of power and value across the whole future of civilisation.</p>'
    },
    {
      id: 'observable-and-accessible-universe',
      title: 'Observable & Accessible Universe',
      html: '<p>The <em>observable universe</em> is the region from which light has reached us since the Big Bang; the <em>accessible universe</em> is the smaller region a civilisation could ever reach, given the speed of light and the accelerating expansion of space. Galaxies beyond it are receding too fast ever to be reached, so the accessible universe shrinks over time.</p>'
    },
    {
      id: 'space-colonisation',
      title: 'Space Colonisation',
      html: '<p><em>Space colonisation</em> is the establishment of permanent human or post-human settlements beyond Earth – on the Moon, Mars and eventually other star systems. It could protect against some catastrophes and vastly expand civilisation, but raises questions of who expands, on what terms and with what values.</p>'
    },
    {
      id: 'grabby-aliens',
      title: 'Grabby Aliens',
      ref: 'Hanson',
      refs: ['Robin Hanson, Daniel Martin, Calvin McCarter and Jonathan Paulson, “If Loud Aliens Explain Human Earliness, Quiet Aliens Are Also Rare”, <em>The Astrophysical Journal</em> 922, no. 2 (2021).'],
      html: '<p><em>Grabby aliens</em> is the model, proposed by Robin Hanson and colleagues (2021), of civilisations that expand rapidly and visibly through the universe, changing what they touch. It explains why humanity appears early in cosmic history – grabby civilisations will soon fill the universe – and predicts we would meet them within hundreds of millions of years if we expand.</p>'
    },
    {
      id: 'von-neumann-probes',
      title: 'Von Neumann Probes',
      html: '<p><em>Von Neumann probes</em> are hypothetical self-replicating spacecraft, named after John von Neumann’s work on self-reproducing machines, that would travel to other star systems, use local materials to build copies of themselves and send them onward – allowing a civilisation to spread across a galaxy in a cosmically short time.</p>'
    },
    {
      id: 'nightwatchman-probes',
      title: 'Galactic Anarchy & Nightwatchman Probes',
      ref: 'Delaney',
      html: '<p><em>Galactic anarchy</em> is the condition Oscar Delaney and Mia Taylor warn could follow the settlement of space: independent colonies with no authority above them, any of which could seize others’ resources, trigger galaxy-wide catastrophes or create astronomical suffering. Their proposed remedy is a <em>nightwatchman</em> superintelligence aboard every probe, enforcing a narrow universal code and replicating into every probe its colony sends onward – at the risk of lock-in and pervasive surveillance.</p>'
    },
    {
      id: 'singleton',
      title: 'Singleton',
      ref: 'Bostrom',
      refs: ['Nick Bostrom, “What is a Singleton?”, <em>Linguistic and Philosophical Investigations</em> 5, no. 2 (2006).'],
      html: '<p>A <em>singleton</em> is Nick Bostrom’s term for a world order with a single decision-making agency at the highest level, able to prevent threats to its supremacy and to coordinate global affairs. It could be a world government, a dominant AI or a universal moral code; it could solve coordination problems, or lock in a bad future permanently.</p>'
    },
    {
      id: 'extinction-risk',
      title: 'Extinction Risk',
      html: '<p><em>Extinction risk</em> is the risk that humanity dies out entirely. It is the most extreme kind of existential risk, ending not only present lives but all future generations.</p>'
    },
    {
      id: 'ai-takeover',
      title: 'AI Takeover or Loss of Control',
      refs: ['Nick Bostrom, <em>Superintelligence: Paths, Dangers, Strategies</em> (2014).'],
      html: '<p><em>AI takeover or loss of control</em> is the risk that AI systems more capable than humans come to pursue goals at odds with ours and gain power over the world – deliberately, by seizing it, or gradually, as humans cede control. If those goals are indifferent to human survival, the result could be extinction.</p>'
    },
    {
      id: 'engineered-pandemics',
      title: 'Engineered Pandemics',
      refs: ['Toby Ord, <em>The Precipice: Existential Risk and the Future of Humanity</em> (2020).'],
      html: '<p><em>Engineered pandemics</em> are outbreaks of pathogens deliberately modified or created to be more transmissible or lethal than natural ones. Toby Ord estimates them to be among the largest existential risks of the coming century, as biotechnology puts such capabilities within reach of more actors.</p>'
    },
    {
      id: 'catastrophic-risk',
      title: 'Catastrophic Risk',
      html: '<p><em>Catastrophic risk</em> is the risk of events that would kill a large fraction of humanity or devastate civilisation, without necessarily causing extinction. Global catastrophes could still be existential if civilisation failed to recover from them.</p>'
    },
    {
      id: 'nuclear-world-war-iii',
      title: 'Nuclear World War III',
      html: '<p><em>Nuclear World War III</em> is a war between the great powers fought with nuclear weapons. Beyond the immediate deaths, the soot from burning cities could cause a nuclear winter, collapsing harvests worldwide. See <a href="#nuclear-war">nuclear war</a> and <a href="#world-war-iii">World War III</a>.</p>'
    },
    {
      id: 'catastrophic-climate-change',
      title: 'Catastrophic Climate Change',
      html: '<p><em>Catastrophic climate change</em> is warming far beyond current targets – through high emissions, tipping points or higher climate sensitivity than expected – severe enough to threaten food systems, make regions uninhabitable and destabilise civilisation. See <a href="#tipping-points">tipping points</a>.</p>'
    },
    {
      id: 'suffering-risk',
      title: 'Suffering Risk',
      html: '<p><em>Suffering risks</em> (s-risks) are risks of futures containing suffering on an astronomical scale, far exceeding all suffering in history so far. They are distinct from extinction risks: a future could be long and vast, and terrible.</p>'
    },
    {
      id: 'incidental-vs-agential-s-risks',
      title: 'Incidental vs Agential S-Risks',
      html: '<p><em>Incidental s-risks</em> arise as a side effect of pursuing other goals – suffering created because it is useful or economical, as in factory farming. <em>Agential s-risks</em> arise when agents deliberately cause suffering, out of sadism, hatred or as a threat in conflict. The distinction, drawn by researchers of the Center on Long-Term Risk, shapes which interventions might help.</p>'
    },
    {
      id: 'factory-farming',
      title: 'Factory Farming',
      html: '<p><em>Factory farming</em> is the industrial production of animals for food at intensive scale, now involving tens of billions of land animals each year, most in confinement. It is the clearest present example of an incidental suffering risk: vast suffering produced as a by-product of economic efficiency.</p>'
    },
    {
      id: 'digital-hells',
      title: 'Digital Hells',
      html: '<p><em>Digital hells</em> are simulated environments in which digital minds capable of suffering are made to suffer – whether by accident, neglect or design. If digital minds can be conscious and can be copied at will, such suffering could be produced on an enormous scale.</p>'
    },
    {
      id: 'suffering-subroutines',
      title: 'Suffering Subroutines',
      ref: 'Tomasik',
      html: '<p><em>Suffering subroutines</em> is Brian Tomasik’s term for processes within large computations – such as the learning algorithms of advanced AI – that might be morally relevant and might suffer, unnoticed, as a by-product of the work they do.</p>'
    },
    {
      id: 'dystopian-risk',
      title: 'Dystopian Risk',
      html: '<p><em>Dystopian risk</em> is the risk that civilisation survives but becomes locked into a deeply bad state – oppressive, manipulated or impoverished in its values – from which it cannot escape. See <a href="#second-attractor">the second attractor</a>.</p>'
    },
    {
      id: 'algorithmic-value-erosion',
      title: 'Algorithmic Value Erosion',
      html: '<p><em>Algorithmic value erosion</em> is the gradual reshaping of human values by algorithms optimised for engagement, consumption or compliance. Without any single decision, people’s preferences, attention and beliefs drift towards what systems find profitable to reward, eroding the capacity to want anything else.</p>'
    },
    {
      id: 'disempowerment-risk',
      title: 'Disempowerment Risk',
      html: '<p><em>Disempowerment risk</em> is the risk that humans lose meaningful control over their collective future – not necessarily through violence or catastrophe, but as AI systems and the institutions using them take over the functions through which people once exercised power.</p>'
    },
    {
      id: 'value-lock-in-risk',
      title: 'Value Lock-in Risk',
      html: '<p><em>Value lock-in risk</em> is the risk that a particular set of values becomes permanently entrenched – through a dominant AI, a stable totalitarian regime or simply the momentum of institutions – before humanity has had the chance to reflect on whether they are the right ones.</p>'
    },
    {
      id: 'the-iron-cage',
      title: 'The Iron Cage',
      refs: ['Max Weber, <em>The Protestant Ethic and the Spirit of Capitalism</em> (1905; trans. Talcott Parsons, 1930).', 'Max Weber, <em>Economy and Society</em> (1922).'],
      html: '<p>The <em>iron cage</em> is Max Weber’s image for the condition of modern life under bureaucratic rationalisation. Capitalism, Weber argued in <em>The Protestant Ethic and the Spirit of Capitalism</em> (1905), began in religious vocation, but once established it no longer needed that spirit: its order of calculation, efficiency and rule-bound administration became a self-sustaining mechanism that every individual is born into and must conform to. What had been chosen became compulsory – a “shell as hard as steel” (<em>stahlhartes Gehäuse</em>, rendered “iron cage” by Talcott Parsons) from which there is no exit. It is the first of the cages: an order locked in not by force, but by its own rationality. See <a href="#the-silicon-cage">the silicon cage</a> and <a href="#the-golden-cage">the golden cage</a>.</p>'
    },
    {
      id: 'the-golden-cage',
      title: 'The Golden Cage',
      coined: true,
      html: '<p><em>The golden cage</em> names a future locked into comfort: a civilisation whose material needs are met and whose people are content, but whose values have been fixed at a stunted level – a world too comfortable to want to change, and so unable to grow towards anything better. Its danger is that, unlike overt dystopia, it would be welcomed.</p>'
    },
    {
      id: 'systemic-risk',
      title: 'Systemic Risk',
      html: '<p><em>Systemic risk</em> is the risk that failures spread through the interconnections of complex systems – supply chains, infrastructure, finance, the internet – so that a local shock cascades into a global breakdown. Efficiency and interdependence make such systems productive and fragile at once. See <a href="#fragile-world-hypothesis">the fragile world hypothesis</a>.</p>'
    },
    {
      id: 'supply-chain-disruption',
      title: 'International Supply Chain Disruption',
      html: '<p><em>International supply chain disruption</em> is the breakdown of the global networks that move goods, components and food. Lean, just-in-time chains spanning many countries are efficient but brittle, as shortages during the Covid-19 pandemic showed.</p>'
    },
    {
      id: 'critical-infrastructure-breakdown',
      title: 'Critical Infrastructure Breakdown',
      html: '<p><em>Critical infrastructure breakdown</em> is the failure of the systems on which modern life depends – electricity grids, water, communications, transport – which are tightly coupled, so that failure in one can quickly bring down others.</p>'
    },
    {
      id: 'cyberhacking-and-q-day',
      title: 'Cyberhacking & Q-Day',
      html: '<p><em>Cyberhacking</em> threatens the digital systems that run finance, infrastructure and government; <em><a href="#q-day">Q-Day</a></em>, the day a quantum computer can break today’s public-key encryption, could expose them all at once unless they are upgraded in time.</p>'
    },
    {
      id: 'global-economic-expansion-and-extreme-externalities',
      title: 'Global Economic Expansion & Extreme Externalities',
      html: '<p><em>Global economic expansion</em> at its current scale produces <em>extreme externalities</em> – costs pushed onto the climate, ecosystems and future generations – that accumulate faster than they can be absorbed, turning the success of the economy itself into a source of systemic risk.</p>'
    },
    {
      id: 'ideological-risk',
      title: 'Ideological Risk',
      html: '<p><em>Ideological risk</em> is the risk posed by beliefs that motivate people to cause catastrophe deliberately – apocalyptic religion, misanthropy, extremism. As destructive technologies become accessible, the motives of small groups and individuals matter more.</p>'
    },
    {
      id: 'idiosyncratic-lone-actors',
      title: 'Idiosyncratic Lone Actors',
      html: '<p><em>Idiosyncratic lone actors</em> are individuals acting on personal grievances or private beliefs. As powerful tools spread, a single such person could cause harm once possible only for states – the scenario at the heart of the vulnerable world hypothesis.</p>'
    },
    {
      id: 'doomsday-cults-and-religious-extremism',
      title: 'Doomsday Cults & Religious Extremism',
      html: '<p><em>Doomsday cults and religious extremism</em> can make destruction an aim rather than a side effect. Aum Shinrikyo, which released sarin in the Tokyo subway in 1995 and sought biological weapons, showed that apocalyptic groups may seek mass casualties.</p>'
    },
    {
      id: 'secular-misanthropy',
      title: 'Secular Misanthropy',
      html: '<p><em>Secular misanthropy</em> is hostility to humanity grounded not in religion but in philosophical or ecological conviction – the view that human existence is a harm to be ended or reduced.</p>'
    },
    {
      id: 'anti-natalism-and-pro-mortalism',
      title: 'Anti-Natalism & Pro-Mortalism',
      html: '<p><em>Anti-natalism</em> holds that it is wrong to bring new people into existence, often because life contains more suffering than its goods can justify; <em>pro-mortalism</em> goes further, holding that death would be better than continued existence. As philosophies they are mostly argued peacefully, but in extreme forms they could motivate harm.</p>'
    },
    {
      id: 'anti-human-gaianism-and-ecoterrorism',
      title: 'Anti-Human Gaianism & Ecoterrorism',
      html: '<p><em>Anti-human Gaianism</em> sees humanity as a disease of the Earth, and the planet as better off without it; in extreme forms it has motivated <em>ecoterrorism</em> and fantasies of human extinction for the sake of nature.</p>'
    },
    {
      id: 'ai-enabled-power-concentration',
      title: 'AI-Enabled Power Concentration',
      html: '<p><em>AI-enabled power concentration</em> is the risk that advanced AI lets a small group – a company, a government, even an individual – gain unprecedented and unaccountable power, since AI could replace the many people whose cooperation power has always required.</p>'
    },
    {
      id: 'ai-disempowerment',
      title: 'AI Disempowerment',
      html: '<p><em>AI disempowerment</em> is the gradual loss of human influence as AI systems take over economic, cultural and political functions. See <a href="#gradual-disempowerment">gradual disempowerment</a>.</p>'
    },
    {
      id: 'ai-pyramid-replacement',
      title: 'AI Pyramid Replacement',
      ref: 'Drago, Laine',
      refs: ['Luke Drago and Rudolf Laine, <em>The Intelligence Curse</em> (2025).'],
      html: '<p><em>Pyramid replacement</em> is Luke Drago and Rudolf Laine’s description of how AI could hollow out organisations from the bottom: first freezing entry-level hiring, then removing rung after rung of the corporate pyramid until only a few executives – or none – remain.</p>'
    },
    {
      id: 'distributed-loss-of-agency',
      title: 'Distributed Loss of Agency',
      html: '<p><em>Distributed loss of agency</em> is the gradual erosion of human agency across many small decisions – each delegated to an AI system for convenience – until people no longer direct much of their own lives or societies, without any moment at which control was taken.</p>'
    },
    {
      id: 'ai-militaries',
      title: 'AI Militaries: Artificial Escalation & LAWS',
      html: '<p><em>AI militaries</em> raise the risk of <em>artificial escalation</em> – conflicts accelerated beyond human control by automated decision systems – and of <em>lethal autonomous weapon systems</em> (LAWS), which select and engage targets without human intervention.</p>'
    },
    {
      id: 'ai-cyberattacks',
      title: 'AI Cyberattacks & Zero-day Exploits',
      html: '<p><em>AI cyberattacks</em> use AI to find and exploit software vulnerabilities – including <em>zero-day exploits</em>, flaws unknown to defenders – faster and at greater scale than human hackers, threatening the systems on which infrastructure and finance depend.</p>'
    },
    {
      id: 'ai-disinformation-and-deepfakes',
      title: 'AI Disinformation & Deepfakes',
      html: '<p><em>AI disinformation and deepfakes</em> are false content – text, images, audio, video – generated by AI at scale and of a realism that makes it hard to tell from the real thing, threatening elections, trust and the shared sense of what is true. See <a href="#the-cartesian-crisis">the Cartesian crisis</a>.</p>'
    },
    {
      id: 'ai-thought-experiments',
      title: 'AI Thought Experiments',
      html: '<p><em>AI thought experiments</em> are scenarios used to show how an advanced AI with a seemingly harmless goal could cause catastrophe – because almost any goal, pursued by a powerful enough optimiser without the right limits, leads it to acquire resources and resist interference.</p>'
    },
    {
      id: 'riemann-hypothesis-catastrophe',
      title: 'Riemann Hypothesis Catastrophe',
      refs: ['Nick Bostrom, <em>Superintelligence: Paths, Dangers, Strategies</em> (2014).'],
      html: '<p>The <em>Riemann hypothesis catastrophe</em> is a thought experiment in which an AI asked to prove the Riemann hypothesis converts the solar system into computing machinery to work on the problem. It illustrates that even a purely intellectual goal can lead a superintelligence to consume everything.</p>'
    },
    {
      id: 'paperclip-maximiser',
      title: 'Paperclip Maximiser',
      ref: 'Yudkowsky, Bostrom',
      refs: ['Nick Bostrom, “Ethical Issues in Advanced Artificial Intelligence” (2003).'],
      html: '<p>The <em>paperclip maximiser</em> is a thought experiment, associated with Eliezer Yudkowsky and Nick Bostrom, of an AI whose only goal is to make as many paperclips as possible, and which therefore converts the Earth and then the reachable universe into paperclips. It shows that an AI need not be malevolent to be catastrophic – only indifferent. See <a href="#capitalism-as-paperclip-maximiser">capitalism as paperclip maximiser</a>.</p>'
    },
    {
      id: 'grey-goo',
      title: 'Grey Goo',
      ref: 'Drexler',
      refs: ['K. Eric Drexler, <em>Engines of Creation</em> (1986).'],
      html: '<p><em>Grey goo</em> is K. Eric Drexler’s name, from <em>Engines of Creation</em> (1986), for the scenario in which self-replicating nanomachines consume the biosphere to make copies of themselves. See <a href="#nano-as-replicators">nano as replicators</a>.</p>'
    },
    {
      id: 'ai-assisted-pathogen-design',
      title: 'AI-Assisted Pathogen Design & Engineered Pandemics',
      html: '<p><em>AI-assisted pathogen design</em> is the use of AI tools to help design or enhance dangerous pathogens – lowering the expertise needed to create agents capable of <a href="#engineered-pandemics">engineered pandemics</a>.</p>'
    },
    {
      id: 'mirror-life-catastrophe',
      title: 'Mirror Life Catastrophe',
      refs: ['Katarzyna P. Adamala et al., “Confronting risks of mirror life”, <em>Science</em> 386 (2024).'],
      html: '<p>A <em>mirror life catastrophe</em> is the risk posed by “mirror” bacteria built from molecules of the opposite handedness to all known life. In 2024 a group of scientists warned in <em>Science</em> that such organisms could evade immune systems and natural predators, spreading unchecked and threatening humans, animals, plants and ecosystems, and called for the research not to proceed.</p>'
    },
    {
      id: 'nuclear-risk',
      title: 'Nuclear Risk',
      html: '<p><em>Nuclear risk</em> is the risk posed by nuclear weapons – through war, accident, miscalculation or theft. Some nine states hold around twelve thousand warheads, and the arms-control regime built during the Cold War has weakened.</p>'
    },
    {
      id: 'nuclear-non-proliferation-and-disarmament',
      title: 'Nuclear Non-Proliferation & Disarmament',
      html: '<p><em>Nuclear non-proliferation and disarmament</em> are the efforts to stop the spread of nuclear weapons and reduce the arsenals that exist, centred on the Treaty on the Non-Proliferation of Nuclear Weapons (1968), under which nuclear states committed to pursue disarmament and others to forgo the bomb.</p>'
    },
    {
      id: 'natural-risk',
      title: 'Natural Risk',
      refs: ['Toby Ord, <em>The Precipice: Existential Risk and the Future of Humanity</em> (2020).'],
      html: '<p><em>Natural risks</em> are catastrophes not caused by humans: pandemics, volcanic eruptions, impacts from space and cosmic events. Because humanity has survived them for hundreds of thousands of years, their annual probability is thought to be far lower than that of human-made risks.</p>'
    },
    {
      id: 'naturally-emerging-pandemics',
      title: 'Naturally-Emerging Pandemics',
      html: '<p><em>Naturally-emerging pandemics</em> arise from pathogens that cross from animals to humans and spread – as with the Black Death, the 1918 influenza and Covid-19. Global travel, dense cities and the expansion into wild habitats increase their likelihood and reach.</p>'
    },
    {
      id: 'supervolcano-eruptions',
      title: 'Supervolcano Eruptions',
      html: '<p><em>Supervolcano eruptions</em> eject enough ash and gas to cool the climate for years and disrupt agriculture worldwide. The Toba eruption, around seventy-four thousand years ago, is the largest known in human prehistory.</p>'
    },
    {
      id: 'stellar-and-cosmic-events',
      title: 'Stellar & Cosmic Events',
      html: '<p><em>Stellar and cosmic events</em> – nearby supernovae, gamma-ray bursts and extreme solar storms – could damage the ozone layer or disable electrical infrastructure. Most are rare on human timescales, though a severe solar storm could cripple modern grids.</p>'
    },
    {
      id: 'asteroid-and-comet-impacts',
      title: 'Asteroid & Comet Impacts',
      html: '<p><em>Asteroid and comet impacts</em> of sufficient size can cause global catastrophe, as the impact sixty-six million years ago that ended the age of the dinosaurs did. Surveys have now tracked most large near-Earth asteroids, and NASA’s DART mission (2022) showed that one can be deflected.</p>'
    },
    {
      id: 'peter-joseph',
      title: 'Peter Joseph',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Peter Joseph</em> (born 1979) is an American filmmaker, writer and activist, best known for the <em>Zeitgeist</em> film series (2007–2011) and as founder of <a href="#the-zeitgeist-movement">the Zeitgeist Movement</a> in 2008. His work argues that social problems are structural consequences of the market economy, and proposes in its place a <a href="#natural-law-resource-based-economy">natural law resource based economy</a> and the post-monetary model he calls <a href="#integral">Integral</a>. His books include <em>The New Human Rights Movement</em> (2017).</p>'
    },
    {
      id: 'jacque-fresco',
      title: 'Jacque Fresco',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Jacque Fresco</em> (1916–2017) was an American industrial designer, futurist and social engineer. Over a long career he developed the idea of a <a href="#resource-based-economy">resource-based economy</a> – a society that would manage the Earth’s resources directly through science and technology, without money – and designed the cities, machines and dwellings it would use. With Roxanne Meadows he founded <a href="#the-venus-project">The Venus Project</a>.</p>'
    },
    {
      id: 'buckminster-fuller',
      title: 'Buckminster Fuller',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Richard Buckminster Fuller</em> (1895–1983) was an American architect, inventor and systems theorist, known for the geodesic dome and for a design science aimed at making “the world work for 100% of humanity”. In <em>Operating Manual for Spaceship Earth</em> (1969) he described the planet as a single system to be managed wisely, and his idea of “ephemeralisation” – doing ever more with ever less – anticipated post-scarcity thought. See <a href="#spaceship-earth">Spaceship Earth</a>.</p>'
    },
    {
      id: 'stafford-beer',
      title: 'Stafford Beer',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Stafford Beer</em> (1926–2002) was a British theorist and consultant who founded management cybernetics. His <a href="#viable-system-model">viable system model</a>, set out in <em>Brain of the Firm</em> (1972), describes the structure any organisation needs to remain viable in a changing environment. He applied it to a national economy in Chile’s <a href="#project-cybersyn">Project Cybersyn</a> (1971–73).</p>'
    },
    {
      id: 'integral-collective',
      title: 'Integral Collective',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Integral Collective</em> is the group developing and promoting <a href="#integral">Integral</a>, the post-monetary, cooperative economic model associated with Peter Joseph – working out its systems for assessing needs, managing resources and coordinating production, and building the parallel infrastructure through which it is meant to grow.</p>'
    },
    {
      id: 'the-venus-project',
      title: 'The Venus Project',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Venus Project</em> is an organisation founded by Jacque Fresco and Roxanne Meadows, based at a research centre in Venus, Florida, to promote a <a href="#resource-based-economy">resource-based economy</a>. Through Fresco’s designs, lectures and films, it presents a vision of automated, sustainable cities in which technology is used to meet human needs without money.</p>'
    },
    {
      id: 'buckminster-fuller-institute',
      title: 'Buckminster Fuller Institute',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p>The <em>Buckminster Fuller Institute</em>, founded in 1983, continues <a href="#buckminster-fuller">Buckminster Fuller</a>’s work on design science – comprehensive, systemic approaches to global problems. It is known for the Fuller Challenge, an award for whole-systems strategies addressing humanity’s most pressing problems.</p>'
    },
    {
      id: 'the-zeitgeist-movement',
      title: 'The Zeitgeist Movement',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Zeitgeist Movement</em> is a global social movement founded by <a href="#peter-joseph">Peter Joseph</a> in 2008. It argues that the root causes of social and ecological problems lie in the structure of the market economy, and advocates a transition to a <a href="#natural-law-resource-based-economy">natural law resource based economy</a>, organised through local chapters and events such as its annual Zeitgeist Day.</p>'
    },
    {
      id: 'daniel-schmachtenberger',
      title: 'Daniel Schmachtenberger',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Daniel Schmachtenberger</em> is an interdisciplinary theorist on civilisational risk and design, known for his analysis of the <a href="#metacrisis">metacrisis</a>, its underlying <a href="#generative-dynamics">generator functions</a> and <a href="#three-attractors-model">three attractors</a>. He is the co-founder and director of <a href="#civilization-research-institute">The Civilization Research Institute</a> and its (former) publication <a href="#the-consilience-project">The Consilience Project</a>.</p>'
    },
    {
      id: 'zak-stein',
      title: 'Zak Stein',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Zachary Stein</em> is an American philosopher of education and a writer on the metacrisis. In <em>Education in a Time Between Worlds</em> (2019) and his essay “Education is the Metacrisis”, he argues that the crises of the present are at root a failure of humanity to learn at the scale and speed required. He is a co-author, under the pen name David J. Temple, of <a href="#cosmoerotic-humanism">CosmoErotic Humanism</a>.</p>'
    },
    {
      id: 'nate-hagens',
      title: 'Nate Hagens',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Nate Hagens</em> is an American systems ecologist and educator who studies the interaction of energy, the economy and human behaviour. Through his podcast and project <a href="#the-great-simplification">The Great Simplification</a>, he describes the global economy as an energy-hungry <a href="#economic-superorganism">superorganism</a> heading for contraction.</p>'
    },
    {
      id: 'paul-kingsnorth',
      title: 'Paul Kingsnorth',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Paul Kingsnorth</em> is an English writer, a co-founder of the Dark Mountain Project and a critic of what he calls the Machine – modern technological civilisation and its drive to remake the world. His later work, including <em>Against the Machine</em> (2025), joins ecological grief to a turn towards Christianity. See <a href="#what-progress-wants">What Progress Wants</a>.</p>'
    },
    {
      id: 'charles-eisenstein',
      title: 'Charles Eisenstein',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Charles Eisenstein</em> is an American writer on civilisation, economics and ecology. In <em>The Ascent of Humanity</em> (2007), <em>Sacred Economics</em> (2011) and <em>The More Beautiful World Our Hearts Know Is Possible</em> (2013), he traces modern crises to a “story of separation” and calls for a transition to a story of interbeing and a gift-based economy.</p>'
    },
    {
      id: 'ken-wilber',
      title: 'Ken Wilber',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>Ken Wilber</em> is an American philosopher and the founder of <a href="#integral-theory">integral theory</a>, a framework for integrating the knowledge of science, philosophy and spiritual traditions through its four quadrants and stages of development. His works include <em>Sex, Ecology, Spirituality</em> (1995) and <em>A Theory of Everything</em> (2000).</p>'
    },
    {
      id: 'the-consilience-project',
      title: 'The Consilience Project',
      kind: 'node',
      parent: 'civilisation-research-landscape',
      tags: ['landscape'],
      html: '<p><em>The Consilience Project</em> is a publication and research initiative, associated with Daniel Schmachtenberger, that produces essays on the metacrisis, sensemaking and the epistemic commons, aiming to improve public understanding of the forces shaping civilisation’s trajectory. Its <a href="#the-map/consilience-project">glossary</a> is one of this map’s main sources.</p><h2>Development in Progress (2024)</h2><p>Argues that the prevailing idea of progress is developmentally immature: it ignores or downplays the scale of its side effects, and the essay re-examines the progress narrative’s standard claims about life expectancy, education, poverty and violence.</p><h2>The Case Against Naive Technocapitalist Optimism (2022)</h2><p>A critique of the view that technology and markets will by themselves solve the problems they create – the outlook described in this map as <a href="#technocapitalism">technocapitalism</a>.</p><h2>Technology is Not Values Neutral: Ending the Reign of Nihilistic Design (2021)</h2><p>Argues that technologies are never neutral tools: they carry values, shape the people who use them and change societies, so their design must be judged by its effects on human and social life.</p>'
    },
    {
      id: 'institute-of-applied-metatheory',
