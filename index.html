      html: '<p><em>Yellow teaming</em> is a counterpart to <a href="#red-teaming">red teaming</a>: rather than asking how a plan could be attacked, it asks what the plan could cause if it succeeds – its second- and third-order effects and externalities. It is a discipline for anticipating the harms that even well-intended, successful innovations can produce.</p>'
    },
    {
      id: 'the-benevolent-dictator',
      title: 'The Benevolent Dictator: Morality & ‘Its’ Demands',
      parent: 'coordination-and-governance',
      html: '<p>The <em>benevolent dictator</em> is the thought experiment of a single, wise and well-intentioned ruler – increasingly imagined as a superintelligent AI – who could govern better than any democracy. It raises the question of what morality, or “it”, would demand of such a power, and whether the concentration of power required could ever be safe, however good its intentions.</p>'
    },
    {
      id: 'theory-of-change',
      title: 'Theory of Change',
      parent: 'civilisation-transition',
      html: '<p>A <em>theory of change</em> is an explicit account of how a set of actions is expected to produce a desired outcome – the causal pathway from interventions to results, and the assumptions it depends on. Making it explicit allows it to be tested and revised. At the scale of civilisation, it asks how deep structural change could actually come about.</p>'
    },
    {
      id: 'all-watched-over-by-machines',
      title: 'All Watched Over by Machines of Loving Grace',
      parent: 'coordination-and-governance',
      ref: 'Brautigan; Curtis',
      html: '<p><em>All Watched Over by Machines of Loving Grace</em> is the title of Richard Brautigan’s 1967 poem imagining a harmony of humans, nature and benevolent computers, and of Adam Curtis’s documentary series (2011), which examined how the dream of self-regulating systems shaped modern politics and ecology. It names both the hope and the danger of handing coordination to machines.</p>'
    },
    {
      id: 'ecological-civilisation',
      title: 'Ecological Civilisation',
      parent: 'coordination-and-governance',
      ref: 'Xi Jinping; CPC',
      html: '<p><em>Ecological civilisation</em> is a concept of a society organised in harmony with nature, adopted as an official goal by the Chinese state and written into its constitution in 2018. Beyond its Chinese usage, the term is used more widely to describe a civilisation whose economy, culture and institutions are designed around ecological sustainability.</p>'
    },
    {
      id: 'the-great-alignment',
      title: 'The Great Alignment',
      coined: true,
      parent: 'alignment-and-futures',
      html: '<p>The <em>great alignment</em> is the project of aligning not only artificial intelligence with human values, but humanity’s institutions, economies and technologies with the long-term flourishing of people and the biosphere. It frames AI alignment as one instance of a broader civilisational problem: bringing powerful optimising systems of every kind into accord with what is truly valuable.</p>'
    },
    {
      id: 'macrostrategy',
      title: 'Macrostrategy',
      kind: 'category',
      order: 9,
      parent: 'civilisation-theory',
      ref: 'Bostrom',
      html: '<p><em>Macrostrategy</em>, as developed by Nick Bostrom and the Future of Humanity Institute, is the study of how long-term outcomes for humanity depend on present choices – which interventions matter most, in what order, and in light of which <a href="#crucial-consideration">crucial considerations</a>. It seeks the big-picture strategy by which civilisation might navigate transformative technologies safely.</p>'
    },
    {
      id: 'solved-world',
      title: 'Solved World',
      parent: 'alignment-and-futures',
      ref: 'Bostrom (Deep Utopia)',
      html: '<p>A <em>solved world</em>, in Nick Bostrom’s <em>Deep Utopia</em> (2024), is one in which advanced technology has solved humanity’s practical problems – scarcity, disease, even the need for work. Bostrom asks what meaning and purpose would remain for people in such a world, and whether a life without necessity could still be a good one.</p>'
    },
    {
      id: 'longtermism',
      title: 'Longtermism',
      parent: 'alignment-and-futures',
      html: '<p><em>Longtermism</em> is the view that positively influencing the long-term future is a key moral priority of our time, because the number of people who may live in the future is vast and what we do now may shape their lives. It motivates particular attention to existential risks and to choices that could lock in the long-run trajectory of civilisation.</p>'
    },
    {
      id: 'post-humanism',
      title: 'Post-Humanism',
      parent: 'alignment-and-futures',
      ref: 'Humanism',
      html: '<p><em>Post-humanism</em> covers two related currents: a critique of humanism that questions the human as the measure of all things, and the prospect of beings – enhanced, digital or artificial – that go beyond present human forms. Both challenge the assumption that the human, as currently constituted, is the fixed centre of value and history.</p>'
    },
    {
      id: 'life-3-0',
      title: 'Life 3.0',
      parent: 'alignment-and-futures',
      ref: 'Tegmark',
      html: '<p><em>Life 3.0</em> is Max Tegmark’s term, from his book of that name (2017), for life that can design both its software and its hardware. Where biological life (1.0) evolves both and cultural life (2.0) can learn new software, life 3.0 – enabled by AI – could redesign itself entirely. Tegmark uses the frame to explore the futures AI might bring.</p>'
    },
    {
      id: 'moral-circle-expansion',
      title: 'Moral Circle Expansion',
      parent: 'alignment-and-futures',
      ref: 'Singer (The Expanding Circle)',
      html: '<p><em>Moral circle expansion</em> is the historical and ethical process by which the range of beings granted moral consideration widens – from kin and tribe to all humans, animals and potentially future or digital minds. Peter Singer’s <em>The Expanding Circle</em> (1981) traced its logic. Expanding the circle further is often seen as crucial to how the long-term future goes.</p>'
    },
    {
      id: 'existential-hope',
      title: 'Existential Hope',
      parent: 'alignment-and-futures',
      ref: 'Cotton-Barratt & Ord',
      html: '<p><em>Existential hope</em> is the counterpart to existential risk: the possibility of events that dramatically improve humanity’s long-term prospects. The term was introduced by Owen Cotton-Barratt and Toby Ord (2015). It turns attention from avoiding catastrophe to envisioning and pursuing the best achievable futures.</p>'
    },
    {
      id: 'utopia-unified-theory',
      title: 'UTOPIA: Unified Theory of the Principles of Intelligence & Alignment',
      coined: true,
      parent: 'replicators',
      html: '<p><em>UTOPIA</em> – a Unified Theory of the Principles of Intelligence and Alignment – names the aspiration to a single framework explaining what intelligence is, human and artificial, and what it means for intelligent systems to be aligned with one another and with what is good. The acronym signals that the good society and the aligned mind may be two faces of the same problem.</p>'
    },
    {
      id: 'human-inner-alignment-problem',
      title: 'The Human Inner Alignment Problem',
      coined: true,
      parent: 'alignment-and-futures',
      html: '<p>The <em>human inner alignment problem</em> applies the language of AI alignment to people: just as an AI trained for one goal may develop different internal objectives, human beings shaped by evolution and culture pursue drives – status, comfort, short-term reward – that diverge from their considered values and collective wellbeing. Solving it concerns psychology, culture and education as much as policy.</p>'
    },
    {
      id: 'viatopia',
      title: 'Viatopia',
      parent: 'alignment-and-futures',
      html: '<p><em>Viatopia</em> is a destination-agnostic alternative to utopia: rather than a blueprint for a perfect end-state, it describes a state from which civilisation is well placed to keep improving – able to reflect, deliberate and correct its course. It prioritises preserving options and good processes over committing prematurely to any single vision of the good.</p>'
    },
    {
      id: 'cosmic-veil-and-stratified-utopia',
      title: 'The Cosmic Veil of Ignorance & Stratified Utopia',
      coined: true,
      parent: 'moral-theory',
      ref: 'Nora, Carlo',
      html: '<p>The <em>cosmic veil of ignorance</em> extends John Rawls’s thought experiment – choosing principles of justice without knowing one’s place in society – to the scale of the cosmos and the long-term future, including future and non-human minds. <em>Stratified utopia</em> describes a future composed of multiple layers or regions, each realising different visions of the good.</p>'
    },
    {
      id: 'pragmatic-utopianism',
      title: 'Pragmatic Utopianism',
      parent: 'civilisation-transition',
      html: '<p><em>Pragmatic utopianism</em> combines the ambition of utopian thinking with a commitment to feasible steps and testable experiments. It holds that radically better societies are worth aiming for, but that they are built incrementally, through institutions and practices that work in the present and can be improved over time.</p>'
    },
    {
      id: 'second-enlightenment',
      title: 'Second Enlightenment',
      parent: 'alignment-and-futures',
      ref: 'MacAskill, Pinker',
      html: '<p>A <em>second enlightenment</em> would renew the Enlightenment’s commitments – reason, science, humanism and progress – for the challenges of the twenty-first century, correcting its blind spots in light of ecological limits, complexity and the risks of powerful technology. It envisions a new flowering of collective reasoning and moral progress adequate to a civilisation-scale transition.</p>'
    },
    {
      id: 'the-novacene',
      title: 'The Novacene',
      parent: 'alignment-and-futures',
      ref: 'Lovelock',
      html: '<p>The <em>Novacene</em> is James Lovelock’s term, from <em>Novacene</em> (2019), for a coming age succeeding the Anthropocene, in which hyper-intelligent artificial beings emerge as the dominant form of intelligence on Earth. Lovelock suggested such beings might have an interest in preserving a habitable planet, and so in cooperating with the Gaian system of which humans are part.</p>'
    },
    {
      id: 'the-culture',
      title: 'The Culture',
      parent: 'alignment-and-futures',
      ref: 'Banks',
      html: '<p><em>The Culture</em> is the post-scarcity, galaxy-spanning civilisation of Iain M. Banks’s novels (1987–2012), in which humans live freely alongside benevolent artificial Minds that manage the society. Anarchic, abundant and secular, it remains one of the most influential imagined pictures of a good future with superintelligent machines.</p>'
    },
    {
      id: 'metamathics',
      title: 'Metamathics',
      parent: 'the-culture',
      ref: 'Banks',
      html: '<p><em>Metamathics</em>, in Iain M. Banks’s Culture novels, is the exploration by the Culture’s artificial Minds of the mathematics of alternative, hypothetical universes – a pursuit so absorbing that some Minds prefer it to engaging with reality. It is Banks’s image of what a superintelligence might find meaningful once every practical problem is solved.</p>'
    },
    {
      id: 'prometheus',
      title: 'Prometheus',
      parent: 'alignment-and-futures',
      ref: 'Fluss & Frim',
      html: '<p><em>Prometheus</em>, the Titan who stole fire from the gods for humanity, stands for technological ambition and the human capacity to remake the world – and for its risks. In debates about the future, a Promethean stance affirms reason, technology and human agency against both fatalism and the view that humanity should retreat from transforming nature.</p>'
    },
    {
      id: 'effective-altruism',
      title: 'Effective Altruism',
      parent: 'ethics-meaning-and-spirit',
      html: '<p><em>Effective altruism</em> is a movement and philosophy that uses evidence and reason to identify the most effective ways to benefit others, and acts on them. It has directed resources to global health, animal welfare and the reduction of existential risk, and has attracted both wide influence and significant criticism.</p>'
    },
    {
      id: 'integral-altruism',
      title: 'Integral Altruism',
      parent: 'effective-altruism',
      html: '<p><em>Integral altruism</em> seeks to combine the rigour of effective altruism with a more holistic view of human development – attending to inner transformation, culture and systems as well as measurable outcomes. It aims to integrate doing good effectively with becoming the kind of people and societies that can sustain such good.</p>'
    },
    {
      id: 'religion-that-is-not-a-religion',
      title: 'The Religion that is not a Religion',
      parent: 'ethics-meaning-and-spirit',
      ref: 'Vervaeke',
      html: '<p>The <em>religion that is not a religion</em> is John Vervaeke’s phrase for a response to the meaning crisis: an ecology of practices that cultivates wisdom, meaning and self-transcendence, as religions have done, without requiring belief in supernatural doctrines. It aims to recover the functions of religion within a secular, scientific worldview.</p>'
    },
    {
      id: 'syntheism',
      title: 'Syntheism',
      parent: 'ethics-meaning-and-spirit',
      ref: 'Bard & Söderqvist',
      html: '<p><em>Syntheism</em> is a religious movement and philosophy introduced by Alexander Bard and Jan Söderqvist in <em>Syntheism: Creating God in the Internet Age</em> (2014). It holds that God is not a pre-existing being but something created by humanity through collective, participatory practices – a response to the spiritual needs of a networked society.</p>'
    },
    {
      id: 'new-atheism',
      title: 'New Atheism',
      parent: 'ethics-meaning-and-spirit',
      html: '<p><em>New Atheism</em> was an early twenty-first-century intellectual movement, associated with Richard Dawkins, Sam Harris, Daniel Dennett and Christopher Hitchens, which argued that religion should be openly criticised and countered by rational argument and science. Its confidence in reason as a replacement for religion has since been questioned in light of the meaning crisis.</p>'
    },
    {
      id: 'post-theism',
      title: 'Post-Theism',
      parent: 'ethics-meaning-and-spirit',
      html: '<p><em>Post-theism</em> describes a stance beyond both theism and atheism: rather than affirming or denying God, it holds that the question has been superseded, and turns to what can replace the social and existential functions that belief in God once served – meaning, community, moral orientation and a relation to the sacred.</p>'
    },
    {
      id: 'biowisdom',
      title: 'Intra-structure: Biowisdom',
      coined: true,
      parent: 'civilisation-design',
      html: '<p><em>Biowisdom</em> is wisdom grounded in the understanding of living systems: the recognition that human flourishing depends on the health of the biosphere, and that the principles by which life sustains itself – diversity, feedback, resilience, interdependence – can guide the design of human societies.</p>'
    },
    {
      id: 'science-of-morality',
      title: 'Science of Morality',
      parent: 'ethics-meaning-and-spirit',
      ref: 'Harris',
      html: '<p>A <em>science of morality</em> is the proposal, advanced by Sam Harris in <em>The Moral Landscape</em> (2010), that moral questions have objectively better and worse answers, grounded in facts about the wellbeing of conscious creatures, and can in principle be investigated scientifically. It challenges the view that facts and values belong to separate domains.</p>'
    },
    {
      id: 'technology-of-behaviour',
      title: 'Technology of Behaviour',
      parent: 'ethics-meaning-and-spirit',
      ref: 'Skinner',
      html: '<p>A <em>technology of behaviour</em> is B. F. Skinner’s proposal, in <em>Beyond Freedom and Dignity</em> (1971), for the deliberate design of environments and incentives to shape human behaviour for collective benefit. It raises the enduring question of who designs such environments, towards what ends, and how such power could be kept accountable.</p>'
    },
    {
      id: 'gaia',
      title: 'Gaia',
      parent: 'ethics-meaning-and-spirit',
      ref: 'Lovelock',
      html: '<p><em>Gaia</em> is James Lovelock’s hypothesis, developed with Lynn Margulis in the 1970s, that the Earth’s living organisms and their environment form a self-regulating system that maintains conditions suitable for life. Beyond its scientific influence on Earth system science, it has become a powerful image of the planet as a living whole.</p>'
    },
    {
      id: 'the-glass-bead-game',
      title: 'The Glass Bead Game',
      parent: 'ethics-meaning-and-spirit',
      ref: 'Hesse',
      html: '<p><em>The Glass Bead Game</em> (1943) is Hermann Hesse’s novel of a future intellectual order devoted to a game that synthesises all knowledge – music, mathematics, philosophy – into a single language of connections. It is an image of integrated understanding, and a warning about intellectual life detached from the world.</p>'
    },
    {
      id: 'complex-world-system-dynamics',
      title: 'Complex World-System Dynamics',
      parent: 'civilisational-mechanics',
      kind: 'category',
      order: 2,
      html: '<p>The emergent behaviour of the world-system as a whole: how markets, states, technologies and institutions interact to produce outcomes – disorder, securitisation, runaway optimisation, new forms of totalitarianism – that no single actor designs or controls.</p>'
    },
    {
      id: 'ai-alignment',
      title: 'AI Alignment',
      parent: 'macrostrategy',
      kind: 'category',
      order: 4,
      html: '<p>The problem of ensuring that artificial intelligence, and the wider systems it becomes part of, pursue ends compatible with human and planetary flourishing – and what the framing of alignment reveals about intelligence itself.</p>'
    },
    {
      id: 'replicators',
      title: 'Replicators',
      parent: 'metatheory',
      kind: 'category',
      order: 1500,
      html: '<p>Frameworks for understanding self-propagating systems – genes, memes, institutions, machines – and the philosophical frames and paradigms needed to think about agency, intelligence and alignment across all of them.</p>'
    },
    {
      id: 'moral-theory',
      title: 'Moral Theory',
      parent: 'macrostrategy',
      kind: 'category',
      order: 6,
      html: '<p>Moral questions raised by civilisation-scale power and long-run futures: the ethics of automated violence, of cosmic stakes and plural values, of consciousness and moral status, and of how societies know what they ought to do.</p>'
    },
    {
      id: 'twin-nuclei-problem',
      title: 'The Twin Nuclei Problem',
      parent: 'metacrisis',
      ref: 'Eric Weinstein',
      html: '<p>The <em>twin nuclei problem</em> is Eric Weinstein’s name for the two thresholds humanity crossed in the twentieth century when it learned to reach into the two nuclei at the base of matter and of life: the nucleus of the atom, opened by nuclear fission, and the nucleus of the cell, opened by the discovery and engineering of DNA. Each confers a power once reserved for nature – to release the energy that binds matter, and to rewrite the code that builds organisms – and each carries the potential for catastrophe at the scale of the species. The problem is that this power arrived long before the wisdom and institutions needed to govern it, making the pair an early and defining instance of the <a href="#the-wisdom-gap">wisdom gap</a> at the heart of the <a href="#metacrisis">metacrisis</a>.</p>'
    },
    {
      id: 'critical-collapsology',
      title: 'Critical Collapsology',
      coined: true,
      parent: 'risk-and-catastrophe',
      ref: 'Servigne & Stevens (collapsology)',
      html: '<p><em>Critical collapsology</em> builds on “collapsology”, the interdisciplinary study of the collapse of industrial civilisation popularised by Pablo Servigne and Raphaël Stevens (2015). Its critical form examines not only whether and how collapse might happen, but whose collapse is imagined, which narratives of collapse serve which interests, and how the study of collapse can inform transition rather than resignation.</p>'
    },
    {
      id: 'goliaths-curse',
      title: 'Goliath’s Curse',
      parent: 'risk-and-catastrophe',
      ref: 'Kemp',
      html: '<p><em>Goliath’s Curse</em> (2025) is Luke Kemp’s history of societal collapse, which describes dominance hierarchies as “Goliaths” – states and empires built on the concentration of wealth and power. Kemp argues that the same inequality and extraction that make such societies powerful also make them fragile, and that today’s global Goliath faces the same curse at planetary scale.</p>'
    },
    {
      id: 'techno-capitalist-progress-narrative',
      title: 'The Techno-Capitalist Progress Narrative',
      coined: true,
      parent: 'culture-and-meaning',
      html: '<p>The <em>techno-capitalist progress narrative</em> is the story that technological innovation driven by markets naturally produces human progress, and that more growth and more technology are the solution to the problems they create. It functions as the unofficial creed of the present civilisation, making its trajectory seem both inevitable and benevolent.</p>'
    },
    {
      id: 'high-modern-panopticon',
      title: 'The High-Modern Panopticon',
      coined: true,
      parent: 'power-and-control',
      ref: 'Scott; Bentham, Foucault',
      html: '<p>The <em>high-modern panopticon</em> joins James C. Scott’s high modernism – the drive to make society legible and redesign it from above – with the panopticon’s logic of total visibility. Digital technology makes possible a state or platform that sees everything and plans accordingly, combining the ambitions of central planning with the reach of universal surveillance.</p>'
    },
    {
      id: 'the-fourth-frontier',
      title: 'The Fourth Frontier',
      parent: 'alignment-and-futures',
      ref: 'Bret Weinstein & Heather Heying, A Hunter-Gatherer’s Guide to the 21st Century (2021)',
      html: '<p><em>The fourth frontier</em> is Bret Weinstein’s term, developed with Heather Heying in <em>A Hunter-Gatherer’s Guide to the 21st Century</em> (2021), for a way out of the growth trap. Historically, populations have prospered by reaching a frontier: a <em>geographic</em> frontier of new land, a <em>technological</em> frontier that lets the same land support more, or a <em>transfer</em> frontier of taking resources from others. Each is temporary, and the last is zero-sum. The fourth frontier is a deliberately designed steady state that preserves the feeling of a frontier – abundance, opportunity and room to grow – without depending on endless expansion or extraction. It reframes sustainability not as sacrifice but as the engineering of a civilisation people would want to live in indefinitely, and so turns a <a href="#zero-sum-game">zero-sum</a> struggle into a positive-sum one.</p>'
    },
    {
      id: 'civilisation-x',
      title: 'Civilisation X',
      coined: true,
      parent: 'civilisation-design',
      html: '<p><em>Civilisation X</em> is a placeholder name for the civilisation that could succeed the present one – the unknown variable that civilisation design seeks to solve for. Leaving it unnamed resists committing prematurely to any existing ideology or blueprint, while insisting that a successor civilisation is both necessary and designable.</p>'
    },
    {
      id: 'game-b',
      title: 'Game B',
      parent: 'coordination-and-governance',
      html: '<p><em>Game B</em> is a loose community and set of ideas, associated with figures such as Jordan Hall and Jim Rutt, which contrasts “Game A” – the civilisational game of rivalrous competition for power and resources – with a hypothetical Game B: a new social operating system based on collective intelligence, cooperation and sustainability that could outcompete Game A without reproducing it.</p>'
    },
    {
      id: 'the-integral-economy',
      title: 'The Integral Economy',
      coined: true,
      parent: 'post-capitalism',
      html: '<p>The <em>integral economy</em> is an economy designed to integrate its dimensions – material, ecological, social, cultural and inner – rather than optimising for financial value alone. It measures success by the flourishing of people and living systems, and treats production, care, meaning and ecology as parts of a single economic whole.</p>'
    },
    {
      id: 'the-hinge-of-history',
      title: 'The Hinge of History',
      parent: 'theory-of-history',
      ref: 'Parfit; MacAskill',
      html: '<p>The <em>hinge of history</em> is the idea, expressed by Derek Parfit and examined by William MacAskill, that we may be living at an unusually influential moment, when choices made now will shape the long-run future of humanity to an exceptional degree. Whether this is true is itself contested, but the question bears directly on how present generations should act.</p>'
    },
    {
      id: 'mcluhans-aquarium',
      title: 'McLuhan’s Aquarium: The Fish in Water',
      coined: true,
      parent: 'civilisation-design',
      ref: 'McLuhan',
      html: '<p><em>McLuhan’s aquarium</em> draws on Marshall McLuhan’s observation that we do not know who discovered water, but we know it was not the fish. The environments we are most immersed in – media, technologies, economic systems – are the hardest to perceive. Seeing one’s own civilisation as an aquarium is a precondition for redesigning it.</p>'
    },
    {
      id: 'civilisational-sanity',
      title: 'Civilisational Sanity',
      coined: true,
      parent: 'coordination-and-governance',
      html: '<p><em>Civilisational sanity</em> is the capacity of a civilisation to perceive reality accurately, reason about it collectively and act in its own long-term interest. By analogy with individual mental health, a civilisation can become collectively insane – pursuing self-destructive courses despite knowing better – and restoring its sanity is a precondition for any successful transition.</p>'
    },
    {
      id: 'megamechanical-turk',
      title: 'Megamechanical Turk',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Mumford; Kempelen',
      html: '<p>The <em>megamechanical Turk</em> joins Lewis Mumford’s “megamachine” with the Mechanical Turk, the eighteenth-century chess automaton secretly operated by a hidden human. It names the vast socio-technical systems that appear automated and autonomous, but which in fact run on hidden human labour, judgement and attention distributed across the globe.</p>'
    },
    {
      id: 'mturkification',
      title: 'MTurkification',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Amazon Mechanical Turk',
      html: '<p><em>MTurkification</em>, after Amazon’s Mechanical Turk platform, describes the breaking-down of work into small, anonymous, piece-rate tasks distributed through digital platforms – labelling data, moderating content, completing micro-jobs. It turns human workers into interchangeable components of automated systems, often invisible to the people who use their output.</p>'
    },
    {
      id: 'unaligned-artificial-artificial-superintelligence',
      title: 'Unaligned Artificial Artificial Superintelligence',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Amazon MTurk slogan',
      html: '<p><em>Unaligned artificial artificial superintelligence</em> plays on “artificial artificial intelligence”, the slogan of Amazon’s Mechanical Turk, which used humans to perform tasks machines could not. It names collective systems of people and machines – corporations, markets, bureaucracies – that already act with superhuman capability, and are already misaligned with human wellbeing.</p>'
    },
    {
      id: 'planetary-reverse-turing-test',
      title: 'Planetary Reverse Turing Test',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Turing',
      html: '<p>The <em>planetary reverse Turing test</em> inverts Alan Turing’s test of whether a machine can pass as human. In a world saturated by artificial agents, humans must increasingly prove to machines, and to one another, that they are human – and a civilisation as a whole faces the test of whether its human judgement can still be distinguished from, and prevail over, automated processes.</p>'
    },
    {
      id: 'military-economic-maladaptation',
      title: 'Military Economic Maladaptation',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p><em>Military-economic maladaptation</em> is the flip side of military-economic adaptationism: the institutions selected for competitive success in war and trade become maladaptive once the stakes are planetary. Traits that once conferred advantage – expansion, secrecy, arms races, growth at any cost – now threaten the survival of the whole system that selected for them.</p>'
    },
    {
      id: 'negative-existential-externality',
      title: 'Negative Existential Externality',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p>A <em>negative existential externality</em> is a cost imposed on others that takes the form of existential risk: an activity profitable for those who undertake it, but which raises the probability of catastrophe for everyone. Because markets do not price such risks, they tend to be produced in excess – as by the race to deploy powerful technologies before they are safe.</p>'
    },
    {
      id: 'world-risk-factory',
      title: 'World-Risk Factory',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Beck (world risk society)',
      html: '<p>The <em>world-risk factory</em> describes the present world-system as a machine that manufactures risk as a by-product of its ordinary operation. Extending Ulrich Beck’s world risk society, it emphasises that risk is not an accident of modernity but one of its principal outputs, produced continuously by the same processes that generate wealth.</p>'
    },
    {
      id: '4e-global-catastrophic-risk',
      title: '4E Global Catastrophic Risk',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: '4E cognition',
      html: '<p><em>4E global catastrophic risk</em> applies the “4E” account of cognition – embodied, embedded, enacted and extended – to catastrophic risk from AI. Rather than locating danger in a single rogue system, it looks at how AI becomes embodied in infrastructure, embedded in institutions, enacted through markets and extended across the world-system, so that risk emerges from the whole.</p>'
    },
    {
      id: 'world-command-and-control-system',
      title: 'The World Command-and-Control System',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p>The <em>world command-and-control system</em> is the planetary apparatus of surveillance, communication, finance and military power through which the world-system is monitored and steered. Increasingly automated and interlinked, it raises the questions of who, or what, is actually in command, and what happens when its components act faster than any human can oversee.</p>'
    },
    {
      id: 'world-system-securitisation',
      title: 'World-System Securitisation',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Buzan, Wæver (securitisation)',
      html: '<p><em>World-system securitisation</em> applies securitisation theory, developed by Barry Buzan and Ole Wæver, which studies how issues are framed as existential threats to justify exceptional measures. As technology, climate, information and economics are each reframed as security issues, the world-system as a whole drifts towards a logic of emergency, secrecy and control.</p>'
    },
    {
      id: 'spontaneous-totalitarian-order',
      title: 'Spontaneous Totalitarian Order',
      coined: true,
      parent: 'complex-world-system-dynamics',
      ref: 'Hayek (spontaneous order)',
      html: '<p><em>Spontaneous totalitarian order</em> is the possibility that total control could emerge without any dictator or plan – arising spontaneously from the interaction of surveillance, platforms, markets and security systems, each pursuing its own logic. It inverts Hayek’s hope that spontaneous order protects freedom, suggesting that decentralised processes can also converge on its opposite.</p>'
    },
    {
      id: 'stable-inverted-totalitarianism',
      title: 'Stable Inverted Totalitarianism',
      parent: 'complex-world-system-dynamics',
      ref: 'Wolin',
      html: '<p><em>Inverted totalitarianism</em> is Sheldon Wolin’s term, from <em>Democracy Incorporated</em> (2008), for a system in which economic power dominates politics while democratic forms are retained – totalitarian in its reach, but managed rather than charismatic, and relying on apathy rather than mobilisation. Its stable form is one that has become self-perpetuating, with no crisis to disrupt it.</p>'
    },
    {
      id: 'demons-of-techno-capitalism',
      title: 'The Demons of Techno-Capitalism',
      coined: true,
      parent: 'complex-world-system-dynamics',
      html: '<p>The <em>demons of techno-capitalism</em> are the autonomous, impersonal forces produced by the fusion of technology and capital – optimisation processes, algorithms and market dynamics that act with apparent intention, pursuing growth, engagement and profit through human beings without any human fully directing them. Surveillance capitalism’s demons are one species of the wider family.</p>'
    },
    {
      id: 'marl-by-market-feedback',
      title: 'Multi-Agent Reinforcement Learning by Market Feedback',
      coined: true,
      parent: 'capital-and-growth',
      html: '<p><em>Multi-agent reinforcement learning by market feedback</em> describes the market economy as a vast learning system in which many agents – firms, investors, consumers – adjust their behaviour in response to rewards and penalties signalled by prices and profits. Like any reinforcement learner, it optimises the reward it is given, not the outcomes its designers intended.</p>'
    },
    {
      id: 'socio-economic-evolutionary-mismatch',
      title: 'Socio-Economic Evolutionary Mismatch',
      coined: true,
      parent: 'capital-and-growth',
      html: '<p><em>Socio-economic evolutionary mismatch</em> applies the biological concept of evolutionary mismatch – traits adapted to past environments that become harmful in new ones – to societies and economies. Human psychology evolved for small groups and local scarcity; institutions evolved for slower, smaller worlds. In a globalised, technological civilisation, both can drive behaviour that is no longer adaptive.</p>'
    },
    {
      id: 'the-capital-curse',
      title: 'The Capital Curse',
      coined: true,
      parent: 'capital-and-growth',
      html: '<p>The <em>capital curse</em> is an analogy to the resource curse and the intelligence curse: when capital becomes the principal source of wealth and power, those who hold it need less from everyone else. As automation increases the returns to capital relative to labour, the incentives that once bound elites to the welfare of the broader population weaken.</p>'
    },
    {
      id: 'endgame-capitalism-and-exterminism',
      title: 'Endgame Capitalism & Exterminism',
      coined: true,
      parent: 'capital-and-growth',
      ref: 'The Mechanist Win-Condition of Elite Class Warfare; Frase',
      html: '<p><em>Endgame capitalism</em> names the end-point of capitalism considered as a game: the win-condition in which an elite, owning the automated means of production, no longer depends on anyone else. Peter Frase, in <em>Four Futures</em> (2016), called one such future “exterminism” – abundance for the few combined with hierarchy, in which the rest of humanity becomes superfluous.</p>'
    },
    {
      id: '4e-intelligence',
      title: '4E Intelligence',
      coined: true,
      parent: 'ai-alignment',
      ref: '4E cognition',
      html: '<p><em>4E intelligence</em> applies the 4E account of cognition – embodied, embedded, enacted and extended – to intelligence in general. It holds that intelligence is not a property of an isolated brain or model, but arises from an agent’s body, environment, activity and tools, which has implications for how artificial intelligence should be understood and aligned.</p>'
    },
    {
      id: 'aligned-evolutionarily-stable-social-structure',
      title: 'Aligned Evolutionarily Stable Social Structure',
      coined: true,
      parent: 'replicators',
      ref: 'Maynard Smith & Price (ESS)',
      html: '<p>An <em>aligned evolutionarily stable social structure</em> draws on the evolutionarily stable strategy of John Maynard Smith and George Price (1973) – a strategy that cannot be displaced by any alternative once established. It names a social structure that is both good for its members and stable against competitive displacement, so that alignment does not depend on everyone choosing to cooperate.</p>'
    },
    {
      id: 'philosophical-frames',
      title: 'Philosophical Frames',
      parent: 'replicators',
      html: '<p><em>Philosophical frames</em> are the underlying conceptual lenses – assumptions about what exists, what matters and how things can be known – through which a problem is perceived and posed. The same situation looks different through different frames, and many apparently intractable problems are artefacts of the frame used to describe them.</p>'
    },
    {
      id: 'millers-box',
      title: 'Miller’s Box',
      parent: 'replicators',
      ref: 'Mark S. Miller & K. Eric Drexler, Comparative Ecology: A Computational Perspective (1988)',
      html: '<p><em>Miller’s box</em> refers to the comparative framework of Mark S. Miller, set out with K. Eric Drexler in “Comparative Ecology: A Computational Perspective” (1988). It places biological ecosystems, human markets and computational systems side by side as kinds of <em>ecology</em> – systems in which many independent agents compete and cooperate without a central planner – and compares them along the features that shape what can evolve in each: whether agents act with foresight or only through blind variation and selection, and whether the boundaries of agents and their property are respected (trade) or routinely violated (predation, parasitism, theft). Biological evolution sits at one corner of the box, markets at another, and well-designed computational ecosystems – where boundaries can be enforced by the architecture itself – open corners that neither nature nor human institutions have occupied. The box is a tool for asking which kind of ecology a civilisation, or a population of AI agents, is building, and so which <a href="#replicators">replicators</a> it will select for.</p>'
    },
    {
      id: 'complex-adaptive-agency',
      title: 'Any Sufficiently Complex and Adaptive System Is Indistinguishable from Intelligent Agency',
      coined: true,
      parent: 'replicators',
      ref: 'Clarke’s third law (form)',
      html: '<p>This principle, modelled on Arthur C. Clarke’s third law, holds that any sufficiently complex and adaptive system – a market, a bureaucracy, an ecosystem – behaves in ways indistinguishable from the actions of an intelligent agent pursuing goals. Whether or not such systems “really” have minds, treating them as agents may be the most accurate way to predict and govern them.</p>'
    },
    {
      id: 'behaviour-of-a-system',
      title: 'The Behaviour of a System Is What It Is',
      coined: true,
      parent: 'replicators',
      ref: 'Beer (POSIWID)',
      html: '<p><em>The behaviour of a system is what it is</em> echoes Stafford Beer’s principle that “the purpose of a system is what it does”. A system should be understood by what it actually produces, not by its stated intentions or design. If a system consistently produces harm, that harm is, functionally, part of what the system is.</p>'
    },
    {
      id: 'philosophical-paradigms',
      title: 'Philosophical Paradigms',
      parent: 'replicators',
      ref: 'Kuhn',
      html: '<p><em>Philosophical paradigms</em> are the comprehensive worldviews – materialism, idealism, mechanism, process philosophy and others – that set the terms within which whole fields of thought operate. Like Kuhn’s scientific paradigms, they change rarely and with difficulty, and a civilisational transition may require a shift at this deepest level.</p>'
    },
    {
      id: 'hyper-agential-hyper-realism',
      title: 'Hyper-Agential Hyper-Realism',
      coined: true,
      parent: 'replicators',
      html: '<p><em>Hyper-agential hyper-realism</em> is a stance that takes seriously the reality and agency of large-scale, non-human systems – markets, states, algorithms, technologies – as actors more powerful than individuals. It treats these hyper-agents as real forces to be analysed and negotiated with, rather than as abstractions reducible to the people within them.</p>'
    },
    {
      id: 'cybernetic-neo-platonism',
      title: 'Cybernetic Neo-Platonism',
      coined: true,
      parent: 'replicators',
      html: '<p><em>Cybernetic neo-Platonism</em> joins cybernetics with the Platonic tradition: it treats the patterns, forms and organising principles of systems – feedback, information, structure – as more fundamental than their material substrates. The same form of organisation can be realised in cells, societies or machines, and it is the form, not the matter, that explains behaviour.</p>'
    },
    {
      id: 'computational-mechanism',
      title: 'Computational Mechanism',
      coined: true,
      parent: 'replicators',
      ref: 'alt: Neomechanism',
      html: '<p><em>Computational mechanism</em>, or neomechanism, is the renewal of the mechanistic worldview in computational form: the view that minds, lives and societies can be understood as information-processing systems. It succeeds the clockwork mechanism of the early modern period, and underlies both the promise of AI and the tendency to treat everything as computable.</p>'
    },
    {
      id: 'the-techno-onto-logical',
      title: 'The Techno-Onto-Logical',
      coined: true,
      parent: 'replicators',
      ref: 'Technological Rationality; Heidegger; Marcuse',
      html: '<p>The <em>techno-onto-logical</em> names the way technology shapes what counts as real and how things show up at all. It draws on Heidegger’s account of modern technology as “enframing”, which reveals everything as a resource, and on Herbert Marcuse’s “technological rationality”, in which the logic of efficiency and control becomes the logic of thought itself.</p>'
    },
    {
      id: 'ai-as-anthropological-mirror',
      title: 'AI as Anthropological Mirror',
      coined: true,
      parent: 'replicators',
      html: '<p><em>AI as anthropological mirror</em> treats artificial intelligence as a reflection of the civilisation that produces it. Trained on human data and shaped by human incentives, AI systems reveal – often starkly – the values, biases, priorities and blind spots of the societies that build them. What we fear in AI may be what we have not faced in ourselves.</p>'
    },
    {
      id: 'limits-to-alignment',
      title: 'Limits to Alignment',
      parent: 'alignment-and-futures',
      html: '<p><em>Limits to alignment</em> considers the possibility that some forms of alignment – of AI with human values, or of human institutions with collective wellbeing – are impossible in principle, not merely difficult. Values may be inconsistent, contested or unknowable, and powerful optimisers may inevitably drift. Recognising such limits shapes what can reasonably be hoped for.</p>'
    },
    {
      id: 'misaligned-world-hypothesis',
      title: 'Misaligned World Hypothesis',
      coined: true,
      parent: 'alignment-and-futures',
      ref: 'Bostrom (Vulnerable World Hypothesis)',
      html: '<p>The <em>misaligned world hypothesis</em>, modelled on Nick Bostrom’s vulnerable world hypothesis, proposes that the world is already governed by misaligned optimisers – markets, states and institutions pursuing goals that diverge from human wellbeing. On this view, AI alignment is not a new problem but a new instance of an old one: civilisation itself has never been aligned.</p>'
    },
    {
      id: 'value-assimilation-and-misalignment-cascades',
      title: 'The Value Assimilation Problem & Misalignment Cascades',
      coined: true,
      parent: 'alignment-and-futures',
      html: '<p>The <em>value assimilation problem</em> is the difficulty of absorbing new values, technologies or institutions into a civilisation without their distorting its existing values. <em>Misalignment cascades</em> describe how a misalignment at one level – a metric, an incentive, a system – propagates through the others, each amplifying the error until it reshapes the whole.</p>'
    },
    {
      id: 'the-emergence-model',
      title: 'The Emergence Model',
      parent: 'civilisation-design',
      ref: 'The Emergence Project (Daniel Schmachtenberger et al.); Wilber, four quadrants',
      html: '<p><em>The emergence model</em> is the conceptual framework of the Emergence Project, a think tank associated with Daniel Schmachtenberger that set out to understand why humanity’s global challenges keep arising and how to address them at their root. Its premise is that nearly all of those challenges are human-caused, and that human behaviour is not fixed by nature but <em>conditioned</em> – so lasting solutions must change the structures that condition it, rather than treat symptoms within the systems that produce them.</p><p>Adapted from Ken Wilber’s four-quadrant <a href="#integral-theory">integral</a> model, it sorts every factor that conditions human behaviour into four quadrants, each fundamental and irreducible to the others, and all bound together by feedback loops:</p><ul><li><strong>Infrastructure:</strong> modes of production, energy, agriculture, water, transport, building and waste.</li><li><strong>Social structure:</strong> economics, governance and law.</li><li><strong>Memetic structure:</strong> values, beliefs, meaning, worldview, identity, orienting narratives and definitions of success.</li><li><strong>Physiological structure:</strong> nutrition, neurobiology, endocrinology, epigenetics and toxicity.</li></ul><p>Within each quadrant, the model catalogues the “metastructures” those structures can take, as criteria for replacing harm-externalising structures with omni-considerate ones. Its aim is the intentional emergence of an omni-considerate, integrally developed and effectively self-governing global civilisation – a transition from an adolescent phase of consumption and growth to a mature one of homeostasis, synergy and regeneration. The four structures of <a href="#civilisation-design">civilisation design</a> on this map – <a href="#infra-structure-global-redesign-institute">infra-structure</a>, <a href="#inter-structure-democracy-3">inter-structure</a>, <a href="#coherence-of-civilisations">super-structure</a> and <a href="#biowisdom">intra-structure</a> – follow the same logic.</p>'
    },
    {
      id: 'inter-structure-democracy-3',
      title: 'Inter-structure: Democracy 3.0',
      parent: 'civilisation-design',
      html: '<p><em>Democracy 3.0</em> names a next generation of democratic governance – after the direct democracy of antiquity and the representative democracy of the modern nation-state – using digital tools, deliberative processes and collective intelligence to enable participation and coordination at scales and speeds that current institutions cannot. As inter-structure, it concerns the relations between people and institutions.</p>'
    },
    {
      id: 'infra-structure-global-redesign-institute',
      title: 'Infra-structure: Global Redesign Institute',
      parent: 'civilisation-design',
      ref: 'Zeitgeist Movement',
      html: '<p>A <em>global redesign institute</em> is an institution dedicated to the redesign of the world’s physical and technical infrastructure – energy, production, transport, housing – according to scientific and ecological principles and the needs of all people. As infra-structure, it concerns the material base on which the other layers of a civilisation rest.</p>'
    },
    {
      id: 'capitalist-theodicy',
      title: 'The Capitalist Best of All Possible World-Systems Theodicy',
      coined: true,
      parent: 'civilisation-design',
      ref: 'Leibniz; Voltaire',
      html: '<p>The <em>capitalist best of all possible world-systems theodicy</em> satirises the belief that the present economic order, whatever its evils, is the best achievable. It echoes Leibniz’s claim that ours is the best of all possible worlds, mocked by Voltaire through Dr Pangloss in <em>Candide</em> (1759), and names the justifications that make the suffering of the present seem necessary.</p>'
    },
    {
      id: 'tyranny-of-the-cosmic-majority',
      title: 'Tyranny of the Cosmic Majority',
      coined: true,
      parent: 'moral-theory',
      ref: 'Tocqueville, Mill (tyranny of the majority)',
      html: '<p>The <em>tyranny of the cosmic majority</em> extends the “tyranny of the majority” described by Tocqueville and Mill to cosmic and long-run scales. If the interests of vast numbers of future or potential beings dominate moral reasoning, present people – or any minority of minds – may be sacrificed to the calculated interests of an overwhelming majority that does not yet exist.</p>'
    },
    {
      id: 'tyranny-of-the-multiplicity',
      title: 'Tyranny of the Multiplicity/Tolerance',
      coined: true,
      parent: 'moral-theory',
      ref: 'Popper (paradox of tolerance)',
      html: '<p>The <em>tyranny of the multiplicity</em>, or of tolerance, is the danger that unlimited pluralism and tolerance leave a society unable to act on any shared values at all – or unable to defend itself against the intolerant, as Karl Popper’s paradox of tolerance warns. Its counterpart is the tyranny of any single vision imposed on all.</p>'
    },
    {
      id: 'the-sociological-post-mortem',
      title: 'The Sociological Post-Mortem',
      coined: true,
      parent: 'moral-theory',
      html: '<p>The <em>sociological post-mortem</em> is the exercise of imagining a civilisation’s failure after the fact and asking what caused it – which institutions failed, which warnings were ignored, which incentives made the outcome likely. Performed in advance, it turns hindsight into foresight, identifying what must change before the post-mortem becomes real.</p>'
    },
    {
      id: 'epistemic-principal-agent-problem',
      title: 'The Epistemic Principal-Agent Problem',
      coined: true,
      parent: 'moral-theory',
      html: '<p>The <em>epistemic principal-agent problem</em> arises when those who produce and interpret knowledge on society’s behalf – experts, media, institutions, algorithms – have incentives that diverge from the public’s interest in the truth. As with any principal-agent problem, the public cannot fully monitor its agents, and the knowledge it receives is shaped by their interests.</p>'
    },
    {
      id: 'epistemic-semi-anarchic-default-condition',
      title: 'The Epistemic Semi-Anarchic Default Condition',
      coined: true,
      parent: 'moral-theory',
      ref: 'Bostrom (Vulnerable World Hypothesis)',
      html: '<p>The <em>epistemic semi-anarchic default condition</em> applies Nick Bostrom’s “semi-anarchic default condition” – a world with limited capacity for preventive policing and global governance – to knowledge. Without institutions able to coordinate what a society collectively knows and believes, its information environment defaults to a semi-anarchic state in which misinformation and manipulation go largely unchecked.</p>'
    },
    {
      id: 'metatheory',
      title: 'Metatheory',
      parent: 'civilisation-theory',
      kind: 'category',
      order: 6,
      html: '<p><em>Metatheory</em> is theory about theories: the study of the frameworks, assumptions and methods through which the world is understood, and of how different theories relate, conflict and might be integrated. It gathers the sciences of systems, evolution and strategy, the critical tradition, theories of technology and the study of replicators on which the rest of the map draws.</p>'
    },
    {
      id: 'macrohistory',
      title: 'Macrohistory',
      parent: 'civilisation-theory',
      kind: 'category',
      order: 7,
      html: '<p><em>Macrohistory</em> is the study of history at the largest scales – the long-run patterns, stages and trajectories of civilisations, and the forces that drive them. It asks whether history has a direction, how civilisations rise and fall, and where the present sits within the arc of human and planetary history.</p>'
    },
    {
      id: 'macrosociology',
      title: 'Macrosociology',
      parent: 'civilisation-theory',
      kind: 'category',
      order: 8,
      html: '<p><em>Macrosociology</em> studies societies as wholes – their structures of power, institutions, cultures and systems of meaning – and how these shape and are shaped by the people within them. It examines how power is exercised and legitimated, and how a civilisation’s culture enables, or prevents, it from understanding itself.</p>'
    }
  ];

  var byId = {};
  CONCEPTS.forEach(function (c) { byId[c.id] = c; });
  var ROOT = CONCEPTS.filter(function (c) { return !c.parent; })[0];

  // Site pages: routed like concepts, but not part of the tree, index or concept count.
  var PAGES = {
    'the-map': { id: 'the-map', title: 'The Map', parent: ROOT.id, html: MAP_INTRO + '\n<!--INDEX-->' },
    'infinite': { id: 'infinite', title: 'Infinite', parent: ROOT.id,
      html: '<p>Every concept on the map in one continuous sequence of slides. Scroll to move from one to the next – through every concept A–Z, or through one of the nine sections.</p>\n<!--SLIDES-->' },
    'search': { id: 'search', title: 'Search', parent: ROOT.id, html: '<!--SEARCH-->' }
  };

  // Alphabetical order ignores a leading “The”, “A” or “An”.
  function sortKey(c) { return c.title.replace(/^(the|an?)\s+/i, ''); }
  function byTitle(a, b) { return sortKey(a).localeCompare(sortKey(b)); }
  function isConcept(c) { return c !== ROOT && c.kind !== 'category'; }
  function childrenOf(id) {
    return CONCEPTS.filter(function (c) { return c.parent === id; })
      .sort(function (a, b) { return ((a.order || 1000) - (b.order || 1000)) || byTitle(a, b); });
  }
  function pathTo(c) {
    var path = [];
    while (c) { path.unshift(c); c = c.parent ? byId[c.parent] : null; }
    return path;
  }
  function esc(s) {
    return s.replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }
  function href(c) { return c === ROOT ? '#' : '#' + c.id; }

  // ---------- Sidebar tree ----------
  function buildTree(c) {
    var kids = childrenOf(c.id);
    var html = '<li' + (c.kind === 'category' ? ' class="is-category"' : '') + '><a href="' + href(c) + '" data-id="' + c.id + '">' + esc(c.title) + '</a>';
    if (kids.length) html += '<ul>' + kids.map(buildTree).join('') + '</ul>';
    return html + '</li>';
  }
  var treeEl = document.getElementById('tree');
  var pageLinks = document.querySelectorAll('#sidebar [data-page], #site-header .head-icons [data-page]');
  treeEl.innerHTML = buildTree(ROOT) +
    (CONCEPTS.length === 1 ? '<li class="empty">Concepts forthcoming.</li>' : '');

  // ---------- Entry rendering ----------
  function indexHtml() {
    var concepts = CONCEPTS.filter(isConcept).sort(byTitle);
    // Same nested tree as the sidebar: the root, with each concept under its parent.
    function branch(c) {
      var kids = childrenOf(c.id);
      var cls = (c.kind === 'category' ? 'is-category' : '') + (kids.length ? ' has-kids' : '');
      return '<li' + (cls ? ' class="' + cls.trim() + '"' : '') + (c.kind === 'category' ? ' id="idx-' + c.id + '"' : '') + '><a href="' + href(c) + '">' + esc(c.title) + '</a>' +
        (kids.length ? '<ul>' + kids.map(branch).join('') + '</ul>' : '') + '</li>';
    }
    // Menu of the sections and their categories, in three columns (one per set of three sections).
    var SETS = ['Civilisational', 'Meta', 'Macro'];
    var NUMERALS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
    var sections = childrenOf(ROOT.id);
    var menu = '<nav class="index-menu" aria-label="Sections">' +
      '<div class="menu-cols">' +
      SETS.map(function (label, k) {
        return '<div class="menu-col"><p class="menu-set">' + label + '</p><ul>' +
          sections.slice(k * 3, k * 3 + 3).map(function (d, j) {
            var cats = childrenOf(d.id).filter(function (c) { return c.kind === 'category'; });
            return '<li class="menu-sec"><span class="menu-num">' + NUMERALS[k * 3 + j] + '</span><div>' +
              '<a href="#" data-jump="idx-' + d.id + '" class="menu-section">' + esc(d.title) + '</a>' +
              (cats.length ? '<div class="menu-cats">' + cats.map(function (c) {
                return '<span><a href="#" data-jump="idx-' + c.id + '">' + esc(c.title) + '</a></span>';
              }).join('') + '</div>' : '') + '</div></li>';
          }).join('') + '</ul></div>';
      }).join('') + '</div></nav>';
    // Sectioned by domain: each top-level category is a section with its own heading and
    // description, and its groups laid out in columns beneath.
    function countIn(id) {
      var n = 0;
      (function walk(x) { childrenOf(x).forEach(function (k) { if (isConcept(k)) n++; walk(k.id); }); })(id);
      return n;
    }
    // Overview above the menu, in the same form as the Conceptual Engineerings introduction.
    var overview = '<h3 class="ce-title">Category Tree</h3>' +
      '<p class="ce-desc">The map is organised as a tree. Its ' + (sections.length === 9 ? 'nine' : sections.length) + ' sections come in three sets – ' +
      '<em>civilisational</em> (mechanics, design, transition), <em>meta</em> (crisis, modernism, theory) ' +
      'and <em>macro</em> (history, sociology, strategy). ' +
      'Each section is divided into categories, and each concept sits under the category it belongs to, ' +
      'with closely related concepts nested beneath it. Use the menu below to navigate.</p>';
    var tree = concepts.length ? '<div class="index-list">' + overview +
      menu +
      childrenOf(ROOT.id).map(function (d, i) {
        var tmp = document.createElement('div');
        tmp.innerHTML = d.html;
        var n = countIn(d.id);
        // Sections come in sets of three; a stronger rule opens each set.
        return '<section class="index-domain' + (i % 3 === 0 ? ' set-start' : '') + '" id="idx-' + d.id + '">' +
          '<p class="domain-label">' + (NUMERALS[i] || i + 1) + ' · ' + n + (n === 1 ? ' concept' : ' concepts') + '</p>' +
          '<h3 class="domain-title"><a href="' + href(d) + '">' + esc(d.title) + '</a></h3>' +
          // First sentence only; the full description is on the section's own page.
          (d.kind === 'category' ? '<p class="domain-desc">' + esc(tmp.textContent.split(/(?<=[.:])\s+(?=[A-Z])/)[0]) + '</p>' : '') +
          '<ul class="index-cols">' + childrenOf(d.id).map(branch).join('') + '</ul></section>';
      }).join('') + '</div>' : '';
    // Alternative A–Z view: every concept alphabetically, grouped by first letter.
    var letters = {};
    concepts.forEach(function (c) {
      var L = sortKey(c).charAt(0).toUpperCase();
      if (!/[A-Z]/.test(L)) L = '0–9';  // numbers gathered after Z
      (letters[L] = letters[L] || []).push(c);
    });
    // Letters are dealt across three columns in turn (A, B, C, then D under A…), and each column
    // stacks at its own height, so a short letter leaves no gap beside a long one.
    var azCols = ['', '', ''];
    Object.keys(letters).sort(function (a, b) {
      return (a === '0–9') - (b === '0–9') || a.localeCompare(b);
    }).forEach(function (L, i) {
      azCols[i % 3] += '<section class="az-group" style="order:' + i + '"><h3 class="az-letter">' + L + '</h3><ul>' +
        letters[L].map(function (c) { return '<li><a href="' + href(c) + '">' + esc(c.title) + '</a></li>'; }).join('') +
        '</ul></section>';
    });
    var nLetters = Object.keys(letters).filter(function (L) { return L !== '0–9'; }).length;  // A–Z only
    var az = '<div class="az-view"><h3 class="ce-title">Alphabetical A–Z</h3>' +
      '<p class="ce-desc">Every concept on the map organised into an alphabetical list.</p>' +
      '<p class="ce-intro">Concepts: ' + concepts.length + ' · Letters: ' + nLetters + '</p>' +
      '<div class="az-list">' + azCols.map(function (col) { return '<div class="az-col">' + col + '</div>'; }).join('') + '</div></div>';
    // Conceptual Engineerings: the author's own novel terms, alphabetically.
    var coined = concepts.filter(function (c) { return c.coined; });
    var ce = '<div class="ce-list">' +
      '<h3 class="ce-title">Conceptual Engineerings</h3>' +
      '<p class="ce-desc"><em>Conceptual engineering</em> is the practice of designing, revising and inventing concepts so that they better serve the work of understanding – treating the concepts we think with as tools that can be improved. The terms below are the map’s own conceptual engineerings: novel concepts coined to name dynamics, problems and possibilities for which existing language had no adequate word.</p>' +
      '<p class="ce-intro">Novel terms: ' + coined.length + '</p><ul>' +
      coined.map(function (c) { return '<li><a href="' + href(c) + '">' + esc(c.title) + '</a></li>'; }).join('') +
      '</ul></div>';
    // The three views as a row of tabs, each with its own tally beneath its name.
    function tab(view, name, meta) {
      return '<button type="button" data-view="' + view + '"><span class="tab-name">' + name + '</span>' +
        '<span class="tab-meta">' + meta + '</span></button>';
    }
    return '<nav class="index-view index-tabs" aria-label="Index view">' +
      tab('tree', 'Category Tree', sections.length + ' sections · ' + concepts.length + ' concepts') +
      tab('az', 'Alphabetical A–Z', nLetters + ' letters · ' + concepts.length + ' concepts') +
      tab('ce', 'Conceptual Engineerings', coined.length + ' novel terms') + '</nav>' +
      tree + (concepts.length ? az + ce : '');
  }

  // A category page lists everything filed under it, nested as in the tree.
  function categoryHtml(cat) {
    var n = 0;
    function branch(c) {
      if (isConcept(c)) n++;
      var kids = childrenOf(c.id);
      return '<li' + (c.kind === 'category' ? ' class="is-category"' : '') + '><a href="' + href(c) + '">' + esc(c.title) + '</a>' +
        (kids.length ? '<ul>' + kids.map(branch).join('') + '</ul>' : '') + '</li>';
    }
    var list = childrenOf(cat.id).map(branch).join('');
    return '<p class="count"><span>Concepts: ' + n + '</span></p><ul class="branch-list">' + list + '</ul>';
  }

  // k = how many of the earliest nodes step out into the vertical stack above the line.
  function crumbsHtml(c, k) {
    var nodes = pathTo(c).map(function (p, i, arr) {
      return i === arr.length - 1
        ? '<span class="node">' + esc(p.title) + '</span>'
        : '<a class="node" href="' + href(p) + '">' + esc(p.title) + '</a>';
    });
    if (!k) return nodes.join('<span class="sep">&gt;</span><wbr>');
    // Each stacked node keeps its arrow, pointing on to the next line.
    return '<span class="ts-stack">' + nodes.slice(0, k).map(function (n) {
      return '<span class="ts-row">' + n + '<span class="sep">&gt;</span></span>';
    }).join('') + '</span>' +
      '<span class="ts-line">' + nodes.slice(k).join('<span class="sep">&gt;</span><wbr>') + '</span>';
  }

  // Keep each tree string to a single line: if it wraps, move its earliest nodes into the stack,
  // one at a time, until the remainder fits. Only strings that actually wrap are touched.
  function crumbTarget(el) {
    var host = el.closest('[data-id]');
    var id = host ? host.getAttribute('data-id') : el.getAttribute('data-for');
    return byId[id] || PAGES[id];
  }
  // An entry with concepts nested under it would otherwise be too tall to centre and start at the
  // top; instead its own part (tree string, title, description) is centred on screen as a short
  // entry would be, and the list of nested concepts follows below the fold.
  function centreEntry() {
    var main = document.querySelector('main');
    main.style.paddingTop = '';
    main.style.justifyContent = '';
    var list = document.querySelector('#entry .description > p.count');
    if (!list || document.documentElement.classList.contains('main-page')) return;
    var article = document.getElementById('entry');
    var own = list.getBoundingClientRect().top - article.getBoundingClientRect().top;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    main.style.justifyContent = 'flex-start';
    main.style.paddingTop = Math.max(5 * rem, (window.innerHeight - own) / 2) + 'px';
  }
  function fitCrumbs() {
    fitTitle();
    fitCrumbsOnly();
    centreEntry();
  }
  // A title only a little too long for the column is set slightly smaller to keep it on one
  // line; one that would need shrinking by more than a fifth wraps at full size as usual.
  function fitTitle() {
    var h = document.querySelector('#entry > h1');
    if (!h) return;
    h.style.fontSize = ''; h.style.whiteSpace = 'nowrap';
    var over = h.scrollWidth / h.clientWidth;
    if (over > 1 && over <= 1.25) h.style.fontSize = (parseFloat(getComputedStyle(h).fontSize) / over * 0.995) + 'px';
    else if (over > 1) h.style.whiteSpace = '';
  }
  function fitCrumbsOnly() {
    var els = [].slice.call(document.querySelectorAll('#entry p.tree-string:not(.slide-meta), #entry .slide-meta .crumbs'));
    els.forEach(function (el) {
      var c = crumbTarget(el);
      if (c && el.querySelector('.ts-stack')) el.innerHTML = crumbsHtml(c, 0);
    });
    var wrapping = els.filter(function (el) {
      var nodes = el.querySelectorAll('.node');
      return nodes.length > 1 && nodes[0].getBoundingClientRect().top !== nodes[nodes.length - 1].getBoundingClientRect().top;
    });
    wrapping.forEach(function (el) {
      var c = crumbTarget(el);
      if (!c) return;
      var n = pathTo(c).length;
      for (var k = 1; k < n; k++) {
        el.innerHTML = crumbsHtml(c, k);
        var line = el.querySelectorAll('.ts-line .node');
        if (line[0].getBoundingClientRect().top === line[line.length - 1].getBoundingClientRect().top) break;
      }
    });
  }

  // Continuous slide view: every concept as a full-screen slide. A menu picks the deck: every
  // concept A–Z, or one of the nine sections with its concepts in tree order.
  function slidesHtml() {
    var SETS = ['Civilisational', 'Meta', 'Macro'];
    var NUMERALS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'];
    var sections = childrenOf(ROOT.id);
    var az = CONCEPTS.filter(isConcept).sort(byTitle);
    function inTreeOrder(id) {
      var out = [];
      (function walk(x) { childrenOf(x).forEach(function (k) { if (isConcept(k)) out.push(k); walk(k.id); }); })(id);

    if (!items.length) return;
    spSel = (spSel + d + items.length) % items.length;
    items.forEach(function (li, i) { li.classList.toggle('sel', i === spSel); });
    items[spSel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function initSearchPage() {
    var input = document.getElementById('sp-input');
    input.value = lastQuery;
    runSearchPage();
    input.addEventListener('input', runSearchPage);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSearchPage(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearchPage(-1); }
      else if (e.key === 'Enter') {
        var sel = document.querySelector('#sp-results li.sel a');
        if (sel) { e.preventDefault(); sel.click(); }
      } else if (e.key === 'Escape') { input.value = ''; runSearchPage(); }
    });
    setTimeout(function () { input.focus({ preventScroll: true }); input.setSelectionRange(input.value.length, input.value.length); }, 0);
  }

  // Hudless mode: the interface fades out on H and fades back in on a second press (or Escape).
  var hudTimer;
  function setHudless(on) {
    var root = document.documentElement;
    root.classList.add('hud-fade');
    root.classList.toggle('hudless', on);
    if (on) setSidebar(false, false);
    clearTimeout(hudTimer);
    hudTimer = setTimeout(function () { root.classList.remove('hud-fade'); }, 650);
  }

  // ---------- Entry header: icons folded into a menu icon, unfolded while the pointer is near ----------
  var foldIconsTimer;
  var headMenu = document.createElement('button');
  headMenu.id = 'head-menu';
  headMenu.type = 'button';
  headMenu.setAttribute('aria-label', 'Show menu');
  headMenu.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true"><line x1="12" y1="26" x2="88" y2="26"/><line x1="12" y1="50" x2="88" y2="50"/><line x1="12" y1="74" x2="88" y2="74"/></svg>';
  document.body.appendChild(headMenu);
  // How far each icon travels: from where it sits to the corner, where the menu icon appears.
  function measureIconFold() {
    var target = headMenu.getBoundingClientRect();
    var cx = target.left + target.width / 2;
    document.querySelectorAll('#site-header .head-icons > *').forEach(function (el) {
      if (!el.offsetParent) return;
      el.style.setProperty('--fold-x', '0px');
      var r = el.getBoundingClientRect();
      el.style.setProperty('--fold-x', (cx - (r.left + r.width / 2)) + 'px');
    });
  }
  function openIcons() { document.documentElement.classList.add('icons-open'); }
  headMenu.addEventListener('mouseenter', openIcons);
  headMenu.addEventListener('click', openIcons);   // touch screens
  // Folds again once the pointer leaves the strip holding the icons and the theme toggle.
  document.addEventListener('mousemove', function (e) {
    var root = document.documentElement;
    if (!root.classList.contains('icons-open') || !root.classList.contains('icons-folded')) return;
    var nav = document.querySelector('#site-header .head-icons').getBoundingClientRect();
    if (e.clientX < nav.left - 16 || e.clientY > nav.bottom + 16) root.classList.remove('icons-open');
  });
  window.addEventListener('resize', function () { if (document.documentElement.classList.contains('icons-folded')) measureIconFold(); });

  // ---------- Keyboard shortcuts: Backspace = top (then back), Space = map, T = theme, C = accent links, M = sound, H = hudless ----------
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var el = e.target;
    if (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && document.documentElement.classList.contains('snap-slides')) {
      e.preventDefault();
      // Holding an arrow key steps slide by slide at a steady pace (each step pressing the button),
      // rather than firing on every key repeat.
      var now = Date.now();
      if (!e.repeat || now - lastSlideStep >= 650) {
        lastSlideStep = now;
        (e.key === 'ArrowDown' ? nextBtn : prevBtn).click();
      }
    } else if (e.key === 'Backspace') {
      // First to the top of the page; once already at the top, back to the previous page.
      e.preventDefault();
      if (window.scrollY > 4) topBtn.click();
      else if (!document.documentElement.classList.contains('page-home')) backBtn.click();
    } else if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (!e.repeat && !document.body.classList.contains('footer-in-view') && !document.documentElement.classList.contains('hudless')) sideBtn.click();
    } else if ((e.key === 't' || e.key === 'T') && !e.repeat) {
      document.getElementById('theme-toggle').click();
    } else if ((e.key === 'c' || e.key === 'C') && !e.repeat) {
      // Cycle: off → first accent → second accent (themes that have one) → off
      var root = document.documentElement, state;
      if (!root.classList.contains('accent')) state = 'on';
      else if (!root.classList.contains('accent-alt') && root.getAttribute('data-theme') === 'light') state = 'alt';
      else state = 'off';
      root.classList.toggle('accent', state !== 'off');
      root.classList.toggle('accent-alt', state === 'alt');
      try { localStorage.setItem('ct-accent', state); } catch (err) {}
    } else if (e.key === '/') {
      e.preventDefault();
      openSearchPage('');
    } else if ((e.key === 'h' || e.key === 'H') && !e.repeat) {
      // Hudless: hide every piece of interface and the tree string, leaving only the page itself.
      setHudless(!document.documentElement.classList.contains('hudless'));
    } else if (e.key === 'Escape' && document.documentElement.classList.contains('hudless')) {
      setHudless(false);
    } else if ((e.key === 'm' || e.key === 'M') && !e.repeat) {
      soundOn = !soundOn;
      try { localStorage.setItem('ct-sound', soundOn ? 'on' : 'off'); } catch (err) {}
      if (soundOn) chime();
    }
  });

  // ---------- Footer: title, description, menus and shortcuts ----------
  (function buildFooter() {
    var f = document.getElementById('site-footer');
    var concepts = CONCEPTS.filter(isConcept);
    var coined = concepts.filter(function (c) { return c.coined; }).length;
    var sections = childrenOf(ROOT.id);
    var NUM = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'];
    function group(title, items) { return '<p class="foot-head">' + title + '</p><ul>' + items.join('') + '</ul>'; }
    function li(inner) { return '<li>' + inner + '</li>'; }
    f.innerHTML = '<div class="foot-inner"><div class="foot-main">' +
      '<div class="foot-lede">' +
        '<p class="foot-title"><a href="#">Civilisation Theory Map</a></p>' +
        '<p class="foot-desc">A conceptual adaptive system: a map of the concepts needed to understand civilisation – its mechanics, design and transition.</p>' +
        '<p class="foot-stats"><span>' + concepts.length + ' Concepts</span> <span>' + coined + ' Conceptual Engineerings</span></p>' +
      '</div>' +
      '<div class="foot-cols"><div class="foot-col">' +
        // Explore: the same icons as the header (home, map, search)
        '<p class="foot-head">Explore</p><nav class="head-icons foot-icons" aria-label="Explore">' +
          document.querySelector('#site-header .head-icons').innerHTML.replace(/ data-page="[^"]*"/g, '') + '</nav>' +
        '</div><div class="foot-col foot-sections"><p class="foot-head">Sections</p><div class="foot-secs">' +
        [0, 3, 6].map(function (k) {
          return '<ul>' + sections.slice(k, k + 3).map(function (d, j) {
            return li('<span class="foot-num">' + NUM[k + j] + '</span><a href="' + href(d) + '">' + esc(d.title) + '</a>');
          }).join('') + '</ul>';
        }).join('') +
      '</div></div></div></div>' +
      '</div>';
    f.addEventListener('click', function (e) {
      var v = e.target.closest('[data-view-link]');
      if (v) {
        var view = v.getAttribute('data-view-link');
        document.documentElement.setAttribute('data-index', view);
        try { localStorage.setItem('ct-index', view); } catch (err) {}
        // Already on the Map: no hash change, so bring the index into view by hand.
        if (location.hash === '#the-map') {
          e.preventDefault();
          var t = document.querySelector('#entry .index-tabs');
          if (t) window.scrollTo({ top: window.scrollY + t.getBoundingClientRect().top - 40, behavior: 'smooth' });
        }
      }
    });
  })();

  // Once the footer scrolls into view the sidebar closes and its toggle hides, until the footer
  // is scrolled back out of view.
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      var inView = entries[entries.length - 1].isIntersecting;
      document.body.classList.toggle('footer-in-view', inView);
      if (inView && !document.body.classList.contains('sidebar-closed')) setSidebar(false, false);
    }).observe(document.getElementById('site-footer'));
  }

  // Every load or refresh opens the homepage: drop any concept slug left in the URL.
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  render();

  // ---------- Loading screen: type the title, then fade out (any key or click skips) ----------
  (function () {
    var loader = document.getElementById('loader');
    var out = document.getElementById('loader-text');
    var title = 'Civilisation Theory';
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finished = false, timer;
    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      out.textContent = title;
      fillRing(title.length);
      loader.classList.add('done');
      document.removeEventListener('keydown', skip, true);
      document.removeEventListener('pointerdown', skip, true);
    }
    function skip(e) { e.preventDefault(); e.stopPropagation(); finish(); }
    document.addEventListener('keydown', skip, true);
    document.addEventListener('pointerdown', skip, true);

    var ring = document.getElementById('loader-fill');
    // Keep the ring's line about 1.4px thick whatever its (very large) size.
    var ringSvg = document.querySelector('.loader-ring');
    function ringStroke() {
      var w = ringSvg.getBoundingClientRect().width || 1;
      ringSvg.querySelectorAll('circle').forEach(function (c) { c.style.strokeWidth = String(1.4 * 400 / w); });
    }
    ringStroke();
    window.addEventListener('resize', ringStroke);
    var RING_C = 2 * Math.PI * 180;
    function fillRing(i) {
      ring.style.strokeDashoffset = String(RING_C * (1 - i / title.length));
      // Once complete, draw a solid circle so no seam or gap can remain at the join.
      if (i >= title.length) setTimeout(function () { ring.style.strokeDasharray = 'none'; }, 80);
    }
    function type(i) {
      out.textContent = title.slice(0, i);
      fillRing(i);
      if (i < title.length) { timer = setTimeout(function () { type(i + 1); }, 75); return; }
      timer = setTimeout(finish, 700);
    }
    // Wait for ET Bembo so the title doesn't reflow mid-animation (capped so a slow font never blocks).
    var fontsReady = document.fonts && document.fonts.load ? document.fonts.load('700 1em "ET Bembo"') : Promise.resolve();
    var fontsOrTimeout = Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 1500); })]);
    fontsOrTimeout.then(function () {
      if (finished) return;
      if (reduce) { out.textContent = title; fillRing(title.length); timer = setTimeout(finish, 600); return; }
      timer = setTimeout(function () { type(1); }, 250);
    });
  })();
</script>
