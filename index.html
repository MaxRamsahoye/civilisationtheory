      var msBox = ms.getBoundingClientRect();
      var root2 = document.documentElement;
      if (root2.classList.contains('page-map') && !root2.classList.contains('hudless') && !root2.classList.contains('loading-hud') &&
          getComputedStyle(ms).display !== 'none' && msBox.bottom > 0) {
        msIn.focus({ preventScroll: true }); msIn.select();
      } else openFind();
    } else if ((e.key === 't' || e.key === 'T') && !e.repeat) {
      document.getElementById('theme-toggle').click();
      var r = document.documentElement;
      r.classList.add('theme-peek');
      clearTimeout(r._peek);
      r._peek = setTimeout(function () { r.classList.remove('theme-peek'); }, 1300);
    } else if ((e.key === 'c' || e.key === 'C') && !e.repeat) {
      // Cycle: off → first accent → second accent (themes that have one) → off
      var root = document.documentElement, state;
      if (!root.classList.contains('accent')) state = 'on';
      else if (!root.classList.contains('accent-alt') && root.getAttribute('data-theme') === 'light') state = 'alt';
      else state = 'off';
      root.classList.toggle('accent', state !== 'off');
      root.classList.toggle('accent-alt', state === 'alt');
    } else if (e.key === '/') {
      e.preventDefault();
      openSearchPage('');
    } else if ((e.key === 'h' || e.key === 'H') && !e.repeat) {
      // Hudless: hide every piece of interface and the tree string, leaving only the page itself.
      setHudless(!document.documentElement.classList.contains('hudless'));
    } else if (e.key === 'Escape' && document.documentElement.classList.contains('hudless')) {
      setHudless(false);
    } else if (document.documentElement.classList.contains('page-map') && !e.repeat && (/^[1-5]$/.test(e.key) || e.key === 'Enter')) {
      // The Map's views: 1–5 in tab order (Enter = 1)
      var vs = ['ab', 'cs', 'rl', 'ce', 'az'], v = vs[e.key === 'Enter' ? 0 : +e.key - 1];
      var btn = document.querySelector('#entry .index-tabs [data-view="' + v + '"]');
      if (btn) { e.preventDefault(); btn.click(); }
    } else if ((e.key === 'a' || e.key === 'A') && !e.repeat) {
      // The Map's topography: hide or show it (for this visit)
      var off = document.documentElement.classList.toggle('topo-off');
    } else if ((e.key === 'm' || e.key === 'M') && !e.repeat) {
      soundOn = !soundOn;
      if (soundOn) chime();
    }
  });

  // ---------- Footer: title, description, menus and shortcuts ----------
  (function buildFooter() {
    var f = document.getElementById('site-footer');
    var concepts = CONCEPTS.filter(isConcept);
    var coined = CONCEPTS.filter(function (c) { return c.coined && c !== ROOT && !c.cpOnly; }).length;
    var sections = childrenOf(ROOT.id);
    var NUM = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
    function group(title, items) { return '<p class="foot-head">' + title + '</p><ul>' + items.join('') + '</ul>'; }
    function li(inner) { return '<li>' + inner + '</li>'; }
    f.innerHTML = '<div class="foot-inner"><div class="foot-main">' +
      '<div class="foot-lede">' +
        '<p class="foot-title"><a href="#the-map">Civilisation Theory Map</a></p>' +
        '<p class="foot-desc">A conceptual adaptive system: a map of the concepts needed to understand civilisation – its mechanics, design, transition and alignment.</p>' +
        '<p class="foot-stats"><span>' + concepts.length + ' Concepts</span> <span>' + coined + ' Conceptual Engineerings</span></p>' +
      '</div>' +
      '<div class="foot-cols"><div class="foot-col">' +
        // Explore: the same icons as the header (map, about, search)
        '<p class="foot-head">Explore</p><nav class="head-icons foot-icons" aria-label="Explore">' +
          document.querySelector('#site-header .head-icons').innerHTML.replace(/ data-page="[^"]*"/g, '') + '</nav>' +
        '</div><div class="foot-col foot-sections"><p class="foot-head">Sections</p><div class="foot-secs">' +
        sectionSets(sections).map(function (set) {
          return '<ul>' + set.map(function (d) {
            // Each opens its section of the Civilisation Research Paradigm on the Map.
            return li('<span class="foot-num">' + NUM[sections.indexOf(d)] + '</span><a href="#the-map" data-view-link="cs" data-section="' + d.id + '">' + esc(d.title) + '</a>');
          }).join('') + '</ul>';
        }).join('') +
      '</div></div></div></div>' +
      '</div>';
    f.addEventListener('click', function (e) {
      var v = e.target.closest('[data-view-link]');
      if (v) {
        var view = v.getAttribute('data-view-link');
        document.documentElement.setAttribute('data-index', view);
        var sec = v.getAttribute('data-section');
        var onMap = document.documentElement.classList.contains('page-map');
        if (onMap) e.preventDefault();
        // Bring the section (or else the tabs) into view – at once when already on the Map, and
        // once the Map has opened otherwise.
        setTimeout(function () {
          var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
          var t = sec ? document.getElementById('nidx-' + sec) : document.querySelector('#entry .index-tabs');
          if (t && document.documentElement.classList.contains('page-map')) window.scrollTo({ top: window.scrollY + t.getBoundingClientRect().top - (sec ? 3 * rem : 40), behavior: 'smooth' });
        }, onMap ? 0 : 700);
      }
    });
  })();

  // Once the footer scrolls into view the sidebar closes and its toggle hides, until the footer
  // is scrolled back out of view.
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      var inView = entries[entries.length - 1].isIntersecting;
      document.body.classList.toggle('footer-in-view', inView);
      if (inView && !document.body.classList.contains('sidebar-closed')) setSidebar(false, false);
    }).observe(document.getElementById('site-footer'));
  }

  // A load or refresh reopens the page in the address; one that names no page opens the Map, the
  // site's front page (and its loading sequence).
  var noLoadIn = document.documentElement.classList.contains('no-loadin');
  if (noLoadIn) {
    var openId = decodeURIComponent(location.hash.replace(/^#/, ''));
    var isView = Object.keys(MAP_VIEWS).some(function (v) { return location.hash === mapViewHref(v); });
    if (!(isView || byId[openId] || PAGES[openId] || openId === ROOT.id) || (openId === 'infinite' && !SHOW_INFINITE)) {
      noLoadIn = false;
      document.documentElement.classList.remove('no-loadin');
      document.documentElement.setAttribute('data-theme', 'midnight');
      document.documentElement.classList.add('awaiting-theme', 'loading-topo', 'loading-hud');
    }
  }
  var keepView = Object.keys(MAP_VIEWS).some(function (v) { return location.hash === mapViewHref(v); });
  // A view opened directly shows the Map's opening, its terrain risen, for a moment before gliding down to it.
  if (noLoadIn && keepView) viewPause = 900;
  if (!noLoadIn && !keepView) history.replaceState(null, '', location.pathname + location.search + '#the-map');
  trail[0].hash = location.hash;   // (the Back trail starts from the page opened)
  // …at its top: the browser is not to restore an earlier scroll position on reload.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  render();

  // ---------- Loading screen ----------
  // 'topo': the Map's topography alone, full-screen, before the page fades in over it.
  // 'typed': (stored away) the title typed out inside a filling ring.
  var LOADER = 'topo';
  // Opened on a page other than the Map: no loading sequence, the page as it is.
  if (noLoadIn) (function () {
    document.getElementById('loader').classList.add('done');
    document.documentElement.classList.add('topo-go');
    if (typeof topo !== 'undefined') topo.start();
  })();
  else if (LOADER === 'topo') (function () {
    var root = document.documentElement, loader = document.getElementById('loader');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finished = false, timer, typing = null, endTyping = null;
    // The title types itself out, letter by letter, as one phrase.
    function typeTitle(done) {
      var h1 = document.querySelector('#entry h1'), text = h1 ? h1.textContent : '', html = h1 ? h1.innerHTML : '';
      if (!h1 || !text || reduce) { done(); return; }
      h1.setAttribute('aria-label', text);
      // One phrase, letter by letter, with a little more time at each space.
      var steps = [];
      text.split('').forEach(function (ch) {
        if (ch === ' ') { steps.push(null); return; }
        var sp = document.createElement('span'); sp.className = 'tw'; sp.setAttribute('aria-hidden', 'true'); sp.textContent = ch;
        steps.push(sp);
      });
      h1.textContent = '';
      steps.forEach(function (sp) { h1.appendChild(sp || document.createTextNode(' ')); });
      var i = 0;
      endTyping = function () {
        endTyping = null; clearTimeout(typing);
        h1.innerHTML = html; h1.removeAttribute('aria-label');
        done();
      };
      (function tick() {
        if (i >= steps.length) { typing = setTimeout(endTyping, 300); return; }
        var step = steps[i++];
        if (step) { step.classList.add('on'); keyClick(); }
        typing = setTimeout(tick, (step ? 85 : 140) + Math.random() * 40);
      })();
    }
    function finish() {
      if (finished) { if (endTyping) endTyping(); return; }   // a second key or click skips the typing
      finished = true;
      clearTimeout(timer);
      loader.classList.add('done');
      root.classList.add('title-typing');
      root.classList.remove('loading-topo');
      typeTitle(reveal);
    }
    function reveal() {
      // Then the subtitle fades in under the typed title; the interface (hidden from the start) follows once they are in;
      // and only once that has settled does the blue of the loading screen give way to the
      // system's theme.
      root.classList.add('topo-reveal', 'flow-late');
      void root.offsetWidth;
      root.classList.remove('title-typing');
      setTimeout(function () { root.classList.remove('loading-hud'); }, 2800);
      setTimeout(function () {
        root.classList.remove('topo-reveal', 'awaiting-theme');
        if (themeChosen) return;
        root.classList.add('theme-shift');
        var t = root.getAttribute('data-theme-after') || 'light';
        root.setAttribute('data-theme', t); setFavicon(t);
        setTimeout(function () { root.classList.remove('theme-shift'); }, 1600);
      }, 4400);
      document.removeEventListener('keydown', skip, true);
      document.removeEventListener('pointerdown', skip, true);
    }
    function skip(e) { e.preventDefault(); e.stopPropagation(); go(); finish(); }
    document.addEventListener('keydown', skip, true);
    document.addEventListener('pointerdown', skip, true);
    // A blank moment first, while the site is built: wait for the fonts, then for the frames to
    // run smoothly (a few in a row on time), so that building the page never slows the terrain.
    // Only then does it fade in and start moving, and the loading screen's time begins.
    var going = false;
    function go() {
      if (going) return;
      going = true;
      root.classList.add('topo-go');
      if (typeof topo !== 'undefined') topo.start();
    }
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () {
      var calm = 0, prev = 0, begun = performance.now();
      (function watch(now) {
        if (finished) return;
        if (prev && now - prev < 24) calm++; else calm = 0;
        prev = now;
        if (calm >= 6 || now - begun > 1500) { go(); timer = setTimeout(finish, reduce ? 700 : 3600); return; }
        requestAnimationFrame(watch);
      })(performance.now());
    });
  })();
  else (function () {
    document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme-after') || 'light');
    document.documentElement.classList.remove('loading-topo', 'loading-hud', 'awaiting-theme');
    document.documentElement.classList.add('topo-go'); if (typeof topo !== 'undefined') topo.start();
    var loader = document.getElementById('loader');
    var out = document.getElementById('loader-text');
    var title = 'Civilisational';
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finished = false, timer;
    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      out.textContent = title;
      fillRing(title.length);
      loader.classList.add('done');
      document.removeEventListener('keydown', skip, true);
      document.removeEventListener('pointerdown', skip, true);
    }
    function skip(e) { e.preventDefault(); e.stopPropagation(); finish(); }
    document.addEventListener('keydown', skip, true);
    document.addEventListener('pointerdown', skip, true);

    var ring = document.getElementById('loader-fill');
    // Keep the ring's line about 1.4px thick whatever its (very large) size.
    var ringSvg = document.querySelector('.loader-ring');
    function ringStroke() {
      var w = ringSvg.getBoundingClientRect().width || 1;
      ringSvg.querySelectorAll('circle').forEach(function (c) { c.style.strokeWidth = String(1.4 * 400 / w); });
    }
    ringStroke();
    window.addEventListener('resize', ringStroke);
    var RING_C = 2 * Math.PI * 180;
    function fillRing(i) {
      ring.style.strokeDashoffset = String(RING_C * (1 - i / title.length));
      // Once complete, draw a solid circle so no seam or gap can remain at the join.
      if (i >= title.length) setTimeout(function () { ring.style.strokeDasharray = 'none'; }, 80);
    }
    function type(i) {
      out.textContent = title.slice(0, i);
      fillRing(i);
      if (i < title.length) { timer = setTimeout(function () { type(i + 1); }, 75); return; }
      timer = setTimeout(finish, 700);
    }
    // Wait for ET Bembo so the title doesn't reflow mid-animation (capped so a slow font never blocks).
    var fontsReady = document.fonts && document.fonts.load ? document.fonts.load('700 1em "ET Bembo"') : Promise.resolve();
    var fontsOrTimeout = Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 1500); })]);
    fontsOrTimeout.then(function () {
      if (finished) return;
      if (reduce) { out.textContent = title; fillRing(title.length); timer = setTimeout(finish, 600); return; }
      timer = setTimeout(function () { type(1); }, 250);
    });
  })();
</script>
</body>
</html>
